# The quality gate, run by the same `just check` a developer runs locally.
# Nothing about the gate is spelled out here on purpose: if CI and the justfile
# can disagree, they eventually will, and the disagreement is only ever found
# on `main`. This file's whole job is to put a Linux machine in front of that
# one command.
name: check

# **Manual only** (Björn, 2026-09-05). This ran on every pull request and every
# push to `main` until then, which is a full Rust + Svelte build on a billed
# runner per commit; the automatic triggers were the whole cost. Nothing about
# the gate itself changed -- it is still the same `just check`, and
# `working-model.md` review-economics rule 4 still says a person runs it
# locally. Dispatch this when a *Linux* opinion is specifically wanted, which is
# the one thing a local run on a Mac cannot give (that rule's "Platform" point).
#
# There is no `concurrency:` block any more either: it existed so a PR's later
# push would supersede its earlier one, and a run somebody started by hand has
# nothing to supersede.
on:
  workflow_dispatch:

# Read-only: the gate builds and tests, it never writes to the repository. The
# GITHUB_TOKEN handed to the `just check` step below inherits this, so the
# worst a compromised build script can do with it is read what is already
# public.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The gate compiles a workspace, a Svelte app and a Tauri shell, and runs
    # tests against a real PostgreSQL it may have to download first: a cold run
    # is minutes, not seconds. What this bounds is the run that is not slow but
    # *stuck* -- a test waiting on a server that never came up, an advisory
    # lock nobody releases -- which would otherwise sit on GitHub's own 6-hour
    # default, holding the queue and hiding the failure.
    timeout-minutes: 30
    steps:
      # The three `actions/*` pins below were bumped off `@v4` together, and
      # `@v4` is the only thing they had in common: the deprecation annotation
      # this discharges named exactly these three and no others --
      #
      #   "Node.js 20 is deprecated. The following actions target Node.js 20
      #    but are being forced to run on Node.js 24: actions/cache@v4,
      #    actions/checkout@v4, actions/setup-node@v4."
      #
      # -- and the other three actions in this file were already clear:
      # dtolnay/rust-toolchain and taiki-e/install-action are `composite`
      # (no Node runtime at all) and Swatinem/rust-cache@v2 is already node24.
      # That was read out of each action.yml's `runs.using`, which is the
      # thing the annotation is actually about; a version number is only a
      # proxy for it.
      #
      # Each is pinned to its latest stable major rather than to the lowest
      # one that clears node20, so this is one bump rather than two. Every
      # input used below was checked to still exist in the target major, and
      # the majors' breaking changes were read: setup-node v5 added automatic
      # package-manager caching and v6 narrowed it to npm, which cannot reach
      # us -- there is no root package.json and no `packageManager` field, and
      # the step below sets `cache: npm` explicitly anyway.
      #
      # The real proof is not any of that reasoning: it is this workflow's own
      # run coming back green with no Node-20 annotation on it.
      - uses: actions/checkout@v7
      # A stock ubuntu-latest runner has ~14 GB free, and this workspace's test
      # binaries plus an embedded PostgreSQL data directory exceed it. These
      # toolchains are not used by any job step.
      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # `cargo test` compiles knobas-app, which links webkit2gtk through
      # tauri/wry; none of it is on the runner image. This is the development
      # subset of Tauri's documented Linux prerequisites -- the packages the
      # `-sys` build scripts pkg-config for. The bundling-only ones
      # (librsvg2-dev and friends) are left out: `tauri build` never runs here.
      # build-essential, curl, wget, file and libssl-dev are already installed
      # on ubuntu-latest.
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      # `rust-toolchain.toml` is the single toolchain knob for this repo -- it
      # is what `cargo` obeys, both here and on a developer's machine, and the
      # justfile strips any inherited RUSTUP_TOOLCHAIN so nothing can quietly
      # shadow it. The channel is read out of that file rather than written
      # again here so CI cannot end up gating on a compiler nobody uses.
      - id: toolchain
        name: Read the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # Installs that channel up front (with a `--profile minimal` install's
      # missing components) instead of leaving rustup to fetch it mid-build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@just

      # `hashFiles` returns the empty string when its pattern matches nothing,
      # and the cache step below would take that quietly: the key collapses to
      # the constant `postgres--linux`, which then hits forever and can never
      # be invalidated by anything. Renaming or moving `embedded.rs` is exactly
      # how that happens, and it is invisible -- the cache still works, it just
      # stops tracking the thing it is keyed on. Fail here instead.
      - name: Check the postgres cache key resolved
        env:
          hash: ${{ hashFiles('crates/knobas-db/src/embedded.rs') }}
        run: |
          if [ -z "$hash" ]; then
            echo "::error::hashFiles matched no crates/knobas-db/src/embedded.rs, so the ~/.theseus cache key would be the constant 'postgres--linux'. Repoint the key below (and this guard) at wherever PG_VERSION_REQ lives now."
            exit 1
          fi

      # The embedded PostgreSQL the database tests run against is downloaded on
      # first use into `~/.theseus`, which Swatinem/rust-cache does not cover.
      #
      # The key is derived from the file that pins the version
      # (`PG_VERSION_REQ` in `knobas-db`'s `embedded.rs`) rather than spelling
      # `18.6.0` out here. Neither direction can serve the *wrong* Postgres:
      # the install directory is itself version-keyed
      # (`~/.theseus/postgresql/<version>`) and `setup()` re-validates it, so a
      # stale cache simply does not contain the version being asked for. What
      # the two directions cost is download time.
      #
      # Over-invalidating (this key) costs one 13 MB re-download whenever
      # anything in `embedded.rs` changes, cache included. Under-invalidating
      # -- a hand-written `postgres-18.6.0-linux` left un-renamed across a
      # version bump -- costs that download on *every run, forever*: the key
      # keeps hitting, so `actions/cache` restores the old version and, because
      # an exact-key hit skips the save, never stores the new one. A wasted
      # download now beats a permanent one.
      - uses: actions/cache@v6
        with:
          path: ~/.theseus
          key: postgres-${{ hashFiles('crates/knobas-db/src/embedded.rs') }}-linux

      # `just check` provisions `app/node_modules` itself (the `deps` recipe),
      # so there is no `npm ci` step -- setup-node above is here for the node
      # version and the npm download cache.
      #
      # GITHUB_TOKEN is for postgresql_embedded, not for anything git: on a
      # cache miss it asks api.github.com which release asset to fetch, and
      # unauthenticated requests from a shared runner IP share a 60/hour budget
      # with every other repository on that machine.
      - name: just check
        run: just check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
