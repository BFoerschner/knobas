# The docker test environment's own gate.
#
# `just check` compiles and tests Rust; it cannot see a shell script with a
# quoting bug or a compose file whose port map has drifted away from the
# interfaces doc §5 table that six streams read. This workflow covers exactly
# that gap, and nothing else.
#
# It starts no product containers and pulls no product images -- roadmap §3:
# CI runs only the docker-free layers. (The one image it runs is the pinned
# shellcheck, below.) `docker compose config` resolves ${...} from testenv/images.env
# and validates the schema locally; it never contacts a registry. That matters
# beyond speed: the TeamCity, Jira and Confluence images this file references
# are ~13 GB and are deliberately never pulled anywhere, CI included.
name: testenv

# **Manual only** (Björn, 2026-09-05), the same rule as check.yml and for the
# same reason. This one used to fire on any `testenv/**` change; dispatch it by
# hand after touching a compose file or a seed script. It is the cheap half of
# the pair -- no product containers, one small image -- but it is still a
# billed runner, and "manual only" is now the rule for every workflow in this
# directory rather than a judgement call per file.
#
# The `concurrency:` block went with the triggers: it made a PR's later push
# supersede its earlier one, and a hand-started run has nothing to supersede.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Seconds of work. This bounds the run that is stuck rather than slow --
    # a `docker compose` that decided to talk to a registry, say.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scripts are linted by `just shell`, the recipe `just check` runs,
      # and not by a copy of it (#2036). This step used to repeat the
      # recipe's shebang discovery and call whatever shellcheck the runner
      # image ships: 0.9.0 on ubuntu-24.04, against the 0.11.0 the recipe
      # pins, so the two gates disagreed about what an info is. The recipe
      # runs the pinned version, as the `koalaman/shellcheck` image when the
      # runner's own binary is another version; that small image is the one
      # this workflow pulls. The discovery and its empty guard are the
      # recipe's, with the reasoning beside them in the justfile.
      - uses: taiki-e/install-action@40895b01b2f2cea6a044171e57070a91013b8dd3 # just (the tool tag; no release tag shares this commit)
      - name: shellcheck every script in testenv/ and scripts/
        run: just shell

      # Schema validation of the compose file, for the default profile and for
      # each opt-in one. A profile is only resolved when it is selected, so a
      # broken `real-teamcity` service is invisible to a bare `config -q` --
      # and that profile is precisely the one nobody runs locally, because
      # running it means pulling ~10 GB.
      - name: validate the compose file, default, opt-in profiles and the capped overlay
        working-directory: testenv
        run: |
          docker compose --env-file images.env config -q
          docker compose --env-file images.env --profile seed \
                         --profile real-teamcity \
                         --profile real-atlassian config -q
          docker compose --env-file images.env -f docker-compose.yml -f docker-compose.capped.yml config -q

      # The port map itself. `config -q` is happy with any port at all, so it
      # cannot see 8111 becoming 8299, a service published on 0.0.0.0 instead
      # of 127.0.0.1, or a port leaking into the default set. check-ports.sh
      # reads the *resolved* model and asserts the §5 table; it was built with
      # five mutants, each of which it kills.
      #
      # `jq` and `docker compose` are both preinstalled on ubuntu-latest.
      - name: assert the published ports against interfaces §5
        run: ./testenv/check-ports.sh
