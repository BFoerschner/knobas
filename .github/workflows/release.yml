# The release build: a macOS `.dmg` and a Windows `.exe`/`.msi` for one tag.
#
# This is the only workflow that runs while `check` and `testenv` stay
# `disabled_manually` (the 2026-08-29 billing decision, `working-model.md`
# review-economics rule 4). It does not gate anything and it is not a backstop:
# the gate is still a local `just check`. Its whole job is to put a macOS and a
# Windows machine in front of `tauri build`, because this one is a Mac and
# cross-compiling a Tauri app to Windows is a port, not a build step.
#
# **Minutes are the design constraint.** On a private repository GitHub bills
# macOS minutes at 10x and Windows at 2x, so one cold run of both legs costs a
# few hundred minutes of the account's monthly allowance.
#
# So there is **no automatic trigger at all** (Björn, 2026-09-05: manual only,
# the rule for every workflow in this directory). It ran on a `v*` tag until
# then, which was already the cheapest automatic trigger available -- but a tag
# push is easy to make by accident, and this is the one workflow that spends
# 10x-billed minutes. Tag first, then dispatch the tag by name:
#
#     git tag -a v0.2.0 -m ... && git push origin v0.2.0
#     gh workflow run release.yml --ref main -f tag=v0.2.0 -f platforms=both
#
# `platforms` is what makes iterating affordable: a Windows fix re-runs the
# Windows leg alone rather than re-buying a macOS bundle that already exists.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build from and upload into, e.g. v0.1.0
        required: true
        type: string
      platforms:
        description: Which bundles to build
        required: true
        default: both
        type: choice
        options: [both, macos, windows]

# The bundle jobs upload assets to the release the `draft` job creates, which
# `contents: read` cannot do. Nothing else here writes.
permissions:
  contents: write

# Two runs for the same tag are the same release; the later one wins.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  # One job resolves what is being built and creates the release, then the
  # bundle legs upload into it. Letting the legs create-or-reuse the release
  # themselves is a race: they start together, both see no release, and both
  # create one.
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # `github.ref_name` is the *branch* this was dispatched from, never the
      # tag; the tag is only ever `inputs.tag`. Everything downstream reads this
      # step's output rather than reaching for the ref again.
      - id: plan
        name: Resolve the tag and the platforms
        run: |
          tag='${{ inputs.tag }}'
          case "$tag" in
            v*) ;;
            *) echo "::error::'$tag' is not a v-prefixed release tag."; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          case '${{ inputs.platforms }}' in
            macos)   os='["macos-latest"]' ;;
            windows) os='["windows-latest"]' ;;
            *)       os='["macos-latest", "windows-latest"]' ;;
          esac
          echo "matrix={\"os\": $os}" >> "$GITHUB_OUTPUT"

      # The tag, not the default branch: a manual re-run must build the code the
      # release is of, not whatever `main` has drifted to since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.tag }}

      # `tauri.conf.json`'s `version` is what ends up in the bundle filenames
      # and in the installed app's About box, and the tag is what a person
      # reads. A release whose tag says v0.2.0 and whose dmg says 0.1.0 is a
      # support question forever, so disagree here instead -- before anything
      # has been built, and before any minutes are spent.
      - name: The tag and the manifest must agree
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          want="${TAG#v}"
          conf=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' crates/knobas-app/tauri.conf.json)
          test -n "$conf"
          if [ "$want" != "$conf" ]; then
            echo "::error::tag $TAG is version '$want', but crates/knobas-app/tauri.conf.json says '$conf'. Bump the manifest (and the workspace Cargo.toml) or move the tag."
            exit 1
          fi

      # Draft, not published: the assets arrive over the next several minutes
      # from two jobs that can fail independently, and a published release that
      # is missing its Windows half is worse than one nobody can see yet.
      # Publishing is a click once both halves are attached.
      #
      # `--verify-tag` is why a typo'd tag cannot conjure a release out of a ref
      # that does not exist.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; the bundle jobs will upload into it"
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "knobas $TAG" \
            --notes "$(cat <<'NOTES'
          Built by `.github/workflows/release.yml` from the tag.

          **Neither bundle is signed.** knobas has no Apple Developer ID and no
          Windows code-signing certificate, so both operating systems will
          refuse the download on sight:

          - **macOS** — Gatekeeper says the app "is damaged and can't be
            opened". It is not damaged; that is the message for an unsigned,
            un-notarized bundle that carries a quarantine flag. Clear it:
            `xattr -dr com.apple.quarantine /Applications/knobas.app`
          - **Windows** — SmartScreen shows "Windows protected your PC".
            *More info* → *Run anyway*.

          The macOS bundle is **arm64 only** (Apple Silicon).
          NOTES
          )"

  bundle:
    needs: draft
    strategy:
      # A Windows compile failure must not take the macOS dmg down with it.
      # This is the first time knobas has been built for Windows at all -- the
      # keyring store, the notifier and the embedded-Postgres downloader each
      # have a Windows path no machine has yet compiled -- so the asymmetric
      # outcome is the expected one for a while.
      fail-fast: false
      matrix: ${{ fromJSON(needs.draft.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # A cold macOS run compiles the workspace and downloads two bundler
    # toolchains. What this bounds is the run that is stuck rather than slow,
    # which would otherwise sit on GitHub's 6-hour default -- at 10x billing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.tag }}

      # Same reasoning as `check.yml`: `rust-toolchain.toml` is the single
      # toolchain knob, read rather than restated, so a release can never be
      # built by a compiler nobody develops against. cargo would honor the file
      # on its own; installing up front keeps the fetch out of the build's
      # timing and its logs.
      - id: toolchain
        name: Read the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Both matrix legs are the same job id, so name the runner in the key
          # explicitly rather than trusting the default key's composition to
          # separate them: a macOS leg restoring a Windows `target/` is a
          # confusing failure to read, and this costs one string.
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `tauri build` runs `npm run build` itself (tauri.conf.json's
      # `beforeBuildCommand`), but nothing installs the modules that command and
      # the Tauri CLI both live in. `just deps` is what does this locally.
      - name: Install the frontend's dependencies
        shell: bash
        run: cd app && npm ci

      # The Tauri CLI is a devDependency of `app/` and has to run from the crate
      # that owns `tauri.conf.json`. `just dev` bridges that by putting
      # `app/node_modules/.bin` on PATH; **do not copy that here.** This
      # workflow's first run died on it:
      #
      #   Error: Cannot find module
      #   'A:\knobas\knobas\app\node_modules\@tauri-apps\cli\tauri.js'
      #
      # `$GITHUB_WORKSPACE` on a Windows runner is `D:\a\knobas\knobas`, and a
      # Windows path put through a bash string loses its backslashes -- `D:\a`
      # arrived as `A:`. `:` is not the PATH separator there either. Calling the
      # CLI's entry point on a *relative* path has neither a drive letter nor a
      # separator in it, so the one line serves both runners.
      - name: tauri build
        shell: bash
        run: |
          cd crates/knobas-app
          node ../../app/node_modules/@tauri-apps/cli/tauri.js build

      # A `gh release upload` given a glob that matched nothing succeeds,
      # silently, and the release is short an installer nobody notices until
      # they go looking for it. Resolve the globs first and refuse an empty
      # match -- the same guard `check.yml` puts on its cache key, for the same
      # reason: the failure mode is a green run that did not do the work.
      #
      # `"targets": "all"` in tauri.conf.json is what decides this list: dmg on
      # macOS, and both installers on Windows -- NSIS (`-setup.exe`) and WiX
      # (`.msi`), whose toolchains the Tauri CLI downloads itself.
      - name: Upload the bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          shopt -s nullglob
          case "$RUNNER_OS" in
            macOS)   files=(target/release/bundle/dmg/*.dmg) ;;
            Windows) files=(target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi) ;;
            *)       echo "::error::no artifact patterns for $RUNNER_OS"; exit 1 ;;
          esac
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::tauri build produced no bundle matching the patterns for $RUNNER_OS. What it did produce:"
            find target/release/bundle -maxdepth 2 -type f 2>/dev/null || echo "  (no target/release/bundle at all)"
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
