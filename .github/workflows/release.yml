# The release build: a macOS `.dmg` and a Windows `.exe`/`.msi` for one tag.
#
# This is the only workflow that runs while `check` and `testenv` stay
# `disabled_manually` (the 2026-08-29 billing decision, `working-model.md`
# review-economics rule 4). It does not gate anything and it is not a backstop:
# the gate is still a local `just check`. Its whole job is to put a macOS and a
# Windows machine in front of `tauri build`, because this one is a Mac and
# cross-compiling a Tauri app to Windows is a port, not a build step.
#
# **Tags only, on purpose.** On a private repository GitHub bills macOS minutes
# at 10x and Windows at 2x, so a single cold run of the matrix below costs a few
# hundred minutes of the account's monthly allowance. A `push:` or
# `pull_request:` trigger here would spend that on every commit. Re-running a
# failed release is the "Re-run jobs" button on the run, which needs no new tag.
name: release

on:
  push:
    tags: ['v*']

# The bundle jobs upload assets to the release the `draft` job creates, which
# `contents: read` cannot do. Nothing else here writes.
permissions:
  contents: write

# Two pushes of the same tag are the same release; the later one wins.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job creates the release, then both bundlers upload into it. Letting the
  # matrix jobs each create-or-reuse it instead is a race: they start together,
  # both see no release, and both create one.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `tauri.conf.json`'s `version` is what ends up in the bundle filenames
      # and in the installed app's About box, and the tag is what a person
      # reads. A release whose tag says v0.2.0 and whose dmg says 0.1.0 is a
      # support question forever, so disagree here instead -- before anything
      # has been built, and before any minutes are spent.
      - name: The tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' crates/knobas-app/tauri.conf.json)
          test -n "$conf"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is version '$tag', but crates/knobas-app/tauri.conf.json says '$conf'. Bump the manifest (and the workspace Cargo.toml) or move the tag."
            exit 1
          fi

      # Draft, not published: the assets arrive over the next several minutes
      # from two jobs that can fail independently, and a published release that
      # is missing its Windows half is worse than one nobody can see yet.
      # Publishing is a click once both halves are attached.
      #
      # `--verify-tag` is why a typo'd tag cannot conjure a release out of a ref
      # that does not exist.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; the bundle jobs will upload into it"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "knobas $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          Built by `.github/workflows/release.yml` from the tag.

          **Neither bundle is signed.** knobas has no Apple Developer ID and no
          Windows code-signing certificate, so both operating systems will
          refuse the download on sight:

          - **macOS** — Gatekeeper says the app "is damaged and can't be
            opened". It is not damaged; that is the message for an unsigned,
            un-notarized bundle that carries a quarantine flag. Clear it:
            `xattr -dr com.apple.quarantine /Applications/knobas.app`
          - **Windows** — SmartScreen shows "Windows protected your PC".
            *More info* → *Run anyway*.

          The macOS bundle is **arm64 only** (Apple Silicon).
          NOTES
          )"

  bundle:
    needs: draft
    strategy:
      # A Windows compile failure must not take the macOS dmg down with it.
      # This is the first time knobas has ever been built for Windows -- the
      # keyring store, the notifier and the embedded-Postgres downloader all
      # have Windows paths that no machine has yet compiled -- so the asymmetric
      # outcome is the expected one for a while.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # macos-latest is Apple Silicon, which is what knobas is developed
            # on. A universal binary would also cover Intel Macs, at the cost of
            # a second full compile per run; add `--target
            # universal-apple-darwin` (and the x86_64 rustup target) if one ever
            # needs to run it.
            artifacts: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            # `"targets": "all"` in tauri.conf.json means both installers get
            # built: NSIS (`-setup.exe`) and WiX (`.msi`). The Tauri CLI
            # downloads both toolchains itself; neither is on the runner image.
            artifacts: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    # A cold macOS run compiles the workspace and downloads two bundler
    # toolchains. What this bounds is the run that is stuck rather than slow,
    # which would otherwise sit on GitHub's 6-hour default -- at 10x billing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Same reasoning as `check.yml`: `rust-toolchain.toml` is the single
      # toolchain knob, read rather than restated, so a release can never be
      # built by a compiler nobody develops against. cargo would honor the file
      # on its own; installing up front keeps the fetch out of the build's
      # timing and its logs.
      - id: toolchain
        name: Read the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Both matrix legs are the same job id, so name the runner in the key
          # explicitly rather than trusting the default key's composition to
          # separate them: a macOS leg restoring a Windows `target/` is a
          # confusing failure to read, and this costs one string.
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `tauri build` runs `npm run build` itself (tauri.conf.json's
      # `beforeBuildCommand`), but nothing installs the modules that command and
      # the Tauri CLI both live in. `just deps` is what does this locally; it is
      # spelled out here instead because the justfile's recipes build a PATH
      # with `:` and assume a POSIX shell, neither of which survives a Windows
      # runner.
      - name: Install the frontend's dependencies
        shell: bash
        run: cd app && npm ci

      # The Tauri CLI is a devDependency of `app/` and has to run from the crate
      # that owns `tauri.conf.json` -- the same split `just dev` works around,
      # and the same way it does it. `shell: bash` is what makes one line serve
      # both runners: npm writes a POSIX wrapper next to the `.cmd` one, and
      # Git Bash is on the Windows image.
      - name: tauri build
        shell: bash
        run: |
          cd crates/knobas-app
          PATH="$GITHUB_WORKSPACE/app/node_modules/.bin:$PATH" tauri build

      # A `gh release upload` given a glob that matched nothing succeeds,
      # silently, and the release is short an installer nobody notices until
      # they go looking for it. Resolve the globs first and refuse an empty
      # match -- the same guard `check.yml` puts on its cache key, for the same
      # reason: the failure mode is a green run that did not do the work.
      - name: Upload the bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          while read -r pattern; do
            [ -n "$pattern" ] || continue
            files+=($pattern)
          done <<< "${{ matrix.artifacts }}"
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::tauri build produced no bundle matching the patterns for ${{ matrix.os }}. What it did produce:"
            find target/release/bundle -maxdepth 2 -type f 2>/dev/null || echo "  (no target/release/bundle at all)"
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
