# Memory caps for a REMOTE target (testenv/live.env, KNOBAS_LIVE_TARGET=remote),
# where the products stay up together on a box with 16 GB of physical memory
# and WSL gets about 10 of it. live-lib.sh layers this over docker-compose.yml
# through COMPOSE_FILE, for every compose call a remote run makes. Never on
# the local target: that VM runs one JVM product at a time, uncapped.
#
# A hard cap per container (`mem_limit`), so a JVM that grows takes out its
# own container, not the whole VM: unbounded, a third JVM pushes WSL into
# swap and the box stops answering ssh. The JVM heaps are pinned under each
# cap with room for metaspace, threads and code cache. live-lib.sh's memory
# budget adds the same numbers (KNOBAS_LIVE_*_MB, exported with these
# defaults) to decide which products fit at once; change one, and both move.
#
# It changes memory and nothing else -- check-ports.sh asserts the port map
# through this overlay is the default one.
services:
  gitea:
    mem_limit: ${KNOBAS_LIVE_GITEA_MB:-512}m
  forgejo:
    mem_limit: ${KNOBAS_LIVE_GITEA_MB:-512}m
  teamcity:
    mem_limit: ${KNOBAS_LIVE_TEAMCITY_MB:-2560}m
    environment:
      TEAMCITY_SERVER_MEM_OPTS: "-Xmx1536m -XX:ReservedCodeCacheSize=256m"
  teamcity-agent:
    mem_limit: ${KNOBAS_LIVE_TEAMCITY_AGENT_MB:-1024}m
  jira:
    mem_limit: ${KNOBAS_LIVE_JIRA_MB:-3584}m
    environment:
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 2048m
  jira-db:
    mem_limit: ${KNOBAS_LIVE_DB_MB:-512}m
  confluence:
    mem_limit: ${KNOBAS_LIVE_CONFLUENCE_MB:-2560}m
    environment:
      JVM_MINIMUM_MEMORY: 512m
      JVM_MAXIMUM_MEMORY: 1024m
  confluence-db:
    mem_limit: ${KNOBAS_LIVE_DB_MB:-512}m
