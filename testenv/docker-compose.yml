# The knobas test environment: a small fake company that a developer can bring
# up on a laptop.
#
# Two kinds of service live here, and the difference is the point:
#
#   * REAL products we can self-host -- Gitea and Uptime Kuma v2. The adapters
#     for these are certified against the actual software, not against a mock.
#   * mockd, our own faithful mock of the products we cannot self-host cheaply
#     (Jira Data Center, TeamCity). It serves the same Tidewater Freight
#     fixture, so both layers tell one story (design §14a).
#
# The opt-in profiles bring up the real Jira, Confluence and TeamCity servers
# for whole-product fidelity checks. They are off by default because they are
# expensive: see the cost note in .env, and the profile comments below.
#
# Everything binds 127.0.0.1 only. This environment has developer-grade
# credentials in it (knobas/knobas-dev) and must never be reachable off-host.
#
# Ports are fixed by the M1 interfaces doc §5; testenv/check-ports.sh asserts
# this file against that map and CI runs it.

name: knobas-testenv

services:
  # ---------------------------------------------------------------- real ----
  gitea:
    image: ${GITEA_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    container_name: knobas-gitea
    environment:
      # INSTALL_LOCK skips the first-run web installer, which is otherwise a
      # human step and would make `./seed` unrunnable on a fresh volume.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://127.0.0.1:3000/
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      # M1 clones nothing and pushes over HTTP only, so no SSH port is
      # published and the SSH server is off rather than listening unused.
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      # The seed creates its users through the admin API; self-service sign-up
      # would only be another way in.
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      # Gitea's own default, PINNED rather than left implicit, and the reason is
      # that Gitea's environment-to-ini only ever *writes* /data/gitea/conf/
      # app.ini -- it never removes a setting from it. `docker-compose.capped.yml`
      # lowers this to 1, and app.ini keeps that value in the gitea-data volume,
      # so a plain `docker compose up` afterwards comes back on a container with
      # no such variable and a still-capped server. (Measured, not assumed: the
      # container is recreated, `docker inspect` shows no MAX_RESPONSE_ITEMS, and
      # app.ini still reads `MAX_RESPONSE_ITEMS = 1`.) Naming the default here is
      # what puts it back, for `just gitea-live` and for anyone who ran the
      # capped overlay once and never thought about it again.
      #
      # 50 is also `knobas_source_gitea::client::PAGE_SIZE`, the `limit` every
      # listing in that adapter asks for.
      GITEA__api__MAX_RESPONSE_ITEMS: "50"
      GITEA__log__LEVEL: warn
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      # /api/healthz is Gitea's own readiness endpoint and reports the database
      # too, so a healthy gitea here means the seed's very first POST will work.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  uptime-kuma:
    image: ${KUMA_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    container_name: knobas-uptime-kuma
    environment:
      # WITHOUT THIS, `docker compose up` GIVES YOU A KUMA THAT NEVER STARTS.
      # Uptime Kuma v2 added a database-choice step that runs BEFORE the real
      # server: it logs "Starting Setup Database ... Waiting for user action"
      # and serves an entirely different express app on 3001 until a human
      # picks a backend in a browser. Setting the type here supplies that
      # answer, `Database.writeDBConfig` persists it, and the real server
      # starts unattended. (Verified on the pinned image, 2.5.3.)
      UPTIME_KUMA_DB_TYPE: sqlite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data
    healthcheck:
      # NOT `curl /`. The setup-database app above answers `/` with a 302 to
      # its own wizard, so a check on `/` reports HEALTHY for a Kuma that has
      # no socket.io server at all -- which is how this environment first came
      # up "green" with a Kuma nothing could seed. The engine.io handshake is
      # the real server's own signal and is the exact channel the seed uses:
      # it returns `0{"sid":...}` there and the wizard's HTML here.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:3001/socket.io/?EIO=4&transport=polling' | grep -q '\"sid\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- mock ----
  mockd:
    build:
      # The repo root: build.rs needs testenv/specs/, knobas-source-mock needs
      # fixtures/. See the header of mockd.Dockerfile.
      context: ..
      dockerfile: testenv/mockd.Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    container_name: knobas-mockd
    environment:
      # Scheme and host ONLY -- mockd appends each API's own port, so this
      # yields http://127.0.0.1:8210 for Jira and http://127.0.0.1:8212 for
      # TeamCity. Writing the port here would produce `...:8210:8210`.
      #
      # 127.0.0.1 rather than the container name because the consumer of these
      # `self`/`webUrl` links is an adapter running on the HOST.
      MOCKD_PUBLIC_BASE_URL: http://127.0.0.1
    ports:
      - "127.0.0.1:8200:8200"   # health + /__mock/* admin API
      - "127.0.0.1:8210:8210"   # Jira Data Center REST v2
      - "127.0.0.1:8212:8212"   # TeamCity REST
      # 8211 (Confluence DC mock, M3) and 8213 (Flowrun stub, M4) are RESERVED
      # by interfaces §5. They are bound by nothing, here or in the binary, and
      # check-ports.sh fails if that ever changes by accident.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/__mock/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------- seed ----
  kuma-seed:
    # A one-shot, not a service: `profiles` keeps it out of `up`, and
    # seed-kuma.sh runs it with `compose run --rm`. Kuma v2 has no REST API for
    # configuration (roadmap §4 gotcha 6) -- setup, login, monitor creation and
    # API-key creation are all socket.io -- which is why this is node and not
    # curl.
    image: ${NODE_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    profiles: ["seed"]
    depends_on:
      uptime-kuma:
        condition: service_healthy
    environment:
      KUMA_URL: http://uptime-kuma:3001
      KUMA_USER: knobas
      KUMA_PASS: knobas-dev
    volumes:
      # READ-ONLY on purpose. The API key comes back on the container's stdout
      # and seed-kuma.sh writes it host-side, so nothing in this repo is ever
      # written by a container (which on Linux would leave root-owned files).
      - ./:/seed:ro
    # The only step in the whole environment that needs network access at seed
    # time; noted in README.md.
    #
    # The script is COPIED to /tmp/k next to its node_modules rather than run
    # from the read-only /seed mount. ESM ignores NODE_PATH -- an `import` from
    # /seed/kuma-seed.mjs resolves against /seed/node_modules and /node_modules
    # and nowhere else, so the obvious `NODE_PATH=... node /seed/kuma-seed.mjs`
    # fails with ERR_MODULE_NOT_FOUND. Copying puts the script in the directory
    # whose node_modules npm just populated. monitors.json travels with it
    # because the script resolves it relative to import.meta.url.
    command: >
      sh -c "mkdir -p /tmp/k &&
             cp /seed/kuma-seed.mjs /seed/monitors.json /tmp/k/ &&
             npm --prefix /tmp/k i --no-save --silent socket.io-client@4 &&
             node /tmp/k/kuma-seed.mjs"

  # ------------------------------------------------------ opt-in: real -----
  teamcity:
    # ~2.5 GB to pull, ~10 GB on disk with its data directory, and its first
    # start is a browser wizard (database, licence, admin account) that no
    # script can drive. Off by default for all three reasons; this is also the
    # container `testenv/specs/fetch.sh --teamcity` needs to extract
    # /app/rest/swagger.json (see specs/README.md's blocker).
    #   docker compose --profile real-teamcity up -d teamcity
    image: ${TEAMCITY_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    profiles: ["real-teamcity"]
    container_name: knobas-teamcity
    ports:
      - "127.0.0.1:8111:8111"
    volumes:
      - tc-data:/data/teamcity_server/datadir
      - tc-logs:/opt/teamcity/logs

  # The two Atlassian products need a real database beside them: Jira 10.0
  # removed the embedded H2 engine outright ("you'll no longer be able to
  # evaluate Jira 10.0 using the H2 embedded database"), so without this the
  # setup wizard stops at its database step and `real-atlassian` cannot be
  # brought up at all -- by a script or by hand. One server per product rather
  # than one shared: `down -v` on either has to be a clean slate for that
  # product's re-setup, which a shared server would make a cross-product
  # action.
  # PostgreSQL 15 specifically: Atlassian's compatibility matrix supports 15
  # for Jira 10.3, allows 16 only from 10.3.7, deprecates 12-14, and does
  # **not** support 17 -- which is the version this machine happens to cache,
  # which is why the choice is written down rather than left to whoever looks
  # at `docker images` next.
  jira-db:
    image: ${ATLASSIAN_DB_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    profiles: ["real-atlassian"]
    container_name: knobas-jira-db
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
      # Jira refuses a database whose collation is not C or POSIX-compatible;
      # the alpine image's default locale would otherwise be inherited.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - jira-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira"]
      interval: 5s
      timeout: 5s
      retries: 30

  confluence-db:
    image: ${ATLASSIAN_DB_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    profiles: ["real-atlassian"]
    container_name: knobas-confluence-db
    environment:
      POSTGRES_DB: confluence
      POSTGRES_USER: confluence
      POSTGRES_PASSWORD: confluence
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - confluence-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confluence"]
      interval: 5s
      timeout: 5s
      retries: 30

  jira:
    # Wants ~4 GB of RAM and a timebomb licence entered by hand.
    #   docker compose --profile real-atlassian up -d jira
    # Jira has NO licence environment variable: paste the *Jira Software Data
    # Center* timebomb key (10 user, 3 hours) into the setup wizard. When it
    # expires, re-paste at Administration > System > License
    # (/secure/admin/ViewLicense.jspa) -- no restart, no account.
    # The tag is 10.3 LTS rather than the newest release because 11.x is
    # reported to reject that key; pin-images.sh carries the evidence.
    image: ${JIRA_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    profiles: ["real-atlassian"]
    container_name: knobas-jira
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Writes dbconfig.xml before the first start, which is what lets
      # `seed-atlassian.sh` skip the wizard's database step -- the one step
      # of that wizard Atlassian gives a supported way past. `postgres72` is Jira's own
      # spelling for every modern PostgreSQL, not a version claim.
      ATL_JDBC_URL: jdbc:postgresql://jira-db:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira
      ATL_DB_TYPE: postgres72
      ATL_DB_SCHEMA_NAME: public
      # Required, and its absence is silent: the image's dbconfig template
      # writes `<driver-class></driver-class>` when it is unset, and Jira then
      # answers the setup wizard's database step instead of skipping it -- with
      # a correct-looking dbconfig.xml sitting right there. Confluence infers
      # its driver from ATL_DB_TYPE and needs no equivalent.
      ATL_DB_DRIVER: org.postgresql.Driver
    volumes:
      - jira-data:/var/atlassian/application-data/jira
    depends_on:
      jira-db:
        condition: service_healthy

  confluence:
    # M3's target. Present now because Atlassian publishes no machine-readable
    # Confluence DC spec at all (specs/README.md), so the real container is the
    # only contract there will ever be.
    #   docker compose --profile real-atlassian up -d confluence
    image: ${CONFLUENCE_IMAGE:?run testenv/pin-images.sh to generate testenv/.env}
    profiles: ["real-atlassian"]
    container_name: knobas-confluence
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # As for Jira: dbconfig written before first start, so the wizard's
      # database step is already answered. Confluence spells the type plainly.
      ATL_JDBC_URL: jdbc:postgresql://confluence-db:5432/confluence
      ATL_JDBC_USER: confluence
      ATL_JDBC_PASSWORD: confluence
      ATL_DB_TYPE: postgresql
      # Confluence 7.9+ reads its licence here at FIRST-TIME setup and skips
      # the wizard's licence step -- the one half of `real-atlassian` that can
      # be automated (Jira has no equivalent). Export the timebomb key in your
      # shell; do NOT put it in testenv/.env, which is a tracked file:
      #   export CONFLUENCE_LICENSE_KEY='AAAB...'
      # Unset is the default and changes nothing.
      ATL_LICENSE_KEY: ${CONFLUENCE_LICENSE_KEY:-}
      # The key is written to confluence.cfg.xml on the persisted volume and is
      # NOT re-read on restart, so restarting does not reset the 3-hour timer.
      # After expiry, either `docker compose down -v` for a clean re-setup, or:
      #   ATL_FORCE_CFG_UPDATE=true docker compose --profile real-atlassian up -d confluence
      ATL_FORCE_CFG_UPDATE: ${ATL_FORCE_CFG_UPDATE:-false}
    volumes:
      - confluence-data:/var/atlassian/application-data/confluence
    depends_on:
      confluence-db:
        condition: service_healthy

volumes:
  gitea-data:
  kuma-data:
  tc-data:
  tc-logs:
  jira-data:
  confluence-data:
  jira-db-data:
  confluence-db-data:
