# The knobas test environment: a small fake company that a developer can bring
# up on a laptop.
#
# Every service here is a REAL product we can self-host -- Gitea and Uptime
# Kuma v2 by default. The adapters are certified against the actual software,
# not against a mock. (mockd, our deprecated mock of Jira Data Center and
# TeamCity, ran here as a container until 2026-11-01; the `knobas-mockd` crate
# is still spawned in process by the tests that use it, ADR-0013.)
#
# The opt-in profiles bring up the real Jira, Confluence and TeamCity servers.
# Since ADR-0013 they are the witness for every adapter and every write path,
# each with a seed and a `just <system>-live` recipe. They are off by default
# because they are expensive: see the cost note in images.env, and the profile
# comments below.
#
# Everything binds 127.0.0.1 only. This environment has developer-grade
# credentials in it (knobas/knobas-dev) and must never be reachable off-host.
#
# Ports are fixed by the M1 interfaces doc §5; testenv/check-ports.sh asserts
# this file against that map and CI runs it.

name: knobas-testenv

services:
  # ---------------------------------------------------------------- real ----
  gitea:
    image: ${GITEA_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    container_name: knobas-gitea
    environment:
      # INSTALL_LOCK skips the first-run web installer, which is otherwise a
      # human step and would make `./seed` unrunnable on a fresh volume.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://127.0.0.1:3000/
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      # M1 clones nothing and pushes over HTTP only, so no SSH port is
      # published and the SSH server is off rather than listening unused.
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      # The seed creates its users through the admin API; self-service sign-up
      # would only be another way in.
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      # Gitea's own default, PINNED rather than left implicit, and the reason is
      # that Gitea's environment-to-ini only ever *writes* /data/gitea/conf/
      # app.ini -- it never removes a setting from it. `docker-compose.capped.yml`
      # lowers this to 1, and app.ini keeps that value in the gitea-data volume,
      # so a plain `docker compose --env-file images.env up` afterwards comes back on a container with
      # no such variable and a still-capped server. (Measured, not assumed: the
      # container is recreated, `docker inspect` shows no MAX_RESPONSE_ITEMS, and
      # app.ini still reads `MAX_RESPONSE_ITEMS = 1`.) Naming the default here is
      # what puts it back, for `just gitea-live` and for anyone who ran the
      # capped overlay once and never thought about it again.
      #
      # 50 is also `knobas_source_gitea::client::PAGE_SIZE`, the `limit` every
      # listing in that adapter asks for.
      GITEA__api__MAX_RESPONSE_ITEMS: "50"
      # The seed's pull mirror (#722) mirrors tidewater/ops-runbooks from this
      # same Gitea, and Gitea refuses a migration from a loopback or private
      # address ("You can not import from disallowed hosts.") unless told
      # otherwise. A same-instance mirror keeps the live suites off the
      # internet. Changing this recreates the container on the next `up`;
      # `live-lib.sh`'s `_live_gitea_up` heals the port forward that can kill.
      GITEA__migrations__ALLOW_LOCALNETWORKS: "true"
      GITEA__log__LEVEL: warn
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      # /api/healthz is Gitea's own readiness endpoint and reports the database
      # too, so a healthy gitea here means the seed's very first POST will work.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Forgejo, the hard fork of Gitea (spec #1192, story 18; issue #1195): the
  # same adapter is expected to read it, and `just gitea-live forgejo` runs the
  # Gitea live suite against this container to find out. Opt-in (profile
  # `forgejo`), on its own port and volume beside Gitea, so the two never
  # share state and a Forgejo run cannot disturb a Gitea one. Same settings as
  # Gitea above, under Forgejo's FORGEJO__ prefix. SSH is off, as there.
  forgejo:
    image: ${FORGEJO_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    container_name: knobas-forgejo
    profiles: ["forgejo"]
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:3002/
      FORGEJO__server__SSH_DOMAIN: 127.0.0.1
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__api__MAX_RESPONSE_ITEMS: "50"
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "true"
      # Forgejo, unlike Gitea, also refuses a migration over plain http even to
      # an allowed local address ("unencrypted transfer protocols are
      # disabled"); the seed's same-instance mirror (#722) is http, so this
      # stays on. Test environment only.
      FORGEJO__migrations__ALLOW_UNENCRYPTED: "true"
      FORGEJO__log__LEVEL: warn
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # The https front for Gitea and Forgejo (#2377). knobas clones and fetches
  # over https or ssh only (ADR-0023, ADR-0035), and both forges serve http.
  # Caddy terminates TLS with a certificate from its own local CA ("knobas
  # testenv CA", in the https-front-data volume, so it outlives a recreate)
  # and proxies over the compose network: https://127.0.0.1:3443 is Gitea,
  # :3445 Forgejo (a 502 while Forgejo is down). The certificate names
  # 127.0.0.1 and localhost; a client that sends no SNI (an IP address) gets
  # the 127.0.0.1 one. `just live-trust-ca` trusts that CA on this Mac, once
  # per volume (testenv/README.md, *The https front*). Started with either
  # forge; the http ports stay what the seeds and the suites use.
  https-front:
    image: ${CADDY_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    container_name: knobas-https-front
    environment:
      CADDYFILE: |
        {
        	admin off
        	default_sni 127.0.0.1
        	skip_install_trust
        	pki {
        		ca local {
        			name "knobas testenv CA"
        		}
        	}
        }
        https://127.0.0.1:3443, https://localhost:3443 {
        	tls internal
        	reverse_proxy gitea:3000
        }
        https://127.0.0.1:3445, https://localhost:3445 {
        	tls internal
        	reverse_proxy forgejo:3000
        }
    # The Caddyfile rides in the environment, not a bind mount: on the WSL
    # target the engine is another machine and cannot see this checkout.
    command: ["sh", "-c", "printf '%s' \"$$CADDYFILE\" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports:
      - "127.0.0.1:3443:3443"
      - "127.0.0.1:3445:3445"
    volumes:
      - https-front-data:/data
    restart: unless-stopped

  # The Docker daemon Uptime Kuma's seeded Docker host talks to (#978), so a
  # Docker monitor created in this Kuma has a host to name.
  #
  # SECURITY: Kuma does NOT get /var/run/docker.sock. A mounted socket is
  # control of the Docker daemon -- root on the host -- for whatever runs in
  # that container, and Kuma is a large Node app that fetches arbitrary URLs.
  # Only this proxy holds the socket, and it exposes just the read endpoints
  # (CONTAINERS=1 allows GET /containers/*; POST, which is what start, exec and
  # create need, stays refused by its default POST=0, as do images, volumes,
  # networks, exec and the rest; EVENTS, on by the image's default, is turned
  # off because Kuma's check reads only GET /containers/<name>/json). It
  # publishes no port and sits only on `docker-api`, an internal network it
  # shares with Kuma alone: no other testenv container (the TeamCity agent runs
  # build code) reaches tcp://docker-proxy:2375, and the proxy has no route
  # out. GET /containers/<id>/json includes each container's environment, so
  # whoever reaches the proxy reads every container's env on this engine; that
  # is why the reach is Kuma's only. The `:ro` on the mount is belt only -- it
  # does not restrict the API -- the filter is the protection.
  docker-proxy:
    image: ${DOCKER_PROXY_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    container_name: knobas-docker-proxy
    environment:
      CONTAINERS: 1
      EVENTS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    restart: unless-stopped

  uptime-kuma:
    image: ${KUMA_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    container_name: knobas-uptime-kuma
    environment:
      # WITHOUT THIS, `docker compose --env-file images.env up` GIVES YOU A KUMA THAT NEVER STARTS.
      # Uptime Kuma v2 added a database-choice step that runs BEFORE the real
      # server: it logs "Starting Setup Database ... Waiting for user action"
      # and serves an entirely different express app on 3001 until a human
      # picks a backend in a browser. Setting the type here supplies that
      # answer, `Database.writeDBConfig` persists it, and the real server
      # starts unattended. (Verified on the pinned image, 2.5.3.)
      UPTIME_KUMA_DB_TYPE: sqlite
    # Of the six seeded monitors, only the canary checks a socket on the
    # engine's HOST, at http://host.docker.internal:8299/. The three products
    # and `gitea` are reached by compose service name on this network
    # (http://teamcity:8111/, http://jira:8080/, http://confluence:8090/,
    # http://gitea:3000/), which needs no host alias and works on any engine;
    # the `notebook` ping is ICMP to the Mac's Tailscale address. Docker
    # Desktop and OrbStack define `host.docker.internal` themselves; a plain
    # Linux engine -- the WSL box's, where this runs since 2026-11-01 --
    # defines nothing at all, and this line is what makes the name RESOLVE
    # there: to the bridge gateway, 172.17.0.1.
    #
    # A bridge-gateway client cannot reach a socket bound to the machine's
    # 127.0.0.1, so on a remote target canary.sh binds the canary on that
    # bridge address (README.md, "Live products on a remote machine (WSL)").
    # The products' published ports stay on 127.0.0.1, deliberately, so this
    # environment's developer credentials are never off-host; Kuma does not
    # need them, since it reaches each product on the compose network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      # So `up uptime-kuma` also starts the Docker API the seeded Docker host
      # points at.
      - docker-proxy
    networks:
      # `default` for the monitors' targets, `docker-api` for the Docker host.
      - default
      - docker-api
    volumes:
      - kuma-data:/app/data
    healthcheck:
      # NOT `curl /`. The setup-database app above answers `/` with a 302 to
      # its own wizard, so a check on `/` reports HEALTHY for a Kuma that has
      # no socket.io server at all -- which is how this environment first came
      # up "green" with a Kuma nothing could seed. The engine.io handshake is
      # the real server's own signal and is the exact channel the seed uses:
      # it returns `0{"sid":...}` there and the wizard's HTML here.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:3001/socket.io/?EIO=4&transport=polling' | grep -q '\"sid\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- seed ----
  kuma-seed:
    # A one-shot, not a service: `profiles` keeps it out of `up`, and
    # seed-kuma.sh runs it with `compose run --rm`. Kuma v2 has no REST API for
    # configuration (roadmap §4 gotcha 6) -- setup, login, monitor creation and
    # API-key creation are all socket.io -- which is why this is node and not
    # curl.
    image: ${NODE_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    profiles: ["seed"]
    depends_on:
      uptime-kuma:
        condition: service_healthy
    environment:
      KUMA_URL: http://uptime-kuma:3001
      KUMA_USER: knobas
      KUMA_PASS: knobas-dev
    # NO MOUNT: the scripts arrive as a tar on stdin (seed-kuma.sh,
    # kuma-monitor.sh pipe it in). A bind mount names a path on the engine's
    # machine, and on a remote target (testenv/live.env) that machine has no
    # checkout. The API key still comes back on the container's stdout and
    # seed-kuma.sh writes it host-side, so nothing in this repo is ever
    # written by a container.
    stdin_open: true
    # The only step in the whole environment that needs network access at seed
    # time; noted in README.md.
    #
    # The scripts land in /tmp/k next to their node_modules. ESM ignores
    # NODE_PATH -- an `import` resolves against the script's own directory's
    # node_modules and /node_modules and nowhere else -- so the script must sit
    # in the directory whose node_modules npm just populated. monitors.json
    # travels with it because the script resolves it relative to
    # import.meta.url.
    command: >
      sh -c "mkdir -p /tmp/k &&
             tar -x -C /tmp/k &&
             npm --prefix /tmp/k i --no-save --silent socket.io-client@4 &&
             node /tmp/k/kuma-seed.mjs"

  # ------------------------------------------------------ opt-in: real -----
  teamcity:
    # ~2.5 GB to pull, ~10 GB on disk with its data directory. Off by default
    # for that reason. Its first start is a browser wizard (database, licence,
    # administrator account); `seed-teamcity.sh` walks that wizard's own form
    # endpoints unattended, the way `seed-atlassian.sh` walks Jira's, and like
    # that script it refuses any image digest it was not derived on -- the
    # forms are not an API. The internal HSQLDB is the database: this is a test
    # environment, and the one thing a real database would buy (durability
    # across upgrades) is nothing `down -v` does not throw away anyway. This is
    # also the container `testenv/specs/fetch.sh --teamcity` needs to extract
    # /app/rest/swagger.json (see specs/README.md's blocker).
    #   docker compose --env-file images.env --profile real-teamcity up -d teamcity teamcity-agent
    #   ./seed --teamcity
    image: ${TEAMCITY_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    profiles: ["real-teamcity"]
    container_name: knobas-teamcity
    ports:
      - "127.0.0.1:8111:8111"
    volumes:
      - tc-data:/data/teamcity_server/datadir
      - tc-logs:/opt/teamcity/logs

  teamcity-agent:
    # One build agent, because a server with none runs nothing (#264). It
    # registers with the server over the compose network and shows up
    # unauthorised; `seed-teamcity.sh` authorises it through the REST API.
    # NO published port: the agent has nothing to listen for from the host
    # and check-ports.sh's §5 map does not know it. The name is fixed so the
    # seed can address it (`name:knobas-agent`) instead of guessing from a
    # container id, and the conf volume keeps the agent's identity across
    # restarts so the server does not see a second, unauthorised agent after
    # every `up`.
    image: ${TEAMCITY_AGENT_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    profiles: ["real-teamcity"]
    container_name: knobas-teamcity-agent
    environment:
      SERVER_URL: http://teamcity:8111
      AGENT_NAME: knobas-agent
    volumes:
      - tc-agent-conf:/data/teamcity_agent/conf
    depends_on:
      - teamcity

  # The two Atlassian products need a real database beside them: Jira 10.0
  # removed the embedded H2 engine outright ("you'll no longer be able to
  # evaluate Jira 10.0 using the H2 embedded database"), so without this the
  # setup wizard stops at its database step and `real-atlassian` cannot be
  # brought up at all -- by a script or by hand. One server per product rather
  # than one shared: `down -v` on either has to be a clean slate for that
  # product's re-setup, which a shared server would make a cross-product
  # action.
  # PostgreSQL 15 specifically: Atlassian's compatibility matrix supports 15
  # for Jira 10.3, allows 16 only from 10.3.7, deprecates 12-14, and does
  # **not** support 17 -- which is the version this machine happens to cache,
  # which is why the choice is written down rather than left to whoever looks
  # at `docker images` next.
  jira-db:
    image: ${ATLASSIAN_DB_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    profiles: ["real-atlassian"]
    container_name: knobas-jira-db
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
      # Jira refuses a database whose collation is not C or POSIX-compatible;
      # the alpine image's default locale would otherwise be inherited.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - jira-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira"]
      interval: 5s
      timeout: 5s
      retries: 30

  confluence-db:
    image: ${ATLASSIAN_DB_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    profiles: ["real-atlassian"]
    container_name: knobas-confluence-db
    environment:
      POSTGRES_DB: confluence
      POSTGRES_USER: confluence
      POSTGRES_PASSWORD: confluence
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - confluence-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confluence"]
      interval: 5s
      timeout: 5s
      retries: 30

  jira:
    # Wants ~4 GB of RAM and a timebomb licence entered by hand.
    #   docker compose --env-file images.env --profile real-atlassian up -d jira
    # Jira has NO licence environment variable: paste the *Jira Software Data
    # Center* timebomb key (10 user, 3 hours) into the setup wizard. When it
    # expires, re-paste at Administration > System > License
    # (/secure/admin/ViewLicense.jspa) -- no restart, no account.
    # The tag is 10.3 LTS rather than the newest release because 11.x is
    # reported to reject that key; pin-images.sh carries the evidence.
    image: ${JIRA_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    profiles: ["real-atlassian"]
    container_name: knobas-jira
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Writes dbconfig.xml before the first start, which is what lets
      # `seed-atlassian.sh` skip the wizard's database step -- the one step
      # of that wizard Atlassian gives a supported way past. `postgres72` is Jira's own
      # spelling for every modern PostgreSQL, not a version claim.
      ATL_JDBC_URL: jdbc:postgresql://jira-db:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira
      ATL_DB_TYPE: postgres72
      ATL_DB_SCHEMA_NAME: public
      # Required, and its absence is silent: the image's dbconfig template
      # writes `<driver-class></driver-class>` when it is unset, and Jira then
      # answers the setup wizard's database step instead of skipping it -- with
      # a correct-looking dbconfig.xml sitting right there. Confluence infers
      # its driver from ATL_DB_TYPE and needs no equivalent.
      ATL_DB_DRIVER: org.postgresql.Driver
    volumes:
      - jira-data:/var/atlassian/application-data/jira
    depends_on:
      jira-db:
        condition: service_healthy

  confluence:
    # M3's target. Present now because Atlassian publishes no machine-readable
    # Confluence DC spec at all (specs/README.md), so the real container is the
    # only contract there will ever be.
    #   docker compose --env-file images.env --profile real-atlassian up -d confluence
    image: ${CONFLUENCE_IMAGE:?run testenv/pin-images.sh to generate testenv/images.env}
    profiles: ["real-atlassian"]
    container_name: knobas-confluence
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # As for Jira: dbconfig written before first start, so the wizard's
      # database step is already answered. Confluence spells the type plainly.
      ATL_JDBC_URL: jdbc:postgresql://confluence-db:5432/confluence
      ATL_JDBC_USER: confluence
      ATL_JDBC_PASSWORD: confluence
      ATL_DB_TYPE: postgresql
      # Confluence 7.9+ reads its licence here at FIRST-TIME setup and skips
      # the wizard's licence step -- the one half of `real-atlassian` that can
      # be automated (Jira has no equivalent). Export the timebomb key in your
      # shell; do NOT put it in testenv/images.env, which is a tracked file:
      #   export CONFLUENCE_LICENSE_KEY='AAAB...'
      # Unset is the default and changes nothing.
      ATL_LICENSE_KEY: ${CONFLUENCE_LICENSE_KEY:-}
      # The key is written to confluence.cfg.xml on the persisted volume and is
      # NOT re-read on restart, so restarting does not reset the 3-hour timer.
      # After expiry, either `docker compose --env-file images.env --profile real-atlassian down -v jira
      # jira-db confluence confluence-db` for a clean re-setup (name the four:
      # a bare `down -v` takes Gitea and its volume too), or:
      #   ATL_FORCE_CFG_UPDATE=true docker compose --env-file images.env --profile real-atlassian up -d confluence
      ATL_FORCE_CFG_UPDATE: ${ATL_FORCE_CFG_UPDATE:-false}
    volumes:
      - confluence-data:/var/atlassian/application-data/confluence
    depends_on:
      confluence-db:
        condition: service_healthy

networks:
  # Kuma and the Docker socket proxy only (#978). `internal`: no route out.
  docker-api:
    internal: true

volumes:
  gitea-data:
  forgejo-data:
  https-front-data:
  kuma-data:
  tc-data:
  tc-logs:
  tc-agent-conf:
  jira-data:
  confluence-data:
  jira-db-data:
  confluence-db-data:
