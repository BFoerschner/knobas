[toolchain]
channel = "1.99"
components = ["rustfmt", "clippy"]
# The fixture external adapter (#1198, ADR-0028) is a WASM component, built
# for this target by `just wasm-fixture`. Listed here so rustup installs it
# with the toolchain, rather than leaving it to a machine-global install.
targets = ["wasm32-wasip2"]
