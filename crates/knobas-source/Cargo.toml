[package]
name = "knobas-source"
edition.workspace = true
version.workspace = true

# The SPI is deliberately transport-agnostic: every type crossing it is plain
# serde-serializable data and the crate has no database dependency, so an
# adapter can later be moved out of process without touching this contract.
[dependencies]
async-trait.workspace = true
chrono.workspace = true
knobas-spi-types = { path = "../knobas-spi-types" }
serde.workspace = true
serde_json.workspace = true
# The derive behind the generated IPC mirror (`knobas-app`'s `ipc_mirror`,
# #1325): the entity barrel's types are declared here (#1326).
ts-rs.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
