[package]
name = "knobas-db"
edition.workspace = true
version.workspace = true

[features]
# Exposes `knobas_db::test_util` to other crates' tests. Gated on the feature
# alone rather than `cfg(test)`, which is not set for a crate's own `tests/`
# directory nor for downstream crates.
#
# `tokio/signal` rides on it for the test-server entry point below, which
# stops its server on Ctrl-C as well as on a closed stdin; the shipped build
# never enables the feature, so it never pays for it.
test-util = ["tokio/signal"]

# The test-server entry point `just test` starts: one embedded PostgreSQL for
# the whole gate, which every test binary then reaches through
# `KNOBAS_TEST_DB_URL` (see `test_util`).
#
# A `[[bin]]` rather than an example because cargo hands integration tests a
# `CARGO_BIN_EXE_<name>` for a bin and nothing for an example, and the
# lifecycle suite spawns it by that path. `required-features` keeps it out of
# every build that does not turn `test-util` on: `cargo build -p knobas-app`,
# `tauri build` and `clippy --workspace --lib` never see it, and `cargo test`
# builds it only because the self-dev-dependency below enables the feature.
# `test = false`: it has no tests of its own, so no harness for it enters the
# inventory.
[[bin]]
name = "knobas-test-server"
path = "src/bin/knobas_test_server.rs"
required-features = ["test-util"]
test = false
doc = false
bench = false

[dependencies]
# `default-features = false` drops the crate's `tls-native-tls` default, which
# would turn on `sqlx/tls-native-tls` and -- through feature unification --
# override the workspace's `tls-none` sqlx build. The archive downloader still
# needs TLS, so it is enabled directly on `postgresql_archive` below.
postgresql_embedded = { version = "0.21", default-features = false, features = [
    "theseus",
    "tokio",
] }
# Not used directly: present to give the downloader a TLS backend without
# dragging TLS into sqlx.
postgresql_archive = { version = "0.21", default-features = false, features = [
    "theseus",
    "tls-native-tls",
] }
# `percent-encoding` and `url`: how a connection URL's password is read back
# out of it, the same two crates and the same way `sqlx-core` does it (it
# depends on both, so this adds nothing to the build). `pg_dump` is a child
# process and needs the password libpq's way -- see `embedded::password_of`.
percent-encoding = "2"
sqlx.workspace = true
thiserror.workspace = true
# `process` is `backup`'s: `pg_dump` and `pg_restore` are run as children, and
# awaiting them on the runtime rather than blocking a thread is what keeps a
# scheduled backup off the UI's back.
tokio = { workspace = true, features = ["process", "sync"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
# Only `tests/schema.rs` reaches for the column types the migrations declare;
# nothing in `src/` mentions a timestamp. A dependency here rather than above
# for the same reason `serde` left with `knobas_db::search` (ruling P9): the
# library a consumer builds should not carry what only its tests use.
chrono.workspace = true
# Self-dev-dependency so this crate's own integration tests see `test_util`.
knobas-db = { path = ".", features = ["test-util"] }
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true }
uuid.workspace = true
