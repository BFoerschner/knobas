[package]
name = "knobas-search"
edition.workspace = true
version.workspace = true

# Test support that `cfg(test)` cannot reach: that cfg is set for neither
# `tests/` nor `benches/` of this crate, so the shared fixtures (and, from
# task 10, the deterministic corpus generator the perf test and the bench
# share) live behind a feature instead.
[features]
test-util = []

# The launcher's read side. It takes a `PgPool` rather than opening one, so it
# needs `sqlx` but not `knobas-db` -- the database crate is a test dependency
# only. Stream E owns this crate from M1's contract PR onwards.
[dependencies]
chrono.workspace = true
# For `KindInfo`/`SourceDescriptor` only: the launcher labels a group from the
# adapter's declared kind metadata (spec §3a), never from a hardcoded list.
knobas-source = { path = "../knobas-source" }
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true

[dev-dependencies]
knobas-db = { path = "../knobas-db", features = ["test-util"] }
# The launcher labels a group from what the adapter declared (spec §3a), so the
# tests assert against a real adapter's `KindInfo` rather than against a
# hand-written copy of it. Read-only: nothing here syncs.
knobas-source-mock = { path = "../knobas-source-mock" }
# This crate's own `test-util` items -- `corpus::NOTE`, `Vocabulary::fixture`,
# `Searcher::explain_recent` -- reached from `tests/`, where `cfg(test)` is not
# set. The same self-dev-dependency `knobas-db` uses, and the reason
# `just clippy-libs` exists: `--all-targets` unifies features, so the library
# must also lint with the feature *off*.
knobas-search = { path = ".", features = ["test-util"] }
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
