<!-- pleasant's sign-in page (Pleasant Password Server 9.5.4.0, /SignIn/Direct), recorded 2026-11-22 from the real server in the WSL VM (scripts, styles, images and the news frame removed; the request token emptied). -->

<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta charset="utf-8" />
    <title>Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" />
    <!-- jQuery needs to be included at the top of the page because the Kendo UI MVC extensions place script code inline with the widgets -->
        <!--We may way to include kendo.messages path as a resource string so it only changes for languages we explicitly support.-->
    <style>
            html {
                background:none;
            }
            html::after {
                content: "";
                opacity: 0.05;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                position: absolute;
                z-index: -1;
                height:100vh;
            }
            body {
                height:100vh;
                max-height:100vh;
            }
            body::after {
                content: "";
                background-size: 100% auto;
                opacity: 0.05;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                position: absolute;
                z-index: -1;
            }
            #window-container {
                height: 100%;
                padding: 0 !important;
                margin: 0 !important;
            }
            .content .embedded-main {
                background: white;
                padding: 20px;
                border-radius: 20px;
                position: relative;
                margin-bottom: 2px;
                width:100%;
                max-width: 700px;
                height: 100%;
                max-height: 500px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            @media only screen and (max-width: 768px) {
                .content .embeded-main {
                    width: 100%;
                    max-width: 400px;
                }
            }
    </style>
</head>
<body class="claro embedded" style="position:relative;">
    <div style="margin: 0; height: 1px;">
    </div>
    <!-- This block needed or margins from content will override html/body tag margins for strange reasons in all 3 major browsers -->
    <div id="window-container" class="content container-fluid" style="position:relative;padding:5px;margin:5px;align-items:center;justify-content:center;flex-direction:column;display:flex;">
        <div id="embedded-container" class="embedded-main">
<style>
    #loading-spinner-frame {
        position: fixed;
        display: none;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        text-align: center;
        background-color: rgba(0, 0, 0, 0.2);
        z-index: 99999;
    }
    .loading-spinner {
        left: calc(50% - 50px);
        top: calc(50% - 50px);
        border: 16px solid rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        border-top: 16px solid rgba(255, 0, 0, 1);
        width: 100px;
        height: 100px;
        -webkit-animation: spin 2s linear infinite;
        animation: spin 2s linear infinite;
        display: block;
        position: absolute;
    }
    @-webkit-keyframes spin {
        from {-webkit-transform:rotate(0deg);}
        to {-webkit-transform:rotate(360deg);}
    }
    @keyframes spin {
        from {transform:rotate(0deg);}
        to {transform:rotate(360deg);}
    }
</style>
<div id="loading-spinner-frame">
    <div class="loading-spinner">
    </div>
</div>
            <div style="max-width: min(100%, 94vw); max-height: 100%">
<div id="alert-messages">
</div>
            </div>
<h2 style="text-align:center;">Sign In</h2>
<form action="/Account/SignIn?ReturnUrl=%2FWebClient%2FMain%3FitemId%3D07c469c8-e880-4927-8c31-a8342cd66d98" autocomplete="off" class="form-horizontal" id="signInForm" method="post" role="form"><input name="__RequestVerificationToken" type="hidden" value="" />    <div class="form-group">
        <label class="col-sm-3 control-label" for="UserName">User</label>
        <div class="col-sm-8">
            <input autocapitalize="none" autofocus="autofocus" class="form-control" data-val="true" data-val-required="The User field is required." id="UserName" name="UserName" type="text" value="" />
            <span class="field-validation-valid" data-valmsg-for="UserName" data-valmsg-replace="true"></span>
        </div>
        <div class="col-sm-offset-1"></div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" for="Password">Password</label>
        <div class="col-sm-8">
            <input class="form-control" data-val="true" data-val-required="The Password field is required." id="Password" name="Password" type="password" value="" />
            <span class="field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
        </div>
        <div class="col-offset-1"></div>
    </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-9">
                <div class="checkbox">
                    <label>
                        <input data-val="true" data-val-required="The Remember me? field is required." id="RememberMe" name="RememberMe" type="checkbox" value="true" /><input name="RememberMe" type="hidden" value="false" /> Remember me?
                    </label>
                </div>
            </div>
        </div>
    <div class="form-group">
        <div class="col-sm-offset-3 col-sm-9">
            <button type="submit" class="btn btn-primary">Sign In</button>
            <span id="signInLoadingMessage" style="display:none">Please Wait....</span>
        </div>
    </div>         <div class="form-group">
            <input id="language" name="language" type="hidden" value="autodetect" />
        </div>
</form>
        </div>
    </div>
</body>
</html>
