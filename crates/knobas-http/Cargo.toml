[package]
name = "knobas-http"
edition.workspace = true
version.workspace = true
license.workspace = true

# Shared by the Jira, Gitea and TeamCity adapters, and read-only for M1
# (interfaces §8 P8): a three-writer crate is a collision magnet, so changes
# route through the orchestrator.
[features]
# Exposes `Request::build`, which turns a request into something any
# `reqwest::Client` could execute -- i.e. a second way onto the network, past
# the limiter and the retry budget. Tests need it to assert what a request
# carries; adapters must never have it, so it is off in every build they
# compile against (`cargo build`, and the `clippy --lib` half of the gate).
test-util = []

[dependencies]
# For `Bytes`, the chunk type of a streamed body; already in the tree through
# reqwest (issue #1012).
bytes = "1"
governor.workspace = true
# The body cap (#1640): a response's body is re-wrapped through `http`'s
# `Response` and read through an `http_body::Body` that counts it. Both are
# the copies reqwest already resolves.
http = "1"
http-body = "1"
# A read the server hung up on before answering is told by the
# `hyper::Error` at the bottom of reqwest's error chain (#1818). The copy
# reqwest already resolves.
hyper = "1"
knobas-source = { path = "../knobas-source" }
reqwest.workspace = true
serde.workspace = true
# The excerpting JSON read decodes a body it already holds as text (#1313).
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "rt"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
# Gzips a body that inflates past the cap, so the cap is shown to count what
# the read decodes, not what arrived (#1640). The version the Gitea adapter
# already resolves.
flate2 = "1.1.9"
# Self-dev-dependency so this crate's own integration tests see
# `Request::build` (the convention `knobas-db` and `knobas-app` use).
knobas-http = { path = ".", features = ["test-util"] }
serde_json.workspace = true
# `net` for the counting socket the retry-budget tests answer from. Named here
# rather than inherited: reqwest happens to turn it on, and a test relying on
# another crate's feature is a test that breaks when that crate changes.
# `test-util` for the paused clock the quota and budget tests run on, and
# `sync` for the watch that says an exchange is over (#1925).
tokio = { workspace = true, features = ["net", "io-util", "sync", "test-util"] }
