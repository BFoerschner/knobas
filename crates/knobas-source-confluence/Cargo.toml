[package]
name = "knobas-source-confluence"
edition.workspace = true
version.workspace = true
license.workspace = true

# The Confluence Data Center adapter (issue #284, M3.2). Read-only: pages with
# their comments, ancestors and space, incremental over CQL's `lastmodified`.
# It declares no write ops, so `Source::write` refuses everything -- the write
# half is its own ticket (spec #272, "Confluence write ops").
[dependencies]
async-trait.workspace = true
chrono.workspace = true
knobas-core = { path = "../knobas-core" }
knobas-http = { path = "../knobas-http" }
knobas-source = { path = "../knobas-source" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test-only, and only in `tests/live_confluence_seeded.rs`: the raw requests
# that certify what mapping cannot carry -- the status of a real 401, and the
# rename that suite makes through Confluence's own REST API. The adapter
# itself reaches the network through `knobas-http` and nothing else.
# Inherited from the workspace so `cargo tree -i reqwest` stays at one copy.
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
