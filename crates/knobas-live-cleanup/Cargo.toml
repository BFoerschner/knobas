[package]
name = "knobas-live-cleanup"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# The one cleanup runner every live suite's `Drop` guard calls (#1913): the
# async cleanup on a thread and a runtime of its own, a bound on the whole
# sequence, and a report that cannot abort a test that is already unwinding.
# A dev-dependency of the adapter crates and of `knobas-app`, and nothing
# else: no shipped crate depends on it. Its own unit tests are the witness the
# live suites cannot be, since they run only against the real products.
[dependencies]
# The cleanup's own current-thread runtime, with the timer a cleanup that
# waits needs (`time`, in the workspace entry). `macros` is there too, for the
# unit tests' `#[tokio::test]`.
tokio.workspace = true
