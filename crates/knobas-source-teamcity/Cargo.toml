[package]
name = "knobas-source-teamcity"
edition.workspace = true
version.workspace = true
license.workspace = true

# The read-only TeamCity adapter (M1 stream C). Four REST endpoints, JSON only,
# every response trimmed with an explicit `fields=`.
[dependencies]
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
# `FuturesUnordered`, the configurations a sync asks about side by side in
# its one task (#2176). Already in the tree through `reqwest`, at this version.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
knobas-core = { path = "../knobas-core" }
knobas-http = { path = "../knobas-http" }
knobas-source = { path = "../knobas-source" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The HTTP-level mock the exit criteria are certified against (interfaces §5).
# A dev-dependency only: nothing in the shipped adapter knows mockd exists.
knobas-mockd = { path = "../knobas-mockd" }
# The cleanup runner `tests/live_teamcity_seeded.rs`'s `Drop` guards share
# (#1913): a thread and runtime of their own, a bound, a report.
knobas-live-cleanup = { path = "../knobas-live-cleanup" }
# The Tidewater dataset both mock layers share -- every expectation in
# `tests/it/mockd.rs` is computed from it rather than hard-coded (spec §14a).
knobas-source-mock = { path = "../knobas-source-mock" }
# Two test-only uses: the one deliberately malformed request that proves
# mockd's violation log is live, and the raw GETs `tests/live_teamcity.rs`
# sends to certify facts that do not survive mapping -- a status, a page's
# order, a field the adapter drops. The adapter itself reaches the network
# through `knobas-http` and nothing else. Inherited from the workspace so
# `cargo tree -i reqwest` stays at one copy.
reqwest.workspace = true
serde_json.workspace = true
# `net`, `io-util` and `sync` for `support::held`, the proxy that holds a
# request open until a test lets it go (#2176).
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
# The docker-free stand-in for the source-view tests (`tests/it/view.rs`,
# #664): mockd serves the sync contract and knows nothing of parameters,
# steps or triggers. Every shape it serves there is re-asserted against the
# real server in `tests/live_teamcity_seeded.rs`; on disagreement the fake is
# what is wrong. Brings no `reqwest` of its own.
wiremock = "0.6"
