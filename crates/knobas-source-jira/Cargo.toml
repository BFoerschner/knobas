[package]
name = "knobas-source-jira"
edition.workspace = true
version.workspace = true
license.workspace = true

# The Jira Data Center adapter. Read-only in M1: it maps issues, comments and
# worklogs into SyncItems and never writes back (interfaces doc §4.1).
[dependencies]
async-trait.workspace = true
chrono.workspace = true
knobas-core = { path = "../knobas-core" }
knobas-http = { path = "../knobas-http" }
knobas-source = { path = "../knobas-source" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The pin that holds `knobas_core::recorded_parent_key!` to this crate's
# `ticket` parent candidates (#649) runs the macro's SQL over mirrored rows, so
# it needs a real PostgreSQL: the embedded test server `test-util` exposes. It
# lives here rather than in `knobas-core` because it reads this crate's
# descriptor, and `knobas-core` depending on an adapter would be a cycle.
knobas-db = { path = "../knobas-db", features = ["test-util"] }
sqlx.workspace = true
# The HTTP-level mock the exit criteria are certified against (interfaces §5).
# A dev-dependency only: nothing in the shipped adapter knows mockd exists.
knobas-mockd = { path = "../knobas-mockd" }
# Test-only, and only in `tests/live_jira_seeded.rs`: the raw requests that
# certify what mapping cannot carry -- the status and headers of a real 401,
# and the edit that suite makes through Jira's own REST API. The adapter
# itself reaches the network through `knobas-http` and nothing else. Inherited
# from the workspace so `cargo tree -i reqwest` stays at one copy.
reqwest.workspace = true
serde_json.workspace = true
# `net` and `io-util` for `tests/it/field_discovery.rs`'s canned-bytes stub -- the
# only server in this workspace that answers `GET /rest/api/2/field` offline.
# Named rather than inherited: reqwest happens to turn them on, and a test
# resting on another crate's feature breaks when that crate changes.
tokio = { workspace = true, features = ["net", "io-util"] }
