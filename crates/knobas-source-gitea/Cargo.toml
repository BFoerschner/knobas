[package]
name = "knobas-source-gitea"
edition.workspace = true
version.workspace = true
license.workspace = true

# Read-only Gitea adapter: repositories, branches, pull requests, commits.
# Its contract source is the real pinned container in testenv/, not a mock.
[dependencies]
async-trait.workspace = true
# A file commit's text goes to Gitea's contents API in base64, and a moved
# file's comes back that way (#822). Already in the tree, at this version.
base64 = "0.22"
chrono.workspace = true
knobas-core = { path = "../knobas-core" }
knobas-http = { path = "../knobas-http" }
knobas-source = { path = "../knobas-source" }
serde.workspace = true
serde_json.workspace = true
# Two items: `tokio::try_join!`, which reads a view's sections side by side in
# the one task that asked (#703), and `tokio::time::sleep`, the wait between a
# merge Gitea answered "Please try again later" and the next (#721; the
# workspace's `time` feature). It spawns nothing.
tokio = { workspace = true, features = ["macros"] }
# `FuturesUnordered`, the repositories a sync walks side by side in its one
# task (#2159). Already in the tree through `reqwest`, at this version.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
tracing = "0.1"

[dev-dependencies]
serde_json.workspace = true
# `test-util` for the paused clock the merge-patience test runs on (#1925);
# `net`, `io-util` and `sync` for `support::held`, the proxy that holds a
# request open until a test lets it go (#2159).
tokio = { workspace = true, features = ["test-util", "net", "io-util", "sync"] }
# The cleanup runner `live_env::Litter`'s `Drop` calls (#1913), shared with
# every other live suite: a thread and runtime of its own, a bound, a report.
knobas-live-cleanup = { path = "../knobas-live-cleanup" }
# The docker-free stand-in for Gitea (ruling B6). `just check` and CI run no
# containers, so every shape asserted here is re-asserted in `tests/live_gitea.rs`
# against the real pinned container -- if the two disagree, this one is wrong.
# It brings no `reqwest` of its own; `cargo tree -i reqwest` must stay at one.
wiremock = "0.6"
# Only `view_files`, to answer a compressed raw file as a proxy would (#711).
# Already in the tree through `reqwest`'s `gzip`.
flate2 = "1.1.9"
# Only `tests/live_gitea.rs` uses this, to create a branch and open a pull
# request through Gitea's own API -- the adapter is read-only and its own
# transport is `knobas-http`'s. Inherited from the workspace so `cargo tree -i
# reqwest` stays at one copy.
reqwest.workspace = true
