[package]
name = "knobas-source-gitea"
edition.workspace = true
version.workspace = true
license.workspace = true

# Read-only Gitea adapter: repositories, branches, pull requests, commits.
# Its contract source is the real pinned container in testenv/, not a mock.
[dependencies]
async-trait.workspace = true
chrono.workspace = true
knobas-core = { path = "../knobas-core" }
knobas-http = { path = "../knobas-http" }
knobas-source = { path = "../knobas-source" }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
# The docker-free stand-in for Gitea (ruling B6). `just check` and CI run no
# containers, so every shape asserted here is re-asserted in `tests/live_gitea.rs`
# against the real pinned container -- if the two disagree, this one is wrong.
# It brings no `reqwest` of its own; `cargo tree -i reqwest` must stay at one.
wiremock = "0.6"
# Only `tests/live_gitea.rs` uses this, to create a branch and open a pull
# request through Gitea's own API -- the adapter is read-only and its own
# transport is `knobas-http`'s. Inherited from the workspace so `cargo tree -i
# reqwest` stays at one copy.
reqwest.workspace = true
