[package]
name = "knobas-wasm-host"
edition.workspace = true
version.workspace = true

# The WASM host (issue #1198, ADR-0028): one external adapter, a component
# built against `wit/adapter.wit`, run under wasmtime and handed to the rest of
# knobas as a `dyn Source`. The engine, the write queue, IPC and the shell see
# that and nothing else.
[features]
# `fixture_component` and `load_fixture`, for the tests that load the fixture
# component: this crate's own and `knobas-app`'s; `fake_dns`, for the
# tests that point a host name at a local server (#1244); and `fake_proxy`,
# which sends a name through a test's proxy (#1283) and takes the system
# proxy's place on the external adapters' clients. Off in every shipped build.
test-util = []

[dependencies]
async-trait.workspace = true
chrono.workspace = true
knobas-core = { path = "../knobas-core" }
# The instance's rate limit, which an external adapter's requests to its
# instance wait on beside every built-in client for that origin (#1631).
knobas-http = { path = "../knobas-http" }
knobas-source = { path = "../knobas-source" }
serde.workspace = true
serde_json.workspace = true
# The artifact hash a manifest names (#1202). The release `knobas-mockd` already
# pulls.
sha2 = "0.10"
thiserror.workspace = true
# The sink pump: `sync` runs the component and hands its items to the engine's
# sink at once, one item at a time, so a sink failure reaches the
# component as the answer to the item it refused.
# `net`: the external adapters' name lookup, guarded (#1244).
tokio = { workspace = true, features = ["net", "sync"] }
tracing = "0.1"
# Pinned exactly: 49.0.2 is the newest release older than two weeks
# (2026-10-02). Without its defaults: the component model, a compiler, and
# async host calls, which is what the host uses. The two crates are one
# release and move together.
wasmtime = { version = "=49.0.2", default-features = false, features = ["async", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
# WASI 0.2 with nothing in it: a component built for `wasm32-wasip2` imports
# it through Rust's std. No directory is opened, no environment passed, and
# the context's defaults refuse every socket and every name lookup.
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p2"] }

# `wasi:http` 0.2, the component's one way out (#1203): the outgoing
# handler, held to the manifest's hosts by `net`'s hooks. Pinned with
# wasmtime. Without its default transport (hyper over webpki roots).
wasmtime-wasi-http = { version = "=49.0.2", default-features = false, features = ["p2"] }
# The transport `net` sends through instead: the built-in adapters' client,
# with the platform verifier and the system proxy.
reqwest.workspace = true
# Hosts and request authorities read the way a request's URL is (`allow`).
url = "2"
# The request, response and body types `wasi:http`'s hooks take, and the
# redacting body (`redact`). The releases wasmtime-wasi-http resolves.
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
# The basic-auth pair the host attaches.
base64 = "0.22"

[dev-dependencies]
# Self-dev-dependency, so this crate's own integration tests see `test-util`
# (the `knobas-db` and `knobas-app` convention).
knobas-wasm-host = { path = ".", features = ["test-util"] }
# The engine's progress decorator, so the walk a component reports is
# witnessed where the engine reads it (#1380).
knobas-sync = { path = "../knobas-sync" }
# `test-util` for the paused clock the deadline-on-the-limiter test runs on
# (#1925).
tokio = { workspace = true, features = ["test-util"] }
# Catches the host's log lines for a component that floods its log (#1641).
# The release `knobas-app` already pulls.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# Components written as text for the version check: one that exports a source
# at an unsupported major version, one that exports none. Pinned to the copy
# wasmtime's own tree resolves.
wat = "=1.258.3"
