[package]
name = "knobas-core"
edition.workspace = true
version.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
# The stores are tested against a real PostgreSQL: `test-util` exposes the
# embedded per-binary test server.
knobas-db = { path = "../knobas-db", features = ["test-util"] }
# The clones-root scan walks a real directory tree; `src/checkout.rs` itself
# touches no test-only dependency.
tempfile = "3"
tokio.workspace = true
