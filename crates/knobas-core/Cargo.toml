[package]
name = "knobas-core"
edition.workspace = true
version.workspace = true

[features]
# The test-only derives #1318 added: `Deserialize` on `builds::RunRow` and
# `PipelineRow`. Turned on by `knobas-app`'s `test-util`; off in every
# production build.
test-util = []

[dependencies]
chrono.workspace = true
# The SPI's shared types, re-exported as `payload`, `entity` and `tone`
# (#1234). `sqlx` turns on `Declarations::as_param`, the bind every
# path-driven statement here shares.
knobas-spi-types = { path = "../knobas-spi-types", features = ["sqlx"] }
serde.workspace = true
serde_json.workspace = true
# The derive behind the generated IPC mirror (`knobas-app`'s `ipc_mirror`,
# #1325): the entity (#1326), sources (#1327) and assets (#1328) barrels'
# types are declared here.
ts-rs.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing = "0.1"
uuid.workspace = true

[dev-dependencies]
# The stores are tested against a real PostgreSQL: `test-util` exposes the
# embedded per-binary test server.
knobas-db = { path = "../knobas-db", features = ["test-util"] }
# The clones-root scan walks a real directory tree; `src/checkout.rs` itself
# touches no test-only dependency.
tempfile = "3"
tokio.workspace = true
