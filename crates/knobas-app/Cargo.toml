[package]
name = "knobas-app"
edition.workspace = true
version.workspace = true

[features]
# Exposes `AppState::over_pool`, the one blessed way to put a command's state
# into a `tauri::test` mock app -- `tauri::State` cannot be constructed by hand,
# so without it a command body is unreachable and every IPC test is vacuous.
#
# A feature rather than `#[doc(hidden)]`, and gated on the feature alone rather
# than `cfg(test)` (which is set for neither this crate's own `tests/` directory
# nor a downstream crate): the constructor builds an `AppState` that owns no
# server, so a production caller would leak a postmaster on every quit. Off in
# `cargo build`, in `tauri build`, and in the `clippy --lib` half of the gate,
# which turns "a stream used the test constructor in a command" from something a
# reviewer has to notice into a compile error.
test-util = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
knobas-core = { path = "../knobas-core" }
knobas-db = { path = "../knobas-db" }
# The launcher's read side: the search command is a shim over this crate.
knobas-search = { path = "../knobas-search" }
# The SPI, for the `Source` trait the M0 registry hands to the sync engine.
knobas-source = { path = "../knobas-source" }
# M0's only adapter, and the source demo mode loads.
knobas-source-mock = { path = "../knobas-source-mock" }
knobas-sync = { path = "../knobas-sync" }
# `IpcError` is what every command rejects with, so it has to serialize.
serde.workspace = true
# The `PgPool` in `AppState`, plus demo mode's two `source_config` statements.
sqlx.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tracing = "0.1"
# Without a subscriber every `tracing` line the database layer emits -- which
# port the server came up on, whether it reused an existing data directory --
# is dropped on the floor, and `tauri dev` is exactly when those are wanted.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The sync-run log's timestamps, read back by the demo tests.
chrono.workspace = true
# Self-dev-dependency so this crate's own integration tests see
# `AppState::over_pool` (same convention as `knobas-db`'s `test_util`).
knobas-app = { path = ".", features = ["test-util"] }
# The command tests need a real PostgreSQL: `test-util` starts one per binary.
knobas-db = { path = "../knobas-db", features = ["test-util"] }
# Reads `tauri.conf.json` back, so the window settings `run` depends on cannot
# be changed in the one file without the other noticing.
serde_json.workspace = true
# `tauri::test`: the mock runtime `tests/ipc.rs` invokes commands through, so
# ruling P3's decode question is answered by the real IPC pipeline rather than
# by reading documentation. Feature-unified with the `[dependencies]` entry
# above -- `cargo test` therefore builds the library with `test` on too, which
# is how the mock runtime reaches the commands.
tauri = { version = "2", features = ["test"] }
tokio.workspace = true
