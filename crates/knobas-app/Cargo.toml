[package]
name = "knobas-app"
edition.workspace = true
version.workspace = true

[features]
# Exposes `AppState::over_pool`, the one blessed way to put a command's state
# into a `tauri::test` mock app -- `tauri::State` cannot be constructed by hand,
# so without it a command body is unreachable and every IPC test is vacuous.
#
# A feature rather than `#[doc(hidden)]`, and gated on the feature alone rather
# than `cfg(test)` (which is set for neither this crate's own `tests/` directory
# nor a downstream crate): the constructor builds an `AppState` that owns no
# server, so a production caller would leak a postmaster on every quit. Off in
# `cargo build`, in `tauri build`, and in the `clippy --lib` half of the gate,
# which turns "a stream used the test constructor in a command" from something a
# reviewer has to notice into a compile error.
test-util = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `RunConnections` is an async trait, and this crate implements it over
# `knobas_db::Connector`.
async-trait.workspace = true
# `EntityRow`'s two timestamps: `DateTime<Utc>` on the wire is RFC 3339.
chrono.workspace = true
knobas-core = { path = "../knobas-core" }
knobas-db = { path = "../knobas-db" }
# The launcher's read side: the search command is a shim over this crate.
knobas-search = { path = "../knobas-search" }
# The credential store, behind its trait. The concrete `KeyringStore` is picked
# in `sources::start`; every test gets `MemoryStore` (interfaces §3).
knobas-secrets = { path = "../knobas-secrets" }
# The SPI, for the `Source` trait the M0 registry hands to the sync engine.
knobas-source = { path = "../knobas-source" }
# One line per compiled-in adapter -- the registry in `sources/registry.rs` is
# the only place in knobas that names them, and this is its manifest half.
knobas-source-jira = { path = "../knobas-source-jira" }
knobas-source-mock = { path = "../knobas-source-mock" }
knobas-source-teamcity = { path = "../knobas-source-teamcity" }
knobas-sync = { path = "../knobas-sync" }
# `IpcError` is what every command rejects with, so it has to serialize.
serde.workspace = true
# `EntityDetail::payload` is the source record verbatim (§3a), which is a
# `serde_json::Value` all the way to the webview.
serde_json.workspace = true
# The `PgPool` in `AppState`, plus demo mode's two `source_config` statements.
sqlx.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
# The nightly backup task: `sleep` for its tick and `select!` for its
# cancellation. Everything else in this crate runs on Tauri's runtime without
# naming it; a loop that has to be stoppable cannot.
tokio.workspace = true
tokio-util = { version = "0.7", default-features = false }
# *Open in browser* (interfaces §8 P5). The first Tauri plugin in the app, and
# the one that discharges the M0 carry-over about `capabilities/default.json`
# holding only `core:default`. Pinned exactly, and to the same version as
# `@tauri-apps/plugin-opener` in `app/package.json`: the two halves speak one
# protocol, and a mismatch fails at run time with "command not found" rather
# than at build time.
tauri-plugin-opener = "=2.5.4"
tracing = "0.1"
# `unlink` takes its link id as a string off the wire and parses it, so a
# mistyped one is `invalid` rather than an argument Tauri refuses to decode at
# all -- the same treatment `get_entity` gives a malformed entity id.
uuid.workspace = true
# Without a subscriber every `tracing` line the database layer emits -- which
# port the server came up on, whether it reused an existing data directory --
# is dropped on the floor, and `tauri dev` is exactly when those are wanted.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The CRUD tests inject an adapter that refuses to connect.
async-trait.workspace = true
# The scheduler tests inject an in-memory credential store.
knobas-secrets = { path = "../knobas-secrets" }
# `knobas_sync::mirror`: the one TypeScript-mirror assertion, shared rather
# than copied -- this crate's DTOs need the same check `knobas-sync`'s do.
knobas-sync = { path = "../knobas-sync", features = ["test-util"] }
# Self-dev-dependency so this crate's own integration tests see
# `AppState::over_pool` (same convention as `knobas-db`'s `test_util`).
knobas-app = { path = ".", features = ["test-util"] }
# The command tests need a real PostgreSQL: `test-util` starts one per binary.
knobas-db = { path = "../knobas-db", features = ["test-util"] }
# `tauri::test`: the mock runtime `tests/ipc.rs` invokes commands through, so
# ruling P3's decode question is answered by the real IPC pipeline rather than
# by reading documentation. Feature-unified with the `[dependencies]` entry
# above -- `cargo test` therefore builds the library with `test` on too, which
# is how the mock runtime reaches the commands.
tauri = { version = "2", features = ["test"] }
# `tests/backup.rs` writes archives somewhere that goes away with the test.
tempfile = "3"
tokio.workspace = true
# Per-test source ids: the database is shared across a test binary, and a
# hardcoded id would make two tests each other's fixture. For the same reason a
# corpus assertion has to be scoped to a token nothing else in the binary can
# match.
uuid.workspace = true
