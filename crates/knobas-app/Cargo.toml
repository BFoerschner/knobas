[package]
name = "knobas-app"
edition.workspace = true
version.workspace = true

[features]
# Exposes `AppState::over_pool`, the one blessed way to put a command's state
# into a `tauri::test` mock app -- `tauri::State` cannot be constructed by hand,
# so without it a command body is unreachable and every IPC test is vacuous.
#
# A feature rather than `#[doc(hidden)]`, and gated on the feature alone rather
# than `cfg(test)` (which is set for neither this crate's own `tests/` directory
# nor a downstream crate): the constructor builds an `AppState` that owns no
# server, so a production caller would leak a postmaster on every quit. Off in
# `cargo build`, in `tauri build`, and in the `clippy --lib` half of the gate,
# which turns "a stream used the test constructor in a command" from something a
# reviewer has to notice into a compile error.
# The same holds for `bring_up` and `shutdown`, the app's bring-up and exit
# handler as functions a mock app can run (#1632): a production caller would skip
# `Lifecycle::begin_retry`'s claim, or stop the database outside the exit
# handler.
# It turns on knobas-core's own: the test-only derives on the Builds frame's
# DTOs, which live there (#1318).
test-util = ["knobas-core/test-util"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `RunConnections` is an async trait, and this crate implements it over
# `knobas_db::Connector`.
async-trait.workspace = true
# `EntityRow`'s two timestamps: `DateTime<Utc>` on the wire is RFC 3339.
chrono.workspace = true
knobas-core = { path = "../knobas-core" }
knobas-db = { path = "../knobas-db" }
# The hcloud importer's transport (#509). The stack every adapter shares --
# rustls with the platform roots, one rate limiter, one retry budget, one fault
# mapping -- rather than a `reqwest::Client` of this crate's own, which is the
# hole `knobas-http` exists to close (`Request` has no `send`). An importer is
# not a source (ADR-0015), but it is HTTP, and there is one HTTP stack.
knobas-http = { path = "../knobas-http" }
# The launcher's read side: the search command is a shim over this crate.
knobas-search = { path = "../knobas-search" }
# The credential store, behind its trait. The concrete `KeyringStore` is picked
# in `sources::start`; every test gets `MemoryStore` (interfaces §3).
knobas-secrets = { path = "../knobas-secrets" }
# The SPI, for the `Source` trait the M0 registry hands to the sync engine.
knobas-source = { path = "../knobas-source" }
# One line per compiled-in adapter -- the registry in `sources/registry.rs` is
# the only place in knobas that names them, and this is its manifest half.
knobas-source-confluence = { path = "../knobas-source-confluence" }
knobas-source-gitea = { path = "../knobas-source-gitea" }
knobas-source-jira = { path = "../knobas-source-jira" }
knobas-source-kuma = { path = "../knobas-source-kuma" }
knobas-source-mock = { path = "../knobas-source-mock" }
knobas-source-teamcity = { path = "../knobas-source-teamcity" }
knobas-sync = { path = "../knobas-sync" }
# External adapters (ADR-0028): a WASM component is one more `Source` the
# registry builds, beside the compiled-in rows above.
knobas-wasm-host = { path = "../knobas-wasm-host" }
# A user renderer's bytes in and its image out cross the bridge as base64
# (#2262).
base64 = "0.22"
# `IpcError` is what every command rejects with, so it has to serialize.
serde.workspace = true
# `EntityDetail::payload` is the source record verbatim (§3a), which is a
# `serde_json::Value` all the way to the webview.
serde_json.workspace = true
# The `PgPool` in `AppState`, plus demo mode's two `source_config` statements.
sqlx.workspace = true
thiserror.workspace = true
# `tracing` makes Tauri wrap every command in the spans `logging::CommandLog`
# times (#747); it adds no IPC and no permission.
tauri = { version = "2", features = ["tracing"] }
# The nightly backup task: `sleep` for its tick and `select!` for its
# cancellation. Everything else in this crate runs on Tauri's runtime without
# naming it; a loop that has to be stoppable cannot. `process` is the working
# tree read (#704): `git status` with a timeout that kills it.
tokio = { workspace = true, features = ["process", "sync"] }
tokio-util = { version = "0.7", default-features = false }
# *Open in browser* (interfaces §8 P5). The first Tauri plugin in the app, and
# the one that discharges the M0 carry-over about `capabilities/default.json`
# holding only `core:default`. Pinned exactly, and to the same version as
# `@tauri-apps/plugin-opener` in `app/package.json`: the two halves speak one
# protocol, and a mismatch fails at run time with "command not found" rather
# than at build time.
tauri-plugin-opener = "=2.5.4"
# Desktop notifications for inbox items (#290, spec #272 "Notifications").
# Pinned exactly and to the same version as `@tauri-apps/plugin-notification` in
# `app/package.json`, the discipline `tauri-plugin-opener` above records: the two
# halves speak one protocol and a mismatch fails at run time with "command not
# found" rather than at build time.
tauri-plugin-notification = "=2.4.0"
# The capture window's global shortcut (#503, spec #491 stories 40-43). Pinned
# exactly, the discipline the two plugins above record -- but for a different
# reason, and the difference is the point: **no npm half exists for this one**.
# The shortcut is registered in Rust, from the setting, at bring-up and on
# every change; the webview never calls the plugin, so `app/package.json`
# gains nothing and `capabilities/default.json` grants no
# `global-shortcut:*` permission. See `crate::capture`.
tauri-plugin-global-shortcut = "=2.3.2"
# The single-instance guard (#748): a second launch hands its arguments to the
# first, which focuses its window, and exits before the database or scheduler
# starts. Rust-only (no npm half, no capability). Pinned exactly, the discipline
# of the plugins above; 2.4.5 is the newest release older than two weeks.
tauri-plugin-single-instance = "=2.4.5"
# The click (#339). The plugin's desktop `notify` drops the `notify-rust` handle,
# so knobas sends through the crate itself and waits on the handle (`notify.rs`).
# Pinned exactly to the version `Cargo.lock` already carried for the plugin, so
# there is one copy. `preview-macos-un` is the `UNUserNotificationCenter`
# backend, Björn's ruling on the prototype's evidence; its dependency
# (`mac-usernotifications`) is target-gated to macOS in notify-rust's own
# manifest, so Linux and Windows builds do not see it. Features unify: the
# plugin's copy of the crate is on the UN backend too, which changes nothing
# knobas still calls (its permission calls never reach notify-rust).
notify-rust = { version = "=4.18.0", features = ["preview-macos-un"] }
tracing = "0.1"
# Without a subscriber every `tracing` line the database layer emits -- which
# port the server came up on, whether it reused an existing data directory --
# is dropped on the floor, and `tauri dev` is exactly when those are wanted.
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# An external adapter's origin (#1209): a manifest URL read, a release
# download's path taken apart, an artifact's URL joined beside its manifest.
# The copy `knobas-http` already resolves.
url = "2"
# A release download's tag and file, read out of their path segments, and
# a tag or file name put back into one. The copy `url` itself depends on.
percent-encoding = "2"

# `unlink` takes its link id as a string off the wire and parses it, so a
# mistyped one is `invalid` rather than an argument Tauri refuses to decode at
# all -- the same treatment `get_entity` gives a malformed entity id.
uuid.workspace = true
# The derive behind the generated IPC mirror (`src/ipc_mirror.rs`, #1325).
ts-rs.workspace = true

[target.'cfg(unix)'.dependencies]
# A user renderer (#2262, ADR-0033) runs in a process group of its own, and
# the whole group is killed at its timeout: a wrapper script's children go
# with it. The copy already in the lockfile.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# The CRUD tests inject an adapter that refuses to connect.
async-trait.workspace = true
# The scheduler tests inject an in-memory credential store.
knobas-secrets = { path = "../knobas-secrets" }
# The HTTP-level Jira mock `tests/it/adapter_to_mirror.rs` points the real adapter
# at: in-process, no Docker, and therefore fit for `just check`. A
# dev-dependency only -- nothing in the shipped binary knows mockd exists.
knobas-mockd = { path = "../knobas-mockd" }
# Self-dev-dependency so this crate's own integration tests see
# `AppState::over_pool`, `bring_up` and `shutdown` (same convention as
# `knobas-db`'s `test_util`).
knobas-app = { path = ".", features = ["test-util"] }
# The request counter (`knobas_http::counted`, #2239) the round-trip budgets
# of the live reads are asserted through. A dev-dependency only: the shipped
# binary has no counter.
knobas-http = { path = "../knobas-http", features = ["test-util"] }
# The fixture component's loader, for the registry's tests and
# `tests/it/external_adapter.rs`.
knobas-wasm-host = { path = "../knobas-wasm-host", features = ["test-util"] }
# The command tests need a real PostgreSQL: `test-util` starts one per binary.
knobas-db = { path = "../knobas-db", features = ["test-util"] }
# `tauri::test`: the mock runtime `tests/it/ipc.rs` invokes commands through, so
# ruling P3's decode question is answered by the real IPC pipeline rather than
# by reading documentation. Feature-unified with the `[dependencies]` entry
# above -- `cargo test` therefore builds the library with `test` on too, which
# is how the mock runtime reaches the commands.
tauri = { version = "2", features = ["test"] }
# The cleanup runner the live suites' `Drop` guards share (#1913): a thread
# and runtime of their own, a bound, a report.
knobas-live-cleanup = { path = "../knobas-live-cleanup" }
# `tests/start_work_live.rs` talks to the real Gitea container directly, to
# check the round trip against the *source's own* answer rather than against
# knobas' mirror of it. The workspace's one copy -- `cargo tree -i reqwest`
# stays at one.
reqwest.workspace = true
# `tests/it/backup.rs` writes archives somewhere that goes away with the test.
tempfile = "3"
# Components written as text for `tests/it/external_adapter_install.rs`'s
# refusals: one that exports no source, one built against another interface.
# The copy `knobas-wasm-host`'s tests pin, which wasmtime's own tree resolves.
wat = "=1.258.3"
# The docker-free stand-in `tests/it/adapter_to_mirror.rs` points the real Uptime
# Kuma adapter at, serving the recording that crate's own suite serves (#442).
# mockd would have been the place for it, but mockd is frozen (ADR-0013) and
# nothing new goes in. It brings no `reqwest` of its own; `cargo tree -i
# reqwest` must stay at one.
wiremock = "0.6"
tokio.workspace = true
# Per-test source ids: the database is shared across a test binary, and a
# hardcoded id would make two tests each other's fixture. For the same reason a
# corpus assertion has to be scoped to a token nothing else in the binary can
# match.
uuid.workspace = true
