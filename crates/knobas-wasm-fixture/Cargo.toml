[package]
name = "knobas-wasm-fixture"
edition.workspace = true
version.workspace = true

# The fixture external adapter (issue #1198, ADR-0028): a test adapter that the
# WASM host is tested with, built to a component by `just wasm-fixture`
# (`--target wasm32-wasip2`). It emits a fixed corpus with a cursor.
#
# It is built on the adapter SDK (`knobas-adapter-sdk`, #2028), its first
# user: it implements the SDK's `Adapter` trait over the SPI types the SDK
# re-exports, and holds no bindings or WIT conversions of its own. Its reads
# are written as their JSON and decoded into the SPI type each is. The host's
# battery run is what holds both the SDK and the fixture to the SPI.
#
# A workspace member, so the gate's fmt and clippy see it; on the host target
# it compiles to a library nothing loads.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
# The items' `updated_at`, an SPI `SyncItem` field.
chrono.workspace = true
knobas-adapter-sdk = { path = "../knobas-adapter-sdk" }
# `DeserializeOwned`, for the reads it writes as JSON.
serde.workspace = true
serde_json.workspace = true
# The guest half of `wasi:http` 0.2, for the fixture's one network read
# (#1203). Pinned to the copy Rust's own std for `wasm32-wasip2` resolves.
wasip2 = "=1.0.4"

[features]
# The same fixture built against the frozen 1.0.0 world (the SDK's
# `wit-1.0.0/`), with no `downloads`: `just wasm-fixture` builds it too, for
# the host's hold on 1.0.0 components (#1205).
v1_0 = ["knobas-adapter-sdk/v1_0"]
