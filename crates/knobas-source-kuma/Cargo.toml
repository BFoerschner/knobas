[package]
name = "knobas-source-kuma"
edition.workspace = true
version.workspace = true
license.workspace = true

# The Uptime Kuma adapter (issue #442, M4.1). Read-only: every monitor Kuma
# defines, with its current state, read from `/metrics` with an API key. It
# declares no write ops -- pause, resume and create are socket.io and are their
# own ticket -- so `Source::write` refuses everything.
#
# No `chrono`: `/metrics` carries no timestamp of any kind, so every item this
# adapter emits is undated and there is nothing here to parse an instant out of.
[dependencies]
async-trait.workspace = true
knobas-core = { path = "../knobas-core" }
knobas-http = { path = "../knobas-http" }
knobas-source = { path = "../knobas-source" }
serde.workspace = true
serde_json.workspace = true
# The socket.io channel logs a refused account at `warn` (issue #452): the
# username is the first thing a reader chasing a failed pause needs, and the
# password never reaches a line -- `Account`'s own `Debug` sees to that.
tracing = "0.1"
# One parse, for the URL a `create_monitor` asks Kuma to watch (issue #453).
# The same crate `knobas-http` vets a base URL with, and the same two schemes:
# a monitor pointed at anything else is a check that never runs, reported down
# for ever. Already in the tree through `knobas-http`, so this adds nothing to
# the lockfile.
url = "2"

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
# The docker-free stand-in for Kuma, serving a `/metrics` body recorded off the
# pinned container. `just check` and CI run no containers (roadmap §3), so the
# contract battery needs a server that answers without one; every shape it
# encodes is re-asserted in `tests/live_kuma.rs` against the real Kuma, and if
# the two disagree, the recording is what is wrong.
# It brings no `reqwest` of its own; `cargo tree -i reqwest` must stay at one.
wiremock = "0.6"
