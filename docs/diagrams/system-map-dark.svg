<?xml version="1.0" encoding="UTF-8"?>
<!-- knobas system-map (dark). Hand-authored SVG, checked against the code at main 3c3bb715 (2026-10-14). Edit both themes together. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="570" viewBox="0 0 1330 570" role="img" aria-label="knobas architecture: sources feed adapters, the sync scheduler upserts into the sync schema of one embedded Postgres, search and the Tauri app read it, and the only outbound path is the write queue flushed through the adapter's write call.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>.bx{fill:#1D2024;stroke:#3A4047;stroke-width:1}
.bx2{fill:#24282D;stroke:#3A4047;stroke-width:1}
.bxd{fill:none;stroke:#3A4047;stroke-width:1;stroke-dasharray:4 4}
.bxa{fill:#24282D;stroke:#FFB020;stroke-width:1.5}
.grp{fill:none;stroke:#2E3339;stroke-width:1}
.hl{stroke:#3A4047;stroke-width:1}
.t{fill:#E7E9EC;font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-weight:600}
.s{fill:#8B929A;font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px}
.m{fill:#E7E9EC;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.mf{fill:#808790;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}
.h{fill:#808790;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em}
.lb{fill:#8B929A;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.lba{fill:#FFB020;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.bad{fill:#FF6A5C}
.ar{fill:none;stroke:#8B929A;stroke-width:1.25}
.ara{fill:none;stroke:#FFB020;stroke-width:1.5}
.mk{fill:#8B929A}
.mka{fill:#FFB020}</style>
  <rect x="0" y="0" width="1330" height="570" rx="6" fill="#15171A"/>

  <!-- column heads -->
  <text class="h" x="20" y="36">SOURCES</text>
  <text class="h" x="260" y="36">ADAPTERS</text>
  <text class="h" x="530" y="36">BACKGROUND WORK</text>
  <text class="h" x="820" y="36">ONE DATABASE</text>
  <text class="h" x="1130" y="36">THE APP</text>
  <line class="hl" x1="20" y1="46" x2="1310" y2="46"/>

  <!-- A: sources -->
  <rect class="bx" x="20" y="80" width="160" height="40" rx="3"/>
  <text class="t" x="32" y="97">Jira DC</text><text class="s" x="32" y="112">tickets · REST v2</text>
  <rect class="bx" x="20" y="132" width="160" height="40" rx="3"/>
  <text class="t" x="32" y="149">Confluence DC</text><text class="s" x="32" y="164">pages · REST v1 + CQL</text>
  <rect class="bx" x="20" y="184" width="160" height="40" rx="3"/>
  <text class="t" x="32" y="201">Gitea</text><text class="s" x="32" y="216">repos · PRs · commits</text>
  <rect class="bx" x="20" y="236" width="160" height="40" rx="3"/>
  <text class="t" x="32" y="253">TeamCity</text><text class="s" x="32" y="268">builds</text>
  <rect class="bx" x="20" y="288" width="160" height="40" rx="3"/>
  <text class="t" x="32" y="305">Uptime Kuma</text><text class="s" x="32" y="320">monitors · /metrics</text>
  <rect class="bxd" x="20" y="340" width="160" height="40" rx="3"/>
  <text class="t" x="32" y="357">Tidewater fixture</text><text class="s" x="32" y="372">mock · loads in demo only</text>

  <text class="lb" x="220" y="70" text-anchor="middle">HTTP(S)</text>
  <line class="ar" x1="180" y1="100" x2="258" y2="100" marker-end="url(#ah)"/>
  <line class="ar" x1="180" y1="152" x2="258" y2="152" marker-end="url(#ah)"/>
  <line class="ar" x1="180" y1="204" x2="258" y2="204" marker-end="url(#ah)"/>
  <line class="ar" x1="180" y1="256" x2="258" y2="256" marker-end="url(#ah)"/>
  <line class="ar" x1="180" y1="308" x2="258" y2="308" marker-end="url(#ah)"/>
  <line class="ar" x1="180" y1="360" x2="258" y2="360" marker-end="url(#ah)" stroke-dasharray="4 4"/>
  <!-- outbound: write lands at a source -->
  <path class="ara" d="M260,452 L200,452 L200,96" marker-end="url(#aha)"/>
  <text class="lba" x="192" y="470" text-anchor="end">to the item's</text>
  <text class="lba" x="192" y="484" text-anchor="end">own source</text>

  <!-- B: adapter panel -->
  <rect class="bx" x="260" y="80" width="180" height="400" rx="3"/>
  <text class="t" x="274" y="102">Source trait</text>
  <text class="mf" x="274" y="118">knobas-source-* · one crate each</text>
  <text class="m" x="274" y="144">descriptor()</text>
  <text class="m" x="274" y="164">test_connection()</text>
  <text class="m" x="274" y="184">sync(cursor, sink)</text>
  <text class="m" x="274" y="204">reachable_transitions()</text>
  <text class="m" x="274" y="224">view()</text>
  <text class="m" x="274" y="244" style="fill:#FFB020">write(op)</text>
  <line class="hl" x1="274" y1="262" x2="426" y2="262"/>
  <text class="s" x="274" y="284">Descriptor declares kinds,</text>
  <text class="s" x="274" y="300">capabilities and the config</text>
  <text class="s" x="274" y="316">schema the Add-source form</text>
  <text class="s" x="274" y="332">is generated from.</text>
  <line class="hl" x1="274" y1="350" x2="426" y2="350"/>
  <text class="mf" x="274" y="372">knobas-http</text>
  <text class="s" x="274" y="388">retry · classify faults</text>

  <!-- keychain -->
  <rect class="bx2" x="260" y="510" width="180" height="44" rx="3"/>
  <text class="t" x="274" y="528">OS keychain</text><text class="mf" x="274" y="544">knobas-secrets</text>
  <line class="ar" x1="350" y1="510" x2="350" y2="482" marker-end="url(#ah)"/>
  <text class="lb" x="358" y="500">secrets</text>

  <!-- C: background work -->
  <rect class="bx" x="530" y="80" width="200" height="124" rx="3"/>
  <text class="t" x="544" y="100">Sync scheduler</text><text class="mf" x="544" y="115">knobas-sync</text>
  <text class="s" x="544" y="137">due 5 min after last run ends</text>
  <text class="s" x="544" y="155">≤ 3 runs, own connection each</text>
  <text class="s" x="544" y="173">fail: 1→2→5→15→60 min</text>
  <text class="s bad" x="544" y="191">401: stop, ask for password</text>

  <line class="ar" x1="440" y1="142" x2="528" y2="142" marker-end="url(#ah)"/>
  <text class="lb" x="485" y="135" text-anchor="middle">SyncItems</text>

  <line class="ar" x1="630" y1="204" x2="630" y2="288" marker-end="url(#ah)" stroke-dasharray="4 4"/>
  <text class="lb" x="638" y="240">run ended,</text>
  <text class="lb" x="638" y="255">via the tray</text>

  <rect class="bx" x="530" y="290" width="200" height="70" rx="3"/>
  <text class="t" x="544" y="310">Suggestion pass</text><text class="mf" x="544" y="325">knobas-app</text>
  <text class="s" x="544" y="345">one at a time, own connection</text>

  <rect class="bxa" x="530" y="388" width="200" height="96" rx="3"/>
  <text class="t" x="544" y="408">Write-queue flush</text><text class="mf" x="544" y="423">knobas-sync · sole caller of write()</text>
  <text class="s" x="544" y="443">re-reads target in mirror</text>
  <text class="s" x="544" y="461">moved since queued → held</text>
  <text class="s" x="544" y="479">per-entity order</text>

  <line class="ara" x1="530" y1="452" x2="442" y2="452" marker-end="url(#aha)"/>
  <text class="lba" x="485" y="445" text-anchor="middle">WriteOp</text>

  <!-- D: postgres -->
  <rect class="grp" x="820" y="56" width="220" height="508" rx="4"/>
  <text class="t" x="834" y="78">Postgres 18.6, embedded</text>
  <text class="mf" x="834" y="94">127.0.0.1 · migrations 0001–0033</text>

  <rect class="bx" x="835" y="108" width="190" height="156" rx="3"/>
  <text class="t" x="849" y="128">sync · the mirror</text>
  <text class="m" x="849" y="150">item <tspan class="mf">raw payload kept</tspan></text>
  <text class="m" x="849" y="168">item_revision</text>
  <text class="m" x="849" y="186">item_parent · item_project</text>
  <line class="hl" x1="849" y1="200" x2="1011" y2="200"/>
  <text class="m" x="849" y="220" style="fill:#9CC3FF">live_item <tspan class="mf">view</tspan></text>
  <text class="s" x="849" y="237">not tombstoned and</text>
  <text class="s" x="849" y="253">source enabled</text>

  <rect class="bx" x="835" y="280" width="190" height="276" rx="3"/>
  <text class="t" x="849" y="300">knobas · owned</text>
  <text class="m" x="849" y="324">link <tspan class="mf">proposed · confirmed</tspan></text>
  <text class="m" x="849" y="342">entity <tspan class="mf">ids · tombstones</tspan></text>
  <text class="m" x="849" y="360">context · note</text>
  <text class="m" x="849" y="378">asset · route</text>
  <text class="m" x="849" y="396">block · timer · worklog</text>
  <text class="m" x="849" y="414">heartbeat · sync_run</text>
  <text class="m" x="849" y="432">activity <tspan class="mf">append-only</tspan></text>
  <text class="m" x="849" y="454" style="fill:#FFB020">write_queue</text>
  <text class="m" x="849" y="476">inbox_state · smart_list</text>
  <text class="m" x="849" y="494">source_config · setting</text>
  <line class="hl" x1="849" y1="508" x2="1011" y2="508"/>
  <text class="s" x="849" y="528">Never written to a source,</text>
  <text class="s" x="849" y="544">except via write_queue.</text>

  <!-- C to D -->
  <line class="ar" x1="730" y1="142" x2="833" y2="142" marker-end="url(#ah)"/>
  <text class="lb" x="777" y="135" text-anchor="middle">upsert</text>
  <text class="lb" x="777" y="160" text-anchor="middle">sweep→tomb</text>
  <line class="ar" x1="730" y1="320" x2="833" y2="320" marker-end="url(#ah)"/>
  <text class="lb" x="777" y="313" text-anchor="middle">proposes</text>
  <line class="ara" x1="835" y1="450" x2="732" y2="450" marker-end="url(#aha)"/>
  <text class="lba" x="777" y="443" text-anchor="middle">due rows</text>

  <!-- E: app -->
  <rect class="bx" x="1130" y="108" width="180" height="84" rx="3"/>
  <text class="t" x="1144" y="128">knobas-search</text>
  <text class="s" x="1144" y="148">FTS over live items, notes,</text>
  <text class="s" x="1144" y="164">assets and routes</text>
  <text class="mf" x="1144" y="182">p90 &lt; 100 ms · search-perf</text>
  <line class="ar" x1="1025" y1="150" x2="1128" y2="150" marker-end="url(#ah)"/>
  <text class="lb" x="1077" y="143" text-anchor="middle">reads</text>

  <line class="ar" x1="1220" y1="192" x2="1220" y2="222" marker-end="url(#ah)"/>

  <rect class="bx" x="1130" y="224" width="180" height="150" rx="3"/>
  <text class="t" x="1144" y="244">knobas-app</text>
  <text class="mf" x="1144" y="259">Tauri commands · events</text>
  <text class="s" x="1144" y="282">links, notes, contexts</text>
  <text class="s" x="1144" y="299">timer, blocks, assets</text>
  <text class="s" x="1144" y="316">estate, time, inbox</text>
  <text class="s" x="1144" y="340" style="fill:#FFB020">submit_write → queue</text>
  <text class="mf" x="1144" y="360">uses knobas-core</text>

  <line class="ar" x1="1130" y1="300" x2="1027" y2="300" marker-end="url(#ah)"/>
  <text class="lb" x="1077" y="293" text-anchor="middle">writes</text>
  <line class="ara" x1="1130" y1="336" x2="1080" y2="336" />
  <path class="ara" d="M1080,336 L1080,450 L1027,450" marker-end="url(#aha)"/>
  <text class="lba" x="1088" y="400">enqueue</text>

  <line class="ar" x1="1220" y1="376" x2="1220" y2="406" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="lb" x="1228" y="395">invoke · events</text>

  <rect class="bx" x="1130" y="408" width="180" height="146" rx="3"/>
  <text class="t" x="1144" y="428">Svelte window</text>
  <text class="mf" x="1144" y="443">app/src</text>
  <text class="s" x="1144" y="466">Launcher ⌘K</text>
  <text class="s" x="1144" y="484">Rooms · tiles · tray</text>
  <text class="s" x="1144" y="502">Detail · Inbox · Time</text>
  <text class="s" x="1144" y="520">Assets tree</text>
  <text class="s" x="1144" y="538">Capture window</text>
</svg>
