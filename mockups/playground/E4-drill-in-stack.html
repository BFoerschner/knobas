<!doctype html>
<!--
knobas playground
example: E4 Drill-in stack
design: D1 Signal
thesis: Depth stops being a diagram problem when only one level is ever on screen — every level is the same full-width board, so level 9 reads exactly like level 1.
thesis: The board slides left and the opened card's contents become the new board, while a split-flap depth cell flips to prove where you landed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — drill-in stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15171A; --panel:#1D2024; --raised:#24282D; --line:#2E3339; --line2:#3A4047;
  --text:#E7E9EC; --muted:#8B929A; --faint:#5A6169;
  --amber:#FFB020; --fail:#FF6A5C; --ok:#7FD1A1; --link:#9CC3FF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);overflow:hidden}
h1,h2,h3,p,dl,dd,dt{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}
input,select,textarea{font:12px/1.4 var(--mono);color:var(--text);background:#101215;border:1px solid var(--line2);border-radius:2px;padding:6px 8px;width:100%}
input::placeholder,textarea::placeholder{color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:600 10px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow .n{font-family:var(--mono);font-size:9.5px;letter-spacing:0;color:var(--faint);margin-left:5px}
.btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line2);border-radius:2px;
     font:500 11.5px var(--sans);background:var(--raised);white-space:nowrap;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--amber);color:#17120A;border-color:var(--amber);font-weight:600}
.btn.pri:hover{background:#FFC04D;border-color:#FFC04D}
.btn.quiet{background:none;color:var(--muted)}
.btn.quiet:hover{color:var(--text)}

/* ---------- lamp + monogram: the two identity marks ---------- */
.lamp{width:11px;height:11px;flex:0 0 11px;border:1px solid var(--line2);border-radius:1px;display:inline-grid;place-items:center;background:#101215}
.lamp::after{content:"";width:5px;height:5px;border-radius:1px;background:currentColor}
.s-up{color:var(--ok)} .s-warn{color:var(--amber)} .s-down{color:var(--fail)} .s-none{color:var(--faint)}
.s-warn.lamp,.s-down.lamp{border-color:currentColor}
.mg{font:500 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);background:var(--raised);
    border:1px solid var(--line);border-radius:2px;padding:3px 4px}
.mg.big{font-size:11px;padding:4px 5px}

/* ---------- split-flap cell (D1 signature) ---------- */
.flap{position:relative;display:inline-block;min-width:54px;text-align:center;padding:3px 7px;
      font:500 10.5px/1.1 var(--mono);letter-spacing:.1em;background:var(--raised);border:1px solid var(--line);
      border-radius:2px;overflow:hidden;perspective:90px;color:var(--muted)}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--bg);opacity:.85;pointer-events:none}
.flap.f-up{color:var(--ok)} .flap.f-warn{color:var(--amber)} .flap.f-down{color:var(--fail)}
.flap-leaf{position:absolute;left:0;top:0;width:100%;height:50%;overflow:hidden;padding:3px 7px;
           background:var(--raised);transform-origin:50% 100%;backface-visibility:hidden;text-align:center;color:inherit}
.flap-leaf.go{transform:rotateX(-92deg);transition:transform 200ms cubic-bezier(.4,0,.65,1)}

/* ---------- app frame ---------- */
#app{height:100%;display:grid;grid-template-rows:40px 38px minmax(0,1fr) 24px;grid-template-columns:minmax(0,1fr) 348px}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:600 15px var(--cond);letter-spacing:.2em;text-transform:uppercase}
.tag{font:400 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
     border-left:1px solid var(--line2);padding-left:12px}
.tick{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font:400 11px var(--mono);color:var(--amber);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity 120ms linear}
.tick i{font-style:normal;font-size:9px;opacity:.8}
.tick.dim{opacity:0}
.search{position:relative;width:264px;flex:0 0 auto}
.search input{height:24px;padding:0 8px;font-size:11.5px}
.results{position:absolute;top:27px;right:0;width:440px;max-height:330px;overflow:auto;z-index:30;
         background:var(--panel);border:1px solid var(--line2);border-radius:2px}
.res{display:grid;grid-template-columns:11px 26px minmax(0,1fr);gap:8px;align-items:center;width:100%;
     padding:6px 9px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res.on{background:var(--raised)}
.res .rn{font:600 13px var(--cond);letter-spacing:.02em}
.res .rp{display:block;font:400 9.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res mark{background:none;color:var(--amber)}
.res-none{padding:9px;font:400 11px var(--mono);color:var(--faint)}

/* ---------- breadcrumb bar ---------- */
.crumbbar{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{width:26px;height:24px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:2px;
     color:var(--muted);font-size:14px;line-height:1;background:var(--raised);flex:0 0 auto}
.nav:hover:not(:disabled){color:var(--text);border-color:var(--muted)}
.nav:disabled{opacity:.32;cursor:default}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;
        scrollbar-width:none;white-space:nowrap;padding:1px 0}
.crumbs::-webkit-scrollbar{height:0}
.crumb{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 7px;border-radius:2px;
       font:500 13px var(--cond);letter-spacing:.03em;color:var(--muted);border:1px solid transparent}
.crumb:hover{color:var(--text);background:var(--raised)}
.crumb .cmg{font:400 9px var(--mono);color:var(--faint);letter-spacing:.06em}
.crumb.here{color:var(--amber);border-color:#4A3A17;background:#231C0D;cursor:default}
.crumb.here:hover{background:#231C0D}
.csep{flex:0 0 auto;color:var(--faint);font-size:10px;user-select:none}

/* ---------- the stack stage ---------- */
#stage{grid-row:3;grid-column:1;position:relative;overflow:hidden;border-right:1px solid var(--line)}
.level{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.level.lv-in{transform:translateX(var(--dx));opacity:0}
.level.lv-in.lv-on,.level.lv-out{transition:transform 200ms cubic-bezier(.22,.72,.28,1),opacity 150ms linear}
.level.lv-in.lv-on{transform:translateX(0);opacity:1}
.level.lv-out{transform:translateX(var(--dx));opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .level.lv-in,.level.lv-in.lv-on,.level.lv-out{transform:none!important;opacity:1;transition:none!important}
  .flap-leaf{display:none}
  .card.flash{animation:none!important}
}

/* ---------- level header: the asset you are standing in ---------- */
.lvhead{flex:0 0 auto;padding:13px 16px 11px;border-bottom:1px solid var(--line);background:var(--panel)}
.lh-1{display:flex;align-items:center;gap:9px;min-width:0}
.lh-1 h1{font:600 22px/1 var(--cond);letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh-type{font:600 10px var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);flex:0 0 auto}
.lh-1 .sp{flex:1}
.lh-sub{margin-top:5px;font:400 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routes{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.rgroup{min-width:0}
.rgroup .eyebrow{padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.rrow{display:grid;align-items:center;gap:0 8px;height:26px;border-bottom:1px solid #23262B;min-width:0}
.rrow:last-child{border-bottom:0}
.rrow.exp{grid-template-columns:minmax(0,2fr) 10px minmax(0,1.15fr) minmax(0,1.5fr)}
.rrow.via{grid-template-columns:minmax(0,.9fr) 10px minmax(0,2fr) minmax(0,1.5fr)}
.rurl{font:400 11px var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rurl.q{color:var(--muted)}
.arrow{color:var(--faint);font-size:10px;text-align:center}
.tgt{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%;font:500 11.5px var(--sans);color:var(--link);
     border-bottom:1px solid transparent;padding:1px 0}
.tgt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgt i{font-style:normal;font-size:10px;color:var(--faint);flex:0 0 auto}
.tgt:hover{border-bottom-color:var(--link)}
.tgt:hover i{color:var(--link)}
.tgt.dead{color:var(--faint);cursor:default;border-bottom:0}
.rnote{font:400 10.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnote b{color:var(--muted);font-weight:400}
.holds{font:400 10px var(--mono);color:var(--faint)}

/* ---------- "inside here" summary strip ---------- */
.insidebar{flex:0 0 auto;display:flex;align-items:center;gap:9px;height:27px;padding:0 16px;
           border-bottom:1px solid var(--line);background:#191C20}
.ib-k{font:600 10px var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.ib-n{font:500 11px var(--mono);color:var(--text)}
.ib-t{font:400 10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ib-p{font:500 10.5px var(--mono);white-space:nowrap}
.ib-p.d{color:var(--fail)} .ib-p.w{color:var(--amber)} .ib-p.c{color:var(--faint)}

/* ---------- the board of children ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:10px;padding:13px 16px 22px;align-content:start}
.card{position:relative;display:flex;flex-direction:column;gap:5px;min-height:152px;padding:10px 11px 9px;
      background:var(--panel);border:1px solid var(--line);border-radius:2px;cursor:pointer}
.card:hover{border-color:var(--line2);background:#20242A}
.card.st-down{border-color:#4A2C29}
.card.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.card.flash{animation:flash 1000ms ease-out 1}
@keyframes flash{0%,45%{box-shadow:inset 0 0 0 1px var(--amber)}100%{box-shadow:inset 0 0 0 1px transparent}}
.c-top{display:flex;align-items:center;gap:7px;min-width:0}
.c-name{flex:1;min-width:0;font:600 16px/1.1 var(--cond);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-count{display:inline-flex;align-items:baseline;gap:4px;font:600 9px var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);flex:0 0 auto}
.c-count b{font:500 11px var(--mono);letter-spacing:0;color:var(--muted)}
.c-count.z b{color:var(--faint)}
.c-type{font:600 9.5px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-left:18px}
.c-sub{flex:1;font:400 11px/1.42 var(--mono);color:var(--muted);padding-left:18px;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-badges{display:flex;gap:5px;padding-left:18px;min-height:15px;flex-wrap:wrap}
.badge{font:600 9px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:3px 5px;border-radius:2px;border:1px solid}
.badge.d{color:var(--fail);border-color:#4A2C29;background:#241A19}
.badge.w{color:var(--amber);border-color:#463618;background:#221C10}
.c-foot{display:flex;align-items:center;gap:8px;padding-top:7px;border-top:1px solid #23262B;min-width:0}
.chips{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;flex:0 1 auto;min-width:0;max-width:132px;padding:2px 5px;border:1px solid var(--line);
      border-radius:2px;font:400 10px var(--mono);color:var(--muted);overflow:hidden}
.chip b{font-weight:400;color:var(--faint);letter-spacing:.06em;flex:0 0 auto}
.chip s{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.dn{color:var(--fail);border-color:#412825}
.chip.wn{color:var(--amber);border-color:#3E3218}
.chip.more{flex:0 0 auto;color:var(--faint);border-style:dashed}
.chips.empty{font:400 10px var(--mono);color:var(--faint);letter-spacing:.04em}
.open{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 7px;border:1px solid var(--line2);
      border-radius:2px;background:var(--raised);font:600 9.5px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.open i{font-style:normal;font-size:11px;letter-spacing:0}
.card:hover .open{color:var(--text);border-color:var(--muted)}
.card.sel .open{color:var(--amber);border-color:#4A3A17}
.card.new{display:grid;place-items:center;gap:6px;align-content:center;border-style:dashed;border-color:var(--line2);
          background:transparent;color:var(--faint)}
.card.new:hover{border-color:var(--amber);color:var(--amber);background:transparent}
.card.new .plus{font:400 20px/1 var(--mono)}
.card.new .lbl{font:600 10px var(--cond);letter-spacing:.16em;text-transform:uppercase}
.emptynote{grid-column:1/-1;font:400 11px var(--mono);color:var(--faint);padding:2px 0 4px}

/* ---------- right panel ---------- */
#panel{grid-row:3;grid-column:2;background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
.p-head{padding:13px 14px 12px;border-bottom:1px solid var(--line)}
.p-title{display:flex;align-items:center;gap:8px;margin-top:7px;min-width:0}
.p-title h2{flex:1;min-width:0;font:600 19px/1 var(--cond);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-meta{display:flex;align-items:center;gap:9px;margin-top:8px}
.p-meta .t{font:600 10px var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.p-sub{margin-top:8px;font:400 11px/1.5 var(--mono);color:var(--muted)}
.p-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.p-sec{padding:11px 14px 12px;border-bottom:1px solid var(--line)}
.p-sec .eyebrow{display:block;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:6px}
.kv{display:grid;grid-template-columns:minmax(74px,auto) minmax(0,1fr);gap:0 10px}
.kv dt{font:400 10.5px/22px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv dd{font:400 10.5px/22px var(--mono);color:var(--text);overflow-wrap:anywhere}
.prow{padding:5px 0;border-bottom:1px solid #23262B}
.prow:last-child{border-bottom:0}
.prow .u{display:block;font:400 10.5px var(--mono);color:var(--text);overflow-wrap:anywhere}
.prow .u.q{color:var(--muted)}
.prow .to{display:flex;align-items:center;gap:5px;margin-top:3px;font:400 10px var(--mono);color:var(--faint)}
.prow .nt{display:block;margin-top:2px;font:400 10px/1.4 var(--mono);color:var(--faint)}
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:11px 24px minmax(0,1fr);gap:8px;align-items:center;width:100%;padding:5px 0;border-bottom:1px solid #23262B}
.pitem:last-child{border-bottom:0}
.pitem:hover .pn{color:var(--link)}
.pitem .pn{font:500 13px var(--cond);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pitem .pp{font:400 9.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.none{font:400 10.5px var(--mono);color:var(--faint)}
.hint{padding:12px 14px;font:400 10.5px/1.65 var(--mono);color:var(--faint)}
.hint kbd{font:500 10px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:2px;padding:1px 4px;background:var(--raised)}

/* ---------- status bar ---------- */
.statusbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);
           border-top:1px solid var(--line);font:400 10px var(--mono);color:var(--faint);letter-spacing:.03em;overflow:hidden;white-space:nowrap}
.statusbar b{font-weight:400;color:var(--muted)}
.statusbar .sp{flex:1}

/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,10,12,.74);display:grid;place-items:center;z-index:60;padding:24px}
.dlg{width:560px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;background:var(--panel);
     border:1px solid var(--line2);border-radius:2px}
.dlg header{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.dlg header h3{flex:1;font:600 16px var(--cond);letter-spacing:.05em;text-transform:uppercase}
.dlg header .where{font:400 10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.dlg .body{padding:13px 14px;overflow-y:auto}
.dlg footer{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.dlg footer .sp{flex:1}
.f{margin-bottom:11px}
.f>.eyebrow{display:block;margin-bottom:5px}
.f-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.sugg button{padding:3px 7px;border:1px solid var(--line2);border-radius:2px;font:400 10.5px var(--mono);color:var(--muted);background:var(--raised)}
.sugg button:hover{color:var(--amber);border-color:#4A3A17}
.sugg .lb{font:600 9.5px/20px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.err{font:400 10.5px var(--mono);color:var(--fail);margin-top:5px;min-height:14px}
.fine{font:400 10px/1.5 var(--mono);color:var(--faint);margin-top:5px}
select{appearance:none;padding-right:24px;background-repeat:no-repeat;background-position:right 8px center;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'><path d='M1 1.2 4.5 4.7 8 1.2' fill='none' stroke='%238B929A' stroke-width='1.2' stroke-linecap='round'/></svg>")}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">knobas</span>
    <span class="tag">E4 drill-in stack</span>
    <span class="tick" id="tick"><i>&#9656;</i><span id="tickTxt"></span></span>
    <div class="search">
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="/  search assets, types, routes" aria-label="Search assets and routes" aria-expanded="false" aria-controls="results">
      <div class="results" id="results" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <button class="btn quiet" id="reset" title="Restore the example data and clear anything you added">Reset</button>
  </div>

  <div class="crumbbar">
    <button class="nav" id="back" title="Go up one level (Esc)" aria-label="Go up one level">&#8249;</button>
    <button class="nav" id="totop" title="Go to the top (Alt + Up arrow)" aria-label="Go to the top level">&#10514;</button>
    <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
    <span class="flap" id="depth" title="How deep you are">LVL 01</span>
  </div>

  <main id="stage"></main>
  <aside id="panel" aria-label="Detail"></aside>

  <div class="statusbar" id="statusbar"></div>
</div>
<div id="modal"></div>
<span class="sr" id="live" aria-live="polite"></span>

<script>
const TYPES = {
  site:       {mg:'DC',label:'Site',              kids:['hypervisor','network','proxy']},
  hypervisor: {mg:'HV',label:'Hypervisor',        kids:['vm']},
  vm:         {mg:'VM',label:'Virtual machine',   kids:['engine','service','db','proxy']},
  engine:     {mg:'EN',label:'Container engine',  kids:['container']},
  container:  {mg:'CT',label:'Container',         kids:['service','runtime','db','proxy']},

/* =========================================================================
   E4 — drill-in stack.  One level at a time, full width.
   S.path is the whole story: [root ... current].  Everything renders from it.
   ========================================================================= */
const LS = 'knobas-e4-drill-in-stack';
let N = {}, R = [], KIDX = {}, STAT = {};
const S = { path:['dc'], sel:null, seq:1 };
let navSeq = 0, resList = [], resIdx = -1;

const $  = s => document.querySelector(s);
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = t => TYPES[t] || {mg:(t||'??').slice(0,2).toUpperCase(), label:t||'custom', kids:[]};
const kids = id => KIDX[id] || [];
const cur = () => N[S.path[S.path.length-1]];

function reindex(){
  KIDX = {}; STAT = {};
  for(const id in N){ const p = N[id].parent || '__root'; (KIDX[p] || (KIDX[p]=[])).push(N[id]); }
}
function statOf(id){
  if(STAT[id]) return STAT[id];
  let total=0, down=0, warn=0;
  STAT[id] = {total:0,down:0,warn:0};                       /* cycle guard */
  for(const k of kids(id)){
    const s = statOf(k.id);
    total += 1 + s.total;
    down  += (k.status==='down'?1:0) + s.down;
    warn  += (k.status==='warn'?1:0) + s.warn;
  }
  return STAT[id] = {total,down,warn};
}
function pathOf(id){ const p=[]; let n=N[id], guard=0; while(n && guard++<64){ p.unshift(n.id); n = n.parent ? N[n.parent] : null; } return p; }
function exposedBy(id){ return R.filter(r => r.from === id); }
function reach(id){
  const out = [];
  R.forEach(r => { if(r.target === id) out.push({r, holder:null}); });
  const anc = pathOf(id).slice(0,-1);
  for(let i=anc.length-1; i>=0; i--) R.forEach(r => { if(r.target === anc[i]) out.push({r, holder:N[anc[i]]}); });
  return out;
}
function problemsIn(id, cap){
  const out=[];
  (function walk(pid){ for(const k of kids(pid)){ if(k.status==='down'||k.status==='warn') out.push(k); walk(k.id); } })(id);
  out.sort((a,b)=> (a.status==='down'?0:1) - (b.status==='down'?0:1));
  return cap ? out.slice(0,cap) : out;
}
function trail(id){ return pathOf(id).map(i => N[i] ? N[i].name : i).join(' › '); }

/* ---------- seed / persist ---------- */
function seed(){
  N = {}; R = [];
  SEED_NODES.forEach(a => { N[a[0]] = {id:a[0],type:a[1],name:a[2],sub:a[3],status:a[4],parent:a[5],props:Object.assign({},a[6]||{})}; });
  SEED_ROUTES.forEach(a => R.push({id:a[0],from:a[1],url:a[2],target:a[3],note:a[4]}));
  S.path = ['dc']; S.sel = null; S.seq = 1;
  reindex();
}
function persist(){
  try{ localStorage.setItem(LS, JSON.stringify({N,R,path:S.path,seq:S.seq})); }catch(e){}
}
function restore(){
  try{
    const d = JSON.parse(localStorage.getItem(LS) || 'null');
    if(!d || !d.N || !d.N.dc) return false;
    N = d.N; R = d.R || []; S.seq = d.seq || 1; reindex();
    const p = (d.path||['dc']).filter(id => N[id]);
    S.path = p.length ? p : ['dc'];
    return true;
  }catch(e){ return false; }
}

/* ---------- split-flap cell (the one piece of D1 motion) ---------- */
function setFlap(el, val, cls){
  if(!el) return;
  el.className = 'flap' + (cls ? ' ' + cls : '');
  const old = el.dataset.v || '';
  if(old === val){ el.dataset.v = val; return; }
  el.dataset.v = val;
  el.textContent = val;
  if(reduced() || !old) return;
  const leaf = document.createElement('span');
  leaf.className = 'flap-leaf'; leaf.textContent = old;
  el.appendChild(leaf);
  requestAnimationFrame(() => leaf.classList.add('go'));
  setTimeout(() => leaf.remove(), 260);
}
let tickTimer = 0;
function tick(msg){
  const w = $('#tick'), t = $('#tickTxt');
  clearTimeout(tickTimer);
  if(reduced()){ t.textContent = msg; return; }
  w.classList.add('dim');
  tickTimer = setTimeout(() => { t.textContent = msg; w.classList.remove('dim'); }, 120);
}
function say(msg){ $('#live').textContent = msg; }

function lampHTML(st){ return '<span class="lamp s-'+(st||'none')+'" aria-hidden="true"></span>'; }
function statusFlapClass(st){ return st==='up'?'f-up':st==='warn'?'f-warn':st==='down'?'f-down':''; }

function tgtHTML(id){
  const n = N[id];
  if(!n) return '<span class="tgt dead">(missing)</span>';
  return '<button class="tgt" data-act="goto" data-id="'+esc(id)+'" title="Drill to '+esc(trail(id))+'"><span>'+esc(n.name)+'</span><i>⤵</i></button>';
}
function expRowHTML(r){
  return '<div class="rrow exp">'
    + '<span class="rurl">'+esc(r.url)+'</span><span class="arrow">→</span>'
    + (r.target ? tgtHTML(r.target) : '<span class="tgt dead">endpoint · no target</span>')
    + '<span class="rnote">'+esc(r.note||'')+'</span></div>';
}
function viaRowHTML(v, meId){
  const land = v.holder
    ? 'lands on <b>'+esc(v.holder.name)+'</b>, which holds this'
    : 'lands on this asset';
  return '<div class="rrow via">'
    + (N[v.r.from] ? tgtHTML(v.r.from) : '<span class="tgt dead">'+esc(v.r.from)+'</span>')
    + '<span class="arrow">→</span>'
    + '<span class="rurl q">'+esc(v.r.url)+'</span>'
    + '<span class="rnote">'+land+'</span></div>';
}
function headHTML(n){
  const exp = exposedBy(n.id), via = reach(n.id);
  let routes = '';
  if(exp.length || via.length){
    let g = '';
    if(exp.length) g += '<div class="rgroup"><div class="eyebrow">Exposes<span class="n">'+exp.length+'</span></div>'
      + exp.slice(0,9).map(expRowHTML).join('')
      + (exp.length>9 ? '<div class="rrow exp"><span class="rnote">+'+(exp.length-9)+' more</span></div>' : '') + '</div>';
    if(via.length) g += '<div class="rgroup"><div class="eyebrow">Reachable via<span class="n">'+via.length+'</span></div>'
      + via.slice(0,6).map(v => viaRowHTML(v, n.id)).join('') + '</div>';
    routes = '<div class="routes">'+g+'</div>';
  }
  return '<div class="lvhead">'
    + '<div class="lh-1">'+lampHTML(n.status)+'<span class="mg big">'+esc(T(n.type).mg)+'</span>'
    + '<h1>'+esc(n.name)+'</h1><span class="lh-type">'+esc(T(n.type).label)+'</span>'
    + '<span class="flap '+statusFlapClass(n.status)+'" data-v="'+esc((n.status||'none').toUpperCase())+'">'+esc((n.status||'none').toUpperCase())+'</span>'
    + '<span class="sp"></span>'
    + '<button class="btn" data-act="route" data-id="'+esc(n.id)+'">↳ Expose a route</button>'
    + '</div>'
    + (n.sub ? '<p class="lh-sub">'+esc(n.sub)+'</p>' : '')
    + routes + '</div>';

/* =========================================================================
   The stack move: board slides out, the card's contents slide in
   ========================================================================= */
function swap(dir, focusCard){
  const stage = $('#stage');
  stage.querySelectorAll('.level.lv-out').forEach(e => e.remove());
  const old = stage.querySelector('.level');
  const fresh = buildLevel();
  updateChrome();
  if(reduced() || !old){
    stage.replaceChildren(fresh);
    if(focusCard) { const c = fresh.querySelector('.card'); if(c) c.focus(); }
    return;
  }
  fresh.classList.add('lv-in');
  fresh.style.setProperty('--dx', (dir>0 ? 46 : -46) + 'px');
  old.style.setProperty('--dx', (dir>0 ? -46 : 46) + 'px');
  stage.appendChild(fresh);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fresh.classList.add('lv-on'); old.classList.add('lv-out');
  }));
  setTimeout(() => {
    old.remove();
    fresh.classList.remove('lv-in','lv-on'); fresh.style.removeProperty('--dx');
    if(focusCard){ const c = fresh.querySelector('.card'); if(c) c.focus(); }
  }, 215);
}
function refreshLevel(flashId){
  const stage = $('#stage');
  stage.replaceChildren(buildLevel());
  updateChrome();
  if(flashId){
    const el = stage.querySelector('[data-card="'+CSS.escape(flashId)+'"]');
    if(el){ el.classList.add('flash'); el.scrollIntoView({block:'nearest', behavior: reduced()?'auto':'smooth'}); }
  }
}
function navigate(target, opts){
  opts = opts || {};
  target = target.filter(id => N[id]);
  if(!target.length) return;
  const tok = ++navSeq;
  const from = S.path.slice();
  let c = 0; while(c < from.length && c < target.length && from[c] === target[c]) c++;
  const steps = (from.length - c) + (target.length - c);
  if(steps === 0){ if(S.sel !== null){ S.sel = null; refreshLevel(); } return; }
  S.sel = opts.sel || null;
  const hop = !reduced() && steps > 1 && steps <= 7;
  if(!hop){
    S.path = target.slice();
    swap(target.length >= from.length ? 1 : -1, opts.kbd);
    landed();
    return;
  }
  (function run(){
    if(tok !== navSeq) return;
    if(S.path.length > c){ S.path = S.path.slice(0,-1); swap(-1); }
    else if(S.path.length < target.length){ S.path = target.slice(0, S.path.length+1); swap(1); }
    else { if(opts.kbd){ const el = $('#stage .card'); if(el) el.focus(); } landed(); return; }
    setTimeout(run, 132);
  })();
}
function landed(){
  /* the crumb bar and the depth flap already say where you are — the amber ticker
     is kept for things that actually changed, so amber stays rare. */
  const n = cur();
  say('Level ' + S.path.length + ': ' + n.name + ', ' + kids(n.id).length + ' inside');
}

/* =========================================================================
   Search — / focuses, Enter drills to the first match
   ========================================================================= */
function matches(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const ord = {}; Object.keys(N).forEach((k,i) => ord[k] = i);
  const out = [], seen = {};
  for(const id in N){
    const n = N[id], name = (n.name||'').toLowerCase();
    let score = 0, why = T(n.type).label;
    if(name.startsWith(q)) score = 100;
    else if(name.includes(q)) score = 82;
    else if((n.type||'').toLowerCase().includes(q)) score = 58;
    else if((n.sub||'').toLowerCase().includes(q)){ score = 44; why = n.sub; }
    else { for(const k in n.props){ if(k.toLowerCase().includes(q) || String(n.props[k]).toLowerCase().includes(q)){ score = 30; why = k+' = '+n.props[k]; break; } } }
    if(score){ out.push({id, score, why}); seen[id] = 1; }
  }
  R.forEach(r => {
    if(r.url.toLowerCase().includes(q) || (r.note||'').toLowerCase().includes(q)){
      const id = r.target && N[r.target] ? r.target : r.from;
      if(N[id] && !seen[id]){ out.push({id, score:22, why:'route '+r.url}); seen[id] = 1; }
    }
  });
  out.sort((a,b) => b.score - a.score || ord[a.id] - ord[b.id]);
  return out.slice(0,10);
}
function markName(name, q){
  const i = name.toLowerCase().indexOf(q.trim().toLowerCase());
  if(i < 0 || !q.trim()) return esc(name);
  const L = q.trim().length;
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i,i+L)) + '</mark>' + esc(name.slice(i+L));
}
function renderResults(){
  const box = $('#results'), q = $('#q').value;
  resList = matches(q);
  if(!q.trim()){ hideResults(); return; }
  box.hidden = false; $('#q').setAttribute('aria-expanded','true');
  if(!resList.length){ box.innerHTML = '<p class="res-none">Nothing matches "'+esc(q)+'".</p>'; return; }
  box.innerHTML = resList.map((m,i) => {
    const n = N[m.id];
    return '<button class="res'+(i===resIdx?' on':'')+'" role="option" aria-selected="'+(i===resIdx)+'" data-act="hit" data-i="'+i+'">'
      + lampHTML(n.status) + '<span class="mg">'+esc(T(n.type).mg)+'</span>'
      + '<span><span class="rn">'+markName(n.name,q)+'</span>'
      + '<span class="rp">'+esc(trail(m.id))+'  ·  '+esc(m.why)+'</span></span></button>';
  }).join('');
}

function moveCardFocus(from, key){
  const board = document.querySelector('#stage .level:not(.lv-out) .board');
  if(!board) return;
  const cards = Array.prototype.slice.call(board.querySelectorAll('.card'));
  const i = cards.indexOf(from); if(i < 0) return;
  let cols = 1;
  try{ cols = Math.max(1, getComputedStyle(board).gridTemplateColumns.split(' ').filter(Boolean).length); }catch(e){}
  let j = i;
  if(key === 'ArrowRight') j = i+1;
  else if(key === 'ArrowLeft') j = i-1;
  else if(key === 'ArrowDown') j = i+cols;
  else if(key === 'ArrowUp') j = i-cols;
  if(j >= 0 && j < cards.length) cards[j].focus();
}

  if(a){
    const act = a.dataset.act, id = a.dataset.id;
    if(act === 'drill'){ e.stopPropagation(); drill(id); return; }
    if(act === 'goto'){ navigate(pathOf(id)); return; }
    if(act === 'new'){ openCreate(id); return; }
    if(act === 'route'){ openRoute(id); return; }
    if(act === 'crumb'){
      const i = +a.dataset.i;
      if(i === S.path.length-1){ deselect(); return; }
      navigate(S.path.slice(0, i+1));
      return;
    }
    if(act === 'close'){ closeModal(); return; }
    if(act === 'do-create'){ doCreate(); return; }
    if(act === 'do-route'){ doRoute(); return; }
    if(act === 'sugg'){ const f = $('#fType'); f.value = a.dataset.t; f.focus(); return; }
    if(act === 'hit'){ takeHit(+a.dataset.i); return; }
  }
  if(e.target.hasAttribute && e.target.hasAttribute('data-scrim')){ closeModal(); return; }
  const card = e.target.closest('#stage .card[data-card]');
  if(card){ select(card.dataset.card); return; }
  if(!e.target.closest('.search')) hideResults();
});

document.addEventListener('dblclick', e => {
  const card = e.target.closest('#stage .card[data-card]');
  if(card) drill(card.dataset.card);
});

document.addEventListener('keydown', e => {
  const t = e.target;
  const field = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');

  if(e.key === 'Escape'){
    if(modalOpen()){ e.preventDefault(); closeModal(); return; }
    if(!$('#results').hidden){ e.preventDefault(); hideResults(); $('#q').blur(); return; }
    if(deselect()){ e.preventDefault(); return; }
    if(S.path.length > 1){ e.preventDefault(); goUp(true); }
    return;
  }
  if(modalOpen()){
    if(e.key === 'Tab'){
      const f = Array.prototype.slice.call($('.dlg').querySelectorAll('input,select,textarea,button'));
      if(!f.length) return;
      const first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    if(e.key === 'Enter' && t.tagName === 'INPUT'){
      e.preventDefault();
      if($('.dlg').dataset.from !== undefined) doRoute(); else doCreate();
    }
    return;
  }
  if(t && t.id === 'q'){
    if(e.key === 'ArrowDown'){ e.preventDefault(); resIdx = Math.min(resIdx+1, resList.length-1); renderResults(); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); resIdx = Math.max(resIdx-1, 0); renderResults(); return; }
    if(e.key === 'Enter'){ e.preventDefault(); takeHit(resIdx < 0 ? 0 : resIdx); return; }
    return;
  }
  if(field) return;

  if(e.key === '/'){ e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if(e.altKey && e.key === 'ArrowUp'){ e.preventDefault(); goTop(true); return; }
  if(e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); goUp(true); return; }
  if(e.key === 'Backspace'){ e.preventDefault(); goUp(true); return; }

  const card = t.closest && t.closest('#stage .card');
  if(card){
    if(e.key.indexOf('Arrow') === 0){ e.preventDefault(); moveCardFocus(card, e.key); return; }
    if(card.dataset.card){
      if(e.key === 'Enter'){ e.preventDefault(); navigate(pathOf(card.dataset.card), {kbd:true}); return; }
      if(e.key === ' '){ e.preventDefault(); select(card.dataset.card); return; }
    }
  }
});

$('#q').addEventListener('input', () => { resIdx = -1; renderResults(); });
$('#q').addEventListener('focus', () => { if($('#q').value.trim()) renderResults(); });
$('#back').addEventListener('click', () => goUp(false));
$('#totop').addEventListener('click', () => goTop(false));
$('#reset').addEventListener('click', () => {
  try{ localStorage.removeItem(LS); }catch(e){}
  seed(); persist();
  $('#stage').replaceChildren(buildLevel());
  updateChrome();
  tick('example restored · ' + Object.keys(N).length + ' assets · ' + R.length + ' routes');
  say('Example data restored');
});

/* ---------- boot ---------- */
if(!restore()) seed();
reindex();
$('#stage').replaceChildren(buildLevel());
updateChrome();
tick(Object.keys(N).length + ' assets · ' + R.length + ' routes · press / to search, Enter to drill');
</script>
