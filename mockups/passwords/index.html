<!doctype html>
<!--
  Passwords, a throwaway clickdummy, 2026-11-17. It answers one question: what would a password page look
  like in knobas if it worked with whatever password manager a team already has? Password managers are
  sources: they are added in Settings › Sources (#/settings/sources) like Jira or Gitea, and each adapter
  implements the password role. The Passwords page (#/passwords) draws that role over every source at once
  and never says which one an entry came from. Here three sources fill it: a Pleasant Password Server,
  a Vaultwarden organization and a KeePass file. passwords.md has the reasoning.

  Switches (the yellow pill): ?scenario=today|two|comments|offline|empty, ?theme=light|dark.
  Nothing leaves the page, nothing is copied to the real clipboard, and a reload starts over.
  Open this file directly, no server needed.
-->
