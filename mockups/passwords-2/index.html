<!doctype html>
<!--
  Passwords, second pass: a throwaway clickdummy, 2026-11-22. One Passwords page over two password managers,
  a Pleasant Password Server and a Bitwarden or Vaultwarden organization, both added in Settings › Sources
  like any other source. passwords-2.md has the question, the assumptions and the open questions.

  Drawn on the app's own stylesheets: every <link> below is a file under app/src/lib/tf/css/, in tf.css's
  order, and the page is built from their classes. pw2.css is the whole addition (the `pw-` rules) plus the
  mockup pill.

  Open this file directly; it needs no server. The yellow pill at the bottom left switches scenario and
  theme and is not part of the app. ?scenario=both|comments|offline|one|empty and ?theme=light|dark do the
  same from the address; &bar=0 hides the pill. Nothing leaves the page: every password is made up, the
  "clipboard" is a line in the status bar and never the real one, and a reload starts over.
-->
