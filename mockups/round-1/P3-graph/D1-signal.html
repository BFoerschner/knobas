<!--
knobas mockup
paradigm: P3 Graph
design: D1 Signal
thesis: Seeing the shape of your work — which ticket pulls which branch, build, page and note — and wiring it by dragging one node onto another.
thesis: The graph is a departure board exploded into a map: every node is a monogrammed board cell, every edge a hairline, every status a reading in graphite with amber reserved for what is moving.
thesis: Split-flap status cells — timer, build state, ticket status and inbox count flip like a departure board whenever a value changes.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>knobas — Graph / Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15171A;--panel:#1D2024;--raised:#24282D;--hair:#2E3339;--edge:#3A4149;
  --text:#E7E9EC;--muted:#8B929A;--faint:#5A6169;
  --amber:#FFB020;--fail:#FF6A5C;--ok:#7FD1A1;--link:#9CC3FF;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--link);outline-offset:1px}
b{font-weight:500}
.mono,.k{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:600 11px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.fail{color:var(--fail)}.ok{color:var(--ok)}.amber{color:var(--amber)}.linkc{color:var(--link)}
.hide{display:none!important}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-rows:18px 44px minmax(0,1fr) 26px;height:100vh;width:100vw;min-width:1100px}
#ticker{display:flex;align-items:center;gap:10px;padding:0 12px;background:#121417;border-bottom:1px solid var(--hair);font:500 10.5px/18px var(--mono);color:var(--amber);overflow:hidden;white-space:nowrap}
#ticker .tk-lbl{color:var(--faint);letter-spacing:.08em}
#ticker .tk-win{flex:1;overflow:hidden;position:relative}
#ticker .tk-track{display:inline-block;white-space:nowrap;animation:tk 48s linear infinite;padding-left:0}
#ticker .tk-track span{padding-right:48px}
#ticker .tk-track span::before{content:"◆";color:var(--faint);padding-right:8px}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#top{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--hair)}
#brand{font:600 17px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding-right:8px;border-right:1px solid var(--hair);margin-right:2px}
#search{position:relative;width:440px}
#search .srch-in{display:flex;align-items:center;height:28px;border:1px solid var(--hair);border-radius:2px;background:var(--bg);padding:0 8px;gap:8px}
#search .srch-in:focus-within{border-color:var(--link)}
#search input{flex:1;height:26px;font:13px var(--sans);color:var(--text)}
#search input::placeholder{color:var(--faint)}
#search .kbd{font:500 10px/16px var(--mono);color:var(--faint);border:1px solid var(--hair);border-radius:2px;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--hair);border-radius:2px;background:var(--panel);color:var(--muted);font:12px var(--sans);white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--faint)}
.chip.on{color:var(--text);border-color:var(--link);background:var(--raised)}
.chip .cnt{font:500 11px var(--mono);color:var(--text)}
.chip .delta{font:500 10px var(--mono);color:var(--amber)}
#top .spacer{flex:1}
#timer{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:1px solid var(--hair);border-radius:2px;background:var(--bg)}
#timer:hover{border-color:var(--faint)}
#timer .tctx{font:500 12px var(--mono);color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer .tsec{font:11px var(--mono);color:var(--faint);width:26px}
#timer.off .tctx{color:var(--muted)}
#inboxbtn{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:1px solid var(--hair);border-radius:2px;background:var(--bg)}
#inboxbtn:hover{border-color:var(--faint)}
#syncdot{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted);height:28px;padding:0 8px;border:1px solid var(--hair);border-radius:2px;white-space:nowrap;flex:none}
#syncdot i{display:inline-block;width:6px;height:6px;border-radius:1px;background:var(--ok)}
#syncdot i.bad{background:var(--fail)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid transparent;border-radius:2px;color:var(--muted)}
.ibtn:hover{color:var(--text);border-color:var(--hair)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

#main{display:grid;grid-template-columns:44px minmax(0,1fr) 360px;min-height:0;position:relative}
#rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px;background:var(--panel);border-right:1px solid var(--hair)}
#rail .rb{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:2px;color:var(--muted);border:1px solid transparent}
#rail .rb:hover{color:var(--text)}
#rail .rb.on{color:var(--text);background:var(--raised);border-color:var(--hair)}
#rail .rb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#rail .rb .dot{position:absolute;top:4px;right:4px;width:5px;height:5px;background:var(--amber);border-radius:1px}
#rail .rb.bottom{margin-top:auto;margin-bottom:8px}

#stage{position:relative;overflow:hidden;min-width:0;background:var(--bg)}
#canvas{width:100%;height:100%;display:block;cursor:grab}
#canvas.panning{cursor:grabbing}
#canvas.linking{cursor:crosshair}
#lenses{position:absolute;left:12px;top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 200px);pointer-events:none}
#lenses>*{pointer-events:auto}
#ctools{position:absolute;right:12px;top:10px;display:flex;gap:6px}
#legend{position:absolute;left:12px;bottom:10px;display:flex;gap:14px;align-items:center;font:11px var(--mono);color:var(--faint);pointer-events:none}
#legend .mg{display:inline-flex;align-items:center;gap:5px;color:var(--muted);width:auto;height:auto;border:0;background:none;font:11px var(--mono);white-space:nowrap;flex:none}
#legend .mg i{display:inline-block;width:20px;height:16px;line-height:16px;text-align:center;border:1px solid var(--hair);border-radius:1px;font-size:9.5px;font-style:normal;color:var(--text);background:var(--raised)}
#legend svg{width:26px;height:10px;overflow:visible}

/* graph */
.edge{stroke:var(--edge);stroke-width:1.2;fill:none}
.edge.sugg{stroke:var(--faint);stroke-dasharray:4 4}
.edge.blocks{stroke:var(--fail);stroke-opacity:.55}
.edge.lit{stroke:var(--link);stroke-opacity:.9}
.edge.dim{stroke-opacity:.18}
.elbl{font:10px var(--mono);fill:var(--faint)}
.node{cursor:pointer;transition:opacity .12s}
.node .nbox{fill:var(--panel);stroke:var(--hair);stroke-width:1}
.node:hover .nbox{stroke:var(--faint)}
.node.sel .nbox{stroke:var(--link);stroke-width:1.2}
.node.lit .nbox{stroke:var(--link)}
.node .nmono{fill:var(--raised);stroke:var(--hair);stroke-width:.6}
.node .nmt{font:500 9.5px var(--mono);fill:var(--text);text-anchor:middle}
.node .nl1{font:500 11.5px var(--mono);fill:var(--text)}
.node .nl1.sans{font:500 11.5px var(--sans)}
.node .nl2{font:10px var(--sans);fill:var(--muted)}
.node .nl2.fail{fill:var(--fail)}.node .nl2.amber{fill:var(--amber)}.node .nl2.ok{fill:var(--ok)}
.node .nring{fill:none;stroke:var(--amber);stroke-width:1.2;display:none}
.node.timer .nring{display:block;animation:pulse 2s ease-in-out infinite}
.node.hit .nbox{stroke:var(--amber);stroke-width:1.4}
.node.dim{opacity:.22}
.node.ghost{display:none}
.node.hl .nbox{stroke:var(--amber)}
.node.fresh{animation:fade .12s ease-out}
.node:focus{outline:none}
.node:focus-visible .nbox{stroke:var(--link);stroke-dasharray:3 2}
.flapwrap:focus-within .flap{outline:1px solid var(--link);outline-offset:1px}
#draglink{stroke:var(--amber);stroke-width:1.2;stroke-dasharray:4 4;fill:none;pointer-events:none}
@keyframes pulse{0%,100%{stroke-opacity:.95}50%{stroke-opacity:.2}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* flap cell (signature) */
.flap{position:relative;display:inline-block;height:20px;min-width:var(--fw,64px);padding:0 6px;font:500 11px/20px var(--mono);letter-spacing:.05em;text-align:center;text-transform:uppercase;vertical-align:middle;perspective:240px;color:var(--text);white-space:nowrap;border-radius:2px;background:var(--raised);border:1px solid var(--hair)}
.flap .ft,.flap .fb{position:absolute;left:0;right:0;height:9px;overflow:hidden;background:var(--raised);backface-visibility:hidden}
.flap .ft{top:0;border-radius:2px 2px 0 0}
.flap .fb{bottom:0;border-radius:0 0 2px 2px}
.flap i{display:block;font-style:normal;height:18px;line-height:18px;padding:0 6px}
.flap .fb i{transform:translateY(-9px)}
.flap::after{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--bg);z-index:5}
.flap .fa{z-index:3}
.flap .fo{transform-origin:50% 100%;animation:fo .17s ease-in forwards}
.flap .fi{transform-origin:50% 0;transform:rotateX(90deg);animation:fi .17s .17s ease-out forwards}
@keyframes fo{to{transform:rotateX(-90deg)}}
@keyframes fi{to{transform:rotateX(0)}}
.flap.amber,.flap.amber .ft,.flap.amber .fb{color:var(--amber)}
.flap.fail,.flap.fail .ft,.flap.fail .fb{color:var(--fail)}
.flap.ok,.flap.ok .ft,.flap.ok .fb{color:var(--ok)}
.flap.link,.flap.link .ft,.flap.link .fb{color:var(--link)}
.flap.dimf,.flap.dimf .ft,.flap.dimf .fb{color:var(--muted)}
.flap.sm{height:18px;font-size:10px;line-height:18px;min-width:48px}
.flap.sm .ft,.flap.sm .fb{height:8px}.flap.sm i{height:16px;line-height:16px}.flap.sm .fb i{transform:translateY(-8px)}.flap.sm::after{top:8px}
.flap.lg{height:26px;font-size:14px;line-height:26px;min-width:72px}
.flap.lg .ft,.flap.lg .fb{height:12px}.flap.lg i{height:24px;line-height:24px}.flap.lg .fb i{transform:translateY(-12px)}.flap.lg::after{top:12px}
.flapwrap{position:relative;display:inline-block}
.flapwrap select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

/* side card */
#card{border-left:1px solid var(--hair);background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
#card .chead{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--panel);z-index:2}
#card .chead .ck{font:500 13px var(--mono)}
#card .chead .ctype{font:11px var(--sans);color:var(--muted)}
#card .chead .spacer{flex:1}
.mg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:18px;border:1px solid var(--hair);border-radius:1px;background:var(--raised);font:500 9.5px var(--mono);color:var(--text);flex:none}
.ctitle{padding:12px 14px 4px;font:500 15px/1.3 var(--sans)}
.csub{padding:0 14px 10px;font:11px var(--mono);color:var(--muted)}
.sec{padding:10px 14px;border-top:1px solid var(--hair)}
.sec .lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec .lbl .n{font:500 10px var(--mono);color:var(--faint);letter-spacing:0}
.sec .lbl .r{margin-left:auto}
.kv{display:grid;grid-template-columns:88px 1fr;row-gap:5px;column-gap:8px;align-items:center;font-size:12px}
.kv .kk{color:var(--muted);font:600 10.5px var(--disp);letter-spacing:.08em;text-transform:uppercase}
.kv .vv{min-height:20px;display:flex;align-items:center;gap:8px}
.desc{font-size:12.5px;line-height:1.5;color:var(--text)}
.desc code{font:11.5px var(--mono);background:var(--raised);padding:0 3px;border-radius:1px}
.lrow{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px;margin:0 -6px;border-radius:2px;cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden}
.lrow:hover{background:var(--raised)}
.lrow .lk{font:500 11.5px var(--mono);flex:none}
.lrow .lt{overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.lrow .lr{margin-left:auto;flex:none;font:10.5px var(--mono);color:var(--faint)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:6px 0;border-top:1px dashed var(--hair);font-size:12px}
.srow:first-of-type{border-top:0}
.srow .sl{font:500 11.5px var(--mono)}
.srow .sr{grid-column:1;color:var(--muted);font-size:11px}
.srow .sa{grid-row:1/3;grid-column:2;display:flex;gap:4px;align-items:center}
.cmt{padding:6px 0;border-top:1px dashed var(--hair);font-size:12.5px}
.cmt:first-of-type{border-top:0}
.cmt .ch{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:2px}
.cmt .ch b{color:var(--text)}
.cmt .ch .t{font-family:var(--mono);margin-left:auto}
.wl{display:grid;grid-template-columns:78px 52px 1fr;gap:8px;font-size:12px;padding:4px 0;border-top:1px dashed var(--hair)}
.wl:first-of-type{border-top:0}
.wl .w1{font:11px var(--mono);color:var(--muted)}.wl .w2{font:500 11.5px var(--mono)}
textarea.ta,input.ti,select.ts{width:100%;background:var(--bg);border:1px solid var(--hair);border-radius:2px;padding:6px 8px;font-size:12.5px;color:var(--text);resize:vertical}
textarea.ta:focus,input.ti:focus,select.ts:focus{border-color:var(--link);outline:0}
select.ts{appearance:none;-webkit-appearance:none;height:28px;padding:0 8px;background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238B929A' stroke-width='1.2'/></svg>") no-repeat right 8px center}
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--hair);border-radius:2px;background:var(--raised);color:var(--text);font:500 12px var(--sans);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{border-color:var(--link);color:var(--link)}
.btn.danger{color:var(--fail)}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.btn.ghost{background:none}
.btn .k{font-size:11px}
.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--hair)}
.acts.top{border-top:0;border-bottom:1px solid var(--hair)}
.empty{padding:14px;color:var(--muted);font-size:12.5px;line-height:1.5}
.chipent{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px 0 3px;border:1px solid var(--hair);border-radius:2px;background:var(--raised);font:500 11px var(--mono);color:var(--link);cursor:pointer;vertical-align:middle}
.chipent .mg{width:18px;height:14px;font-size:8.5px}
.chipent.off{color:var(--muted);cursor:default}
.noteed{min-height:150px;white-space:pre-wrap;font-size:12.5px;line-height:1.6;border:1px solid var(--hair);border-radius:2px;padding:8px;background:var(--bg)}
.noteed:focus{border-color:var(--link);outline:0}
.log{font:11px/1.5 var(--mono);background:var(--bg);border:1px solid var(--hair);border-radius:2px;padding:8px;white-space:pre;overflow:auto;color:var(--muted)}
.log .fail{color:var(--fail)}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;min-height:28px;font-size:12px}
.step .sn{font:500 10.5px var(--mono);color:var(--faint)}
.step .st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .st small{display:block;font:10.5px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.form{display:flex;flex-direction:column;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font:600 10.5px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.form label>*{font-family:var(--sans);text-transform:none;letter-spacing:0;font-weight:400}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text);cursor:pointer}
.tog i{width:26px;height:14px;border:1px solid var(--hair);border-radius:2px;position:relative;background:var(--bg)}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;background:var(--faint);border-radius:1px;transition:transform .12s}
.tog.on i::after{transform:translateX(12px);background:var(--text)}
.cb{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:3px 0;cursor:pointer}
.form label.cb{flex-direction:row;align-items:flex-start;gap:8px}
.form label.tog{flex-direction:row;align-items:center;gap:8px}
.cb input{margin-top:3px;accent-color:#9CC3FF}
.cb .t{font:11px var(--mono);color:var(--faint)}
.hint{font-size:11px;color:var(--muted);line-height:1.4}
.ok-line{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--hair);border-radius:2px;background:var(--bg);font-size:12px}

/* status bar */
#status{display:flex;align-items:center;gap:14px;padding:0 12px;overflow:hidden;background:var(--panel);border-top:1px solid var(--hair);font:11px var(--mono);color:var(--muted);white-space:nowrap}
#status .sy{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
#status .sy .mg{width:18px;height:14px;font-size:8.5px}
#status .sy.bad{color:var(--fail)}
#status .spacer{flex:1}

/* overlays */
.pop{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--hair);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.45);min-width:220px}
.pop .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair)}
.pop .ph .spacer{flex:1}
.pop .pb{padding:10px 12px}
.menu{padding:4px 0;min-width:230px}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 12px;text-align:left;font-size:12.5px;color:var(--text)}
.menu .mi:hover{background:var(--raised)}
.menu .mi .k{margin-left:auto;font-size:10.5px;color:var(--faint)}
.menu .msep{height:1px;background:var(--hair);margin:4px 0}
.menu .mh{padding:6px 12px 2px}
#srchdd{position:absolute;left:0;top:32px;width:640px;z-index:40}
#srchdd .filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--hair)}
#srchdd .filters select{height:24px;border:1px solid var(--hair);border-radius:2px;background:var(--bg);color:var(--muted);font-size:11.5px;padding:0 6px}
.rrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;height:34px;padding:0 12px;cursor:pointer;border-top:1px dashed var(--hair)}
.rrow:hover,.rrow.cur{background:var(--raised)}
.rrow .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.rrow .rt small{color:var(--muted);font-size:11px;margin-left:6px}
.rrow .rs{font:10.5px var(--mono);color:var(--faint)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:560px;z-index:25;background:var(--panel);border-left:1px solid var(--hair);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hair)}
.drawer .dh h2{font:600 18px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.drawer .dh .spacer{flex:1}
.drawer .db{flex:1;overflow:auto;padding:6px 16px 16px}
.modal-bg{position:absolute;inset:0;z-index:35;background:rgba(21,23,26,.72);display:flex;align-items:center;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--hair);border-radius:2px;width:560px;max-height:86%;display:flex;flex-direction:column;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.modal.wide{width:900px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.modal .mh h2{font:600 18px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.modal .mh .spacer{flex:1}
.modal .mb{padding:12px 16px;overflow:auto}
.modal .mf{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--hair);align-items:center}
.modal .mf .spacer{flex:1}
.inb{display:grid;grid-template-columns:82px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--hair);font-size:12.5px}
.inb:first-child{border-top:0}
.inb .it{font:11px var(--mono);color:var(--muted);padding-top:2px}
.inb .ix{line-height:1.45}
.inb .ix .goto{color:var(--link);cursor:pointer}
.inb .ia{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.inb.gone{opacity:0;transition:opacity .12s}
.reply{display:flex;gap:6px;margin-top:6px;grid-column:2}
.reply input{flex:1;height:26px;background:var(--bg);border:1px solid var(--hair);border-radius:2px;padding:0 8px;font-size:12px}

/* sources table */
.srct{width:100%;border-collapse:collapse;font-size:12px}
.srct th{font:600 10.5px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--hair);white-space:nowrap}
.srct td{padding:8px;border-bottom:1px solid var(--hair);vertical-align:top}
.srct td .k{font-size:11.5px}
.srct .u{color:var(--muted);font:11px var(--mono)}
.srct .caps{display:flex;gap:4px;margin-top:4px}
.cap{font:500 9.5px var(--mono);letter-spacing:.04em;padding:1px 4px;border:1px solid var(--hair);border-radius:1px;color:var(--muted)}
.modgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--hair);border-radius:2px;background:var(--bg);text-align:left;cursor:pointer}
.mod:hover{border-color:var(--faint)}
.mod.on{border-color:var(--link)}
.mod .mn{display:flex;align-items:center;gap:8px;font-weight:500}
.mod .mv{font:10.5px var(--mono);color:var(--muted)}
.stepper{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.stepper div{flex:1;padding:6px 8px;font:600 10.5px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-right:1px solid var(--hair);display:flex;gap:6px;align-items:center}
.stepper div:last-child{border-right:0}
.stepper div.on{color:var(--text);background:var(--raised)}
.stepper div.done{color:var(--muted)}
.stepper .n{font:500 10px var(--mono)}

/* standup */
.digest .dl{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:start;padding:5px 0;font-size:12.5px;line-height:1.45;border-top:1px dashed var(--hair);cursor:default}
.digest .dl:hover{background:var(--raised)}
.digest .dl .dot{width:6px;height:6px;margin-top:7px;background:var(--faint);border-radius:1px}
.digest .dl .src{font:10.5px var(--mono);color:var(--faint);white-space:nowrap;cursor:pointer}
.digest .dl .src:hover{color:var(--link)}
.digest .dsrc{grid-column:2/4;font:11px var(--mono);color:var(--muted);padding:4px 8px;border:1px solid var(--hair);border-radius:2px;background:var(--bg)}
.proto{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
.proto .pk{font:600 10.5px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.proto .pv[contenteditable]{outline:0;border-bottom:1px dashed transparent;min-height:20px}
.proto .pv[contenteditable]:focus{border-bottom-color:var(--link)}
.ai{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed var(--hair);font-size:12.5px}
.ai .who{font:500 11px var(--mono);width:64px;flex:none}
.ai .txt{flex:1}

/* time strip */
#timestrip{position:absolute;left:0;right:0;bottom:0;z-index:24;background:var(--panel);border-top:1px solid var(--hair);height:232px;display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
#timestrip .dh{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--hair)}
#timestrip .dh h2{font:600 16px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
#timestrip .dh .spacer{flex:1}
#timestrip .db{flex:1;padding:10px 16px;overflow:hidden;position:relative}
.strip{position:relative;height:114px;margin-top:18px}
.strip .axis{position:absolute;left:0;right:0;top:-18px;height:14px}
.strip .axis span{position:absolute;font:10px var(--mono);color:var(--faint);transform:translateX(-50%)}
.strip .blk{position:absolute;top:0;height:96px;border:1px solid var(--hair);border-radius:2px;background:var(--raised);padding:5px 8px;overflow:hidden;cursor:pointer;font-size:11px}
.strip .blk .bk{font:500 11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .blk .bt{font:10px var(--mono);color:var(--muted);white-space:nowrap}
.strip .blk.passive{background:repeating-linear-gradient(135deg,var(--panel) 0 4px,var(--raised) 4px 8px)}
.strip .blk.unattr{border-color:var(--amber);border-style:dashed;background:none}
.strip .blk.unattr .bk{color:var(--amber)}
.strip .blk.label{border-color:var(--faint)}
.strip .blk.gap{border:0;background:none;cursor:default}
.strip .blk.gap .bk{color:var(--faint)}
.strip .blk:hover{border-color:var(--faint)}
.strip .blk.manual{border-color:var(--muted)}
.strip .now{position:absolute;top:-4px;bottom:0;width:1px;background:var(--amber)}
.strip .now::after{content:"now";position:absolute;top:-14px;left:4px;font:10px var(--mono);color:var(--amber)}
.strip .blk .ba{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.week{display:grid;grid-template-columns:repeat(5,1fr) 1.4fr;gap:8px;align-items:end;height:120px}
.week .day{display:flex;flex-direction:column;gap:4px;font:11px var(--mono)}
.week .bar{position:relative;height:64px;border:1px solid var(--hair);border-radius:2px;background:var(--bg)}
.week .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--hair);border-top:1px solid var(--muted)}
.week .bar b{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,176,32,.35) 3px 6px);border-top:1px solid var(--amber)}
.week .dn{color:var(--muted)}
.week .sum{display:flex;flex-direction:column;gap:6px;font:11.5px var(--mono);align-self:stretch;justify-content:flex-end;padding-left:12px;border-left:1px solid var(--hair)}

/* toasts */
#toasts{position:absolute;right:12px;bottom:38px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--raised);border:1px solid var(--hair);border-left:2px solid var(--text);border-radius:2px;padding:8px 12px;font-size:12.5px;min-width:260px;max-width:420px;animation:fade .12s}
.toast .k{font-size:11.5px}
.toast.fail{border-left-color:var(--fail)}.toast.amber{border-left-color:var(--amber)}.toast.ok{border-left-color:var(--ok)}

#jserr{display:none}
@media (max-width:1280px){#status .opt{display:none}#search{width:250px}#main{grid-template-columns:44px minmax(0,1fr) 340px}.drawer{width:480px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .node.timer .nring{stroke-opacity:.9}
}
</style>

function flapInner(v){return '<span class="ft"><i>'+esc(v)+'</i></span><span class="fb"><i>'+esc(v)+'</i></span><i style="visibility:hidden">'+esc(v)+'</i>'}
function flap(el,v,cls){
  if(!el)return; v=String(v);
  if(cls!==undefined){el.className=el.className.replace(/\b(amber|fail|ok|link|dimf)\b/g,'').trim()+(cls?' '+cls:'')}

  if(old===v)return;

    if(mode==='drag'){if(!moved){select(from)}else if(over){const a=from,b=over;$('#nodes [data-id="'+b+'"]').classList.remove('hit');askLink(a,b,e.clientX,e.clientY)}}
    mode=null;from=null;over=null});
  cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const f=Math.exp(-e.deltaY*0.0015);const ns=Math.min(1.8,Math.max(.5,view.s*f));view.tx=mx-(mx-view.tx)*(ns/view.s);view.ty=my-(my-view.ty)*(ns/view.s);view.s=ns;applyView()},{passive:false});

  'ai-ticket'(b){const who={Mara:'Mara Lindqvist',Tomasz:'Tomasz Wójcik',Lena:'Lena Hoffmann'}[b.dataset.who];const key=createTicket({proj:b.dataset.who==='Tomasz'?'OPS':'PAY',type:'Task',sum:b.dataset.txt,who,epic:'',link:null});const row=document.getElementById('ai-'+b.dataset.i);row.querySelector('button').outerHTML='<span class="chipent" data-act="go-flash" data-to="'+key+'">'+mg('JI')+key+'</span>'},

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='SELECT')return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b)}});
document.addEventListener('change',e=>{const b=e.target.closest('select[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b)});
document.addEventListener('keydown',e=>{const b=e.target.closest&&e.target.closest('.lrow[data-act],.chipent[data-act]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ACT[b.dataset.act](b)}});

/* ---------- search wiring + keyboard ---------- */
const qi=$('#q');
qi.addEventListener('input',()=>{S.q=qi.value;renderSearch();applyFilter()});
qi.addEventListener('focus',()=>renderSearch());
qi.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=$('#srchdd .rrow.cur')||$('#srchdd .rrow');if(c){go(c.dataset.to);qi.blur()}}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const rows=$$('#srchdd .rrow');const i=rows.findIndex(r=>r.classList.contains('cur'));const j=Math.max(0,Math.min(rows.length-1,i+(e.key==='ArrowDown'?1:-1)));rows.forEach(r=>r.classList.remove('cur'));if(rows[j])rows[j].classList.add('cur')}if(e.key==='Escape'){qi.blur();$('#srchdd').classList.add('hide');if(!S.q)return;S.q='';qi.value='';applyFilter()}});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#search'))$('#srchdd').classList.add('hide');if(!e.target.closest('.pop')&&!e.target.closest('[data-act]'))$$('#overlays .pop').forEach(p=>p.remove())});
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();qi.focus();qi.select();renderSearch();return}
  if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();if(S.timer.on)stopTimer();else startTimer(S.sel&&['ticket','epic'].includes(N[S.sel].type)?S.sel:'PAY-231');return}
  if(e.key==='Escape'){if($$('#overlays .pop').length){closePops();return}if(!$('#srchdd').classList.contains('hide')){$('#srchdd').classList.add('hide');qi.blur();return}if(S.route!=='graph'){ACT.close();return}if(S.lens||S.q){S.lens=null;S.q='';qi.value='';renderLenses();applyFilter();return}}
});
window.addEventListener('hashchange',route);
window.addEventListener('resize',fitView);

/* ---------- init ---------- */
function init(){
  renderTicker();renderLenses();renderCounts();renderTimer();$('#timer').classList.toggle('off',!S.timer.on);
  renderGraph();fitView();
  if(!location.hash||location.hash==='#/'){S.sel='PAY-231';history.replaceState(null,'','#/ticket/PAY-231')}
  route();
  setInterval(()=>{renderTimer()},1000);
}
const run=()=>{try{init()}catch(err){$('#jserr').textContent='init error: '+(err&&err.stack||err);console.error(err)}};
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(run)}else{run()}
setTimeout(()=>{if(!ORDER.some(id=>$('#nodes [data-id="'+id+'"]')))run()},1500);
})();
