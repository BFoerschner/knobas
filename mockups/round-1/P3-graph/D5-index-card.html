<!--
knobas mockup
paradigm: P3 Graph
design: D5 Index card
thesis: Seeing the shape of your work — which ticket pulls which branch, build, page and note — and linking things by dragging one onto another.
thesis: The graph is a desk of index cards: printed white cards for remote entities with a small source tab, string between them, and your yellow lined notes pinned on top.
thesis: Pinned index cards — drag a note onto a ticket and it pins to the corner with a drop-settle; the worklog is a punched time card that gets stamped moss-green.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Tidewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#EEF2EC; --card:#FFFFFF; --edge:#D8E0D5; --sh:rgba(39,49,43,.10);
  --text:#27312B; --muted:#6F7A72; --faint:#A3ACA6;
  --plum:#6B3F8A; --plum-soft:#EEE4FF; --moss:#4F7A3E; --moss-soft:#E1F2E4;
  --amber:#D9822B; --amber-soft:#FFE9D6; --red:#C4453A; --red-soft:#FBE3E0;
  --note:#FFF6C2; --note-line:rgba(0,0,0,.06);
  --t-jira:#E4E9FF; --t-wiki:#EEE4FF; --t-git:#E1F2E4; --t-ci:#FFE9D6; --t-note:#FFF6C2;
  --display:"Bricolage Grotesque",Figtree,"Helvetica Neue",Arial,sans-serif;
  --body:Figtree,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px var(--sh),0 6px 16px var(--sh);
  --shadow-lift:0 2px 4px var(--sh),0 12px 28px rgba(39,49,43,.16);
  --r-card:14px; --r-ctl:8px;
  --top:52px; --rail:60px; --side:380px; --status:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--body);font-size:13px;color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:var(--r-ctl)}
a{color:var(--plum)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
kbd{font-family:var(--mono);font-size:10px;background:var(--desk);border:1px solid var(--edge);border-radius:5px;padding:1px 5px;color:var(--muted)}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#err{position:fixed;left:0;bottom:0;z-index:999;background:var(--red);color:#fff;font:11px var(--mono);padding:4px 8px;max-width:60vw;white-space:pre-wrap}
#err:empty{display:none}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr var(--side);grid-template-rows:var(--top) 1fr var(--status);height:100vh;min-width:1100px}
.topbar{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--edge);z-index:20;position:relative}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--text);padding-right:6px}
.brand span{color:var(--plum)}
.search{position:relative;flex:0 1 520px;min-width:260px}
.search input{width:100%;height:34px;border:1px solid var(--edge);border-radius:10px;padding:0 64px 0 34px;background:var(--desk)}
.search input:focus{background:#fff;border-color:var(--plum)}
.search .ico{position:absolute;left:11px;top:9px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:9px}
.spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-ctl);color:var(--text);border:1px solid transparent}
.tb-btn:hover{background:var(--desk)}
.tb-btn .badge{background:var(--amber);color:#fff;font-weight:600;font-size:11px;min-width:18px;height:18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.timer-pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 10px;border-radius:999px;background:var(--moss-soft);color:var(--moss);border:1px solid #BFD8B4;font-weight:500}
.timer-pill.off{background:var(--desk);color:var(--muted);border-color:var(--edge)}
.timer-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--moss);animation:pulse 1.6s ease-in-out infinite}
.timer-pill.off .dot{background:var(--faint);animation:none}
.timer-pill .el{font-family:var(--mono);font-size:13px}
.timer-pill .ctx{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,122,62,.5)}60%{box-shadow:0 0 0 6px rgba(79,122,62,0)}}
.sync{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-ctl);font-size:12px;color:var(--muted)}
.sync:hover{background:var(--desk)}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--moss);display:inline-block}
.sync .d.bad{background:var(--red)}
.sync .bad-chip{background:var(--red-soft);color:var(--red);font-weight:600;padding:1px 7px;border-radius:999px;font-size:11px}

.rail{grid-row:2/3;min-height:0;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;border-right:1px solid var(--edge);background:var(--desk)}
.rail button{width:50px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:9.5px;font-weight:500;position:relative}
.rail button svg.ic{width:18px;height:18px}
.rail button:hover{background:#fff;color:var(--text)}
.rail button.on{background:#fff;color:var(--plum);box-shadow:var(--shadow)}
.rail .badge{position:absolute;top:5px;right:5px;background:var(--amber);color:#fff;font-size:9.5px;font-weight:600;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.statusbar{grid-column:1/4;min-height:0;overflow:hidden;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--edge);background:var(--desk)}
.statusbar .d{width:6px;height:6px;border-radius:50%;background:var(--moss);display:inline-block;margin-right:4px}
.statusbar .d.bad{background:var(--red)}
.statusbar .d.warn{background:var(--amber)}

/* ---------- canvas / desk ---------- */
.canvas{grid-row:2/3;min-height:0;position:relative;overflow:hidden;background:var(--desk);background-image:radial-gradient(rgba(39,49,43,.07) 1px,transparent 1px);background-size:24px 24px;cursor:grab}
.canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--plum);stroke-opacity:.38;stroke-width:1.6;transition:stroke-opacity .15s}
#edges path.sug{stroke:var(--muted);stroke-opacity:.6;stroke-dasharray:5 4;stroke-width:1.4}
#edges path.on{stroke-opacity:.95;stroke-width:2.2}
#edges path.dim{stroke-opacity:.08}
#edges text{font:10.5px var(--body);fill:var(--muted)}
#edges .lbl rect{fill:var(--desk)}

.node{position:absolute;width:168px;height:54px;background:var(--card);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px 6px;cursor:pointer;user-select:none;transition:box-shadow .12s,transform .12s,opacity .15s;z-index:2}
.node:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.node .tab{position:absolute;left:10px;top:-9px;height:16px;padding:0 7px;border-radius:6px 6px 3px 3px;font-size:9.5px;font-weight:600;letter-spacing:.02em;line-height:16px;color:var(--text);border:1px solid var(--edge);border-bottom:0}
.tab.jira{background:var(--t-jira)} .tab.confluence{background:var(--t-wiki)} .tab.gitea{background:var(--t-git)} .tab.teamcity{background:var(--t-ci)} .tab.note{background:var(--t-note)}
.node .row{display:flex;align-items:center;gap:6px;min-height:16px}
.node .nk{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.node .nt{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.node .st{font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:999px;white-space:nowrap;background:var(--desk);color:var(--muted)}
.st.s-inprogress{background:var(--plum-soft);color:var(--plum)} .st.s-inreview{background:var(--amber-soft);color:#9A5A15} .st.s-done{background:var(--moss-soft);color:var(--moss)} .st.s-todo{background:var(--desk);color:var(--muted)}
.st.s-failed{background:var(--red-soft);color:var(--red)} .st.s-running{background:var(--amber-soft);color:#9A5A15} .st.s-success{background:var(--moss-soft);color:var(--moss)} .st.s-open{background:var(--plum-soft);color:var(--plum)} .st.s-merged{background:var(--moss-soft);color:var(--moss)} .st.s-queued{background:var(--desk);color:var(--muted);border:1px dashed var(--faint)}
.node .more{position:absolute;right:4px;top:4px;width:20px;height:18px;border-radius:6px;color:var(--faint);font-size:14px;line-height:1;display:none;align-items:center;justify-content:center}
.node:hover .more,.node.sel .more{display:flex}
.node .more:hover{background:var(--desk);color:var(--text)}
.node.sel{border-color:var(--plum);box-shadow:0 0 0 2px var(--plum),var(--shadow-lift)}
.node.hl{box-shadow:0 0 0 2px var(--amber),var(--shadow-lift)}
.node.dim{opacity:.22}
.node.timer::after{content:"";position:absolute;inset:-5px;border-radius:16px;border:2px solid var(--moss);animation:ring 1.8s ease-in-out infinite;pointer-events:none}
@keyframes ring{0%,100%{opacity:.35}50%{opacity:1}}
.node.drop{border-color:var(--plum);background:var(--plum-soft)}
.node.dragging{z-index:30;box-shadow:var(--shadow-lift);transform:scale(1.03);cursor:grabbing}
.node.queued{border-style:dashed}
.node.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1}}
/* note index cards */
.node.note{width:144px;height:92px;background:var(--note) repeating-linear-gradient(transparent 0 23px,var(--note-line) 23px 24px);background-position:0 28px;border-color:#E8DC9A;padding:12px 10px 6px;z-index:3;border-radius:8px;transform:rotate(var(--rot,0deg))}
.node.note:hover{transform:rotate(var(--rot,0deg)) translateY(-1px)}
.node.note.sel{box-shadow:0 0 0 2px var(--plum),var(--shadow-lift)}
.node.note .pin{position:absolute;left:50%;top:-8px;width:16px;height:18px;margin-left:-8px}
.node.note .nt{font-family:var(--display);font-weight:600;font-size:12px;margin-top:0;white-space:normal;line-height:1.2;max-height:30px;overflow:hidden}
.node.note .nx{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.note.drop-settle{animation:settle .2s ease-out}
@keyframes settle{0%{transform:rotate(calc(var(--rot,0deg) - 6deg)) scale(1.12)}100%{transform:rotate(var(--rot,0deg)) scale(1)}}

.lenses{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none;align-items:center}
.lenses > *{pointer-events:auto}
.lens{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:999px;background:var(--card);border:1px solid var(--edge);box-shadow:0 1px 2px var(--sh);font-size:12px;color:var(--text)}
.lens:hover{border-color:var(--faint)}
.lens.on{background:var(--plum);border-color:var(--plum);color:#fff}
.lens .n{font-family:var(--mono);font-size:11px;color:var(--muted)} .lens.on .n{color:#E9DDF5}
.lens .chg{font-size:10px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:0 5px} .lens.on .chg{background:rgba(255,255,255,.2);color:#fff}
.lens-note{font-size:11.5px;color:var(--muted);background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:4px 10px;box-shadow:0 1px 2px var(--sh)}
.lens-note b{color:var(--plum)}
.ctools{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:5;align-items:center}
.ctools button{width:30px;height:30px;border-radius:8px;background:var(--card);border:1px solid var(--edge);box-shadow:0 1px 2px var(--sh);color:var(--muted);font-size:15px}
.ctools button:hover{color:var(--text)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;align-items:center;z-index:5;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:5px 12px;box-shadow:0 1px 2px var(--sh)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--edge);margin-right:4px;vertical-align:-1px}
.legend .ln{display:inline-block;width:18px;border-top:2px solid var(--plum);opacity:.6;margin-right:4px;vertical-align:3px}
.legend .ln.sug{border-top:2px dashed var(--muted)}
.sugstrip{position:absolute;right:12px;bottom:52px;z-index:6;width:392px;background:var(--card);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow)}
.sugstrip header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:12px}
.sugstrip header .n{font-family:var(--mono);color:var(--muted);font-weight:400}
.sugstrip header .spacer{flex:1}
.sugstrip ul{list-style:none;border-top:1px solid var(--edge);max-height:200px;overflow:auto}
.sugstrip li{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--edge);font-size:12px}
.sugstrip li:last-child{border-bottom:0}
.sugstrip li .why{color:var(--muted);font-size:11px;display:block}
.sugstrip li .t{flex:1;min-width:0}
.sugstrip.closed ul{display:none}
.sugstrip li a{cursor:pointer;text-decoration:none}

/* ---------- side card ---------- */
.side{grid-row:2/3;padding:12px 12px 12px 0;min-width:0;min-height:0;overflow:hidden}
.sidecard{height:100%;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sidecard .sc-body{overflow:auto;flex:1;min-height:0;padding:18px 18px 20px}
.sidecard .sc-foot{border-top:1px solid var(--edge);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sc-head .tab{position:static;height:18px;line-height:18px;border-radius:5px;font-size:10px;padding:0 7px;font-weight:600;border:1px solid var(--edge)}
.sc-head .key{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sc-head .spacer{flex:1}
.sc-title{font-size:19px;margin-bottom:10px;line-height:1.2}
.sc-title[contenteditable]:focus{outline:2px solid var(--plum);outline-offset:2px;border-radius:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted)}
.meta .sep{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--desk);border:1px solid var(--edge);font-size:11.5px;color:var(--text);white-space:nowrap;cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--faint)}
.chip.prio-high{color:var(--red)} .chip.prio-medium{color:#9A5A15} .chip.prio-low{color:var(--muted)}
.chip .tab{position:static;height:14px;line-height:14px;font-size:9px;padding:0 5px;border-radius:4px;border:0}
.av{width:20px;height:20px;border-radius:50%;background:var(--plum-soft);color:var(--plum);font-size:9.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.p{background:var(--amber-soft);color:#9A5A15} .av.j{background:var(--moss-soft);color:var(--moss)} .av.t{background:var(--t-jira);color:#3A4A9A} .av.l{background:var(--red-soft);color:var(--red)}
select.st-sel{height:24px;border-radius:999px;border:1px solid var(--edge);padding:0 8px;background:var(--plum-soft);color:var(--plum);font-weight:600;font-size:11.5px;-webkit-appearance:none;appearance:none;cursor:pointer}
select.st-sel.s-inreview{background:var(--amber-soft);color:#9A5A15} select.st-sel.s-done{background:var(--moss-soft);color:var(--moss)} select.st-sel.s-todo{background:var(--desk);color:var(--muted)}
.sec{margin:16px 0 0}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--body);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec h4 .n{font-family:var(--mono);text-transform:none;letter-spacing:0;font-weight:400}
.sec h4 .spacer{flex:1}
.sec h4 button{font-size:11px;text-transform:none;letter-spacing:0;color:var(--plum);font-weight:500}
.desc{font-size:13px;line-height:1.5}
.desc code{font-family:var(--mono);font-size:11.5px;background:var(--desk);padding:1px 4px;border-radius:4px}
.lrow{display:flex;align-items:center;gap:8px;min-height:40px;padding:5px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;text-decoration:none;color:inherit}
.lrow:hover{background:var(--desk)}
.lrow .tab{position:static;height:16px;line-height:16px;font-size:9.5px;padding:0 6px;border-radius:4px;border:1px solid var(--edge);flex:none;min-width:36px;text-align:center}
.lrow .t{flex:1;min-width:0}
.lrow .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .st{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px}
.lrow .via{font-size:10px;color:var(--faint);font-style:italic;flex:none;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px dashed var(--faint);border-radius:10px;margin-bottom:6px;font-size:12px}
.sugrow .t{flex:1;min-width:0} .sugrow .t small{display:block;color:var(--muted);font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--edge);background:var(--card);font-weight:500;font-size:12.5px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--desk)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:#fff} .btn.primary:hover{background:#5A3376}
.btn.moss{background:var(--moss);border-color:var(--moss);color:#fff} .btn.moss:hover{background:#42682F}
.btn.danger{color:var(--red)} .btn.sm{height:24px;padding:0 8px;font-size:11.5px} .btn.ghost{border-color:transparent;color:var(--plum)}
.btn.ok{background:var(--moss-soft);border-color:#BFD8B4;color:var(--moss)}
.btn.icon{width:26px;height:26px;padding:0;border-radius:6px;color:var(--muted)} .btn.icon:hover{color:var(--text)}
.btn.icon.yes:hover{color:var(--moss);background:var(--moss-soft)} .btn.icon.no:hover{color:var(--red);background:var(--red-soft)}
.btn:disabled{opacity:.5;cursor:default}
.comment{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--edge)}
.comment:last-of-type{border-bottom:0}
.comment .b{flex:1;min-width:0} .comment .who{font-weight:600;font-size:12px} .comment .when{color:var(--faint);font-size:11px;font-family:var(--mono);margin-left:6px} .comment p{font-size:12.5px;margin-top:2px;line-height:1.45}
textarea.ta,input.in,select.in{width:100%;border:1px solid var(--edge);border-radius:var(--r-ctl);padding:7px 10px;background:#fff;font-size:12.5px;resize:vertical;line-height:1.4}
textarea.ta:focus,input.in:focus,select.in:focus{border-color:var(--plum);outline:0;box-shadow:0 0 0 3px rgba(107,63,138,.12)}
.addrow{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.addrow textarea{flex:1;min-height:52px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin-bottom:8px}

pre.log{font-family:var(--mono);font-size:11px;line-height:1.5;background:#27312B;color:#E6EBE4;padding:10px 12px;border-radius:10px;overflow:auto;white-space:pre}

.progress{height:6px;background:var(--desk);border-radius:999px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;width:60%;background:var(--amber);border-radius:999px}
.filerow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--edge)}
.filerow .plus{color:var(--moss)} .filerow .minus{color:var(--red);margin-left:6px}
.notice{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:10px;font-size:12px;line-height:1.4;margin-bottom:10px}
.notice.warn{background:var(--amber-soft);color:#7A4A12} .notice.bad{background:var(--red-soft);color:#8A2F27} .notice.ok{background:var(--moss-soft);color:#2F5A22} .notice.info{background:var(--t-jira);color:#34407A}
.notice .b{flex:1}
.page-sec h5{font-family:var(--display);font-size:14px;margin:12px 0 4px}
.page-sec p{font-size:12.5px;line-height:1.5}
.page-sec em{background:var(--amber-soft);font-style:normal;padding:0 3px;border-radius:3px}
.mention{background:var(--plum-soft);color:var(--plum);border-radius:4px;padding:0 3px;font-weight:500}
.commitrow{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--edge);font-size:12.5px;cursor:pointer}
.commitrow:hover{color:var(--plum)}
.commitrow .h{font-family:var(--mono);font-size:11.5px;color:var(--plum)} .commitrow .w{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}

/* notes mode */
.notes-list{border-bottom:1px solid var(--edge);padding:6px 8px;max-height:200px;overflow:auto}
.nrow{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.nrow:hover{background:var(--desk)} .nrow.on{background:var(--note)}
.nrow .t{flex:1;min-width:0} .nrow .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px} .nrow .t small{color:var(--muted);font-size:11px}
.nrow .pinned{font-size:10px;color:var(--muted)}
.editor{background:var(--note) repeating-linear-gradient(transparent 0 23px,var(--note-line) 23px 24px);background-position:0 12px;border:1px solid #E8DC9A;border-radius:10px;padding:12px 14px;margin-top:8px}
.editor input{width:100%;border:0;background:transparent;font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:6px;padding:0}

.editor .ec{color:var(--plum);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip.ent{background:#fff}

/* ---------- overlays ---------- */
.ov{position:absolute;z-index:40;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:var(--shadow-lift);display:flex;flex-direction:column;overflow:hidden}
.ov .ov-head{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--edge)}
.ov .ov-head h2{font-size:18px}
.ov .ov-head .spacer{flex:1}
.ov .ov-body{overflow:auto;flex:1;padding:14px 18px 18px}
.ov.inbox{top:calc(var(--top) + 8px);right:12px;width:470px;max-height:calc(100vh - var(--top) - var(--status) - 20px)}
.ov.standup{top:calc(var(--top) + 12px);right:12px;bottom:calc(var(--status) + 12px);width:760px}
.ov.sources{top:calc(var(--top) + 12px);right:12px;bottom:calc(var(--status) + 12px);width:820px}
.ov.time{left:calc(var(--rail) + 12px);right:12px;bottom:calc(var(--status) + 12px);height:356px}
.ov.time .ov-body{display:grid;grid-template-columns:1fr 300px;gap:20px;padding-top:10px}
.ib{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--edge);cursor:default}
.ib:hover{background:var(--desk);margin:0 -10px;padding:10px}
.ib .when{font-family:var(--mono);font-size:11px;color:var(--faint);width:78px;flex:none;padding-top:2px}
.ib .b{flex:1;min-width:0;font-size:12.5px;line-height:1.4}
.ib .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ib .acts .btn{height:24px;padding:0 8px;font-size:11.5px}
.ib .acts .btn.primary{background:var(--plum-soft);color:var(--plum);border-color:transparent}
.ib .acts .btn.primary:hover{background:#E3D3F5}
.ib.gone{animation:gone .25s ease-in forwards}
@keyframes gone{to{opacity:0;height:0;padding:0;margin:0;overflow:hidden}}
.ib .ntag{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--plum);background:var(--plum-soft);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.snz{font-size:12px;color:var(--muted);padding:10px 0 0}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:12.5px}
.empty b{display:block;font-family:var(--display);font-size:15px;color:var(--text);margin-bottom:4px}
/* time */
.strip{position:relative;height:74px;margin:26px 0 10px}
.strip .tick{position:absolute;top:-20px;font-family:var(--mono);font-size:10px;color:var(--faint);transform:translateX(-50%)}
.strip .tick::after{content:"";position:absolute;left:50%;top:16px;height:6px;border-left:1px solid var(--edge)}
.blk{position:absolute;top:0;height:64px;border-radius:8px;border:1px solid var(--edge);padding:6px 8px;font-size:11px;overflow:hidden;cursor:pointer;background:var(--card)}
.blk b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .blk small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px}
.blk.passive{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(39,49,43,.06) 5px 7px)}
.blk.src-jira{background-color:var(--t-jira)} .blk.src-app{background-color:var(--desk)}
.blk.timer{background-color:var(--moss-soft);border-color:#BFD8B4}
.blk.adhoc{background-color:#fff;border:1px solid var(--plum);border-style:dashed}
.blk.unat{background-color:var(--amber-soft);border-color:var(--amber)}
.blk.gap{background:transparent;border:1px dashed var(--edge);color:var(--faint);cursor:default}
.blk.sel{box-shadow:0 0 0 2px var(--plum)}
.blk .act{position:absolute;right:6px;bottom:5px;font-size:10.5px;color:var(--plum);font-weight:600}
.now{position:absolute;top:-6px;bottom:-4px;border-left:2px solid var(--red)} .now span{position:absolute;top:-16px;left:-14px;font:10px var(--mono);color:var(--red)}
.week{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12px}
.week .bar{height:10px;background:var(--desk);border-radius:999px;overflow:hidden;position:relative}
.week .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--moss);border-radius:999px} .week .bar em{position:absolute;top:0;bottom:0;background:var(--amber);opacity:.8}
.week .h{font-family:var(--mono);font-size:11.5px;text-align:right}
.tot{display:flex;gap:14px;margin:10px 0;font-size:12px} .tot div b{display:block;font-family:var(--mono);font-size:15px;font-weight:500}
.tot .un b{color:var(--amber)}
/* standup */
.digest li{list-style:none;display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:8px;font-size:13px;line-height:1.45}
.digest li:hover{background:var(--desk)}
.digest li .src{margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--plum);background:var(--plum-soft);border-radius:4px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.digest h5{font-family:var(--display);font-size:14px;margin:10px 0 4px}
.proto{border:1px solid var(--edge);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.55;min-height:120px}
.proto:focus{outline:2px solid var(--plum);outline-offset:2px}
.proto h5{font-family:var(--display);font-size:14px;margin:8px 0 2px}
.ai{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12.5px}
.ai .t{flex:1}
.pubbox{border:1px dashed var(--faint);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px;display:flex;gap:10px;align-items:center}
.pubbox .path{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pubbox.ok{border-style:solid;border-color:#BFD8B4;background:var(--moss-soft);color:#2F5A22}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
/* sources */
.srow{display:grid;grid-template-columns:28px 34px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--edge)}
.srow .eye{width:26px;height:26px;border-radius:6px;color:var(--muted)} .srow .eye.off{color:var(--faint)} .srow .eye:hover{background:var(--desk)}
.srow .sic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px;border:1px solid var(--edge)}
.srow .name{font-weight:600;font-size:13.5px;font-family:var(--display);display:block}
.srow .url{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block}
.srow .line{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.srow .caps{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.srow .cap{font-size:10.5px;border:1px solid var(--edge);border-radius:999px;padding:0 7px;color:var(--muted)}
.srow .cap.mod{background:var(--desk);font-family:var(--mono)}
.srow .acts{display:flex;gap:6px;flex-direction:column;align-items:flex-end}
.dbline{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);padding:12px 0 0;flex-wrap:wrap}
.steps{display:flex;gap:4px;margin-bottom:14px;font-size:11.5px;color:var(--muted)} .steps span{padding:3px 8px;border-radius:999px;background:var(--desk)} .steps span.on{background:var(--plum);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--edge);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.tile:hover,.tile.on{border-color:var(--plum);background:var(--plum-soft)}
.tile b{display:block;font-family:var(--display);font-size:13px} .tile small{display:block;color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-top:2px} .tile .c{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
.form{display:grid;gap:10px;max-width:460px} .form label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.radio{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--edge);border-radius:8px;cursor:pointer;font-size:12.5px} .radio.on{border-color:var(--plum);background:var(--plum-soft)} .radio.dis{opacity:.5;cursor:default}
.formrow{display:flex;gap:8px;align-items:center;margin-top:6px}
/* modal */
#modalwrap{position:fixed;inset:0;z-index:60;background:rgba(39,49,43,.28);display:flex;align-items:center;justify-content:center}
#modalwrap[hidden]{display:none}
.modal{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-lift);width:520px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;animation:enter .2s ease-out}
.modal .m-head{display:flex;align-items:center;gap:10px;padding:16px 20px 10px}
.modal .m-head h3{font-size:17px} .modal .m-body{padding:4px 20px 16px;overflow:auto} .modal .m-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--edge);align-items:center}
.modal .m-foot .spacer{flex:1}
.steplist{list-style:none} .steplist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--edge);font-size:12.5px} .steplist li .ic-s{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--edge);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-size:11px}
.steplist li.done .ic-s{background:var(--moss);border-color:var(--moss)} .steplist li.run .ic-s{border-color:var(--plum);border-top-color:transparent;animation:spin .8s linear infinite}
.steplist li .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* time card */
.timecard{border:1px solid #CFD8CB;border-radius:10px;overflow:hidden;position:relative;background:#FBFCFA}
.timecard .tc-head{display:flex;justify-content:space-between;padding:8px 12px;background:var(--desk);font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.timecard .holes{position:absolute;left:6px;top:36px;bottom:8px;width:10px;background:radial-gradient(circle,var(--desk) 3px,transparent 3.5px) 0 0/10px 28px repeat-y}
.tc-row{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;padding:7px 12px 7px 26px;border-bottom:1px dashed var(--edge);font-size:12.5px;align-items:center}
.tc-row .i{font-family:var(--mono);font-size:12px} .tc-row .i input{width:50px;border:0;border-bottom:1px solid var(--edge);background:transparent;font-family:var(--mono);font-size:12px;text-align:center} .tc-row .h{font-family:var(--mono);text-align:right}
.tc-row.total{font-weight:600;background:var(--desk)}
.tc-act{display:flex;gap:8px;align-items:center;padding:5px 12px 5px 26px;font-size:12.5px} .tc-act input{accent-color:var(--moss)} .tc-act .w{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.stamp{position:absolute;right:22px;top:60px;transform:rotate(-12deg) scale(1.4);opacity:0;border:3px solid var(--moss);color:var(--moss);font-family:var(--display);font-weight:700;font-size:22px;padding:4px 12px;border-radius:6px;letter-spacing:.04em;pointer-events:none}
.stamp.on{animation:stamp .35s cubic-bezier(.2,1.4,.5,1) forwards}
@keyframes stamp{to{opacity:.9;transform:rotate(-12deg) scale(1)}}
/* menus, popovers, toasts */
.menu{position:fixed;z-index:70;background:var(--card);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow-lift);padding:5px;min-width:200px}
.menu button{display:flex;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:12.5px;gap:8px;align-items:center}
.menu button:hover{background:var(--desk)} .menu button.danger{color:var(--red)} .menu .sep{height:1px;background:var(--edge);margin:4px 0} .menu .hd{font-size:10.5px;color:var(--faint);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.05em}
.pop{position:fixed;z-index:70;background:var(--card);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow-lift);padding:12px 14px;width:300px;font-size:12.5px}
.pop h4{font-family:var(--display);font-size:14px;margin-bottom:8px}
.pop .row{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.pop .list button{display:flex;width:100%;text-align:left;padding:6px 8px;border-radius:6px;gap:8px;align-items:center;font-size:12.5px} .pop .list button:hover{background:var(--desk)}
.drop{position:absolute;left:0;right:0;top:40px;z-index:50;background:var(--card);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow-lift);max-height:70vh;overflow:auto;width:640px}
.drop .filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--edge);flex-wrap:wrap;align-items:center;font-size:11.5px}
.drop .filters select{height:24px;border:1px solid var(--edge);border-radius:999px;padding:0 6px;background:#fff;font-size:11.5px}
.drop .filters .x{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;border:1px dashed var(--faint);font-size:11.5px;color:var(--muted)} .drop .filters .x.on{border-style:solid;border-color:var(--plum);background:var(--plum-soft);color:var(--plum)}
.drop .res{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--edge)} .drop .res:hover,.drop .res.cur{background:var(--desk)}
.drop .res .tab{position:static;height:16px;line-height:16px;font-size:9.5px;padding:0 6px;border-radius:4px;border:1px solid var(--edge);min-width:36px;text-align:center}
.drop .res .t{flex:1;min-width:0} .drop .res .t b{font-weight:500;display:block} .drop .res .t small{color:var(--muted);font-size:11px}
.drop .res .sy{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.drop .hd{font-size:10.5px;color:var(--faint);padding:8px 12px 2px;text-transform:uppercase;letter-spacing:.05em}
.drop .sl{display:flex;gap:8px;align-items:center;padding:7px 12px;cursor:pointer;font-size:12.5px} .drop .sl:hover{background:var(--desk)} .drop .sl .n{font-family:var(--mono);color:var(--muted);font-size:11px;margin-left:auto}
#toasts{position:fixed;left:calc(var(--rail) + 14px);bottom:calc(var(--status) + 12px);z-index:80;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--text);color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-lift);display:flex;gap:10px;align-items:center;animation:tin .2s ease-out}
.toast.ok{background:var(--moss)} .toast.warn{background:var(--amber)} .toast.bad{background:var(--red)}
.toast button{color:#fff;text-decoration:underline;font-size:12px}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.drop .res,.nrow,.commitrow{text-decoration:none;color:inherit}
.digest li .src{text-decoration:none}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important} .node.note{transform:rotate(var(--rot,0deg))}}
@media (max-width:1240px){:root{--side:340px} .drop{width:560px}}

/* ---------- additions ---------- */
#app{position:relative}
.node.note.dragging{transform:rotate(var(--rot,0deg)) scale(1.04)}
.node.repo .nt{font-family:var(--mono);font-size:11.5px}
.ov.actions{top:calc(var(--top) + 12px);left:calc(var(--rail) + 12px);width:620px;max-height:calc(100vh - var(--top) - var(--status) - 24px)}
.ov .ov-head .close{width:28px;height:28px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.ov .ov-head .close:hover{background:var(--desk);color:var(--text)}
.ov .ov-head .sub{font-size:11.5px;color:var(--muted)}
.acard{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--edge);border-radius:12px;margin-bottom:8px;text-align:left;width:100%;background:var(--card)}
.acard:hover{background:var(--desk);border-color:var(--faint)}
.acard .t{flex:1;min-width:0}
.acard b{font-family:var(--display);font-size:13px;display:block}
.acard small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px;line-height:1.45}
.acard .ico{width:30px;height:30px;border-radius:9px;background:var(--desk);display:flex;align-items:center;justify-content:center;color:var(--plum);flex:none}
.ahd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:14px 0 7px}
.ahd:first-child{margin-top:0}
#drag-line{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:29}
#drag-line path{stroke:var(--plum);stroke-width:2;stroke-dasharray:5 4;fill:none}
.offdesk{font-size:11.5px;color:var(--muted);border:1px dashed var(--faint);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.offdesk .spacer{flex:1}
.sc-foot .spacer{flex:1}
.backl{display:flex;gap:8px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;font-size:12.5px;width:calc(100% + 16px);text-align:left}
.backl:hover{background:var(--desk)}
.blk.src-conf{background-color:var(--t-wiki)}

function toast(msg, cls, action){
  const d = document.createElement('div');
  d.className = 'toast ' + (cls||'');
  d.innerHTML = msg + (action ? ' <button data-toast-act="' + action[1] + '">' + action[0] + '</button>' : '');
  EL('toasts').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

  LINKS.forEach(l => { if(l[0] === id) out.push({id:l[1],label:l[2]}); else if(l[1] === id) out.push({id:l[0],label:l[2]}); });
  return out.filter(o => ENT[o.id]);
}
function suggFor(id){ return SUGG.filter(s => s.a === id || s.b === id); }

function port(a, b){
  const A = sz(a), B = sz(b);
  const acx = a.x + A.w/2, acy = a.y + A.h/2, bcx = b.x + B.w/2, bcy = b.y + B.h/2;
  const dx = bcx - acx, dy = bcy - acy;
  if(!dx && !dy) return {x:acx,y:acy,nx:0,ny:0};
  const sx = dx ? (A.w/2)/Math.abs(dx) : Infinity;
  const sy = dy ? (A.h/2)/Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy), horiz = sx <= sy;
  return { x:acx + dx*s, y:acy + dy*s, nx:horiz ? Math.sign(dx) : 0, ny:horiz ? 0 : Math.sign(dy) };
}
function edgeD(a, b){
  const p = port(a,b), q = port(b,a);
  const k = Math.min(64, Math.hypot(q.x-p.x, q.y-p.y) * 0.42);
  return 'M' + p.x + ' ' + p.y + 'C' + (p.x+p.nx*k) + ' ' + (p.y+p.ny*k) + ' ' + (q.x+q.nx*k) + ' ' + (q.y+q.ny*k) + ' ' + q.x + ' ' + q.y;
}
function visible(e){ return onDesk(e) && state.layers[e.src]; }

function renderEdges(){
  const svg = EL('edges');
  let maxX = 0, maxY = 0;
  Object.values(ENT).forEach(e => { if(onDesk(e)){ maxX = Math.max(maxX, e.x + sz(e).w); maxY = Math.max(maxY, e.y + sz(e).h); } });
  svg.setAttribute('width', maxX + 40); svg.setAttribute('height', maxY + 40);
  const nb = neighbours(state.sel).map(o => o.id);
  let s = '';
  LINKS.forEach(l => {
    const a = ENT[l[0]], b = ENT[l[1]];
    if(!visible(a) || !visible(b)) return;
    const on = state.sel === l[0] || state.sel === l[1];
    const dimmed = state.dim && (state.dim.has(l[0]) || state.dim.has(l[1]));
    s += '<path class="' + (on ? 'on ' : '') + (dimmed ? 'dim' : '') + '" d="' + edgeD(a,b) + '"/>';
    if(l[2] === 'blocked by' && !dimmed){
      const p = port(a,b), q = port(b,a), mx = (p.x+q.x)/2, my = (p.y+q.y)/2;
      s += '<g class="lbl"><rect x="' + (mx-32) + '" y="' + (my-8) + '" width="64" height="15" rx="4"/><text x="' + mx + '" y="' + (my+3) + '" text-anchor="middle">blocked by</text></g>';
    }
  });
  SUGG.forEach(g => {
    const a = ENT[g.a], b = ENT[g.b];
    if(!visible(a) || !visible(b)) return;
    const dimmed = state.dim && (state.dim.has(g.a) || state.dim.has(g.b));
    s += '<path class="sug ' + (dimmed ? 'dim' : '') + '" d="' + edgeD(a,b) + '"/>';
  });
  svg.innerHTML = s;
}

function applyView(){
  EL('world').style.transform = 'translate(' + state.tx + 'px,' + state.ty + 'px) scale(' + state.scale + ')';
  EL('zoomlbl').textContent = Math.round(state.scale * 100) + '%';
}
function fitView(){
  const c = EL('canvas').getBoundingClientRect();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  Object.values(ENT).filter(visible).forEach(e => {
    const d = sz(e); x0 = Math.min(x0, e.x); y0 = Math.min(y0, e.y);
    x1 = Math.max(x1, e.x + d.w); y1 = Math.max(y1, e.y + d.h);
  });
  if(x0 > x1) return;
  const pad = 34;
  state.scale = Math.max(0.35, Math.min(1.1, Math.min((c.width - pad*2)/(x1-x0), (c.height - pad*2)/(y1-y0))));
  state.tx = (c.width - (x1-x0)*state.scale)/2 - x0*state.scale;
  state.ty = (c.height - (y1-y0)*state.scale)/2 - y0*state.scale;
  applyView();
}
function panTo(id){
  const e = ENT[id]; if(!e || !onDesk(e)) return;
  const c = EL('canvas').getBoundingClientRect(), d = sz(e);
  const sx = state.tx + (e.x + d.w/2) * state.scale, sy = state.ty + (e.y + d.h/2) * state.scale;
  if(sx > 40 && sx < c.width - 40 && sy > 40 && sy < c.height - 40) return;
  state.tx = c.width/2 - (e.x + d.w/2) * state.scale;
  state.ty = c.height/2 - (e.y + d.h/2) * state.scale;
  applyView();
}

function chainOf(id, direct){
  const seen = new Set([id].concat(direct.map(d => d.id)));
  const out = [];
  let frontier = direct.filter(d => ENT[d.id].kind !== 'epic' && ENT[d.id].kind !== 'ticket');
  for(let depth = 0; depth < 2 && frontier.length; depth++){
    const next = [];
    frontier.forEach(f => neighbours(f.id).forEach(o => {
      if(seen.has(o.id)) return;
      const e = ENT[o.id];
      if(e.kind === 'ticket' || e.kind === 'epic') return;
      seen.add(o.id);
      const row = { id:o.id, via:'via ' + shortName(ENT[f.id]) };
      out.push(row); next.push(row);
    }));
    frontier = next;
  }
  return out;
}

const canvasEl = EL('canvas');
let drag = null, pan = null;
function worldPt(ev){
  const r = canvasEl.getBoundingClientRect();
  return { x:(ev.clientX - r.left - state.tx) / state.scale, y:(ev.clientY - r.top - state.ty) / state.scale };
}
canvasEl.addEventListener('mousedown', ev => {
  if(ev.button !== 0) return;

  if(n){
    if(ev.target.closest('.more')) return;

    drag = { id:n.dataset.id, el:n, sx:ev.clientX, sy:ev.clientY, ox:e.x, oy:e.y, moved:false };
    ev.preventDefault();
    return;
  }
  if(ev.target.closest('.lens,.sugstrip,.legend,.ctools')) return;
  pan = { sx:ev.clientX, sy:ev.clientY, tx:state.tx, ty:state.ty };
  canvasEl.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if(drag){
    const dx = (ev.clientX - drag.sx) / state.scale, dy = (ev.clientY - drag.sy) / state.scale;
    if(!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    const e = ENT[drag.id];
    e.x = drag.ox + dx; e.y = drag.oy + dy;
    drag.el.style.left = e.x + 'px'; drag.el.style.top = e.y + 'px';
    const t = dropTarget(drag.id);
    document.querySelectorAll('.node.drop').forEach(x => x.classList.remove('drop'));
    if(t){ const el = document.querySelector('.node[data-id="' + t + '"]'); if(el) el.classList.add('drop'); }
    renderEdges();
  } else if(pan){
    state.tx = pan.tx + (ev.clientX - pan.sx);
    state.ty = pan.ty + (ev.clientY - pan.sy);
    applyView();
  }
});
function dropTarget(id){
  const a = ENT[id], A = sz(a), cx = a.x + A.w/2, cy = a.y + A.h/2;
  let best = null;
  Object.values(ENT).forEach(b => {
    if(b.id === id || !visible(b)) return;
    const B = sz(b);
    if(cx > b.x && cx < b.x + B.w && cy > b.y && cy < b.y + B.h) best = b.id;
  });
  return best;
}
window.addEventListener('mouseup', ev => {
  if(pan){ pan = null; canvasEl.classList.remove('panning'); }
  if(!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove('dragging');
  document.querySelectorAll('.node.drop').forEach(x => x.classList.remove('drop'));
  if(!d.moved){ go('e/' + d.id); return; }
  const t = dropTarget(d.id);
  if(!t){ renderGraph(); return; }
  const a = ENT[d.id], b = ENT[t];
  if(a.kind === 'note'){
    pop(ev.clientX, ev.clientY, '<h4>Pin this note?</h4><p class="muted">Pin <b>' + esc(a.title) + '</b> on the corner of <b>' + esc(b.key || b.title) + '</b> and link them.</p>' +

  } else {
    pop(ev.clientX, ev.clientY, '<h4>Link these two?</h4><p class="muted"><b>' + esc(a.key || a.title) + '</b> → <b>' + esc(b.key || b.title) + '</b>. The link is local and shows as a solid edge.</p>' +
      '<div class="row"><button class="btn" data-drop="cancel|' + d.id + '|' + d.ox + '|' + d.oy + '">Cancel</button><button class="btn primary" data-drop="link|' + d.id + '|' + t + '">Link</button></div>');
  }
});
canvasEl.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = canvasEl.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.exp(-ev.deltaY * 0.0016);
  const ns = Math.max(0.35, Math.min(1.8, state.scale * k));
  state.tx = mx - (mx - state.tx) * (ns / state.scale);
  state.ty = my - (my - state.ty) * (ns / state.scale);
  state.scale = ns; applyView();
}, { passive:false });
function zoom(k){
  const r = canvasEl.getBoundingClientRect(), mx = r.width/2, my = r.height/2;
  const ns = Math.max(0.35, Math.min(1.8, state.scale * k));
  state.tx = mx - (mx - state.tx) * (ns / state.scale);
  state.ty = my - (my - state.ty) * (ns / state.scale);
  state.scale = ns; applyView();
}
canvasEl.addEventListener('contextmenu', ev => {
  const n = ev.target.closest('.node');
  if(!n) return;
  ev.preventDefault();
  nodeMenu(ev.clientX, ev.clientY, n.dataset.id);
});
</script>
<script>
"use strict";
/* ============================ navigation ============================ */
function selectOnly(id){
  if(!ENT[id]) return;
  state.sel = id;
  renderGraph(); renderSide(); renderStatus();
  panTo(id);
  document.querySelectorAll('.rail button').forEach(b =>
    b.classList.toggle('on', b.dataset.nav === (ENT[id].kind === 'note' ? 'notes' : 'desk')));
}
function applyRoute(){
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').map(p => { try { return decodeURIComponent(p); } catch(e){ return p; } });
  closePop(); closeMenu();
  if(parts[0] === 'e' && ENT[parts[1]]){ closeOv(); closeSearch(); selectOnly(parts[1]); }
  else if(['inbox','time','standup','sources','actions'].indexOf(parts[0]) > -1){ closeSearch(); openOv(parts[0]); }
  else if(parts[0] === 'notes'){ closeOv(); selectOnly('n-sepa'); }
  else if(parts[0] === 'search'){ closeOv(); openSearch(parts.slice(1).join('/')); }
  else closeOv();
}
function flash(id){
  panTo(id);
  const keep = state.hl;
  state.hl = new Set([id]); renderNodes();
  setTimeout(() => { state.hl = keep; renderNodes(); }, 1500);
}

/* ============================ one click handler ============================ */
document.addEventListener('click', ev => {
  const t = ev.target;
  const hit = sel => t.closest('[' + sel + ']');
  let el;

  if((el = t.closest('[data-close]'))){
    if(el.dataset.close === 'modal') closeModal(); else go('desk');
    return;
  }
  if((el = t.closest('[data-toast-act]'))){ runAct(el.dataset.toastAct); return; }
  if((el = t.closest('.rail button'))){ go(el.dataset.nav === 'desk' ? 'desk' : el.dataset.nav); return; }
  if(t.closest('#btn-inbox')){ go('inbox'); return; }
  if(t.closest('#btn-sync')){ go('sources'); return; }
  if(t.closest('#timerpill')){ const r = t.closest('#timerpill').getBoundingClientRect(); timerPop(r.left - 40, r.bottom + 8); return; }
  if(t.closest('#zoomin')){ zoom(1.2); return; }
  if(t.closest('#zoomout')){ zoom(1/1.2); return; }
  if(t.closest('#zoomfit')){ fitView(); return; }
  if(t.closest('#sugtoggle')){ EL('sugstrip').classList.toggle('closed'); return; }

  if((el = hit('data-lens'))){ setLens(el.dataset.lens); closeSearch(); return; }
  if((el = hit('data-fx'))){
    const k = el.dataset.fx;
    if(k === 'clear') state.filters = { src:'all', type:'all', who:'all', date:'all', failing:false, linked:false };
    else state.filters[k] = !state.filters[k];
    renderDrop(); return;
  }
  if((el = hit('data-sug'))){ el.dataset.act === 'confirm' ? confirmSug(el.dataset.sug) : dismissSug(el.dataset.sug); return; }
  if((el = hit('data-more'))){ const r = el.getBoundingClientRect(); nodeMenu(r.left, r.bottom + 4, el.dataset.more); return; }
  if((el = hit('data-mi'))){
    const [k, id] = el.dataset.mi.split('|'); closeMenu();
    if(k === 'open') go('e/' + id);
    else if(k === 'timer') startTimerOn(id);
    else if(k === 'startwork') startWork();
    else if(k === 'newnote') newNote(id);
    else if(k === 'rerun') rerun1187();
    else if(k === 'trigger') triggerBuild();
    else if(k === 'push') gitPush();
    else if(k === 'pull') gitPull();
    else if(k === 'link') linkPicker(id);
    else if(k === 'unpin'){ LINKS = LINKS.filter(l => !((l[0] === id || l[1] === id) && l[2] === 'pinned')); ENT[id].x -= 40; ENT[id].y += 70; renderGraph(); renderSide(); toast('Unpinned. The note stays on the desk.'); }
    else if(k === 'offdesk'){ delete ENT[id].x; delete ENT[id].y; renderGraph(); renderSide(); toast(esc(ENT[id].key || ENT[id].title) + ' taken off the desk. It stays in search.', '', ['Undo', 'undo|' + id]); }
    return;
  }
  if((el = hit('data-timer'))){
    const [k, id] = el.dataset.timer.split('|');
    if(k === 'stop') toggleTimer();
    else if(state.timer.id === id && !state.timer.running) toggleTimer();
    else startTimerOn(id);
    return;
  }
  if((el = hit('data-picker'))){ linkPicker(el.dataset.picker); return; }
  if((el = hit('data-link'))){ const [a, b] = el.dataset.link.split('|'); doLink(a, b); return; }
  if((el = hit('data-addcomment'))){ addComment(el.dataset.addcomment); return; }
  if((el = hit('data-adddesk'))){ addToDesk(el.dataset.adddesk); renderSide(); return; }
  if((el = hit('data-git'))){ el.dataset.git === 'pull' ? gitPull() : gitPush(); return; }
  if((el = hit('data-drop'))){
    const [k, id, b, c] = el.dataset.drop.split('|'); closePop();
    if(k === 'cancel'){ ENT[id].x = +b; ENT[id].y = +c; renderGraph(); }
    else if(k === 'pin') pinNote(id, b);
    else { LINKS.push([id, b, '']); renderGraph(); renderSide(); toast('Linked ' + esc(ENT[id].key || ENT[id].title) + ' ↔ ' + esc(ENT[b].key || ENT[b].title) + '.', 'ok'); }
    return;
  }
  if((el = hit('data-tm'))){
    const [k, id] = el.dataset.tm.split('|'); closePop();
    if(k === 'stop' || k === 'start') toggleTimer();
    else if(k === 'sw') startTimerOn(id);
    else if(k === 'label'){ startTimerOn('', 'Staging DB configuration'); state.timer.id = ''; renderGraph(); }
    else if(k === 'day') go('time');
    return;
  }
  if((el = hit('data-focus'))){ flash(el.dataset.focus); return; }
  if((el = hit('data-ibact'))){ const [id, target, kind] = el.dataset.ibact.split('|'); inboxAct(id, target, kind); return; }
  if((el = hit('data-blk'))){ blockClick(+el.dataset.blk); return; }
  if((el = hit('data-assign'))){
    const [i, id] = el.dataset.assign.split('|'); closeModal();
    const b = state.day[+i];
    if(id === 'label'){ b.t = 'Staging DB configuration'; b.kind = 'adhoc'; b.cls = 'adhoc'; toast('11:50–12:20 labelled locally.', 'ok'); }
    else { b.t = ENT[id].key; b.kind = null; b.cls = 'src-jira passive'; b.ent = id; toast('11:50–12:20 assigned to ' + ENT[id].key + '.', 'ok'); }
    renderTime(); return;
  }
  if((el = hit('data-adhoc'))){
    const id = el.dataset.adhoc; closeModal();
    const b = state.day.find(x => x.kind === 'adhoc');
    if(id === 'local'){ toast('Kept “Staging DB configuration” local. Nothing written back.', 'ok'); }
    else { b.ent = id; b.cls = 'src-jira'; b.t = ENT[id].key + ' · Staging DB configuration'; state.worklogs.push({ ent:id, day:'Today', h:'0h 48m', t:'Staging DB configuration' }); toast('Logged 48m to ' + ENT[id].key + '.', 'ok'); }
    renderTime(); renderSide(); return;
  }
  if((el = hit('data-ai'))){ createTicket(); return; }
  if((el = hit('data-layer'))){
    const id = el.dataset.layer;
    state.layers[id] = !state.layers[id];
    renderSources(); renderGraph();
    toast((state.layers[id] ? 'Showing ' : 'Hiding ') + TABS[id] + ' cards on the desk.');
    return;
  }
  if((el = hit('data-syncnow'))){
    const s = state.sources.find(x => x.id === el.dataset.syncnow);
    if(s.state === 'bad'){ toast('TeamCity still returns 401. Re-enter the password to fix it.', 'bad', ['Re-enter', 'fixteamcity']); return; }
    s.sync = 'synced just now'; renderSources(); renderTop(); toast(s.name + ' synced.', 'ok'); return;
  }
  if((el = hit('data-wtype'))){ wiz.type = el.dataset.wtype; renderWizard(); return; }
  if((el = hit('data-wnav'))){
    if(EL('w-url')) wiz.url = EL('w-url').value;
    const dir = +el.dataset.wnav;
    if(dir > 0 && wiz.step === 2 && !wiz.url.trim()){ toast('Add the base URL first — knobas needs it to reach the instance.', 'warn'); return; }
    wiz.step = Math.max(1, Math.min(5, wiz.step + dir));
    renderWizard(); return;
  }
  if((el = hit('data-hl'))) return;
  if((el = hit('data-act'))){ runAct(el.dataset.act); return; }
});

document.addEventListener('mouseover', ev => {
  const el = ev.target.closest('[data-hl]');
  if(!el) return;
  if(state.lens) return;
  state.hl = new Set([el.dataset.hl]); renderNodes();
});
document.addEventListener('mouseout', ev => {
  const el = ev.target.closest('[data-hl]');
  if(!el || state.lens) return;
  state.hl = null; renderNodes();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.dataset && t.dataset.status){ setStatus(t.dataset.status, t.value); return; }
  if(t.dataset && t.dataset.f){ state.filters[t.dataset.f] = t.value; renderDrop(); return; }
  if(t.name === 'wauth'){ wiz.auth = t.value; renderWizard(); return; }
});
EL('q').addEventListener('input', e => { state.q = e.target.value; openSearch(undefined, false); });
EL('q').addEventListener('focus', () => openSearch(undefined, false));
document.addEventListener('mousedown', ev => {
  if(!ev.target.closest('.search') && !EL('drop').classList.contains('hidden')) closeSearch();
  if(!ev.target.closest('#menu') && !ev.target.closest('[data-more]')) closeMenu();
  if(!ev.target.closest('#pop') && !ev.target.closest('#timerpill') && !ev.target.closest('.node')) closePop();
});

/* ============================ actions router ============================ */
function runAct(a){
  const p = a.split('|');
  switch(p[0]){
    case 'undo': addToDesk(p[1]); break;
    case 'startwork': closeOv(); startWork(); break;
    case 'createticket': createTicket(); break;
    case 'doct': doCreateTicket(); break;
    case 'createpage': createPage(); break;
    case 'docp': doCreatePage(); break;
    case 'createrepo': createRepo(); break;
    case 'docr': {
      const name = EL('cr-name').value.trim() || 'new-repo'; closeModal();
      N({ id:'repo-new', kind:'repo', src:'gitea', key:'repo', title:name, lang:'—', clone:'~/code/' + name, x:930, y:600, hay:name + ' repo new' });
      renderGraph(); go('e/repo-new');
      toast('Repository <span class="mono">tidewater/' + esc(name) + '</span> created and cloned.', 'ok'); break;
    }
    case 'newbranch': newBranch(); break;
    case 'donb': {
      const n = EL('nb-name').value.trim(); closeModal();
      toast('Branch <span class="mono">' + esc(n) + '</span> created from main and checked out.', 'ok'); break;
    }
    case 'newnote': newNote(); break;
    case 'savenote': saveNote(state.sel); break;
    case 'trigger': triggerBuild(); break;
    case 'dotrigger': doTrigger(); break;
    case 'rerun1187': rerun1187(); break;
    case 'gitpull': gitPull(); break;
    case 'gitpush': gitPush(); break;
    case 'worklog': openWorklog(); break;
    case 'wl-edit': { const f = EL('wl-a1'); if(f){ f.focus(); f.select(); } toast('Edit the start and end times on the card.'); break; }
    case 'logall': state.unlogged = '0h 00m'; renderTime(); toast('Logged 4h 45m across PAY-231, PAY-228 and OPS-77.', 'ok'); break;
    case 'publish': state.protoPublished = true; renderStandup(); toast('Published to ENG › Standup protocols › 2026-08-22.', 'ok'); break;
    case 'saveproto': {
      const id = 'n-proto';
      if(!ENT[id]) N({ id:id, kind:'note', src:'note', key:'note', title:'Standup protocol 2026-08-22', edited:'today ' + NOW, rot:-1.1,
        body:'Attendees: Mara, Jonas, Priya, Tomasz, Lena.\n\nJonas: PR #144 CSV export ready for review.\nPriya: finance wants the manual-review SLA documented by Monday.\nTomasz: on-call handbook update in progress, ETA Tuesday (OPS-77).\nLena: finance complaints about dashboard latency → PAY-240.\n\nActions: Mara → SLA on [[SEPA payout retry design]]; Tomasz → [[OPS-77]]; Lena → PAY-240.',
        x:700, y:660, hay:'standup protocol 2026-08-22 note' });
      renderGraph(); toast('Saved as a local note, pinned to the desk.', 'ok'); break;
    }
    case 'copyproto': toast('Digest copied — yesterday, today and blockers.'); break;
    case 'addsource': wiz.step = 1; wiz.tested = false; renderWizard(); break;
    case 'wcancel': renderSources(); break;
    case 'wtest': wiz.tested = true; renderWizard(); toast('Connection ok — adapter reports search, write and webhooks.', 'ok'); break;
    case 'wsave': {
      state.sources.push({ id:'new', name:wiz.type + ' — Tidewater', type:wiz.type, url:wiz.url || 'https://git.tidewater.internal',
        auth:wiz.auth === 'user' ? 'user + password' : wiz.auth === 'pat' ? 'personal access token' : 'API token',
        state:'ok', sync:'first sync running', count:'—', v:'adapter v1.2', caps:['search','write','webhooks'], ic:'NW', tint:'--t-git' });
      state.layers['new'] = true; renderSources(); renderTop();
      toast(wiz.type + ' added. First sync started; it will index into the local database.', 'ok'); break;
    }
    case 'syncall': state.sources.forEach(s => { if(s.state === 'ok') s.sync = 'synced just now'; }); renderSources(); toast('Synced Jira, Wiki and Git. TeamCity still returns 401.', 'warn'); break;
    case 'schedule': toast('Sync schedule is every 5 minutes for all sources.'); break;
    case 'fixteamcity': fixTeamCity(); break;
    case 'dofix': doFix(); break;
    case 'renewpat':
      modal('<div class="m-head"><h3>Renew the Jira token</h3><span class="spacer"></span></div><div class="m-body">' +
        '<div class="notice warn"><span class="b">The PAT for <span class="mono">tidewater.atlassian.net</span> expires <b>2026-09-03</b>, in 12 days. Jira and Wiki share it.</span></div>' +
        '<div class="form" style="max-width:none"><div><label for="pat">New token</label><input class="in" id="pat" type="password" value="················"></div></div></div>' +
        '<div class="m-foot"><button class="btn primary" data-act="dopat">Save token</button><span class="spacer"></span><button class="btn ghost" data-close="modal">Cancel</button></div>');
      break;
    case 'dopat': {
      closeModal();
      const s = state.sources.find(x => x.id === 'jira');
      s.auth = 'PAT — expires 2027-08-22'; s.warn = null;
      const w = state.sources.find(x => x.id === 'confluence'); w.auth = 'same PAT as Jira';
      renderSources(); toast('Token saved for Jira and Wiki.', 'ok'); break;
    }
    case 'inboxall': state.inbox = []; renderInbox(); renderTop(); toast('Inbox cleared.', 'ok'); break;
    case 'unsnooze': {
      state.snoozed.shift();
      state.inbox.push({ id:'i7', when:'today ' + NOW, node:null, t:'Jira PAT expires in 12 days — renew it before 2026-09-03', acts:[['Renew token','','renewpat'],['Done','','done']] });
      renderInbox(); renderTop(); break;
    }
    case 'approve144': {
      (state.comments['pr144'] = state.comments['pr144'] || []).push({ who:'Mara Lindqvist', ai:'ML', cls:'', when:'today ' + NOW, t:'Approved. CSV export looks good — one nit about the header row, left inline.' });
      const i = state.inbox.findIndex(x => x.id === 'i1');
      if(i > -1){ state.inbox.splice(i, 1); renderTop(); }
      renderSide(); toast('Approved PR #144 — Jonas Becker notified.', 'ok'); break;
    }
    case 'addsla':
      modal('<div class="m-head"><h3>Manual review queue — SLA</h3><span class="spacer"></span></div><div class="m-body">' +
        '<p class="muted" style="margin-bottom:8px">Priya asked for this today 12:05. It edits the section directly in Confluence.</p>' +
        '<textarea class="ta" id="sla" rows="3">SLA: payouts in the manual review queue are picked up within one business day; finance is notified the same day.</textarea>' +
        '</div><div class="m-foot"><button class="btn primary" data-act="dosla">Save the section</button><span class="spacer"></span><button class="btn ghost" data-close="modal">Cancel</button></div>');
      break;
    case 'dosla': {
      const txt = EL('sla').value.trim(); closeModal();
      ENT['p-design'].sla = txt; ENT['p-design'].edited = 'today ' + NOW;
      (state.comments['p-design'] = state.comments['p-design'] || []).push({ who:'Mara Lindqvist', ai:'ML', cls:'', when:'today ' + NOW, t:'Added the SLA to the manual-review section.' });
      const i = state.inbox.findIndex(x => x.id === 'i2');
      if(i > -1){ state.inbox.splice(i, 1); renderTop(); }
      renderSide(); toast('Section saved to Confluence and Priya notified.', 'ok'); break;
    }
    default: toast('Nothing wired to “' + esc(a) + '” in this mockup.');
  }
}

/* ============================ keyboard ============================ */
document.addEventListener('keydown', ev => {
  const meta = ev.metaKey || ev.ctrlKey;
  if(meta && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); openSearch(); return; }
  if(meta && ev.key.toLowerCase() === 't'){ ev.preventDefault(); toggleTimer(); return; }
  if(ev.key === 'Escape'){
    if(!EL('modalwrap').hidden){ closeModal(); return; }
    if(EL('pop')){ closePop(); return; }
    if(EL('menu')){ closeMenu(); return; }
    if(!EL('drop').classList.contains('hidden')){ closeSearch(); EL('q').blur(); return; }
    if(state.ov){ go('desk'); return; }
    if(state.lens){ setLens(state.lens); return; }
    return;
  }
  if(ev.target.classList && ev.target.classList.contains('node') && (ev.key === 'Enter' || ev.key === ' ')){
    ev.preventDefault(); go('e/' + ev.target.dataset.id); return;
  }
  if(document.activeElement === EL('q') && !EL('drop').classList.contains('hidden')){
    const rows = [...EL('drop').querySelectorAll('.res')];
    if(!rows.length) return;
    let i = rows.findIndex(r => r.classList.contains('cur'));
    if(ev.key === 'ArrowDown'){ ev.preventDefault(); i = Math.min(rows.length - 1, i + 1); }
    else if(ev.key === 'ArrowUp'){ ev.preventDefault(); i = Math.max(0, i - 1); }
    else if(ev.key === 'Enter'){ ev.preventDefault(); const r = rows[i < 0 ? 0 : i]; if(r){ location.hash = r.getAttribute('href'); EL('q').blur(); } return; }
    else return;
    rows.forEach(r => r.classList.remove('cur'));
    rows[i].classList.add('cur');
    rows[i].scrollIntoView({ block:'nearest' });
  }
});

/* ============================ boot ============================ */
function boot(){
  renderTop(); renderStatus(); renderSug(); renderLenses(); renderGraph(); renderSide();
  fitView();
  window.addEventListener('hashchange', applyRoute);
  if(!location.hash || location.hash === '#') location.hash = '#/e/pay-231';
  else applyRoute();
  setInterval(() => { if(state.timer.running) renderTop(); }, 1000);
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fitView, 200); });
}
try { boot(); } catch(err){ EL('err').textContent = 'init failed: ' + err.message; }
</script>
