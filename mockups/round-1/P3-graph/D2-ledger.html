<!--
knobas mockup
paradigm: P3 Graph
design: D2 Ledger
thesis: Seeing the shape of your work — which ticket pulls which branch, build, page and note — and linking things by dragging one onto another instead of filling forms.
thesis: The graph is drawn in ink on ruled ledger paper: nodes sit on the ruling like entries, confirmed links are ink lines, proposals are pencil-dashed, and every card and row is a dated ledger line with a stamp.
thesis: Rubber-stamped nodes — each entity on the canvas carries a rotated JIRA / WIKI / GIT / CI / NOTE stamp; confirming a dashed link inks it solid with a 200 ms stamp.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Tidewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;100,700;125,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA; --panel:#F4F5F2; --rule:#D7DEE8; --margin:#E0857C;
  --ink:#1B2230; --muted:#5F6B7A; --faint:#9AA5B4;
  --blue:#1F3A8A; --red:#C8372D;
  --blue-tint:#EEF1FA; --red-tint:#FBEDEB;
  --ff:'Archivo',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --row:34px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{font:13px/1.45 var(--ff);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue);color:#fff}
[hidden]{display:none!important}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:48px 1fr 420px;grid-template-rows:44px 1fr 26px;height:100vh;width:100vw;min-width:1100px;position:relative}
@media (max-width:1240px){#app{grid-template-columns:48px 1fr 360px}
  .brand small{display:none}
  .card .lrow{grid-template-columns:56px 56px 1fr auto 40px}
  .card .lrow .desc.serif{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:1320px){.status .s.sched{display:none}}

.top{grid-column:1/4;grid-row:1;display:flex;align-items:center;gap:10px;padding:0 12px 0 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{font-family:var(--ff);font-stretch:125%;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-right:6px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brand small{font-stretch:100%;font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--muted);font-size:12px}
.search{position:relative;flex:0 1 380px;min-width:220px}
.search input{width:100%;height:30px;padding:0 58px 0 30px;border:1px solid var(--rule);background:var(--paper);font-size:13px}
.search input:focus{border-color:var(--blue);outline:0;box-shadow:inset 0 0 0 1px var(--blue)}
.search .glyph{position:absolute;left:9px;top:7px;color:var(--muted);pointer-events:none}
.search .kbd{position:absolute;right:8px;top:7px}
.kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--rule);padding:1px 4px;background:var(--paper);line-height:1.2}
.top .spacer{flex:1}
.pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--rule);background:var(--paper);font-size:12px;white-space:nowrap}
.pill:hover{border-color:var(--ink)}
.pill.timer{border-color:var(--blue);color:var(--blue)}
.pill.timer.off{border-color:var(--rule);color:var(--muted)}
.pill .cnt{font-family:var(--mono);font-size:11px;color:#fff;background:var(--red);padding:1px 5px;min-width:18px;text-align:center}
.pill.sync .dot{width:8px;height:8px;background:var(--blue);display:inline-block}
.pill.sync.bad .dot{background:var(--red)}
.pill.sync.bad{color:var(--red);border-color:var(--red)}
.iconbtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;color:var(--muted)}
.iconbtn:hover{border-color:var(--ink);color:var(--ink)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}

.rail{grid-column:1;grid-row:2;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.rail button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;border:1px solid transparent}
.rail button:hover{color:var(--ink);border-color:var(--ink)}
.rail button.on{color:var(--blue);border-color:var(--blue);background:var(--paper)}
.rail button .b{position:absolute;top:2px;right:2px;font:500 9px/1 var(--mono);background:var(--red);color:#fff;padding:1px 3px}
.rail .grow{flex:1}
.rail svg.i{width:18px;height:18px}

/* ---------- canvas ---------- */
.canvas-wrap{grid-column:2;grid-row:2;position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.lenses{height:34px;display:flex;align-items:center;gap:5px;padding:0 10px 0 14px;border-bottom:1px solid var(--rule);background:var(--paper);overflow-x:auto;flex:none}
.lenses::-webkit-scrollbar{height:0}
.lens{height:24px;padding:0 6px;border:1px solid var(--rule);background:var(--paper);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.lens .n{font-family:var(--mono);font-size:11px;color:var(--ink)}
.lens .up{font-family:var(--mono);font-size:10px;color:var(--red)}
.lens:hover{border-color:var(--ink);color:var(--ink)}
.lens.on{border-color:var(--blue);color:var(--blue);background:var(--blue-tint)}
.lens.on .n{color:var(--blue)}
.lenses .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.lensnote{position:absolute;top:34px;left:0;right:0;z-index:3;background:var(--blue-tint);border-bottom:1px solid var(--rule);padding:5px 14px 5px 14px;font-size:12px;color:var(--ink);display:flex;gap:12px;align-items:center}
.lensnote b{font-weight:600}
.lensnote .x{margin-left:auto}
#canvas{flex:1;position:relative;overflow:hidden;cursor:grab;
  background-image:
    linear-gradient(to right, transparent 55px, var(--margin) 55px, var(--margin) 56px, transparent 56px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-color:var(--paper)}
#canvas.panning{cursor:grabbing}
#canvas.linking{cursor:crosshair}
#graph{width:100%;height:100%;display:block}
#graph text{font-family:var(--ff);fill:var(--ink);user-select:none;pointer-events:none}
.edge{stroke:var(--blue);stroke-width:1.3;fill:none}
.edge.suggested{stroke:var(--red);stroke-dasharray:5 4;stroke-width:1.2;cursor:pointer}
.edge.blocked{stroke:var(--red)}
.edge-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.edge-lbl{font-size:10px;fill:var(--red);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.edge.dim,.edge-lbl.dim{opacity:.15}
.edge.hot{stroke-width:2.2}
.node{cursor:pointer}
.node .box{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.node:hover .box{stroke-width:1.6}
.node.sel .box{stroke:var(--blue);stroke-width:2;fill:var(--blue-tint)}
.node.hot .box{stroke:var(--blue);stroke-width:2.2;fill:var(--blue-tint)}
.node.dim{opacity:.22}
.node.drop .box{stroke:var(--red);stroke-width:2;stroke-dasharray:4 3}
.node .key{font-family:var(--mono);font-size:12px;font-weight:500}
.node .sub{font-size:10px;fill:var(--muted)}
.node .ttl{font-size:11px;fill:var(--ink)}
.node .ttl.serif{font-family:var(--serif);font-size:12px}
.node.sel .key,.node.hot .key{fill:var(--blue)}
.node .ring{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:7 5;animation:ringspin 6s linear infinite}
@keyframes ringspin{to{stroke-dashoffset:-48}}
.node .runner{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:3 2.2;transform-box:fill-box;transform-origin:center;animation:runspin 2.4s linear infinite}
@keyframes runspin{to{transform:rotate(360deg)}}
.node:focus-visible{outline:0}
.node:focus-visible .box{stroke:var(--blue);stroke-width:2.4}
g.sstamp{mix-blend-mode:multiply;opacity:.85;transform-box:fill-box;transform-origin:center}
g.sstamp rect{fill:var(--paper);stroke:var(--red);stroke-width:1}
g.sstamp rect+rect{fill:none}
g.sstamp text{font-size:8px;font-weight:700;letter-spacing:.14em;fill:var(--red)}
g.sstamp.blue rect{stroke:var(--blue)} g.sstamp.blue text{fill:var(--blue)}
g.sstamp.ink rect{stroke:var(--ink)} g.sstamp.ink text{fill:var(--ink)}
g.sstamp.big rect{fill:none;stroke-width:1.3} g.sstamp.big text{font-size:10px}
g.sstamp.in{animation:stampin .2s ease-out}
@keyframes stampin{from{transform:scale(1.7);opacity:0}to{opacity:.85}}
.ghost{stroke:var(--red);stroke-width:1.3;stroke-dasharray:5 4;fill:none;pointer-events:none}
.legend{position:absolute;left:14px;bottom:10px;display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);pointer-events:none;background:rgba(252,252,250,.85);padding:4px 8px}
.legend .ln{display:inline-block;width:22px;border-top:1.4px solid var(--blue);vertical-align:middle}
.legend .ln.dash{border-top:1.3px dashed var(--red)}
.legend .ln.ring{border-top:1.4px dashed var(--blue);border-radius:50%;width:14px;height:14px;border:1.4px dashed var(--blue)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;border:1px solid var(--rule);background:var(--paper)}
.zoom button{width:28px;height:26px;color:var(--muted);font-size:14px}
.zoom button:hover{color:var(--ink);background:var(--panel)}
.zoom button+button{border-left:1px solid var(--rule)}
.hint{position:absolute;right:10px;top:44px;font-size:11px;color:var(--faint);pointer-events:none}

/* ---------- stamps (HTML) ---------- */
.stamp{display:inline-block;font:700 9px/1 var(--ff);letter-spacing:.14em;text-transform:uppercase;padding:3px 5px;border:3px double var(--red);color:var(--red);transform:rotate(var(--rot,-3deg));opacity:.85;mix-blend-mode:multiply;white-space:nowrap;background:var(--paper)}
.stamp.blue{border-color:var(--blue);color:var(--blue)}
.stamp.ink{border-color:var(--ink);color:var(--ink)}
.stamp.big{font-size:11px;padding:4px 8px}
.stamp.in{animation:stampin .2s ease-out}

/* ---------- card (right) ---------- */
.card{grid-column:3;grid-row:2;overflow:auto;border-left:1px solid var(--rule);background:var(--paper);position:relative;min-width:0}
.card .margin{position:absolute;left:36px;top:0;bottom:0;width:1px;background:var(--margin);pointer-events:none;min-height:100%}
.card-in{padding:14px 16px 40px 48px;position:relative}
.card-in.empty{color:var(--muted);font-size:12.5px}
.chead{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.chead .stamp{margin-top:3px}
.chead .k{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--blue)}
.chead .meta{font-size:11px;color:var(--muted);margin-top:2px}
.chead .more{margin-left:auto}
h1.t{font:600 16px/1.25 var(--ff);margin:2px 0 10px;letter-spacing:-.01em}
h1.t.serif{font-family:var(--serif);font-weight:600;font-size:17px}
h2.s{font:600 11px/1 var(--ff);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
h2.s .n{font-family:var(--mono);color:var(--faint);letter-spacing:0}
h2.s .r{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;font-size:11px}
.fields{display:grid;grid-template-columns:92px 1fr;border-top:1px solid var(--rule)}
.fields>div{padding:0 6px 0 0;min-height:30px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--rule);font-size:12.5px}
.fields>div:nth-child(odd){font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fields select{height:24px;border:1px solid var(--rule);background:var(--paper);padding:0 4px;font-size:12px}
.fields select:hover{border-color:var(--ink)}
.prio.High{color:var(--red);font-weight:500}
.serif{font-family:var(--serif);font-size:14px;line-height:1.5}
.desc{font-family:var(--serif);font-size:14px;line-height:1.5;padding:6px 0 4px}
.desc code{font-size:12px;background:var(--panel);padding:0 3px}
.desc h3{font:600 14px/1.3 var(--serif);margin:10px 0 4px}
.desc h3:first-child{margin-top:0}
.desc em{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.btn{height:26px;padding:0 10px;border:1px solid var(--ink);background:var(--paper);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:#172d6d}
.btn.d{color:var(--red);border-color:var(--red)}
.btn.d:hover{background:var(--red-tint)}
.btn.q{border-color:var(--rule);color:var(--muted)}
.btn.q:hover{color:var(--ink);border-color:var(--ink)}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg.i{width:13px;height:13px}

/* ledger rows */
.ledger{border-top:1px solid var(--rule)}
.lrow{display:grid;grid-template-columns:58px 74px 1fr auto 46px;gap:8px;align-items:center;min-height:var(--row);padding:3px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.lrow.click{cursor:pointer}
.lrow.click:hover{background:var(--panel)}
.lrow .d{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.lrow .ref{font-family:var(--mono);font-size:12px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .desc{font-family:var(--ff);font-size:12.5px;padding:0;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .desc.serif{font-family:var(--serif);font-size:13.5px;white-space:normal}
.lrow .st{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}
.lrow .st.red{color:var(--red);font-weight:500}
.lrow .st.blue{color:var(--blue)}
.lrow .stamp{justify-self:end}
.lrow .tot{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink)}
.lrow.sum{background:var(--panel);font-weight:500}
.lrow.sug{grid-template-columns:74px 1fr auto;background:var(--red-tint)}
.lrow.sug .why{font-size:11px;color:var(--muted);display:block;white-space:normal}
.lrow.sug .acts{display:flex;gap:4px}
.lrow.cmt{grid-template-columns:58px 1fr;align-items:start}
.lrow.cmt .who{font-weight:500;font-size:12px}
.lrow.cmt .txt{font-family:var(--serif);font-size:13.5px;line-height:1.45;white-space:normal}
.lrow.wl{grid-template-columns:58px 1fr 62px 62px}
.lrow.wl .d2{font-family:var(--mono);font-size:11.5px;text-align:right}
.lrow.two{grid-template-columns:58px 1fr auto}
.lrow.chk{grid-template-columns:1fr auto}
.lrow.note{grid-template-columns:58px 1fr 46px}
.lrow.file{grid-template-columns:1fr auto}
.lrow.file .diff{font-family:var(--mono);font-size:11px}
.lrow.file .diff b{color:var(--blue);font-weight:500} .lrow.file .diff i{color:var(--red);font-style:normal}
.lrow.on{background:var(--blue-tint)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--blue);border:1px solid var(--rule);padding:1px 5px;background:var(--paper);cursor:pointer;white-space:nowrap;vertical-align:middle}
.chip:hover{border-color:var(--blue)}
.chip.red{color:var(--red)}
.plus{color:var(--blue);font-family:var(--mono)} .minus{color:var(--red);font-family:var(--mono)}
textarea.ta{width:100%;min-height:64px;border:1px solid var(--rule);background:var(--paper);padding:6px 8px;font-family:var(--serif);font-size:13.5px;line-height:1.5;resize:vertical}
textarea.ta:focus{border-color:var(--blue);outline:0;box-shadow:inset 0 0 0 1px var(--blue)}
textarea.ta.big{min-height:220px}
input.in,select.in{height:28px;border:1px solid var(--rule);background:var(--paper);padding:0 8px;font-size:12.5px;width:100%}
input.in:focus,select.in:focus{border-color:var(--blue);outline:0;box-shadow:inset 0 0 0 1px var(--blue)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .red{color:var(--red)} .blue{color:var(--blue)}
.small{font-size:11px}
.pre{font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--panel);border:1px solid var(--rule);padding:8px 10px;white-space:pre-wrap;overflow:auto}
.pre .f{color:var(--red);font-weight:500}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.runner-i{display:inline-block;width:11px;height:11px;border:1.4px dashed var(--ink);border-radius:50%;vertical-align:-1px;animation:runspin 2.4s linear infinite}
.notelist{border-top:1px solid var(--rule);margin-bottom:10px}
.backlinks .lrow{grid-template-columns:74px 1fr 46px}
.editorbar{display:flex;gap:6px;align-items:center;margin:6px 0}
.editorbar .muted{margin-left:auto}

/* ---------- status bar ---------- */
.status{grid-column:1/4;grid-row:3;display:flex;align-items:center;gap:0;background:var(--panel);border-top:1px solid var(--rule);font-size:11px;color:var(--muted);padding:0 10px;white-space:nowrap;overflow:hidden}
.status .s{display:flex;align-items:center;gap:5px;padding:0 10px;border-right:1px solid var(--rule);height:100%}
.status .s:first-child{padding-left:0}
.status .s b{font-weight:500;color:var(--ink)}
.status .s.bad{color:var(--red)} .status .s.bad b{color:var(--red)}
.status .s .dot{width:7px;height:7px;background:var(--blue);display:inline-block}
.status .s.bad .dot{background:var(--red)}
.status .s button{color:var(--blue);text-decoration:underline;text-underline-offset:2px;font-size:11px}
.status .grow{flex:1}
.status .s.last{border-right:0}
.status .mono{font-size:11px}

/* ---------- overlays ---------- */
.sheet{position:absolute;top:44px;right:0;bottom:26px;width:640px;max-width:calc(100vw - 48px - 160px);background:var(--paper);border-left:1px solid var(--ink);box-shadow:-8px 0 24px rgba(27,34,48,.12);z-index:20;display:flex;flex-direction:column;min-width:0}
.sheet.w{width:880px}
.sheet.m{width:720px}
.shead{display:flex;align-items:center;gap:10px;padding:0 16px 0 48px;height:44px;border-bottom:1px solid var(--rule);background:var(--panel);position:relative;flex:none}
.shead::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:1px;background:var(--margin)}
.shead h1{font:600 14px/1 var(--ff);letter-spacing:.02em}
.shead .sub{font-size:11.5px;color:var(--muted)}
.shead .x{margin-left:auto}
.sbody{flex:1;overflow:auto;position:relative;padding:12px 16px 30px 48px}
.sbody::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:1px;background:var(--margin);min-height:100%}
.sbody.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-content:start}
.sbody.cols>div{min-width:0}
.sheet h2.s:first-child{margin-top:4px}
.inbox .lrow{grid-template-columns:50px 46px 1fr;align-items:start;padding:7px 0;cursor:pointer}
.inbox .lrow:hover{background:var(--panel)}
.inbox .lrow.hl{background:var(--blue-tint)}
.inbox .txt{font-size:12.5px;line-height:1.4}
.inbox .txt q{font-family:var(--serif);font-size:13.5px}
.inbox .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.inbox .reply{margin-top:6px;display:flex;gap:6px}
.inbox .reply input{flex:1}
.inbox .done{opacity:.55}
.srcrow{display:grid;grid-template-columns:24px 46px 1fr 150px 170px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12px}
.srcrow .name{font-weight:600;font-size:13px}
.srcrow .url{font-family:var(--mono);font-size:11px;color:var(--muted)}
.srcrow .caps{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.srcrow .cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);padding:0 4px;color:var(--muted)}

.picker .res{max-height:240px;overflow:auto}
.picker .res button{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:5px 10px;border-bottom:1px solid var(--rule);font-size:12px}

/* search dropdown */
.sdrop{position:absolute;top:40px;left:0;width:640px;max-width:calc(100vw - 120px);z-index:50;background:var(--paper);border:1px solid var(--ink);box-shadow:0 12px 36px rgba(27,34,48,.18)}
.sdrop .filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--panel);align-items:center}

.fchip.x{border-style:dashed}
.sdrop .res{max-height:400px;overflow:auto}
.sdrop .lrow{grid-template-columns:58px 80px 1fr auto 46px;cursor:pointer;padding:4px 10px}
.sdrop .lrow:hover,.sdrop .lrow.cur{background:var(--blue-tint)}
.sdrop .syn{font-size:10.5px;color:var(--faint);white-space:nowrap}

#toasts{position:absolute;left:60px;bottom:36px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--paper);border:1px solid var(--ink);box-shadow:0 6px 20px rgba(27,34,48,.16);padding:8px 12px 8px 10px;font-size:12.5px;display:flex;gap:10px;align-items:center;max-width:520px;pointer-events:auto;animation:toastin .18s ease-out}

@keyframes toastin{from{transform:translateY(8px);opacity:0}}
#jserr{position:absolute;left:0;top:0;z-index:99;background:var(--red);color:#fff;padding:4px 8px;font:11px var(--mono)}
@media (prefers-reduced-motion:reduce){
  .node .ring,.node .runner,.runner-i,.stepsl .ic.run{animation:none}
  g.sstamp.in,.stamp.in,.toast{animation:none}
}

const $ = (s, r=document) => r.querySelector(s);

/* ---------- entities (nodes) ---------- */
const N = {};
function def(o) { N[o.id] = o; return o; }

/* --- pointer: pan, select, drag-to-link --- */
let drag = null;
svg.addEventListener('mousedown', ev => {
  if (ev.button !== 0) return;
  closePop();
  const g = ev.target.closest('.node');
  const [x, y] = toClient(ev);
  if (g) drag = { type:'node', id:g.dataset.id, sx:ev.clientX, sy:ev.clientY, moved:false };
  else { drag = { type:'pan', sx:ev.clientX, sy:ev.clientY, ox:state.view.x, oy:state.view.y, moved:false }; canvas.classList.add('panning'); }
  ev.preventDefault();
});
window.addEventListener('mousemove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true;
  if (drag.type === 'pan') { state.view.x = drag.ox + dx; state.view.y = drag.oy + dy; applyView(); return; }
  canvas.classList.add('linking');
  let ghost = world.querySelector('.ghost');
  if (!ghost) { ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path'); ghost.setAttribute('class', 'ghost'); world.appendChild(ghost); }
  const n = N[drag.id], [wx, wy] = toWorld(ev);
  ghost.setAttribute('d', `M${n.pos[0]} ${n.pos[1]}L${wx} ${wy}`);
  $$('.node.drop', world).forEach(g => g.classList.remove('drop'));
  const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.node');
  if (under && under.dataset.id !== drag.id) { under.classList.add('drop'); drag.over = under.dataset.id; } else drag.over = null;
});
window.addEventListener('mouseup', ev => {
  if (!drag) return;
  const d = drag; drag = null;
  canvas.classList.remove('panning'); canvas.classList.remove('linking');
  world.querySelector('.ghost')?.remove();
  $$('.node.drop', world).forEach(g => g.classList.remove('drop'));
  if (d.type === 'node' && !d.moved) { select(d.id); return; }
  if (d.type === 'node' && d.over) confirmLinkDialog(d.id, d.over, 'drag');
});
svg.addEventListener('contextmenu', ev => {
  const g = ev.target.closest('.node'); if (!g) return;
  ev.preventDefault(); nodeMenu(g.dataset.id, ev.clientX, ev.clientY);
});
svg.addEventListener('click', ev => {
  const hit = ev.target.closest('.edge-hit'); if (!hit) return;
  const e = edges.find(x => x.id === hit.dataset.e); if (!e) return;
  suggestionPop(e, ev.clientX, ev.clientY);
});
svg.addEventListener('keydown', ev => {
  const g = ev.target.closest('.node'); if (!g) return;
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(g.dataset.id); }
  if (ev.key === 'ContextMenu' || (ev.shiftKey && ev.key === 'F10')) { ev.preventDefault(); const r = g.getBoundingClientRect(); nodeMenu(g.dataset.id, r.left + 20, r.bottom); }
});
svg.addEventListener('dblclick', ev => { const g = ev.target.closest('.node'); if (g) { panTo(g.dataset.id); } });
canvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  const [cx, cy] = toClient(ev);
  if (ev.ctrlKey || ev.metaKey) zoomBy(ev.deltaY < 0 ? 1.12 : 0.89, cx, cy);
  else { state.view.x -= ev.deltaX; state.view.y -= ev.deltaY; applyView(); }
}, { passive:false });
$('#zin').onclick = () => zoomBy(1.2); $('#zout').onclick = () => zoomBy(1/1.2); $('#zfit').onclick = fit;
window.addEventListener('resize', fit);

/* ============================================================
   Routing + selection
   ============================================================ */
const ROUTE = { ticket:'ticket', pr:'pr', build:'build', page:'page', note:'note', commit:'commit', branch:'branch', repo:'repo' };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function routeOf(id) { const n = N[id]; if (!n) return '#/graph';
  const tail = n.type === 'ticket' ? n.key : n.type === 'pr' ? n.key.replace('PR #','') : n.type === 'build' ? n.key.replace('#','') : n.type === 'commit' ? n.key : n.type === 'repo' ? n.key : slug(n.type === 'branch' ? n.key : n.title);
  return `#/${ROUTE[n.type]}/${tail}`; }
function findByRoute(type, tail) {
  return Object.values(N).find(n => n.type === type && (routeOf(n.id) === `#/${type}/${tail}`))?.id || null;
}
function setHash(h) { if (location.hash === h) return; state.ownPush++; location.hash = h; }
function select(id, opts = {}) {
  if (!N[id]) return;
  if (!N[id].pos) placeNode(id, state.sel);
  state.sel = id;
  if (!opts.keepOverlay && state.overlay) closeOverlay(true);
  renderGraph(); renderCard();
  if (!opts.noRoute) setHash(routeOf(id));
  if (opts.pan !== false) panTo(id);
  $$('.rail button').forEach(b => b.classList.toggle('on', b.dataset.nav === (state.overlay || 'graph')));
}
function onHash() {
  const h = location.hash || '#/graph';
  const m = h.match(/^#\/([a-z]+)(?:\/(.+))?$/);
  if (!m) return;
  const [, head, tail] = m;
  if (['inbox','time','standup','sources','notes'].includes(head)) { openOverlay(head, { noRoute:true, force:true }); return; }
  if (head === 'search') { closeOverlay(true); $('#q').value = decodeURIComponent(tail || ''); $('#q').focus(); runSearch(); return; }
  if (head === 'graph') { closeOverlay(true); state.sel = null; renderGraph(); renderCard(); return; }
  const id = findByRoute(head, decodeURIComponent(tail || ''));
  if (id) { closeOverlay(true); select(id, { noRoute:true }); }
}
window.addEventListener('hashchange', onHash);

/* ============================================================
   Toasts, dialogs, popovers, menus
   ============================================================ */
function toast(msg, stamp, red) {
  const t = document.createElement('div'); t.className = 'toast' + (red ? ' red' : '');
  const cls = SRC[stamp] ? SRC[stamp].color : stamp === 'red' ? '' : 'blue';
  const lbl = SRC[stamp] ? SRC[stamp].stamp : stamp === 'red' ? 'QUEUED' : stamp === 'blue' ? 'DONE' : String(stamp).toUpperCase();
  t.innerHTML = (stamp ? `<span class="stamp ${cls} in" style="--rot:${rotFor(msg)}deg">${lbl}</span>` : '') + `<span>${msg}</span>`;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4200);
}
function openDialog(html, cls='') {
  const d = $('#dialog'); d.hidden = false;
  d.innerHTML = `<div class="backdrop" data-close><div class="dialog ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  d.querySelector('.backdrop').addEventListener('mousedown', ev => { if (ev.target.dataset.close !== undefined) closeDialog(); });
  d.querySelectorAll('[data-x]').forEach(b => b.onclick = closeDialog);
  const f = d.querySelector('input,select,textarea,button.p,button'); if (f) setTimeout(() => f.focus(), 0);
  return d.querySelector('.dialog');
}
function closeDialog() { const d = $('#dialog'); d.hidden = true; d.innerHTML = ''; }
const dh = (title, sub='') => `<div class="dhead"><h1>${title}</h1>${sub ? `<span class="small muted">${sub}</span>` : ''}<button class="iconbtn x" data-x title="Close (Esc)">✕</button></div>`;
function openPop(html, x, y, cls='') {
  const p = $('#pop'); p.hidden = false; p.className = 'pop ' + cls; p.innerHTML = html;
  const r = document.body.getBoundingClientRect();
  p.style.left = Math.min(x, r.width - p.offsetWidth - 10) + 'px'; p.style.top = Math.min(y, r.height - p.offsetHeight - 30) + 'px';
  const f = p.querySelector('input,button'); if (f) f.focus();
  return p;
}
function closePop() { const p = $('#pop'); p.hidden = true; p.innerHTML = ''; }
document.addEventListener('mousedown', ev => { if (!$('#pop').hidden && !ev.target.closest('#pop') && !ev.target.closest('#timerbtn') && !ev.target.closest('#newbtn')) closePop(); if (!$('#sdrop').hidden && !ev.target.closest('.search')) closeSearch(); });
function menu(items, x, y, head) {
  const html = `<div class="menu">${head ? `<div class="hd">${head}</div>` : ''}${items.map((it, i) => it ? `<button data-i="${i}" ${it.disabled ? 'disabled' : ''}>${it.label}${it.k ? `<span class="k">${it.k}</span>` : ''}</button>` : '').join('')}</div>`;
  const p = openPop(html, x, y);
  p.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { closePop(); items[+b.dataset.i].run(); });
}
function nodeMenu(id, x, y) {
  const n = N[id]; const items = [];
  const timerHere = { label:'Start timer here', k:'⌘T', run:() => startTimer(id) };
  if (n.type === 'ticket') {
    if (n.status === 'To Do') items.push({ label:`Start work on ${n.key}`, run:() => startWorkDialog(id) });
    items.push(timerHere, { label:'Change status → ' + nextStatus(n.status), run:() => setStatus(id, nextStatus(n.status)) }, { label:'Link to…', run:() => linkPicker(id, x, y) }, { label:'Comment', run:() => { select(id); setTimeout(() => $('#cmt')?.focus(), 0); } }, { label:'New note about this', run:() => newNote(id) });
  } else if (n.type === 'build') {
    items.push({ label:'Open log', run:() => select(id) }, { label:'Re-run failed', run:() => rerun(id), disabled:n.status !== 'failed' }, { label:'Trigger with parameters…', run:() => triggerDialog(n.config, n.branch) }, { label:'Link to…', run:() => linkPicker(id, x, y) }, timerHere);
  } else if (n.type === 'pr') {
    items.push({ label:'Reply', run:() => { select(id); setTimeout(() => $('#cmt')?.focus(), 0); } }, { label:'Request re-review from Jonas', run:() => toast(`Re-review requested from Jonas on ${n.key}`, 'gitea') }, { label:'Merge', disabled:n.approvals.given.length < n.approvals.need, run:() => {} }, { label:'Link to…', run:() => linkPicker(id, x, y) }, timerHere);
  } else if (n.type === 'branch') {
    items.push({ label:'Pull', run:() => gitPull('payout-service') }, { label:'Push', run:() => gitPush(n.key) }, { label:'Link to…', run:() => linkPicker(id, x, y) }, timerHere);
  } else if (n.type === 'repo') {
    items.push({ label:'Pull', run:() => gitPull(n.key) }, { label:'Push', run:() => gitPush('main') }, { label:'New branch…', run:() => newBranchDialog(n.key) }, { label:'Link to…', run:() => linkPicker(id, x, y) });
  } else if (n.type === 'note') {
    items.push({ label:'Edit', run:() => select(id) }, { label:'Link to…', run:() => linkPicker(id, x, y) }, { label:'Delete note', run:() => { delete N[id]; edges = edges.filter(e => e.a !== id && e.b !== id); state.sel = null; renderGraph(); renderCard(); toast('Note deleted'); } }, timerHere);
  } else {
    items.push({ label:'Open', run:() => select(id) }, { label:'Link to…', run:() => linkPicker(id, x, y) }, { label:'New note about this', run:() => newNote(id) }, timerHere);
  }
  menu(items, x, y, label(n));
}

/* ============================================================
   Ledger renderers — shared by the card, the sheets and search
   ============================================================ */
state.fresh = new Set();
state.timer.t0 = loadedAt;

function stampHTML(src, seed, cls) {
  const s = SRC[src];
  return `<span class="stamp ${s.color} ${cls || ''}" style="--rot:${rotFor(seed || src)}deg">${s.stamp}</span>`;
}
function shortDate(s) {
  if (!s) return '';
  s = String(s).replace('started ', '');
  if (s === 'today') return 'today';
  if (s.startsWith('today ')) return s.slice(6);
  if (s.startsWith('yesterday')) return ('Thu ' + s.slice(10)).trim();
  const m = s.match(/^2026-08-(\d\d)$/);
  return m ? m[1] + ' Aug' : s;
}
const whenOf = n => n.updated || n.edited || n.when || n.opened || '';
const refKey = n => n.type === 'page' ? 'page · ENG' : n.type === 'note' ? 'local note' : n.type === 'branch' ? 'branch' : n.type === 'repo' ? 'repo' : n.type === 'build' ? `${n.config} ${n.key}` : n.key;
const refOf = n => ['page'].includes(n.type) ? 'ENG' : n.type === 'note' ? 'note' : n.type === 'branch' ? 'branch' : n.type === 'repo' ? 'repo' : n.key;
const descOf = n => n.type === 'build' ? n.config : (n.type === 'branch' || n.type === 'repo') ? n.key : n.title;
function stOf(n) {
  if (n.type === 'ticket') return [n.status, n.status === 'Done' ? 'blue' : ''];
  if (n.type === 'pr') return [n.state, n.state === 'merged' ? 'blue' : ''];
  if (n.type === 'build') return [n.status, n.status === 'failed' ? 'red' : n.status === 'success' ? 'blue' : 'blue'];
  if (n.type === 'commit') return ['ML', ''];
  if (n.type === 'branch') return [n.ahead ? n.ahead + ' ahead' : (n.local ? 'checked out' : 'merged'), ''];
  if (n.type === 'repo') return [n.lang, ''];
  if (n.type === 'page') return [n.by === 'Mara Lindqvist' ? 'you' : n.by.split(' ')[0], ''];
  return ['you', ''];
}
function entRow(id, cls) {
  const n = N[id]; if (!n) return '';
  const [st, sc] = stOf(n);
  return `<div class="lrow click ${cls || ''}" data-go="${id}">
    <span class="d">${esc(shortDate(whenOf(n)))}</span>
    <span class="ref">${esc(refOf(n))}</span>
    <span class="desc${n.type === 'page' || n.type === 'note' ? ' serif' : ''}">${esc(descOf(n))}</span>
    <span class="st ${sc}">${esc(st)}</span>
    ${stampHTML(n.src, id, state.fresh.has(id) ? 'in' : '')}
  </div>`;
}
const chip = (id, txt) => N[id] ? `<span class="chip" data-go="${id}">${esc(txt || shortLabel(N[id]))}</span>` : esc(txt || id);
function metaOf(n) {
  if (n.type === 'ticket') return `${n.kind} · Tidewater Jira · ${syncedText('jira')}`;
  if (n.type === 'pr') return `${n.repo} · ${n.from} → ${n.to} · ${syncedText('gitea')}`;
  if (n.type === 'build') return `${n.branch} · ${syncedText('teamcity')}`;
  if (n.type === 'commit') return `${n.by} · ${n.when}`;
  if (n.type === 'branch') return `${n.repo} · ${syncedText('gitea')}`;
  if (n.type === 'repo') return `${n.lang} · ${n.clone}`;
  if (n.type === 'page') return `${n.space} · edited ${n.edited} by ${n.by}`;
  return `Local note · edited ${n.edited}`;
}
function cardHead(n) {

    <div style="min-width:0"><div class="k">${esc(refKey(n))}</div><div class="meta">${esc(metaOf(n))}</div></div>

function placeNode(id, near) {

  const base = (near && N[near] && N[near].pos) || [580, 470];
  const taken = Object.values(N).filter(m => m.pos).map(m => m.pos);
  const cand = [[240, 0], [-240, 0], [0, 130], [0, -130], [240, 130], [-240, 130], [240, -130], [-240, -130], [480, 0], [-480, 0], [0, 260], [480, 130], [-480, 130], [0, -260], [480, 260]];
  for (const [dx, dy] of cand) {
    const p = [base[0] + dx, base[1] + dy];
    if (!taken.some(t => Math.abs(t[0] - p[0]) < 190 && Math.abs(t[1] - p[1]) < 70)) { n.pos = p; return; }
  }

}

function indexText(n) {
  const parts = [n.key, n.title, n.desc, n.body, n.config, n.branch, n.from, n.repo, n.lang, n.space, n.by, n.assignee, n.status, n.state, n.kind, n.step];
  if (n.params) parts.push(n.params.branch, n.params.env);
  if (n.comments) n.comments.forEach(c => parts.push(c.who, c.txt));
  if (n.type === 'commit' && N[n.branch]) parts.push(N[n.branch].key);
  return parts.filter(Boolean).join(' ').replace(/<[^>]+>/g, ' ').toLowerCase();
}
const whoOf = n => n.assignee || n.by || 'Mara Lindqvist';
const isToday = n => /today/.test(whenOf(n));
const isThisWeek = n => /today|yesterday|2026-08-1[7-9]|2026-08-2[0-2]/.test(whenOf(n));
function failingBuildSet() {
  const bad = Object.values(N).filter(n => n.type === 'build' && n.status === 'failed').map(n => n.id);
  const s = new Set(bad);
  for (const id of bad) for (const x of neighbours(id)) { s.add(x.other.id); for (const y of neighbours(x.other.id)) if (y.other.type === 'ticket' || y.other.type === 'branch') s.add(y.other.id); }
  return s;
}
state.f = { src: new Set(), type: new Set(), who: '', date: '', fail: false };
const TYPES = [['ticket', 'Tickets'], ['page', 'Pages'], ['pr', 'PRs'], ['commit', 'Commits'], ['build', 'Builds'], ['note', 'Notes']];
function searchHits(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  const fail = state.f.fail ? failingBuildSet() : null;
  return Object.values(N).map(n => {
    const t = indexText(n);
    if (toks.length && !toks.every(k => t.includes(k))) return null;
    if (state.f.src.size && !state.f.src.has(n.src)) return null;
    if (state.f.type.size && !state.f.type.has(n.type)) return null;
    if (state.f.who && whoOf(n) !== state.f.who) return null;
    if (state.f.date === 'today' && !isToday(n)) return null;
    if (state.f.date === 'week' && !isThisWeek(n)) return null;
    if (fail && !fail.has(n.id)) return null;
    const head = ((n.key || '') + ' ' + (n.title || '') + ' ' + (n.config || '')).toLowerCase();
    return { n, score: toks.reduce((a, k) => a + (head.includes(k) ? 3 : 1), 0) + (n.type === 'ticket' ? 1 : 0) };
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 14);
}

function blockDetail(b) {

function stampFresh(ids) {

function confirmLink(a, b, viaEdge) {

  if (e) { e.kind = 'link'; e.reason = ''; }

  stampFresh([a, b]);
  renderCard(); renderStatus();
  toast(`Linked ${esc(shortLabel(N[a]))} to ${esc(shortLabel(N[b]))}`, 'linked');
}
function dismissSug(eid) {
  const e = edges.find(x => x.id === eid); if (!e) return;
  edges = edges.filter(x => x.id !== eid);

}

    $('#pickres').innerHTML = hits.map(n => `<button data-pick="${n.id}">${stampHTML(n.src, n.id)}<span>${esc(shortLabel(n))}${n.type === 'ticket' || n.type === 'pr' ? ` <span class="muted">${esc(n.title)}</span>` : ''}</span><span class="src">${esc(n.type)}</span></button>`).join('')

/* ---------- day-review block actions ---------- */
function assignBlock(bid, x, y) {
  const b = blocks.find(z => z.id === bid); if (!b) return;
  const opts = ['PAY-231', 'PAY-240', 'PAY-228', 'OPS-77'].map(k => ({ label: `${k} — ${esc(N[k].title)}`, run: () => {
    b.node = k; b.ctx = k; b.sub = 'assigned by you'; b.kind = 'passive'; b.how = 'passive · assigned';
    renderTime(); toast(`11:50–12:20 assigned to ${k}`, 'blue');
  } }));
  opts.push({ label: 'Ad-hoc label instead…', run: () => { b.ctx = 'Staging DB configuration'; b.kind = 'label'; b.how = 'manual label'; renderTime(); toast('Block relabelled', 'blue'); } });
  menu(opts, x, y, 'Assign 30 m to');
}
function logBlockDialog(bid) {
  const b = blocks.find(z => z.id === bid); if (!b) return;
  state.selBlock = bid;
  worklogDialog(b.node || (b.kind === 'label' ? 'OPS-77' : null), b.kind === 'label' ? b.ctx : null, [[b.s, blockEnd(b)]]);
}

/* ============================================================
   Action dispatch
   ============================================================ */
state.queue = []; state.published = false; state.reply = null; state.fixing = null;
state.editNote = null; state.editPage = null; state.noteOpen = 'note-invest'; state.sw = null; state.wl = null;
function handleAct(act, ds, el) {
  const r = el ? el.getBoundingClientRect() : { left: 400, bottom: 300 };
  const x = r.left, y = r.bottom + 4;
  switch (act) {
    case 'nodemenu': nodeMenu(ds.id, x, y); break;
    case 'linkto': linkPicker(ds.id, x, y); break;
    case 'confirmsug': { const e = edges.find(z => z.id === ds.e); closePop(); if (e) confirmLink(e.a, e.b, e); break; }
    case 'dismisssug': closePop(); dismissSug(ds.e); break;
    case 'dolink': closeDialog(); confirmLink(ds.a, ds.b); break;
    case 'addcmt': {
      const n = N[ds.id], ta = $('#cmt'), txt = (ta && ta.value.trim());
      if (!txt) { if (ta) ta.focus(); toast('Write something first — the comment box is empty', 'red', true); break; }
      n.comments.push({ who: 'Mara Lindqvist', when: 'today ' + nowStr(), txt });
      renderCard(); toast(`Comment added to ${esc(shortLabel(n))}`, n.src); break;
    }
    case 'starttimer': startTimer(ds.id); break;
    case 'stoptimer': stopTimer(); break;
    case 'switchctx': { closePop(); const ids = ['PAY-231', 'PAY-240', 'PAY-228', 'pr-144', 'page-sepa'];
      menu(ids.map(i => ({ label: `${esc(shortLabel(N[i]))} — ${esc(N[i].title || '')}`, run: () => startTimer(i) })).concat([{ label: 'Ad-hoc label…', run: () => adhocPop(x, y) }]), x, y, 'Switch timer to'); break; }
    case 'adhoc': { const v = $('#adhoc') && $('#adhoc').value.trim(); if (v) startTimer(null, v); break; }
    case 'startwork': startWorkDialog(ds.id); break;
    case 'dostartwork': runStartWork(); break;
    case 'newnote': newNote(ds.id); break;
    case 'gonode': closeOverlay(); select(ds.id); break;
    case 'opensource': toast(`Opening ${esc(SRC[ds.src].url)} in your browser`, ds.src); break;
    case 'rereview': toast(`Re-review requested from Jonas on ${esc(N[ds.id].key)}`, 'gitea'); break;
    case 'merge': { const n = N[ds.id]; n.state = 'merged'; n.merged = 'today ' + nowStr(); renderGraph(); renderCard(); toast(`${n.key} merged into main`, 'gitea'); break; }
    case 'rerun': rerun(ds.id); break;
    case 'trigger': triggerDialog(ds.config, ds.branch); break;
    case 'dotrigger': { const c = $('#tcfg').value, b = $('#tbr').value, e = $('#tenv').value, cl = $('#tclean').checked;
      closeDialog(); queueOrRun(`${c} on ${b} (${e}${cl ? ', clean checkout' : ''})`, () => makeBuild(c, b, e)); break; }
    case 'gitpull': gitPull(ds.repo); break;
    case 'gitpush': gitPush(ds.branch); break;
    case 'newbranch': newBranchDialog(ds.repo); break;
    case 'donewbranch': { const name = $('#nbname').value.trim() || 'feature/new';
      closeDialog(); toast(`Branch ${esc(name)} created in ${esc(ds.repo)} and checked out`, 'gitea'); break; }
    case 'newticket': createTicketDialog(); break;
    case 'docreateticket': {
      const sum = $('#ctsum').value.trim() || 'Untitled', proj = $('#ctproj').value.startsWith('OPS') ? 'OPS' : 'PAY';
      const key = proj + '-' + (++state.newCount.ticket);
      def({ id: key, type: 'ticket', src: 'jira', key, title: sum, kind: $('#cttype').value, status: 'To Do', priority: 'Medium', assignee: 'Mara Lindqvist', updated: 'today ' + nowStr(), pos: null, epic: 'PAY-200', desc: esc($('#ctdesc').value), comments: [], worklogs: [] });
      placeNode(key, 'PAY-200'); edges.push(edge('PAY-200', key));
      closeDialog(); stampFresh([key]); select(key); renderStatus();
      toast(`${key} created and linked to PAY-200`, 'jira'); break;
    }
    case 'newpage': createPageDialog(); break;
    case 'docreatepage': {
      const title = $('#cptitle').value.trim() || 'Untitled', body = $('#cpbody').value;
      const id = 'page-new-' + (++BID);
      def({ id, type: 'page', src: 'confluence', key: 'ENG', title, space: 'ENG — Engineering', edited: 'today ' + nowStr(), by: 'Mara Lindqvist', pos: null, body: `<p>${esc(body)}</p>`, comments: [] });
      ALIAS[title] = id; placeNode(id, 'page-sepa'); edges.push(edge(id, 'page-sepa'));
      closeDialog(); stampFresh([id]); select(id); renderStatus();
      toast(`Page created in ENG and linked to SEPA payout retry design`, 'confluence'); break;
    }
    case 'editpage': state.editPage = ds.id; renderCard(); break;
    case 'savepage': { const n = N[ds.id], b = $('#pagebody'); if (b) n.body = b.innerHTML; n.edited = 'today ' + nowStr(); state.editPage = null; renderCard(); toast(`${esc(n.title)} saved to Tidewater Wiki`, 'confluence'); break; }
    case 'editnote': state.editNote = ds.id; if (state.overlay === 'notes') renderSheet(); else renderCard(); setTimeout(() => $('#noteta') && $('#noteta').focus(), 0); break;
    case 'savenote': saveNote(ds.id); break;
    case 'canceledit': state.editNote = null; state.editPage = null; if (state.overlay === 'notes') renderSheet(); else renderCard(); break;
    case 'closeoverlay': closeOverlay(); break;
    case 'overlay': openOverlay(ds.o); break;
    case 'lens': setLens(ds.lens); break;
    case 'inbox': inboxAct(ds.id, ds.a); break;
    case 'sendreply': sendReply(ds.id); break;
    case 'unsnooze': { const s = snoozed.find(z => z.id === ds.id); snoozed = snoozed.filter(z => z.id !== ds.id);
      inbox.unshift({ id: 'r' + ds.id, when: nowStr(), src: 'jira', node: 'PAY-219', txt: esc(s.txt), acts: ['Open', 'Done'] });
      renderCounts(); renderSheet(); toast('Back in the inbox', 'blue'); break; }
    case 'syncnow': SRC[ds.src].synced = 'just now'; renderSheet(); toast(`${esc(SRC[ds.src].name)} synced`, ds.src); break;
    case 'syncall': ['jira', 'confluence', 'gitea'].forEach(k => SRC[k].synced = 'just now'); renderSheet(); renderStatus(); toast('Jira, Wiki and Gitea synced · TeamCity still 401', 'blue'); break;
    case 'fixteamcity': openOverlay('sources', { force: true }); state.fixing = 'teamcity'; renderSheet(); setTimeout(() => $('#tcpw') && $('#tcpw').focus(), 0); break;
    case 'cancelfix': state.fixing = null; renderSheet(); break;
    case 'savepw': {
      SRC.teamcity.ok = true; SRC.teamcity.synced = 'just now'; SRC.teamcity.auth = 'user + password (updated today)'; SRC.teamcity.error = '';
      state.fixing = null; renderSheet(); renderSync(); renderStatus(); renderCard();
      toast('TeamCity password saved · sync recovered · 3 build configs indexed', 'teamcity');
      flushQueue(); break;
    }
    case 'snoozepat': snoozed.push({ id: 'pat2', txt: 'Jira PAT expires in 12 days', returns: 'returns 2026-08-29' }); renderSheet(); toast('Reminder set for 2026-08-29', 'blue'); break;
    case 'addsrc': state.add.open = true; state.add.step = 0; renderSheet(); break;
    case 'cancelsrc': state.add.open = false; renderSheet(); break;
    case 'srcback': state.add.step--; renderSheet(); break;
    case 'srcnext': {
      if (state.add.step === 1) { state.add.url = $('#asurl').value; }
      if (state.add.step === 2) { const c = document.querySelector('input[name=auth]:checked'); if (c) state.add.auth = c.value; }
      state.add.step++; renderSheet(); break;
    }
    case 'testconn': { const c = document.querySelector('input[name=auth]:checked'); if (c) state.add.auth = c.value;
      state.add.url = state.add.url || ($('#asurl') && $('#asurl').value) || 'https://jenkins.tidewater.internal';
      state.add.tested = state.add.auth === 'userpass' ? 'bad' : 'ok'; renderSheet(); break; }
    case 'srcsave': { const t = state.add.type; state.add.open = false; state.add.tested = null; renderSheet();
      toast(`${esc(t)} source saved · first index started · adapter loaded`, 'blue'); break; }
    case 'tab': state.timeTab = ds.tab; renderTime(); break;
    case 'assign': openOverlay('time', { force: true }); assignBlock(ds.blk, x, y); break;
    case 'logblk': logBlockDialog(ds.blk); break;
    case 'keeplocal': { const b = blocks.find(z => z.id === ds.blk); b.logged = 'local'; renderTime(); toast('Kept local — 48 m stays out of Jira', 'note'); break; }
    case 'mergeprev': { const b = blocks.find(z => z.id === ds.blk), prev = blocks.find(z => z.id === 'b3');
      prev.e = b.e; blocks = blocks.filter(z => z.id !== b.id); state.selBlock = 'b3'; renderTime();
      toast('30 m merged into the 09:40 PAY-231 block', 'blue'); break; }
    case 'logall': { weekTotals.unlogged = 0; weekTotals.logged = weekTotals.tracked; week.forEach(w => w[3] = 0); blocks.forEach(b => { if (b.node && !b.logged) b.logged = N[b.node].key; });
      const t = N['PAY-231']; t.worklogs.push({ when: 'Fri 22', min: 164, txt: 'Backoff jitter (a41f2c, c90d11); replied to review on PR #142; updated Backoff policy in the design page.' });
      renderTime(); renderCard(); toast('4h 45m logged across PAY-231, PAY-228 and OPS-77', 'jira'); break; }
    case 'wledit': { const g = $('#wlgen'); if (!g) break;
      const ta = document.createElement('textarea'); ta.className = 'ta'; ta.id = 'wlgen'; ta.value = wlComment();
      ta.addEventListener('input', ev => state.wl.custom = ev.target.value);
      g.replaceWith(ta); ta.focus(); state.wl.custom = ta.value; break; }
    case 'wllog': logWorklog(); break;
    case 'copydigest': toast('Digest copied — paste it into Slack', 'blue'); break;
    case 'digestnote': {
      const id = 'note-digest'; if (!N[id]) {
        def({ id, type: 'note', src: 'note', key: 'note', title: 'Standup 2026-08-22', edited: 'today ' + nowStr(), pos: null,
          body: 'Yesterday: merged PR #139, PAY-228 to In Review, retry loop for PAY-231 (7be0e4), logged 4h 30m.\nToday: backoff + jitter (a41f2c, c90d11); fix #1187; SLA answer for Priya; review PR #144.\nBlockers: PAY-228 blocked by OPS-77.\n\nLinks: [[PAY-231]] [[PAY-228]] [[#1187]]' });
        placeNode(id, 'PAY-231'); edges.push(edge(id, 'PAY-231'), edge(id, 'PAY-228'));
      }
      state.noteOpen = id; stampFresh([id]); renderStatus(); toast('Digest saved as note Standup 2026-08-22', 'note'); break;
    }
    case 'protonote': toast('Protocol saved as note Standup protocol 2026-08-22', 'note'); break;
    case 'publish': {
      state.published = true;
      const id = 'page-proto'; if (!N[id]) {
        def({ id, type: 'page', src: 'confluence', key: 'ENG', title: 'Standup protocol 2026-08-22', space: 'ENG — Engineering', edited: 'today ' + nowStr(), by: 'Mara Lindqvist', pos: null,
          body: ($('#proto') ? $('#proto').innerHTML : '<p>Protocol</p>'), comments: [] });
        ALIAS['Standup protocol 2026-08-22'] = id; placeNode(id, 'page-sepa'); edges.push(edge(id, 'page-standups'));
      }
      renderSheet(); stampFresh([id]); renderStatus();
      toast('Published to ENG › Standup protocols › 2026-08-22', 'confluence'); break;
    }
    case 'aiticket': { const a = ACTIONS[+ds.i]; a.done = 'PAY-' + (state.newCount.ticket + 1); createTicketDialog(a.txt); break; }
    default: toast(`${esc(act)} is not wired in this mockup`, 'red', true);
  }
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]');
  if (go && !ev.target.closest('.menu')) { ev.preventDefault(); const id = resolve(go.dataset.go); if (id) { if (go.closest('#sdrop')) closeSearch(); closePop(); closeOverlay(true); select(id); } return; }
  const lens = ev.target.closest('[data-lens]');
  if (lens && !lens.dataset.act) { closeSearch(); setLens(lens.dataset.lens); return; }
  const fill = ev.target.closest('[data-fill]');
  if (fill) { $('#q').value = fill.dataset.fill; $('#q').focus(); runSearch(); return; }
  const note = ev.target.closest('[data-note]');
  if (note) { state.noteOpen = note.dataset.note; state.editNote = null; renderSheet(); return; }
  const blk = ev.target.closest('[data-blk]');
  if (blk && !blk.dataset.act) { state.selBlock = blk.dataset.blk; renderTime(); return; }
  const tab = ev.target.closest('[data-tab]');
  if (tab && !tab.dataset.act) { state.timeTab = tab.dataset.tab; renderTime(); return; }
  const at = ev.target.closest('[data-atype]');
  if (at) { state.add.type = at.dataset.atype; renderSheet(); return; }
  for (const [k, apply] of [['fs', k2 => { state.f.src.has(k2) ? state.f.src.delete(k2) : state.f.src.add(k2); }],
                            ['ft', k2 => { state.f.type.has(k2) ? state.f.type.delete(k2) : state.f.type.add(k2); }],
                            ['fw', k2 => { state.f.who = state.f.who === k2 ? '' : k2; }],
                            ['fd', k2 => { state.f.date = state.f.date === k2 ? '' : k2; }],
                            ['fx', () => { state.f.fail = !state.f.fail; }]]) {
    const c = ev.target.closest(`[data-${k}]`);
    if (c) { apply(c.dataset[k]); renderSearch(); $('#q').focus(); return; }
  }
  const a = ev.target.closest('[data-act]');
  if (a && !a.disabled) { ev.preventDefault(); handleAct(a.dataset.act, a.dataset, a); }
});
document.addEventListener('change', ev => {
  const s = ev.target.closest('.st-sel'); if (s) { setStatus(s.dataset.id, s.value); return; }
  const l = ev.target.closest('[data-layer]');
  if (l) { state.layers[l.dataset.layer] = l.checked; renderSheet(); renderGraph(); renderStatus(); toast(`${SRC[l.dataset.layer].stamp} layer ${l.checked ? 'shown' : 'hidden'}`, 'blue'); }
});
document.addEventListener('mouseover', ev => { const h = ev.target.closest('[data-hl]'); if (h) highlight(h.dataset.hl.split(','), true); });
document.addEventListener('mouseout', ev => { const h = ev.target.closest('[data-hl]'); if (h) highlight([], false); });
$$('.rail button').forEach(b => b.onclick = () => { if (b.dataset.nav === 'graph') { closeOverlay(); } else openOverlay(b.dataset.nav); });
$('#inboxbtn').onclick = () => openOverlay('inbox');
$('#syncbtn').onclick = () => openOverlay('sources');
$('#gearbtn').onclick = () => openOverlay('sources');
$('#timerbtn').onclick = ev => { const r = ev.currentTarget.getBoundingClientRect(); timerPop(r.left - 120, r.bottom + 4); };
$('#newbtn').onclick = ev => { const r = ev.currentTarget.getBoundingClientRect();
  menu([{ label: 'Ticket…', run: () => createTicketDialog() }, { label: 'Page…', run: () => createPageDialog() },
        { label: 'Note', k: '', run: () => newNote(state.sel) }, { label: 'Branch…', run: () => newBranchDialog('payout-service') },
        { label: 'Build…', run: () => triggerDialog('Payout_IntegrationTests', 'feature/PAY-231-sepa-retry') },
        { label: 'Source…', run: () => { openOverlay('sources', { force: true }); state.add.open = true; state.add.step = 0; renderSheet(); } }], r.left, r.bottom + 4, 'Create'); };
$('#q').addEventListener('input', runSearch);
$('#q').addEventListener('focus', () => { if ($('#sdrop').hidden) renderSearch(); });
$('#q').addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); moveSearchCur(1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveSearchCur(-1); }
  else if (ev.key === 'Enter') { const c = $('#sdrop .lrow.cur'); if (c) { ev.preventDefault(); c.click(); } }
  else if (ev.key === 'Escape') { ev.preventDefault(); closeSearch(); $('#q').blur(); }
});
document.addEventListener('keydown', ev => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && (ev.key === 'k' || ev.key === 'K')) { ev.preventDefault(); focusSearch(); return; }
  if (mod && (ev.key === 't' || ev.key === 'T')) { ev.preventDefault(); toggleTimer(); return; }
  if (ev.key !== 'Escape') return;
  if (!$('#pop').hidden) { closePop(); return; }
  if (!$('#dialog').hidden) { closeDialog(); return; }
  if (!$('#sdrop').hidden) { closeSearch(); $('#q').blur(); return; }
  if (state.overlay) { closeOverlay(); return; }
  if (state.sel) { state.sel = null; setHash('#/graph'); renderGraph(); renderCard(); return; }
  if (state.lens !== 'all') setLens('all');
});
window.addEventListener('hashchange', renderStatus);

/* ============================================================
   Boot
   ============================================================ */
function boot() {
  renderLenses(); renderCounts(); renderSync(); renderTimer(); renderStatus();
  renderGraph(); fit(); renderCard(); syncRail();
  if (location.hash && location.hash !== '#/graph') onHash(); else renderStatus();
  setInterval(renderTimer, 1000);
}
window.addEventListener('error', ev => { const el = $('#jserr'); el.hidden = false; el.textContent = 'JS error: ' + ev.message + ' (line ' + ev.lineno + ')'; });
try { boot(); } catch (err) { const el = $('#jserr'); el.hidden = false; el.textContent = 'JS error in boot: ' + (err && err.message); }
</script>
</body>
