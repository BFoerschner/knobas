<!--
knobas mockup
paradigm: P3 Graph
design: D3 Patchbay
thesis: Seeing which ticket pulls which branch, build, page and note — and patching a missing link by dragging one jack onto another.
thesis: The graph is a studio patchbay: sources are colored modules, entities are jacks on engraved plates, every cross-source link is a sagging patch cable in the origin's color.
thesis: Patch cables — drag a jack to another jack and the cable plugs in; suggested links hang as dashed 40 % cables until you confirm them.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Patchbay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --chassis:#E3E5E8; --panel:#F1F2F4; --edge:#C9CDD3; --ink:#1E2126; --muted:#6B727C;
  --jira:#2563EB; --confluence:#7C3AED; --gitea:#2E9E5B; --teamcity:#F0742A; --note:#E0B100;
  --fail:#D62839; --screw:#AEB4BC;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --mono:"Space Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--chassis);color:var(--ink);font:13px/1.45 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
svg :focus-visible{outline:none}
::selection{background:var(--ink);color:#fff}

/* ---------- app frame ---------- */
#app{display:grid;height:100vh;grid-template-columns:52px 1fr 400px;grid-template-rows:52px 1fr 26px;grid-template-areas:"top top top" "rail stage card" "status status status"}
@media (max-width:1250px){#app{grid-template-columns:52px 1fr 360px}}
.plate{font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.plate.dim{color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* module = panel with 4 screw heads */
.mod{background-color:var(--panel);border:1px solid var(--edge);border-radius:4px;
  background-image:radial-gradient(circle at 7px 7px,var(--screw) 1.6px,transparent 2.2px),
   radial-gradient(circle at calc(100% - 7px) 7px,var(--screw) 1.6px,transparent 2.2px),
   radial-gradient(circle at 7px calc(100% - 7px),var(--screw) 1.6px,transparent 2.2px),
   radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),var(--screw) 1.6px,transparent 2.2px)}
.mod-head{margin:10px 12px 0;padding:6px 10px;border-radius:3px;background:var(--src,var(--ink));color:#fff;display:flex;align-items:center;gap:10px;min-height:28px}
.mod-head .plate{color:#fff;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mod-head .key{white-space:nowrap;flex:none}
.mod-head .sp{flex:1}
.mod-head.dk,.mod-head.dk .plate,.mod-head.dk .key,.mod-head.dk button{color:var(--ink)}
.mod-head.dk button:hover{background:rgba(30,33,38,.12)}
.mod-body{padding:12px 14px 14px}

/* jack dot (HTML) */
.jack{display:inline-block;width:14px;height:14px;border-radius:999px;border:3.5px solid var(--src,var(--muted));background:var(--ink);flex:none;vertical-align:-2px}
.jack.fail{border-color:var(--fail)}
.src-jira{--src:var(--jira)} .src-confluence{--src:var(--confluence)} .src-gitea{--src:var(--gitea)} .src-teamcity{--src:var(--teamcity)} .src-note{--src:var(--note)} .src-local{--src:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);font-weight:500;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.sm{height:24px;padding:0 9px;font-size:12px}
.btn.danger{color:var(--fail);border-color:var(--fail)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.icon{width:28px;padding:0;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:4px;background:var(--chassis);padding:2px;gap:2px}
.seg button{height:22px;padding:0 9px;border-radius:3px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.seg button:hover:not(.on){color:var(--ink)}
.toggle{position:relative;width:48px;height:28px;border-radius:999px;background:var(--edge);border:1px solid #B5BAC2;flex:none;transition:background .12s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;border:1px solid #B5BAC2;transition:transform .12s}
.toggle.on{background:var(--src,var(--ink))}
.toggle.on::after{transform:translateX(20px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 6px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip .jack{width:11px;height:11px;border-width:3px}
.chip .k{font:11px var(--mono)}
.field{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.field label,.field .fl{width:82px;flex:none;font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input.tx,textarea.tx,select.tx{width:100%;border:1px solid var(--edge);border-radius:4px;background:#fff;padding:5px 8px;font-size:12.5px}
textarea.tx{min-height:64px;resize:vertical}
input.tx:focus,textarea.tx:focus,select.tx:focus{border-color:var(--ink)}
.kbd{font:10px var(--mono);border:1px solid var(--edge);border-radius:3px;padding:1px 5px;background:var(--panel);color:var(--muted)}
h2.title{font:600 17px/1.25 var(--disp);margin:10px 0 8px}
h3.sect{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h3.sect::after{content:"";flex:1;height:1px;background:var(--edge)}
h3.sect .cnt{color:var(--ink)}
.row{display:flex;align-items:center;gap:8px}
.pill{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--edge);color:var(--muted)}
.pill.fail{color:var(--fail);border-color:var(--fail)}
.pill.ok{color:var(--ink);border-color:var(--ink)}
.pill.src{color:#fff;background:var(--src);border-color:var(--src)}
.av{width:22px;height:22px;border-radius:999px;background:var(--ink);color:#fff;font:700 9px var(--mono);display:inline-flex;align-items:center;justify-content:center;flex:none}
pre.log{font:11.5px/1.5 var(--mono);background:#fff;border:1px solid var(--edge);border-radius:4px;padding:8px 10px;white-space:pre-wrap;overflow:auto}
pre.log .bad{color:var(--fail)}

/* ---------- top bar ---------- */
#top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 14px 0 12px;border-bottom:1px solid var(--edge);background:var(--chassis)}
#brand{font:700 15px var(--disp);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
#brand i{width:10px;height:10px;border-radius:999px;background:var(--ink);display:inline-block}
#searchwrap{position:relative;flex:0 1 460px}
#q{width:100%;height:32px;border:1px solid var(--edge);border-radius:4px;background:#fff;padding:0 64px 0 32px;font-size:13px}
#q:focus{border-color:var(--ink)}
#searchwrap>svg{position:absolute;left:10px;top:9px;pointer-events:none}
#searchwrap .kbd{position:absolute;right:8px;top:8px}
#spop{position:absolute;top:38px;left:0;width:620px;max-height:520px;overflow:auto;z-index:40;display:none}
#spop.open{display:block}
.sfilters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--edge)}
.sfilters .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sfilters .chip.on .jack{border-color:#fff}
.sres{display:flex;align-items:center;gap:10px;padding:7px 12px;width:100%;text-align:left;border-bottom:1px solid var(--edge)}
.sres:hover,.sres.cur{background:#fff}
.sres .k{font:11px var(--mono);min-width:84px;color:var(--ink)}
.sres .t{flex:1;font-size:12.5px}
.sres .m{font:10px var(--mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.sres mark{background:transparent;color:inherit;font-weight:600;border-bottom:2px solid var(--note)}
#sync{display:flex;align-items:center;gap:7px;margin-left:auto;height:28px;padding:0 10px;border:1px solid var(--edge);border-radius:4px;background:var(--panel)}
#sync .led{width:10px;height:10px;border-radius:999px;background:var(--src);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--src)}
#sync .led.err{background:var(--fail);box-shadow:0 0 0 1px var(--fail)}
#sync .txt{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:3px}
#sync .txt b{color:var(--fail);font-weight:400}
#inboxbtn{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);font-weight:500}
#inboxbtn .n{font:700 11px var(--mono);background:var(--ink);color:#fff;border-radius:3px;padding:2px 6px}
#inboxbtn .n.zero{background:var(--edge);color:var(--muted)}
#timer{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 6px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);position:relative}
#tbtn{width:30px;height:30px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
#tbtn svg{display:block}
#tbtn.stopped{background:var(--panel)}
#tbtn.stopped svg path{fill:var(--ink)}
#tctx{display:flex;flex-direction:column;line-height:1.15;min-width:120px}
#tctx .plate{font-size:9.5px}
#tctx .ctx{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
#tel{font:700 18px var(--mono);letter-spacing:.02em;min-width:52px;text-align:right}
#tel.stopped{color:var(--muted);font-weight:400}
#tpop{position:absolute;right:0;top:46px;width:330px;z-index:40;display:none}
#tpop.open{display:block}
#tpop .opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:3px;font-size:12.5px}
#tpop .opt:hover{background:#fff}
#tpop .opt .k{font:11px var(--mono);min-width:76px}

/* ---------- rail ---------- */
#rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-right:1px solid var(--edge);background:var(--chassis)}
#rail button{width:38px;height:38px;border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted)}
#rail button:hover{background:var(--panel);color:var(--ink)}
#rail button.on{background:var(--ink);color:#fff}
#rail button .b{position:absolute;top:3px;right:3px;font:700 9px var(--mono);background:var(--fail);color:#fff;border-radius:3px;padding:0 4px;line-height:14px}
#rail .sp{flex:1}
#rail hr{width:22px;border:0;border-top:1px solid var(--edge);margin:6px 0}

/* ---------- stage / canvas ---------- */
#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--chassis);
  background-image:radial-gradient(circle,#CDD1D6 1px,transparent 1.2px);background-size:22px 22px}
#lenses{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;align-items:center}
#lenses .lab{margin-right:4px}
.lens{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);font-size:12px;font-weight:500;white-space:nowrap}
.lens:hover{border-color:var(--ink)}
.lens.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lens .n{font:700 10.5px var(--mono);border:1px solid currentColor;border-radius:3px;padding:1px 5px;opacity:.85}
.lens .d{width:7px;height:7px;border-radius:999px;background:var(--fail)}
.lens.on .d{background:#fff}
.lenscall{flex-basis:100%;display:flex;gap:10px;align-items:center;max-width:620px;padding:7px 12px;font-size:12px;margin-top:2px}
#canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#canvas.dragging{cursor:grabbing}
.cable{fill:none;stroke-width:3;stroke-linecap:round}
.cable.sug{stroke-dasharray:7 6;opacity:.4}
.cable.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.cable-g.dim{opacity:.12}
.cable-g.hot .cable{stroke-width:4}
.cable-g.hot .cable.sug{opacity:.75}
.plug{stroke:var(--ink);stroke-width:1.2}
.node{cursor:pointer;transition:opacity .15s}
.node.dim{opacity:.16}
.node .jack-o{transition:transform .15s}
.node:hover .jack-o{transform:scale(1.08)}
.node.plugged .jack-o{animation:plugin .15s ease-out}
@keyframes plugin{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.node .nkey{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;fill:var(--ink);text-anchor:middle}
.node .ntitle{font:11px var(--ui);fill:var(--muted);text-anchor:middle}
.node .npl{fill:var(--panel);stroke:var(--edge)}
.node.sel .npl{stroke:var(--ink);stroke-width:1.5}
.node.sel .nkey{font-weight:700}
.selring{fill:none;stroke:var(--ink);stroke-width:2}
.pulse,.tpulse,.node .jack-o{transform-box:fill-box;transform-origin:center}
.pulse{fill:none;stroke-width:2;opacity:.9;animation:pulse 2s ease-in-out infinite}
.tpulse{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 4;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(1.25)}100%{opacity:.9;transform:scale(1)}}
.node.drop .jack-o{stroke-width:6}
.elabel{font:9px var(--mono);letter-spacing:.1em;fill:var(--fail);text-anchor:middle}
#tmpcable{pointer-events:none}
#legend{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;align-items:center;gap:14px;padding:6px 12px}
#legend .it{display:flex;align-items:center;gap:6px;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#legend .it.off{opacity:.35;text-decoration:line-through}
#legend .ln{width:22px;height:3px;border-radius:2px;background:var(--ink)}
#legend .ln.sug{background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 9px);opacity:.5}
#legend .it button{display:flex;align-items:center;gap:6px;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
#zoom{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:2px;padding:3px}
#zoom button{width:26px;height:26px;border-radius:3px;font:700 14px var(--mono)}
#zoom button:hover{background:#fff}


/* link confirm popover on canvas */
#linkpop{position:absolute;z-index:30;width:300px;display:none}
#linkpop.open{display:block}
#linkpop .mod-body{padding:10px 12px 12px}
#linkpop .rs{font-size:12px;color:var(--muted);margin:4px 0 10px}

/* ---------- side card ---------- */
#card{grid-area:card;border-left:1px solid var(--edge);background:var(--chassis);display:flex;flex-direction:column;min-height:0;padding:10px}
#card>.mod{flex:1;min-height:0;display:flex;flex-direction:column}
#card .mod-body{flex:1;min-height:0;overflow:auto}
#card .mod-head .key{font:700 12px var(--mono);letter-spacing:.06em}
#card .mod-head button{color:#fff;width:24px;height:24px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center}
#card .mod-head button:hover{background:rgba(255,255,255,.18)}
.desc{font-size:12.5px;line-height:1.55}
.desc code{font:11.5px var(--mono);background:#fff;border:1px solid var(--edge);border-radius:3px;padding:0 4px}
.cm{display:flex;gap:8px;margin-bottom:10px}
.cm .body{flex:1;background:#fff;border:1px solid var(--edge);border-radius:4px;padding:6px 9px;font-size:12.5px}
.cm .who{font-weight:600;font-size:12px}
.cm .when{font:10px var(--mono);color:var(--muted);letter-spacing:.04em;margin-left:6px}
.cm .body .at{color:var(--confluence);font-weight:600}
/* mini patchbay in card */
.pbay{position:relative;margin:4px 0 2px}
.pbay svg.pb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pbay .src-jack{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:999px;border:4px solid var(--src);background:var(--ink);box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--edge)}
.pbay .src-jack.fail{border-color:var(--fail)}
.pbay ul{list-style:none;margin-left:74px}
.pbay li{display:flex;align-items:center;gap:8px;height:30px;position:relative}
.pbay li .jack{width:16px;height:16px;border-width:4px;position:relative;z-index:1}
.pbay li button.lk{flex:1;display:flex;align-items:center;gap:8px;text-align:left;height:26px;padding:0 8px;border-radius:3px;background:#fff;border:1px solid var(--edge);font-size:12px;min-width:0}
.pbay li button.lk:hover{border-color:var(--ink)}
.pbay li .k{font:10.5px var(--mono);letter-spacing:.04em;white-space:nowrap}
.pbay li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pbay li .st{font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pbay li .st.fail{color:var(--fail)} .pbay li .st.run{color:var(--teamcity)}
.sug{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--edge);border-radius:4px;margin-bottom:6px;font-size:12px}
.sug .jack{width:12px;height:12px;border-width:3px;opacity:.6}
.sug .t{flex:1;min-width:0}
.sug .t b{font-weight:600}
.sug .t .why{display:block;font:10px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:1px}
.sug .btn{height:22px;padding:0 7px;font-size:11.5px}
.sug.done{border-style:solid;border-color:var(--gitea);opacity:.75}
.wl{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;background:#fff;border:1px solid var(--edge);border-radius:4px;margin-bottom:6px;font-size:12px}
.wl b{font:700 12px var(--mono)}
#card .foot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--edge);flex-wrap:wrap;align-items:center}
#card .foot .sp{flex:1}
.tbig{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 6px;border:1px solid var(--ink);border-radius:999px;background:var(--panel);font-weight:600;font-size:12.5px}
.tbig i{width:22px;height:22px;border-radius:999px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.tbig i svg{display:block}
.tbig:hover{background:#fff}
/* link picker */
#picker{position:fixed;z-index:80;width:340px;display:none}
#picker.open{display:block}
#picker .mod-body{padding:8px}
#picker input{margin-bottom:6px}
#picker .pk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 7px;border-radius:3px;font-size:12.5px}
#picker .pk:hover{background:#fff}
#picker .pk .k{font:11px var(--mono);min-width:80px}
/* notes mode */
.nlist{list-style:none;margin-bottom:8px}
.nlist li button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:3px;font-size:12.5px}
.nlist li button:hover{background:#fff}
.nlist li button.on{background:#fff;outline:1px solid var(--ink)}
.nlist .e{margin-left:auto;font:10px var(--mono);color:var(--muted);white-space:nowrap}
.ned{min-height:120px;background:#fff;border:1px solid var(--edge);border-radius:4px;padding:8px 10px;font-size:12.5px;line-height:1.6;outline:none}
.ned:focus{border-color:var(--ink)}
.ned .chip{height:19px;padding:0 6px 0 5px;font-size:11px;vertical-align:1px;user-select:all}
.ned .chip .jack{width:9px;height:9px;border-width:2.5px}
.bl{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#fff;border:1px solid var(--edge);border-radius:4px;margin-bottom:5px;font-size:12px}
.bl .k{font:10.5px var(--mono)}
.bl .why{margin-left:auto;font:10px var(--mono);color:var(--muted)}

/* ---------- status bar ---------- */
#status{grid-area:status;display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--edge);font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--chassis)}
#status b{color:var(--ink);font-weight:400}

.ib{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--edge)}

.ib .bd{flex:1;min-width:0}
.ib .bd p{font-size:12.5px;margin-bottom:6px}
.ib .bd p b{font-weight:600}
.ib .bd q{color:var(--muted);font-style:italic}
.ib .acts{display:flex;gap:5px;flex-wrap:wrap}
.ib .acts .btn{height:24px;padding:0 8px;font-size:11.5px}

.ib .reply{margin-top:6px;display:flex;gap:6px}
.ib .reply input{flex:1}
.ibsn{padding:8px 4px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
/* standup */
.dig li{list-style:none;display:flex;gap:8px;padding:6px 8px;border-radius:3px;font-size:12.5px;align-items:flex-start}
.dig li:hover{background:#fff}
.dig li .lab{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:74px;flex:none;padding-top:3px}
.dig li .tx{flex:1}
.dig li .trace{display:none;gap:4px;flex-wrap:wrap;margin-top:4px}
.dig li:hover .trace,.dig li:focus-within .trace{display:flex}
.proto{background:#fff;border:1px solid var(--edge);border-radius:4px;padding:10px 12px;font-size:12.5px;line-height:1.6;outline:none}

.pubbox{margin-top:10px;padding:8px 10px;border:1px solid var(--edge);border-radius:4px;background:var(--chassis);font-size:12px;display:flex;align-items:center;gap:8px}

/* sources */
.srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.srcmod .mod-head .plate{font-size:10px}

.srcmod .kv{display:grid;grid-template-columns:96px 1fr;gap:3px 10px;margin-bottom:8px}
.srcmod .kv dt{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.srcmod .kv dd{min-width:0}
.srcmod .err{border:1px solid var(--fail);border-radius:4px;padding:7px 9px;background:#fff;color:var(--fail);font-size:12px;margin-bottom:8px}
.srcmod .warn{border:1px solid var(--teamcity);border-radius:4px;padding:7px 9px;background:#fff;font-size:12px;margin-bottom:8px}
.caps{display:flex;gap:4px;flex-wrap:wrap}
.caps .pill{text-transform:none;letter-spacing:.04em}
.wiz{display:grid;grid-template-columns:200px 1fr;gap:14px;margin-top:14px}
.wiz ol{list-style:none}

.wiz ol li.done{color:var(--ink)}

.types button.on{outline:2px solid var(--ink)}

.tres.open{display:block}
.tres.ok{border-color:var(--gitea)}
.tres.bad{border-color:var(--fail);color:var(--fail)}

.strip{position:relative;height:86px;margin:8px 0 4px;border:1px solid var(--edge);border-radius:4px;background:#fff;overflow:hidden}
.strip .tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--edge)}
.strip .tick span{position:absolute;top:3px;left:4px;font:9.5px var(--mono);color:var(--muted)}
.strip .blk{position:absolute;top:24px;height:50px;border-radius:3px;border:2px solid var(--src,var(--muted));background:var(--src,var(--muted));color:#fff;padding:4px 6px;font-size:11px;overflow:hidden;cursor:pointer;text-align:left}
.strip .blk.passive{background:#fff;color:var(--ink);padding-top:12px}
.strip .blk.passive::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(135deg,var(--src,var(--muted)) 0 3px,transparent 3px 6px)}
.strip .blk .k{font:700 10px var(--mono);letter-spacing:.04em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .blk .t{display:block;font-size:10.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .blk.unat{--src:var(--fail);background:repeating-linear-gradient(135deg,#fff 0 4px,#FBD5D9 4px 8px);color:var(--fail)}
.strip .blk.adhoc{--src:var(--muted);border-style:dashed;background:#fff;color:var(--ink)}
.strip .blk.gap{background:transparent;border:0;color:var(--muted);font:10px var(--mono);text-align:center;padding-top:18px;cursor:default}
.strip .blk.sel{outline:2px solid var(--ink);outline-offset:1px}
.strip .now{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink)}
.strip .now span{position:absolute;top:3px;left:4px;font:700 9.5px var(--mono)}
.tgrid{display:grid;grid-template-columns:1fr 300px;gap:14px}
.tinfo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;min-height:30px}
.week{display:grid;grid-template-columns:34px 1fr 60px;gap:4px 8px;align-items:center;font-size:12px}
.week .bar{height:12px;background:var(--edge);border-radius:2px;position:relative;overflow:hidden}
.week .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}

.week .d{font:10px var(--mono);letter-spacing:.08em;color:var(--muted)}
.week .h{font:11px var(--mono);text-align:right}
/* worklog draft */
.wdl{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12.5px}
.wdl input[type=checkbox]{width:16px;height:16px;margin-top:1px;accent-color:var(--ink)}
.wdl .k{font:11px var(--mono)}
.wdl .when{margin-left:auto;font:10px var(--mono);color:var(--muted)}
/* steps (start work) */
.steps li{list-style:none;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:3px;font-size:12.5px}
.steps li i{width:20px;height:20px;border-radius:999px;border:2px solid var(--edge);flex:none;display:inline-flex;align-items:center;justify-content:center}
.steps li.run i{border-color:var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done i{border-color:var(--ink);background:var(--ink)}
.steps li.done i::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.steps li .k{font:11px var(--mono)}
.steps li .r{margin-left:auto;font:10px var(--mono);color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
/* context menu */
#cmenu{position:fixed;z-index:70;width:230px;display:none;padding:4px}
#cmenu.open{display:block}
#cmenu .mh{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px 4px}
#cmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:3px;font-size:12.5px}
#cmenu button:hover{background:#fff}
#cmenu button .kbd{margin-left:auto}
#cmenu hr{border:0;border-top:1px solid var(--edge);margin:4px 0}
/* toasts */
#toasts{position:fixed;left:64px;bottom:36px;z-index:90;display:flex;flex-direction:column;gap:6px}
.toast{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:#fff;border-radius:4px;font-size:12.5px;animation:tin .15s ease-out;max-width:520px}
.toast .jack{border-color:var(--src,#fff)}
.toast .tk{font:10.5px var(--mono);color:#fff;opacity:.7;margin-left:4px}
@keyframes tin{from{transform:translateY(6px);opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function openMenu(id,x,y){
  const m=$('#cmenu');const n=id?NB[id]:null;let items=[];

  else{
    items.push(`<div class="mh">${esc(n.key)} · ${KIND[n.kind]}</div>`);
    items.push(li('Open','open'));
    if(n.kind==='ticket'||n.kind==='epic'){const t=TICKETS[n.key];if(t&&t.status==='To Do')items.push(li('Start work…','start-work'));items.push(li(timer.running&&timer.ctx===id?'Stop timer':'Start timer here','timer','⌘T'));items.push(li('Change status ▸','status'));items.push(li('Add comment','comment'))}
    if(n.kind==='pr'){items.push(li('Re-request review','rereview'));items.push(li('Start timer here','timer','⌘T'))}
    if(n.kind==='build'){items.push(li('Open log','open'));items.push(li('Re-run failed','rerun'));items.push(li('Trigger Payout_IntegrationTests…','trigger'))}
    if(n.kind==='branch'||n.kind==='repo'){items.push(li('Pull','pull'));items.push(li('Push','push'));items.push(li('New branch…','new-branch'));if(n.kind==='repo')items.push(li('Create repo…','create-repo'))}
    if(n.kind==='page'){items.push(li('Edit page','open'));items.push(li('Create page…','create-page'))}
    if(n.kind==='note'){items.push(li('New note','new-note'))}
    items.push('<hr>',li('Link to…','link'));
  }
  m.innerHTML=items.join('');m.classList.add('open');
  const W=230,H=m.offsetHeight;m.style.left=Math.min(x,innerWidth-W-8)+'px';m.style.top=Math.min(y,innerHeight-H-8)+'px';
  m.querySelector('button')?.focus();
  m.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;m.classList.remove('open');doAction(b.dataset.act,id,x,y)};
}
function doAction(act,id,x,y){
  const n=id?NB[id]:null;
  switch(act){
    case 'open':if(n)go(n.route);break;
    case 'fit':fitAll();break;
    case 'start-work':openStartWork(n?n.key:'PAY-240');break;
    case 'timer':if(timer.running&&timer.ctx===id)stopTimer();else startTimer(id);break;
    case 'status':go(n.route);setTimeout(()=>$('#card .seg button')?.focus(),50);break;
    case 'comment':go(n.route);setTimeout(()=>$('#card textarea')?.focus(),50);break;
    case 'rereview':toast('Review re-requested from Jonas Becker on '+n.key,'gitea');break;
    case 'rerun':rerunBuild();break;
    case 'trigger':openTrigger();break;
    case 'pull':toast(`Pulled ${n.kind==='repo'?n.title:n.title} — already up to date (${n.kind==='repo'?'~/code/'+n.title:'~/code/payout-service'})`,'gitea');break;
    case 'push':toast(`Pushed ${n.kind==='branch'?'3 commits on '+n.title:n.title} to git.tidewater.internal`,'gitea');break;
    case 'new-branch':openCreate('branch');break;
    case 'create-repo':openCreate('repo');break;
    case 'create-ticket':openCreate('ticket');break;
    case 'create-page':openCreate('page');break;
    case 'new-note':newNote();break;
    case 'link':openPicker(id||state.sel,x,y);break;
  }
}

/* =========================================================
   SEARCH — one local full-text index over every source
   ========================================================= */
const WHO={pay231:'mara',page_sepa:'mara',pr142:'mara',commit_a41:'mara',b1187:'mara',b1188:'mara',note_sepa:'mara',branch231:'mara',pay228:'mara',pay240:'mara',pay236:'jonas',ops77:'tomasz',pay200:'priya',page_arch:'priya',page_oncall:'tomasz',page_runbook:'tomasz',ledger_api:'mara',note_standup:'mara',pr139:'mara',pr144:'jonas',x_c90d11:'mara',x_7be0e4:'mara',x_note_cred:'mara',x_pay219:'mara',x_page_standup:'mara',x_repo_payout:'mara',x_b412:'tomasz'};
const WHEN={pay231:'today',page_sepa:'today',pr142:'today',commit_a41:'today',b1187:'today',b1188:'today',note_sepa:'today',branch231:'today',pay240:'today',pr144:'today',pay228:'yesterday',note_standup:'yesterday',pr139:'yesterday',x_c90d11:'today',x_7be0e4:'yesterday',x_page_standup:'yesterday',x_b412:'yesterday'};
function pool(){return [...NODES,...EXTRA]}
function whenOf(n){return WHEN[n.id]||'older'}
function failingSet(){
  const bad=NODES.filter(n=>n.status==='failed').map(n=>n.id);
  const s=new Set(bad);bad.forEach(b=>linked(b).forEach(x=>s.add(x)));
  bad.forEach(b=>linked(b).forEach(x=>linked(x).forEach(y=>{if(NB[y]&&['ticket','branch','pr'].includes(NB[y].kind))s.add(y)})));
  return s;
}
function searchHits(q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);const F=state.filters;const fail=F.failing?failingSet():null;
  return pool().filter(n=>{
    if(state.hidden[n.src])return false;
    if(F.src&&n.src!==F.src)return false;
    if(F.type&&n.kind!==F.type)return false;
    if(F.who&&WHO[n.id]!==F.who)return false;
    if(F.when&&whenOf(n)!==F.when)return false;
    if(fail&&!fail.has(n.id))return false;
    if(!words.length)return false;
    const txt=(n.key+' '+n.title+' '+(SEARCHTEXT[n.id]||n.text||'')).toLowerCase();
    return words.every(w=>txt.includes(w));
  });
}
function mark(s,q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);let out=esc(s);
  words.forEach(w=>{out=out.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});
  return out;
}
function renderSearch(){
  const q=state.query,pop=$('#spop'),F=state.filters;
  const hits=q?searchHits(q):[];
  const chips=Object.keys(SRC).map(k=>`<button class="chip src-${k} ${F.src===k?'on':''}" data-fsrc="${k}"><span class="jack"></span><span>${esc(SRC[k].name)}</span></button>`).join('');
  const types=['ticket','page','pr','commit','build','note','branch','repo','epic'];
  const filters=`<div class="sfilters">
    ${chips}
    <select class="tx" style="width:auto" aria-label="Type" data-ftype><option value="">Any type</option>${types.map(t=>`<option value="${t}" ${F.type===t?'selected':''}>${KIND[t]}</option>`).join('')}</select>
    <select class="tx" style="width:auto" aria-label="Person" data-fwho><option value="">Anyone</option>${Object.keys(PEOPLE).map(p=>`<option value="${p}" ${F.who===p?'selected':''}>${esc(PEOPLE[p].n)}</option>`).join('')}</select>
    <select class="tx" style="width:auto" aria-label="Updated" data-fwhen><option value="">Any date</option><option value="today" ${F.when==='today'?'selected':''}>Today</option><option value="yesterday" ${F.when==='yesterday'?'selected':''}>Yesterday</option><option value="older" ${F.when==='older'?'selected':''}>Earlier</option></select>
    <button class="chip ${F.failing?'on':''}" data-ffail title="Joins Jira, Gitea and TeamCity locally"><span class="jack src-teamcity fail"></span><span>Has a failing build</span></button>
  </div>`;
  if(!q){
    pop.innerHTML=filters+`<div style="padding:10px 12px">
      <div class="plate dim" style="margin-bottom:8px">Smart lists — saved local queries</div>
      ${LENSES.map(l=>`<button class="sres" data-lensrow="${l.id}"><span class="k">${esc(l.n)}</span><span class="t">${esc(l.name)}</span><span class="m">${l.jql?'no JQL equivalent':l.note?'partly off canvas':'lens'}</span></button>`).join('')}
      <div class="muted" style="font-size:12px;padding:10px 0 2px">Type to search 1,284 issues, 3,912 pages, 47 repos and 3 notes in the local index. Results dim the canvas to the matches.</div></div>`;
    return;
  }
  pop.innerHTML=filters+(hits.length?hits.map((n,i)=>`<button class="sres src-${n.src} ${i===state.scur?'cur':''}" data-go="${n.route}" data-idx="${i}">
      <span class="jack"></span><span class="k">${mark(n.key,q)}</span><span class="t">${mark(n.title,q)}</span>
      <span class="m">${esc(SRC[n.src].name)} · ${esc(n.src==='note'?'local':SRC[n.src].sync)}</span></button>`).join('')
    :`<div style="padding:14px 12px" class="muted">No match for “${esc(q)}” in the local index. Clear a filter, or sync the sources again.</div>`);
}
$('#q').addEventListener('input',()=>{state.query=$('#q').value.trim();state.scur=0;state.lens=null;$('#spop').classList.add('open');renderSearch();renderCanvas();renderLenses()});
$('#q').addEventListener('focus',()=>{$('#spop').classList.add('open');renderSearch()});
$('#q').addEventListener('keydown',ev=>{
  const rows=$$('#spop .sres');
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();if(!rows.length)return;state.scur=(state.scur+(ev.key==='ArrowDown'?1:rows.length-1))%rows.length;renderSearch();$$('#spop .sres')[state.scur]?.scrollIntoView({block:'nearest'})}
  else if(ev.key==='Enter'){const r=$$('#spop .sres')[state.scur];if(r){ev.preventDefault();$('#spop').classList.remove('open');if(r.dataset.go)go(r.dataset.go);else applyLens(r.dataset.lensrow)}}

  if(q)fireBuild(q.cfg,q.branch,q.env,q.clean);
}

function newNote(){
  const ctx=state.sel&&NB[state.sel]?NB[state.sel]:null;
  const id='note-'+(Object.keys(NOTES).length+1);
  const link=ctx&&CHIPMAP[ctx.key]?ctx.key:null;
  NOTES[id]={title:'New note'+(link?' · '+link:''),edited:'today 14:32',node:null,
    body:(link?'Links: [['+link+']]\n\n':'')+'Start typing. Use [[PAY-231]] to patch a cable to any entity.'};
  state.noteId=id;go('#/notes');renderCard();toast('New note created'+(link?' — pre-linked to '+link:''),'note');
}

/* =========================================================
   CANVAS EXTRAS
   ========================================================= */
function fitAll(){
  const xs=NODES.map(n=>n.x),ys=NODES.map(n=>n.y);
  const x0=Math.min(...xs)-90,x1=Math.max(...xs)+90,y0=Math.min(...ys)-60,y1=Math.max(...ys)+80;
  let w=Math.max(x1-x0,600),h=w*0.70;
  if(y1-y0>h){h=y1-y0;w=h/0.70}
  vb={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h};setVB();
}
function freeSpot(){
  for(let y=70;y<=630;y+=30)for(let x=1080;x>=70;x-=30){
    if(NODES.every(n=>Math.hypot(n.x-x,n.y-y)>150))return {x,y};
  }
  return {x:1080,y:80};
}

/* =========================================================
   GLOBAL CLICK DELEGATION
   ========================================================= */
document.addEventListener('click',ev=>{
  const t=ev.target;
  const g=t.closest('[data-go]');
  if(g){ev.preventDefault();if(t.closest('#spop'))$('#spop').classList.remove('open');go(g.dataset.go);return}
  if(t.closest('[data-close]')){ if($('#dlg').contains(t)){closeDlg()} else if(t.closest('#picker')){$('#picker').classList.remove('open')} else if(t.closest('#linkpop')){$('#linkpop').classList.remove('open')} else {closeOverlay()} return}
  const so=t.closest('[data-sugok]');if(so){const[a,b]=so.dataset.sugok.split('|');confirmLink(a,b);return}
  const sn=t.closest('[data-sugno]');if(sn){const[a,b]=sn.dataset.sugno.split('|');dismissLink(a,b);return}
  const op=t.closest('[data-open]');if(op){go(OVR[op.dataset.open]);return}
  const lr=t.closest('[data-lensrow]');if(lr){applyLens(lr.dataset.lensrow);return}
  const ly=t.closest('[data-layer]');if(ly&&!t.closest('#legend')){state.hidden[ly.dataset.layer]=!state.hidden[ly.dataset.layer];renderAll();if(state.overlay==='ov-sources')renderSources();return}
  const tg=t.closest('.toggle');if(tg&&!tg.hasAttribute('data-layer')){tg.classList.toggle('on');tg.setAttribute('aria-checked',tg.classList.contains('on'));return}
  if(t.closest('[data-syncall]')){state.syncMin=0;renderSync();toast(state.tcFixed?'Synced 4 sources — 1,284 issues, 3,912 pages, 47 repos, 3 build configurations':'Synced 3 sources. TeamCity still returns 401 Unauthorized.');return}
  if(t.closest('[data-pwd]')){openPassword();return}
  if(t.closest('[data-trigger]')){openTrigger();return}
  const rr=t.closest('[data-rerun]');if(rr){rerunBuild();return}
  const sw=t.closest('[data-startwork]');if(sw){openStartWork(sw.dataset.startwork);return}
  const cr=t.closest('[data-create]');if(cr){openCreate(cr.dataset.create);return}
  if(t.closest('[data-newnote]')){newNote();return}
  const gi=t.closest('[data-git]');if(gi){const a=gi.dataset.arg;
    toast(gi.dataset.git==='pull'?'Pulled '+a+' — already up to date':'Pushed '+a+' to git.tidewater.internal','gitea');return}
});

/* card-scoped actions */

    renderCard();toast(key+' → '+s,'jira');return}
  const ac=t.closest('[data-addcm]');if(ac){const v=$('#newcm').value.trim();
    if(!v){$('#newcm').focus();toast('Write a comment before adding it');return}
    TICKETS[ac.dataset.addcm].comments.push({who:'mara',when:'today 14:32',t:v});renderCard();toast('Comment added to '+ac.dataset.addcm,'jira');return}
  const pc=t.closest('[data-prcm]');if(pc){const v=$('#newcm').value.trim();
    if(!v){$('#newcm').focus();toast('Write a comment before adding it');return}
    PRS[pc.dataset.prcm].comments.push({who:'mara',when:'today 14:32',t:v});renderCard();toast('Comment added to PR #'+pc.dataset.prcm,'gitea');return}
  const gc=t.closest('[data-pagecm]');if(gc){const v=$('#newcm').value.trim();
    if(!v){$('#newcm').focus();toast('Write a reply before sending it');return}
    PAGES[gc.dataset.pagecm].comments.push({who:'mara',when:'today 14:32',t:v});
    INBOX=INBOX.filter(i=>i.id!=='i2');renderInboxCount();renderCard();toast('Replied to Priya Nair on the page','confluence');return}
  const sp=t.closest('[data-savepage]');if(sp){const slug=sp.dataset.savepage;
    PAGES[slug].body=$('#pagebody').innerText.trim();PAGES[slug].edited='today 14:32';
    renderCard();toast('Saved '+PAGES[slug].title+' to Tidewater Wiki','confluence');return}

  const nb=t.closest('[data-note]');if(nb){state.noteId=nb.dataset.note;go('#/note/'+nb.dataset.note);return}
  const pk=t.closest('[data-pick]');if(pk){const r=pk.getBoundingClientRect();openPicker(pk.dataset.pick,r.left-360,r.top-40);return}
  const cm=t.closest('[data-cmenu]');if(cm){const r=cm.getBoundingClientRect();openMenu(cm.dataset.cmenu,r.left-40,r.bottom+4);return}
  const tb=t.closest('[data-timer]');if(tb){const id=tb.dataset.timer;
    if(timer.running&&timer.ctx===id)stopTimer();else if(id&&id!=='undefined')startTimer(id);else toast('Pick an entity or an ad-hoc label from the timer menu');return}
  const rv=t.closest('[data-rereview]');if(rv){toast('Review re-requested from Jonas Becker on PR #'+rv.dataset.rereview,'gitea');return}
  const ap=t.closest('[data-approve]');if(ap){const pr=PRS[ap.dataset.approve];pr.approvals=Math.min(pr.need,pr.approvals+1);pr.approvedBy=pr.approvedBy==='—'?'Mara Lindqvist':pr.approvedBy+', Mara Lindqvist';
    INBOX=INBOX.filter(i=>i.id!=='i1');renderInboxCount();renderCard();toast('Approved PR #'+ap.dataset.approve,'gitea');return}
  if(t.closest('[data-cmtpay]')){go('#/ticket/PAY-231');setTimeout(()=>$('#newcm')?.focus(),60);return}
  const mn=t.closest('[data-menu]');if(mn){const r=mn.getBoundingClientRect();openMenu(state.sel,r.left-190,r.bottom+4);return}

/* dialog-scoped actions */
$('#dlg').addEventListener('click',ev=>{
  const t=ev.target;

  if(t.closest('[data-tctest]')){const r=$('#tctest');const p=$('#tcpwd').value;
    r.className='tres open '+(p?'ok':'bad');
    r.innerHTML=p?'<b>Connected.</b> ci.tidewater.internal answered as mara.lindqvist in 180 ms.':'<b>Enter the new password first.</b> The field is empty.';return}
  if(t.closest('[data-tcsave]')){const p=$('#tcpwd').value;
    if(!p){$('#tcpwd').focus();$('#tctest').className='tres open bad';$('#tctest').innerHTML='<b>Enter the new password first.</b> The field is empty.';return}
    state.tcFixed=true;SRC.teamcity.sync='synced just now';closeDlg();renderSync();
    if(state.overlay==='ov-sources')renderSources();
    toast('TeamCity password saved — syncing again','teamcity');flushPending();return}
  const sw=t.closest('[data-swrun]');if(sw){runStartWork(sw.dataset.swrun);return}
  if(t.closest('[data-tbgo]')){const cfg=$('#tbcfg').value,br=$('#tbbr').value.trim(),env2=$('#tbenv .on').dataset.env,cl=$('#tbclean').classList.contains('on');

  if(t.closest('[data-wldiscard]')){closeDlg();toast('Draft discarded — nothing logged');return}
  if(t.closest('[data-wledit]')){$('#wlcm').focus();$('#wlcm').setSelectionRange($('#wlcm').value.length,$('#wlcm').value.length);return}
  if(t.closest('[data-wlok]')){const tk=$('#wltarget').value,tot=hm(wlTotal()),cm=$('#wlcm').value.trim();
    if(tk){addWorklog(tk,tot,cm||'Worked on '+tk);TICKETS[tk].spent='9h 14m';logged[2]=tk;logged[6]=tk;
      toast('Logged '+tot+' to '+tk+' — “'+esc(cm.slice(0,52))+(cm.length>52?'…':'')+'”','jira')}
    else toast('Kept '+tot+' local — no Jira worklog written');
    closeDlg();if(state.overlay==='ov-time')renderTime();return}
  const ag=t.closest('[data-asgok]');if(ag){const i=+ag.dataset.asgok,k=$('#asg').value,b=BLOCKS[i];
    logged[i]=k;addWorklog(k,hm(blockMin(b)),$('#asgc').value);closeDlg();if(state.overlay==='ov-time')renderTime();
    toast('Logged '+hm(blockMin(b))+' to '+k,'jira');return}
  if(t.closest('[data-ctok]')){const p=$('#ctp').value,s=$('#cts').value.trim(),d=$('#ctd').value.trim(),a=$('#cta').value,ty=$('#ctt').value;
    if(!s){$('#cts').focus();toast('Give the ticket a summary first');return}
    const key=p+'-'+(p==='PAY'?nextKey++:78);
    TICKETS[key]={summary:s,type:ty,status:'To Do',priority:'Medium',assignee:a,updated:'today 14:32',desc:esc(d||'Created from knobas.'),comments:[],worklogs:[]};
    const sp2=freeSpot();addNode({id:key.toLowerCase().replace('-',''),src:'jira',kind:'ticket',key,title:s,x:sp2.x,y:sp2.y,route:'#/ticket/'+key});
    if(state.sel&&NB[state.sel])EDGES.push({a:key.toLowerCase().replace('-',''),b:state.sel});
    closeDlg();renderAll();fitAll();go('#/ticket/'+key);toast('Created '+key+' — '+s,'jira');return}
  if(t.closest('[data-cpok]')){const ti=$('#cpt').value.trim(),b=$('#cpb').value.trim(),par=$('#cpp').value;

    const sp3=freeSpot();addNode({id:'pg'+(nextPage++),src:'confluence',kind:'page',key:'Page · ENG',title:ti,x:sp3.x,y:sp3.y,route:'#/page/'+slug});
    closeDlg();renderAll();fitAll();go('#/page/'+slug);toast('Created ENG › '+par+' › '+ti,'confluence');return}
  if(t.closest('[data-cbok]')){const r=$('#cbr').value,n=$('#cbn').value.trim(),f=$('#cbf').value;
    if(!n){$('#cbn').focus();toast('Name the branch first');return}
    REPOS[r].branches.push([n,'new · checked out']);closeDlg();toast('Created '+n+' from '+f+' in '+r,'gitea');renderCard();return}
  if(t.closest('[data-crok]')){const n=$('#crn').value.trim(),l=$('#crl').value,c=$('#crc').classList.contains('on');
    if(!n){$('#crn').focus();toast('Name the repository first');return}
    REPOS[n]={key:'Repo',title:n,lang:l,clone:c?'~/code/'+n:'not cloned',def:'main',commits:'0 commits',node:null,branches:[['main','default']]};
    closeDlg();toast('Created tidewater/'+n+(c?' and cloned it to ~/code/'+n:''),'gitea');return}
});

/* =========================================================
   ROUTING, KEYBOARD, INIT
   ========================================================= */
const OVRT={'#/inbox':'ov-inbox','#/time':'ov-time','#/standup':'ov-standup','#/sources':'ov-sources'};
function renderRail(){
  $$('#rail button[data-go]').forEach(b=>{
    const g=b.dataset.go;let on=false;
    if(OVRT[g])on=state.overlay===OVRT[g];
    else if(g==='#/notes')on=!state.overlay&&(state.baseRoute==='#/notes'||state.baseRoute.startsWith('#/note/'));
    else if(g==='#/graph')on=!state.overlay&&state.baseRoute!=='#/notes'&&!state.baseRoute.startsWith('#/note/');
    b.classList.toggle('on',on);
  });
}
function renderAll(){renderCanvas();renderLenses();renderCard();renderSync();renderInboxCount();renderTimer();renderRail()}
function route(){
  const h=location.hash||'#/ticket/PAY-231';
  if(OVRT[h]){renderAll();openOverlay(OVRT[h]);return}
  if(state.overlay)closeOverlay(true);
  state.baseRoute=h;
  if(h.startsWith('#/note/'))state.noteId=h.slice(7);
  const n=NODES.find(x=>x.route===h);state.sel=n?n.id:null;
  renderAll();
}
addEventListener('hashchange',route);
addEventListener('resize',()=>requestAnimationFrame(drawPbays));

addEventListener('keydown',ev=>{
  const meta=ev.metaKey||ev.ctrlKey,k=(ev.key||'').toLowerCase();
  if(meta&&k==='k'){ev.preventDefault();$('#q').focus();$('#q').select();$('#spop').classList.add('open');renderSearch();return}
  if(meta&&k==='t'){ev.preventDefault();if(timer.running)stopTimer();else startTimer(timer.ctx||'pay231');return}
  if(ev.key==='Escape'){
    if($('#cmenu').classList.contains('open')){$('#cmenu').classList.remove('open');return}
    if($('#picker').classList.contains('open')){$('#picker').classList.remove('open');return}
    if($('#linkpop').classList.contains('open')){$('#linkpop').classList.remove('open');return}
    if($('#tpop').classList.contains('open')){$('#tpop').classList.remove('open');return}
    if($('#spop').classList.contains('open')){$('#spop').classList.remove('open');$('#q').blur();return}
    if($('#dlg').classList.contains('open')){closeDlg();return}
    if(state.overlay){closeOverlay();return}
    if(state.query||state.lens){state.query='';state.lens=null;$('#q').value='';renderAll();return}
  }
});

setInterval(()=>{renderTimer();const m=nowMin();$('#clock').textContent=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`},20000);

if(!location.hash)location.hash='#/ticket/PAY-231';
route();
renderSearch();
renderTimerPop();

}catch(err){
  const j=document.getElementById('jserr');
  if(j){j.style.display='inline';j.textContent='JS error: '+(err&&err.message?err.message:err)}
  console.error(err);
}
