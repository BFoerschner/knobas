<!--
knobas mockup
paradigm: P1 Launcher
design: D4 Atlas
thesis: One box, typed prefixes and a Tab-chain reach every source and every action without a sidebar
thesis: Indigo chart table with parchment text; entities are places, links are dashed teal routes, history is an itinerary
thesis: The route strip — linked entities drawn as waypoints on a dashed route, redrawn when a suggested link is confirmed
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Tidewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=Source+Sans+3:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A2C; --panel:#182238; --raised:#1F2B45; --line:#27344F; --line2:#31405E;
  --text:#EAE4D3; --muted:#A5AEC2; --faint:#6C778F;
  --gold:#D4A857; --gold-dim:rgba(212,168,87,.16); --teal:#3FB8AF; --teal-dim:rgba(63,184,175,.14);
  --coral:#E2735B; --coral-dim:rgba(226,115,91,.14); --green:#8CC8A0;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:3px;
  /* contour lines: a chart table under everything — baked opacity, no overlay layer */
  --contour:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720' viewBox='0 0 720 720' fill='none' stroke='%23EAE4D3' stroke-opacity='0.055' stroke-width='1'><path d='M60 360c0-120 100-200 220-190s210 90 230 190-40 220-200 230S60 480 60 360z'/><path d='M120 360c0-90 70-150 170-142s160 70 175 142-30 170-150 178S120 430 120 360z'/><path d='M180 362c0-55 45-90 110-86s105 45 112 86-20 108-100 112S180 405 180 362z'/><path d='M240 362c0-25 22-40 55-38s50 20 55 38-10 50-50 52S240 382 240 362z'/><path d='M500 80c60-40 150-30 190 30s10 150-60 170-160-10-170-70 0-100 40-130z'/><path d='M540 110c40-25 100-20 125 20s5 100-40 112-105-5-112-45 0-65 27-87z'/><path d='M40 640c30-60 110-90 190-60s120 90 90 140-110 60-180 30S10 700 40 640z'/><path d='M90 650c20-35 70-55 120-38s75 55 55 85-70 38-115 20S70 685 90 650z'/><path d='M330 470c40-30 110-24 140 16s6 110-46 124-118-6-126-50 0-72 32-90z'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background-color:var(--bg);background-image:var(--contour);background-size:460px 460px;color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--gold-dim);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--teal)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-radius:var(--r)}
.sr{position:absolute;left:-9999px}
/* ---------- app frame ---------- */
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:34px 54px auto minmax(0,1fr) 26px;
  max-width:1320px;margin:0 auto;background-color:var(--panel);background-image:var(--contour);background-size:460px 460px;
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:1340px){.app{max-width:none;border:0}}
/* strip */
.strip{display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--bg)}
.strip .spacer{flex:1}
.timer{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 4px;border-radius:var(--r);color:var(--text)}
.timer:hover{background:var(--raised)}
.timer.on .compass{color:var(--gold)}
.timer.off .compass{color:var(--faint)}
.timer .ctx{font-family:var(--mono);font-size:12.5px}
.timer .el{font-family:var(--mono);font-size:12.5px;color:var(--gold)}
.timer.off .el{color:var(--faint)}
.compass{width:16px;height:16px;transition:transform .4s}
.sync{display:flex;align-items:center;gap:12px}
.src{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:var(--r);font-family:var(--serif);font-variant:small-caps;font-feature-settings:"smcp";font-size:13px;letter-spacing:.04em;color:var(--muted)}
.src:hover{background:var(--raised)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.dot.bad{background:var(--coral)}
.src .code{font-family:var(--mono);font-size:11px;color:var(--coral);font-variant:normal;letter-spacing:0}
.ibtn{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:var(--r);color:var(--muted)}
.ibtn:hover{background:var(--raised);color:var(--text)}
.ibtn .n{font-family:var(--mono);color:var(--gold);font-size:12.5px}
.ibtn svg{width:14px;height:14px}
/* the box */
.box{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);position:relative}
.box .pfx{width:22px;height:22px;color:var(--gold);flex:none}
.chain{display:flex;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r);background:var(--raised);border:1px solid var(--line2);font-size:13px;color:var(--text);white-space:nowrap}
.chip .k{font-family:var(--mono);font-size:12px}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chain .arrow{color:var(--faint);align-self:center}
.box input{flex:1;min-width:120px;background:none;border:0;font-size:19px;font-family:var(--sans);color:var(--text);caret-color:var(--gold);padding:10px 0}
.box input::placeholder{color:var(--faint)}
.box .kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line2);padding:1px 5px;border-radius:var(--r)}
.pills{display:flex;gap:2px;flex:none}
.pill{padding:4px 9px;border-radius:var(--r);font-size:13px;color:var(--muted);border:1px solid transparent;display:flex;gap:5px;align-items:center}
.pill:hover{color:var(--text);background:var(--raised)}
.pill.on{color:var(--gold);border-color:var(--line2);background:var(--raised)}
.pill .n{font-family:var(--mono);font-size:11.5px;color:var(--gold)}
@media (max-width:1240px){.pill{padding:4px 6px;font-size:12px}.box input{font-size:17px}.box{gap:8px}}
/* itinerary */
.itin{display:flex;align-items:center;gap:4px;padding:0 14px;height:28px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--faint);overflow:hidden;white-space:nowrap;background:var(--bg)}
.itin .lbl{font-family:var(--serif);font-variant:small-caps;font-feature-settings:"smcp";letter-spacing:.05em;color:var(--faint);margin-right:8px;font-size:13px}
.itin .stop{display:inline-flex;align-items:center;gap:5px;color:var(--muted);padding:1px 4px;border-radius:var(--r)}
.itin .stop:hover{background:var(--raised);color:var(--text)}
.itin .stop.cur{color:var(--gold)}
.itin .stop .t{font-family:var(--mono);font-size:11px;color:var(--faint)}
.itin .leg{width:18px;height:1px;border-top:1px dashed var(--teal);opacity:.6;margin:0 2px}
/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.stage.split{grid-template-columns:minmax(360px,5fr) minmax(0,7fr)}
.list{min-height:0;overflow:auto;border-right:1px solid var(--line);padding:6px 0 20px}
.stage:not(.split) .list{border-right:0}
.detail{min-height:0;overflow:auto}
.list::-webkit-scrollbar,.detail::-webkit-scrollbar,.hs::-webkit-scrollbar{width:10px;height:10px}
.list::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb,.hs::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--panel);border-radius:6px}
/* group eyebrows */
.eyebrow{font-family:var(--serif);font-variant:small-caps;font-feature-settings:"smcp";font-size:14px;letter-spacing:.08em;color:var(--faint);padding:10px 14px 3px;display:flex;align-items:center;gap:8px}
.eyebrow .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant:normal;letter-spacing:0}
.eyebrow .badge{font-family:var(--mono);font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:var(--r);padding:0 4px;font-variant:normal;letter-spacing:0}
.eyebrow .hint{margin-left:auto;font-family:var(--sans);font-variant:normal;letter-spacing:0;font-size:12px;color:var(--faint)}
.eyebrow svg,.doc h2 svg{width:13px;height:13px;vertical-align:-2px;flex:none}
.k:empty{display:none}
/* result rows */
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 14px 6px 12px;border-left:2px solid transparent;cursor:pointer;min-height:36px}
.row:hover{background:rgba(31,43,69,.5)}
.row.sel{background:var(--raised);border-left-color:var(--gold)}
.row .src{padding:0;font-size:12.5px;gap:6px}
.row .src svg{width:13px;height:13px;color:var(--muted);flex:none}
.row .ttl{display:flex;align-items:baseline;gap:8px;min-width:0}
.row .ttl .k{font-family:var(--mono);font-size:13px;color:var(--text);flex:0 0 auto;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ttl .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.row .ttl .sub{color:var(--faint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.row .meta .st{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.row.action .ttl .s::before{content:"› ";color:var(--gold)}
.row .meta .st.bad{color:var(--coral)} .row .meta .st.run{color:var(--gold)} .row .meta .st.ok{color:var(--green)}
.row.big{grid-template-columns:76px minmax(0,1fr) auto;align-items:start;padding:9px 14px 9px 12px}
.row.big .body{min-width:0}
.row.big .body .s{white-space:normal}
.row .acts{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.row .when{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.row.done{opacity:.45}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r);border:1px solid var(--line2);background:var(--raised);color:var(--text);font-size:13px;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:2px 7px;font-size:12.5px}
.btn.gold{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:#e0b768}
.btn.teal{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised);border-color:transparent}
.btn.danger{color:var(--coral);border-color:rgba(226,115,91,.4)}
.btn:disabled{opacity:.45;cursor:default}
.btn .kbd{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line2);padding:0 4px;border-radius:2px}
/* detail document */
.doc{padding:16px 22px 40px;max-width:880px}
.doc h1{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.25;letter-spacing:-.005em;margin:2px 0 6px}
.doc h1 .k{font-family:var(--mono);font-size:15px;color:var(--gold);margin-right:10px;letter-spacing:0;vertical-align:2px}
.doc h2{font-family:var(--serif);font-variant:small-caps;font-feature-settings:"smcp";font-weight:500;font-size:15px;letter-spacing:.08em;color:var(--faint);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.doc h2 .hint{margin-left:auto;font-family:var(--sans);font-variant:normal;letter-spacing:0;font-size:12px;color:var(--faint);font-weight:400}
.doc h2 .cnt{font-family:var(--mono);font-size:11px;font-variant:normal;letter-spacing:0;color:var(--faint)}
.doc p{color:var(--text);margin:6px 0;line-height:1.6}
.doc .lead{color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin:6px 0 4px;align-items:center}
.facts .f{display:flex;gap:6px;align-items:center}
.facts .f b{font-weight:400;color:var(--faint);font-family:var(--serif);font-variant:small-caps;font-feature-settings:"smcp";font-size:14px;letter-spacing:.04em}
.facts .f .v{color:var(--text)}
.facts .mono,.mono{font-family:var(--mono);font-size:12.5px}
.stsel{appearance:none;-webkit-appearance:none;background:var(--raised);border:1px solid var(--line2);border-radius:var(--r);padding:2px 22px 2px 8px;color:var(--text);font-size:13px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23A5AEC2' stroke-width='1.3'/></svg>");background-repeat:no-repeat;background-position:right 7px center}
.stsel.prog{border-color:var(--gold);color:var(--gold)}
.stsel.done{color:var(--green);border-color:rgba(140,200,160,.5)}
.pri{font-family:var(--serif);font-variant:small-caps;font-feature-settings:"smcp";letter-spacing:.04em}
.pri.high{color:var(--coral)} .pri.medium{color:var(--gold)} .pri.low{color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:6px}
.av{width:18px;height:18px;border-radius:50%;background:var(--raised);border:1px solid var(--line2);font-family:var(--mono);font-size:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);letter-spacing:0}
.av.me{border-color:var(--gold);color:var(--gold)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px;align-items:center}
/* comments */
.cmt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cmt:last-of-type{border-bottom:0}
.cmt .h{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--muted)}
.cmt .h b{font-weight:600;color:var(--text)}
.cmt .h .t{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.cmt .b{color:var(--text);margin-top:2px;line-height:1.55}
.cmt.new{animation:fade .15s ease-out}
.addc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px;align-items:end}
.addc .btn{align-self:end}
.field{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;color:var(--text);font-size:14px;line-height:1.5;resize:vertical;min-height:36px;font-family:var(--sans)}
.field:focus{border-color:var(--gold)}
.field.mono{font-family:var(--mono);font-size:13px}
textarea.field{min-height:72px}
/* links list */
.links{display:flex;flex-direction:column}
.lnk{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:var(--r);cursor:pointer;border-left:2px solid transparent}
.lnk:hover{background:var(--raised)}
.lnk .src{padding:0;font-size:12.5px;gap:6px}
.lnk .src svg{width:13px;height:13px}
.lnk .n{display:flex;gap:8px;align-items:baseline;min-width:0}
.lnk .n .k{font-family:var(--mono);font-size:13px;flex:0 0 auto;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .n .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .m{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.lnk .m.bad{color:var(--coral)} .lnk .m.run{color:var(--gold)} .lnk .m.ok{color:var(--green)}
.lnk.sug{border-left:2px dashed rgba(63,184,175,.5)}
.lnk.sug .why{font-size:12.5px;color:var(--faint);font-style:italic;font-family:var(--serif);font-size:14px}
.lnk.sug .bt{display:flex;gap:4px}
.lnk.confirmed{border-left:2px solid var(--teal)}
/* route strip */
.routewrap{margin:10px 0 4px;overflow:auto}
.route{display:block;width:100%;height:auto}
.route .path{fill:none;stroke:var(--teal);stroke-width:1.3;stroke-dasharray:4 4;opacity:.8}
.route .path.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw .4s ease-out forwards}
.route .path.sug{opacity:.45;stroke-dasharray:2 5}
.route .wp{fill:var(--panel);stroke:var(--teal);stroke-width:1.5;cursor:pointer}
.route .wp.cur{fill:var(--gold);stroke:var(--gold)}
.route .wp.bad{stroke:var(--coral)} .route .wp.run{stroke:var(--gold)}
.route text{fill:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer}
.route text.cur{fill:var(--gold)}
.route text.lab{fill:var(--faint);font-family:var(--serif);font-size:12px;font-variant:small-caps;font-feature-settings:"smcp";letter-spacing:.06em}
.route g:hover text{fill:var(--text)}
.route g:hover .wp{stroke-width:2.5}
.route .ring{fill:none;stroke:var(--gold);stroke-width:1;opacity:.6}
.route .wpdot{fill:var(--coral)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
/* worklog rows */
.wl{display:grid;grid-template-columns:90px 70px minmax(0,1fr);gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.wl:last-child{border-bottom:0}
.wl .t{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.wl .d{font-family:var(--mono);font-size:12.5px;color:var(--text)}
/* code */
pre.log{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--muted);overflow:auto;white-space:pre}
pre.log .bad{color:var(--coral)} pre.log .ok{color:var(--green)}
.chk{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:13.5px}
.chk input{accent-color:var(--gold)}
.chk .t{font-family:var(--mono);color:var(--faint);font-size:11.5px;margin-left:auto}
/* steps (start work) */
.steps{display:flex;flex-direction:column;gap:0;margin:6px 0;position:relative}
.step{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:14px;color:var(--muted);position:relative}
.step .ico{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);justify-self:center;background:var(--panel);position:relative;z-index:1}
.step.doing .ico{border-color:var(--gold);animation:pulse 1s infinite}
.step.done .ico{background:var(--teal);border-color:var(--teal)}
.step.done{color:var(--text)}
.step.fail .ico{border-color:var(--coral);background:var(--coral)}
.step .r{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.step.done .r{color:var(--teal)}
.steps::before{content:"";position:absolute;left:10.5px;top:14px;bottom:14px;border-left:1px dashed var(--teal);opacity:.5}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--gold-dim)}}
/* wizard */
.wiz .q{font-family:var(--serif);font-size:20px;font-weight:500;margin:14px 0 10px}
.wiz .ans{display:flex;gap:8px;align-items:center;padding:5px 0;color:var(--muted);font-size:13.5px;border-bottom:1px solid var(--line)}
.wiz .ans .l{font-family:var(--serif);font-variant:small-caps;font-feature-settings:"smcp";letter-spacing:.05em;color:var(--faint);width:110px;font-size:14px}
.wiz .ans .v{color:var(--text)}
.wiz .ans .edit{margin-left:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--raised);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--gold)}
.opt svg{width:16px;height:16px;color:var(--teal);flex:none}
.opt .n{font-weight:600;font-size:14px}
.opt .d{font-size:12px;color:var(--faint);font-family:var(--mono)}
.caps{display:flex;gap:4px;flex-wrap:wrap}
.cap{font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line2);border-radius:var(--r);color:var(--muted)}
.cap.on{color:var(--teal);border-color:rgba(63,184,175,.5)}
.cap.off{color:var(--faint);text-decoration:line-through}

const MODE_CMD = {search:'',inbox:'> inbox',notes:'> notes',time:'t ',standup:'> standup',actions:'> ',sources:'> sources'};
function parseHash(){
  const h=decodeURIComponent(location.hash||'#/search').replace(/^#\/?/,'');
  const [path,qs]=h.split('?');const seg=path.split('/').filter(Boolean);
  const q=qs?new URLSearchParams(qs).get('q')||'':'';
  return {seg,q};
}
function applyQuery(v){
  S.q=v;const t=v.trim().toLowerCase();
  if(v.trim().startsWith('>')){S.mode='actions';return}
  if(t==='t'||t.startsWith('t ')){S.mode='time';
    const w=t.replace(/^t\s*/,'');
    S.sub=({'':'day',day:'day',today:'day',week:'week',timesheet:'week',draft:'draft',stop:'draft',log:'draft'})[w]||'day';return}
  if(t.startsWith('note:')||t==='notes'){S.mode='notes';return}
  S.mode='search';
}
function route(){
  const {seg,q}=parseHash();const head=seg[0]||'search';
  closePop();
  if(['ticket','pr','build','page','note','commit','branch','repo','person'].includes(head)&&seg[1]){
    const id=head+':'+seg.slice(1).join('/');
    if(!E[id]){S.mode='search';S.q=q;S.sel=null;S.sub=null;}
    else{S.sel=id;
      if(head==='note'){S.mode='notes'}else{S.mode='search'}
      if(S.mode==='search'){
        const cur=S.q.trim();
        if(!(cur&&searchResults(cur).some(r=>r.id===id))){
          S.q=searchResults('sepa retry').some(r=>r.id===id)?'sepa retry':((E[id].type==='page'||E[id].type==='note')?E[id].title:E[id].key);
        }
      }
      addStop(id)}
  } else if(head==='search'){if(q!==''&&q!==S.lastQ)S.sel=null;S.lastQ=q;S.sub=null;applyQuery(q)}
  else if(head==='inbox'){S.mode='inbox';S.sub=null;S.sel=null}
  else if(head==='notes'){S.mode='notes';S.sel=S.sel&&S.sel.startsWith('note:')?S.sel:'note:sepa-investigation';addStop(S.sel)}
  else if(head==='time'){S.mode='time';S.sub=seg[1]||'day';S.sel=null}
  else if(head==='standup'){S.mode='standup';S.sel=null;S.sub=seg[1]||null}
  else if(head==='actions'){S.mode='actions';S.sub=seg[1]||null;S.sel=seg.slice(2).join('/')||null;if(!S.q.trim().startsWith('>'))S.q='';}
  else if(head==='sources'){S.mode='sources';S.sub=seg[1]||null;S.sel=null;
    if(S.sub==='add'){if(!S.wiz)S.wiz={step:0,text:'',sched:'every 5 min'};S.cursor=0}else S.wiz=null}
  else {S.mode='search';S.q='';}
  S.chain=[];
  render();
}
function addStop(id){const last=S.itin[S.itin.length-1];if(last&&last.id===id)return;const e=E[id];S.itin.push({id,l:e?(e.type==='page'||e.type==='note'?e.title:e.key):id,t0:Date.now()});if(S.itin.length>14)S.itin.shift()}

function searchResults(q){
  const t=q.trim().toLowerCase();
  const all=Object.values(E).filter(e=>e.type!=='person'||t.startsWith('@'));
  const sm=t.replace(/^[#@\/]/,'').replace(/^\/(\w+)\s*/,'');
  let pool=all;
  if(t.startsWith('#'))pool=all.filter(e=>e.type==='ticket');
  else if(t.startsWith('@'))pool=all.filter(e=>e.type==='person');
  else if(t.startsWith('/')){const m=t.match(/^\/(\w+)\s*(.*)$/);if(m){pool=all.filter(e=>(SRC[TYPE_SRC[e.type]].label===m[1]||TYPE_SRC[e.type]===m[1]));return rank(pool,m[2])}}
  if(t==='has:failing-build mine')return [E['ticket:PAY-231']];
  if(t==='pr review:me')return [E['pr:144']];
  if(t==='pr idle>5d')return [E['pr:144'],E['pr:139']];
  if(t==='page editor:me week')return [E['page:sepa-design'],E['page:standups'],E['page:arch']];
  if(t==='blocked')return [E['ticket:PAY-228']];
  return rank(pool,sm);
}
function rank(pool,term){
  const words=term.split(/\s+/).filter(Boolean);
  if(!words.length)return pool.slice(0,12);
  const txt=e=>[e.key,e.title,e.desc||'',e.body||'',e.branch||'',e.repo||'',e.sub||'',(e.comments||[]).map(c=>c.b).join(' ')].join(' ').toLowerCase();
  const order={ticket:0,page:1,pr:2,commit:3,branch:4,build:5,note:6,repo:7,person:8};
  return pool.map(e=>{const s=txt(e);const hits=words.filter(w=>s.includes(w)).length;const title=words.filter(w=>(e.key+' '+e.title).toLowerCase().includes(w)).length;return {e,sc:hits===words.length?10+title*3:(hits?hits:0)}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||order[a.e.type]-order[b.e.type]).map(x=>x.e);
}
function metaOf(e){
  switch(e.type){
    case 'ticket':return `<span class="st${e.status==='In Progress'?' run':e.status==='Done'?' ok':''}">${e.status}</span><span>${e.updated.replace('today ','')}</span>`;
    case 'page':return `<span>edited ${e.edited.replace('today ','')}</span>`;
    case 'pr':return `<span class="st ${stClass(e.state)}">${e.state==='open'?e.approvals.split(' (')[0].replace(' of ','/')+' ✓':e.state}</span>`;
    case 'commit':return `<span>${e.when.replace('today ','')}</span>`;
    case 'build':return `<span class="st ${stClass(e.status)}">${e.status}</span>`;
    case 'note':return `<span>${e.edited.replace('today ','')}</span>`;
    case 'branch':return `<span>${e.repo}</span>`;
    case 'repo':return `<span>${e.lang}</span>`;
    default:return '';
  }
}

function routeStrip(id,extra){
  const e=E[id];if(!e)return '';
  const stops=[id,...(e.links||[]).filter(l=>E[l])];
  const sug=S.suggestions.filter(s=>s.state==='open'&&(s.to===id||s.from===id)).map(s=>s.to===id?s.from:s.to).filter(l=>E[l]&&!stops.includes(l));
  const all=[...stops,...sug];if(all.length<2)return '';
  const SP=112,W=Math.max(all.length*SP+8,480),y=30;
  let html=`<div class="routewrap"><svg class="route" width="100%" height="auto" style="max-width:${W}px" viewBox="0 0 ${W} 78" role="img" aria-label="Route of linked places">`;
  all.forEach((s,i)=>{const x=60+i*SP;const nx=60+(i+1)*SP;const E2=E[s];
    if(i<all.length-1){const isSug=i+1>=stops.length;const drawn=S.justDrew===all[i+1];html+=`<line class="path${isSug?' sug':''}${drawn?' draw':''}" x1="${x+7}" y1="${y}" x2="${nx-7}" y2="${y}"/>`}
    const cls=i===0?'cur':E2.type==='build'?(E2.status==='failed'?'bad':E2.status==='running'?'run':''):'';
    const lab=E2.type==='page'||E2.type==='note'?E2.title:E2.key;const short=lab.length>15?lab.slice(0,14)+'…':lab;
    const kind=i>=stops.length?'suggested':SRC[TYPE_SRC[E2.type]].label+(E2.type==='build'?' · '+E2.status:'');
    html+=`<g data-go="${hashOf(s)}" tabindex="0" role="link"><circle class="wp ${cls}" cx="${x}" cy="${y}" r="5"/>${i===0?`<circle class="ring" cx="${x}" cy="${y}" r="9"/>`:''}${E2.type==='build'&&E2.status==='failed'?`<circle class="wpdot" cx="${x+6}" cy="${y-6}" r="2.2"/>`:''}<text class="${i===0?'cur':''}" x="${x}" y="${y+22}" text-anchor="middle">${esc(short)}</text><text class="lab" x="${x}" y="${y+38}" text-anchor="middle">${esc(kind)}</text></g>`});
  return html+'</svg></div>';
}

function startChain(kind,id){
  const e=E[id];if(!e)return;S.cursor=0;
  const lab=e.key||e.title;
  const defs={comment:{l:'Comment',ph:'Comment text… ↵ posts to '+lab},status:{l:'Change status',ph:'Pick a status ↑↓ ↵'},link:{l:'Link to…',ph:'Search a place to link with '+lab+'…'},prcomment:{l:'Request changes',ph:'What should change? ↵ posts the review'},newbranch:{l:'New branch',ph:'Branch name, e.g. feature/PAY-240-…'}};
  S.chain=[{l:lab,icon:glyph(e.type),id},{kind,l:defs[kind].l,ph:defs[kind].ph,id}];
  S.param='';const inp=$('#q');inp.value='';render();inp.focus();
}
function renderChainDetail(D){
  const c=S.chain[S.chain.length-1];const e=E[c.id];const lab=e.key||e.title;
  const crumb=`<div class="eyebrow" style="padding:0 0 2px">chain<span class="hint">${esc(S.chain.map(s=>s.l).join(' › '))}</span></div>`;
  if(c.kind==='status'){
    const opts=['To Do','In Progress','In Review','Done'];
    D.innerHTML=`<div class="doc">${crumb}<h1>${esc(lab)} › Change status</h1><p class="lead">Current: <b>${e.status}</b>. Choose the new status; the change is written to Jira on the next sync.</p><div class="links">${opts.map((o,i)=>`<div class="lnk${i===S.cursor?' confirmed':''}" data-setstatus="${o}" tabindex="0"><span class="src">${o===e.status?'now':''}</span><div class="n"><span class="s">${o}</span></div><span class="m">${o===e.status?'current':'↵'}</span></div>`).join('')}</div></div>`;return}
  if(c.kind==='link'){
    const res=S.param?searchResults(S.param).filter(r=>r.id!==e.id).slice(0,8):[];
    D.innerHTML=`<div class="doc">${crumb}<h1>${esc(lab)} › Link to…</h1><p class="lead">Type in the box to search every source; ↵ confirms the route from ${esc(lab)}.</p>
    ${S.param?(res.length?`<div class="links">${res.map((r,i)=>`<div class="lnk${i===S.cursor?' confirmed':''}" data-linkto="${r.id}" tabindex="0">${srcLab(r.type)}<div class="n"><span class="k">${esc(r.type==='page'||r.type==='note'?'':r.key)}</span><span class="s">${esc(r.title)}</span></div><span class="m">↵</span></div>`).join('')}</div>`:'<p class="faint">No match.</p>'):'<p class="faint">Suggestions: <span class="mono">#1188</span>, <span class="mono">Payments architecture overview</span>, <span class="mono">OPS-77</span></p>'}</div>`;return}
  D.innerHTML=`<div class="doc">${crumb}<h1>${esc(lab)} › ${esc(c.l)}</h1><p class="lead">${c.kind==='comment'?'Your text goes to Jira as a comment by Mara Lindqvist.':c.kind==='prcomment'?'Posts a review with status “changes requested” on '+esc(lab)+'.':'Creates the branch from main in '+esc(e.key)+' and checks it out locally.'}</p>
  <div class="note-box mono" style="min-height:44px;white-space:pre-wrap">${esc(S.param)||'<span class="faint">…</span>'}</div><p class="faint">↵ to submit · esc to go back one step</p></div>`;
}
function submitChain(){
  const c=S.chain[S.chain.length-1];const e=E[c.id];const v=S.param.trim();
  if(c.kind==='comment'||c.kind==='prcomment'){if(!v)return;e.comments.push({who:'mara',t:'today '+NOW,b:v,fresh:1});toast(`Comment posted on <span class="k">${esc(e.key)}</span>`,'gold');finishChain(c.id);return}
  if(c.kind==='status'){const o=$('#detail .lnk.confirmed');if(o)setStatus(e.id,o.dataset.setstatus);return}
  if(c.kind==='link'){const o=$('#detail .lnk.confirmed');if(o)linkTo(e.id,o.dataset.linkto);return}
  if(c.kind==='newbranch'){if(!v)return;toast(`Created and checked out <span class="k">${esc(v)}</span> in ${esc(e.key)}`,'gold');finishChain(c.id);return}
}
function finishChain(id){S.chain=[];S.param='';$('#q').value='';go(hashOf(id));}
function setStatus(id,st){const e=E[id];const old=e.status;e.status=st;e.updated='today '+NOW;
  toast(`<span class="k">${e.key}</span> ${old} → ${st}`,'gold',()=>{e.status=old;toast(`<span class="k">${e.key}</span> back to ${old}`);render()});
  if(S.chain.length)finishChain(id);else render()}
function linkTo(id,other){const a=E[id],b=E[other];if(!a.links.includes(other))a.links.push(other);if(!b.links.includes(id))b.links.push(id);S.justDrew=other;toast(`Route confirmed: ${esc(a.key||a.title)} ↔ ${esc(b.key||b.title)}`);if(S.chain.length)finishChain(id);else render()}
function confirmSug(sid){const s=S.suggestions.find(x=>x.id===sid);s.state='confirmed';linkTo(s.from,s.to)}
function dismissSug(sid){const s=S.suggestions.find(x=>x.id===sid);s.state='dismissed';
  toast('Suggested route dismissed','',()=>{s.state='open';render()});render()}

function inboxAct(id,a){
  const it=S.inbox.find(i=>i.id===id)||S.snoozed.find(i=>i.id===id);if(!it)return;
  const remove=()=>{S.inbox=S.inbox.filter(i=>i.id!==id);updateCounts()};
  switch(a){
    case 'Done':{const i=S.inbox.indexOf(it);remove();toast('Marked done — it leaves the inbox','',()=>{S.inbox.splice(i,0,it);updateCounts();render()});render();break}
    case 'Snooze':remove();S.snoozed.push({id,t:'returns Monday 08:00',text:it.text.replace(/<[^>]+>/g,'')});toast('Snoozed until Monday 08:00');render();break;
    case 'Unsnooze':S.snoozed=S.snoozed.filter(i=>i.id!==id);S.inbox.unshift({id,t:'today '+NOW,who:null,text:it.text,ent:null,acts:['Open Jira source','Done']});updateCounts();render();break;
    case 'Review':remove();go('#/pr/144');toast('Review started on <span class="k">PR #144</span>');break;
    case 'Reply':S.sel=id;S.mode='inbox';render();const c=$('#cmtIn');if(c){c.focus();c.placeholder='Reply to '+(it.who?PEOPLE[it.who].n.split(' ')[0]:'')+'…'}break;

    case 'Open PR':go('#/pr/142');break;

    case 'Comment on PAY-231':remove();S.sel='ticket:PAY-231';S.mode='search';S.q='sepa retry';startChain('comment','ticket:PAY-231');$('#q').value='Test counts the initial try as attempt 0 — fixing the off-by-one.';S.param=$('#q').value;render();break;

}

function renderNotesList(L){

function currentCtxLabel(){const id=S.timer.ctx&&E[S.timer.ctx]?S.timer.ctx:null;return id?(E[id].key||E[id].title):S.timer.label}
function renderNoteEditor(D){const n=E[S.sel];if(!n){D.innerHTML='';return}D.innerHTML=`<div class="doc">${noteEditorHTML(n)}</div>`}
function renderBody(txt){return esc(txt).replace(/\[\[([^\]]+)\]\]/g,(m,k)=>{const id=resolveRef(k);return id?ent(id,'contenteditable="false"'):m})}
function resolveRef(k){k=k.trim();if(/^#\d+$/.test(k))return 'build:'+k.slice(1);if(/^PR #\d+$/i.test(k))return 'pr:'+k.replace(/\D/g,'');if(/^[A-Z]+-\d+$/.test(k))return 'ticket:'+k;const p=Object.values(E).find(e=>(e.type==='page'||e.type==='note')&&e.title===k);return p?p.id:null}

    case 'git':{
      if(p[1]==='pull'){S.gitResult=`<div class="okbox"><b>Pulled</b> — payout-service is already up to date at 312 commits on main.</div>`;toast('Pulled payout-service — already up to date');render();return}
      if(p[1]==='push'){S.gitResult=`<div class="okbox"><b>Pushed</b> — 3 commits from feature/PAY-231-sepa-retry to git.tidewater.internal.</div>`;toast('Pushed 3 commits to <span class="mono">feature/PAY-231-sepa-retry</span>','gold');render();return}
      if(p[1]==='clone'){const r=E['repo:'+p[2]];r.clone='~/code/'+p[2];S.gitResult=`<div class="okbox"><b>Cloned</b> ${esc(p[2])} to ~/code/${esc(p[2])}.</div>`;toast(`Cloned <span class="mono">${esc(p[2])}</span> to ~/code/${esc(p[2])}`,'gold');render();return}
      return}
    case 'ping':toast('Sent to Tomasz Wójcik on OPS-77: “Any ETA on the runbook? PAY-228 is waiting on it.”','gold');return;
    case 'approve':{const pr=E[rest];pr.approvals='1 of 2 (Mara)';pr.comments.push({who:'mara',t:'today '+NOW,b:'Approved — export matches the finance column order.',fresh:1});S.inbox=S.inbox.filter(i=>i.id!=='i1');updateCounts();toast('Approved <span class="k">PR #144</span>','gold');render();return}
    case 'stoplog':stopTimer();return;
    case 'newnote':newNote();return;
    case 'switchctx':timerMenu($('#timerBtn'));return;
    case 'adhoc':openPopInput($('#timerBtn'),'ad-hoc label','What are you working on?',x=>startAdhoc(x));return;
    case 'dolog':doLog();return;
    case 'dfedit':{const c=$('#dfC');if(c){c.focus();c.setSelectionRange(c.value.length,c.value.length)}return}
    case 'dfdiscard':{toast('Draft discarded — the time stays tracked but unlogged');go('#/time/day');return}
    case 'logall':{S.week.forEach(d=>d[3]=d[2]);S.loggedMin+=S.unloggedMin;const n=S.unloggedMin;S.unloggedMin=0;S.day.forEach(l=>{if(l.how!=='gap')l.logged=true});toast(`Logged <b class="mono">${hm(n)}</b> across 5 days to Jira`,'gold');render();return}
    case 'assignlabel':assignLabel(rest);return;
    case 'digest2note':{const id='note:digest-'+Date.now();add({id,type:'note',key:'note',title:'Standup 2026-08-22',edited:'today '+NOW,ord:Date.now(),
      body:'Yesterday: merged [[PR #139]] fixing partial refund drift; [[PAY-228]] → In Review; retry loop for [[PAY-231]] (7be0e4).\n\nToday: backoff + jitter (a41f2c, c90d11); fix [[#1187]]; reply to Priya about the manual-review SLA; review [[PR #144]].\n\nBlockers: PAY-228 blocked by [[OPS-77]].',
      links:['pr:139','ticket:PAY-228','ticket:PAY-231','build:1187','pr:144','ticket:OPS-77']});
      toast('Digest saved as the note <b>Standup 2026-08-22</b>','gold');go(hashOf(id));return}
    case 'copydigest':toast('Digest copied as plain text');return;
    case 'saveproto':{S.protoSaved=true;const id='note:proto-'+Date.now();add({id,type:'note',key:'note',title:'Standup protocol 2026-08-22',edited:'today '+NOW,ord:Date.now(),
      body:'Attendees: Mara, Jonas, Priya, Tomasz, Lena.\n\nJonas: PR #144 CSV export ready for review.\nPriya: finance wants the manual-review SLA documented by Monday.\nTomasz: on-call handbook update in progress, ETA Tuesday ([[OPS-77]]).\nLena: finance complaints about dashboard latency → [[PAY-240]].\n\nActions: Mara → SLA on the design page ([[PAY-231]]); Tomasz → OPS-77 by Tuesday; Lena → PAY-240 acceptance criteria.',
      links:['ticket:OPS-77','ticket:PAY-240','ticket:PAY-231']});
      toast('Saved as the local note <b>Standup protocol 2026-08-22</b>','gold');render();return}
    case 'publishproto':{S.protoPublished=true;S.protoSaved=true;toast('Published to <span class="mono">ENG › Standup protocols › 2026-08-22</span>','gold');render();return}
    case 'runsw':runStartWork(rest);return;
    case 'swtimer':S.swTimer=S.swTimer===false;render();return;
    case 'trbranch':{openPopInput(document.querySelector('[data-act="trbranch"]'),'branch','Branch to build',x=>{S.trig.branch=x;toast('Build branch set to '+esc(x));render()});return}
    case 'trenv':S.trig.env=p[1];render();return;
    case 'trclean':S.trig.clean=!S.trig.clean;render();return;
    case 'dotrigger':doTrigger();return;
    case 'rerun':rerunBuild();return;
    case 'donewticket':doNewTicket();return;
    case 'ntagain':S.created=null;render();return;
    case 'donewpage':doNewPage();return;
    case 'npagain':S.created=null;render();return;
    case 'grprivate':S.repoPrivate=S.repoPrivate===false;render();return;
    case 'docreaterepo':{const n=($('#grName')&&$('#grName').value.trim())||'';
      if(!n){toast('The repository needs a name','bad');const f=$('#grName');if(f)f.focus();return}
      add({id:'repo:'+n,type:'repo',key:n,title:'empty · '+($('#grOrg').value),lang:'—',clone:null,branches:['main'],links:[]});
      S.gitResult=`<div class="okbox"><b>Created</b> <span class="mono">${esc(($('#grOrg')?$('#grOrg').value:'tidewater'))}/${esc(n)}</span>${S.repoPrivate!==false?' · private':''} with a README on main. <button class="btn sm" data-go="#/repo/${encodeURIComponent(n)}">Open ${esc(n)}</button></div>`;
      toast(`Created repository <span class="mono">${esc(n)}</span>`,'gold');render();return}
    case 'syncnow':{
      if(S.tcOk){toast('Synced 4 sources — 1,284 issues, 3,912 pages, 47 repos, 3 build configurations')}
      else toast('Synced 3 of 4 sources. <b>TeamCity failed: 401 Unauthorized.</b> Re-enter the password to include it. <button data-go="#/sources/teamcity">Open TeamCity</button>','bad');
      return}
    case 'syncone':{const s=SRC[rest];if(rest==='teamcity'&&!S.tcOk){toast('TeamCity sync failed again — 401 Unauthorized. The password below has to be re-entered.','bad')}else toast(`Synced ${esc(s.name)} — ${esc(s.count)}`);return}
    case 'fixtc':{
      const pw=$('#tcPass');if(!pw||!pw.value.trim()){toast('Type the new TeamCity password first','bad');if(pw)pw.focus();return}
      S.tcOk=true;SRC.teamcity.state='ok';SRC.teamcity.auth='user + password — re-entered today '+NOW;SRC.teamcity.synced='just now';SRC.teamcity.count='3 build configurations';
      const q=S.pending;setPending(0);
      if(S.rerunQueued){S.rerunQueued=false;
        add({id:'build:1189',type:'build',key:'#1189',title:'Payout_IntegrationTests',status:'running',branch:'feature/PAY-231-sepa-retry',when:'started today '+NOW,dur:'step 1/5 checkout',
          params:{branch:'feature/PAY-231-sepa-retry',env:'staging'},log:'[1/5] checkout feature/PAY-231-sepa-retry ... running',links:['ticket:PAY-231','pr:142']});
        E['ticket:PAY-231'].links.push('build:1189');E['pr:142'].checks.unshift({b:'build:1189',n:'Payout_IntegrationTests #1189',s:'running'});
        S.inbox=S.inbox.filter(i=>i.id!=='i3');updateCounts();
        S.trigResult=`<div class="okbox"><b>Queue flushed</b> — <span class="k">#1189</span> Payout_IntegrationTests is running on feature/PAY-231-sepa-retry. <button class="btn sm" data-go="#/build/1189">Open #1189</button></div>`;
      }
      toast(`TeamCity connected${q?' — flushed '+q+' queued write'+(q===1?'':'s')+', #1189 running':''}`,'gold');render();return}
    case 'tcskip':toast('TeamCity stays read-only — builds show their last synced state and triggers keep queueing');return;
    case 'replacepat':openPopInput(document.querySelector('[data-act="replacepat"]'),'jira PAT','Paste the new token',x=>{SRC.jira.auth='PAT — replaced today, expires 2027-08-22';SRC.confluence.auth='same PAT as Jira (replaced today)';S.jiraPat='12 months';toast('Jira and Confluence now use the new token','gold');render()});return;
    case 'snoozepat':{if(!S.snoozed.find(s=>s.id==='i7'))S.snoozed.push({id:'i7',t:'returns 2026-08-29',text:'Jira PAT expires in 12 days'});toast('Reminder set for 2026-08-29');render();return}
    case 'wznext':wizNext();return;
    case 'wztest':wizTest();return;
    case 'wzback':{S.wiz.step=Math.max(0,S.wiz.step-1);S.wiz.text='';$('#q').value='';render();return}
    case 'wzagain':{S.wiz={step:0,text:'',sched:'every 5 min'};S.cursor=0;render();return}
  }
}

/* =========================================================
   EVENTS
   ========================================================= */
function rowsEls(){return Array.prototype.slice.call(document.querySelectorAll('#list .row[data-i]'))}
function selEl(){return document.querySelector('#list .row.sel')||rowsEls()[S.cursor]}
function move(d){
  if(S.chain.length){
    const o=Array.prototype.slice.call(document.querySelectorAll('#detail .lnk[data-setstatus],#detail .lnk[data-linkto]'));
    if(o.length){S.cursor=Math.max(0,Math.min(o.length-1,S.cursor+d));render();return}
  }
  const r=rowsEls();if(!r.length)return;
  let i=r.findIndex(x=>x.classList.contains('sel'));if(i<0)i=Math.min(S.cursor,r.length-1);
  i=Math.max(0,Math.min(r.length-1,i+d));S.cursor=i;
  const el=r[i];
  if(el.dataset.id)S.sel=el.dataset.id;else if(el.dataset.inbox)S.sel=el.dataset.inbox;
  render();
  const e2=rowsEls()[i];if(e2)e2.scrollIntoView({block:'nearest'});
}
function openSelected(){
  if(S.chain.length){submitChain();return}
  if(S.wiz&&S.sub==='add'){wizNext();return}
  const el=selEl();if(!el)return;
  if(el.dataset.wiz){wizPick(el.dataset.wiz);return}
  if(el.dataset.act){doAct(el.dataset.act);return}
  if(el.dataset.id){go(hashOf(el.dataset.id));return}
  if(el.dataset.go){go(el.dataset.go);return}
  if(el.dataset.inbox){S.sel=el.dataset.inbox;render();return}
}
function focusBox(){
  if(S.mode!=='search'&&!S.chain.length&&!S.wiz)go('#/search');
  const i=$('#q');i.focus();i.select();
}
function setQuery(v){
  S.sel=null;S.cursor=0;S.sub=null;S.wiz=null;applyQuery(v);S.lastQ=v;
  $('#q').value=v;history.replaceState(null,'','#/search?q='+encodeURIComponent(v));render();$('#q').focus();
}
function postComment(id){
  const box=$('#cmtIn');if(!box)return;const v=box.value.trim();const e=E[id];
  if(!v){toast('Write the comment first — the box is empty','bad');box.focus();return}
  if(!e)return;
  e.comments.push({who:'mara',t:'today '+NOW,b:v,fresh:1});
  if(e.type==='ticket')e.updated='today '+NOW;
  const it=S.inbox.find(i=>i.ent===id&&i.acts.some(a=>a==='Reply'));
  if(it&&S.mode==='inbox'){S.inbox=S.inbox.filter(x=>x.id!==it.id);updateCounts()}
  toast(`Comment posted on <span class="k">${esc(e.key||e.title)}</span>`,'gold');render();
}
document.addEventListener('click',ev=>{
  const t=ev.target;
  const hit=s=>t.closest(s);
  const pi=hit('[data-popi]');
  if(pi){const it=POPITEMS[+pi.dataset.popi];closePop();if(it&&it.fn)it.fn();return}
  const popWasOpen=$('#pop').classList.contains('open');
  if(!hit('#pop')&&!hit('#picker'))closePop();
  if(hit('[data-closedlg]')||t.id==='ov'){ev.preventDefault();closeDlg();return}
  let el;
  if((el=hit('[data-ibx]'))){inboxAct(el.dataset.ibx,el.dataset.ibxact);return}
  if((el=hit('[data-confirm]'))){confirmSug(el.dataset.confirm);return}
  if((el=hit('[data-dismiss]'))){dismissSug(el.dataset.dismiss);return}
  if((el=hit('[data-comment]'))){postComment(el.dataset.comment);return}
  if((el=hit('[data-setstatus]'))){setStatus(S.chain.length?S.chain[0].id:S.sel,el.dataset.setstatus);return}
  if((el=hit('[data-linkto]'))){linkTo(S.chain.length?S.chain[0].id:S.sel,el.dataset.linkto);return}
  if((el=hit('[data-assignto]'))){const[a,id]=el.dataset.assignto.split('|');assignLeg(a,id);return}
  if((el=hit('[data-assign]'))){assignDialog(el.dataset.assign);return}
  if((el=hit('[data-keeplocal]'))){const l=legBy(el.dataset.keeplocal);l.keep=true;toast('“Staging DB configuration” stays in the local database — nothing sent to Jira');render();return}
  if((el=hit('[data-ai]'))){const a=ACTION_ITEMS[+el.dataset.ai];const key='PAY-'+(S.nextKey++);
    add({id:'ticket:'+key,type:'ticket',key,title:a.t.charAt(0).toUpperCase()+a.t.slice(1),itype:'Task',status:'To Do',pri:'Medium',who:a.who,updated:'today '+NOW,project:'PAY',est:'—',spentWeek:'0h',
      desc:'From the standup protocol of 2026-08-22.',comments:[],worklogs:[],links:a.ref?[a.ref]:[]});
    if(a.ref)E[a.ref].links.push('ticket:'+key);
    a.made=key;toast(`Created <span class="k">${key}</span> from the action item`,'gold');render();return}
  if((el=hit('[data-wizedit]'))){const m={type:0,url:1,auth:2,credentials:3,schedule:4};S.wiz.step=m[el.dataset.wizedit];S.wiz.text='';$('#q').value='';S.cursor=0;render();return}
  if((el=hit('[data-wiz]'))){wizPick(el.dataset.wiz);return}
  if((el=hit('[data-act]'))){ev.preventDefault();doAct(el.dataset.act);return}
  if((el=hit('[data-q]'))){ev.preventDefault();setQuery(el.dataset.q);return}
  if((el=hit('[data-mode]'))){const m=el.dataset.mode;S.cursor=0;S.wiz=null;
    go({search:'#/search',inbox:'#/inbox',notes:'#/notes',time:'#/time/day',standup:'#/standup',actions:'#/actions',sources:'#/sources'}[m]);return}
  if((el=hit('[data-go]'))){ev.preventDefault();const r=hit('.row[data-i]');if(r)S.cursor=+r.dataset.i;go(el.dataset.go);return}
  if((el=hit('[data-leg]'))||(el=hit('[data-legrow]'))){const a=el.dataset.leg||el.dataset.legrow;const l=legBy(a);
    if(l&&l.ent)go(hashOf(l.ent));else if(l&&l.how==='unattr')assignDialog(a);else if(l)toast(`${l.a}–${l.b} · ${esc(l.ctx)} · ${HOWLAB[l.how]}`);return}
  if((el=hit('[data-id]'))){const r=hit('.row[data-i]');if(r)S.cursor=+r.dataset.i;go(hashOf(el.dataset.id));return}
  if((el=hit('[data-inbox]'))){const r=hit('.row[data-i]');if(r)S.cursor=+r.dataset.i;S.sel=el.dataset.inbox;render();return}
  if(t.closest('#timerBtn')){if(!popWasOpen)timerMenu($('#timerBtn'));return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.matches&&t.matches('[data-status]')){setStatus(t.dataset.status,t.value);return}
  if(t.matches&&t.matches('[data-dfi]')){S.draft.items[+t.dataset.dfi][0]=t.checked?1:0;S.draft.text=null;render();return}
  if(t.id==='dfTgt'){S.draft.target=t.value.startsWith('—')?'— keep local, no ticket':t.value;render();return}
  if(t.id==='gRepo'){S.gitRepo=t.value;S.gitResult=null;render();return}
  if(t.id==='scSched'){toast('Schedule set to '+esc(t.value)+' — takes effect after the next run');return}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='dfC'){S.draft.text=t.value;return}
  if(t.id==='dfIv'){S.draft.iv=t.value;return}
  if(t.id==='wzUrl'&&S.wiz){S.wiz.url=t.value;return}
  if(t.dataset&&t.dataset.proto!==undefined){S.protoHTML=t.innerHTML;return}
  if(t.dataset&&t.dataset.noteed){syncNoteFromEditor(t);return}
});
document.addEventListener('focusout',ev=>{
  const t=ev.target;
  if(t&&t.dataset&&t.dataset.notetitle){const n=E[t.dataset.notetitle];
    if(n){const v=t.textContent.trim();if(v&&v!==n.title){n.title=v;n.edited='today '+NOW;render()}}}
},true);
document.addEventListener('keydown',ev=>{
  const mod=ev.metaKey||ev.ctrlKey;
  const ae=document.activeElement||document.body;
  const editable=/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)||ae.isContentEditable;
  if(mod&&(ev.key==='k'||ev.key==='K')){ev.preventDefault();focusBox();return}
  if(mod&&(ev.key==='t'||ev.key==='T')){ev.preventDefault();toggleTimer();return}
  if(mod&&ev.key==='Enter'){const b=document.querySelector('[data-comment]');if(b&&ae.id==='cmtIn'){ev.preventDefault();postComment(b.dataset.comment)}return}
  if(ev.key==='Escape'){
    if($('#picker')){ev.preventDefault();closePicker();return}
    if($('#pop').classList.contains('open')){ev.preventDefault();closePop();$('#q').focus();return}
    if($('#ov').classList.contains('open')){ev.preventDefault();closeDlg();return}
    if(S.chain.length){ev.preventDefault();S.chain=[];S.param='';$('#q').value='';render();$('#q').focus();return}
    if(S.wiz){ev.preventDefault();S.wiz=null;toast('Add source cancelled — nothing was saved');go('#/sources');return}
    if($('#q').value){ev.preventDefault();setQuery('');return}
    if(S.sel){ev.preventDefault();S.sel=null;go('#/search');return}
    $('#q').focus();return;
  }
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
    if(editable&&ae.id!=='q')return;
    ev.preventDefault();move(ev.key==='ArrowDown'?1:-1);return;
  }
  if(ev.key==='Enter'&&ae.id==='q'){ev.preventDefault();openSelected();return}
  if(ev.key==='Tab'&&ae.id==='q'&&!ev.shiftKey){
    const el=selEl();
    if(el&&el.dataset.id){ev.preventDefault();entityMenu(el,el.dataset.id)}
    return;
  }
});
$('#q').addEventListener('input',e=>{
  const v=e.target.value;
  if(S.chain.length){S.param=v;render();return}
  if(S.wiz&&S.sub==='add'){S.wiz.text=v;S.cursor=0;render();return}
  S.sel=null;S.cursor=0;applyQuery(v);S.lastQ=v;
  history.replaceState(null,'','#/search?q='+encodeURIComponent(v));
  render();
});
window.addEventListener('hashchange',route);

/* =========================================================
   INIT
   ========================================================= */
if(!location.hash||location.hash==='#')location.hash='#/search';
route();
updateStrip();
setInterval(tick,1000);
} catch(err){
  knobasFail('knobas init error: '+((err&&err.stack)||err));
}
</script>
