<!--
knobas mockup
paradigm: P1 Launcher
design: D2 Ledger
thesis: One box for everything — type, get mixed results from every source, act on them in a chain without leaving the box.
thesis: The box sits on ruled ledger paper: every result, link, worklog and inbox item is one dated line with a reference and a rubber-stamped source.
thesis: Rotated double-border source stamps (JIRA · WIKI · GIT · CI · NOTE) with a red FAILED stamp across failing builds; confirming a link stamps it in.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Tidewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;100,700;125,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA;--panel:#F4F5F2;--rule:#D7DEE8;--margin:#E0857C;
  --ink:#1B2230;--muted:#5F6B7A;--faint:#9AA5B4;--blue:#1F3A8A;--red:#C8372D;
  --sel:rgba(31,58,138,.08);--hov:rgba(31,58,138,.04);--row:34px;
  --ui:'Archivo',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --serif:'Source Serif 4','Iowan Old Style',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:13px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
#app{display:grid;grid-template-rows:30px 56px 1fr 24px;height:100vh;min-width:1100px}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

/* ---- persistent strip ---- */
.strip{display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:1px solid var(--rule);background:var(--panel);font-size:11.5px;color:var(--muted);-webkit-user-select:none;user-select:none}
.brand{font-stretch:125%;font-weight:700;letter-spacing:.2em;font-size:11px;color:var(--ink)}
.brand small{font-stretch:100%;font-weight:400;letter-spacing:.04em;color:var(--faint);margin-left:8px;text-transform:none}
.timer{display:flex;align-items:center;gap:7px;height:22px;padding:0 9px 0 7px;border:1px solid var(--blue);color:var(--blue);background:var(--paper);cursor:pointer;position:relative}
.timer.stopped{border-color:var(--faint);color:var(--muted)}
.timer b{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.timer b small{font-size:10px;color:var(--faint);font-weight:400}
.timer .ctx{font-weight:600;color:inherit}
.timer .ctxt{color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer kbd{font:10px var(--mono);color:var(--faint);margin-left:2px}
.srcs{display:flex;gap:14px;margin:0 auto}
.src{display:flex;align-items:center;gap:6px;color:var(--muted);background:none;border:0;padding:0;font-size:11.5px}
.src i{width:7px;height:7px;background:var(--blue);display:inline-block}
.src.bad{color:var(--red);font-weight:600}
.src.bad i{background:none;width:auto;height:auto;font-style:normal;font:700 11px var(--mono);line-height:1}
.src u{text-decoration:none;color:var(--faint);font-family:var(--mono);font-size:10.5px}
.pend{font:10.5px var(--mono);color:var(--faint)}
.pend.on{color:var(--red);font-weight:500}
.inboxct{display:flex;align-items:center;gap:5px;background:none;border:0;padding:0 4px;height:22px;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.inboxct em{font:500 11px var(--mono);font-style:normal;color:#fff;background:var(--red);padding:1px 5px;min-width:18px;text-align:center}
.inboxct em.zero{background:var(--faint)}
.gear{background:none;border:0;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:0 4px;height:22px}

/* ---- the box ---- */
.box{display:flex;align-items:center;border-bottom:1px solid var(--rule);position:relative;background:var(--paper);overflow:hidden}
.qmode{font:600 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--blue);border-left:3px solid var(--blue);padding:3px 0 3px 10px;margin-left:14px;min-width:76px;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:8px;padding-left:10px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden}
.crumb{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);padding:4px 8px;border:1px solid var(--blue);background:none;cursor:pointer;max-width:210px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb.ref{font:500 12px var(--mono);text-transform:none;letter-spacing:0}
.crumbs .sep{color:var(--faint);font-size:14px}
#q{flex:1 1 90px;min-width:90px;border:0;background:none;font:500 20px var(--ui);color:var(--ink);height:55px;outline:none;padding:0 12px}
#q::placeholder{color:var(--faint);font-weight:400}
.kbd{font:11px var(--mono);color:var(--faint);border:1px solid var(--rule);padding:1px 5px;white-space:nowrap}
.modebar{display:flex;align-items:stretch;height:55px;margin-left:6px;margin-right:8px;flex:0 0 auto}
.mode{font:600 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 9px;border:0;background:none;border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px}
.mode:hover{color:var(--ink)}
.mode.on{color:var(--blue);border-bottom-color:var(--blue)}
.mode .n{font:500 10.5px var(--mono);color:var(--red)}
.chips{display:flex;gap:6px;padding-left:8px;flex:0 1 auto;min-width:0;overflow:hidden}
.chip{font:500 11.5px var(--mono);color:var(--blue);border:1px solid var(--rule);background:var(--panel);padding:3px 7px;cursor:pointer;white-space:nowrap;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis}
.chip.shrink{flex:0 1 auto;min-width:64px;max-width:240px}
.chip b{color:var(--muted);font-weight:400;font-family:var(--ui);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:5px}

/* ---- body: two ruled sheets ---- */
.body{display:grid;grid-template-columns:minmax(470px,45%) 1fr;min-height:0}
.pane{position:relative;overflow:auto;min-height:0;scrollbar-width:thin}
.pane+.pane{border-left:1px solid var(--rule)}
.sheet{position:relative;min-height:100%;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);padding-bottom:68px}
.sheet::before{content:'';position:absolute;top:0;bottom:0;left:52px;width:1px;background:var(--margin);pointer-events:none}
.pane+.pane .sheet{background-image:none}
.det>*{border-bottom:1px solid var(--rule)}
.det .prose,.det .log,.det .errbox,.det .warnbox,.det .strip-day,.det .ed,.det .doc,.det .steps,.det .title-in,.det .empty,.det #week{border-bottom:0}
.det .step,.det .ck{border-bottom:1px solid var(--rule)}
.det .ln{border-bottom:1px solid var(--rule)}
.det .ln:focus-visible{outline-offset:-2px}
.hdr{display:grid;grid-template-columns:52px 1fr auto;align-items:center;height:34px}
.hdr span{padding-left:12px;font:600 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hdr .d{padding:0 8px 0 0;text-align:right;font:10.5px var(--mono);color:var(--faint);letter-spacing:0;text-transform:none}
.hdr .x{padding-right:14px;font:11px var(--ui);letter-spacing:.04em;text-transform:none;color:var(--faint);display:flex;gap:8px;align-items:center}
.cols{display:grid;grid-template-columns:52px 96px 1fr 150px 72px;height:34px;align-items:center;color:var(--faint)}
.cols span{font:600 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;padding-left:12px}
.cols span:first-child{text-align:right;padding:0 8px 0 0}
.ln{display:grid;grid-template-columns:52px 96px 1fr auto 72px;align-items:center;height:34px;cursor:pointer;position:relative;text-align:left;width:100%;border:0;background:none;color:var(--ink)}
.ln:hover{background:var(--hov)}
.ln.sel{background:var(--sel)}
.ln.sel::after{content:'';position:absolute;left:51px;top:0;bottom:0;width:3px;background:var(--blue)}
.ln .d{font:11px var(--mono);color:var(--faint);text-align:right;padding-right:9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .r{font:12px var(--mono);color:var(--blue);padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px 0 4px;font-size:13px}
.ln .t i{font-style:normal;color:var(--muted)}
.ln .t .q{font-family:var(--serif);font-style:italic;color:var(--muted)}
.ln .s{font-size:11px;color:var(--muted);white-space:nowrap;padding-right:10px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.ln .s .ago{color:var(--faint);font-family:var(--mono);font-size:10.5px}
.ln .s .fail{color:var(--red);font-weight:600}
.ln .st{display:flex;justify-content:center;align-items:center}
.ln.dim{color:var(--faint)}
.ln.dim .r{color:var(--faint)}
.ln .acts{grid-column:4/6;justify-content:flex-end;padding-right:10px}
.ln.two{grid-template-columns:52px 1fr auto}
.ln.inb{grid-template-columns:52px 1fr auto 72px}
.ia{font:600 10px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-bottom:1px solid transparent;padding:1px 0;margin-left:14px;white-space:nowrap}
.ia:hover{color:var(--blue);border-bottom-color:var(--blue)}
.ia.p{color:var(--blue)}
.ln .more{display:none;gap:0}
.ln:hover .more,.ln:focus-within .more,.ln.sel .more{display:inline-flex}
.ln.two .t{padding-left:12px}
.ln.act .r{color:var(--muted)}
.ln.act .t{color:var(--blue)}
.ln.act .t::before{content:'› ';color:var(--faint)}
.empty{padding:10px 0 10px 64px;color:var(--muted);font-family:var(--serif);font-size:14px;line-height:22px;background:var(--paper)}
.det .empty{padding-left:0;max-width:60ch}
.empty b{color:var(--ink);font-weight:600}
.sub{font:11px var(--ui);color:var(--faint);padding-left:64px;line-height:34px}
.sub b{font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:10px}

/* filters */
.filters{display:flex;align-items:center;gap:10px;height:34px;padding-left:64px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.filters label{display:flex;align-items:center;gap:4px;cursor:pointer}
.filters select{border:0;border-bottom:1px solid var(--rule);background:none;font:500 11px var(--ui);color:var(--blue);padding:2px 0;cursor:pointer}
.filters input[type=checkbox]{accent-color:var(--blue);margin:0}
.filters .x{font:600 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.filters .xs{color:var(--red);font-weight:600;letter-spacing:.04em;font-size:10.5px}

/* stamps */
.stamp{display:inline-block;font:600 9px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--blue);padding:3px 5px 2px;border:1px solid currentColor;outline:1px solid currentColor;outline-offset:1.5px;opacity:.85;mix-blend-mode:multiply;transform:rotate(var(--rot,-2deg));white-space:nowrap;pointer-events:none}
.stamp.red{color:var(--red)}
.stamp.big{font-size:11px;padding:4px 7px 3px}
.stamp.in{animation:stampin .2s cubic-bezier(.2,1.4,.5,1) both}
@keyframes stampin{from{transform:rotate(var(--rot,-2deg)) scale(1.9);opacity:0}to{transform:rotate(var(--rot,-2deg)) scale(1);opacity:.85}}
.run{display:inline-block;width:12px;height:12px;vertical-align:-2px}
.run circle{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:2.4 1.7;stroke-linecap:round}
.run.spin{animation:spin 2.6s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{color:var(--blue);font-weight:700}

/* detail pane */
.det{padding:0 28px 40px 64px;position:relative}
.det .ln{margin-left:-64px;width:calc(100% + 64px)}
.det .hdr{margin-left:-64px}
.det .cols{margin-left:-64px}
.kh{display:flex;align-items:center;gap:12px;height:34px}
.kh .key{font:500 14px var(--mono);color:var(--blue)}
.kh .type{font:600 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kh .syn{margin-left:auto;font:10.5px var(--mono);color:var(--faint)}
.det h1{font:600 19px/26px var(--ui);letter-spacing:-.01em;margin:0 0 0;height:34px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:0 20px;font-size:11.5px;color:var(--muted);min-height:34px;line-height:34px}
.meta b{font-weight:500;color:var(--ink)}
.meta .k{font:600 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:5px}
.meta .mono{font-family:var(--mono);font-size:11.5px}
.inl{border:0;border-bottom:1px solid var(--rule);background:none;font:500 12px var(--ui);color:var(--blue);padding:2px 0;cursor:pointer}
.inl:focus-visible{outline:none;border-bottom:2px solid var(--blue)}
.prose{font:14.5px/22px var(--serif);background:var(--paper);padding:6px 0 6px;max-width:66ch;position:relative;z-index:1}
.prose p+p{margin-top:8px}
.prose h3{font:600 14.5px/22px var(--serif);margin-top:10px}
.prose code{font:12.5px var(--mono);color:var(--blue)}
.prose em{color:var(--muted)}
.prose .chipe{font:500 12px var(--mono);color:var(--blue);border:1px solid var(--rule);background:var(--panel);padding:1px 5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.prose .chipe:hover{border-color:var(--blue)}
.sec{display:flex;align-items:center;height:34px;font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);gap:10px}
.sec .n{font:500 11px var(--mono);color:var(--faint);letter-spacing:0}
.sec .right{margin-left:auto;display:flex;gap:6px}
.actrow{display:flex;gap:6px;flex-wrap:wrap;min-height:34px;align-items:center;margin-left:-64px;padding-left:64px;background:var(--paper)}
.btn{font:600 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;height:24px;padding:0 9px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--panel)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:#182e6e}
.btn.r{border-color:var(--red);color:var(--red)}
.btn.q{border-color:transparent;color:var(--blue);padding:0 5px}
.btn.q:hover{background:var(--hov)}
.btn.sm{height:20px;font-size:9.5px;padding:0 6px}
.btn:disabled{opacity:.45;cursor:default}
.btn kbd{font:10px var(--mono);color:inherit;opacity:.6;font-weight:400}
.btn.p kbd{color:#fff}
.cm{display:grid;grid-template-columns:52px 96px 1fr;min-height:34px;margin-left:-64px;align-items:start}
.cm .d{font:11px var(--mono);color:var(--faint);text-align:right;padding-right:9px;line-height:34px}
.cm .w{font:500 12px var(--ui);color:var(--ink);padding-left:12px;line-height:34px;white-space:nowrap}
.cm .x{font:14px/22px var(--serif);padding:6px 20px 6px 4px;background:var(--paper)}
.cm .x .stamp{margin-left:8px;vertical-align:1px}
.form{display:grid;grid-template-columns:52px 1fr;margin-left:-64px}
.form .d{text-align:right;padding-right:9px;font:600 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);line-height:34px}
.form .f{padding-left:12px;display:flex;align-items:center;min-height:34px;gap:10px}
.in{border:0;border-bottom:1px solid var(--rule);background:none;font:13px var(--ui);color:var(--ink);padding:4px 0;width:100%;outline:none;min-width:0}
.in:focus{border-bottom:2px solid var(--blue);padding-bottom:3px}
.in.mono{font:12px var(--mono)}
textarea.in{font:14px/22px var(--serif);resize:vertical;min-height:44px;line-height:22px;background-image:repeating-linear-gradient(to bottom,transparent 0 21px,var(--rule) 21px 22px);padding:0}
select.in{cursor:pointer;width:auto;color:var(--blue);font-weight:500}
.rule{height:1px;background:var(--rule)}
.steps{margin-left:-64px}
.step{display:grid;grid-template-columns:52px 28px 1fr auto;align-items:center;height:34px}
.step .d{font:11px var(--mono);color:var(--faint);text-align:right;padding-right:9px}
.step .i{padding-left:10px;color:var(--faint);font:12px var(--mono)}
.step.done .i{color:var(--blue);font-weight:700}
.step.run .i{color:var(--blue)}
.step .t{font-size:13px}
.step .t code{font:12px var(--mono);color:var(--blue)}
.step .s{font:10.5px var(--mono);color:var(--faint);padding-right:10px}
.step.done .s{color:var(--blue)}
.step .t label{display:flex;align-items:center;gap:6px;cursor:pointer}
.step input[type=checkbox]{accent-color:var(--blue)}
.log{font:11.5px/17px var(--mono);background:var(--panel);border-left:2px solid var(--red);padding:8px 12px;margin:8px 0;white-space:pre;overflow-x:auto;color:var(--ink)}
.log .bad{color:var(--red);font-weight:500}
.wl{display:grid;grid-template-columns:52px 96px 1fr 80px 80px;height:34px;align-items:center;margin-left:-64px;font-size:12.5px}
.wl .d{font:11px var(--mono);color:var(--faint);text-align:right;padding-right:9px}
.wl .r{font:12px var(--mono);color:var(--blue);padding-left:12px}
.wl .t{padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);font-size:13.5px}
.wl .h,.wl .tot{font:12px var(--mono);text-align:right;padding-right:14px;font-variant-numeric:tabular-nums}
.wl .tot{color:var(--muted);border-left:1px solid var(--rule);line-height:34px}
.wl.head span{font:600 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border:0}
.wl.head .h,.wl.head .tot{text-align:right}
.wl.sum .h,.wl.sum .tot{font-weight:500;color:var(--ink)}
.wl .t .stamp{margin-left:8px}
.wl .bad{color:var(--red)}

/* checkboxes list */
.ck{display:flex;align-items:center;gap:10px;height:34px;font-size:13px;cursor:pointer}
.ck input{accent-color:var(--blue);margin:0}
.ck code{font:12px var(--mono);color:var(--blue)}
.ck .d{font:11px var(--mono);color:var(--faint);margin-left:auto;padding-right:10px}

/* day strip */
.strip-day{margin:6px 0 0;background:var(--paper);padding:4px 0}
.strip-day svg{width:100%;height:86px;display:block}
.strip-day .lab{font:600 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;fill:var(--faint)}
.strip-day .tk{font:10px var(--mono);fill:var(--faint)}
.strip-day .bl{cursor:pointer}
.strip-day .bl:hover rect.b{stroke-width:2}
.legend{display:flex;gap:16px;height:34px;align-items:center;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;vertical-align:-1px;margin-right:5px;border:1px solid var(--blue)}
.legend i.pas{background:repeating-linear-gradient(135deg,transparent 0 2px,var(--blue) 2px 3px);opacity:.7}
.legend i.man{background:var(--blue)}
.legend i.un{border-color:var(--red);background:repeating-linear-gradient(135deg,transparent 0 2px,var(--red) 2px 3px)}
.legend i.lab{border-style:dashed}

/* notes editor */
.ed{font:15px/22px var(--serif);min-height:200px;outline:none;padding:6px 0;background:var(--paper);max-width:70ch;white-space:pre-wrap;position:relative;z-index:1}
.ed:focus{box-shadow:-12px 0 0 -10px var(--blue)}
.ed .chipe,.chipe{font:500 12px var(--mono);color:var(--blue);border:1px solid var(--rule);background:var(--panel);padding:1px 5px;cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none}
.ed .chipe:hover{border-color:var(--blue)}
.title-in{border:0;background:none;font:600 19px var(--ui);width:100%;height:34px;outline:none;padding:0;color:var(--ink)}
.title-in:focus{box-shadow:0 2px 0 var(--blue)}
.pop{position:absolute;z-index:20;background:var(--paper);border:1px solid var(--ink);box-shadow:4px 4px 0 rgba(27,34,48,.08);min-width:280px;max-width:420px}
.pop .ln{grid-template-columns:0 96px 1fr auto 0}
.pop .ln .d,.pop .ln .st{display:none}
.pop .ph{font:600 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:6px 12px 2px}
.pop .pin{margin:4px 12px 6px;width:calc(100% - 24px)}
.pop .pa{display:flex;gap:6px;padding:6px 12px 10px;flex-wrap:wrap}

/* standup */
.digest .ln{height:auto;min-height:34px;align-items:start}
.dl{display:grid;grid-template-columns:52px 1fr;min-height:34px;margin-left:0;align-items:start}
.dl .d{font:600 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:right;padding-right:9px;line-height:34px}
.dl .x{padding:6px 16px 6px 12px;font:14px/22px var(--serif);background:var(--paper);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
.dl .src{font:11px var(--mono);color:var(--blue);border:1px solid var(--rule);padding:0 5px;background:var(--panel);cursor:pointer;line-height:18px}
.dl .src:hover{border-color:var(--blue)}
.dl .src.ci{color:var(--red)}
.doc{font:15px/22px var(--serif);background:var(--paper);padding:4px 0;max-width:70ch;outline:none;position:relative;z-index:1}
.doc h2{font:600 15px/22px var(--serif);margin-top:12px}
.doc h2:first-child{margin-top:0}
.doc ul{padding-left:18px}
.doc li{margin:2px 0}
.doc .who{font:600 12px var(--ui);letter-spacing:.04em;color:var(--blue)}
.doc li .btn{margin-left:8px;vertical-align:1px}
.doc:focus{box-shadow:-12px 0 0 -10px var(--blue)}
.pubstate{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;min-height:34px}
.pubstate .stamp{margin-left:4px}
.pubstate code{font:11.5px var(--mono);color:var(--blue)}

/* sources */
.caps{display:flex;gap:10px;font:11px var(--mono);color:var(--muted)}
.caps i{font-style:normal;color:var(--blue);font-weight:700}
.caps .no{color:var(--faint)}
.errbox{background:var(--panel);border-left:2px solid var(--red);padding:8px 12px;margin:6px 0;font-size:12.5px;line-height:18px;max-width:66ch}
.errbox b{color:var(--red)}
.warnbox{background:var(--panel);border-left:2px solid var(--blue);padding:8px 12px;margin:6px 0;font-size:12.5px;line-height:18px;max-width:66ch}

/* toasts */
.toasts{position:fixed;right:16px;bottom:34px;display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none}
.toast{background:var(--paper);border:1px solid var(--ink);box-shadow:4px 4px 0 rgba(27,34,48,.08);padding:8px 12px 8px 12px;font-size:12.5px;display:flex;gap:12px;align-items:center;min-width:260px;max-width:460px;border-left:3px solid var(--blue);animation:tin .18s ease-out}
.toast.red{border-left-color:var(--red)}
.toast .stamp{margin-right:4px}
.toast small{display:block;color:var(--muted);font-size:11px}
@keyframes tin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* status bar */
.status{display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--rule);background:var(--panel);font:10.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden}
.status .keys{margin-left:auto;display:flex;gap:12px}
.status .keys b{font-weight:500;color:var(--muted)}
.status .err{color:var(--red)}
#jserr{display:none;color:var(--red)}

@media (prefers-reduced-motion:reduce){
  .stamp.in,.toast,.run.spin{animation:none !important}
}
@media (max-width:1240px){
  .timer .ctxt{display:none}
  .brand small{display:none}
  .src:not(.bad) u{display:none}
}

function inlineActs(i,acts){const cur=inboxActive()===i.id;
  const all=acts.concat(acts.includes('Done')?[]:['Done']);
  const rest=all.slice(1).map(a=>`<button class="ia" data-act="inbox:${i.id}:${h(a)}" tabindex="${cur?0:-1}">${h(a)}</button>`).join('');
  return`<span class="more">${rest}</span><button class="ia p" data-act="inbox:${i.id}:${h(all[0])}" tabindex="${cur?0:-1}">${h(all[0])}</button>`;}
function inboxActive(){return S.route.split('/')[2]||(INBOX[0]&&INBOX[0].id)||(SNOOZED[0]&&SNOOZED[0].id);}
function inboxList(){const A=inboxActive();let x=hdr('Inbox',`<span>${INBOX.length} open · newest first</span>`);
  x+=INBOX.map(i=>`<div class="ln inb${A===i.id?' sel':''}" data-keep="${A===i.id?1:''}" data-go="#/inbox/${i.id}" tabindex="0"><span class="d">${short(i.when)}</span><span class="t">${i.html}${i.note?` <i>— ${i.note}</i>`:''}</span><span class="s">${inlineActs(i,i.acts)}</span><span class="st">${stamp(i.src,i.id,i.red)}</span></div>`).join('');
  if(!INBOX.length)x+=`<div class="empty">Inbox is empty. New mentions, review requests, failed builds and assignments land here.</div>`;
  x+=hdr('Snoozed',`<span>${SNOOZED.length}</span>`);
  x+=SNOOZED.map(i=>`<div class="ln inb dim${A===i.id?' sel':''}" data-keep="${A===i.id?1:''}" data-go="#/inbox/${i.id}" tabindex="0"><span class="d">${i.returns.slice(5)}</span><span class="t">${i.html} <i>— returns ${i.returns}</i></span><span class="s">${inlineActs(i,['Unsnooze'])}</span><span class="st">${stamp(i.src,i.id)}</span></div>`).join('');
  return x;}

function timeList(){let x=hdr('Today · Friday 2026-08-22',`<span>blocks 08:30–${NOW}</span>`);
  x+=`<div class="cols"><span>start</span><span>until</span><span>context</span><span>how</span><span></span></div>`;
  for(const b of BLOCKS){const d=mins(b.e)-mins(b.s);const how={passive:'passive',gap:'gap',label:'manual label',timer:'manual timer'}[b.how];
    const st=b.un?stamp('ASSIGN',b.id,true):b.how==='label'?(b.local?stamp('LOCAL',b.id):stamp('LABEL',b.id)):b.how==='timer'?stamp('TIMER',b.id):b.how==='gap'?'':b.logged?stamp('LOGGED',b.id):'';
    x+=`<div class="ln${b.un?' ':''}${b.how==='gap'?' dim':''}" data-block="${b.id}" tabindex="0" style="${b.un?'background:rgba(200,55,45,.06)':''}"><span class="d">${b.s}</span><span class="r" style="color:var(--faint)">${b.e}</span><span class="t">${b.un?'<span class="fail">unattributed</span> — app open, no entity':h(b.ctx)}${b.ent&&!b.un?` <i>${h(E[b.ent]?E[b.ent].title:'')}</i>`:''}</span><span class="s">${b.un?`<button class="btn r sm" data-act="assign:${b.id}">Assign…</button>`:b.how==='label'&&!b.local&&!b.logged?`<button class="btn sm" data-act="logto:${b.id}">Log to a ticket…</button><button class="btn q sm" data-act="keeplocal:${b.id}">Keep local</button>`:`${fmt(d)} · ${how}`}</span><span class="st">${st}</span></div>`;}
  const tracked=BLOCKS.filter(b=>b.how!=='gap').reduce((a,b)=>a+mins(b.e)-mins(b.s),0);
  x+=`<div class="ln two dim"><span class="d"></span><span class="t">5h 28m tracked today · ${S.loggedToday?fmt(S.loggedToday)+' logged':'nothing logged yet'} · nothing keyed to git branches</span><span class="s"></span></div>`;
  x+=hdr('Worklogs','logged to Jira');
  x+=`<div class="wl head"><span class="d"></span><span class="r">ticket</span><span class="t">comment</span><span class="h">time</span><span class="tot">total</span></div>`;
  let tot=0;const wls=[];for(const id of ['PAY-228','PAY-231'])for(const w of E[id].worklogs)wls.push({id,...w});
  wls.sort((a,b)=>(a.when==='today')-(b.when==='today'));
  for(const w of wls){tot+=w.min;x+=`<div class="wl"><span class="d">${w.when==='today'?'today':'yest'}</span><span class="r">${w.id}</span><span class="t">${h(w.text)}${w.fresh?stamp('LOGGED',w.text,false,true):''}</span><span class="h">${fmt(w.min)}</span><span class="tot">${fmt(tot)}</span></div>`;}
  x+=actrow(S.timer.running?'Stop timer and log PAY-231 (⌘T)':'Start timer (⌘T)',null,'timer-toggle')+actrow('Week timesheet','#/time/week');return x;}

function notesList(){const ids=Object.keys(E).filter(id=>E[id].type==='note');const A=idOf(S.route)||'note:sepa-retry-investigation';
  let x=hdr('Notes',`<span>${ids.length} local · markdown</span><button class="btn sm" data-act="new-note">New note</button>`);
  x+=ids.map(id=>row(id,{sel:A===id})).join('');
  x+=`<div class="sub"><b>links</b> type [[ in the editor to link a ticket, PR, build, page or note</div>`;return x;}

function sourcesList(){const A=S.route.split('/')[2]||'teamcity';let x=hdr('Sources',`<span>4 configured · sync every 5 min</span><button class="btn sm" data-go="#/sources/add">Add source</button>`);
  x+=`<div class="cols"><span>sync</span><span>type</span><span>source</span><span>state</span><span></span></div>`;
  for(const s of Object.values(SRC)){const bad=s.state==='err';x+=`<button class="ln${A===s.id?' sel':''}"${A===s.id?' data-keep="1"':''} data-go="#/source/${s.id}"><span class="d">${bad?'✖':s.synced+'m'}</span><span class="r">${h(s.type.split(' ')[0])}</span><span class="t">${h(s.name)} <i>${h(s.count)}</i></span><span class="s">${bad?`<span class="fail">${s.err}</span>`:s.id==='jira'?'<span class="fail">PAT expires in 12 days</span>':'synced '+s.synced+' min ago'}</span><span class="st">${stamp(s.stamp,s.id,bad)}</span></button>`;}
  x+=hdr('Local','this machine');
  x+=`<div class="ln two"><span class="d">db</span><span class="t">Postgres <b>knobas</b> · 212 MB · full-text index up to date</span><span class="s"><button class="btn sm" data-act="sync-now">Sync now</button></span></div>`;
  x+=`<div class="ln two"><span class="d">queue</span><span class="t">Pending writes: <b>${S.pending}</b>${S.pending?` — ${h(S.pendingWhat)}`:''}</span><span class="s">${S.pending?'<span class="fail">waits for TeamCity</span>':''}</span></div>`;
  return x;}

function digestList(){let x=hdr('Standup digest','generated from yesterday + today · click a ref to see its source');x+='<div class="digest">';
  for(const g of DIGEST){x+=hdr(g.h,g.h==='Blockers'?'<span class="fail">1</span>':'');
    for(const it of g.items)x+=`<div class="dl"><span class="d"></span><span class="x"><span>${h(it.t)}</span>${it.src.map(([id,l,why,cls])=>`<button class="src${cls?' '+cls:''}" data-go="${route(id)}" title="${h(why)}">${h(l)}</button>`).join('')}</span></div>`;}
  x+='</div>'+hdr('Protocol','right: today’s minutes, editable');return x;}

function renderLeft(){let x='';
  if(S.chain)x=chainList();
  else switch(S.mode){
    case'search':{const m=S.route.match(/list=(\w+)/);x=m?listResults(m[1]):S.q.trim()?results():home();break;}
    case'actions':x=cmdList();break;case'inbox':x=inboxList();break;case'time':x=timeList();break;
    case'notes':x=notesList();break;case'sources':x=sourcesList();break;case'standup':x=digestList();break;}
  const L=$('#left');L.innerHTML=`<div class="sheet" role="listbox">${x}</div>`;
  S.items=[...L.querySelectorAll('.ln[data-go],.ln[data-act],.ln[data-block]')];
  if(S.sel>=S.items.length)S.sel=0;markSel(false);}
function markSel(scroll=true){const kbd=(S.mode==='search'||S.mode==='actions'||!!S.chain);
  S.items.forEach((el,i)=>{if(el.dataset.keep)return;el.classList.toggle('sel',i===S.sel&&kbd);});
  const el=S.items[S.sel];if(el&&scroll)el.scrollIntoView({block:'nearest'});}

/* =========================================================
   RIGHT PANE — entity detail and mode documents
   ========================================================= */
const sec=(l,n,right='')=>`<div class="sec">${l}${n!=null?`<span class="n">${n}</span>`:''}${right?`<span class="right">${right}</span>`:''}</div>`;
const kh=(key,st,type,agoMin)=>`<div class="kh"><span class="key">${h(key)}</span>${st}<span class="type">${type}</span><span class="syn">${agoMin?'synced '+agoMin+' min ago':'local'}</span></div>`;
function comments(list,fresh){return list.map((c,i)=>`<div class="cm"><span class="d">${short(c.when)}</span><span class="w">${h(who(c.who))}</span><span class="x">${c.mention?'<b style="color:var(--blue)">@Mara</b>'+h(c.text.replace('@Mara','')):h(c.text)}${c.fresh?stamp('POSTED','c'+i,false,true):''}</span></div>`).join('');}
function commentForm(id,label='Post comment',ph='Add a comment…',pre=''){return`<div class="form"><span class="d">you</span><span class="f"><textarea class="in" id="cmt-${h(id)}" rows="2" placeholder="${h(ph)}">${h(pre)}</textarea></span></div><div class="actrow"><button class="btn p" data-act="comment:${h(id)}">${label}</button><span style="color:var(--faint);font-size:11px">posts to ${SRCOF[E[id].type]==='jira'?'Tidewater Jira':SRCOF[E[id].type]==='gitea'?'git.tidewater.internal':'Tidewater Wiki'} · appears here immediately</span></div>`;}
function linkedRows(id){const ids=linked(id).filter(x=>E[x].type!=='person');let x=sec('Linked items',ids.length,`<button class="btn sm" data-act="chain:${h(id)}:link">Link to…</button>`);
  x+=ids.map(x2=>row(x2,{extra:S.justLinked===x2?stamp('LINKED',x2,false,true):''})).join('');return x;}
function suggRows(id,all){const list=all?SUGG:SUGG.filter(s=>s.a===id||s.b===id);if(!list.length&&!all)return'';
  let x=sec('Suggested links',list.length,`<span style="font:11px var(--ui);letter-spacing:0;text-transform:none;color:var(--faint)">auto-detected, unconfirmed</span>`);
  x+=list.map(s=>{const a=V(s.a),b=V(s.b);return`<div class="ln" style="cursor:default"><span class="d">sug</span><span class="r">${h(a.ref)}</span><span class="t">→ <b style="font:12px var(--mono);color:var(--blue)">${h(b.ref)}</b> ${h(b.type==='page'||b.type==='repo'?b.title:'')} <i>— ${s.why}</i></span><span class="s"><button class="btn sm p" data-act="confirm:${s.id}">Confirm</button><button class="btn sm q" data-act="dismiss:${s.id}">Dismiss</button></span><span class="st"></span></div>`;}).join('');
  if(!list.length)x+=`<div class="empty">No open suggestions. New ones appear after each sync when a key, hash or title shows up in another source.</div>`;return x;}
function worklogRows(id){const e=E[id];let tot=0;let x=`<div class="wl head"><span class="d"></span><span class="r">when</span><span class="t">comment</span><span class="h">time</span><span class="tot">total</span></div>`;
  for(const w of e.worklogs){tot+=w.min;x+=`<div class="wl"><span class="d"></span><span class="r">${w.when==='today'?'today':'yest'}</span><span class="t">${h(w.text)}${w.fresh?stamp('LOGGED','w'+w.min,false,true):''}</span><span class="h">${fmt(w.min)}</span><span class="tot">${fmt(tot)}</span></div>`;}
  if(!e.worklogs.length)x+=`<div class="wl dim"><span class="d"></span><span class="r"></span><span class="t" style="color:var(--faint)">nothing logged yet</span><span class="h"></span><span class="tot"></span></div>`;return x;}

function ticketDetail(id){const e=E[id];const timerHere=S.timer.running&&S.timer.ctx===id;
  let x=kh(e.key,stamp('JIRA',id),e.itype,SRC.jira.synced)+`<h1>${h(e.title)}</h1>`;
  x+=`<div class="meta"><span><span class="k">Status</span><select class="inl" data-status="${id}">${['To Do','In Progress','In Review','Done'].map(s=>`<option${s===e.status?' selected':''}>${s}</option>`).join('')}</select></span>
  <span><span class="k">Priority</span><b>${e.pri}</b></span><span><span class="k">Assignee</span><b>${h(who(e.asg))}</b>${e.asgNote?` <span style="color:var(--faint)">(${e.asgNote})</span>`:''}</span>${e.epic?`<span><span class="k">Epic</span><a href="#/ticket/${e.epic}" class="mono">${e.epic}</a> ${h(E[e.epic].title)}</span>`:''}<span><span class="k">Updated</span><span class="mono">${e.upd}</span></span>${e.blockedBy?`<span><span class="k" style="color:var(--red)">Blocked by</span><a href="#/ticket/${e.blockedBy}" class="mono">${e.blockedBy}</a> ${h(E[e.blockedBy].title)}</span>`:''}</div>`;
  x+=`<div class="actrow"><button class="btn" data-act="chain:${id}:status">Change status</button><button class="btn" data-act="chain:${id}:comment">Comment</button><button class="btn" data-act="chain:${id}:link">Link to…</button><button class="btn${timerHere?' r':''}" data-act="timer-on:${id}">${timerHere?'Stop timer':'Start timer'}</button>${e.status==='To Do'?`<button class="btn p" data-go="#/action/start-work/${id}">Start work</button>`:''}<button class="btn q" data-act="open-ext:${id}">Open in Jira ↗</button><span class="kbd" style="margin-left:auto">Tab → actions</span></div>`;
  x+=sec('Description')+`<div class="prose"><p>${e.desc}</p></div>`;
  x+=sec('Comments',e.comments.length)+comments(e.comments)+commentForm(id);
  x+=sec('Time',null,`<span style="font:11px var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)">${e.est?'estimate '+e.est+' · ':''}${e.spent?'spent this week '+e.spent+' · ':''}${(e.worklogs.some(w=>w.when==='today'))?'logged today':'nothing logged today'}</span>`)+worklogRows(id);
  if(timerHere)x+=`<div class="actrow"><span style="font-size:12px;color:var(--blue)">${RUN} timer running here since ${S.timer.since} — ${hm(Math.floor(S.timer.sec/60))} elapsed</span><button class="btn sm" data-act="timer-toggle">Stop and log</button></div>`;
  x+=linkedRows(id);x+=suggRows(id,id==='PAY-231');return x;}

function prDetail(id){const e=E[id];const need=e.n===144?1:2;const given=e.approvals.filter(a=>a.ok).length;
  let x=kh('PR #'+e.n,stamp('GIT',id),e.state,SRC.gitea.synced)+`<h1>${h(e.title)}</h1>`;
  x+=`<div class="meta"><span><span class="k">Repo</span><a href="${route(e.repo)}" class="mono">${h(E[e.repo].title)}</a></span><span><span class="k">Branch</span><span class="mono">${h(e.from)} → ${e.to}</span></span><span><span class="k">By</span><b>${h(who(e.who))}</b></span><span><span class="k">Opened</span><span class="mono">${e.opened}</span></span><span><span class="k">Approvals</span><b>${given}/${need}</b></span></div>`;
  x+=`<div class="actrow">${e.state==='open'?`<button class="btn" data-act="chain:${id}:comment">Reply</button>`:''}${e.who!=='mara'&&e.state==='open'&&!e.approvedByMe?`<button class="btn p" data-act="approve:${id}">Approve</button>`:''}${e.state==='open'?`<button class="btn" data-act="rerun:1187">Re-run checks</button>`:''}<button class="btn" data-act="chain:${id}:link">Link to…</button><button class="btn q" data-act="open-ext:${id}">Open in Gitea ↗</button></div>`;
  x+=sec('Reviewers',e.approvals.length)+e.approvals.map(a=>`<div class="ln" style="cursor:default"><span class="d"></span><span class="r">${P[a.who].ini}</span><span class="t">${h(who(a.who))}${a.note?` <i>— ${a.note}</i>`:''}</span><span class="s">${a.ok?'<span class="ok">✓ approved</span>':'pending'}</span><span class="st">${a.ok?stamp('APPROVED',id+a.who,false,a.fresh):''}</span></div>`).join('');
  if(e.checks.length)x+=sec('Checks',e.checks.length)+e.checks.map(c=>row(c)).join('');
  x+=sec('Comments',e.comments.length)+comments(e.comments)+(e.state==='open'?commentForm(id,'Reply'):'');
  x+=sec('Files changed',e.files.length)+e.files.map(([f,d])=>`<div class="ln" style="cursor:default"><span class="d"></span><span class="r" style="color:var(--muted)">${d.split(' ')[0]}</span><span class="t" style="font-family:var(--mono);font-size:12px">${h(f)}</span><span class="s">${d}</span><span class="st"></span></div>`).join('');
  x+=linkedRows(id);return x;}

function buildDetail(id){const e=E[id];const bad=e.status==='failed';
  let x=kh('#'+e.n,stamp('CI',id),'build',SRC.teamcity.state==='err'?SRC.teamcity.synced:SRC.teamcity.synced)+`<h1>${h(e.cfg)} <span style="margin-left:14px">${bad?stamp('FAILED',id,true):e.status==='running'?`<span style="font:500 13px var(--ui);color:var(--blue)">${RUN} running · ${e.step}</span>`:e.status==='queued'?'<span style="font:500 13px var(--ui);color:var(--muted)">queued</span>':'<span class="ok" style="font-size:13px">✓ success</span>'}</span></h1>`;
  x+=`<div class="meta"><span><span class="k">Branch</span><span class="mono">${h(e.branch)}</span></span><span><span class="k">When</span><span class="mono">${e.note||e.upd}</span></span>${e.dur?`<span><span class="k">Duration</span><span class="mono">${e.dur}</span></span>`:''}<span><span class="k">Project</span>Payouts</span></div>`;
  if(SRC.teamcity.state==='err')x+=`<div class="errbox"><b>TeamCity is signed out (401 Unauthorized)</b> since 38 min ago — this build is shown from the last sync. Re-runs and triggers are queued locally until you <a href="#/source/teamcity">re-enter the password</a>.</div>`;
  x+=`<div class="actrow">${bad?`<button class="btn p" data-act="rerun:${e.n}">Re-run failed</button>`:''}<button class="btn" data-go="#/action/trigger">Trigger with parameters…</button>${bad?`<button class="btn" data-act="chain:PAY-231:comment:build">Comment on PAY-231</button>`:''}<button class="btn q" data-act="open-ext:${id}">Open in TeamCity ↗</button></div>`;
  x+=sec('Parameters',Object.keys(e.params).length)+Object.entries(e.params).map(([k,v])=>`<div class="ln" style="cursor:default"><span class="d"></span><span class="r">${k}</span><span class="t" style="font-family:var(--mono);font-size:12px">${h(v)}</span><span class="s"></span><span class="st"></span></div>`).join('');
  if(e.log)x+=sec('Log excerpt','#'+e.n)+`<div class="log">${h(e.log).replace(/FAILED/g,'<span class="bad">FAILED</span>').replace(/left: 6/,'<span class="bad">left: 6</span>')}</div><div class="prose" style="font-size:13.5px;color:var(--muted)"><p>Your note <span class="chipe" data-go="#/note/sepa-retry-investigation">SEPA retry investigation</span> says: counter starts at 0, so the sixth try is counted — start at 1.</p></div>`;
  x+=linkedRows(id);x+=suggRows(id);return x;}

function pageDetail(id){const e=E[id];
  let x=kh(e.space||'ENG',stamp('WIKI',id),'page',SRC.confluence.synced)+`<h1>${h(e.title)}</h1>`;
  x+=`<div class="meta"><span><span class="k">Space</span><b>ENG</b> Engineering</span><span><span class="k">Edited</span><span class="mono">${e.upd}</span>${e.section?` <span style="color:var(--faint)">section “${e.section}”</span>`:''}</span><span><span class="k">By</span><b>${h(who(e.who))}</b></span></div>`;
  x+=`<div class="actrow"><button class="btn" data-act="edit-page:${id}">Edit in knobas</button><button class="btn" data-act="chain:${id}:link">Link to…</button><button class="btn" data-act="timer-on:${id}">Start timer</button><button class="btn q" data-act="open-ext:${id}">Open in Confluence ↗</button></div>`;
  x+=sec('Content')+`<div class="prose">${e.body}</div>`;
  if(e.comments.length||e.type==='page')x+=sec('Comments',e.comments.length)+comments(e.comments)+commentForm(id,'Reply','Reply…');
  x+=linkedRows(id);x+=suggRows(id);return x;}

function commitDetail(id){const e=E[id];let x=kh(e.hash,stamp('GIT',id),'commit',SRC.gitea.synced)+`<h1>${h(e.title)}</h1>`;
  x+=`<div class="meta"><span><span class="k">Author</span><b>${h(who(e.who))}</b></span><span><span class="k">When</span><span class="mono">${e.upd}</span></span><span><span class="k">Branch</span><a href="#/branch/${encodeURIComponent(e.branch)}" class="mono">${h(e.branch)}</a></span><span><span class="k">Repo</span><a href="#/repo/payout-service" class="mono">payout-service</a></span></div>`;
  x+=`<div class="actrow"><button class="btn" data-act="chain:${id}:link">Link to…</button><button class="btn q" data-act="open-ext:${id}">Open in Gitea ↗</button></div>`;
  x+=linkedRows(id);x+=suggRows(id);return x;}
function branchDetail(id){const e=E[id];let x=kh('branch',stamp('GIT',id),E[e.repo].title,SRC.gitea.synced)+`<h1 style="font-family:var(--mono);font-weight:500;font-size:17px">${h(e.title)}</h1>`;
  x+=`<div class="meta"><span><span class="k">State</span><b>${h(e.note)}</b></span><span><span class="k">Repo</span><a href="${route(e.repo)}" class="mono">${h(E[e.repo].title)}</a></span></div>`;
  x+=`<div class="actrow"><button class="btn" data-act="git:pull">Pull</button><button class="btn" data-act="git:push">Push</button><button class="btn" data-act="chain:${id}:link">Link to…</button></div>`;
  const cs=Object.keys(E).filter(k=>E[k].type==='commit'&&E[k].branch===e.title);if(cs.length)x+=sec('Commits',cs.length)+cs.map(c=>row(c)).join('');
  x+=linkedRows(id);return x;}
function repoDetail(id){const e=E[id];let x=kh(e.lang,stamp('GIT',id),'repo · org tidewater',SRC.gitea.synced)+`<h1>${h(e.title)}</h1>`;

function dayStrip(){const s0=mins('08:30'),s1=mins(NOW),W=1000,L=44,R=16,H=86,y=34,bh=30;const px=m=>L+(m-s0)/(s1-s0)*(W-L-R);
  const clip=(t,w)=>{const n=Math.floor((w-14)/7);if(n<5)return'';return t.length<=n+1?t:t.slice(0,n)+'…';};
  let x=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Today's time blocks"><defs><pattern id="hp" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="4" fill="#1F3A8A" opacity=".55"/></pattern><pattern id="hr" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="4" fill="#C8372D" opacity=".6"/></pattern></defs>`;
  x+=`<line x1="${L}" y1="${y+bh}" x2="${W-R}" y2="${y+bh}" stroke="#D7DEE8"/>`;
  for(let m=mins('09:00');m<=s1;m+=60)x+=`<line x1="${px(m)}" y1="${y+bh}" x2="${px(m)}" y2="${y+bh+5}" stroke="#9AA5B4"/><text class="tk" x="${px(m)}" y="${y+bh+16}" text-anchor="middle">${hm(m)}</text>`;
  BLOCKS.forEach((b,bi)=>{const a=px(mins(b.s)),w=px(mins(b.e))-a;
    const nx=BLOCKS[bi+1];const room=w+(!nx?18:nx.how==='gap'?(px(mins(nx.e))-px(mins(nx.s)))*.5:0);
    if(b.how==='gap'){x+=`<text class="tk" x="${a+w/2}" y="${y+bh/2+3}" text-anchor="middle">lunch</text>`;return;}
    const fill=b.un?'url(#hr)':b.how==='passive'?'url(#hp)':b.how==='label'?'#FCFCFA':'#1F3A8A';const stroke=b.un?'#C8372D':'#1F3A8A';const dash=b.how==='label'?' stroke-dasharray="4 2"':'';
    x+=`<g class="bl" data-block="${b.id}" tabindex="0" role="button"><rect class="b" x="${a+1}" y="${y}" width="${Math.max(w-2,2)}" height="${bh}" fill="${fill}" stroke="${stroke}"${dash}/><text x="${a+6}" y="${y-8}" class="lab" style="fill:${b.un?'#C8372D':'#5F6B7A'};font-size:9px">${h(clip(b.un?'unattributed':b.ent||b.ctx,room))}</text></g>`;});
  x+=`<line x1="${px(s1)}" y1="${y-4}" x2="${px(s1)}" y2="${y+bh+4}" stroke="#C8372D" stroke-width="1.5"/><text class="tk" x="${px(s1)-4}" y="${y-21}" text-anchor="end" style="fill:#C8372D">now ${NOW}</text></svg>`;return x;}

function chainPick(v){const c=S.chain;
  switch(c.kind){
    case'actions':{const id=c.ent;
      if(v==='status'||v==='comment'||v==='link'){openChain(id,v);return;}
      if(v==='timer'){S.chain=null;timerOn(id);return;}
      if(v==='startwork'){S.chain=null;go('#/action/start-work/'+id);return;}
      if(v==='rerun'){S.chain=null;rerun(1187);return;}
      if(v==='approve'){S.chain=null;approve(id);return;}
      if(v==='open'){S.chain=null;openExt(id);return;}break;}
    case'status':setStatus(c.ent,v);S.chain=null;renderAll();return;
    case'link':confirmLink(c.ent,v);S.chain=null;renderAll();return;
    case'assign':{const b=BLOCKS.find(b=>b.id===c.block);if(v.startsWith('label:')){b.ctx=v.slice(6);b.how='label';}else{b.ent=v;b.ctx=refOf(v);}b.un=false;b.fresh=true;S.chain=null;toast('Assigned 11:50–12:20 to '+h(b.ctx),'30m · passive block',{stamp:'ASSIGNED'});go('#/time');return;}
    case'switch':{S.chain=null;if(v.startsWith('label:'))timerOn(null,v.slice(6));else timerOn(v);return;}
    case'logto':{const b=BLOCKS.find(b=>b.id===c.block);b.logged=true;b.ent=v;E[v].worklogs.push({when:'today',min:48,text:'Staging DB configuration',fresh:true});S.loggedToday=(S.loggedToday||0)+48;S.chain=null;toast('Logged 48m to '+v,'“Staging DB configuration” · Jira worklog',{stamp:'LOGGED'});go('#/ticket/'+v);return;}
    case'wiz':wizPick(v);return;}}

function chainPop(idx){const c=S.chain;if(!c)return;

  if(c.kind==='worklog'){wlDiscard();return;}
  if(c.kind==='actions'||idx===undefined&&c.crumbs.length===1||c.kind==='assign'||c.kind==='switch'||c.kind==='logto'){S.chain=null;renderAll();focusBox(true);return;}

  switch(w.step){
    case'type':w.type=v;w.step='url';c.crumbs.push({t:v});c.ph='URL of '+v+' — type it, ↵';break;
    case'url':w.url=v;w.step='auth';c.crumbs.push({t:v.replace(/^https?:\/\//,''),ref:true});c.ph='Auth method?';break;
    case'auth':w.auth=v;w.step='cred';c.crumbs.push({t:v.split(' ')[0]});c.ph=v.startsWith('User')?'Password for '+w.url+' — ↵':'Paste the token — ↵';break;
    case'cred':w.cred=true;w.step='test';c.crumbs.push({t:'Test'});c.ph='↵ to test the connection';break;
    case'test':if(v==='test'){w.testing=true;renderAll();setTimeout(()=>{w.testing=false;w.test=`Connected · ${w.type} ${(SRC_TYPES.find(t=>t[0]===w.type)||[])[1]||''} · search and write available`;renderAll();focusBox(true);},900);return;}

function render(){S.route=location.hash||'#/';if(S.route!==lastRoute)S.sel=0;applyRoute();renderAll();
  if(S.mode==='search'&&S.q.trim()){const id=idOf(S.route);if(id){const i=S.items.findIndex(el=>el.dataset.ent===id);if(i>=0){S.sel=i;markSel();}}}}
function focusBox(select,caret){const q=$('#q');if(!q)return;q.focus();if(select)q.select();else if(caret!=null)try{q.setSelectionRange(caret,caret);}catch(e){}}
window.addEventListener('hashchange',()=>{if(!S.chain||S.chain.kind==='worklog'||S.chain.kind==='wiz'||S.chain.kind==='trigger')render();else{S.chain=null;render();}});

/* ---- timer popover ---- */
function openPop(anchor){const t=S.timer;S.pop='timer';const r=anchor.getBoundingClientRect();const el=$('#pop');
  const rows=[];if(t.running)rows.push(['timer-toggle','Stop & draft worklog','⌘T']);else rows.push(['timer-toggle','Start on '+(t.label||refOf(t.ctx)),'⌘T']);
  rows.push(['chain-switch','Switch context…','ticket, PR, page or label']);
  for(const id of['PAY-240','PAY-228','OPS-77'])if(id!==t.ctx)rows.push(['timer-on:'+id,'Start on '+id,E[id].title]);
  rows.push(['timer-label:Staging DB configuration','Label “Staging DB configuration”','ad-hoc · 13:10–13:58 today']);
  el.innerHTML=`<div class="pop" style="left:${r.left}px;top:${r.bottom+4}px"><div class="ph">Timer · ${t.running?'running on '+h(t.label||t.ctx)+' since '+t.since:'stopped'}</div>${rows.map(([a,l,d])=>`<button class="ln two" data-act="${h(a)}"><span class="d"></span><span class="t" style="padding-left:12px">${h(l)}</span><span class="s">${h(d)}</span></button>`).join('')}<div class="pa"><a href="#/time" class="btn q" data-go="#/time">Day review</a></div></div>`;}
function closePop(silent){S.pop=null;$('#pop').innerHTML='';}

/* ---- [[ picker inside the note editor ---- */
function edPicker(ed){const sel=getSelection();if(!sel.rangeCount)return closePicker();const rg=sel.getRangeAt(0);const n=rg.startContainer;if(n.nodeType!==3)return closePicker();
  const before=n.textContent.slice(0,rg.startOffset);const m=before.match(/\[\[([^\]\[]*)$/);if(!m)return closePicker();
  const t=m[1].toLowerCase();const ids=(t?search(t):['PAY-231','pr:142','build:1187','page:sepa-payout-retry-design','PAY-240','OPS-77']).filter(id=>E[id].type!=='person').slice(0,8);
  const rr=rg.getBoundingClientRect();const el=$('#pop');S.pop='picker';S.pickCtx={node:n,offset:rg.startOffset,len:m[0].length};
  el.innerHTML=`<div class="pop" style="left:${Math.min(rr.left,innerWidth-440)}px;top:${rr.bottom+6}px"><div class="ph">Link an entity</div>${ids.map(id=>row(id,{act:'ed-pick:'+id})).join('')||'<div class="empty">No match.</div>'}</div>`;}
function closePicker(){if(S.pop==='picker')closePop();}
function edPick(id){const c=S.pickCtx;if(!c)return;const e=E[id];const ref=e.key||(e.type==='pr'?'PR #'+e.n:e.type==='build'?'#'+e.n:e.title);
  const n=c.node;const text=n.textContent;n.textContent=text.slice(0,c.offset-c.len);const chip=document.createElement('span');chip.className='chipe';chip.contentEditable='false';chip.dataset.ref=ref;chip.dataset.go=route(id);chip.textContent=ref;
  const after=document.createTextNode(' '+text.slice(c.offset));n.parentNode.insertBefore(chip,n.nextSibling);n.parentNode.insertBefore(after,chip.nextSibling);
  const rg=document.createRange();rg.setStart(after,1);rg.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(rg);closePop();$('#note-ed').focus();}

/* =========================================================
   EVENTS
   ========================================================= */
function doAct(a,el){const i=a.indexOf(':');const k=i<0?a:a.slice(0,i);const arg=i<0?'':a.slice(i+1);
  switch(k){
    case'timer-pop':if(S.pop==='timer')closePop();else openPop(el);return;
    case'timer-toggle':timerToggle();return;
    case'timer-on':closePop();timerOn(arg);return;
    case'timer-label':closePop();timerOn(null,arg);return;
    case'chain-switch':closePop();S.chain={kind:'switch',crumbs:[{t:'Timer'},{t:'Switch context'}],text:'',ph:'Ticket, PR, page, note — or type an ad-hoc label',label:'timer'};renderAll();focusBox(true);return;
    case'chain':{const[ent,kind,extra]=arg.split(':');openChain(ent,kind,extra);return;}
    case'chain-pop':chainPop(+arg);return;
    case'chain-pick':chainPick(arg);return;
    case'chain-enter':chainEnter();return;
    case'chain-clear':S.chain=null;S.wiz=null;go('#/sources');return;
    case'confirm':{const s=SUGG.find(x=>x.id===arg);if(s){confirmLink(s.a,s.b);renderAll();}return;}
    case'dismiss':SUGG=SUGG.filter(x=>x.id!==arg);toast('Suggestion dismissed','it will not be proposed again');renderAll();return;
    case'comment':{const ta=$('#cmt-'+CSS.escape(arg));const t=ta?ta.value.trim():'';if(!t){ta&&ta.focus();toast('Nothing to post yet','Type a comment first.',{red:true});return;}postComment(arg,t);renderAll();return;}
    case'approve':approve(arg);return;
    case'rerun':rerun(+arg);return;
    case'open-ext':openExt(arg);return;
    case'edit-page':toast('Opened the section in Confluence for editing','In-app page editing is not in this build.');return;
    case'save-note':saveNote(arg);return;case'del-note':delNote(arg);return;case'new-note':newNote();return;
    case'ed-pick':edPick(arg);return;
    case'inbox':{const j=arg.indexOf(':');inboxAct(arg.slice(0,j),arg.slice(j+1));return;}
    case'assign':S.chain={kind:'assign',block:arg,crumbs:[{t:'11:50–12:20',ref:true},{t:'Assign to'}],text:'',ph:'Which ticket, PR or page was this? Or type a label',label:'time'};renderAll();focusBox(true);return;
    case'logto':S.chain={kind:'logto',block:arg,crumbs:[{t:'Staging DB configuration'},{t:'Log to'}],text:'',ph:'Which ticket gets the 48m? OPS-77 is suggested',label:'time'};renderAll();focusBox(true);return;
    case'keeplocal':{const b=BLOCKS.find(b=>b.id===arg);if(b){b.local=true;}S.chain=null;toast('Kept local','“Staging DB configuration” · 48m · no Jira worklog',{stamp:'LOCAL'});go('#/time');return;}
    case'wl-log':logWorklog();return;case'wl-discard':wlDiscard();return;
    case'wl-edit':{const c=$('#wl-comment');if(c){c.focus();c.setSelectionRange(c.value.length,c.value.length);}S.worklogDraft.manual=c?c.value:'';toast('Editing the comment','Activity checkboxes no longer overwrite it.');return;}
    case'log-all':logAll();return;
    case'tc-reauth':tcReauth();return;
    case'rotate-pat':toast('Token rotation opens Atlassian in the browser','Paste the new PAT here afterwards; Confluence picks it up too.');return;
    case'sync-now':syncNow();return;
    case'sync-one':{const s=SRC[arg];if(s.state==='err'){toast(s.name+' still returns 401','Re-enter the password to fix it.',{red:true});}else{s.synced=0;toast(s.name+' synced','just now',{stamp:'SYNCED'});}renderAll();return;}
    case'remove-src':toast('Removing a source needs a second click','Not wired in this mockup — the local copy of its data would be deleted.',{red:true});return;
    case'wiz-save':wizSave();return;
    case'save-proto':saveProto();return;case'publish-proto':publishProto();return;case'ai-ticket':aiTicket(arg);return;
    case'sw-run':startWorkRun(arg);return;
    case'trig-run':triggerRun();return;
    case'trig-branch':{const o=['feature/PAY-231-sepa-retry','main','fix/PAY-228-partial-refund-drift'];S.trigger.branch=o[(o.indexOf(S.trigger.branch)+1)%o.length];renderAll();return;}
    case'trig-env':S.trigger.env=S.trigger.env==='staging'?'prod-dryrun':'staging';renderAll();return;
    case'trig-clean':S.trigger.clean=!S.trigger.clean;renderAll();return;
    case'ct-create':createTicket();return;case'ct-again':S.created.ticket=null;renderAll();return;
    case'cp-create':createPage();return;case'cp-again':S.created.page=null;renderAll();return;
    case'git':gitAct(arg);return;
    case'ping':toast('Pinged '+h(who(arg))+' on Jira','mention posted on their newest ticket');return;
    case'help':S.q='?';go('#/search?q=%3F');focusBox();return;
    case'worklog':if(S.timer.running)timerToggle();else toast('Timer is not running','Start it on PAY-231 first (⌘T).',{red:true});return;}}

document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){e.preventDefault();const a=act.dataset.act;if(a)doAct(a,act);return;}
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();if(S.chain&&!['worklog','wiz','trigger'].includes(S.chain.kind))S.chain=null;if(g.dataset.list)S.smart=g.dataset.list;closePop();go(g.dataset.go);return;}
  const bl=e.target.closest('[data-block]');if(bl){const b=BLOCKS.find(x=>x.id===bl.dataset.block);if(b&&b.un)doAct('assign:'+b.id);else if(b&&b.how==='label'&&!b.local&&!b.logged)doAct('logto:'+b.id);else if(b&&b.ent)go(route(b.ent));return;}
  if(S.pop&&!e.target.closest('.pop'))closePop();
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.filter){S.filters[t.dataset.filter]=t.type==='checkbox'?t.checked:t.value;S.sel=0;renderLeft();renderRight();return;}
  if(t.dataset.status){setStatus(t.dataset.status,t.value);renderAll();return;}
  if(t.dataset.trig){S.trigger[t.dataset.trig]=t.type==='checkbox'?t.checked:t.value;renderBox();focusBox();return;}
  if(t.dataset.ck){const a=ACTIVITY.find(x=>x.id===t.dataset.ck);a.on=t.checked;if(S.worklogDraft&&S.worklogDraft.manual==null){const c=$('#wl-comment');if(c)c.value=genComment();}return;}
  if(t.dataset.iv){const[i,j]=t.dataset.iv.split(':').map(Number);if(/^\d\d:\d\d$/.test(t.value)){S.worklogDraft.ivs[i][j]=t.value;renderRight();}return;}
  if(t.dataset.sched){toast(SRC[t.dataset.sched].name+' now syncs '+t.value);return;}
  if(t.id==='wl-target'&&S.worklogDraft){S.worklogDraft.target=t.value.trim();renderRight();return;}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){const v=t.value;
    if(S.chain){S.chain.text=v;S.sel=0;renderLeft();return;}
    S.q=v;S.sel=0;const hash=v.startsWith('>')?'#/actions?q='+encodeURIComponent(v):v.trim()?'#/search?q='+encodeURIComponent(v):'#/';
    history.replaceState(null,'',hash);S.route=hash;lastRoute=hash;applyRoute();
    $('.qmode').textContent=qmodeLabel();document.querySelectorAll('.mode').forEach(m=>m.classList.toggle('on',m.dataset.go===(S.mode==='actions'?'#/actions':'#/')));
    renderLeft();renderRight();return;}
  if(t.id==='wl-comment'&&S.worklogDraft){S.worklogDraft.manual=t.value;return;}
  if(t.id==='note-ed'){edPicker(t);return;}
});
document.addEventListener('keydown',e=>{const mod=e.metaKey||e.ctrlKey;const key=e.key;
  if(mod&&key.toLowerCase()==='k'){e.preventDefault();closePop();focusBox(true);return;}
  if(mod&&key.toLowerCase()==='t'){e.preventDefault();timerToggle();return;}
  if(key==='Escape'){e.preventDefault();if(S.pop){closePop();return;}if(S.chain){chainPop();return;}
    if(S.q||S.mode!=='search'||idOf(S.route)){S.q='';go('#/');focusBox();return;}focusBox(true);return;}
  const inBox=e.target.id==='q';
  if(e.target.closest&&e.target.closest('textarea,.ed,.doc,select,input:not(#q)'))return;
  if(S.pop==='picker')return;
  if(key==='ArrowDown'||key==='ArrowUp'){if(!S.items.length)return;e.preventDefault();S.sel=(S.sel+(key==='ArrowDown'?1:-1)+S.items.length)%S.items.length;markSel();
    if(S.mode==='search'&&S.q.trim()&&!idOf(S.route)&&!S.chain)renderRight();return;}
  if(key==='Enter'){if(inBox){e.preventDefault();if(S.chain)chainEnter();else{const el=S.items[S.sel];if(el)el.click();}return;}
    const r=e.target.closest&&e.target.closest('.ln[data-go],.ln[data-act],[data-block]');if(r&&r.tagName!=='BUTTON'){e.preventDefault();r.click();}return;}
  if(key==='Tab'&&!e.shiftKey&&!S.chain){let ent=null;if(inBox){const el=S.items[S.sel];ent=el&&el.dataset.ent;}else{const el=e.target.closest&&e.target.closest('.ln[data-ent]');ent=el&&el.dataset.ent;}
    if(ent&&E[ent]&&E[ent].type!=='person'&&(S.mode==='search'||S.mode==='notes')){e.preventDefault();openChain(ent,'actions');}return;}
  if(inBox&&key==='Backspace'&&S.chain&&!e.target.value&&S.chain.kind!=='worklog'){e.preventDefault();chainPop();return;}
});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('.ln');if(el&&S.items.includes(el)){S.sel=S.items.indexOf(el);markSel(false);}});

/* ---- timer tick ---- */
setInterval(()=>{if(!S.timer.running)return;S.timer.sec++;const b=document.querySelector('.timer b');if(b)b.innerHTML=hm(Math.floor(S.timer.sec/60))+'<small>:'+String(S.timer.sec%60).padStart(2,'0')+'</small>';},1000);

/* ---- init ---- */
if(!location.hash)history.replaceState(null,'','#/');
render();
if(!/Mac|iPhone|iPad/.test(navigator.platform))document.querySelectorAll('.kbd,.status .keys').forEach(el=>el.innerHTML=el.innerHTML.replace(/⌘/g,'Ctrl+'));
}catch(err){document.getElementById('jserr').textContent='init error: '+err.message+' '+(err.stack||'');document.getElementById('jserr').style.display='block';console.error(err);}
</script>
</body>
