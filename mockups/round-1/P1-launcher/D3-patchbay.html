<!--
knobas mockup
paradigm: P1 Launcher
design: D3 Patchbay
thesis: One typed box reaches every source and every action; detail, actions and parameters chain inside the box instead of across screens.
thesis: The box is the console's input channel — sources are colored modules, results are jacks on a patchbay, and a cross-source link is a cable you can see.
thesis: Patch cables: an entity's OUT jack fans Bézier cables to its linked jacks; suggested links hang dashed and faint until Confirm plugs them in.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Tidewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --chassis:#E3E5E8; --panel:#F1F2F4; --edge:#C9CDD3; --ink:#1E2126; --muted:#6B727C;
  --well:#FAFAFB; --hover:#E8EAED; --screw:#B4B9C1;
  --jira:#2563EB; --confluence:#7C3AED; --gitea:#2E9E5B; --teamcity:#F0742A; --notes:#E0B100;
  --fail:#D62839; --neutral:#9AA0A8;
  --display:'Space Grotesk',"Helvetica Neue",Arial,sans-serif;
  --body:'IBM Plex Sans',"Helvetica Neue",Arial,sans-serif;
  --mono:'Space Mono',"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--chassis);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
code,pre{font-family:var(--mono);font-size:12px}
code{background:#E4E6EA;padding:0 4px;border-radius:3px}
pre{background:var(--ink);color:#EDEFF2;padding:10px 12px;border-radius:4px;white-space:pre-wrap;line-height:1.5}
i{font-style:italic}
[hidden]{display:none!important}

/* ---------- frame ---------- */
.app{height:100vh;display:grid;grid-template-rows:44px 60px minmax(0,1fr) 26px}

/* engraved plates */
.plate{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.plate.ink{color:var(--ink)}
.mono{font-family:var(--mono);font-size:12px}

/* jacks */
.jack{width:12px;height:12px;border-radius:999px;flex:none;display:inline-block;vertical-align:middle;position:relative;
  background:radial-gradient(circle,var(--ink) 0 27%,var(--c,var(--neutral)) 30% 100%)}
.jack-lg{width:20px;height:20px}
.jack-sm{width:9px;height:9px}
.jack-jira{--c:var(--jira)} .jack-confluence{--c:var(--confluence)} .jack-gitea{--c:var(--gitea)}
.jack-teamcity{--c:var(--teamcity)} .jack-notes{--c:var(--notes)} .jack-label{--c:var(--neutral)} .jack-person{--c:var(--neutral)}
.jack.is-err{background:radial-gradient(circle,#fff 0 27%,var(--fail) 30% 100%)}
.jack.ring-run{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--teamcity);animation:pulse 2s ease-in-out infinite}
.jack.plug{animation:plug .15s ease-out}
@keyframes plug{0%{transform:scale(1)}55%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--teamcity)}50%{box-shadow:0 0 0 2px var(--panel),0 0 0 4px rgba(240,116,42,.15)}}

/* ---------- strip ---------- */
.strip{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--edge);background:var(--chassis)}
.transport{display:flex;align-items:center;gap:10px}
.tbtn{width:30px;height:30px;border-radius:999px;background:var(--ink);display:grid;place-items:center;color:#fff;flex:none}
.tbtn .sq{width:10px;height:10px;background:#fff;border-radius:1px}
.tbtn .tri{width:0;height:0;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.tbtn.is-running{box-shadow:0 0 0 2px var(--chassis),0 0 0 4px var(--jira)}
.tbtn.is-running.is-label{box-shadow:0 0 0 2px var(--chassis),0 0 0 4px var(--neutral)}
.t-elapsed{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;min-width:58px}
.t-elapsed small{font-size:11px;color:var(--muted)}
.t-ctx{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);font-weight:500;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ctx.is-off{color:var(--muted);font-weight:400}
.leds{display:flex;gap:2px;margin-left:auto}
.led{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 9px;border-radius:4px;border:1px solid transparent}
.led:hover{background:var(--panel);border-color:var(--edge)}
.led .plate{font-size:9px}
.led.is-err .plate{color:var(--fail)}
.pend{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--fail);color:var(--fail);border-radius:4px;font-family:var(--mono);font-size:11px}
.meter{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--edge);border-radius:4px;background:var(--panel)}
.meter b{font-family:var(--mono);font-size:13px;min-width:10px;text-align:right}
.gear{width:28px;height:28px;border-radius:4px;border:1px solid var(--edge);background:var(--panel);display:grid;place-items:center}
.gear:hover{background:var(--hover)}

/* ---------- the box ---------- */
.box{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--edge)}
.box-caret{width:4px;height:26px;background:var(--ink);border-radius:1px;flex:none}
.chain{display:flex;align-items:center;gap:4px}
.crumb{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;background:var(--ink);color:#fff;border-radius:4px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;white-space:nowrap}
.crumb .jack{box-shadow:0 0 0 1.5px #fff}
.crumb-sep{color:var(--muted);font-family:var(--mono)}
.box-input{flex:1;min-width:200px;height:38px;background:var(--well);border:1px solid var(--edge);border-radius:4px;padding:0 12px;font-family:var(--display);font-size:18px;font-weight:500;color:var(--ink)}
.box-input::placeholder{color:#9AA0A8;font-weight:500}
.box-input:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.modes{display:flex;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:var(--well);flex:none}
.mode{display:flex;align-items:center;gap:6px;padding:0 10px;height:30px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--edge)}
.mode:last-child{border-right:0}
.mode:hover{background:var(--hover);color:var(--ink)}
.mode.is-on{background:var(--ink);color:#fff}
.mode b{font-weight:700}
.kbd{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--edge);border-radius:3px;padding:1px 5px;background:var(--well);white-space:nowrap}

/* ---------- deck / panels ---------- */
.deck{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:8px;padding:8px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:4px;position:relative;min-height:0;display:flex;flex-direction:column}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:4px;background:
  radial-gradient(circle,var(--screw) 1.3px,transparent 1.9px) left 4px top 4px/8px 8px no-repeat,
  radial-gradient(circle,var(--screw) 1.3px,transparent 1.9px) right 4px top 4px/8px 8px no-repeat,
  radial-gradient(circle,var(--screw) 1.3px,transparent 1.9px) left 4px bottom 4px/8px 8px no-repeat,
  radial-gradient(circle,var(--screw) 1.3px,transparent 1.9px) right 4px bottom 4px/8px 8px no-repeat}
.scroll{overflow:auto;min-height:0;flex:1;padding:6px 0 14px}
.statusbar{display:flex;align-items:center;gap:16px;padding:0 14px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.statusbar .r{margin-left:auto}

/* group headers and rows */
.group{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px}
.group .plate{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:6px 10px;margin:0 6px;border-radius:4px;cursor:pointer;border:2px solid transparent;line-height:1.3;min-height:36px}
.row:hover{background:var(--hover)}
.row.is-sel{border-color:var(--ink);background:var(--well)}
.row .ty{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:52px;flex:none}
.row .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt b{font-weight:600}
.row .tt small{color:var(--muted);font-size:12px}
.row .mt{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;white-space:nowrap}
.row .cnt{font-family:var(--mono);font-size:12px;flex:none;min-width:28px;text-align:right}
.row .badge{font-family:var(--mono);font-size:10px;background:var(--ink);color:#fff;border-radius:3px;padding:1px 5px;flex:none}
.row.cmd .tt::before{content:"› ";color:var(--muted)}
button.row{width:calc(100% - 12px);text-align:left}
.list button.row{width:100%}
.pop button.row{width:calc(100% - 8px)}
.row.tall{align-items:flex-start;padding-top:8px;padding-bottom:8px}
.row.tall .tt{white-space:normal}
.hint{padding:8px 16px;font-size:12px;color:var(--muted)}
.hint .kbd{margin-right:2px}
.empty{padding:28px 20px;color:var(--muted);text-align:center}

.ibx{margin:0 6px 2px;border:2px solid transparent;border-radius:4px}
.ibx:has(.row.is-sel){border-color:var(--ink);background:var(--well)}
.ibx .row{margin:0;padding-bottom:2px;border-width:0}
.ibx .row.is-sel{background:transparent}
.ibx-acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px 46px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--edge);border-radius:4px;background:var(--well);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.is-on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.is-on .jack{box-shadow:0 0 0 1.5px #fff}
.chip .jacks{display:inline-flex;gap:2px}
.chip .jack{width:8px;height:8px}

/* status chips */
.st{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--edge);border-radius:4px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.st-fail{color:var(--fail);border-color:var(--fail)}
.st-run{color:var(--teamcity);border-color:var(--teamcity)}
.st-ok::before{content:"✓";font-weight:700}
.st-open{border-color:var(--gitea);color:var(--gitea)}
.st-merged{border-color:var(--confluence);color:var(--confluence)}
.ring{width:9px;height:9px;border-radius:999px;border:2px solid var(--teamcity);display:inline-block;animation:ringp 2s ease-in-out infinite}
@keyframes ringp{0%,100%{box-shadow:0 0 0 0 rgba(240,116,42,.45)}50%{box-shadow:0 0 0 4px rgba(240,116,42,0)}}

/* ---------- detail ---------- */
.det{padding:14px 18px 28px}
.det-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.det-top .key{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:700;white-space:nowrap}
.det-top .sp{flex:1}
.det h1{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.25;margin-bottom:10px}
.det h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0 0 4px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 16px;margin:14px 0 6px}
.f .plate{display:block;margin-bottom:2px}
.f .v{font-weight:500;display:flex;align-items:center;gap:6px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h .plate{color:var(--ink)}
.desc{background:var(--well);border:1px solid var(--edge);border-radius:4px;padding:10px 12px;line-height:1.5}
.desc p+p{margin-top:8px}
.cm{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--edge)}
.cm:first-child{border-top:0}
.cm.is-new{background:var(--well);outline:2px solid var(--ink);border-radius:4px;padding:9px 8px}
.av{width:26px;height:26px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:10px;display:grid;place-items:center}
.cm-meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.cm-meta b{color:var(--ink);font-weight:500}
.in{width:100%;background:var(--well);border:1px solid var(--edge);border-radius:4px;padding:7px 10px;font-family:var(--body);font-size:13px}
.in:focus{outline:2px solid var(--ink);outline-offset:0}
textarea.in{min-height:64px;resize:vertical;line-height:1.45}
textarea.in.doc{min-height:260px;font-size:13.5px}
.inrow{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.inrow .in{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--ink);border-radius:4px;background:var(--well);font-weight:500;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn-pri{background:var(--ink);color:#fff}
.btn-pri:hover{background:#000}
.btn-sm{height:24px;padding:0 8px;font-size:12px}
.btn-ghost{border-color:var(--edge)}
.btn-danger{border-color:var(--fail);color:var(--fail)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:var(--well)}
.seg button{padding:0 10px;height:28px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button.is-on{background:var(--ink);color:#fff}
.tog{width:44px;height:28px;border-radius:999px;background:var(--edge);position:relative;border:1px solid var(--screw);flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:var(--well);border:1px solid var(--screw);transition:left .12s}
.tog.is-on{background:var(--ink);border-color:var(--ink)}
.tog.is-on::after{left:19px}
.togrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv .plate{align-self:center}
.list{border:1px solid var(--edge);border-radius:4px;background:var(--well);overflow:hidden}
.list .row{margin:0;border-radius:0;border-bottom:1px solid var(--edge)}
.list .row:last-child{border-bottom:0}
.callout{border:1px solid var(--edge);border-left:3px solid var(--ink);background:var(--well);padding:8px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.callout.fail{border-left-color:var(--fail)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.echip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 6px;border:1px solid var(--edge);border-radius:4px;background:var(--well);font-size:12px;font-weight:500;white-space:nowrap}
.echip:hover{border-color:var(--ink)}
.echip .jack{width:9px;height:9px}
.file{display:grid;grid-template-columns:1fr auto;gap:10px;padding:5px 0;border-top:1px solid var(--edge);font-family:var(--mono);font-size:12px}
.file:first-child{border-top:0}
.file .add{color:var(--gitea)} .file .del{color:var(--fail)}

/* ---------- patchbay ---------- */
.patch{position:relative;display:grid;grid-template-columns:112px 1fr;gap:0 26px;border:1px solid var(--edge);border-radius:4px;background:var(--well);padding:10px 10px 10px 0}
.patch svg.cables,.mini svg.cables{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.porigin{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;position:relative;z-index:1;border-right:1px dashed var(--edge);padding:8px 4px}
.porigin .plate{font-size:9px;line-height:1.4;white-space:normal;overflow-wrap:anywhere;max-width:96px}
.porigin .jack{box-shadow:0 0 0 3px var(--well),0 0 0 4px var(--edge)}
.prows{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:10px;padding:5px 8px;border:2px solid transparent;border-radius:4px;line-height:1.3;min-height:32px}
.prow:hover{background:var(--hover)}
.prow .jack{box-shadow:0 0 0 2px var(--well)}
.prow .ty{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:52px;flex:none}
.prow .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tt b{font-weight:600}
.prow .mt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prow.is-new{animation:rowin .3s ease-out}
@keyframes rowin{from{background:var(--hover)}to{background:transparent}}
.sug{display:grid;grid-template-columns:150px minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 10px;border:1px dashed var(--edge);border-radius:4px;margin-top:6px;background:var(--well)}
.sug .mini{position:relative;width:150px;height:26px;display:flex;align-items:center;justify-content:space-between}
.sug .mini .jack{box-shadow:0 0 0 2px var(--well)}
.sug .why{font-size:13px;line-height:1.3}
.sug .why small{display:block;color:var(--muted);font-size:12px}
.sug .why b{font-weight:600}
.sug .bt{display:flex;gap:6px}
.sug.is-confirmed{border-style:solid;border-color:var(--ink)}
.sug.is-gone{opacity:0;transition:opacity .2s}

/* ---------- toggles & misc controls ---------- */
.stepper{display:flex;flex-direction:column;gap:0;border:1px solid var(--edge);border-radius:4px;background:var(--well);overflow:hidden}
.step{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--edge);font-size:13px}
.step:first-child{border-top:0}
.step .n{width:20px;height:20px;border-radius:999px;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.step.is-run .n{border-color:var(--gitea);animation:ringp 1s ease-in-out infinite;border-top-color:transparent}
.step.is-done .n{background:var(--ink);border-color:var(--ink);color:#fff}
.step.is-done .n::before{content:"✓"}
.step .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step.is-done .m{color:var(--ink)}
.step.is-skip{opacity:.55}
.wiz{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.wstep{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--edge);border-radius:4px;color:var(--muted)}
.wstep.is-on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wstep.is-done{border-color:var(--ink);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--edge);border-radius:4px;background:var(--well);padding:0;overflow:hidden;text-align:left}
.tile:hover{border-color:var(--ink)}
.tile.is-on{outline:2px solid var(--ink)}
.tile .th{padding:7px 10px;color:#fff;font-family:var(--display);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.tile .tb{padding:6px 10px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.form{display:grid;gap:10px;max-width:560px}
.form label{display:block}
.form label .plate{display:block;margin-bottom:4px}

/* sources modules */
.mod{border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:var(--well)}
.mod-h{display:flex;align-items:center;gap:10px;padding:9px 14px;color:#fff;font-family:var(--display);font-weight:600;font-size:15px}
.mod-h .plate{color:rgba(255,255,255,.85);margin-left:auto}
.mod-h .jack{box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.mod-b{padding:12px 14px}
.mod.is-err .mod-h{background:var(--fail)}
.caps{display:flex;gap:6px;flex-wrap:wrap}
.cap{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--edge);padding:2px 6px;border-radius:3px}
.cap.off{opacity:.45;text-decoration:line-through}
.gauge{height:8px;border:1px solid var(--edge);border-radius:999px;background:var(--well);overflow:hidden;position:relative}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:999px}

/* time */
.day{position:relative;height:70px;border:1px solid var(--edge);background:var(--well);border-radius:4px;margin:8px 0 4px}
.blk{position:absolute;top:8px;bottom:8px;border-radius:3px;padding:4px 6px;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;border:2px solid transparent;color:var(--ink);text-align:left}
.blk b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;font-weight:400;color:inherit;opacity:.8}
.blk.passive{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 38%,var(--well)) 0 4px,color-mix(in srgb,var(--c) 12%,var(--well)) 4px 8px)}
.blk.manual{background:var(--c);color:#fff}
.blk.manual b{opacity:.9}
.blk.unattr{border:2px dashed var(--fail);background:repeating-linear-gradient(135deg,#F6D4D8 0 4px,var(--well) 4px 8px)}
.blk.gap{background:transparent;border:1px dashed var(--edge);color:var(--muted);cursor:default}
.blk:hover:not(.gap){outline:2px solid var(--ink);outline-offset:1px}
.blk.is-sel{outline:2px solid var(--ink);outline-offset:1px}
.ticks{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.sw{width:22px;height:12px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px}
.week{display:grid;grid-template-columns:44px 1fr 70px 70px;gap:8px 12px;align-items:center;font-size:13px}
.week .bar{height:14px;border:1px solid var(--edge);border-radius:3px;overflow:hidden;position:relative;background:var(--well)}
.week .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--ink)}
.week .bar em{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#F6D4D8 0 3px,var(--well) 3px 6px);border-left:1px solid var(--fail)}
.check{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-top:1px solid var(--edge);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:16px;height:16px;margin-top:2px;accent-color:var(--ink)}
.check .t{flex:1;font-size:13px}
.check .t small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}
.big{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.big small{font-size:13px;font-family:var(--mono);color:var(--muted);font-weight:400;margin-left:6px}

/* standup */
.digest-h{padding:10px 14px 2px}
.dl{display:flex;align-items:flex-start;gap:8px;padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;margin:0 6px;border:2px solid transparent}
.dl:hover{background:var(--hover)}
.dl.is-sel{border-color:var(--ink);background:var(--well)}
.dl .jack{margin-top:5px}
.dl .tr{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.doc{background:var(--well);border:1px solid var(--edge);border-radius:4px;padding:14px 16px;line-height:1.55;min-height:220px;font-size:13.5px}
.doc:focus{outline:2px solid var(--ink);outline-offset:0}
.doc h3{font-family:var(--display);font-size:15px;margin:10px 0 4px}
.doc h3:first-child{margin-top:0}
.doc ul{padding-left:18px}
.ai{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--edge);font-size:13px}
.ai:first-child{border-top:0}
.ai .who{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

/* pop (inline popover) */
.pop{position:absolute;z-index:5;background:var(--well);border:2px solid var(--ink);border-radius:4px;min-width:260px;max-width:340px;padding:6px 0;box-shadow:0 6px 18px rgba(30,33,38,.12)}
.pop .row{margin:0 4px}
.pop .hint{padding:4px 12px 6px}
.poprow{display:flex;gap:6px;padding:6px 10px}

/* toasts */
.toasts{position:fixed;right:16px;bottom:38px;display:flex;flex-direction:column;gap:6px;z-index:50}
.toast{background:var(--ink);color:#fff;padding:8px 12px;border-radius:4px;font-size:13px;display:flex;gap:10px;align-items:center;max-width:420px}
.toast .jack{box-shadow:0 0 0 1.5px #fff}
.toast a{text-decoration:underline}

@media (max-width:1220px){
  .deck{grid-template-columns:minmax(320px,360px) minmax(0,1fr)}
  .t-ctx{max-width:150px}
  .t-ctx .plate{display:none}
  .led{padding:3px 6px}
  .mode{padding:0 7px}
  .box-input{font-size:16px;min-width:160px}
  .fields{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function chainLeft(){

  if(S.chain.length===1) return group('Actions for '+h(short(e)),'⇥ chain')+entityActions(e).filter(a=>!q||a.n.toLowerCase().includes(q.toLowerCase())).map(a=>`<button class="row cmd" data-sel data-act="chain-pick:${a.k}"><span class="tt">${h(a.n)}</span><span class="mt">${h(a.hint||'')}</span></button>`).join('')+`<div class="hint"><span class="kbd">↵</span> choose · <span class="kbd">esc</span> back</div>`;

  if(top.kind==='link'){
    const assigning=S.assignBlock!=null;const blk=assigning?TIME.blocks[S.assignBlock]:null;
    const found=quickFind(q,assigning?[]:[e.id,...linksOf(e.id)]);
    return group(assigning?'Assign '+blk.s+'–'+blk.e+' to…':'Link '+h(short(e))+' to…','search-as-you-type')+(found.length?found.map(f=>`<button class="row" data-sel data-act="chain-link:${f.id}">${jack(f.src)}<span class="ty">${TYPE_LABEL[f.type]}</span><span class="tt">${rowTitle(f)}</span><span class="mt">· ${SYNC[f.src]}</span></button>`).join(''):`<div class="empty">Nothing matches “${h(q)}”.</div>`);}
  if(top.kind==='timerpick'){const found=quickFind(q,[]);return group('Start timer on…')+(q?`<button class="row cmd" data-sel data-act="timer-label:${h(q)}">${jack('label')}<span class="ty">label</span><span class="tt">Use label “${h(q)}”</span><span class="mt">ad-hoc</span></button>`:`<button class="row cmd" data-sel data-act="timer-label:Staging DB configuration">${jack('label')}<span class="ty">label</span><span class="tt">Staging DB configuration</span><span class="mt">recent label</span></button>`)+found.map(f=>`<button class="row" data-sel data-act="timer-start:${f.id}">${jack(f.src)}<span class="ty">${TYPE_LABEL[f.type]}</span><span class="tt">${rowTitle(f)}</span></button>`).join('');}
  return '';
}
function renderLeft(){
  let html='';const q=S.query;
  if(S.chain.length) html=chainLeft();
  else if(q.startsWith('>')) html=cmdLeft(q.slice(1).trim());
  else if(q.startsWith('?')) html=helpLeft();
  else if(/^t(\s|$)/i.test(q)&&q.trim().length<=1) html=timeLeftQuick();
  else if(S.mode==='search') html=q.trim()?resultsLeft():homeLeft();
  else if(S.mode==='inbox') html=inboxLeft();
  else if(S.mode==='notes') html=notesLeft();
  else if(S.mode==='sources') html=sourcesLeft();
  else if(S.mode==='actions') html=actionsLeft();
  else if(S.mode==='time') html=timeLeft();
  else if(S.mode==='standup') html=standupLeft();
  $('#left').innerHTML=html;
}

function drawCables(root){
  const svg=root.querySelector('svg.cables');const o=root.querySelector('[data-jack-origin]');if(!svg||!o)return;
  const R=root.getBoundingClientRect();if(!R.width)return;const O=o.getBoundingClientRect();
  const x1=O.left+O.width/2-R.left,y1=O.top+O.height/2-R.top;const color=root.dataset.color||'#2563EB';const dashed=root.hasAttribute('data-dashed');
  let d='';
  root.querySelectorAll('[data-jack-to]').forEach(j=>{const J=j.getBoundingClientRect();const x2=J.left+J.width/2-R.left,y2=J.top+J.height/2-R.top;const dx=x2-x1;const sag=Math.min(40,10+Math.abs(dx)*0.08+Math.abs(y2-y1)*0.1);
    d+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1+dx*0.45).toFixed(1)} ${(y1+sag).toFixed(1)}, ${(x2-dx*0.45).toFixed(1)} ${(y2+sag).toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"${dashed?' stroke-dasharray="6 5" opacity=".4"':''}/>`;});
  svg.setAttribute('viewBox',`0 0 ${R.width} ${R.height}`);svg.innerHTML=d;
}
function drawAll(){document.querySelectorAll('.patch,.mini').forEach(drawCables);}

function inboxAct(id,a){
  const i=INBOX.find(x=>x.id===id)||SNOOZED.find(x=>x.id===id);if(!i)return;
  const nextSub=()=>{const k=INBOX.indexOf(i);const n=INBOX[k+1]||INBOX[k-1];S.sub=n?n.id:(SNOOZED[0]?SNOOZED[0].id:null);};
  if(a==='done'){nextSub();INBOX=INBOX.filter(x=>x!==i);SNOOZED=SNOOZED.filter(x=>x!==i);toast('Done — removed from inbox');render();return;}
  if(a==='snooze'){nextSub();INBOX=INBOX.filter(x=>x!==i);i.returns='Mon 2026-08-25 09:00';SNOOZED.push(i);toast('Snoozed until Monday 09:00');render();return;}
  if(a==='unsnooze'){SNOOZED=SNOOZED.filter(x=>x!==i);i.when=nowLabel();INBOX.unshift(i);S.sub=i.id;toast('Back in the inbox');render();return;}
  if(a==='open'){nav(hashOf(E[i.ent]));return;}

  if(a==='reply'){openChain(i.ent,'comment');return;}

  S.su.saved=true;toast('Saved as note “Standup 2026-08-22”','notes');render();
}
function suPublish(){
  S.su.pub='publishing';render();
  setTimeout(()=>{S.su.pub='done';if(!E['PG-standup-0822'])add({id:'PG-standup-0822',type:'page',src:'confluence',slug:'standup-protocols-2026-08-22',title:'Standup protocol 2026-08-22',space:'ENG',edited:nowLabel(),by:'mara',body:PROTOCOL.map(p=>[p[0],p[1]]),comments:[],note:'parent: Standup protocols',text:'standup'});toast('Published to ENG › Standup protocols › 2026-08-22','confluence');render();},1000);
}
function suTicket(i){
  const a=ACTION_ITEMS[i];const key='PAY-'+(S.nextTicket++);
  add({id:key,type:'ticket',src:'jira',title:i===0?'Document manual-review queue SLA in SEPA payout retry design':a.t.replace(/<[^>]+>/g,''),itype:'Task',status:'To Do',priority:'Medium',assignee:a.who.toLowerCase(),updated:nowLabel(),epic:'PAY-200',desc:'From standup 2026-08-22: '+a.t.replace(/<[^>]+>/g,''),comments:[],worklogs:[],text:'sla manual review'});
  if(a.ent)LINKS.push([key,a.ent]);S.su.tickets[i]=key;toast(`Created ${key} from the action item`,'jira');render();
}

/* =========================================================
   EVENTS
   ========================================================= */
function act(a,el){
  const [k,...rest]=a.split(':');const arg=rest.join(':');const [p1,...p2]=rest;const p2s=p2.join(':');
  switch(k){
    case 'mode':{const m=p1;S.chain=[];if(m==='search'){S.query='';$('#q').value='';}nav(m==='search'?'#/search':'#/'+m);if(m==='search')$('#q').focus();return;}
    case 'timer-toggle':timerToggle();return;
    case 'timer-start':{const e=E[arg];if(!e)return;if(S.timer.running&&S.timer.ctx===e.id){stopTimer();return;}S.chain=[];setTimer(e.id,short(e),'entity');render();return;}
    case 'timer-label':{S.chain=[];S.query='';$('#q').value='';setTimer(null,arg,'label');render();return;}
    case 'chain-open':openChain(p1,p2s||'actions');return;
    case 'chain-pick':chainPick(arg);return;
    case 'chain-submit':chainSubmit();return;
    case 'chain-link':chainLink(arg);return;
    case 'chain-pop':chainPop();return;
    case 'chain-timerpick':S.chain=[{id:S.lastEntity||'PAY-231',label:'Timer',src:'label',kind:'actions'},{kind:'timerpick',label:'Start on…'}];S.query='';$('#q').value='';render();$('#q').focus();return;
    case 'chain-assign':S.day.pop=null;S.chain=[{id:'PAY-231',label:'Day review',src:'label',kind:'actions'},{kind:'link',label:'Assign block'}];S.assignBlock=+arg;S.query='';$('#q').value='';render();$('#q').focus();return;
    case 'status':{const e=E[p1];if(!e)return;const st=p2s;if(e.status!==st){e.status=st;e.updated=nowLabel();toast(`${e.id} → ${st}`,'jira');}S.chain=[];S.detail=e.id;S.query='';$('#q').value='';render();return;}
    case 'comment-add':{const ta=document.getElementById('cm-'+arg);if(!ta||!ta.value.trim()){toast('Write something first.');if(ta)ta.focus();return;}addComment(arg,ta.value);render();return;}
    case 'sug-confirm':confirmSug(arg);return;
    case 'sug-dismiss':{const s=SUG.find(x=>x.id===arg);SUG=SUG.filter(x=>x.id!==arg);toast(`Dismissed suggestion ${s?h(short(E[s.from]))+' → '+h(short(E[s.to])):''}`);render();return;}
    case 'filter-src':S.filters.src[arg]=!S.filters.src[arg];render();return;
    case 'filter-failing':S.filters.failing=!S.filters.failing;render();return;
    case 'filter-person':S.filters.person=S.filters.person===arg?null:arg;render();return;
    case 'filter-today':S.filters.today=!S.filters.today;render();return;
    case 'cmd':{const c=CMDS[+arg];if(!c)return;S.query='';$('#q').value='';if(c.act)act(c.act);else nav(c.go);return;}
    case 'ext':toast(`Opened ${h(arg)} in the browser`);return;
    case 'pr-approve':{const e=E[arg];e.approvals='1 of 2';e.approvedBy='you';e.reviewFrom='';INBOX=INBOX.filter(i=>i.ent!==e.id);toast(`Approved PR #${e.num}`,'gitea');render();return;}
    case 'pr-changes':openChain(arg,'comment');return;
    case 'rerun':rerun(arg);return;
    case 'inbox':inboxAct(p1,p2s);return;
    case 'note-new':createNote();return;
    case 'note-mode':S.noteEdit=arg==='edit';render();if(arg==='edit'){const b=document.getElementById('note-body');if(b)b.focus();}return;
    case 'note-save':saveNote(arg);return;
    case 'wiki-pick':wikiPick(arg);return;
    case 'sync-all':SRC_ORDER.forEach(k=>{if(k!=='teamcity'||!S.tc401){SRC[k].synced='just now';SYNC[k]='0m';}});toast(S.tc401?'Synced Jira, Confluence and Gitea · TeamCity still 401':'Synced all 4 sources');render();return;
    case 'src-sync':{const s=SRC[arg];if(arg==='teamcity'&&S.tc401){toast('TeamCity: 401 Unauthorized — re-enter the password first.','teamcity');return;}if(s){s.synced='just now';SYNC[arg]='0m';}toast(`Synced ${s?h(s.name):arg}`,arg);render();return;}
    case 'src-sched':{const s=SRC[p1]||S.srcExtra.find(x=>x.id===p1);if(s)s.sched=p2s;toast(`${h(s.name)} now syncs every ${p2s}`);render();return;}
    case 'src-remove':toast('Removing a source needs a confirmation step in the real app — not modelled here.');return;
    case 'src-pw-open':S.pw.open=true;render();{const f=document.getElementById('tc-pw');if(f)f.focus();}return;
    case 'src-pw-save':{const f=document.getElementById('tc-pw');if(!f||!f.value){toast('Enter the new password first.');if(f)f.focus();return;}S.pw.saving=true;render();
      setTimeout(()=>{S.tc401=false;S.pw={open:false,saving:false};SRC.teamcity.ok=true;SRC.teamcity.synced='just now';SYNC.teamcity='0m';Object.values(E).filter(e=>e.type==='build'&&e.status==='queued').forEach(e=>{e.status='running';e.step='step 1/5 · checkout';e.when='started '+nowLabel();});const p=S.pending;S.pending=0;toast(p?`TeamCity synced · sent ${p} queued write${p>1?'s':''}`:'TeamCity synced · 3 build configurations','teamcity');render();},1200);return;}
    case 'wiz-type':S.wiz.type=+arg;render();return;
    case 'wiz-next':{const u=document.getElementById('wiz-url');if(u)S.wiz.url=u.value.trim();S.wiz.step=Math.min(5,S.wiz.step+1);render();return;}
    case 'wiz-back':S.wiz.step=Math.max(0,S.wiz.step-1);render();return;
    case 'wiz-auth':S.wiz.auth=arg;render();return;
    case 'wiz-test':S.wiz.tested='running';render();setTimeout(()=>{S.wiz.tested='ok';render();},900);return;
    case 'wiz-sched':S.wiz.sched=arg;render();return;
    case 'wiz-save':{const w=S.wiz;const t=ADD_TYPES[w.type];const id='src'+(S.srcExtra.length+1);
      S.srcExtra.push({id,short:t[0].toUpperCase().slice(0,4),name:wizName(),type:t[0],url:wizUrl(),auth:({userpw:'User + password',pat:'Personal access token',api:'API token'})[w.auth],authNote:'',synced:'just now',count:'first sync running…',ok:true,adapter:t[0].toLowerCase().replace(/\s.*/,'')+' · adapter '+t[2],caps:t[3],color:t[1],sched:w.sched});
      toast(`Saved ${h(wizName())} · first sync started`,t[1]);S.wiz={step:0,type:null,url:'',auth:'pat',tested:null,sched:'5 min'};nav('#/sources/'+id);return;}
    case 'sw-timer':S.sw.timer=!S.sw.timer;render();return;
    case 'sw-run':runStartWork();return;
    case 'trig-env':S.trig.env=arg;render();return;
    case 'trig-clean':S.trig.clean=!S.trig.clean;render();return;
    case 'trig-run':triggerBuild();return;
    case 'ct-project':S.ct.project=arg;render();return;
    case 'ct-type':S.ct.type=arg;render();return;
    case 'ct-priority':S.ct.priority=arg;render();return;
    case 'ct-create':{const s=document.getElementById('ct-summary'),d=document.getElementById('ct-desc');if(s)S.ct.summary=s.value;if(d)S.ct.desc=d.value;if(createTicket())render();return;}
    case 'ct-reset':S.createdTicket=null;S.ct=null;render();return;
    case 'cp-parent':{const ti=document.getElementById('cp-title'),b=document.getElementById('cp-body');if(ti)S.cp.title=ti.value;if(b)S.cp.body=b.value;S.cp.parent=arg;render();return;}
    case 'cp-create':createPage();render();return;
    case 'cp-reset':S.createdPage=null;S.cp=null;render();return;
    case 'git-repo':{const g=S.git;const b=document.getElementById('git-branch'),r=document.getElementById('git-newrepo');if(b)g.branch=b.value;if(r)g.newRepo=r.value;g.repo=arg;render();return;}
    case 'git':gitOp(p1,p2s);return;
    case 'wl-check':S.wl.items[+arg]=!S.wl.items[+arg];S.wl.customComment=null;render();return;
    case 'wl-log':logWorklog();return;
    case 'wl-edit':{if(S.wl.edit){const ti=document.getElementById('wl-target'),du=document.getElementById('wl-dur'),cm=document.getElementById('wl-comment');if(ti)S.wl.target=ti.value;if(du)S.wl.dur=du.value.trim()||S.wl.dur;if(cm&&cm.value!==wlComment())S.wl.customComment=cm.value;}S.wl.edit=!S.wl.edit;render();return;}
    case 'wl-discard':S.wl.logged=false;toast('Draft discarded — the time stays tracked, not logged');nav('#/time');return;
    case 'day-sel':S.day.sel=+arg;S.day.pop=null;render();return;
    case 'day-pop':S.day.sel=+arg;S.day.pop=S.day.pop===+arg?null:+arg;render();return;
    case 'day-assign':assignBlock(+p1,p2s);return;
    case 'day-keep':{const b=TIME.blocks[+arg];b.local=true;toast(`“${h(b.label)}” kept local — not sent to Jira`);render();return;}
    case 'week-logall':{const amt=S.wl.logged?'2h 01m':TIME.unlogged;S.weekLogged=true;S.wl.logged=true;TIME.unloggedMin=0;E['PAY-231'].worklogs.push({when:'today',dur:'2h 44m',text:wlComment()});E['PAY-228'].worklogs.push({when:'today',dur:'55m',text:'Re-test partial refunds, standup note'});toast(`Logged ${amt} across PAY-231, PAY-228 and OPS-77`,'jira');render();return;}
    case 'su-save':suSave();return;
    case 'su-publish':suPublish();return;
    case 'su-ticket':suTicket(+arg);return;
  }
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){act(el.dataset.act,el);return;}
  ev.preventDefault();act(el.dataset.act,el);
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){S.query=t.value;S.selIdx=0;
    if(!S.chain.length&&S.mode!=='search'&&t.value.trim()){S.mode='search';if(!S.detail||!S.detail.startsWith('smart:'))S.detail=S.detail||'smart:failing';}
    renderBox();renderLeft();applySel(false);
    if(!S.chain.length&&S.mode==='search'){const rows=document.querySelectorAll('#left [data-sel][data-ent]');const first=rows[0];if(first&&t.value.trim()&&first.dataset.ent!==S.detail){S.detail=first.dataset.ent;renderRight();applySel(true);}}
    return;}
  if(t.id==='note-body')wikiPicker(t);
});
document.addEventListener('keydown',ev=>{
  const mod=ev.metaKey||ev.ctrlKey;const q=$('#q');
  if(mod&&ev.key.toLowerCase()==='k'){ev.preventDefault();S.chain=[];if(S.mode!=='search'){S.mode='search';render();}q.focus();q.select();return;}
  if(mod&&ev.key.toLowerCase()==='t'){ev.preventDefault();timerToggle();return;}
  if(ev.key==='Escape'){
    const pop=document.getElementById('wikipop');if(pop&&!pop.hidden){pop.hidden=true;S.pickerOpen=false;return;}
    if(S.day.pop!==null){S.day.pop=null;render();return;}
    if(S.chain.length){chainPop();return;}
    if(S.query){S.query='';q.value='';S.selIdx=0;render();q.focus();return;}
    if(document.activeElement!==q){q.focus();return;}
    q.blur();return;}
  if(document.activeElement!==q)return;
  const rows=[...document.querySelectorAll('#left [data-sel]')];
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();if(!rows.length)return;S.selIdx=(S.selIdx+(ev.key==='ArrowDown'?1:-1)+rows.length)%rows.length;applySel(false);
    const r=rows[S.selIdx];r.scrollIntoView({block:'nearest'});
    if(r.dataset.ent&&(S.mode==='search'||S.mode==='notes')&&!S.chain.length){S.detail=r.dataset.ent;if(S.mode==='notes')S.sub=r.dataset.ent;renderRight();}
    else if(r.dataset.sub&&!S.chain.length){S.sub=r.dataset.sub;renderRight();}
    return;}
  if(ev.key==='Enter'){ev.preventDefault();const top=S.chain[S.chain.length-1];
    if(top&&top.kind==='comment'){chainSubmit();return;}
    if(top&&top.kind==='link'&&S.assignBlock!=null){const r=rows[S.selIdx];if(r&&r.dataset.act)act(r.dataset.act);return;}
    const r=rows[S.selIdx];if(r)r.click();return;}
  if(ev.key==='Tab'&&!ev.shiftKey&&!S.chain.length){const r=rows[S.selIdx];if(r&&r.dataset.ent&&E[r.dataset.ent]){ev.preventDefault();openChain(r.dataset.ent,'actions');}return;}
});
window.addEventListener('resize',drawAll);
window.addEventListener('hashchange',route);
let tickTimer=setInterval(()=>{const a=$('.t-elapsed');if(a)a.innerHTML=elapsedHtml();const b=document.getElementById('big-elapsed');if(b)b.innerHTML=elapsedHtml();},1000);

/* =========================================================
   ROUTING
   ========================================================= */
function findE(pred){const e=Object.values(E).find(pred);return e?e.id:null;}
function route(){
  const hash=location.hash||'#/';const parts=hash.replace(/^#\/?/,'').split('/').map(s=>{try{return decodeURIComponent(s);}catch(err){return s;}});const [a,b,c]=parts;
  S.chain=[];S.pickerOpen=false;S.day.pop=null;S.assignBlock=null;S.selIdx=0;
  let q=null;const setMode=(m,sub)=>{S.mode=m;S.sub=sub||null;};
  switch(a||''){
    case '':case 'search':setMode('search');q=b||'';if(!b&&!(S.detail&&S.detail.startsWith('smart:')))S.detail=S.detail||'smart:failing';break;
    case 'list':setMode('search');S.detail='smart:'+b;break;
    case 'ticket':setMode('search');S.detail=E[b]?b:'smart:failing';break;
    case 'pr':setMode('search');S.detail=findE(e=>e.type==='pr'&&e.num===+b)||'smart:failing';break;
    case 'build':setMode('search');S.detail=findE(e=>e.type==='build'&&e.num===+b)||'smart:failing';break;
    case 'page':setMode('search');S.detail=findE(e=>e.type==='page'&&e.slug===b)||'smart:failing';break;
    case 'commit':setMode('search');S.detail=findE(e=>e.type==='commit'&&e.sha===b)||'smart:failing';break;
    case 'repo':setMode('search');S.detail=findE(e=>e.type==='repo'&&e.name===b)||'smart:failing';break;
    case 'branch':setMode('search');S.detail=findE(e=>e.type==='branch'&&e.name===b)||'smart:failing';break;
    case 'person':setMode('search');S.detail='U-'+b;if(!E[S.detail])S.detail='smart:failing';break;
    case 'notes':{if(b==='new'){createNote();return;}const id=b?findE(e=>e.type==='note'&&e.slug===b):null;setMode('notes',id||findE(e=>e.type==='note'));if(id)S.lastEntity=id;S.noteEdit=false;break;}
    case 'inbox':setMode('inbox',b||(INBOX[0]?INBOX[0].id:(SNOOZED[0]?SNOOZED[0].id:null)));break;
    case 'sources':setMode('sources',b||'jira');break;
    case 'actions':setMode('actions',b||'start-work');S.actArg=c||null;if(b==='start-work'&&S.sw.state==='done'&&c&&c!=='PAY-240'){S.sw={state:'idle',done:0,timer:true};}break;
    case 'time':setMode('time',b||'timer');break;
    case 'standup':setMode('standup');break;
    case 'help':setMode('search');q='?';break;
    default:setMode('search');
  }
  if(q!==null){S.query=q;$('#q').value=q;}
  else if(S.mode!=='search'){S.query='';$('#q').value='';}
  render();
  if(S.mode==='search'&&S.detail&&E[S.detail])S.lastEntity=S.detail;
}
try{
  if(!location.hash)history.replaceState(null,'',location.pathname+'#/search/sepa%20retry');
  route();
  if(S.mode==='search'&&S.query==='sepa retry'){S.detail='PAY-231';render();S.lastEntity='PAY-231';}
  $('#q').focus();
}catch(err){const el=document.getElementById('errlog');el.textContent='INIT ERROR: '+err.message+'\n'+err.stack;console.error(err);}
window.addEventListener('error',ev=>{const el=document.getElementById('errlog');el.textContent+='\nRUNTIME ERROR: '+ev.message;});
</script>
