<!--
knobas mockup
paradigm: P1 Launcher
design: D5 Index card
thesis: Every source is one keystroke away — type, pick, Tab into an action, never leave the box.
thesis: Printed cards from Jira, the wiki, git and CI lie flat on a sage desk; your own notes are yellow index cards pinned on top of them.
thesis: Pinned index cards — a hand-filed note sits on the corner of the entity card it links to, and dragging a note onto a card pins it.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Tidewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#EEF2EC; --card:#FFFFFF; --edge:#D8E0D5; --shadow:rgba(39,49,43,.10);
  --text:#27312B; --muted:#6F7A72; --faint:#A3ACA6;
  --plum:#6B3F8A; --plum-soft:#EEE4FF; --moss:#4F7A3E; --moss-soft:#E1F2E4;
  --amber:#D9822B; --amber-soft:#FFE9D6; --red:#C4453A; --red-soft:#FBE3E0;
  --note:#FFF6C2; --note-edge:#E8D98A;
  --jira:#E4E9FF; --wiki:#EEE4FF; --git:#E1F2E4; --ci:#FFE9D6; --local:#FFF6C2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sh:0 1px 2px var(--shadow),0 6px 16px var(--shadow);
  --sh-lift:0 2px 4px var(--shadow),0 10px 24px var(--shadow);
  --r-card:12px; --r-ctl:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--desk);color:var(--text);font:14px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--plum)}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:12.5px}
h1,h2,h3{font-family:var(--display);font-variation-settings:"opsz" 32;font-weight:600;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--desk);border:1px solid var(--edge);border-radius:5px;padding:1px 5px;line-height:1.3}

/* ---------- app frame ---------- */
#app{height:100vh;display:grid;grid-template-rows:38px auto auto 1fr 26px;min-width:1100px}

/* strip */
.strip{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--edge);background:var(--desk)}
.strip .sp{flex:1}
.timer{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 6px;border-radius:999px;background:var(--card);border:1px solid var(--edge);box-shadow:0 1px 2px var(--shadow);font-weight:500}
.timer.running{border-color:var(--moss)}
.timer .ring{width:18px;height:18px}
.timer .el{font-family:var(--mono);font-size:12.5px;color:var(--moss)}
.timer.paused .el{color:var(--muted)}
.timer .ctx{color:var(--text)}
.timer .ctx.label{font-style:italic;color:var(--muted)}
.timer:hover{box-shadow:var(--sh)}
.sync{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);height:28px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--edge)}
.sync span{display:inline-flex;align-items:center;gap:5px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--moss);display:inline-block}
.sync .bad i{background:var(--red)}
.sync .bad{color:var(--red);font-weight:600}
.sync .warn i{background:var(--amber)}
.sync:hover{box-shadow:var(--sh)}
.ibtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--card);border:1px solid var(--edge);font-weight:500}
.ibtn:hover{box-shadow:var(--sh)}
.ibtn .cnt{min-width:18px;height:18px;border-radius:999px;background:var(--amber);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.ibtn.on{border-color:var(--plum);color:var(--plum)}
.strip .who{font-size:12.5px;color:var(--muted)}
.strip .who b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--plum);color:#fff;font-size:10.5px;font-weight:600;margin-right:6px}

/* the box */
.box-wrap{padding:10px 14px 0;position:relative}
.box{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px 0 8px;background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--sh)}
.box:focus-within{border-color:var(--plum);box-shadow:0 0 0 3px rgba(107,63,138,.14),var(--sh)}
.modes{display:flex;gap:2px;padding:3px;background:var(--desk);border-radius:999px}
.modes button{height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:5px}
.modes button:hover{color:var(--text)}
.modes button.on{background:var(--card);color:var(--plum);box-shadow:0 1px 2px var(--shadow)}
.modes button .cnt{font-size:10.5px;background:var(--amber);color:#fff;border-radius:999px;padding:0 5px;min-width:16px;text-align:center;font-weight:600}
.crumbs{display:flex;gap:4px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;background:var(--plum-soft);color:var(--plum);font-weight:500;font-size:12.5px;white-space:nowrap}
.crumb .x{opacity:.6}
.crumb .x:hover{opacity:1}
.box .mag{color:var(--faint);flex:none}
#q{flex:1;height:40px;border:0;background:transparent;font-size:16px;outline:none;min-width:120px}
#q::placeholder{color:var(--faint)}
.box kbd{flex:none}
.pop{position:absolute;left:14px;right:14px;top:66px;z-index:30;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:var(--sh-lift);max-height:420px;overflow:auto;display:none}
.pop.open{display:block}
.pop .ph{padding:8px 14px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.pop .pi{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;cursor:pointer;border-radius:8px;margin:0 6px}
.pop .pi:hover,.pop .pi.sel{background:var(--plum-soft)}
.pop .pi .k{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:60px}
.pop .pi .d{color:var(--muted);margin-left:auto;font-size:12.5px}
.pop .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 12px}

/* filters */
.filters{display:flex;align-items:center;gap:6px;padding:8px 14px 0;min-height:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--edge);background:var(--card);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--plum);color:var(--text)}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.chip.x{background:var(--moss-soft);border-color:var(--moss);color:var(--moss)}
.chip.x.on{background:var(--moss);color:#fff}
.filters .lbl{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:0 2px 0 6px}
.filters .lbl:first-child{margin-left:0}

/* body */
.body{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:14px;padding:12px 14px 10px;min-height:0}
.list,.pane{min-height:0;overflow:auto;padding:4px 4px 30px 4px;scrollbar-width:thin}
.pane{padding-right:6px}
.sech{font-family:var(--display);font-variation-settings:"opsz" 14;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 2px 6px}
.sech:first-child{margin-top:0}
.sech .n{color:var(--faint);font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;margin-left:6px}

/* result card rows */
.row{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px 6px 12px;margin:0 0 6px;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:0 1px 2px var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.row:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.row.sel{border-color:var(--plum);box-shadow:0 0 0 2px rgba(107,63,138,.18),var(--sh)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t .ti{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .su{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .key{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:4px}
.row .meta{font-size:12px;color:var(--faint);white-space:nowrap;font-family:var(--mono)}
.row .st{font-size:11.5px;white-space:nowrap}
.row.note{background:var(--note);border-color:var(--note-edge);background-image:repeating-linear-gradient(transparent 0 23px,rgba(0,0,0,.06) 23px 24px)}
.row .big{font-family:var(--display);font-variation-settings:"opsz" 24;font-size:18px;font-weight:700;min-width:62px;text-align:right;color:var(--text)}
.row .big.warn{color:var(--amber)}
.row.sl .t .ti{font-weight:600}
.row .badge{font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--plum-soft);color:var(--plum)}
.row .badge.new{background:var(--amber-soft);color:var(--amber)}
.row.dim{opacity:.55}
.row .acts{display:flex;gap:4px;flex-wrap:wrap}

/* source tab (index-card divider tab) */
.tab{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:6px 6px 3px 3px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text);flex:none;min-width:40px;justify-content:center}
.tab.jira{background:var(--jira)}.tab.wiki{background:var(--wiki)}.tab.git{background:var(--git)}.tab.ci{background:var(--ci)}.tab.local{background:var(--local);border:1px solid var(--note-edge)}.tab.time{background:var(--desk);border:1px solid var(--edge)}
.card>.tab{position:absolute;top:-11px;left:16px;height:22px;border-radius:8px 8px 0 0;border:1px solid var(--edge);border-bottom:0;box-shadow:0 -1px 2px var(--shadow)}

/* status chips */
.sc{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.sc.todo{background:var(--desk);color:var(--muted);border:1px solid var(--edge)}
.sc.prog{background:var(--jira);color:#34418C}
.sc.rev{background:var(--plum-soft);color:var(--plum)}
.sc.done,.sc.ok{background:var(--moss-soft);color:var(--moss)}
.sc.fail{background:var(--red-soft);color:var(--red)}
.sc.run{background:var(--amber-soft);color:var(--amber)}
.sc.run i,.sc.fail i,.sc.ok i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.sc.run i{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* detail cards */
.card{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:var(--sh);padding:22px 20px 18px;margin:12px 0 16px}
.card.dropping{border-color:var(--moss);box-shadow:0 0 0 3px rgba(79,122,62,.2),var(--sh)}
.card h1{font-size:22px;line-height:1.2;margin:4px 0 8px;font-variation-settings:"opsz" 48}
.card h1 .key{font-family:var(--mono);font-weight:400;font-size:14px;color:var(--muted);margin-right:8px}
.card h2{font-size:15px;margin:18px 0 8px;font-variation-settings:"opsz" 20}
.card h2 .n{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--faint);margin-left:6px}
.card p{margin:0 0 8px}
.card .desc{padding:12px 14px;background:var(--desk);border-radius:var(--r-ctl);line-height:1.55}
.card .desc code,.card .desc .mono{font-family:var(--mono);font-size:12.5px;background:rgba(255,255,255,.7);padding:0 4px;border-radius:4px}
.props{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 4px;align-items:center}
.prop{display:flex;align-items:center;gap:6px;font-size:13px}
.prop .l{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.prop .av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--plum-soft);color:var(--plum);font-size:9.5px;font-weight:700}
.hdr{display:flex;align-items:flex-start;gap:10px}
.hdr .grow{flex:1;min-width:0}
.hdr .tools{display:flex;gap:6px;flex:none;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--edge);background:var(--card);font-weight:500;font-size:13px;white-space:nowrap;transition:box-shadow .12s,transform .12s}
.btn:hover{box-shadow:var(--sh);border-color:var(--plum);color:var(--plum)}
.btn.p{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.p:hover{background:#5A3375;color:#fff}
.btn.m{background:var(--moss);border-color:var(--moss);color:#fff}
.btn.m:hover{background:#426832;color:#fff}
.btn.s{height:26px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--plum)}
.btn:disabled{opacity:.5;cursor:default}
.btn.done{background:var(--moss-soft);border-color:var(--moss);color:var(--moss)}
.btn.danger{color:var(--red)}
.sel-st{position:relative;display:inline-block}
.sel-st select{appearance:none;-webkit-appearance:none;height:24px;padding:0 22px 0 9px;border-radius:999px;border:1px solid var(--edge);background:var(--card);font-size:12px;font-weight:600;cursor:pointer}
.sel-st::after{content:"";position:absolute;right:9px;top:9px;border:4px solid transparent;border-top-color:var(--muted)}

/* links list */
.links{display:grid;gap:6px}
.lk{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border:1px solid var(--edge);border-radius:var(--r-ctl);cursor:pointer;background:var(--card)}
.lk:hover{border-color:var(--plum);box-shadow:var(--sh)}
.lk .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .t b{font-weight:500}
.lk .m{font-size:12px;color:var(--faint);font-family:var(--mono)}
.lk.note{background:var(--note);border-color:var(--note-edge)}
.sugg{display:grid;gap:6px}
.sg{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px dashed var(--edge);border-radius:var(--r-ctl);background:var(--desk)}
.sg .t{flex:1;min-width:0}
.sg .why{font-size:12px;color:var(--muted)}
.sg .why em{font-style:normal;font-family:var(--mono);font-size:11.5px}
.sg.ok{border-style:solid;border-color:var(--moss);background:var(--moss-soft)}
.sg.gone{display:none}

/* comments */
.cm{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--edge)}
.cm:first-child{border-top:0}
.cm .av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--plum-soft);color:var(--plum);font-size:11px;font-weight:700;flex:none}
.cm .b{flex:1}
.cm .h{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.cm .h b{color:var(--text);font-weight:600}
.cm.new{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.addc{display:flex;gap:8px;margin-top:8px}
.addc input,.field input,.field textarea,.field select{flex:1;height:36px;padding:0 12px;border:1px solid var(--edge);border-radius:var(--r-ctl);background:var(--card);outline:none}
.addc input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(107,63,138,.14)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical;line-height:1.5}
.field select{appearance:none;-webkit-appearance:none}
.field .row2{display:flex;gap:10px}
.field .row2>*{flex:1}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--edge)}
.table td{padding:8px;border-bottom:1px solid var(--edge);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .mono{color:var(--muted)}
pre.log{font-family:var(--mono);font-size:12px;line-height:1.55;background:#27312B;color:#E6EDE8;padding:12px 14px;border-radius:var(--r-ctl);overflow:auto;white-space:pre}
pre.log .f{color:#FFB0A6}
pre.log .ok{color:#B7E3A9}
.ch{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--edge);border-radius:var(--r-ctl);margin-bottom:6px}
.ch .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;flex:none;font-size:12px}
.ch.busy .ck{border-color:var(--amber);border-top-color:transparent;animation:spin .8s linear infinite}
.ch.ok .ck{background:var(--moss);border-color:var(--moss);color:#fff}
.ch.ok{background:var(--moss-soft);border-color:var(--moss-soft)}
.ch .t{flex:1}
.ch .m{font-family:var(--mono);font-size:12px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.files{font-family:var(--mono);font-size:12.5px}
.files div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--edge)}
.files .add{color:var(--moss)}.files .del{color:var(--red)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--edge);border-radius:var(--r-card)}
.empty b{display:block;color:var(--text);font-family:var(--display);font-size:16px;margin-bottom:4px}

/* ---------- note index cards (signature) ---------- */
.note-card{position:relative;background:var(--note);border:1px solid var(--note-edge);border-radius:10px;padding:26px 16px 14px;box-shadow:var(--sh);background-image:repeating-linear-gradient(transparent 0 23px,rgba(0,0,0,.06) 23px 24px);background-position:0 26px;transform:rotate(var(--rot,0deg));transition:transform .12s,box-shadow .12s}
.note-card .ttl{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:4px;line-height:24px}
.note-card .bd{font-size:13px;line-height:24px;color:var(--text)}
.note-card .meta{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:24px}
.note-card .pin{position:absolute;top:-9px;left:50%;margin-left:-9px;width:18px;height:26px}
.note-card .tape{position:absolute;top:-8px;left:50%;width:64px;height:18px;margin-left:-32px;background:rgba(255,255,255,.45);border:1px solid rgba(0,0,0,.06);transform:rotate(-2deg);border-radius:2px}
.note-card.draggable{cursor:grab}
.note-card.draggable:active{cursor:grabbing}
.note-card:hover{box-shadow:var(--sh-lift);transform:rotate(var(--rot,0deg)) translateY(-1px)}
.note-card.drop{animation:pindrop .2s ease-out}
@keyframes pindrop{from{transform:rotate(var(--rot,0deg)) scale(1.15);box-shadow:0 14px 30px var(--shadow)}}
.pinned{position:absolute;right:-10px;top:-14px;width:230px;z-index:3}
.card.has-pin>.hdr{padding-right:238px}
.card.has-pin>.hdr .tools{flex-wrap:wrap;justify-content:flex-end}
.pinned .note-card{padding:22px 14px 10px}
.pinned .note-card .bd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pinned.two .note-card+.note-card{margin-top:-30px;margin-left:18px}
.desk-notes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:12px 6px 6px}
.chipE{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--card);border:1px solid var(--edge);font-size:12px;font-weight:500;color:var(--plum);cursor:pointer;vertical-align:middle;line-height:1}
.chipE:hover{border-color:var(--plum);box-shadow:var(--sh)}
.chipE .tab{height:14px;font-size:9px;padding:0 4px;min-width:0;border-radius:4px}
.editor{min-height:300px;font-size:14px;line-height:24px;outline:none;white-space:pre-wrap}
.editor:focus{box-shadow:none}
.ed-title{font-family:var(--display);font-size:20px;font-weight:600;line-height:24px;outline:none;margin-bottom:6px}

function searchText(e){

const TYPE_ORDER={ticket:0,page:1,pr:2,commit:3,build:4,note:5,branch:6,repo:7};
const TYPE_NM={ticket:'Ticket',page:'Page',pr:'Pull request',commit:'Commit',build:'Build',note:'Note',branch:'Branch',repo:'Repo'};
function search(q){
  let query=q.trim(),srcF=S.filters.src,typeF=S.filters.type,whoF=S.filters.who,whenF=S.filters.when;
  if(query.startsWith('/')){const m=query.match(/^\/(\w+)\s*(.*)$/);if(m){srcF={jira:'jira',wiki:'wiki',confluence:'wiki',git:'git',gitea:'git',ci:'ci',teamcity:'ci',notes:'local',note:'local'}[m[1].toLowerCase()]||srcF;query=m[2]}}
  if(query.startsWith('#')){typeF='ticket';query=query.slice(1)}
  if(query.startsWith('@')){whoF=query.slice(1).toLowerCase().split(' ')[0]||'all';query=query.slice(1).split(' ').slice(1).join(' ')}
  const toks=query.toLowerCase().split(/\s+/).filter(Boolean);
  let res=Object.values(E).filter(e=>e.type!=='branch'||toks.length).filter(e=>{
    if(srcF!=='all'&&e.src!==srcF)return false;
    if(typeF!=='all'&&e.type!==typeF)return false;
    if(whoF!=='all'){const who=(e.assignee||e.by||'');if(!who.startsWith(whoF)&&!(e.comments||[]).some(c=>c.who.startsWith(whoF)))return false}
    if(whenF==='today'&&!(e.updated||'').startsWith('today'))return false;
    if(whenF==='week'&&!/today|yesterday|2026-08-(18|19|20|21|22)/.test(e.updated||''))return false;
    if(S.filters.failing){if(e.type!=='ticket')return false;if(!linked(e.id).some(x=>E[x].type==='build'&&E[x].st==='failed'))return false}
    const t=searchText(e);return toks.every(k=>t.includes(k));
  });
  res.sort((a,b)=>(TYPE_ORDER[a.type]-TYPE_ORDER[b.type])||String(b.updated).localeCompare(String(a.updated)));
  if(!toks.length&&!S.filters.failing&&srcF==='all'&&typeF==='all'&&whoF==='all'&&whenF==='all')res=[];

}

    const recent=['PAY-231','PR-142','PG-sepa-design','B-1187','PAY-240'].map(id=>E[id]);

  if(!RES.length){L.innerHTML=`<div class="empty"><b>No matches for "${esc(q)}"</b>Try fewer words, a prefix like <kbd>#</kbd> or <kbd>/jira</kbd>, or clear the filters.</div>`;return}
  let html='',last=null;
  RES.forEach((e,i)=>{if(e.type!==last){last=e.type;html+=`<div class="sech">${TYPE_NM[e.type]}${e.type==='note'?'s':'s'}</div>`.replace('Pull requests','Pull requests').replace('Branchs','Branches').replace('Repos','Repos')}html+=resultRow(e,i)});

  L.innerHTML=html;
}

function entityCard(e){
  const pinned=e.type!=='note'?notesFor(e.id):[];

  S.justPinned=null;
  let body='';
  if(e.type==='ticket')body=ticketBody(e);
  else if(e.type==='pr')body=prBody(e);
  else if(e.type==='build')body=buildBody(e);
  else if(e.type==='page')body=pageBody(e);
  else if(e.type==='note')return noteEditor(e);
  else if(e.type==='commit')body=commitBody(e);
  else if(e.type==='branch')body=branchBody(e);
  else if(e.type==='repo')body=repoBody(e);
  const touches=s=>s.from===e.id||s.to===e.id;
  const sug=SUGG.filter(s=>touches(s)&&!S.dismissedSugg.includes(s.id)&&!isLinked(s.from,s.to));
  const sugOk=SUGG.filter(s=>touches(s)&&!S.dismissedSugg.includes(s.id)&&isLinked(s.from,s.to));
  const links=linked(e.id);
  const linksHtml=e.type==='note'?'':`<h2>Links <span class="n">${links.length} confirmed</span></h2><div class="links">${links.map(id=>linkRow(E[id])).join('')}${links.length?'':'<div class="empty" style="padding:12px">No confirmed links yet.</div>'}</div>

  <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="btn" data-linkto="${e.id}">⛓ Link to…</button><button class="btn" data-newnote>Pin a new note</button>${pinned.length?'':'<span style="color:var(--faint);font-size:12px;align-self:center">Drag a note card here to pin it</span>'}</div>`;
  return `<div class="card ent ${pinned.length?'has-pin':''}" data-drop="${e.id}" style="margin-top:${pinned.length?'24px':'14px'}">${tab(e.src)}${pinHtml}${body}${linksHtml}</div>`;

/* note editor — a big index card */

  const links=noteLinks(n),back=Object.values(E).filter(e=>e.type!=='note'&&links.includes(e.id));
  const backNotes=Object.values(E).filter(e=>e.type==='note'&&e.id!==n.id&&noteLinks(e).some(id=>links.includes(id)));
  const rendered=esc(n.body).replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{const id=resolveWiki(t);return id?`<span class="chipE" contenteditable="false" data-go="${id}">${tab(E[id].src)}${esc(label(E[id]))}</span>`:m});

  <h2>Backlinks <span class="n">${back.length+backNotes.length}</span></h2><div class="links">${back.map(e=>`<div class="lk" data-go="${e.id}">${tab(e.src)}<div class="t"><b>${esc(label(e))}</b> · ${esc(e.title)}<span style="color:var(--faint)"> — this card is pinned on it</span></div></div>`).join('')}${backNotes.map(e=>`<div class="lk note" data-go="${e.id}">${tab('local')}<div class="t"><b>${esc(e.title)}</b> — shares a link</div></div>`).join('')}</div></div>`;

/* ---------- sources ---------- */
function sourceDetail(s){

  const cls={jira:'jira',confluence:'wiki',gitea:'git',teamcity:'ci'}[s.id];
  return `<div class="card" style="margin-top:14px"><span class="tab ${cls}">${SRC[cls].nm}</span><div class="hdr"><div class="grow"><h1>${esc(s.nm)}</h1><div class="props"><span class="prop"><span class="l">Type</span>${esc(s.type)}</span><span class="prop"><span class="l">Adapter</span><span class="mono">${esc(s.ad)}</span> <span style="color:var(--faint)">· pluggable module</span></span><span class="prop"><span class="l">Schedule</span>every 5 min</span></div></div><div class="tools"><button class="btn" data-syncone="${s.id}">↻ Sync now</button><button class="btn" data-tabact="src:${s.id}">Actions ⇥</button></div></div>
  ${s.state==='err'?`<div class="res bad"><b>Sync failed 38 min ago: 401 Unauthorized.</b> The password for <span class="mono">${esc(s.url)}</span> may have expired. Builds and logs shown are from the last good sync.<div style="margin-top:8px;display:flex;gap:6px"><button class="btn p" data-repass="${s.id}">Re-enter password</button><button class="btn" data-snoozesrc>Remind me Monday</button></div></div>`:''}
  ${s.warn?`<div class="res" style="background:var(--amber-soft);color:var(--amber)"><b>PAT expires 2026-09-03 — in 12 days.</b> Confluence shares this token. <button class="btn s" style="margin-left:8px" data-rotate="${s.id}">Rotate token…</button></div>`:''}
  <div class="kv"><span class="k">URL</span><span class="mono">${esc(s.url)}</span><span class="k">Auth</span><span>${esc(s.auth)}</span><span class="k">Sync state</span><span class="${s.state==='err'?'mono':''}" style="${s.state==='err'?'color:var(--red)':''}">${esc(s.st)}</span></div>
  <h2>Capabilities <span class="n">what this adapter can do</span></h2><div class="caps">${['search','write','webhooks','worklogs','branches','pull requests','trigger builds','logs'].map(c=>`<span class="${s.caps.includes(c)?'on':''}">${s.caps.includes(c)?'✓ ':''}${c}</span>`).join('')}</div>
  <div id="srcres"></div></div>`;
}
function wizard(){
  const w=S.wiz;const steps=['Type','URL','Auth','Test connection','Schedule'];
  const head=`<div class="steps">${steps.map((s,i)=>`<span class="${i===w.step?'on':i<w.step?'ok':''}">${i<w.step?'✓ ':''}${s}</span>`).join('')}</div>`;
  let body='';
  if(w.step===0)body=`<h2 style="margin-top:0">Which kind of source?</h2><div class="typegrid">${SRCTYPES.map(t=>`<button class="typ ${w.type===t[0]?'on':''}" data-wtype="${t[0]}"><span class="ic tab ${t[1]}">${t[0].slice(0,2)}</span><div><div style="font-weight:600">${t[0]}</div><div class="v">adapter ${t[2]} · ${t[3]}</div></div></button>`).join('')}</div>`;
  if(w.step===1)body=`<h2 style="margin-top:0">Where is ${esc(w.type)}?</h2><div class="field"><label>Base URL</label><input id="wurl" value="${esc(w.url||'https://')}" placeholder="https://…" autofocus></div><p style="color:var(--muted);font-size:12.5px">The ${esc(w.type)} adapter ${esc((SRCTYPES.find(t=>t[0]===w.type)||[])[2]||'')} will discover projects after the first sync.</p>`;
  if(w.step===2)body=`<h2 style="margin-top:0">How should knobas sign in?</h2><div class="links">${[['pw','User + password','stored in the system keychain'],['pat','Personal access token (PAT)','recommended — scoped, revocable'],['api','API token','for Cloud-hosted sources'],['oauth','OAuth','coming soon']].map(a=>`<div class="lk ${w.auth===a[0]?'':''}" data-wauth="${a[0]}" style="${a[0]==='oauth'?'opacity:.5;pointer-events:none':''}${w.auth===a[0]?';border-color:var(--plum);box-shadow:var(--sh)':''}"><div class="t"><b>${a[1]}</b> <span style="color:var(--muted)">· ${a[2]}</span></div>${w.auth===a[0]?'<span class="sc ok">selected</span>':''}</div>`).join('')}</div>${w.auth&&w.auth!=='oauth'?`<div class="field" style="margin-top:12px"><label>${w.auth==='pw'?'User name':w.auth==='pat'?'Token':'API token'}</label><input id="wsecret" value="${w.auth==='pw'?'mara.lindqvist':''}" placeholder="${w.auth==='pw'?'user name':'paste token'}"></div>${w.auth==='pw'?'<div class="field"><label>Password</label><input type="password" value="••••••••••"></div>':''}`:''}`;
  if(w.step===3)body=`<h2 style="margin-top:0">Test connection</h2><div class="kv"><span class="k">Source</span><span>${esc(w.type)} · <span class="mono">${esc(w.url)}</span></span><span class="k">Auth</span><span>${({pw:'user + password',pat:'PAT',api:'API token'})[w.auth]}</span></div>${w.test==='busy'?'<div class="res busy">Connecting to '+esc(w.url)+'…</div>':w.test==='ok'?`<div class="res ok">✓ Connected as <b>mara.lindqvist</b> · ${esc(w.type)} ${w.type==='GitHub'?'API v2022-11-28':'API reachable'} · 3 projects visible · adapter ${esc((SRCTYPES.find(t=>t[0]===w.type)||[])[2]||'')} supports search, write</div>`:w.test==='bad'?'<div class="res bad">✕ 401 Unauthorized — the token was rejected. Check it has read scope and try again.</div>':''}<button class="btn p" data-wtest>${w.test==='ok'?'Test again':'Test connection'}</button>`;
  if(w.step===4)body=`<h2 style="margin-top:0">How often should it sync?</h2><div class="field"><label>Schedule</label><select id="wsched"><option>Every 5 minutes (same as the others)</option><option>Every 15 minutes</option><option>Hourly</option><option>Manual only</option></select></div><div class="field"><label>Display name</label><input id="wname" value="${esc(w.name||(w.url||'').replace(/^https?:\/\//,''))}"></div><div class="kv"><span class="k">Webhooks</span><span>enabled if the adapter supports them</span><span class="k">Local index</span><span>full-text, built after first sync</span></div>`;
  const canNext=w.step===0?!!w.type:w.step===1?!!(w.url&&w.url.length>8):w.step===2?!!(w.auth&&w.auth!=='oauth'):w.step===3?w.test==='ok':true;
  return `<div class="card" style="margin-top:14px"><span class="tab time">Add source</span><h1>Add a source <span style="font-family:var(--mono);font-weight:400;font-size:13px;color:var(--faint)">step ${w.step+1} of 5</span></h1>${head}${body}
  <div style="display:flex;gap:6px;margin-top:16px"><button class="btn" data-wback ${w.step===0?'disabled':''}>← Back</button><span style="flex:1"></span><button class="btn" data-wcancel>Cancel</button><button class="btn ${w.step===4?'m':'p'}" data-wnext ${canNext?'':'disabled'}>${w.step===4?'Save source':'Continue →'}</button></div></div>`;
}

/* ---------- time ---------- */
function mins(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function timePane(){
  if(S.sub==='week'||S.sub==='stop'||S.sub==='switch')return weekPane();
  return dayPane()+weekPane(true);
}
function dayPane(){
  const start=mins('08:30'),end=mins('14:32'),span=end-start;
  const blocks=BLOCKS.map((b,i)=>{const l=(mins(b.s)-start)/span*100,w=(mins(b.e)-mins(b.s))/span*100;return `<div class="blk ${b.kind} ${S.timeSel===i?'sel':''}" style="left:${l}%;width:${w}%" data-blk="${i}" title="${b.s}–${b.e} · ${esc(b.tx)}">${esc(S.labelAssigned[i]||b.tx)}</div>`}).join('');
  const axis=['08:30','09:00','10:00','11:00','12:00','13:00','14:00','14:32'].map(t=>`<span style="left:${(mins(t)-start)/span*100}%">${t}</span>`).join('');
  const sel=S.timeSel!=null?BLOCKS[S.timeSel]:null;
  let selHtml='';
  if(sel){
    if(sel.kind==='un'&&!S.labelAssigned[S.timeSel])selHtml=`<div class="res" style="background:var(--amber-soft);color:var(--text)"><b>11:50–12:20 · 30 min unattributed.</b> The app was open but no card was selected. Assign it: <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${['PAY-231','PAY-228','PAY-240'].map(id=>`<button class="btn s" data-assignto="${S.timeSel}|${id}">${id}</button>`).join('')}<button class="btn s" data-assignto="${S.timeSel}|label">Ad-hoc label…</button><button class="btn s ghost" data-assignto="${S.timeSel}|merge">Merge into 09:40 block</button></div></div>`;
    else if(sel.label&&!S.labelAssigned[S.timeSel])selHtml=`<div class="res" style="background:var(--desk);color:var(--text)"><b>13:10–13:58 · "Staging DB configuration"</b> — a manual label with no ticket. <div style="display:flex;gap:6px;margin-top:8px"><button class="btn s p" data-assignto="${S.timeSel}|OPS-77">Log to a ticket… (suggest OPS-77)</button><button class="btn s" data-assignto="${S.timeSel}|local">Keep local only</button></div></div>`;
    else if(sel.kind==='gap')selHtml=`<div class="res busy">12:20–13:10 · no activity (lunch). Gaps are never logged.</div>`;
    else selHtml=`<div class="res busy">${sel.s}–${sel.live?'now':sel.e} · ${esc(S.labelAssigned[S.timeSel]||sel.tx)} · ${sel.kind==='man'?'manual timer':'passive, from what was open in the app'}${sel.live?' · running':''}</div>`;
  }
  return `<div class="card" style="margin-top:14px"><span class="tab time">Day review</span><div class="hdr"><div class="grow"><h1>Friday 22 August</h1><p style="color:var(--muted)">08:30–14:32 · 5h 28m tracked · 0h logged · blocks come from what was open in the app, never from git branches</p></div><div class="tools"><button class="btn p" data-stoptimer>Stop timer and log 2h 44m</button></div></div>
  <div class="strip-day">${blocks}<div class="axis">${axis}</div></div><div class="legend"><span><i style="background:var(--jira)"></i>passive</span><span><i style="background:var(--moss-soft)"></i>manual timer</span><span><i style="background:var(--desk);border:1px dashed var(--edge)"></i>ad-hoc label</span><span><i style="background:var(--amber-soft);border:1px dashed var(--amber)"></i>unattributed — assign</span></div>${selHtml}</div>`;
}
function weekPane(short){
  const max=8;

const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function elapsedSec(){const t=S.timer;return t.base+(t.running?Math.floor((Date.now()-t.t0)/1000):0)}
function fmtHM(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+':'+String(m).padStart(2,'0')}
function fmtLong(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+'h ':'')+m+'m'}
function tick(){
  const s=elapsedSec();
  const el=$('#timerEl');if(el)el.textContent=fmtHM(s);
  const arc=$('#ringArc');
  const mins=REDUCED?Math.floor(s/60):s/60;           /* the ring is an hour dial, not a second hand */
  if(arc)arc.setAttribute('stroke-dashoffset',(50.3*(1-(mins%60)/60)).toFixed(1));
}
setInterval(tick,1000);
function stopTimer(){if(!S.timer.running)return;S.timer.base=elapsedSec();S.timer.running=false;openWorklog()}

function runPop(pid){
  if(!S.pop)return;
  if(S.pop==='timer'){closePop();
    if(pid==='stop')return stopTimer();
    if(pid==='start')return startTimer();
    if(pid==='switch')return chain(null,'timerctx');
    if(pid==='day')return go('#/time/review');
    return;}
  if(S.pop.startsWith('act:')){
    const id=S.pop.slice(4),e=E[id];closePop();
    if(pid==='status'||pid==='comment'||pid==='link')return chain(id,pid);
    if(pid==='timer')return (S.timer.running&&S.timer.ctx===id)?stopTimer():startTimer(id);
    if(pid==='startwork')return go('#/actions/start-work');
    if(pid==='rerun')return go('#/actions/rerun');
    if(pid==='checks')return openEnt('B-1187');
    if(pid==='note')return newNote(id);
    if(pid==='open'){const u=SOURCES.find(s=>({jira:'jira',wiki:'confluence',git:'gitea',ci:'teamcity'})[e.src]===s.id);return toast(`Opened <span class="mono">${esc((u&&u.url)||'')}</span> in your browser.`)}
    return;
  }
  const c=S.chain;if(!c)return;
  if(c.kind==='status'){setStatus(c.ent,pid);endChain();return}
  if(c.kind==='link'){addLink(c.ent,pid);endChain();return}
  if(c.kind==='timerctx'){
    if(pid==='__label'){const v=$('#q').value.trim();endChain();startTimer(null,v||'Staging DB configuration')}
    else{endChain();startTimer(pid)}
    return;
  }
}
/* ---- chain: result → Tab → action → parameters → result, all in the box ---- */
let pendingChain=null;
function chain(id,kind){
  if(id&&S.entity!==id){
    const e=E[id];if(!e)return;
    S.entity=id;
    if(e.type==='note')S.mode='notes';
    else if(!['search','inbox','notes','standup'].includes(S.mode))S.mode='search';
    else if(S.mode==='standup')S.standupPeek=true;
    try{history.replaceState(null,'',hashFor(e))}catch(err){}
  }
  S.chain={ent:id,kind,
    crumbs:[id?label(E[id]):'Timer',{comment:'Comment',status:'Change status',link:'Link to…',timerctx:'Switch context'}[kind]],
    ph:{comment:'Type the comment and press ↵ — it posts to '+(id?label(E[id]):''),status:'Pick the new status below',link:'Type to find a ticket, PR, build, page or note…',timerctx:'Type an entity — or any words for an ad-hoc label'}[kind]};
  render();$('#q').value='';$('#q').focus();
  if(kind==='status'){popItems(['To Do','In Progress','In Review','Done'].filter(s=>s!==E[id].status).map(s=>({id:s,nm:esc(E[id].key)+' → <b>'+s+'</b>'})),'Change status');S.pop='chain'}
  if(kind==='link'||kind==='timerctx')chainPop();
}
function endChain(){S.chain=null;closePop();$('#q').value='';render()}
function chainPop(){
  const c=S.chain;if(!c)return;
  const q=$('#q').value.trim().toLowerCase();
  let cands=Object.values(E).filter(e=>e.id!==c.ent&&e.type!=='branch');
  if(c.kind==='link')cands=cands.filter(e=>!isLinked(c.ent,e.id));
  if(q)cands=cands.filter(e=>searchText(e).includes(q));
  cands=cands.slice(0,7);
  const items=cands.map(e=>({id:e.id,nm:`<span class="tab ${e.src}" style="margin-right:6px">${SRC[e.src].nm}</span>${esc(label(e))}`,d:esc(e.type==='ticket'?e.title:e.title!==label(e)?e.title:TYPE_NM[e.type])}));
  if(c.kind==='timerctx')items.push({id:'__label',nm:'Ad-hoc label: <b>'+esc($('#q').value.trim()||'Staging DB configuration')+'</b>',d:'no ticket'});
  popItems(items,c.kind==='link'?'Link '+esc(label(E[c.ent]))+' to…':'Timer context');
  S.pop='chain';
}
function runChainEnter(){
  const c=S.chain;if(!c)return true;
  if(c.kind==='comment'){const v=$('#q').value.trim();if(!v)return true;addComment(c.ent,v);endChain();return true}
  const sel=$('#pop .pi.sel');if(sel){runPop(sel.dataset.pop);return true}
  return true;
}

      <label style="font-size:12px;color:var(--muted)">Target <select id="wlTarget" style="height:30px;padding:0 8px;border:1px solid var(--edge);border-radius:8px;margin-left:6px">${['PAY-231','PAY-228','PAY-240','OPS-77'].map(k=>`<option ${k===w.target?'selected':''}>${k}</option>`).join('')}<option ${w.target==='none'?'selected':''} value="none">no ticket — keep local</option></select></label>`
      :`<span class="mono">09:40–11:50</span><span style="color:var(--faint)">+</span><span class="mono">13:58–14:32</span><span style="color:var(--faint)">=</span><b class="mono" style="font-size:15px">${dur}</b>
      <span style="color:var(--faint)">→</span>${w.target==='none'?'<span style="color:var(--muted)">local only</span>':chipE(w.target)}`}</div>
    <div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin:10px 0 2px">Activity in that interval</div>
    ${WLACT.map((a,i)=>`<label class="tick"><input type="checkbox" data-wl="${i}" ${w.acts[i]?'checked':''}><span class="sec">${a.t}</span><span class="when">${a.w}</span></label>`).join('')}
    <textarea id="wlTx" aria-label="Worklog comment">${esc(w.tx!==null?w.tx:wlComment())}</textarea>
    <div style="display:flex;gap:6px;margin-top:12px;align-items:center">
      ${w.logged?`<button class="btn done" disabled>✓ Logged to ${esc(w.target)}</button><button class="btn" data-wl-close>Close</button>`
      :`<button class="btn m" data-wl-log>Log ${dur} to ${w.target==='none'?'local time':esc(w.target)}</button>
        <button class="btn" data-wl-edit>${w.edit?'Done editing':'Edit'}</button>
        <button class="btn danger" data-wl-discard>Discard</button>`}
      <span style="flex:1"></span><span style="font-size:12px;color:var(--muted)">Unlogged this week: <b>${S.weekLogged?'0h':'4h 45m'}</b></span>
    </div></div>`);
  const o=$('#overlay');
  o.querySelectorAll('[data-wl]').forEach(c=>c.onchange=()=>{S.wl.acts[+c.dataset.wl]=c.checked;S.wl.tx=null;$('#wlTx').value=wlComment()});
  const tx=o.querySelector('#wlTx');if(tx)tx.oninput=()=>S.wl.tx=tx.value;
  const dr=o.querySelector('#wlDur');if(dr)dr.oninput=()=>{const m=dr.value.match(/(?:(\d+)h)?\s*(\d+)m/);if(m)S.wl.mins=(+(m[1]||0))*60+(+m[2])};
  const tg=o.querySelector('#wlTarget');if(tg)tg.onchange=()=>{S.wl.target=tg.value;S.wl.tx=null;drawWorklog()};
  const b=sel=>o.querySelector('['+sel+']');
  if(b('data-wl-edit'))b('data-wl-edit').onclick=()=>{S.wl.edit=!S.wl.edit;drawWorklog()};
  if(b('data-wl-close'))b('data-wl-close').onclick=closeOverlay;
  if(b('data-wl-discard'))b('data-wl-discard').onclick=()=>{closeOverlay();toast('Draft discarded. The 2h 44m stays tracked but unlogged.','warn')};
  if(b('data-wl-log'))b('data-wl-log').onclick=()=>{
    const w=S.wl,dur=fmtLong(w.mins*60),txt=(o.querySelector('#wlTx')||{}).value||wlComment();
    if(w.target!=='none'){E[w.target].worklogs.push({when:'today',who:'mara',d:dur,tx:txt});E[w.target].spent='9h 14m'}
    w.logged=true;S.timer.running=false;S.timer.base=0;
    drawWorklog();render();
    toast(w.target==='none'?`Kept ${dur} local — nothing sent to Jira.`:`Logged <b>${dur}</b> to <b>${esc(w.target)}</b>.`,'ok');
    setTimeout(closeOverlay,1600);
  };
}

   <div style="padding:14px 16px 16px">
    <div class="res bad">Sync failed 38 min ago: <b>401 Unauthorized</b>. The password expired at the end of August. Enter the new one to resume syncing builds and logs.</div>
    <div class="field"><label>User</label><input value="mara.lindqvist" readonly style="color:var(--muted)"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" placeholder="New TeamCity password"></div>
    <div id="pwres"></div>

   </div></div>`);
  $('#pwCancel').onclick=closeOverlay;
  $('#pwSave').onclick=()=>{

    $('#pwres').innerHTML='<div class="res busy">Testing against ci.tidewater.internal…</div>';
    setTimeout(()=>{

      const s=SOURCES.find(x=>x.id==='teamcity');s.state='ok';s.st='synced just now · 3 build configurations';

/* ================= [[ picker inside the note editor ================= */
function wikiCtx(){
  const sel=window.getSelection();if(!sel||!sel.rangeCount)return null;
  const node=sel.anchorNode;if(!node||node.nodeType!==3)return null;
  const before=node.textContent.slice(0,sel.anchorOffset);
  const i=before.lastIndexOf('[[');if(i<0)return null;
  const q=before.slice(i+2);if(/[\]\n]/.test(q))return null;
  return {node,start:i,end:sel.anchorOffset,q};
}
function openWikiPop(){
  const c=wikiCtx();if(!c){closePop();return}
  S.wikiCtx=c;S.pop='wiki';
  const q=c.q.toLowerCase();
  const cands=Object.values(E).filter(e=>e.type!=='note'&&e.type!=='branch'&&(!q||searchText(e).includes(q))).slice(0,7);
  popItems(cands.map(e=>({id:e.id,nm:`<span class="tab ${e.src}" style="margin-right:6px">${SRC[e.src].nm}</span>${esc(label(e))}`,d:esc(e.title)})),'Link an entity into the card');
  $('#pop').querySelectorAll('.pi').forEach(p=>p.onclick=()=>insertChip(p.dataset.pop));
}
function insertChip(id){
  const c=S.wikiCtx;closePop();if(!c||!E[id])return;
  const node=c.node,after=node.textContent.slice(c.end);
  node.textContent=node.textContent.slice(0,c.start);
  const chip=document.createElement('span');
  chip.className='chipE';chip.setAttribute('contenteditable','false');chip.setAttribute('data-go',id);
  chip.innerHTML=tab(E[id].src)+esc(label(E[id]));
  const tail=document.createTextNode(after||' ');
  node.parentNode.insertBefore(chip,node.nextSibling);
  node.parentNode.insertBefore(tail,chip.nextSibling);
  const r=document.createRange();r.setStart(tail,Math.min(1,tail.length));r.collapse(true);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
  S.wikiCtx=null;
}
document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(S.wiz&&(id==='wurl'||id==='wname'||id==='wsecret')){
    if(id==='wurl'){S.wiz.url=ev.target.value.trim();const b=document.querySelector('[data-wnext]');if(b)b.disabled=!(S.wiz.url.length>8)}
    else if(id==='wname')S.wiz.name=ev.target.value;else S.wiz.secret=ev.target.value;
    return;
  }
  if($('#q')===ev.target){S.sel=0;render();if(S.chain&&(S.chain.kind==='link'||S.chain.kind==='timerctx'))chainPop();return}
  if(ev.target.closest&&ev.target.closest('[data-ed]'))openWikiPop();
});

/* ================= DRAG A NOTE ONTO A CARD ================= */
document.addEventListener('dragstart',ev=>{
  const n=ev.target.closest&&(ev.target.closest('[data-note]')||ev.target.closest('.row.note[data-id]'));
  if(!n)return;S.drag=n.dataset.note||n.dataset.id;
  try{ev.dataTransfer.setData('text/plain',S.drag);ev.dataTransfer.effectAllowed='link'}catch(e){}
});
document.addEventListener('dragover',ev=>{
  const c=ev.target.closest&&ev.target.closest('[data-drop]');if(!c||!S.drag)return;
  ev.preventDefault();try{ev.dataTransfer.dropEffect='link'}catch(e){}c.classList.add('dropping');
});
document.addEventListener('dragleave',ev=>{const c=ev.target.closest&&ev.target.closest('[data-drop]');if(c)c.classList.remove('dropping')});
document.addEventListener('drop',ev=>{
  const c=ev.target.closest&&ev.target.closest('[data-drop]');if(!c||!S.drag)return;
  ev.preventDefault();c.classList.remove('dropping');
  const nid=S.drag;S.drag=null;
  if(isLinked(c.dataset.drop,nid)){toast('Already pinned there.','warn');return}
  addLink(c.dataset.drop,nid);
});
document.addEventListener('dragend',()=>{S.drag=null;document.querySelectorAll('.dropping').forEach(x=>x.classList.remove('dropping'))});

/* ================= KEYBOARD ================= */
function focusBox(){if(S.mode!=='search'&&!S.chain)go('#/search');const q=$('#q');q.focus();q.select()}
function movePop(d){
  const items=[...$('#pop').querySelectorAll('.pi')];if(!items.length)return;
  let i=items.findIndex(x=>x.classList.contains('sel'));i=(i+d+items.length)%items.length;
  items.forEach(x=>x.classList.remove('sel'));items[i].classList.add('sel');items[i].scrollIntoView({block:'nearest'});
}
function moveSel(d){
  if(!RES.length)return;S.sel=(S.sel+d+RES.length)%RES.length;
  if(RES[S.sel])S.entity=RES[S.sel].id;
  render();
  const el=$('#list').querySelector('.row.sel');if(el)el.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown',ev=>{
 try{
  const meta=ev.metaKey||ev.ctrlKey,k=ev.key,low=k.length===1?k.toLowerCase():k;
  if(meta&&low==='k'){ev.preventDefault();closeOverlay();focusBox();return}
  if(meta&&low==='t'){ev.preventDefault();toggleTimer();return}
  const popOpen=$('#pop').classList.contains('open');
  if(k==='Escape'){
    ev.preventDefault();
    if($('#overlay').classList.contains('open'))return closeOverlay();
    if(popOpen)return closePop();
    if(S.chain)return endChain();
    if($('#q').value){$('#q').value='';S.q='';S.sel=0;return render()}
    if(S.sub||S.action)return go('#/'+S.mode);
    if(S.entity){S.entity=null;return render()}
    return go('#/search');
  }
  if($('#overlay').classList.contains('open'))return;
  if(popOpen&&(k==='ArrowDown'||k==='ArrowUp')){ev.preventDefault();movePop(k==='ArrowDown'?1:-1);return}
  if(popOpen&&k==='Enter'){const s=$('#pop .pi.sel');if(s){ev.preventDefault();s.click();return}}
  const inBox=document.activeElement&&document.activeElement.id==='q';
  const typing=document.activeElement&&(document.activeElement.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
  if(k==='ArrowDown'||k==='ArrowUp'){if(typing&&!inBox)return;ev.preventDefault();moveSel(k==='ArrowDown'?1:-1);return}
  if(k==='Enter'&&inBox){
    ev.preventDefault();
    if(S.chain)return void runChainEnter();
    const v=$('#q').value.trim();
    if(S.mode==='notes'&&v&&!RES.length)return newNote(S.entity);
    if(v.startsWith('>')){const first=$('#list .row[data-action], #list .row[data-go-hash]');if(first)first.click();return}
    if(RES.length)return openEnt(RES[S.sel].id);
    const first=$('#list .row[data-id], #list .row[data-smart]');if(first)first.click();
    return;
  }
  if(k==='Tab'&&inBox&&!ev.shiftKey){
    if(RES.length&&RES[S.sel]){ev.preventDefault();openActions(RES[S.sel].id);return}
    if(S.entity&&E[S.entity]){ev.preventDefault();openActions(S.entity);return}
  }
 }catch(err){logErr(err)}
});
document.addEventListener('mousedown',ev=>{
  if($('#pop').classList.contains('open')&&!ev.target.closest('#pop')&&!ev.target.closest('.box')&&!ev.target.closest('[data-ed]'))closePop();
});

function openTimerMenu(){
  const t=S.timer,ctx=t.ctx&&E[t.ctx]?label(E[t.ctx]):(t.label||'no context');
  S.pop='timer';
  popItems(t.running
    ?[{id:'stop',nm:'Stop and draft the worklog',k:'⌘T',d:fmtHM(elapsedSec())+' on '+esc(ctx)},
      {id:'switch',nm:'Switch context…',d:'any entity or an ad-hoc label'},
      {id:'day',nm:'Open the day review',d:'08:30–14:32'}]
    :[{id:'start',nm:'Start the timer on '+esc(ctx),k:'⌘T'},
      {id:'switch',nm:'Switch context…',d:'any entity or an ad-hoc label'},
      {id:'day',nm:'Open the day review',d:'08:30–14:32'}],
    'Timer · '+esc(ctx));
}
$('#timerBtn').onclick=openTimerMenu;
$('#syncBtn').onclick=()=>go(S.ci401?'#/sources/teamcity':'#/sources');
$('#inboxBtn').onclick=()=>go('#/inbox');
$('#setBtn').onclick=()=>go('#/sources');

/* ================= INIT ================= */
function routeAndChain(){route();if(pendingChain){const p=pendingChain;pendingChain=null;chain(p.id,p.kind)}}
window.addEventListener('hashchange',routeAndChain);
try{
  if(!location.hash)history.replaceState(null,'','#/search');
  routeAndChain();
}catch(err){logErr(err)}
