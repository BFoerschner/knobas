<!--
knobas mockup
paradigm: P4 Context hub
design: D3 Patchbay
thesis: Pick a context — an epic, a ticket or an ad-hoc label — and one room fills with everything related from every source, plus its own clock and inbox slice; switching context is the whole navigation.
thesis: The room is a console: each source is a colored hardware module, every item is a jack socket, and a cross-source link is a patch cable you can see, confirm or unplug.
thesis: Patch cables — the room keeps the active context's cables plugged in at rest, lights up every cable of whatever you touch, and the detail panel's patch column snaps a dashed suggestion into a solid cable on Confirm.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Context hub · Patchbay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --chassis:#E3E5E8; --panel:#F1F2F4; --edge:#C9CDD3; --ink:#1E2126; --muted:#6B727C; --white:#FFFFFF;
  --jira:#2563EB; --confluence:#7C3AED; --gitea:#2E9E5B; --teamcity:#F0742A; --note:#E0B100; --local:#1E2126;
  --fail:#D62839; --ok:#1E2126;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --disp:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--chassis);color:var(--ink);font:13px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r)}
.s-jira{--c:var(--jira)} .s-confluence{--c:var(--confluence)} .s-gitea{--c:var(--gitea)} .s-teamcity{--c:var(--teamcity)} .s-note{--c:var(--note)} .s-local{--c:var(--local)}
.hidden{display:none!important}
b{font-weight:600}

/* ---------- hardware primitives ---------- */
.panel{
  background-color:var(--panel);border:1px solid var(--edge);border-radius:var(--r);
  background-image:radial-gradient(circle,var(--edge) 1.4px,transparent 2px),radial-gradient(circle,var(--edge) 1.4px,transparent 2px),radial-gradient(circle,var(--edge) 1.4px,transparent 2px),radial-gradient(circle,var(--edge) 1.4px,transparent 2px);
  background-size:6px 6px;background-repeat:no-repeat;
  background-position:5px 5px,calc(100% - 5px) 5px,5px calc(100% - 5px),calc(100% - 5px) calc(100% - 5px);
}
.plate{font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.plate.dark{color:var(--ink)}
.mono{font-family:var(--mono)}
.disp{font-family:var(--disp);font-weight:600}
.muted{color:var(--muted)}
.fail{color:var(--fail)}
.jack{display:inline-block;width:12px;height:12px;border-radius:999px;flex:none;
  background:radial-gradient(circle,var(--ink) 2.4px,var(--c,var(--muted)) 3px);
  box-shadow:0 0 0 1px rgba(30,33,38,.08)}
.jack.lg{width:16px;height:16px;background:radial-gradient(circle,var(--ink) 3px,var(--c,var(--muted)) 3.8px)}
.jack.running{animation:ring 2s ease-out infinite}
.jack.blank{background:radial-gradient(circle,var(--panel) 2.4px,var(--edge) 3px)}
.jack.plug{animation:plug .15s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--c)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 7px transparent}}
@keyframes plug{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.led{display:inline-block;width:10px;height:10px;border-radius:999px;background:var(--c,var(--edge));flex:none}
.led.err{background:var(--fail);position:relative}
.led.err::after{content:"";position:absolute;inset:3px;background:conic-gradient(from 45deg,transparent 0 25%,#fff 0 28%,transparent 0 50%,#fff 0 53%,transparent 0 75%,#fff 0 78%,transparent 0)}

.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--edge);border-radius:var(--r);
  background:var(--white);font-weight:500;font-size:12.5px;white-space:nowrap;line-height:1}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--white);border-color:var(--ink)}
.btn.primary:hover{background:#2c3037}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--fail)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:13px;height:13px;flex:none}
.btn .kbd{font:400 10px var(--mono);color:var(--muted);border:1px solid var(--edge);border-radius:3px;padding:1px 4px;margin-left:2px}
.btn.primary .kbd{color:#cfd3da;border-color:#555b66}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:var(--r);background:var(--white);padding:2px;gap:2px}
.seg button{height:24px;padding:0 10px;border-radius:3px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--white)}
.seg.sm button{height:20px;padding:0 8px;font-size:11px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle .tr{width:46px;height:28px;border-radius:999px;border:1px solid var(--edge);background:var(--white);position:relative;transition:background .12s}
.toggle .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:var(--ink);transition:transform .12s}
.toggle.on .tr{background:var(--ink);border-color:var(--ink)}
.toggle.on .tr::after{background:var(--white)}
.toggle.on .tr::after{transform:translateX(18px)}
.field{display:flex;flex-direction:column;gap:4px}
.field>label:not(.toggle){font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.in{height:28px;padding:0 8px;border:1px solid var(--edge);border-radius:var(--r);background:var(--white);width:100%}
.in:focus{border-color:var(--ink);outline:none}
textarea.in{height:auto;min-height:64px;padding:6px 8px;resize:vertical;line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 6px;border:1px solid var(--edge);border-radius:999px;background:var(--white);font-size:12px;font-weight:500;white-space:nowrap;max-width:100%}
.chip .jack{width:10px;height:10px;background:radial-gradient(circle,var(--ink) 2px,var(--c,var(--muted)) 2.6px)}
.chip:hover{border-color:var(--ink)}
.chip .t{overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font:400 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:3px;border:1px solid var(--edge);color:var(--muted);white-space:nowrap}
.tag.fail{color:var(--fail);border-color:var(--fail)}
.tag.ink{color:var(--white);background:var(--ink);border-color:var(--ink)}
.tag.run{color:var(--teamcity);border-color:var(--teamcity)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selected{outline:2px solid var(--ink);outline-offset:-2px}
.av{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:999px;background:var(--edge);font:700 9px var(--mono);color:var(--ink);flex:none}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-rows:56px 1fr 26px;grid-template-columns:minmax(0,1fr);height:100vh;min-width:1100px}
.topbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--edge);min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font:700 17px var(--disp);letter-spacing:-.01em;padding-right:10px;border-right:1px solid var(--edge);height:36px}
.brand svg{width:20px;height:20px}
.ctxsel{display:flex;align-items:center;gap:8px;position:relative;min-width:0;flex:0 1 auto}
.ctxtabs{display:flex;align-items:stretch;border:1px solid var(--edge);border-radius:var(--r);background:var(--white);padding:2px;gap:2px;height:34px;min-width:0;overflow:hidden}
.ctab{display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:3px;font-weight:500;color:var(--muted);font-size:12.5px;min-width:0;flex:0 1 auto}
.ctab .key{font-family:var(--mono);font-size:11px;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.ctab.on{background:var(--ink);color:var(--white)}
.ctab.on .jack{background:radial-gradient(circle,var(--white) 2.4px,var(--c,var(--muted)) 3px)}
.ctab.add{padding:0 8px;color:var(--muted)}
.ctab svg{width:12px;height:12px}
.ctab .x{opacity:.5;margin-left:2px}
.ctab .x:hover{opacity:1}
.spacer{flex:1}
.transport{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 4px;flex:none;border:1px solid var(--edge);border-radius:var(--r);background:var(--white);position:relative}
.tbtn{width:32px;height:32px;border-radius:999px;background:var(--ink);color:var(--white);display:inline-flex;align-items:center;justify-content:center;flex:none}
.tbtn svg{width:12px;height:12px}
.tbtn.play{background:var(--white);color:var(--ink);border:2px solid var(--ink)}
.transport .el{font:700 18px/1 var(--mono);letter-spacing:.02em;min-width:50px}
.transport .ctxl{display:flex;flex-direction:column;gap:2px;min-width:0}
.transport .ctxl .plate{font-size:9px;white-space:nowrap}
.transport .ctxl .n{font-weight:600;font-size:12px;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transport .rec{width:8px;height:8px;border-radius:999px;background:var(--fail);animation:blink 2s infinite}
.transport .rec.off{background:var(--edge);animation:none}
@keyframes blink{50%{opacity:.25}}
.tb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--edge);border-radius:var(--r);background:var(--white);font-weight:500;font-size:12.5px;flex:none}
.tb svg{width:14px;height:14px}
.tb .cnt{font:700 11px var(--mono);background:var(--ink);color:var(--white);border-radius:999px;padding:2px 6px}
.tb .sub{font:400 10px var(--mono);color:var(--muted);white-space:nowrap}
.tb.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.tb.on .sub{color:#cfd3da}
.tb.on .cnt{background:var(--white);color:var(--ink)}
.leds{display:flex;align-items:center;gap:5px;height:34px;padding:0 8px;border:1px solid var(--edge);border-radius:var(--r);background:var(--white);flex:none}
.leds svg{width:14px;height:14px;margin-left:4px;color:var(--muted)}
.leds .led{width:10px;height:10px}
.leds .plate{font-size:9px;margin-left:2px;white-space:nowrap}
.leds.warn .plate{color:var(--fail)}
.statusbar{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-top:1px solid var(--edge);font:400 10.5px var(--mono);color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.statusbar>*{flex:none}
.statusbar .spacer{flex:1}
.statusbar .row{gap:5px}
.statusbar .led{width:7px;height:7px}
.main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:hidden}
.view.active{display:flex}

/* ---------- room ---------- */
.roomwrap{display:flex;width:100%;height:100%}
.room{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px;gap:10px;position:relative;overflow:hidden}
.roomhead{display:flex;align-items:center;gap:10px;row-gap:6px;min-height:36px;flex-wrap:wrap}
.roomhead h1{font:700 20px/1.1 var(--disp);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.roomhead h1 .key{font:400 13px var(--mono);color:var(--muted)}
.roomhead .acts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.6fr .92fr 1.08fr;gap:10px;position:relative}
.mod{display:flex;flex-direction:column;min-height:0;position:relative}
.mod-h{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:var(--white);background:var(--c,var(--ink));border-radius:3px 3px 0 0;margin:1px 1px 0}
.mod-h .name{font:700 12px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.mod-h .cnt{font:400 11px var(--mono);opacity:.85}
.mod-h .acts{margin-left:auto;display:flex;gap:4px}
.mod-h .mb{height:22px;padding:0 7px;border-radius:3px;background:rgba(255,255,255,.18);color:var(--white);font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.mod-h .mb:hover{background:rgba(255,255,255,.3)}
.mod-h .mb svg{width:11px;height:11px}
.mod-b{flex:1;min-height:0;overflow:auto;padding:8px}
.mod .filters{display:flex;gap:4px;padding:0 8px 6px}
.jrow{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:var(--r);min-height:32px;cursor:pointer;text-align:left;width:100%}
.jrow:hover{background:var(--white)}
.jrow .t{font-weight:500}
.jrow .m{font:400 10.5px var(--mono);color:var(--muted);white-space:nowrap}
.jrow .sub{font-size:11.5px;color:var(--muted)}
.jrow.indent{padding-left:26px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;align-content:start}
.col .plate{display:block;padding:0 0 6px 2px}
.card{display:block;width:100%;text-align:left;background:var(--white);border:1px solid var(--edge);border-radius:var(--r);padding:7px 8px;margin-bottom:6px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .k{display:flex;align-items:center;gap:6px;font:400 11px var(--mono);color:var(--muted)}
.card .s{font-weight:500;margin-top:3px;line-height:1.3}
.card .f{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.card .f .tag{font-size:9px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 8px;color:var(--muted)}
.empty .jr{display:flex;gap:6px}
.cables{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
.tray{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:46px;flex-wrap:nowrap;overflow-x:auto;flex:none}
.tray::-webkit-scrollbar{height:6px}
.tray::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.tray::-webkit-scrollbar-track{background:transparent}
.tray{scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.tray .plate{flex:none;margin-right:4px}
.trayitem{display:flex;align-items:center;gap:6px;flex:none;border:1px dashed var(--edge);border-radius:var(--r);padding:4px 6px;background:var(--white)}
.trayitem .why{font-size:11px;color:var(--muted);font-style:italic;max-width:116px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trayitem .arrow{width:34px;height:14px;flex:none}
.timetile{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:4px 2px 8px}
.timetile .num{font:700 22px/1 var(--disp)}
.timetile .plate{display:block;margin-bottom:4px}
.prompt{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--white);border:1px solid var(--ink);border-radius:var(--r)}

/* ---------- detail slide-over ---------- */
#detailwrap{flex:none;display:flex;min-height:0;max-width:40%}
.detail{width:520px;max-width:100%;flex:none;display:flex;flex-direction:column;margin:10px 10px 10px 0;min-height:0;min-width:0}
.d-h{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 10px;border-bottom:1px solid var(--edge)}
.d-h .title{font:700 16px/1.25 var(--disp);margin-top:2px}
.d-h .key{font:400 11px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:2px}
.d-h .close{margin-left:auto}
.d-b{flex:1;min-height:0;overflow:auto;padding:12px}
.sec{margin-bottom:16px}
.sec>.plate{display:block;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--edge)}
.props{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;font-size:12.5px}
.props .plate{font-size:9.5px}
.desc{background:var(--white);border:1px solid var(--edge);border-radius:var(--r);padding:8px 10px;line-height:1.5}
.desc code,.log code,.mono-inline{font-family:var(--mono);font-size:11.5px;background:var(--chassis);padding:1px 4px;border-radius:3px}
.comment{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--edge)}
.comment:first-of-type{border-top:0}
.comment .who{font-weight:600}
.comment .when{font:400 10.5px var(--mono);color:var(--muted);margin-left:6px}
.addc{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.log{font:400 11.5px/1.5 var(--mono);background:var(--white);border:1px solid var(--edge);border-radius:var(--r);padding:8px 10px;white-space:pre-wrap;overflow:auto}
.log .f{color:var(--fail)}
.patch{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:0 28px;min-height:120px}
.patch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pright{min-width:0}
.pleft{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.pleft .jack{width:18px;height:18px;background:radial-gradient(circle,var(--ink) 3.5px,var(--c,var(--muted)) 4.4px)}
.pleft .n{font:700 13px var(--disp)}
.prow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--r);min-height:34px;position:relative;z-index:1;min-width:0}
.prow:hover{background:var(--white)}
.prow .jack{width:14px;height:14px;background:radial-gradient(circle,var(--ink) 2.8px,var(--c,var(--muted)) 3.5px)}
.prow .n{font-weight:500;cursor:pointer;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .n:hover{text-decoration:underline}
.prow .m{font:400 10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36%;flex:0 1 auto}
.prow.sug{opacity:.85}
.prow.sug .jack{opacity:.5}
.prow .why{font-size:11px;color:var(--muted);font-style:italic}
.prow .acts{margin-left:auto;display:flex;gap:4px;flex:none;opacity:0}
.prow:hover .acts,.prow:focus-within .acts{opacity:1}
.prow.sug .acts{opacity:1}
.prow .why{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px}
.steps .st{width:18px;height:18px;border-radius:999px;border:2px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;flex:none;font:700 10px var(--mono)}
.steps .st.done{background:var(--ink);border-color:var(--ink);color:var(--white)}
.steps .st.cur{border-color:var(--c,var(--teamcity));animation:ring 2s infinite}
.steps .st.fail{border-color:var(--fail);color:var(--fail)}
.filelist li{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:3px 0}
.wl{display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;font-size:12.5px;align-items:center}
.wl .m{font:400 11px var(--mono);color:var(--muted)}
.editor{min-height:180px;background:var(--white);border:1px solid var(--edge);border-radius:var(--r);padding:10px 12px;line-height:1.6;outline:none}
.editor:focus{border-color:var(--ink)}
.editor .chip{vertical-align:middle;height:20px;font-size:11.5px}
.pagebody{background:var(--white);border:1px solid var(--edge);border-radius:var(--r);padding:12px 14px;line-height:1.55}
.pagebody h3{font:700 14px var(--disp);margin:8px 0 4px}
.pagebody h3:first-child{margin-top:0}
.pagebody em{color:var(--muted)}

/* ---------- stepper overlay in room ---------- */
.stepper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;max-width:calc(100% - 40px);z-index:5;display:flex;flex-direction:column;max-height:calc(100% - 40px)}
.stepper .d-b{padding:12px}
.stepper .steps li{padding:7px 0;border-top:1px solid var(--edge);font-size:13px}
.stepper .steps li:first-child{border-top:0}
.stepper .steps .det{font:400 11px var(--mono);color:var(--muted);margin-left:auto;white-space:nowrap}

/* ---------- overlays / dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,33,38,.28);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding-top:80px}
.dlg{width:620px;max-width:calc(100% - 40px);max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.dlg.wide{width:860px}
.dlg .d-b{padding:14px}

/* membership of a context */
function members(ctxId){
  const c=ctxObj(ctxId);let seeds=[];
  if(c&&c.kind==='epic'){seeds=Object.keys(E).filter(k=>E[k].epic===ctxId)}
  else if(c&&c.kind==='adhoc'){seeds=[...(c.links||[])]}
  else seeds=[ctxId];
  const set=new Set(seeds);
  for(const s of seeds){for(const l of linksOf(s)){set.add(l);const e=E[l];if(e&&e.t==='branch'&&e.commits)e.commits.forEach(x=>set.add(x));if(e&&e.t==='pr')linksOf(l).forEach(x=>{if(E[x]&&(E[x].t==='build'||E[x].t==='repo'||E[x].t==='branch'))set.add(x)})}}
  const all=[...set];
  const by=t=>all.filter(k=>E[k]&&E[k].t===t);
  return {all:set,tickets:by('ticket'),branches:by('branch'),prs:by('pr'),commits:by('commit'),builds:by('build'),pages:by('page'),notes:by('note'),repos:by('repo'),seeds};
}

  // time

  // suggestions tray

    :c.kind==='adhoc'?`<div class="tray panel"><span class="plate dark">Might belong here</span><span class="muted">Nothing detected for an ad-hoc label. Patch things in with <b>Link a ticket…</b> or write a note.</span></div>`:'';

function applyTicketFilter(m){
  $$('#grid .card').forEach(card=>{const k=card.dataset.id;const keep=S.tf==='fail'?k==='PAY-231':S.tf==='blocked'?!!E[k].blockedBy:true;card.style.display=keep?'':'none'});
}

/* cables drawn across the room on hover/focus */
function cablePath(x1,y1,x2,y2){const dx=Math.max(40,Math.abs(x2-x1)*.35);const sag=18+Math.abs(x2-x1)*.06;return `M${x1} ${y1} C${x1+(x2>x1?dx:-dx)} ${y1+sag}, ${x2+(x2>x1?-dx:dx)} ${y2+sag}, ${x2} ${y2}`}
function spineOf(){
  const m=members(S.ctx);let best=null,n=0;
  for(const k of m.all){if(!E[k])continue;const c=linksOf(k).filter(l=>m.all.has(l)).length;if(c>n){n=c;best=k}}
  return best;
}
function restCables(){drawRoomCables(S.detail||spineOf(),!S.detail)}
function drawRoomCables(id,ambient){
  const svg=$('#roomcables');if(!svg)return;svg.innerHTML='';svg.style.opacity=ambient?'.35':'1';if(!id)return;
  const grid=$('#grid');const gr=grid.getBoundingClientRect();
  const from=grid.querySelector(`[data-jack="${id}"]`);if(!from)return;
  const visible=el=>{const r=el.getBoundingClientRect();const body=el.closest('.mod-b');if(!body)return true;const b=body.getBoundingClientRect();return r.top>=b.top-2&&r.bottom<=b.bottom+2};
  if(!visible(from))return;
  const fr=from.getBoundingClientRect();const x1=fr.left+fr.width/2-gr.left,y1=fr.top+fr.height/2-gr.top;
  const col=colOf(srcOf(id));let out='';
  const targets=linksOf(id).map(t=>[t,false]).concat(SUGG.filter(s=>!S.dismissed.includes(s.id)&&(s.from===id||s.to===id)).map(s=>[s.from===id?s.to:s.from,true]));
  const seen=new Set();
  for(const [t,dashed] of targets){if(seen.has(t))continue;seen.add(t);
    const els=$$(`[data-jack="${t}"]`,grid).filter(el=>el!==from&&visible(el));if(!els.length)continue;
    const r=els[0].getBoundingClientRect();const x2=r.left+r.width/2-gr.left,y2=r.top+r.height/2-gr.top;
    out+=`<path d="${cablePath(x1,y1,x2,y2)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" ${dashed?'stroke-dasharray="6 5" opacity=".4"':''}/><circle cx="${x2}" cy="${y2}" r="5" fill="${col}" stroke="#F1F2F4" stroke-width="2" ${dashed?'opacity=".4"':''}/>`}
  if(out)out=`<circle cx="${x1}" cy="${y1}" r="6" fill="${col}" stroke="#F1F2F4" stroke-width="2"/>`+out;
  svg.innerHTML=out;
}

function renderDetail(){
  const w=$('#detailwrap');if(!w)return;
  if(!S.detail||!E[S.detail]){w.innerHTML='';return}
  const id=S.detail,e=E[id];
  const head=(kind,title,extra='')=>`<div class="d-h"><span class="jack lg s-${e.src}" style="margin-top:3px"></span><div class="grow"><div class="key">${kind}${extra}</div><div class="title">${title}</div></div><button class="btn sm close" data-act="closedetail" title="Close (Esc)">${I.x}</button></div>`;
  let html='';
  if(e.t==='ticket'||e.t==='epic') html=ticketDetail(id,e,head);

  else if(e.t==='build') html=buildDetail(id,e,head);
  else if(e.t==='page') html=pageDetail(id,e,head);
  else if(e.t==='note') html=noteDetail(id,e,head);
  else if(e.t==='branch') html=head('Branch · '+e.repo+' · '+syncedTxt('gitea'),'⎇ '+esc(e.title))+`<div class="d-b"><div class="sec"><span class="plate">Commits</span>${(e.commits||[]).map(x=>`<div class="jrow">${jack(x)}<span class="grow"><span class="mono" style="font-size:11px">${x}</span> ${esc(E[x].title)}</span><span class="m">${E[x].when}</span></div>`).join('')||'<div class="muted">No commits ahead of main.</div>'}</div>${patchPanel(id)}</div>`;
  else if(e.t==='commit') html=head('Commit · '+e.by+' · '+e.when+' · '+syncedTxt('gitea'),`<span class="mono">${e.key}</span> ${esc(e.title)}`)+`<div class="d-b"><div class="sec"><span class="plate">On branch</span>${chip(e.branch)}</div>${patchPanel(id)}</div>`;
  else if(e.t==='repo') html=head('Repository · '+e.lang+' · '+syncedTxt('gitea'),esc(e.title))+`<div class="d-b"><div class="props"><span class="plate">Clone</span><span class="mono">${e.clone}</span><span class="plate">Note</span><span>${e.note||'—'}</span></div><div class="sec" style="margin-top:14px"></div>${patchPanel(id)}</div>`;
  w.innerHTML=`<aside class="detail panel" id="detail">${html}</aside>`;
  requestAnimationFrame(drawPatch);
}
function patchPanel(id){
  const links=linksOf(id).filter(l=>E[l]);
  const sugs=SUGG.filter(s=>!S.dismissed.includes(s.id)&&(s.from===id||s.to===id));
  const row=(l,meta)=>{const x=E[l];const m=x.t==='build'?`${x.state}${x.dur?' · '+x.dur:''}`:x.t==='pr'?`${x.state}${x.state==='open'?' · '+x.approvals+'/'+x.required+' ✓':''}`:x.t==='page'?'edited '+x.edited:x.t==='note'?x.edited:x.t==='branch'?(x.ahead?'+'+x.ahead+' ahead':'branch'):x.t==='commit'?x.when:x.t==='ticket'?x.status:x.t==='repo'?'repo':'';
    return `<div class="prow" data-pj="${l}"><span class="jack s-${srcOf(l)} ${x.t==='build'&&x.state==='running'?'running':''}"></span><button class="n" data-act="open" data-id="${l}">${esc(label(l))}${x.key&&x.title&&x.t!=='commit'?` <span class="muted" style="font-weight:400">${esc(x.title)}</span>`:''}</button><span class="m">${m}${x.t==='build'&&x.state==='failed'?' <span class="fail">✖</span>':''}</span><span class="acts"><button class="btn sm ghost" data-act="unlink" data-id="${l}" data-from="${id}" title="Unplug">${I.x}</button></span></div>`};
  const srow=s=>{const o=s.from===id?s.to:s.from;return `<div class="prow sug" data-pj="${o}" data-sug="${s.id}"><span class="jack s-${srcOf(o)}"></span><button class="n" data-act="open" data-id="${o}">${esc(label(o))}</button><span class="why">${esc(s.why)}</span><span class="acts"><button class="btn sm primary" data-act="confirmlink" data-id="${s.id}">Confirm</button><button class="btn sm ghost" data-act="dismiss" data-id="${s.id}">Dismiss</button></span></div>`};
  return `<div class="sec"><span class="plate">Patch · ${links.length} linked${sugs.length?' · '+sugs.length+' suggested':''}</span>
    <div class="patch" id="patch"><svg></svg><div class="pleft"><span class="jack s-${srcOf(id)}" data-pj="self"></span><span class="n mono" style="font-size:11px">${esc(label(id))}</span><span class="plate" style="font-size:9px">${SRC[srcOf(id)].name}</span></div>
    <div class="pright">${links.map(l=>row(l)).join('')}${sugs.map(srow).join('')}${!links.length&&!sugs.length?'<div class="muted" style="padding:8px 6px">Nothing patched in yet.</div>':''}</div></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="linkto" data-id="${id}">${I.link}Link to…</button></div></div>`;
}
function drawPatch(){
  const p=$('#patch');if(!p)return;const svg=p.querySelector('svg');const pr=p.getBoundingClientRect();
  const self=p.querySelector('[data-pj="self"]');if(!self)return;const sr=self.getBoundingClientRect();
  const x1=sr.left+sr.width/2-pr.left,y1=sr.top+sr.height/2-pr.top;const col=colOf(srcOf(S.detail));
  let out=`<circle cx="${x1}" cy="${y1}" r="5" fill="${col}"/>`;
  $$('.prow',p).forEach(r=>{const j=r.querySelector('.jack');const jr=j.getBoundingClientRect();const x2=jr.left+jr.width/2-pr.left,y2=jr.top+jr.height/2-pr.top;const d=r.classList.contains('sug');
    out+=`<path d="${cablePath(x1,y1,x2,y2)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" ${d?'stroke-dasharray="6 5" opacity=".4"':''}/><circle cx="${x2}" cy="${y2}" r="4" fill="${col}" ${d?'opacity=".4"':''}/>`});
  svg.innerHTML=out;
}

function prDetail(id,e,head){

function openPop(html,anchor,cls){
  const p=$('#popover');p.innerHTML=`<div class="pop panel ${cls||''}">${html}</div>`;
  const el=p.firstChild;const r=anchor.getBoundingClientRect();
  el.style.left='0px';el.style.top='0px';el.style.maxHeight='';
  const h=el.offsetHeight,w=el.offsetWidth;
  const below=innerHeight-r.bottom-16,above=r.top-16;let top;
  if(h<=below)top=r.bottom+6;
  else if(h<=above)top=r.top-h-6;
  else if(below>=above){top=r.bottom+6;el.style.maxHeight=below+'px'}
  else {el.style.maxHeight=above+'px';top=Math.max(8,r.top-above-6)}
  let left=r.left;if(left+w>innerWidth-10)left=innerWidth-10-w;if(left<8)left=8;
  el.style.left=left+'px';el.style.top=Math.max(8,top)+'px';
}

function runStepper(){

    if(s.done===3){LINKS.push([s.id,'pr-'+S.stepPr],[s.id,'br-'+s.id])}

    if(s.done===5){if(s.timer){S.timer={running:true,ctx:s.id,since:'14:33',sec:0};if(!ctxObj(s.id))S.contexts.push({id:s.id,label:E[s.id].title,key:s.id,kind:'ticket',src:'jira'})}s.running=false;toast(`${s.id} is In Progress · PR #${S.stepPr} open`,'jira');render();return}
    renderStepper();setTimeout(tick,reduce?0:420)};
  setTimeout(tick,reduce?0:420);
}

  'trigger-run'(){const cfg=$('#tr-cfg').value,br=$('#tr-branch').value,env=$('.on',$('#tr-env')).textContent,clean=$('#tr-clean').classList.contains('on');closeDlg();const n=S.nextBuild++;const id='b-'+n;E[id]={t:'build',src:'teamcity',key:'#'+n,cfg,state:'running',step:'step 1/5 checkout',branch:br,when:'queued today 14:32',params:{branch:br,env,clean},pending:!S.tcOk};const tk=br.match(/[A-Z]+-\d+/);if(tk&&E[tk[0]])LINKS.push([tk[0],id]);const pr=Object.keys(E).find(k=>E[k].t==='pr'&&E[k].from===br);if(pr){LINKS.push([pr,id]);E[pr].checks.unshift(id)}queuedWrite();toast(S.tcOk?`Triggered ${cfg} #${n} on ${br}`:`${cfg} #${n} queued locally — TeamCity is 401, sends when reconnected`,'teamcity');render()},
  rerun(b){const e=E[b.dataset.id];const n=S.nextBuild++;const id='b-'+n;E[id]={t:'build',src:'teamcity',key:'#'+n,cfg:e.cfg,state:'running',step:'re-run of '+e.key+' · step 1/5',branch:e.branch,when:'queued today 14:32',params:{...e.params},pending:!S.tcOk};linksOf(b.dataset.id).forEach(l=>{if(E[l].t==='ticket'||E[l].t==='pr')LINKS.push([l,id]);if(E[l].t==='pr')E[l].checks.unshift(id)});queuedWrite();S.inbox=S.inbox.filter(i=>i.id!=='i3');toast(S.tcOk?`Re-running ${e.cfg} as #${n}`:`Re-run queued as #${n} — TeamCity is 401, sends when reconnected`,'teamcity');location.hash=route_of(id)},
  newticket(){openNewTicket()},
  'nt-create'(){const sum=$('#nt-sum').value.trim();if(!sum){$('#nt-sum').focus();return}const key='PAY-'+S.nextKey++;const c=ctxObj(S.ctx);E[key]={t:'ticket',src:'jira',key,title:sum,type:$('#nt-type').value,status:'To Do',prio:$('#nt-prio').value,assignee:'Mara',updated:'today 14:32',epic:'PAY-200',desc:esc($('#nt-desc').value)};if(c.kind==='ticket')LINKS.push([S.ctx,key]);if(c.kind==='adhoc')c.links.push(key);closeDlg();toast(`Created ${key} “${sum}” in PAY`,'jira');location.hash='#/ticket/'+key},
  newpage(){openNewPage()},
  'np-create'(){const t=$('#np-title').value.trim();if(!t){$('#np-title').focus();return}const id='pg-'+Date.now();E[id]={t:'page',src:'confluence',title:t,edited:'today 14:32',by:'Mara',space:'ENG',body:'<p>'+esc($('#np-body').value||'')+'</p>',comments:[],parent:$('#np-parent').value};const c=ctxObj(S.ctx);if(c.kind==='adhoc')c.links.push(id);else LINKS.push([c.kind==='epic'?(S.detail&&E[S.detail].t==='ticket'?S.detail:'PAY-231'):S.ctx,id]);closeDlg();toast(`Created page “${t}” in ENG`,'confluence');location.hash='#/page/'+id},
  newnote(){const id='n-'+Date.now();const c=ctxObj(S.ctx);const pre=c.kind==='adhoc'?c.label:c.key;E[id]={t:'note',src:'note',title:'Untitled note',edited:'today 14:32',body:'',wl:c.kind==='adhoc'?[]:[S.ctx]};if(c.kind==='adhoc')c.links.push(id);else LINKS.push([S.ctx,id]);toast(`New note, pre-linked to ${pre}`,'note');location.hash='#/note/'+id;setTimeout(()=>{const ed=$('#editor');if(ed)ed.focus()},50)},
  git(b){if($('#popover').innerHTML)closePop();else openGitMenu(b)},
  gitpull(){closePop();toast('payout-service · main is up to date with origin','gitea')},
  gitpush(){closePop();toast('feature/PAY-231-sepa-retry · everything up to date, 3 commits already on origin','gitea')},
  newbranch(){closePop();openNewBranch()},
  'nb-create'(){const n=$('#nb-name').value.trim();if(!n)return;closeDlg();const id='br-'+Date.now();E[id]={t:'branch',src:'gitea',title:n,repo:'payout-service',ahead:0,local:true,commits:[]};const tk=n.match(/[A-Z]+-\d+/);if(tk&&E[tk[0]])LINKS.push([tk[0],id]);else if(ctxObj(S.ctx).kind==='ticket')LINKS.push([S.ctx,id]);toast(`Created ${n} from main · checked out`,'gitea');render()},
  newrepo(){closePop();openNewRepo()},
  'nr-create'(){const n=$('#nr-name').value.trim();if(!n){$('#nr-name').focus();return}closeDlg();const id='repo-'+n;E[id]={t:'repo',src:'gitea',title:n,lang:'—',clone:'~/code/'+n,note:'empty · default branch main'};toast(`Created tidewater/${n} · cloned to ~/code/${n}`,'gitea');render()},
  /* inbox */
  inboxfilter(b){S.inboxHere=b.dataset.id==='here';renderInbox()},
  inbox(b){const it=S.inbox.find(i=>i.id===b.dataset.id);const d=b.dataset.do;
    if(d==='Done'){S.inbox=S.inbox.filter(i=>i!==it);toast('Marked done');render();return}
    if(d==='Snooze'){S.inbox=S.inbox.filter(i=>i!==it);S.snoozed.push({id:'z'+Date.now(),text:it.html.replace(/<[^>]+>/g,''),returns:'2026-08-25'});toast('Snoozed until Monday 2026-08-25');render();return}
    if(d==='Reply'){it.reply=!it.reply;renderInbox();const inp=$('#reply-'+it.id);if(inp)inp.focus();return}
    if(d==='Review'||d==='Open page'||d==='Open PR'||d==='Open'||d==='Open log'){ACT.open({dataset:{id:it.ent}});return}
    if(d==='Open OPS-77'){ACT.open({dataset:{id:'OPS-77'}});return}
    if(d==='Re-run'){ACT.rerun({dataset:{id:'b-1187'}});return}
    if(d==='Comment on PAY-231'){location.hash='#/ticket/PAY-231';setTimeout(()=>{const ta=$('#newcomment');if(ta){ta.value='Build #1187 fails on gives_up_after_max_attempts — off-by-one in the attempt counter, fix incoming.';ta.focus()}},60);return}
    if(d==='Start work'){ACT.startwork({dataset:{id:'PAY-240'}});return}
    if(d==='Ping Tomasz'){it.reply=true;it.replyText='Hi Tomasz — any ETA on OPS-77? PAY-228 staging verification is waiting on the runbook.';renderInbox();const inp=$('#reply-'+it.id);if(inp)inp.focus();return}},
  'inbox-send'(b){const it=S.inbox.find(i=>i.id===b.dataset.id);const v=$('#reply-'+it.id).value.trim();if(!v)return;if(it.ent==='pg-sepa')E['pg-sepa'].comments.push({who:'Mara',when:'today 14:32',text:v});else if(it.ent==='pr-142')E['pr-142'].comments.push({who:'Mara',when:'today 14:32',text:v});else if(it.ent==='PAY-228'){(S.comments['OPS-77']=S.comments['OPS-77']||[]).push({who:'Mara',when:'today 14:32',text:v})}S.inbox=S.inbox.filter(i=>i!==it);toast(it.ent==='PAY-228'?'Sent to Tomasz as a comment on OPS-77':`Reply posted on ${label(it.ent)}`,srcOf(it.ent==='PAY-228'?'OPS-77':it.ent));render()},
  unsnooze(b){const z=S.snoozed.find(x=>x.id===b.dataset.id);S.snoozed=S.snoozed.filter(x=>x!==z);S.inbox.unshift({id:'i'+Date.now(),when:'today 14:32',html:esc(z.text),ent:'n-creds',ctx:['PAY-219','PAY-200'],actions:['Open','Snooze','Done']});render()},
  /* standup */
  trace(b){openPop(`<span class="plate">Source</span><div style="padding:4px 8px">${esc(b.dataset.label)}</div><div class="muted" style="padding:0 8px 4px;font-size:11.5px">Generated from the local index; the digest links back to the item it was derived from.</div>`,b)},
  copydigest(){toast('Digest copied as plain text')},
  digestnote(){const p=$('#proto');if(p){p.innerHTML+=`<br><b>Mara:</b> ${DIGEST.Today.map(l=>esc(l.text)).join('; ')}.`;toast('Digest lines inserted into the protocol')}},
  protosave(){S.protoSaved=true;const id='n-proto';E[id]={t:'note',src:'note',title:'Standup 2026-08-22',edited:'today 14:32',body:$('#proto').innerText,wl:['PAY-231','PAY-228','PAY-240','OPS-77']};toast('Saved as note “Standup 2026-08-22”','note');render()},
  protopub(){S.protoPublished=true;E['pg-proto']={t:'page',src:'confluence',title:'2026-08-22',edited:'today 14:33',by:'Mara',space:'ENG',body:'<p>'+esc($('#proto').innerText).replace(/\n/g,'<br>')+'</p>',comments:[],parent:'Standup protocols'};toast('Published to ENG › Standup protocols › 2026-08-22','confluence');render()},
  aiticket(b){const a=PROTO.actions.find(x=>x.id===b.dataset.id);const key='PAY-'+S.nextKey++;E[key]={t:'ticket',src:'jira',key,title:a.text.charAt(0).toUpperCase()+a.text.slice(1),type:'Task',status:'To Do',prio:'Medium',assignee:a.who,updated:'today 14:32',epic:'PAY-200',desc:'From standup 2026-08-22 action items.'};S.createdTickets[a.id]=key;toast(`Created ${key} for ${a.who}`,'jira');render()},
  /* sources */
  syncnow(b){const s=SRC[b.dataset.id];if(!s.ok){toast(`${s.name}: sync failed again — 401 Unauthorized. Re-enter the password.`,b.dataset.id);return}s.sync='synced just now';s.mins=0;toast(`${s.name} synced · ${s.count}`,b.dataset.id);render()},
  syncall(){['jira','confluence','gitea'].forEach(k=>{SRC[k].sync='synced just now';SRC[k].mins=0});toast('3 sources synced · TeamCity still 401');render()},
  reenter(b){S.reenter=b.dataset.id;renderSources();const p=$('#tcpass');if(p)p.focus()},
  tctest(){const p=$('#tcpass');if(!p.value){p.focus();return}S.tcTesting=true;renderSources();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;setTimeout(()=>{S.tcTesting=false;S.reenter=null;S.tcOk=true;const s=SRC.teamcity;s.ok=true;s.sync='synced just now';s.mins=0;const flushed=S.pending;S.pending=0;Object.keys(E).forEach(k=>{if(E[k].pending)E[k].pending=false});toast(`TeamCity connected · ${s.count}${flushed?' · '+flushed+' queued write sent':''}`,'teamcity');render()},reduce?0:700)},
  renewpat(){toast('Opens Tidewater Jira → Personal access tokens; paste the new PAT here when ready.','jira')},
  schedule(b){S.schedule=b.dataset.id;toast(`Sync schedule: ${b.dataset.id==='manual'?'manual only':'every '+b.dataset.id}`);renderSources()},
  reindex(){toast('Rebuilding the full-text index · 212 MB · about 40 s')},
  vacuum(){toast('Compacted knobas database · 212 MB → 198 MB')},
  addsource(){openAddSource()},
  'wiz-type'(b){S.wiz.type=b.dataset.id;renderWizard()},
  'wiz-auth'(b){S.wiz.auth=b.dataset.id;S.wiz.tested=null;renderWizard()},
  'wiz-sched'(b){S.wiz.sched=b.dataset.id;renderWizard()},
  'wiz-test'(){S.wiz.tested='wait';renderWizard();setTimeout(()=>{S.wiz.tested='ok';renderWizard()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:600)},
  'wiz-back'(){const u=$('#wz-url');if(u)S.wiz.url=u.value;S.wiz.step--;renderWizard()},
  'wiz-next'(){const w=S.wiz;const u=$('#wz-url');if(u)w.url=u.value;if(w.step<4){w.step++;renderWizard();return}const t=ADD_TYPES.find(x=>x[0]===w.type);const id='x-'+Date.now();SRC[id]={name:w.type,display:(w.url||'https://').replace(/^https?:\/\//,'')||w.type,type:w.type,url:w.url||'https://',auth:w.auth,sync:'first sync running…',count:'0 items',ok:true,adapter:'v'+t[2],caps:{search:1,write:1,webhooks:t[1]==='gitea'?1:0},mins:0,src:t[1]};S.extraSources=(S.extraSources||[]).concat(id);closeDlg();toast(`Saved ${w.type} source · first sync started`,t[1]);render()},
};
function wlCommentDefault(){return 'Backoff jitter (a41f2c, c90d11); replied to review on PR #142; updated Backoff policy in the design page.'}

/* ============================================================
   ROUTING, RENDER, EVENTS
   ============================================================ */
function render(){
  renderTop();
  $$('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+S.view));
  ({room:renderRoom,inbox:renderInbox,time:renderTime,standup:renderStandup,sources:renderSources})[S.view]();
  if(S.view==='room')renderStepper();
}
function route(){
  const h=location.hash||'#/room/PAY-200';const p=h.slice(2).split('/');
  closePop();
  if(p[0]==='room'){S.view='room';S.detail=null;if(p[1])switchCtx(decodeURIComponent(p[1]))}
  else if(['ticket','pr','build','page','note','branch','commit','repo'].includes(p[0])){S.view='room';const raw=decodeURIComponent(p[1]||'');const id=p[0]==='pr'?'pr-'+raw:p[0]==='build'?'b-'+raw:raw;if(E[id]){S.detail=id;if(ctxObj(S.ctx).kind!=='adhoc'&&!members(S.ctx).all.has(id)&&S.ctx!==id){if(E[id].t==='ticket'&&E[id].epic)switchCtx(E[id].epic);else{const owner=linksOf(id).find(l=>E[l].t==='ticket'&&E[l].epic);if(owner)switchCtx(E[owner].epic)}}}else S.detail=null}
  else if(['inbox','time','standup','sources'].includes(p[0])){S.view=p[0];S.detail=null}
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(!e.target.closest('.pop')&&!e.target.closest('#transport'))closePop();return}
  if(b.dataset.act==='scrim'&&e.target!==b)return;
  if(b.dataset.act==='segpick'||b.dataset.act==='togglepick'){e.preventDefault()}
  const fn=ACT[b.dataset.act];if(fn){try{fn(b,e)}catch(err){showErr(err)}}
});
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#sq'))$('#sq').focus();else openSearch();return}
  if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();ACT['timer-toggle']();return}
  if(e.key==='Escape'){if($('#overlay').innerHTML){closeDlg();return}if($('#popover').innerHTML||$('#ctxdd').innerHTML){closePop();return}if(S.step){S.step=null;renderStepper();return}if(S.detail){location.hash='#/room/'+S.ctx}}
  if(e.key==='Enter'&&e.target.id==='ctxname')ACT.createctx();
  if(e.key==='Enter'&&e.target.id==='adhoclabel')ACT['timer-adhoc']();
  if(e.key==='Enter'&&e.target.id==='tcpass')ACT.tctest();
});
/* room cables on hover / focus */
document.addEventListener('mouseover',e=>{const el=e.target.closest('#grid [data-ent]');if(el)drawRoomCables(el.dataset.ent)});
document.addEventListener('mouseout',e=>{const el=e.target.closest('#grid [data-ent]');if(el&&!el.contains(e.relatedTarget))restCables()});
document.addEventListener('focusin',e=>{const el=e.target.closest('#grid [data-ent]');if(el)drawRoomCables(el.dataset.ent)});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('#grid [data-ent]'))restCables()});
document.addEventListener('scroll',()=>{restCables();drawPatch()},true);
window.addEventListener('resize',()=>{restCables();drawPatch()});
window.addEventListener('hashchange',route);
function showErr(err){const el=$('#jserr');el.style.display='block';el.textContent='JS error: '+(err&&err.message||err);console.error(err)}
setInterval(()=>{if(S.timer.running){S.timer.sec++;const el=$('#elapsed');if(el&&S.timer.sec%60===0)el.textContent=fmt(S.timer.sec)}},1000);
try{route()}catch(err){showErr(err)}
</script>
