<!--
knobas mockup
paradigm: P4 Context hub
design: D4 Atlas
thesis: Pick a context — an epic, a ticket or an ad-hoc label — and every source folds into one room with its own clock; switching rooms is the only navigation you need.
thesis: A chart table at night: indigo, parchment and muted gold/teal treat entities as places and links as routes, so a room reads like a page of an atlas, not a grid of widgets.
thesis: The itinerary — your path through today's rooms and stops with the time spent on each leg, drawn as a dashed teal route with waypoints that extends as you navigate.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Tidewater Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A2C; --panel:#182238; --raised:#1F2B45; --line:#27344F;
  --text:#EAE4D3; --muted:#A5AEC2; --faint:#6C778F;
  --gold:#D4A857; --teal:#3FB8AF; --coral:#E2735B; --ok:#8CC8A0;
  --gold-dim:rgba(212,168,87,.16); --teal-dim:rgba(63,184,175,.14); --coral-dim:rgba(226,115,91,.16);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Source Sans 3","Source Sans Pro","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono","SF Mono",Menlo,Consolas,monospace;
  --r:3px; --top:48px; --itin:34px; --status:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text); font-family:var(--ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    repeating-radial-gradient(circle at 18% 32%, transparent 0 46px, rgba(234,228,211,.055) 46px 47px),
    repeating-radial-gradient(circle at 82% 78%, transparent 0 58px, rgba(234,228,211,.045) 58px 59px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--teal)}
::selection{background:var(--gold-dim)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-radius:var(--r)}
.sc{font-family:var(--display);font-weight:500;font-variant:small-caps;font-feature-settings:"smcp";letter-spacing:.06em;font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.01em}
.k{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hid{display:none!important}
.src{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-variant:small-caps;font-feature-settings:"smcp";font-size:12px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.src svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) var(--itin) 1fr var(--status);height:100vh;min-width:1100px}

/* top strip */
.top{display:flex;align-items:center;gap:10px;padding:0 12px;overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.02em;color:var(--text);margin-right:4px}
.ctxsw{position:relative;display:flex;align-items:center;gap:10px}
.ctxbtn{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);min-width:220px;max-width:312px;text-align:left}
.ctxbtn .sc{font-size:12px}
.ctxbtn .name{font-family:var(--display);font-size:15.5px;font-weight:500;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxbtn .chev{color:var(--faint)}
.compass{width:22px;height:22px;flex:none;color:var(--gold)}
.ctxtabs{display:flex;gap:2px;min-width:0;overflow:hidden;flex-shrink:1}
.ctxtab{padding:4px 9px;border-radius:var(--r);color:var(--muted);font-size:13px;border:1px solid transparent;white-space:nowrap;max-width:106px;overflow:hidden;text-overflow:ellipsis}
.ctxtab:hover{color:var(--text);background:var(--raised)}
.ctxtab.on{color:var(--gold);border-color:var(--gold);background:var(--gold-dim)}
.ctxtab.new{color:var(--faint)}
.ctxmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:560px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.45);display:grid;grid-template-columns:1fr 1fr}
.ctxmenu>div{padding:10px 0}
.ctxmenu>div+div{border-left:1px solid var(--line)}
.ctxmenu .sc{padding:4px 14px 6px;display:block}
.ctxitem{display:flex;align-items:center;gap:10px;width:100%;padding:6px 14px;text-align:left;border-left:2px solid transparent}
.ctxitem:hover{background:var(--raised)}
.ctxitem.on{border-left-color:var(--gold)}
.ctxitem .k{width:70px;flex:none}
.ctxitem .lbl{flex:1;color:var(--text)}
.ctxitem .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ctxitem .badge{font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold-dim);padding:0 5px;border-radius:var(--r)}
.ctxitem .note{font-size:12px;color:var(--faint);font-style:italic}
.spacer{flex:1}
.tbtn{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:var(--r);color:var(--muted);border:1px solid transparent;white-space:nowrap}
.tbtn:hover{background:var(--raised);color:var(--text)}
.tbtn.on{color:var(--gold);border-color:var(--line)}
.tbtn .kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);padding:0 4px;border-radius:var(--r)}
.timer{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:4px 10px;border:1px solid var(--gold);border-radius:var(--r);background:var(--gold-dim);color:var(--text)}
.timer .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
.timer.paused{border-color:var(--line);background:transparent;color:var(--muted)}
.timer.paused .dot{background:var(--faint);animation:none}
.timer .el{font-family:var(--mono);font-size:14px;color:var(--gold)}
.timer.paused .el{color:var(--muted)}
.timer .in{font-size:13px;color:var(--muted)}
.timer .in b{color:var(--text);font-weight:600}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.cnt{font-family:var(--mono);font-size:12px;color:var(--text);background:var(--raised);padding:0 6px;border-radius:var(--r);min-width:20px;text-align:center}
.cnt.gold{color:var(--gold)}
.here{font-size:12px;color:var(--faint)}
.sync{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:var(--r);color:var(--muted);font-size:12.5px;white-space:nowrap}
.sync:hover{background:var(--raised)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sdot.bad{background:var(--coral);border-radius:1px;transform:rotate(45deg)}
.sync .bad-lbl{color:var(--coral)}

/* itinerary strip */
.itin{display:flex;align-items:center;gap:0;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(24,34,56,.6);overflow:hidden}
.itin .sc{margin-right:14px;flex:none}
.legs{display:flex;align-items:center;flex:1;min-width:0;overflow:hidden;height:100%;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.leg{display:flex;align-items:center;flex:none}
.leg .stop{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:var(--r);color:var(--muted);font-size:13px;white-space:nowrap}
.leg .stop:hover{background:var(--raised);color:var(--text)}
.leg .stop .wp{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--teal);background:var(--bg);flex:none}
.leg.cur .stop{color:var(--text)}
.leg.cur .stop .wp{background:var(--gold);border-color:var(--gold)}
.leg .stop .lt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.leg .route{width:34px;height:2px;flex:none;background:repeating-linear-gradient(90deg,var(--teal) 0 4px,transparent 4px 8px);opacity:.7}
.leg.cur .route{opacity:.35}
.itin .tot{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:12px}
.itin .tot b{color:var(--muted);font-weight:400}

/* status bar */
.status{display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--faint);font-family:var(--mono)}
.status .ok{color:var(--ok)}
.status .warn{color:var(--coral)}
.status .spacer{flex:1}
.status button{color:var(--faint);font-family:var(--mono);font-size:12px}
.status button:hover{color:var(--text)}

/* ---------- main / room ---------- */
.main{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr;min-height:0}
.main.split{grid-template-columns:minmax(0,1fr) minmax(520px,48%)}
.room{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.roomhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;padding:11px 18px 9px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.roomhead h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.roomhead .kind{flex:none;white-space:nowrap}
.roomacts{flex:none}
.roomhead h1{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2;color:var(--text)}
.roomhead h1 .k{font-size:14px;color:var(--gold);margin-right:8px;vertical-align:2px}
.roomhead .kind{color:var(--faint);font-size:12.5px}
.roomhead .kind .st{color:var(--teal)}
.roomacts{margin-left:auto;display:flex;gap:6px;align-self:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);color:var(--text);font-size:13px;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--gold);color:#1A1608;border-color:var(--gold);font-weight:600}
.btn.pri:hover{background:#E0B766}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--raised);color:var(--text)}
.btn.sm{padding:2px 7px;font-size:12px}
.btn.teal{color:var(--teal);border-color:rgba(63,184,175,.4)}
.btn.danger{color:var(--coral);border-color:rgba(226,115,91,.4)}
.btn:disabled{opacity:.45;cursor:default}
.tiles{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;align-content:start;gap:0;background:var(--panel);border-bottom:1px solid var(--line)}
.main.split .tiles{grid-template-columns:1fr}
.tile{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;min-width:0;min-height:170px;position:relative}
/* tile children never shrink; the pane scrolls instead */
.tile>*{flex:0 0 auto}
.tile.wide{grid-column:1/-1}
.tilehead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tilehead .sc{font-size:13.5px;color:var(--text)}
.tilehead .cnt{margin-left:2px}
.tilehead .acts{margin-left:auto;display:flex;gap:4px}
.tilehead .acts .btn{padding:1px 7px;font-size:12px}
.empty{color:var(--faint);font-style:italic;font-family:var(--display);font-size:14px;line-height:1.5;padding:6px 0}
.empty .btn{font-style:normal;font-family:var(--ui);margin-top:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.col .sc{display:block;font-size:11.5px;margin-bottom:6px;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:3px}
.col .cnt{margin-left:4px;font-size:10.5px;padding:0 4px;min-width:0}
.card{display:block;width:100%;text-align:left;padding:5px 8px 5px 9px;border-radius:var(--r);border:1px solid var(--line);border-left:2px solid var(--line);background:var(--raised);margin-bottom:5px;position:relative}
.card:hover{border-color:var(--faint);border-left-color:var(--faint)}
.card.sel{border-left-color:var(--gold)}
.card .k{display:block;font-size:12px;color:var(--gold)}
.card .sum{display:block;color:var(--text);font-size:12.5px;line-height:1.3;margin:1px 0 2px}
.card .meta{display:flex;gap:8px;font-size:11.5px;color:var(--faint);align-items:center}
.card .blk{color:var(--coral)}
.card .who{margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--muted);font-size:9.5px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono)}
.card .new{position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:10px;color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px 6px 10px;border-left:2px solid transparent;border-radius:var(--r);min-width:0}
.row:hover{background:var(--raised)}
.row.sel{border-left-color:var(--gold);background:var(--raised)}
.row .k{flex:none}
.row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.row .lbl small{color:var(--faint);font-size:12px;margin-left:6px}
.row .t{flex:none}
.row .src{flex:none;width:52px}
.st{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.st.fail{color:var(--coral)}
.st.run{color:var(--gold)}
.st.ok{color:var(--ok)}
.st.merged{color:var(--teal)}
.st.open{color:var(--muted)}
.st.warn{color:var(--gold)}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-1px;margin-right:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.checks{display:flex;gap:8px;font-family:var(--mono);font-size:11.5px}
.timebig{display:flex;gap:28px;margin:2px 0 10px}
.timebig .n{font-family:var(--mono);font-size:22px;color:var(--text);line-height:1.1}
.timebig .n.gold{color:var(--gold)}
.timebig .l{font-size:12px;color:var(--faint)}
.blocks{display:flex;gap:4px;margin:4px 0 10px}
.blk-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:3px 0}
.blk-row .t{width:92px}
.blk-row .bar{height:6px;border-radius:2px;background:var(--teal);opacity:.7}
.blk-row .bar.manual{background:var(--gold);opacity:.9}
.blk-row .bar.un{background:repeating-linear-gradient(90deg,var(--coral) 0 3px,transparent 3px 6px)}
.blk-row .lbl{color:var(--text)}
.blk-row .how{color:var(--faint);font-size:11.5px}
.blk-row .btn{margin-left:auto}

/* suggestions tray */
.tray{flex:none;background:var(--panel);padding:8px 16px 10px;border-top:1px solid var(--line);max-height:166px;overflow:auto}
.tray .tilehead{margin-bottom:4px}
.sug{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.sug:last-child{border-bottom:0}
.sug .path{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.sug .path .k{color:var(--teal)}
.sug .path .lbl{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .dash{width:26px;height:2px;background:repeating-linear-gradient(90deg,var(--teal) 0 3px,transparent 3px 6px);opacity:.5;flex:none}
.sug .why{color:var(--faint);font-size:12px;font-style:italic;font-family:var(--display);flex:none}
.sug .acts{display:flex;gap:4px;flex:none}
.sug.confirmed .dash{opacity:1;background:var(--teal)}
.sug.confirmed .why{color:var(--teal)}

/* ---------- detail panel (right half of room) ---------- */
.detail{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;animation:slidein .15s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.dhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.dhead .src{margin-right:2px}
.dhead .k{font-size:13px;color:var(--gold)}
.dhead .sync{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);padding:0}
.dhead .sync:hover{background:none}
.dhead .x{color:var(--faint);padding:2px 6px;border-radius:var(--r)}
.dhead .x:hover{background:var(--raised);color:var(--text)}
.dbody{flex:1;overflow:auto;padding:14px 18px 24px}
.dbody h2{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.25;margin-bottom:8px;color:var(--text)}
.dbody h3{font-family:var(--display);font-weight:500;font-size:14px;font-variant:small-caps;font-feature-settings:"smcp";letter-spacing:.06em;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.dbody h3 .btn{margin-left:auto}
.dbody p{color:var(--text);line-height:1.55;margin-bottom:8px}
.dbody p.muted{color:var(--muted)}
.props{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 14px;align-items:center;font-size:13px;margin:8px 0 4px}
.props .l{color:var(--faint);font-size:12px}
.props .v{color:var(--text)}
.pick{appearance:none;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:2px 22px 2px 8px;color:var(--text);font-size:13px;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 11px) 9px,calc(100% - 7px) 9px;background-size:4px 4px;background-repeat:no-repeat}
.pick.gold{color:var(--gold);border-color:rgba(212,168,87,.5)}
.pick.teal{color:var(--teal)}
.pick.ok{color:var(--ok)}
.comment{padding:8px 0 8px 12px;border-left:2px solid var(--line);margin-bottom:8px}
.comment .who{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.comment .who b{color:var(--text);font-weight:600}
.comment .who .t{color:var(--faint)}
.comment .body{color:var(--text);margin-top:2px}
.comment.mine{border-left-color:var(--gold)}
.addc{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.addc textarea{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-height:38px;resize:vertical;color:var(--text);line-height:1.4}
.addc textarea:focus{border-color:var(--gold)}
.linklist .row{padding:5px 8px 5px 10px}
.wl{display:grid;grid-template-columns:90px 60px 1fr;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.wl .t{color:var(--muted)}
.wl .d{font-family:var(--mono);color:var(--text)}
.wl .c{color:var(--muted)}
.log{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--muted);white-space:pre;overflow:auto}
.log .f{color:var(--coral)}
.log .ok{color:var(--ok)}
.files{font-family:var(--mono);font-size:12.5px}
.files div{display:flex;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.files .p{color:var(--text);flex:1}
.files .add{color:var(--ok)}.files .del{color:var(--coral)}
.steps{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.steps span{padding:2px 8px;border:1px solid var(--line);border-radius:var(--r)}
.steps span.done{color:var(--ok);border-color:rgba(140,200,160,.4)}
.steps span.run{color:var(--gold);border-color:var(--gold)}
.page{font-size:14px;line-height:1.6}
.page h4{font-family:var(--display);font-weight:500;font-size:16px;margin:14px 0 4px;color:var(--text)}
.page h4.ed{border-left:2px solid var(--gold);padding-left:8px}
.page em{color:var(--muted)}
.page code{font-family:var(--mono);font-size:12.5px;color:var(--teal)}
.pcomment{margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.pcomment .m{color:var(--gold)}
.editor{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:140px;line-height:1.6;font-size:14px;color:var(--text);white-space:pre-wrap}
.editor:focus{border-color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:var(--r);background:var(--teal-dim);color:var(--teal);font-family:var(--mono);font-size:12px;border:1px solid rgba(63,184,175,.3);cursor:pointer;vertical-align:1px;line-height:1.5;text-decoration:none}
.chip:hover{background:rgba(63,184,175,.25)}
.chip.gold{background:var(--gold-dim);color:var(--gold);border-color:rgba(212,168,87,.35)}
.chip.faint{background:transparent;color:var(--muted);border-color:var(--line);font-family:var(--ui)}
.chip svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.4}
.ntitle{font-family:var(--display);font-size:20px;font-weight:500;background:transparent;border:0;border-bottom:1px solid transparent;width:100%;color:var(--text);padding:0 0 4px}
.ntitle:focus{border-bottom-color:var(--gold)}

/* route strip */
.routestrip{margin:6px 0 2px;overflow-x:auto}
.routestrip svg{display:block;height:64px;min-width:100%}
.routestrip text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.routestrip text.cur{fill:var(--text)}
.routestrip text.lbl{font-family:var(--ui);font-size:10.5px;fill:var(--faint)}
.routestrip .path{stroke:var(--teal);stroke-width:1.5;fill:none;stroke-dasharray:4 4;stroke-linecap:round}
.routestrip .path.sugg{opacity:.5}
.routestrip .path.draw{stroke-dasharray:260;stroke-dashoffset:260;animation:draw .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.routestrip .wp{fill:var(--bg);stroke:var(--teal);stroke-width:1.5}
.routestrip .wp.cur{fill:var(--gold);stroke:var(--gold)}
.routestrip .wp.fail{stroke:var(--coral)}
.routestrip .wp.sugg{stroke-dasharray:2 2;opacity:.6}
.routestrip g.st{cursor:pointer}
.routestrip g.st:hover text{fill:var(--text)}

/* ---------- global views ---------- */
.view{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.vhead{display:flex;align-items:center;gap:14px;padding:12px 22px 10px;border-bottom:1px solid var(--line);flex:none}
.vhead h1{font-family:var(--display);font-weight:500;font-size:22px;color:var(--text)}
.vhead .sub{color:var(--faint);font-size:12.5px}
.vhead .acts{margin-left:auto;display:flex;gap:6px}
.vbody{flex:1;min-height:0;overflow:auto;padding:16px 22px 30px}
.vbody.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{padding:3px 10px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--gold-dim);color:var(--gold)}
.seg button+button{border-left:1px solid var(--line)}
.sect{font-family:var(--display);font-weight:500;font-variant:small-caps;font-feature-settings:"smcp";letter-spacing:.06em;font-size:14px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sect:first-child{margin-top:0}
.sect .cnt{font-size:11px}
.sect .acts{margin-left:auto;display:flex;gap:4px}
.sect .acts .btn{padding:1px 7px;font-size:12px}

/* inbox */
.ibx{display:flex;gap:12px;padding:10px 12px 10px 14px;border:1px solid var(--line);border-left:2px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:8px;align-items:flex-start;transition:opacity .15s}
.ibx.inctx{border-left-color:var(--teal)}
.ibx.done{opacity:.4}
.ibx .t{width:86px;flex:none;padding-top:2px}
.ibx .bd{flex:1;min-width:0}
.ibx .bd .txt{color:var(--text)}
.ibx .bd .txt b{font-weight:600}
.ibx .bd .q{color:var(--muted);font-style:italic;font-family:var(--display);font-size:14.5px}
.ibx .bd .ctxlbl{font-size:11.5px;color:var(--faint);margin-top:2px}
.ibx .bd .ctxlbl .k{font-size:11px;color:var(--teal)}
.ibx .acts{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.ibx .acts .btn{padding:2px 8px;font-size:12px}
.ibx .reply{margin-top:8px;display:flex;gap:6px}
.ibx .reply input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;color:var(--text)}

/* today / standup */
.digest li{list-style:none;display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline;color:var(--text);line-height:1.45}
.digest li .src-refs{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.digest li .chip{font-size:11px;padding:0 5px}
.digest .ctxk{font-family:var(--mono);font-size:11.5px;color:var(--gold);width:72px;flex:none}
.proto{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;line-height:1.65;font-size:14px}
.proto:focus-within{border-color:var(--gold)}
.proto h4{font-family:var(--display);font-weight:500;font-size:17px;margin-bottom:6px}
.proto .sc{display:block;margin:10px 0 2px}
.proto p{margin:0}
.proto [contenteditable]{outline:none;border-radius:2px}
.proto [contenteditable]:focus{background:var(--gold-dim)}
.ai{display:flex;align-items:center;gap:8px;padding:3px 0}
.ai .who{font-family:var(--mono);font-size:12px;color:var(--teal);width:62px;flex:none}
.ai .btn{margin-left:auto}
.ai .made{color:var(--ok);font-family:var(--mono);font-size:12px}
.pubtarget{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r);font-size:13px;color:var(--muted);margin-top:10px}
.pubtarget.ok{border-style:solid;border-color:rgba(140,200,160,.4);color:var(--ok)}

/* day review */
.daystrip{position:relative;height:74px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin:6px 0 4px}
.daystrip .tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.daystrip .tick span{position:absolute;top:2px;left:3px;font-family:var(--mono);font-size:10px;color:var(--faint)}
.daystrip .now{position:absolute;top:0;bottom:0;border-left:1px solid var(--gold)}
.daystrip .now span{position:absolute;top:2px;left:-34px;font-family:var(--mono);font-size:10px;color:var(--gold)}
.dblk{position:absolute;top:22px;height:42px;border-radius:2px;padding:3px 6px;font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent;color:var(--text)}
.dblk .l{display:block;font-family:var(--mono);font-size:10px;color:rgba(234,228,211,.7)}
.dblk.c-pay231{background:rgba(63,184,175,.28);border-color:rgba(63,184,175,.5)}
.dblk.c-pay228{background:rgba(165,174,194,.22);border-color:rgba(165,174,194,.4)}
.dblk.c-inbox{background:rgba(108,119,143,.25);border-color:var(--line)}
.dblk.c-staging{background:rgba(212,168,87,.22);border-color:rgba(212,168,87,.5)}
.dblk.passive{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(18,26,44,.45) 5px 7px)}
.dblk.un{background:var(--coral-dim);border:1px dashed var(--coral);color:var(--coral)}
.dblk.gap{background:transparent;border:0;color:var(--faint);font-style:italic;font-family:var(--display)}
.dblk.sel{outline:2px solid var(--gold);outline-offset:-1px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--faint);margin-bottom:12px}
.legend i{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.legrow{display:flex;align-items:center;gap:12px;padding:6px 10px;border:1px solid var(--line);border-left:2px solid var(--line);border-radius:var(--r);margin-bottom:6px;font-size:13px;background:var(--panel)}
.legrow.un{border-left-color:var(--coral)}
.legrow.manual{border-left-color:var(--gold)}
.legrow.passive{border-left-color:var(--teal)}
.legrow .t{width:100px;flex:none}
.legrow .dur{font-family:var(--mono);width:50px;color:var(--text);flex:none}
.legrow .lbl{flex:1;color:var(--text)}
.legrow .how{color:var(--faint);font-size:11.5px}
.legrow .acts{display:flex;gap:4px}
.week{width:100%;border-collapse:collapse;font-size:13px}
.week th{text-align:left;font-weight:400;color:var(--faint);font-size:12px;padding:4px 8px;border-bottom:1px solid var(--line)}
.week td{padding:5px 8px;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:12.5px;color:var(--text)}
.week td:first-child{font-family:var(--ui);color:var(--muted)}
.week td.un{color:var(--coral)}
.week tr.tot td{border-top:1px solid var(--line);border-bottom:0;color:var(--gold)}
.week .bar{height:5px;background:var(--line);border-radius:2px;position:relative;width:120px}
.week .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:2px}
.week .bar b{position:absolute;top:0;bottom:0;background:var(--coral);border-radius:2px}

/* sources */
.srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.srccard{border:1px solid var(--line);border-left:2px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px}
.srccard.bad{border-left-color:var(--coral)}
.srccard.warn{border-left-color:var(--gold)}
.srccard.ok{border-left-color:var(--ok)}
.srccard .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.srccard .hd .nm{font-family:var(--display);font-size:17px;font-weight:500;color:var(--text)}
.srccard .hd .ty{color:var(--faint);font-size:12.5px}
.srccard .hd .mod{margin-left:auto}
.srccard .url{font-family:var(--mono);font-size:12px;color:var(--teal)}
.srccard .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;margin:8px 0}
.srccard .kv .l{color:var(--faint)}
.srccard .kv .v{color:var(--muted)}
.srccard .kv .v.bad{color:var(--coral)}
.srccard .kv .v.warn{color:var(--gold)}
.srccard .kv .v.ok{color:var(--ok)}
.srccard .ft{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mod{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:var(--r);font-size:11.5px;color:var(--muted);background:var(--bg)}
.mod .v{font-family:var(--mono);color:var(--faint);display:inline-flex;gap:6px}
.cap{font-family:var(--mono);font-size:10.5px;color:var(--teal)}
.cap.off{color:var(--faint);text-decoration:line-through}
.dbrow{display:flex;gap:26px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:13px;color:var(--muted);align-items:center;margin-top:12px}
.dbrow b{font-family:var(--mono);font-weight:400;color:var(--text)}

/* ---------- modals ---------- */
.veil{position:fixed;inset:0;background:rgba(8,12,22,.6);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:90px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:640px;max-width:calc(100vw - 40px);max-height:calc(100vh - 130px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:820px}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{font-family:var(--display);font-weight:500;font-size:18px;color:var(--text)}
.mhead .sub{color:var(--faint);font-size:12.5px}
.mhead .x{margin-left:auto;color:var(--faint);padding:2px 6px}
.mhead .x:hover{color:var(--text)}
.mbody{padding:14px 16px;overflow:auto;flex:1}
.mfoot{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.mfoot .note{color:var(--faint);font-size:12px}
.mfoot .r{margin-left:auto;display:flex;gap:6px}
.fld{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center;margin-bottom:10px;font-size:13px}
.fld label{color:var(--muted)}
.fld input[type=text],.fld input[type=password],.fld input[type=time],.fld textarea,.fld .pick{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;color:var(--text)}
.fld input:focus,.fld textarea:focus{border-color:var(--gold)}
.fld .mono{font-family:var(--mono)}
.fld .hint{grid-column:2;color:var(--faint);font-size:12px;margin-top:-4px}
.fld .pick{padding-right:24px}
.chk{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px;color:var(--text)}
.chk input{margin-top:4px;accent-color:var(--gold)}
.chk .t{margin-left:auto;flex:none}
.chk .k{color:var(--teal)}
.gen{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:13px;color:var(--text);line-height:1.5;font-family:var(--display);font-style:italic}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typecard{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);text-align:left;background:var(--bg)}
.typecard:hover{border-color:var(--faint)}
.typecard.on{border-color:var(--gold);background:var(--gold-dim)}
.typecard .nm{color:var(--text);font-weight:600}
.typecard .v{font-family:var(--mono);font-size:11px;color:var(--faint)}
.typecard .caps{display:flex;gap:6px;margin-top:2px}
.wiz{display:flex;gap:4px;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-bottom:14px;align-items:center}
.wiz span{padding:2px 7px;border:1px solid var(--line);border-radius:var(--r)}
.wiz span.on{color:var(--gold);border-color:var(--gold)}
.wiz span.done{color:var(--teal)}
.wiz i{width:14px;height:1px;background:var(--line)}
.testres{padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);font-size:13px;margin-top:8px;color:var(--muted)}
.testres.ok{border-color:rgba(140,200,160,.4);color:var(--ok)}
.testres.bad{border-color:rgba(226,115,91,.5);color:var(--coral)}
.testres .mono{display:block;color:var(--faint);margin-top:2px}
.stepper{margin:6px 0}
.step{display:flex;align-items:center;gap:12px;padding:8px 10px;border-left:2px solid var(--line);margin-left:6px;font-size:13.5px;color:var(--muted)}
.step .st-ic{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;font-family:var(--mono);font-size:10px}
.step.run{color:var(--text);border-left-color:var(--gold)}
.step.run .st-ic{border-color:var(--gold);color:var(--gold)}
.step.done{color:var(--text);border-left-color:var(--teal)}
.step.done .st-ic{border-color:var(--ok);background:var(--ok);color:#0f1a12}
.step .k{color:var(--teal)}
.step .res{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.step.done .res{color:var(--ok)}
.step.opt .st-ic{border-style:dashed}

/* search */
.search .mbody{padding:0;display:grid;grid-template-columns:220px 1fr;min-height:420px}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sbar input{flex:1;background:transparent;border:0;font-size:17px;font-family:var(--display);color:var(--text)}
.sbar input::placeholder{color:var(--faint);font-style:italic}
.sbar .kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);padding:0 5px;border-radius:var(--r)}
.slists{border-right:1px solid var(--line);padding:10px 0;overflow:auto}
.slists .sc{display:block;padding:2px 14px 6px}
.slist{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 14px;font-size:13px;color:var(--text);border-left:2px solid transparent}
.slist:hover{background:var(--raised)}
.slist.on{border-left-color:var(--gold)}
.slist .cnt{margin-left:auto}
.slist .delta{font-family:var(--mono);font-size:10.5px;color:var(--gold)}
.slist .nojql{display:block;font-size:11px;color:var(--faint);font-style:italic;font-family:var(--display)}
.sres{overflow:auto;padding:8px 0}
.filters{display:flex;gap:6px;padding:6px 14px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:6px}
.fchip{padding:1px 8px;border:1px solid var(--line);border-radius:var(--r);font-size:12px;color:var(--muted)}
.fchip.on{color:var(--gold);border-color:var(--gold);background:var(--gold-dim)}
.fchip.x{color:var(--teal);border-color:rgba(63,184,175,.4);background:transparent}
.fchip.x.on{color:var(--teal);background:var(--teal-dim);border-color:var(--teal)}
.sr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 14px;border-left:2px solid transparent}
.sr:hover,.sr.on{background:var(--raised);border-left-color:var(--gold)}
.sr .src{width:56px;flex:none}
.sr .k{flex:none}
.sr .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.sr .lbl mark{background:transparent;color:var(--gold)}
.sr .t{flex:none}
.sr .add{flex:none;font-size:11.5px;color:var(--teal);opacity:0;padding:0 6px;border:1px solid rgba(63,184,175,.4);border-radius:var(--r)}
.sr:hover .add{opacity:1}
.sr .add.did{opacity:1;color:var(--ok);border-color:transparent}
.snone{padding:20px 14px;color:var(--faint);font-style:italic;font-family:var(--display)}

/* toasts */
.toasts{position:fixed;right:16px;bottom:36px;z-index:80;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--raised);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:var(--r);padding:8px 12px;font-size:13px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fade .15s;max-width:420px;display:flex;gap:10px;align-items:center}
.toast.bad{border-left-color:var(--coral)}
.toast.teal{border-left-color:var(--teal)}
.toast .k{color:var(--gold)}
.toast .btn{padding:1px 7px;font-size:12px}

.errsink{position:fixed;left:0;bottom:0;font-size:10px;color:var(--coral);opacity:0;pointer-events:none}

@media (max-width:1330px){
  .ctxbtn{min-width:180px}
  #b-today .lb,#b-time .lb,#b-search .lb,#b-inbox .lb,.here{display:none}
}
@media (max-width:1250px){
  .ctxtabs{display:none}
  .tbtn .kbd{display:none}
  .timebig{gap:16px}
  .main.split{grid-template-columns:minmax(0,1fr) 480px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .routestrip .path.draw{stroke-dashoffset:0}
}
</style>
</head>

    case 'page': return (DB.pages[id]||{}).title || id;
    case 'note': return (noteById(id)||{}).title || id;
    case 'commit': return id;
    case 'branch': return id;
    case 'repo': return id;
    case 'ctx': return CTX[id] ? (CTX[id].key||CTX[id].name) : id;
  }
  return id;
}
function entTitle(type,id){
  switch(type){
    case 'ticket': return DB.tickets[id]?DB.tickets[id].summary:(S.extraTickets.find(t=>t.key===id)||{}).summary;
    case 'pr': return (prById(id)||{}).title;
    case 'build': return (DB.builds[id]||S.builds[id]||{}).conf;
    case 'commit': return DB.commits[id].msg;
    case 'branch': return 'payout-service';
    case 'repo': return DB.repos[id].lang;
    default: return '';
  }
}
const noteById = id => DB.notes[id] || S.extraNotes.find(n=>n.id===id);
const prById = id => DB.prs[id] || S.extraPrs.find(p=>String(p.num)===String(id));
const href = (type,id) => `#/${type}/${id}`;
const go = (type,id) => { location.hash = href(type,id); };

/* toasts */
function toast(html,kind='',action){
  const t=document.createElement('div'); t.className='toast '+kind; t.innerHTML=html+(action?` <button class="btn sm">${action.label}</button>`:'');
  if(action) t.querySelector('button').onclick=()=>{action.fn();t.remove();};
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(),action?7000:4200);
}
function pendingWrite(){ S.pending++; renderStatus(); }

/* ---------- routing ---------- */
const ENT = ['ticket','pr','build','page','note','commit','branch','repo','epic'];
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const p = h.split('/').filter(Boolean);
  closeModal(true);
  if(!p.length){ S.view='room'; S.detail=null; }
  else if(['inbox','today','time','sources'].includes(p[0])){ S.view=p[0]; S.detail=null; }
  else if(p[0]==='search'){ S.view='room'; S.detail=null; }
  else if(p[0]==='room'){ S.view='room'; setCtx(p[1]||S.ctx,false); S.detail = p[2]&&p[3] ? [p[2],decodeURIComponent(p[3])] : null; }
  else if(ENT.includes(p[0])){ S.view='room'; S.detail=[p[0],decodeURIComponent(p[1]||'')]; if(p[0]==='epic'){ setCtx('PAY-200',false); S.detail=null; } }
  if(S.detail) addStop(S.detail[0],S.detail[1]);
  render();
  if(p[0]==='search') openSearch(p[1]?decodeURIComponent(p[1]):'sepa retry');
}
function setCtx(id,prompt=true){
  if(!CTX[id]) return;
  if(id===S.ctx) return;
  S.ctx=id; S.recent=[id,...S.recent.filter(r=>r!==id)].slice(0,3);
  addStop('ctx',id);
  if(prompt && S.timer.running && S.timer.ctx!==id) askSwitchTimer(id);
}
function addStop(type,id){
  const last=S.itin[S.itin.length-1];
  if(last && last.type===type && String(last.id)===String(id)) return;
  if(last && last.live){ last.dur=Math.max(20,Math.floor((Date.now()-last.t0)/1000)); last.live=false; }
  S.itin.push({type,id,label:entLabel(type,id),at:clock(),t0:Date.now(),live:true});
  if(S.itin.length>9) S.itin=S.itin.slice(-9);
}
function buildBadge(b,long){
  if(b.st==='queued') return '<span class="st warn">◷ queued locally</span>';
  if(b.st==='running') return `<span class="st run"><span class="spin"></span>running${long&&b.step?' · '+b.step:''}</span>`;
  if(b.st==='failed') return `<span class="st fail">✖ failed${long&&b.dur?' · '+b.dur:''}</span>`;
  return '<span class="st ok">✓ success</span>';
}

/* ---------- top strip ---------- */
function renderTop(){
  const c=CTX[S.ctx];
  $('#ctxname').innerHTML = c.key ? `<span class="k" style="color:var(--gold)">${c.key}</span> ${esc(c.name)}` : `<span class="k" style="color:var(--gold)">✎</span> ${esc(c.name)}`;
  $('#ctxtabs').innerHTML = S.recent.filter(id=>id!==S.ctx).map(id=>{const n=CTX[id].key||CTX[id].name;return `<button class="ctxtab" data-ctx="${id}" title="Switch to ${esc(n)}">${esc(n.length>14?n.slice(0,13)+'…':n)}</button>`;}).join('')+`<button class="ctxtab new" id="ctxnew"><svg class="ico" style="width:11px;height:11px"><use href="#g-plus"/></svg> new</button>`;
  $$('#ctxtabs [data-ctx]').forEach(b=>b.onclick=()=>{ location.hash='#/room/'+b.dataset.ctx; });
  $('#ctxnew').onclick=newContext;
  // inbox
  const open = DB.inbox.filter(i=>!S.inboxDone[i.id]&&!S.inboxSnoozed[i.id]);
  const here = open.filter(i=>i.ctx.includes(S.ctx)).length;
  $('#inboxcnt').textContent=open.length;
  $('#inboxhere').textContent = here===open.length ? (open.length?'all here':'') : `${here} here`;
  // timer
  const tm=$('#timer');
  if(S.timer.running){ tm.className='timer'; tm.innerHTML=`<span class="dot"></span><span class="el" id="el">${fmt(elapsed())}</span><span class="in">in <b>${esc(S.timer.label)}</b></span>`; }
  else { tm.className='timer paused'; tm.innerHTML=`<span class="dot"></span><span class="el">—</span><span class="in">no timer · <b>start in ${esc(CTX[S.ctx].key||CTX[S.ctx].name)}</b></span>`; }
  // sync
  const tc=S.tcFixed;
  $('#b-sync').innerHTML=`<span class="sdot" title="Jira synced 4 min ago"></span><span class="sdot" title="Confluence synced 4 min ago"></span><span class="sdot" title="Gitea synced 2 min ago"></span><span class="sdot ${tc?'':'bad'}" title="TeamCity"></span> ${tc?'<span style="color:var(--ok)">4 sources ok</span>':'3 ok · <span class="bad-lbl">teamcity 401</span>'}`;
  ['inbox','today','time','sources'].forEach(v=>$('#b-'+v).classList.toggle('on',S.view===v));
}
function elapsed(){ return S.timer.base + Math.floor((Date.now()-S.timer.t0)/1000); }
function renderItin(){
  const legs=$('#legs');
  legs.innerHTML = S.itin.map((s,i)=>{
    const cur=i===S.itin.length-1;
    const dur = s.live ? (S.timer.running? Math.floor((Date.now()-s.t0)/1000):null) : s.dur;
    const lt = dur==null ? '' : `<span class="lt">${dur<60?'<1m':hm(dur)}</span>`;
    const h = s.type==='ctx' ? '#/room/'+s.id : href(s.type,s.id);
    return `<span class="leg ${cur?'cur':''}"><button class="stop" data-h="${h}" title="${esc(s.type==='ctx'?'room '+s.label:s.label)} · arrived ${s.at}"><span class="wp"></span>${esc(s.label)}<span class="lt">${s.at}</span>${lt}</button>${cur?'':'<span class="route"></span>'}</span>`;
  }).join('');
  $$('#legs .stop').forEach(b=>b.onclick=()=>{location.hash=b.dataset.h;});
  legs.scrollLeft=legs.scrollWidth;
  $('#itintot').innerHTML = S.timer.running ? `today on the road since <b>08:30</b> · timer <b>${S.timer.startedAt}→</b>` : `today on the road since <b>08:30</b>`;
}
function renderStatus(){
  const c=CTX[S.ctx];
  $('#statusbar').innerHTML=`<span>${clock()} · Fri 2026-08-22</span><span>room: ${esc(c.key||c.name)} · ${c.kind}</span><span>db knobas · 212 MB · index up to date</span><span>${S.pending?'<span class="warn">'+S.pending+' pending write'+(S.pending>1?'s':'')+' (teamcity 401)</span>':'0 pending writes'}</span><span class="spacer"></span><span>sync every 5 min · next ${nextSync()}</span><button id="st-sync">sync now</button>`;
  $('#st-sync').onclick=()=>{ toast(S.tcFixed?'Synced 4 sources. Nothing changed.':'Synced Jira, Confluence, Gitea. TeamCity still <span style="color:var(--coral)">401</span> — re-enter the password in Sources.','',S.tcFixed?null:{label:'Open sources',fn:()=>location.hash='#/sources'}); };
}
function nextSync(){ const d=new Date(NOW.getTime()+(Date.now()-S.timer.t0)); const m=d.getMinutes(); const n=m+ (5-(m%5||5)); const mm=(n%60); return `${d.getHours()+(n>=60?1:0)}:${String(mm).padStart(2,'0')}`; }

/* context switcher menu */
function toggleCtxMenu(open){
  S.ctxmenu = open===undefined ? !S.ctxmenu : open;
  const m=$('#ctxmenu'); m.classList.toggle('hid',!S.ctxmenu); $('#ctxbtn').setAttribute('aria-expanded',S.ctxmenu);
  if(!S.ctxmenu) return;
  m.innerHTML=`<div><span class="sc">contexts</span>${Object.values(CTX).map(c=>`<button class="ctxitem ${c.id===S.ctx?'on':''}" data-ctx="${c.id}"><span class="k">${c.key||'✎'}</span><span class="lbl">${esc(c.name)}</span><span class="note">${c.kind}</span>${S.timer.running&&S.timer.ctx===c.id?'<span class="badge">◔ timer</span>':''}</button>`).join('')}
    <button class="ctxitem" id="ctxmenu-new"><span class="k" style="color:var(--faint)">+</span><span class="lbl" style="color:var(--muted)">New context… (ticket, epic or a label)</span></button></div>
    <div><span class="sc">smart lists</span>${DB.smartlists.map(l=>`<button class="ctxitem" data-list="${l.id}"><span class="lbl">${esc(l.name)}${l.nojql?'<span class="note" style="display:block">joins Jira ↔ Gitea ↔ TeamCity — JQL can\'t express this</span>':''}</span>${l.delta?`<span class="badge">${l.delta}</span>`:''}<span class="cnt">${l.count}</span></button>`).join('')}</div>`;
  $$('#ctxmenu [data-ctx]').forEach(b=>b.onclick=()=>{ toggleCtxMenu(false); location.hash='#/room/'+b.dataset.ctx; });
  $$('#ctxmenu [data-list]').forEach(b=>b.onclick=()=>{ toggleCtxMenu(false); openSearch('',b.dataset.list); });
  $('#ctxmenu-new').onclick=()=>{ toggleCtxMenu(false); newContext(); };
}
function newContext(){
  openModal({title:'New context',sub:'A ticket, an epic or just a label for work that has no ticket.',body:`
    <div class="fld"><label>Context</label><input type="text" id="nc-name" placeholder="e.g. Incident 2026-08-22 or PAY-240" autocomplete="off"></div>
    <div class="fld"><label>Start its timer</label><label class="chk" style="padding:0"><input type="checkbox" id="nc-timer" checked> start the clock for this context now</label></div>
    <p class="muted" style="color:var(--faint);font-size:12.5px">Type a key like <span class="k">PAY-240</span> to make a ticket room; anything else becomes an ad-hoc label. Nothing here reads git branches.</p>`,
    foot:`<span class="r"><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="nc-ok">Open room</button></span>`});
  $('#nc-name').focus();
  $('#nc-ok').onclick=()=>{
    const v=$('#nc-name').value.trim(); if(!v){ $('#nc-name').focus(); return; }
    const key=/^[A-Z]+-\d+$/.test(v)?v:''; const id=key||('lbl-'+v.toLowerCase().replace(/[^a-z0-9]+/g,'-'));
    const t=key&&DB.tickets[key];
    CTX[id]={id,key,name:t?t.summary:v,kind:key?'ticket':'ad-hoc label',status:t?status(key):'',tickets:key?[key]:[],branches:[],prs:[],commits:[],builds:[],pages:[],notes:[],time:{today:'0m',week:'0m',unlogged:'0m',rows:[]}};
    CTXCLASS[id]='c-staging';
    if($('#nc-timer').checked){ startTimer(id); }
    closeModal(); S.ctx=null; location.hash='#/room/'+id;
  };
}

/* =========================================================
   ROOM — every tile is filtered by the active context
   ========================================================= */
function render(){
  try{
    if(!CTX[S.ctx]) S.ctx='PAY-200';
    renderTop(); renderItin(); renderStatus();
    const main=$('#main');
    main.className='main'+(S.view==='room'&&S.detail?' split':'');
    if(S.view==='room'){ main.innerHTML=renderRoom()+(S.detail?renderDetail(S.detail[0],S.detail[1]):''); bindRoom(); if(S.detail) bindDetail(S.detail[0],S.detail[1]); }
    else if(S.view==='inbox'){ main.innerHTML=renderInbox(); bindInbox(); }
    else if(S.view==='today'){ main.innerHTML=renderToday(); bindToday(); }
    else if(S.view==='time'){ main.innerHTML=renderTime(); bindTime(); }
    else if(S.view==='sources'){ main.innerHTML=renderSources(); bindSources(); }
    bindNav(main);
  }catch(e){ $('#errsink').textContent='render error: '+e.message; console.error(e); }
}
function bindNav(root){
  $$('[data-go]',root).forEach(el=>{ if(el.dataset.bound) return; el.dataset.bound=1; el.addEventListener('click',ev=>{ ev.stopPropagation(); const [t,i]=el.dataset.go.split('|'); go(t,i); }); });
}
const isSel = (t,i) => S.detail && S.detail[0]===t && String(S.detail[1])===String(i) ? 'sel' : '';

function renderRoom(){
  const c=CTX[S.ctx]; const isEpic=c.kind==='epic', isLabel=c.kind==='ad-hoc label';
  const head=`<div class="roomhead"><h1>${c.key?`<span class="k">${c.key}</span>`:''}${esc(c.name)}</h1><span class="kind">${c.kind}${c.status?` · <span class="st">${esc(c.status)}</span>`:''}${S.timer.running&&S.timer.ctx===S.ctx?' · <span style="color:var(--gold)">clock running</span>':''}</span>
    <div class="roomacts">${isLabel?`<button class="btn" id="ra-logticket">Log to a ticket…</button>`:`<button class="btn" id="ra-start">Start work ▾</button><button class="btn" id="ra-build">Trigger build</button><button class="btn" id="ra-ticket">${isEpic?'New ticket in this epic':'New ticket'}</button><button class="btn" id="ra-page">New page</button>`}<button class="btn" id="ra-note">New note</button><button class="btn ghost" id="ra-link"><svg class="ico"><use href="#g-link"/></svg>Link to…</button></div></div>`;
  return `<div class="room">${head}<div class="tiles">${tileTickets(c)}${tileCode(c)}${tileBuilds(c)}${tileDocs(c)}${tileNotes(c)}${tileTime(c)}</div>${renderTray(c)}</div>`;
}
function ticketCard(k){
  const t=DB.tickets[k]||S.extraTickets.find(x=>x.key===k); const a=PEOPLE[t.assignee];
  return `<button class="card ${isSel('ticket',k)}" data-go="ticket|${k}"><span class="k">${k}</span><span class="sum">${esc(t.summary)}</span><span class="meta"><span>${t.type}</span><span>${t.priority}</span>${t.blockedBy&&status(t.blockedBy)!=='Done'?`<span class="blk">⛔ ${t.blockedBy}</span>`:''}${k==='OPS-77'?'<span class="blk">blocks PAY-228</span>':''}<span class="who" title="${a.name}">${a.ini}</span></span>${t.assignedNote?'<span class="new">new</span>':''}</button>`;
}
function tileTickets(c){
  const cols=['To Do','In Progress','In Review','Done'];
  if(!c.tickets.length) return `<div class="tile"><div class="tilehead"><span class="sc">tickets</span>${srcTag('jira')}</div><div class="empty">No ticket for this work — and that's fine. If it turns out to be one, attach it:<br><button class="btn sm" id="t-logticket">Log to a ticket… <span class="k" style="font-size:11px">OPS-77?</span></button></div></div>`;
  const all=[...c.tickets,...S.extraTickets.filter(t=>c.kind==='epic').map(t=>t.key)];
  return `<div class="tile"><div class="tilehead"><span class="sc">tickets</span><span class="cnt">${all.length}</span>${srcTag('jira')}<span class="acts">${c.kind==='epic'?`<button class="btn ghost" data-go="epic|PAY-200" title="Epic PAY-200">epic · ${all.filter(k=>status(k)==='Done').length} of ${all.length} done</button>`:''}</span></div>
    <div class="board">${cols.map(col=>`<div class="col"><span class="sc">${col}<span class="cnt">${all.filter(k=>status(k)===col).length}</span></span>${all.filter(k=>status(k)===col).map(ticketCard).join('')}</div>`).join('')}</div></div>`;
}
function tileCode(c){
  if(!c.branches.length&&!c.prs.length) return `<div class="tile"><div class="tilehead"><span class="sc">code</span>${srcTag('git')}</div><div class="empty">No branch, PR or commit is linked here. Not all work is code.</div></div>`;

  return `<div class="tile"><div class="tilehead"><span class="sc">code</span>${srcTag('git')}<span class="acts"><button class="btn ghost" id="git-pull">Pull</button><button class="btn ghost" id="git-push">Push</button><button class="btn ghost" id="git-branch">New branch</button><button class="btn ghost" id="git-repo">Create repo</button></span></div>
    ${brs.map(b=>`<button class="row ${isSel('branch',b[1])}" data-go="branch|${b[1]}"><span class="k">⎇</span><span class="lbl">${b[1]}<small>${b[0]} · ${b[2]}</small></span></button>`).join('')}
    ${prs.map(p=>`<button class="row ${isSel('pr',p.num)}" data-go="pr|${p.num}"><span class="k">PR #${p.num}</span><span class="lbl">${esc(p.title)}<small>${p.repo} · ${P(p.by)}</small></span>${p.state==='merged'?'<span class="st merged">merged</span>':p.state==='open'?`<span class="st open">${p.approvals==='1 of 2'?'1/2 ✓':p.approvals==='0 of 2'?'review ⟶ you':'open'}</span>`:''}${p.checks&&p.checks.length?`<span class="checks">${p.checks.map(ch=>`<span class="st ${ch.st==='failed'?'fail':'run'}">${ch.st==='failed'?'✖':'<span class="spin"></span>'}#${ch.num}</span>`).join('')}</span>`:''}</button>`).join('')}
    ${c.commits.length?`<div style="margin-top:6px">${c.commits.map(s=>{const m=DB.commits[s];return `<button class="row ${isSel('commit',s)}" data-go="commit|${s}" style="padding-top:3px;padding-bottom:3px"><span class="k" style="color:var(--teal)">${s}</span><span class="lbl" style="font-size:13px">${esc(m.msg)}</span><span class="t">${m.when}</span></button>`;}).join('')}</div>`:''}</div>`;
}
function tileBuilds(c){

    ${ids.map(id=>{const b=DB.builds[id]||S.builds[id];return `<button class="row ${isSel('build',id)}" data-go="build|${id}"><span class="k">#${b.num}</span><span class="lbl">${b.conf}<small>${b.branch}</small></span>${buildBadge(b,true)}<span class="t">${b.when.replace('started ','')}</span></button>`;}).join('')}</div>`;
}
function tileDocs(c){
  const ids=[...c.pages,...S.extraPages.map(p=>p.id)];

}
function tileNotes(c){
  const ids=[...c.notes,...S.extraNotes.filter(n=>n.ctx===S.ctx).map(n=>n.id)];
  const body = ids.length ? ids.map(id=>{const n=noteById(id);return `<button class="row ${isSel('note',id)}" data-go="note|${id}"><span class="lbl">${esc(n.title)}<small>${n.links.map(l=>'[['+esc(l)+']]').join(' ')}</small></span><span class="t">${n.edited}</span></button>`;}).join('')
    : `<div class="empty">No notes yet in this context. Write one — it is pre-linked to <b style="font-style:normal;color:var(--text)">${esc(c.name)}</b>.<br><button class="btn sm" id="n-new">New note</button></div>`;

}
function tileTime(c){
  const t=c.time; const mine=S.timer.running&&S.timer.ctx===S.ctx;
  const rows=t.rows.map(r=>`<div class="blk-row"><span class="t">${r[0]}</span><span class="bar ${r[2].startsWith('manual')?'manual':''}" style="width:${Math.max(18,Math.round(parseInt(r[3])*(r[3].includes('h')?60:1)/1.6))}px"></span><span class="lbl">${esc(r[1])}</span><span class="how">${r[2]}</span></div>`).join('');
  const isLabel=c.kind==='ad-hoc label';
  return `<div class="tile"><div class="tilehead"><span class="sc">time in this context</span><span class="acts">${mine?`<button class="btn ghost" id="tm-stop">Stop ${fmt(elapsed())}</button>`:`<button class="btn ghost" id="tm-start">${S.timer.running?'Switch timer here':'Start timer'}</button>`}</span></div>
    <div class="timebig"><div><div class="n ${mine?'gold':''}">${mine?hm(parseDur(t.today)+ (elapsed()-34*60)):t.today}</div><div class="l">today</div></div><div><div class="n">${t.week}</div><div class="l">this week</div></div><div><div class="n" style="color:var(--coral)">${S.todayLogged&&S.ctx!=='staging-db'?'0m':t.unlogged}</div><div class="l">unlogged</div></div></div>
    ${rows}
    <div style="margin-top:auto;padding-top:8px;display:flex;gap:6px">${isLabel?(S.stagingLogged?`<span class="st ok">✓ ${S.stagingLogged}</span>`:`<button class="btn" id="tm-logticket">Log to a ticket… <span class="k" style="font-size:11px;color:var(--teal)">OPS-77</span></button><button class="btn ghost" id="tm-local">Keep local only</button>`):(S.todayLogged?`<span class="st ok">✓ logged 2h 44m to PAY-231</span>`:`<button class="btn" id="tm-logtoday">Log today (${S.ctx==='PAY-200'?'3h 39m':'2h 44m'})</button><button class="btn ghost" data-nav="time">Day review</button>`)}</div></div>`;
}
function parseDur(s){ const h=(s.match(/(\d+)h/)||[0,0])[1], m=(s.match(/(\d+)m/)||[0,0])[1]; return (+h*60+ +m)*60; }

const SUGG_STOPS = {sepa:[['commit','a41f2c','g1']],drift:[['build','412','g2']],dash:[['page','payments-arch','g4']]};
function routeOf(type,id){
  for(const k in ROUTES){ if(ROUTES[k].some(s=>s[0]===type&&String(s[1])===String(id))) return k; }
  if(type==='commit') return 'sepa';
  if(type==='build'&&S.builds[id]) return 'sepa';
  if(type==='pr'&&S.extraPrs.some(p=>String(p.num)===String(id))) return 'dash';
  return null;
}
function routeStrip(type,id){
  const k=routeOf(type,id); if(!k) return '';
  let stops=ROUTES[k].slice();
  if(k==='dash'){ S.extraBranches.forEach(b=>stops.push(['branch',b[1]])); S.extraPrs.forEach(p=>stops.push(['pr',String(p.num)])); }
  if(k==='sepa'){ Object.keys(S.builds).forEach(b=>stops.push(['build',b])); }
  const sugg=(SUGG_STOPS[k]||[]).filter(s=>!S.dismissed[s[2]]);
  const all=[...stops,...sugg.map(s=>[s[0],s[1],S.confirmed[s[2]]?'justconfirmed':'sugg'])];
  const gap=112, w=Math.max(all.length*gap+20, 400);
  let svg=`<svg viewBox="0 0 ${w} 64" width="${w}" height="64" role="img" aria-label="Route through linked items">`;
  all.forEach((s,i)=>{
    const x=30+i*gap, y=24; const cur=s[0]===type&&String(s[1])===String(id);
    const isSugg=s[2]==='sugg', just=s[2]==='justconfirmed', fail=s[0]==='build'&&(DB.builds[s[1]]||S.builds[s[1]]||{}).st==='failed', blocker=s[2]==='blocker';
    if(i>0) svg+=`<path class="path ${isSugg?'sugg':''} ${just?'draw':''}" d="M${x-gap+6} ${y} C ${x-gap/2} ${y-10}, ${x-gap/2} ${y+10}, ${x-6} ${y}"/>`;
    const lbl=entLabel(s[0],s[1]); const sub=s[0]==='branch'?'branch':s[0]==='page'?'wiki':s[0]==='note'?'note':s[0]==='build'?(DB.builds[s[1]]||S.builds[s[1]]).st:s[0]==='pr'?(prById(s[1])||{}).state:s[0]==='commit'?'commit':blocker?'blocks':DB.tickets[s[1]]?status(s[1]).toLowerCase():'';
    svg+=`<g class="st" data-go="${s[0]}|${s[1]}"><circle class="wp ${cur?'cur':''} ${fail?'fail':''} ${isSugg?'sugg':''}" cx="${x}" cy="${y}" r="${cur?5:4}" ${blocker?'style="stroke:var(--coral)"':''}/><text x="${x}" y="${y+20}" text-anchor="middle" class="${cur?'cur':''}">${esc(lbl.length>16?lbl.slice(0,15)+'…':lbl)}</text><text x="${x}" y="${y+32}" text-anchor="middle" class="lbl">${esc(sub)}${isSugg?' · suggested':''}</text></g>`;

function chipFor(l){

  if((m=l.match(/^PR #(\d+)$/))) return `<button class="chip" data-go="pr|${m[1]}">${l}</button>`;
  if((m=l.match(/^#(\d+)$/))) return `<button class="chip" data-go="build|${m[1]}">${l}</button>`;
  const pg=Object.values(DB.pages).find(p=>p.title===l); if(pg) return `<button class="chip" data-go="page|${pg.id}">${esc(l)}</button>`;
  const ctx=Object.values(CTX).find(c=>c.name===l); if(ctx) return `<button class="chip gold" data-goctx="${ctx.id}">${esc(l)}</button>`;
  return `<span class="chip faint">${esc(l)}</span>`;
}

function buildIndex(){
  const ix=[];
  const push=o=>ix.push(o);
  Object.values(DB.tickets).forEach(t=>push({type:'ticket',id:t.key,label:t.key,title:t.summary,sub:`${t.type} · ${status(t.key)} · ${P(t.assignee)}`,src:'jira',who:[t.assignee],when:t.updated,
    text:(t.summary+' '+t.description).replace(/<[^>]+>/g,' ').toLowerCase(),fail:t.key==='PAY-231'}));
  S.extraTickets.forEach(t=>push({type:'ticket',id:t.key,label:t.key,title:t.summary,sub:`${t.type} · ${status(t.key)} · Mara`,src:'jira',who:['mara.lindqvist'],when:'today',text:(t.summary+' '+t.description).toLowerCase()}));
  Object.values(DB.pages).forEach(p=>push({type:'page',id:p.id,label:p.title,title:'ENG · '+PEOPLE[p.by].name,sub:'edited '+p.edited,src:'wiki',who:[p.by],when:p.edited,text:(p.title+' '+p.body).replace(/<[^>]+>/g,' ').toLowerCase()}));
  Object.values(DB.prs).forEach(p=>push({type:'pr',id:String(p.num),label:'PR #'+p.num,title:p.title,sub:`${p.repo} · ${p.state} · ${P(p.by)}`,src:'git',who:[p.by],when:p.opened,text:(p.title+' '+p.from+' '+p.repo).toLowerCase(),fail:p.num===142}));
  Object.values(DB.commits).forEach(c=>push({type:'commit',id:c.sha,label:c.sha,title:c.msg,sub:'payout-service · Mara',src:'git',who:['mara.lindqvist'],when:c.when,text:(c.msg+' '+c.branch).toLowerCase()}));
  Object.values(DB.builds).concat(Object.values(S.builds)).forEach(b=>push({type:'build',id:String(b.num),label:'#'+b.num,title:b.conf,sub:b.branch,src:'ci',who:[],when:b.when,text:(b.conf+' '+b.branch).toLowerCase(),fail:b.st==='failed'}));
  Object.values(DB.notes).concat(S.extraNotes).forEach(n=>push({type:'note',id:n.id,label:n.title,title:(S.noteBodies[n.id]??n.body).slice(0,70),sub:'local · '+n.edited,src:'note',who:['mara.lindqvist'],when:n.edited,text:(n.title+' '+(S.noteBodies[n.id]??n.body)+' '+n.links.join(' ')).toLowerCase()}));
  return ix;
}
const FILTERS=[
  {g:'source',k:'jira',l:'jira'},{g:'source',k:'wiki',l:'wiki'},{g:'source',k:'git',l:'git'},{g:'source',k:'ci',l:'ci'},{g:'source',k:'note',l:'notes'},
  {g:'people',k:'mara.lindqvist',l:'Mara'},{g:'people',k:'jonas.becker',l:'Jonas'},{g:'people',k:'priya.nair',l:'Priya'},
  {g:'date',k:'today',l:'today'},{g:'date',k:'week',l:'this week'},

];

function markup(text,toks){
  let out=esc(text);
  toks.forEach(t=>{ if(t.length<2) return; out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); });
  return out;
}
function listResults(id){

  switch(id){

function drawSearch(){
  const toks=S.searchQ.trim().toLowerCase().split(/\s+/).filter(Boolean);
  $('#s-lists').innerHTML=`<span class="sc">smart lists</span>`
    +DB.smartlists.map(l=>`<button class="slist ${S.searchList===l.id?'on':''}" data-list="${l.id}"><span style="flex:1;min-width:0">${esc(l.name)}${l.nojql?'<span class="nojql">joins Jira ↔ Gitea ↔ TeamCity — JQL cannot express this</span>':''}</span>${l.delta?`<span class="delta">${l.delta}</span>`:''}<span class="cnt">${l.count}</span></button>`).join('')
    +`<span class="sc" style="margin-top:12px">rooms</span>`
    +Object.values(CTX).map(c=>`<button class="slist" data-openctx="${c.id}"><span style="flex:1;min-width:0">${esc(c.key||c.name)}</span><span class="cnt">${c.tickets.length+c.prs.length+c.pages.length+c.notes.length}</span></button>`).join('');
  let groups='';
  ['source','people','date','cross-source'].forEach(g=>{
    groups+=`<span class="sc" style="font-size:11.5px;margin-right:2px">${g}</span>`+
      FILTERS.filter(f=>f.g===g).map(f=>`<button class="fchip ${f.x?'x':''} ${S.filters[f.g+':'+f.k]?'on':''}" data-f="${f.g}:${f.k}">${f.l}</button>`).join('');
  });
  $('#s-filters').innerHTML=groups;
  let items,note='',nav=null;
  if(S.searchList){ const r=listResults(S.searchList); items=r.items.filter(Boolean); note=r.note; nav=r.nav; }
  else {
    items=buildIndex().filter(it=>{
      if(toks.length && !toks.every(t=>(it.label+' '+it.title+' '+it.text).toLowerCase().includes(t))) return false;
      const srcOn=FILTERS.filter(f=>f.g==='source'&&S.filters['source:'+f.k]).map(f=>f.k);
      if(srcOn.length && !srcOn.includes(it.src)) return false;
      const whoOn=FILTERS.filter(f=>f.g==='people'&&S.filters['people:'+f.k]).map(f=>f.k);
      if(whoOn.length && !it.who.some(w=>whoOn.includes(w))) return false;
      if(S.filters['date:today'] && !/today/.test(it.when||'')) return false;
      if(S.filters['date:week'] && !/today|yesterday|2026-08-1[789]|2026-08-2[012]/.test(it.when||'')) return false;
      if(S.filters['cross-source:fail'] && !it.fail) return false;
      return true;
    });
    const order={ticket:0,page:1,pr:2,commit:3,build:4,note:5};
    items.sort((a,b)=>(order[a.type]-order[b.type])||String(a.id).localeCompare(String(b.id)));
  }
  const head=note?`<div style="padding:8px 14px 4px;color:var(--muted);font-size:12.5px;font-family:var(--display);font-style:italic;line-height:1.5">${esc(note)}${nav?` <button class="btn sm" data-nav="${nav}">Open the day review</button>`:''}</div>`:'';
  const rows=items.map(it=>`<div class="sr" role="button" tabindex="0" data-go="${it.type}|${it.id}" title="Open ${esc(it.label)}">
      ${srcTag(it.src)}<span class="k">${esc(it.label.length>28?it.label.slice(0,27)+'…':it.label)}</span>
      <span class="lbl">${markup(it.title,toks)}<small style="color:var(--faint);margin-left:6px">${esc(it.sub||'')}</small></span>
      ${it.fail?'<span class="st fail">✖ build</span>':''}
      <span class="t">${SYNCED[it.src]}</span>
      <button class="add ${S.searchAdds[it.type+it.id]?'did':''}" data-add="${it.type}|${it.id}">${S.searchAdds[it.type+it.id]?'✓ in room':'+ this room'}</button></div>`).join('');
  $('#s-res').innerHTML=head+(items.length?rows:(note?'':`<div class="snone">Nothing in the local index matches “${esc(S.searchQ)}”. Try fewer words, or clear the filters.</div>`))
    +(items.length?`<div style="padding:8px 14px;color:var(--faint);font-size:12px;font-family:var(--mono)">${items.length} result${items.length>1?'s':''} · ${new Set(items.map(i=>i.src)).size} sources</div>`:'');
  $$('#s-lists [data-list]').forEach(b=>b.onclick=()=>{ S.searchList=b.dataset.list; S.searchQ=''; $('#s-q').value=''; drawSearch(); });
  $$('#s-lists [data-openctx]').forEach(b=>b.onclick=()=>{ closeModal(); location.hash='#/room/'+b.dataset.openctx; });
  $$('#s-filters [data-f]').forEach(b=>b.onclick=()=>{ const k=b.dataset.f; S.filters[k]=!S.filters[k]; S.searchList=null; drawSearch(); });
  $$('#s-res .sr').forEach(el=>{
    el.onclick=()=>{ const [t,i]=el.dataset.go.split('|'); closeModal(); go(t,i); };
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } };
  });
  $$('#s-res .add').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation(); const [t,i]=b.dataset.add.split('|');
    addToContext(t,i); b.textContent='✓ in room'; b.classList.add('did');
  });
  $$('#s-res [data-nav]').forEach(b=>b.onclick=()=>{ closeModal(); location.hash='#/'+b.dataset.nav; });
}
function addToContext(type,id){

  const here=live.filter(i=>i.ctx.includes(S.ctx));
  const only=S.filters['inbox:here'];
  const shown=only?here:live;
  const open=live.filter(i=>!S.inboxDone[i.id]);
  const snoozedIds=Object.keys(S.inboxSnoozed);
  return `<div class="view"><div class="vhead"><h1>Inbox</h1><span class="sub">${open.length} open · ${here.filter(i=>!S.inboxDone[i.id]).length} belong to the <b style="color:var(--muted)">${esc(CTX[S.ctx].key||CTX[S.ctx].name)}</b> room</span>
      <div class="acts"><div class="seg"><button class="${only?'':'on'}" data-inbox="all">Everything</button><button class="${only?'on':''}" data-inbox="here">In this room</button></div>
      <button class="btn ghost" data-nav="room/${S.ctx}">Back to the room</button></div></div>
    <div class="vbody">
      ${shown.length?shown.map(inboxRow).join(''):'<div class="snone">Nothing here. Switch to <b>Everything</b> to see the rest of the queue.</div>'}
      <div class="sect">snoozed<span class="cnt">${DB.snoozed.length+snoozedIds.length}</span></div>
      ${DB.snoozed.map(s=>`<div class="ibx" style="opacity:.7"><span class="t">returns</span><div class="bd"><div class="txt">${esc(s.text)}</div><div class="ctxlbl">comes back ${s.returns} · Jira PAT, source <b style="color:var(--muted)">Tidewater Jira</b></div></div><div class="acts"><button class="btn sm" data-nav="sources">Open sources</button><button class="btn sm ghost" data-wake="${s.id}">Wake now</button></div></div>`).join('')}
      ${snoozedIds.map(id=>{const it=DB.inbox.find(x=>x.id===id);return `<div class="ibx" style="opacity:.7"><span class="t">${it.when}</span><div class="bd"><div class="txt">${it.text}</div><div class="ctxlbl">snoozed until Monday 2026-08-24</div></div><div class="acts"><button class="btn sm ghost" data-unsnooze="${id}">Bring back</button></div></div>`;}).join('')}
    </div></div>`;
}
function inboxRow(i){
  const done=S.inboxDone[i.id];
  const inctx=i.ctx.includes(S.ctx);
  const rooms=i.ctx.map(c=>`<span class="k">${CTX[c]?(CTX[c].key||CTX[c].name):c}</span>`).join(' · ');
  const acts=done?`<span class="st ok">✓ done ${clock()}</span><button class="btn sm ghost" data-undo="${i.id}">Undo</button>`
    :i.actions.map(a=>`<button class="btn sm ${a==='Review'||a==='Reply'||a==='Open log'?'':'ghost'}" data-act="${i.id}|${a}">${a}</button>`).join('');
  return `<div class="ibx ${inctx?'inctx':''} ${done?'done':''}" id="ibx-${i.id}">
    <span class="t">${i.when}</span>
    <div class="bd"><div class="txt">${i.text}</div>${i.quote?`<div class="q">“${esc(i.quote)}”</div>`:''}
      <div class="ctxlbl">room ${rooms}</div>
      <div class="reply hid" id="rep-${i.id}"><input type="text" placeholder="${i.id==='i2'?'Reply to Priya…':'Reply to Jonas…'}" value="${i.id==='i2'?'Proposing 2 business days — adding it to the Manual review queue section now.':'Bounded to ±10 % in c90d11.'}"><button class="btn" data-send="${i.id}">Send reply</button></div>
    </div>
    <div class="acts">${acts}</div></div>`;
}
function bindInbox(){
  $$('[data-inbox]').forEach(b=>b.onclick=()=>{ S.filters['inbox:here']=b.dataset.inbox==='here'; render(); });
  $$('[data-nav]').forEach(b=>b.onclick=()=>location.hash='#/'+b.dataset.nav);
  $$('[data-undo]').forEach(b=>b.onclick=()=>{ delete S.inboxDone[b.dataset.undo]; render(); });
  $$('[data-unsnooze]').forEach(b=>b.onclick=()=>{ delete S.inboxSnoozed[b.dataset.unsnooze]; render(); toast('Back in the inbox.'); });
  $$('[data-wake]').forEach(b=>b.onclick=()=>toast('Jira PAT reminder is back in the inbox. It expires 2026-09-03.','teal'));
  $$('[data-send]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.send, v=$('#rep-'+id+' input').value.trim(); if(!v) return;
    if(id==='i2'){ S.created['reply-sepa-retry-design']=v; }
    else { (S.prComments['142']=S.prComments['142']||[]).push({who:'mara.lindqvist',when:'today '+clock(),text:esc(v)}); }
    S.inboxDone[id]=true; render();
    toast(id==='i2'?'Reply posted on <b>SEPA payout retry design</b>.':'Reply posted on <span class="k">PR #142</span>.','teal');
  });
  $$('[data-act]').forEach(b=>b.onclick=()=>{
    const [id,a]=b.dataset.act.split('|');
    const done=()=>{ S.inboxDone[id]=true; render(); };
    if(a==='Done'){ done(); toast('Marked done.'); return; }
    if(a==='Snooze'){ S.inboxSnoozed[id]=true; render(); toast('Snoozed until Monday 2026-08-24 09:00.','', {label:'Undo',fn:()=>{delete S.inboxSnoozed[id];render();}}); return; }
    if(a==='Reply'){ $('#rep-'+id).classList.remove('hid'); $('#rep-'+id+' input').focus(); return; }
    if(a==='Review'){ done(); go('pr','144'); return; }
    if(a==='Open page'){ go('page','sepa-retry-design'); return; }
    if(a==='Open log'){ go('build','1187'); return; }
    if(a==='Re-run'){ rerunBuild('1187'); return; }
    if(a==='Comment on PAY-231'){ go('ticket','PAY-231'); setTimeout(()=>{ const ta=$('#c-new'); if(ta){ ta.value='Build #1187 fails on gives_up_after_max_attempts — the counter starts at 0, so it runs 6 attempts. Fixing.'; ta.focus(); } },80); return; }
    if(a==='Open PR'){ go('pr','142'); return; }
    if(a==='Open'){ go('ticket','PAY-240'); return; }
    if(a==='Start work'){ startWork('PAY-240'); return; }
    if(a==='Open OPS-77'){ go('ticket','OPS-77'); return; }
    if(a==='Ping Tomasz'){ done(); toast('Pinged <b>Tomasz Wójcik</b> on OPS-77: “PAY-228 staging verification is waiting on the runbook — any ETA?”','teal'); return; }
  });
}

/* =========================================================
   TIME — the day as a journey with legs, plus the week
   ========================================================= */
const DAY0=8*60+15, DAY1=14*60+45;
const mins=t=>{const a=t.split(':');return +a[0]*60 + +a[1];};
const pctOf=t=>((mins(t)-DAY0)/(DAY1-DAY0))*100;
const BLKCLASS={inbox:'c-inbox',pay228:'c-pay228',pay231:'c-pay231',staging:'c-staging',un:'un',gap:'gap'};
const BLKROOM={pay231:'PAY-231',pay228:'PAY-200',staging:'staging-db',inbox:null,un:null,gap:null};
function blockOf(i){ const b=Object.assign({},DB.blocks[i]); const a=S.assigned[i]; if(a){ b.ctx=a.ctx; b.label=a.label; b.how='assigned by you'; } return b; }
function blkMin(b){ return mins(b.e)-mins(b.s); }
function renderTime(){
  const blocks=DB.blocks.map((_,i)=>blockOf(i));
  const tracked=blocks.filter(b=>b.ctx!=='gap').reduce((s,b)=>s+blkMin(b),0);
  const loggable=blocks.filter(b=>b.ctx==='pay231'||b.ctx==='pay228').reduce((s,b)=>s+blkMin(b),0);
  const rest=tracked-loggable;
  const strip=`<div class="daystrip" id="daystrip">
    ${[9,10,11,12,13,14].map(h=>`<div class="tick" style="left:${pctOf(h+':00')}%"><span>${h}:00</span></div>`).join('')}
    <div class="now" style="left:${pctOf('14:32')}%"><span>${clock()}</span></div>
    ${blocks.map((b,i)=>{
      const w=pctOf(b.e)-pctOf(b.s);
      const cls=`${BLKCLASS[b.ctx]||''} ${/passive/.test(b.how)?'passive':''} ${S.selBlock===i?'sel':''}`;
      return `<div class="dblk ${cls}" data-blk="${i}" style="left:${pctOf(b.s)}%;width:${w}%" tabindex="0" role="button" title="${b.s}–${b.e} · ${esc(b.label)} · ${esc(b.how)}">${esc(b.label.length>26?b.label.slice(0,25)+'…':b.label)}<span class="l">${b.s}–${b.e} · ${hm(blkMin(b)*60)}</span></div>`;
    }).join('')}</div>
    <div class="legend"><span><i style="background:rgba(63,184,175,.28);background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(18,26,44,.5) 3px 5px)"></i>passive — what was open in the app</span><span><i style="background:rgba(63,184,175,.28)"></i>manual timer or label</span><span><i style="background:var(--coral-dim);border:1px dashed var(--coral)"></i>unattributed</span><span style="color:var(--faint);font-style:italic;font-family:var(--display)">colour is the room · no branch is ever used to attribute time</span></div>`;
  const legs=blocks.map((b,i)=>{
    if(b.ctx==='gap') return `<div class="legrow" style="opacity:.5;border-left-color:transparent"><span class="t">${b.s}–${b.e}</span><span class="dur">${hm(blkMin(b)*60)}</span><span class="lbl" style="font-family:var(--display);font-style:italic;color:var(--faint)">${esc(b.label)}</span></div>`;
    const kind=b.ctx==='un'?'un':/manual|assigned/.test(b.how)?'manual':'passive';
    let acts='';
    if(b.ctx==='un') acts=S.assigned[i]?'':`<button class="btn sm pri" data-assign="${i}">Assign…</button><button class="btn sm ghost" data-drop="${i}">Not work</button>`;
    else if(b.ctx==='staging') acts=S.stagingLogged?`<span class="st ok">✓ ${esc(S.stagingLogged)}</span>`:`<button class="btn sm" id="lg-staging">Log to a ticket…</button><button class="btn sm ghost" id="lg-local">Keep local only</button>`;
    else if(b.ctx==='inbox') acts=`<button class="btn sm ghost" data-assign="${i}">Assign…</button><span style="color:var(--faint);font-size:11.5px">stays local by default</span>`;
    else acts=`<button class="btn sm ghost" data-goctx="${BLKROOM[b.ctx]}">Open the room</button>`;
    return `<div class="legrow ${kind}"><span class="t">${b.s}–${b.e}</span><span class="dur">${hm(blkMin(b)*60)}</span><span class="lbl">${esc(b.label)}</span><span class="how">${esc(b.how)}</span><span class="acts">${acts}</span></div>`;
  }).join('');
  const friLogged=S.loggedToday;
  const rows=DB.week.map(w=>{
    const isFri=w[0]==='Fri', logged=isFri?friLogged:w[3], un=w[2]-logged;
    const px=m=>Math.round(m/480*120);
    return `<tr><td>${w[0]}${isFri?' <span style="color:var(--gold)">· today</span>':''}</td><td>${w[1]}</td><td>${logged?hm(logged*60):'—'}</td><td class="${un?'un':''}">${un?hm(un*60):'0m'}</td>
      <td><div class="bar"><i style="width:${px(logged)}px"></i><b style="left:${px(logged)}px;width:${px(un)}px"></b></div></td></tr>`;
  }).join('');
  const totT=DB.week.reduce((s,w)=>s+w[2],0), totL=DB.week.reduce((s,w)=>s+(w[0]==='Fri'?friLogged:w[3]),0);
  return `<div class="view"><div class="vhead"><h1>Day review</h1><span class="sub">Friday 2026-08-22 · ${hm(tracked*60)} tracked since 08:30 · ${hm((tracked-friLogged)*60)} not logged</span>
      <div class="acts"><button class="btn ghost" data-nav="today">Standup</button>${S.loggedToday>=loggable?`<span class="st ok">✓ ${hm(S.loggedToday*60)} logged today</span>`:`<button class="btn pri" id="tv-logall">Log all (${hm(loggable*60)})</button>`}</div></div>
    <div class="vbody">
      <div class="sect">the day as one journey<span style="margin-left:auto;font-family:var(--ui);font-variant:normal;letter-spacing:0;font-size:12px;color:var(--faint)">blocks are coloured by room</span></div>
      ${strip}
      ${legs}
      <p style="color:var(--faint);font-size:12.5px;margin:8px 0 0;line-height:1.5">${rest?`${hm(rest*60)} has no ticket: ${hm(15*60)} inbox and standup, ${S.assigned[3]?'':hm(30*60)+' unattributed, '}${S.stagingLogged?'':hm(48*60)+' Staging DB configuration'}${S.stagingLogged&&S.assigned[3]?'and both are settled':''}. Ticketed time is ${hm(loggable*60)}.`:''}</p>
      <div class="sect" style="margin-top:22px">this week<span class="acts"><button class="btn sm ghost" id="tv-export">Export CSV</button></span></div>
      <table class="week"><thead><tr><th>day</th><th>tracked</th><th>logged to Jira</th><th>unlogged</th><th style="width:130px"></th></tr></thead>
        <tbody>${rows}<tr class="tot"><td>total</td><td>${hm(totT*60)}</td><td>${hm(totL*60)}</td><td>${hm((totT-totL)*60)}</td><td></td></tr></tbody></table>
      <p style="color:var(--faint);font-size:12.5px;margin-top:8px">Monday to Thursday are fully logged. Everything unlogged is today.</p>
    </div></div>`;
}

/* =========================================================

function ask(html,actions){
  const t=document.createElement('div'); t.className='toast teal';
  t.innerHTML=`<span>${html}</span>`;
  actions.forEach(a=>{ const b=document.createElement('button'); b.className='btn sm'+(a.pri?' pri':' ghost'); b.textContent=a.label; b.onclick=()=>{t.remove();a.fn();}; t.appendChild(b); });
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(),9000);
}
function askSwitchTimer(id){
  const c=CTX[id], from=S.timer.label;
  ask(`Clock is still running in <b>${esc(from)}</b>. Switch it to <b>${esc(c.key||c.name)}</b>?`,
    [{label:'Switch the clock',pri:true,fn:()=>startTimer(id)},{label:'Keep it in '+from,fn:()=>toast(`Clock stays in <b>${esc(from)}</b>.`)}]);
}
function startTimer(id){
  const c=CTX[id]||CTX[S.ctx];
  S.timer={running:true,ctx:c.id,label:c.key||c.name,startedAt:clock(),base:0,t0:Date.now()};
  render(); toast(`Clock running in <b>${esc(c.key||c.name)}</b> since ${S.timer.startedAt}.`,'teal');
}
function toggleTimer(){
  if(S.timer.running) stopTimer(); else startTimer(S.ctx);
}
function stopTimer(){
  if(!S.timer.running){ startTimer(S.ctx); return; }
  if(S.timer.ctx==='PAY-231'&&!S.todayLogged){ worklogDraft('pay231',true); return; }
  if(S.timer.ctx==='staging-db'){ S.timer.running=false; render(); logStaging(); return; }
  const el=elapsed(); S.timer.running=false; render();
  toast(`Clock stopped in <b>${esc(S.timer.label)}</b> after ${fmt(el)}.`,'',{label:'Resume',fn:()=>startTimer(S.timer.ctx)});
}

function genComment(){
  const on=ACTS.filter(a=>$('#wl-'+a.id)&&$('#wl-'+a.id).checked);
  const shas=on.filter(a=>a.frag==='jitter').map(a=>a.id==='a1'?'a41f2c':'c90d11');

  if(shas.length) parts.push(`Backoff jitter (${shas.join(', ')})`);

function startWork(key){

  const num=145;
  openModal({title:'Start work on '+key,sub:esc(t.summary),wide:true,body:`
