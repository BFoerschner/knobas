      <label class="chk" style="padding:2px 0"><input type="checkbox" id="sw-timer" checked><span>open the <b>${key}</b> room and start its clock</span></label></span></div>
    <div id="sw-steps"></div>`,
    foot:`<span class="note">Gitea and Jira are both writable.</span><span class="r"><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="sw-run">Run the flow</button></span>`});
  $('#sw-run').onclick=()=>{
    const br=$('#sw-branch').value.trim()||branch, title=$('#sw-title').value.trim()||t.summary;
    const trans=$('#sw-trans').checked, tmr=$('#sw-timer').checked;
    const steps=[
      ['create branch',`<span class="k">${esc(br)}</span> from main`,'created'],
      ['push',`to git.tidewater.internal`,'pushed'],
      ['open pull request',`<span class="k">PR #${num}</span> ${esc(title)} → main`,'#'+num+' open'],
      ['link',`<span class="k">PR #${num}</span> ↔ <span class="k">${key}</span>`,'route drawn'],
      ...(trans?[['transition',`${key} → In Progress`,'written to Jira']]:[]),
      ...(tmr?[['open room',`${key} · start its clock`,'running']]:[])
    ];
    $$('#sw-repo,#sw-branch,#sw-title,#sw-desc,#sw-trans,#sw-timer').forEach(e=>e.disabled=true);
    $('#sw-run').disabled=true; $('#sw-run').textContent='Running…';
    $('#sw-steps').innerHTML=`<div class="sect">flow</div><div class="stepper">${steps.map((s,i)=>`<div class="step" id="sw-s${i}"><span class="st-ic">${i+1}</span><span><b style="font-weight:600">${s[0]}</b> ${s[1]}</span><span class="res"></span></div>`).join('')}</div>`;
    let i=0;
    const tick=()=>{
      if(!$('#sw-steps')) return;               // the flow was cancelled — stop cleanly
      if(i>0){ const p=$('#sw-s'+(i-1)); if(p){ p.className='step done'; p.querySelector('.st-ic').textContent='✓'; p.querySelector('.res').textContent=steps[i-1][2]; } }
      if(i>=steps.length){ finish(); return; }
      const cur=$('#sw-s'+i); if(!cur) return;
      cur.className='step run'; cur.querySelector('.res').textContent='…';
      i++; setTimeout(tick, window.matchMedia('(prefers-reduced-motion: reduce)').matches?60:420);
    };
    const finish=()=>{
      S.extraBranches.push(['payout-service',br,'1 commit, checked out']);
      S.extraPrs.push({num,title,repo:'payout-service',from:br,to:'main',state:'open',by:'mara.lindqvist',opened:'today '+clock(),approvals:'0 of 2',reviewReq:'—',ticket:key,checks:[],comments:[],files:[['src/dashboard/query.rs','+2','']]});
      if(trans) S.ticketStatus[key]='In Progress';
      S.inboxDone['i5']=true;
      if(!CTX[key]){
        CTX[key]={id:key,key,name:t.summary,kind:'ticket',status:'In Progress',tickets:[key],branches:[['payout-service',br,'1 commit, checked out']],prs:[],commits:[],builds:[],pages:[],notes:[],
          time:{today:'0m',week:'0m',unlogged:'0m',rows:[]}};
        CTXCLASS[key]='c-staging';
      }
      if($('.mfoot .note')) $('.mfoot .note').innerHTML=`<span class="st ok">✓ ${steps.length} writes across Gitea and Jira, ${clock()}</span>`;
      const runBtn=$('#sw-run');
      if(runBtn) runBtn.replaceWith(Object.assign(document.createElement('button'),{className:'btn pri',textContent:'Open the '+key+' room',onclick:()=>{ closeModal(); location.hash='#/room/'+key; }}));
      if(tmr){ S.timer={running:true,ctx:key,label:key,startedAt:clock(),base:0,t0:Date.now()}; }
      render(); toast(`Started work on <span class="k">${key}</span> — branch, PR #${num}, link and transition.`,'teal');
    };
    tick();
  };
}

    const v=$('#tmr-lbl').value.trim(); if(!v){ $('#tmr-lbl').focus(); return; }
    const id='lbl-'+v.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    if(!CTX[id]){ CTX[id]={id,key:'',name:v,kind:'ad-hoc label',status:'',tickets:[],branches:[],prs:[],commits:[],builds:[],pages:[],notes:[],time:{today:'0m',week:'0m',unlogged:'0m',rows:[]}}; CTXCLASS[id]='c-staging'; }
    closeModal(); startTimer(id); location.hash='#/room/'+id;
  };
  const st=$('#tmr-stop'); if(st) st.onclick=()=>{ S.timer.running=false; closeModal(); render(); toast(`Clock stopped in <b>${esc(S.timer.label)}</b>.`); };
  const sl=$('#tmr-stoplog'); if(sl) sl.onclick=()=>{ closeModal(); stopTimer(); };
  const sr=$('#tmr-start'); if(sr) sr.onclick=()=>{ closeModal(); startTimer(S.ctx); };
}
function bindTop(){
  $('#ctxbtn').onclick=e=>{ e.stopPropagation(); toggleCtxMenu(); };
  $('#timer').onclick=()=>timerMenu();
  $('#b-search').onclick=()=>openSearch();
  $('#b-inbox').onclick=()=>location.hash='#/inbox';
  $('#b-today').onclick=()=>location.hash='#/today';
  $('#b-time').onclick=()=>location.hash='#/time';
  $('#b-sources').onclick=()=>location.hash='#/sources';
  $('#b-sync').onclick=()=>location.hash='#/sources';
  document.addEventListener('mousedown',e=>{ if(S.ctxmenu && !$('#ctxsw').contains(e.target)) toggleCtxMenu(false); });
}
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  const typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
  if(mod && e.key.toLowerCase()==='k'){
    e.preventDefault();
    if($('#s-q')) closeModal(); else openSearch();
    return;
  }
  if(mod && e.key.toLowerCase()==='t'){ e.preventDefault(); toggleTimer(); return; }
  if(e.key==='Escape'){
    if(closeModal()) return;
    if(S.ctxmenu){ toggleCtxMenu(false); return; }
    if(S.detail){ S.detail=null; location.hash='#/room/'+S.ctx; return; }
    if(S.view!=='room'){ location.hash='#/room/'+S.ctx; return; }
    return;
  }
  if(!typing && !modalOpen()){
    if(e.key==='/'){ e.preventDefault(); openSearch(); }
    if(e.key==='i'){ location.hash='#/inbox'; }
    if(e.key==='d'){ location.hash='#/time'; }
    if(e.key==='c'){ toggleCtxMenu(true); }
  }
});
window.addEventListener('error',ev=>{ const s=$('#errsink'); if(s) s.textContent='js error: '+ev.message+' @'+ev.lineno; });

/* live clock */
setInterval(()=>{
  const el=$('#el'); if(el && S.timer.running) el.textContent=fmt(elapsed());
},1000);
setInterval(()=>{
  if(modalOpen()) return;
  if($('#legs') && $('#legs').contains(document.activeElement)) return;
  renderItin();
},20000);

/* boot */
try{
  bindTop();
  window.addEventListener('hashchange',route);
  if(!location.hash) location.hash='#/room/PAY-200';
  route();
  document.title='knobas — '+(CTX[S.ctx].key||CTX[S.ctx].name);
}catch(err){
  $('#errsink').textContent='boot error: '+err.message;
}
</script>
</body>
</html>
