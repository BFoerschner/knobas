<!--
knobas mockup
paradigm: P4 Context hub
design: D5 Index card
thesis: Pick a context — an epic, a ticket, or an ad-hoc label like Staging DB configuration — and one desk holds everything related from every source, with its own clock.
thesis: Contexts are divider tabs on a sage desk; remote entities are printed cards wearing a source tab, and your own notes are yellow lined index cards lying on top of them.
thesis: The pinned index card — drag a note onto a ticket and it stays pinned to that card's corner, in the room and on the ticket.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — PAY-200 Payout reliability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#EEF2EC;--card:#FFFFFF;--edge:#D8E0D5;--sh:rgba(39,49,43,.10);
  --text:#27312B;--muted:#6F7A72;--faint:#A3ACA6;
  --plum:#6B3F8A;--plum-soft:#EEE4FF;--plum-ink:#4E2B68;
  --moss:#4F7A3E;--moss-soft:#E1F2E4;
  --amber:#D9822B;--amber-soft:#FFE9D6;--fail:#C4453A;--fail-soft:#FBE3E0;
  --note:#FFF6C2;--note-edge:#E6D98F;--note-line:rgba(0,0,0,.06);
  --t-jira:#E4E9FF;--t-wiki:#EEE4FF;--t-git:#E1F2E4;--t-ci:#FFE9D6;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-card:12px;--r-ctl:8px;
  --shadow:0 1px 2px var(--sh),0 6px 16px var(--sh);
  --shadow-lift:0 2px 4px var(--sh),0 12px 28px var(--sh);
  --c-pay231:#6B3F8A;--c-pay228:#A98BC4;--c-pay240:#C9B8DB;--c-adhoc:#5A7E99;--c-global:#B5BDB7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.45 var(--body);color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--plum);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:4px}
kbd{font:11px var(--mono);background:var(--desk);border:1px solid var(--edge);border-radius:5px;padding:1px 5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;letter-spacing:-.01em}
svg{display:inline-block;vertical-align:-2px}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-rows:50px 46px 1fr 30px;grid-template-columns:minmax(0,1fr);height:100vh;min-width:1100px}
.top{display:flex;align-items:center;gap:14px;padding:0 18px;min-width:0;overflow:hidden;background:var(--card);border-bottom:1px solid var(--edge);position:relative;z-index:30}
.top .sp{flex:1}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--plum-ink)}
.brand svg{width:22px;height:22px}
.rail{display:flex;align-items:flex-end;gap:6px;min-width:0;height:46px;padding:0 18px;overflow:hidden;background:#E4EAE2;border-bottom:1px solid var(--edge);position:relative;z-index:29}
.rail-label{font:600 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);align-self:center;margin-right:4px}
.ctab{position:relative;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 2px;min-width:0;max-width:260px;flex:0 1 auto;border:1px solid var(--edge);border-bottom:0;border-radius:10px 10px 0 0;background:var(--desk);color:var(--muted);font-weight:500;white-space:nowrap;transition:transform .12s,background .12s}
.ctab:hover{background:#F6F8F5;transform:translateY(-1px)}
.ctab .k{font-family:var(--mono);font-size:12px;flex:none}
.ctab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ctab.active{max-width:420px;flex:0 0 auto}
.ctab .kind{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ctab.active{background:var(--card);color:var(--text);height:42px;border-color:var(--edge);box-shadow:0 -2px 6px var(--sh);z-index:2}
.ctab.active::before{content:"";position:absolute;left:10px;right:10px;top:0;height:3px;background:var(--plum);border-radius:0 0 3px 3px}
.ctab.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--card)}
.rail .rsp{flex:1}
.rail .hint{align-self:center;font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.ctab.adhoc{background:var(--note);border-color:var(--note-edge);color:#5A4E14}
.ctab.adhoc.active::before{background:var(--amber)}
.ctab.adhoc.active{background:#FFF9D6}
.ctab.new{border-style:dashed;color:var(--faint);background:transparent}
.ctab.new:hover{color:var(--plum)}
.ctab .chev{width:14px;height:14px;margin-left:2px}
.topright{display:flex;align-items:center;gap:2px;flex:none}
.tbtn{display:flex;align-items:center;gap:5px;height:34px;padding:0 9px;border-radius:var(--r-ctl);color:var(--text);font-weight:500;border:1px solid transparent;position:relative}
.tbtn:hover{background:var(--desk);text-decoration:none}
.tbtn.on{background:var(--plum-soft);color:var(--plum-ink)}
.tbtn .cnt{background:var(--amber);color:#fff;font:600 11px var(--body);padding:1px 7px;border-radius:999px;min-width:20px;text-align:center}
.tbtn .here{font-size:11px;color:var(--muted)}
.timerbtn{border:1px solid var(--moss);background:var(--moss-soft);color:#2E4F22;font-family:var(--mono);font-size:13px}
.timerbtn.paused{border-color:var(--edge);background:var(--desk);color:var(--muted)}
.timerbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--moss);animation:pulse 1.6s ease-in-out infinite}
.timerbtn.paused .dot{background:var(--faint);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.timerbtn .ctxl{font-family:var(--body);font-weight:600;margin-left:2px}
.sync{display:flex;align-items:center;gap:4px;padding:0 10px;height:34px;border-radius:var(--r-ctl);font-size:12px;color:var(--muted)}
.sync:hover{background:var(--desk);text-decoration:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--moss);display:inline-block}
.sync i.bad{background:var(--fail)}
.sync b{color:var(--fail);font-weight:600;margin-left:3px}
.sync .pend{color:var(--amber);font-weight:600;margin-left:4px}
.status{display:flex;align-items:center;gap:18px;padding:0 18px;font-size:12px;color:var(--muted);background:var(--card);border-top:1px solid var(--edge);white-space:nowrap;overflow:hidden}
.status>span{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.status .sp{flex:1 1 0;min-width:0}
.status i{width:7px;height:7px;border-radius:50%;background:var(--moss);display:inline-block;margin-right:5px}
.status i.bad{background:var(--fail)}

/* ---------- main + room ---------- */
main{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow:auto;padding:22px 26px 28px}
.room-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.room-head h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin-top:3px;font-variation-settings:"opsz" 96}
.room-head h1 .k{font-family:var(--mono);font-weight:500;font-size:20px;color:var(--plum);letter-spacing:0;margin-right:10px;vertical-align:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-ctl);border:1px solid var(--edge);background:var(--card);font-weight:500;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);text-decoration:none}
.btn.primary{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.moss{background:var(--moss);border-color:var(--moss);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.xs{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--desk);box-shadow:none;transform:none}
.btn.danger{color:var(--fail)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 22px;align-items:start}
.tile{position:relative;min-width:0;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 18px 16px;min-height:120px}
.tile.wide{grid-column:1/-1}
.tile h2{font-size:15px;display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.tile h2 .in{font:400 12px var(--body);color:var(--muted)}
.tile h2 .n{font:500 12px var(--mono);color:var(--faint);margin-left:auto}
.tab{position:absolute;top:-11px;left:14px;height:20px;padding:0 9px;border-radius:6px 6px 0 0;font:600 10.5px/20px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--text);border:1px solid var(--edge);border-bottom:0}
.t-jira{background:var(--t-jira)}.t-wiki{background:var(--t-wiki)}.t-git{background:var(--t-git)}.t-ci{background:var(--t-ci)}.t-note{background:var(--note);border-color:var(--note-edge)}.t-local{background:var(--desk)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--edge);background:var(--desk);color:var(--text);white-space:nowrap}
.chip.jira{background:var(--t-jira);border-color:#C9D2FF}.chip.wiki{background:var(--t-wiki);border-color:#D9C8F2}.chip.git{background:var(--t-git);border-color:#BFE0C6}.chip.ci{background:var(--t-ci);border-color:#F2D2B5}.chip.note{background:var(--note);border-color:var(--note-edge)}
.chip .k{font-family:var(--mono);font-weight:500;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.s-todo{background:var(--desk);color:var(--muted)}.s-prog{background:var(--plum-soft);color:var(--plum-ink)}.s-rev{background:var(--amber-soft);color:#8A4D12}.s-done{background:var(--moss-soft);color:#2E4F22}
.s-fail{background:var(--fail-soft);color:#8E2E25}.s-run{background:var(--t-jira);color:#2B3F8A}.s-ok{background:var(--moss-soft);color:#2E4F22}.s-open{background:var(--moss-soft);color:#2E4F22}.s-merged{background:var(--plum-soft);color:var(--plum-ink)}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--plum-soft);color:var(--plum-ink);font:600 10px var(--body);flex:none}
.av.me{background:var(--plum);color:#fff}
.row{display:flex;align-items:center;gap:10px;min-height:42px;padding:4px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;border-bottom:1px solid transparent}
.row:hover{background:#F6F8F5}
.row+.row{border-top:1px solid #EEF1ED}
.row .k{font-family:var(--mono);font-size:12.5px;color:var(--plum);min-width:62px}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);white-space:nowrap}
.empty{padding:14px 16px;border:1px dashed var(--edge);border-radius:10px;color:var(--muted);font-size:13px;background:#F8FAF7}
.empty b{color:var(--text)}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col h4{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:16px;display:flex;gap:6px}
.col h4 span{color:var(--faint);font-weight:500}
.tcard{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:10px 10px 9px;margin-bottom:10px;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 2px var(--sh)}
.tcard:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tcard.over{border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
.tcard .k{font-family:var(--mono);font-size:12px;color:var(--plum);display:flex;align-items:center;gap:6px}
.tcard .s{font-weight:500;font-size:13px;margin:3px 0 6px;line-height:1.3}
.tcard .f{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.tcard .f .av{width:18px;height:18px;font-size:9px;margin-left:auto}
.prio{width:8px;height:8px;border-radius:2px;display:inline-block}
.p-high{background:var(--fail)}.p-med{background:var(--amber)}.p-low{background:var(--faint)}
.blk{display:inline-flex;align-items:center;gap:4px;color:var(--fail);font-weight:600;font-size:11px}
.tcard.hero{padding:16px;cursor:default}
.tcard.hero .s{font-family:var(--display);font-size:19px;font-weight:600;margin:6px 0 10px}
.tcard.hero .f{gap:12px;flex-wrap:wrap}

/* ---------- index cards ---------- */
.icard{--rot:0deg;position:relative;background:var(--note);border:1px solid var(--note-edge);border-radius:10px;padding:26px 14px 12px;box-shadow:0 1px 2px var(--sh),0 6px 14px var(--sh);transform:rotate(var(--rot));transition:transform .12s,box-shadow .12s;cursor:pointer;
 background-image:repeating-linear-gradient(transparent 0 23px,var(--note-line) 23px 24px);background-position:0 18px;color:#3B3510}
.icard:hover{transform:rotate(var(--rot)) translateY(-1px);box-shadow:var(--shadow-lift)}
.icard.drag{opacity:.55}
.icard h5{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2;margin-bottom:4px;color:#2F2A0B}
.icard p{font-size:12.5px;line-height:24px;color:#4C4517;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.icard .m{font-size:11px;color:#8A7D3A;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pin{position:absolute;top:-7px;left:50%;width:22px;height:22px;margin-left:-11px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.tape{position:absolute;top:-8px;left:50%;width:64px;height:18px;margin-left:-32px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);transform:rotate(-2deg);border-radius:2px}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 16px;padding:10px 4px 4px}
.mini{--rot:2deg;position:absolute;top:-12px;right:-12px;width:96px;background:var(--note);border:1px solid var(--note-edge);border-radius:6px;padding:12px 7px 6px;font:500 10.5px/1.2 var(--body);color:#3B3510;box-shadow:0 1px 2px var(--sh),0 4px 10px var(--sh);transform:rotate(var(--rot));z-index:3;background-image:repeating-linear-gradient(transparent 0 11px,var(--note-line) 11px 12px);cursor:pointer}
.mini .pin{width:16px;height:16px;margin-left:-8px;top:-6px}
.mini.drop{animation:pindrop .2s ease-out}
@keyframes pindrop{from{transform:rotate(calc(var(--rot) - 6deg)) scale(1.2) translateY(-8px);opacity:0}to{transform:rotate(var(--rot)) scale(1);opacity:1}}
.mini.m2{--rot:-2deg;top:auto;bottom:-10px;right:-8px}

/* ---------- tray ---------- */
.tray{margin-top:22px;background:#F6F8F5;border:1px dashed var(--edge);border-radius:var(--r-card);padding:14px 18px}
.tray h3{font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tray h3 .n{font:500 12px var(--mono);color:var(--faint)}
.sug{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 0;border-top:1px solid #E6EBE3;font-size:13px}
.sug:first-of-type{border-top:0}
.sug .why{color:var(--muted);font-size:12px;font-style:italic;flex:1}
.sug .arr{color:var(--faint)}
.sug.ok{color:var(--moss)}

/* ---------- panel (card lifted to the right) ---------- */
.scrim{position:absolute;inset:0;background:rgba(39,49,43,.10);z-index:18}
.panel{position:absolute;top:14px;right:14px;bottom:14px;width:min(700px,62vw);background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow-lift);z-index:20;display:flex;flex-direction:column;animation:slidein .2s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel .ph{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--edge)}
.panel .ph .sp{flex:1}
.panel .pb{flex:1;overflow:auto;padding:22px 24px 28px}
.pcard{position:relative;border:1px solid var(--edge);border-radius:12px;padding:18px 20px;margin-top:12px;box-shadow:var(--shadow)}
.pcard h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:4px 0 12px;padding-right:90px}
.pcard .k{font-family:var(--mono);color:var(--plum);font-size:13px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;margin:10px 0}
.meta dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:3px}
.meta dd{font-size:13.5px;display:flex;align-items:center;gap:6px}
.sel{height:26px;border:1px solid var(--edge);border-radius:6px;background:var(--card);padding:0 6px;font-size:12.5px;font-weight:500}
.sec{margin-top:22px}
.sec h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec h3 .n{font:500 12px var(--mono);color:var(--faint)}
.sec h3 .act{margin-left:auto}
.desc{font-size:14px;line-height:1.55;color:#3A453E}
.desc code,.log code{font-family:var(--mono);font-size:12.5px;background:var(--desk);padding:1px 5px;border-radius:4px}
.cmt{display:flex;gap:10px;padding:10px 0;border-top:1px solid #EEF1ED}
.cmt .b{flex:1}.cmt .who{font-weight:600;font-size:13px}.cmt .when{color:var(--faint);font-size:12px;margin-left:6px}
.cmt p{margin-top:2px;font-size:13.5px}
.cmt.new{animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.addc{display:flex;gap:8px;margin-top:8px}
.inp{height:34px;border:1px solid var(--edge);border-radius:var(--r-ctl);padding:0 10px;background:var(--card);flex:1;min-width:0}
.inp:focus{border-color:var(--plum);outline:2px solid var(--plum-soft)}
textarea.inp{height:auto;min-height:70px;padding:8px 10px;line-height:1.45;resize:vertical;width:100%}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field .inp,.field .sel{width:100%;height:34px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.log{font-family:var(--mono);font-size:12px;line-height:1.6;background:#27312B;color:#DDE4DE;border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow:auto}
.log .bad{color:#F2A59C}.log .ok{color:#A9D79A}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.worklog{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #EEF1ED;font-size:13px}
.worklog .d{font-family:var(--mono);color:var(--plum);min-width:60px}
.files{font-family:var(--mono);font-size:12.5px}
.files div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid #EEF1ED}
.files .plus{color:var(--moss)}.files .minus{color:var(--fail);margin-left:6px}
.page-body h4{font-size:15px;margin:16px 0 6px}
.page-body p{font-size:14px;line-height:1.6;color:#3A453E}
.page-body .sla{background:var(--amber-soft);padding:1px 4px;border-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

 p.innerHTML=`<span class="q">Each context keeps its own clock. The timer is running on <b>${esc(S.timer.label)}</b> (${hm(timerElapsed())}) — switch it to <b>${esc(ctxTitle(target))}</b>?</span><button class="btn sm moss" data-act="switch-and-timer" data-ctx="${target}">Switch timer to ${esc(ctxShort(target))}</button><button class="btn sm" data-act="switch-keep" data-ctx="${target}">Keep it on ${esc(S.timer.label)}</button>`;

function switchCtx(id){
 if(!CTX[id])return;
 closeOverlay();closePop();
 const t=S.timer;
 const contains=ctxEntities(id).has('ticket:'+t.ctx)||t.ctx===id;
 if(t.running&&!contains&&id!==S.ctx){switchPrompt(id);return}
 location.hash='#/room/'+id;
}
function startTimer(ctx,label){
 S.timer={running:true,ctx,label:label||(CTX[ctx]?ctxShort(ctx):ctx),startMin:nowMin()};
 toast(`Timer started on <b>${esc(S.timer.label)}</b> at ${hm(nowMin())}`,'moss');render();
}
function stopTimer(){if(!S.timer.running){toast('Timer is not running');return}closePop();S.ovKind='worklog';openOverlay(renderWorklog(),'center')}
function addNote(){
 const c=CTX[S.ctx];const id='n'+Date.now();const link=c.key||c.title;
 NOTES.unshift({id,title:`Note ${hm(nowMin())}`,edited:'today '+hm(nowMin()),rot:(Math.random()*3-1.5).toFixed(1),body:'',links:c.key?[c.key]:[],ctx:c.id});
 if(c.key&&T[c.key])T[c.key].links.push('note:'+id);
 if(CTX[c.id].notes)CTX[c.id].notes.push(id);
 S.noteEdit=id;toast(`New index card filed under <b>${esc(link)}</b>`);location.hash='#/note/'+id;
}
function pinNote(noteId,key){
 const n=NOTES.find(x=>x.id===noteId);if(!n||!T[key])return;
 if(n.links.includes(key)){toast(`${esc(n.title)} is already pinned on ${key}`);return}
 n.links.unshift(key);T[key].links.push('note:'+noteId);n.justPinned=true;
 toast(`Pinned <b>${esc(n.title)}</b> on ${key}`,'moss');render();setTimeout(()=>{n.justPinned=false},400);
}
function runStepper(){
 const st=S.stepper;st.phase='run';st.done=0;render();
 const tick=()=>{st.done++;if(st.done===1)st.branch='created';if(st.done===3&&!PR[145]){PR[145]={n:145,title:'Payout dashboard latency',repo:'payout-service',from:st.branchName,to:'main',state:'open',by:'mara',opened:'opened today '+hm(nowMin()),appr:'0 of 2 approvals',apprBy:'',review:'',checks:[],ticket:'PAY-240',comments:[],files:[]};CTX['PAY-200'].prs.unshift(145);CTX['PAY-200'].branches.unshift({n:st.branchName,m:'new · pushed',t:'PAY-240'})}
  if(st.done===4)T['PAY-240'].links.push('pr:145','branch:'+st.branchName);
  if(st.done===5){T['PAY-240'].status='In Progress';T['PAY-240'].updated='today '+hm(nowMin())}
  if(st.done===6){if(st.timer)S.timer={running:true,ctx:'PAY-240',label:'PAY-240',startMin:nowMin()};toast('PAY-240 is In Progress · PR #145 open · branch pushed','moss')}
  render();if(st.done<6)setTimeout(tick,st.done===2?900:550)};
 setTimeout(tick,500);
}
function queueRerun(){
 const n=Math.max(...Object.keys(B).map(Number))+1;
 B[n]={n,conf:'Payout_IntegrationTests',status:SOURCES[3].bad?'queued':'running',detail:SOURCES[3].bad?'queued locally':'step 1/5 checkout',branch:'feature/PAY-231-sepa-retry',when:(SOURCES[3].bad?'queued ':'started ')+hm(nowMin()),params:'branch=feature/PAY-231-sepa-retry, env=staging',ticket:'PAY-231'};
 CTX['PAY-231'].builds.unshift(n);CTX['PAY-200'].builds.unshift(n);

 return n;
}

  toast(`Linked ${esc(refInfo(s.from).k)} → ${esc(refInfo(s.to).k)} · confirmed in the local index`,'moss');render()},
 'sug-no':(el)=>{const s=SUGG.find(x=>x.id===el.dataset.id);s.gone=true;toast('Suggestion dismissed — it will not come back for this pair');render()},
 'link-to':(el)=>{S.linkMode=S.linkMode===el.dataset.target?null:el.dataset.target;render();const i=document.querySelector('[data-act="link-search"]');if(i)i.focus()},
 'link-cancel':()=>{S.linkMode=null;render()},
 'link-pick':(el)=>{const ref=el.dataset.ref;const tgt=S.linkMode;S.linkMode=null;
  if(tgt==='ctx'){const [t,id]=ref.split(/:(.+)/);const c=CTX[S.ctx];const map={ticket:'tickets',pr:'prs',build:'builds',page:'pages',note:'notes'};if(map[t])c[map[t]].push(t==='pr'||t==='build'?Number(id):id)}
  else if(tgt.startsWith('note:')){const n=NOTES.find(x=>x.id===tgt.slice(5));n.links.push(refInfo(ref).k==='page'?refInfo(ref).label:refInfo(ref).k);if(ref.startsWith('ticket:'))T[ref.slice(7)].links.push('note:'+n.id)}
  else if(T[tgt]){if(!T[tgt].links.includes(ref))T[tgt].links.push(ref)}
  toast(`Linked <b>${esc(refInfo(ref).label)}</b>`,'moss');render()},
 'link-adhoc-ops':()=>{CTX['staging-db'].tickets.push('OPS-77');toast('Linked OPS-77 to Staging DB configuration','moss');render()},
 'approve':(el)=>{PR[el.dataset.n].approved=true;PR[el.dataset.n].appr='1 of 2 approvals';PR[el.dataset.n].apprBy='you approved';const it=INBOX.find(i=>i.id===1);if(it)it.state='Approved at '+hm(nowMin());toast('Approved PR #144 · posted to Gitea','moss');render()},
 'edit-page':(el)=>{PG[el.dataset.id].editedNow=true;PG[el.dataset.id].edited='today '+hm(nowMin());if(el.dataset.id==='sepa')PG.sepa.body=PG.sepa.body.replace('<em class="sla">SLA: to be defined.</em>','<em class="sla">SLA: manual review within 1 business day; finance is notified after 2.</em>');toast('Page saved to Confluence · section Manual review queue','moss');render()},
 'proto-save':()=>{S.protoSaved=true;NOTES.unshift({id:'standup22',title:'Standup 2026-08-22',edited:'today '+hm(nowMin()),rot:1.4,body:document.getElementById('proto').innerText,links:['PAY-231','OPS-77','PAY-240']});CTX['PAY-200'].notes.push('standup22');toast('Saved as note <b>Standup 2026-08-22</b>','moss');render()},
 'proto-pub':()=>{S.protoPub='busy';render();setTimeout(()=>{S.protoPub='done';toast('Published to ENG › Standup protocols › 2026-08-22','moss');render()},900)},
 'ai-ticket':(el)=>{S.newTicketN++;const k='PAY-'+(S.newTicketN+1);S['ai-'+el.dataset.id]=k;T[k]={key:k,summary:el.closest('.ai').querySelector('.ait').textContent.split('→')[1].trim(),type:'Task',status:'To Do',priority:'Medium',assignee:'mara',updated:'today '+hm(nowMin()),epic:'PAY-200',desc:'From standup 2026-08-22 action items.',estimate:'—',spent:'0h',comments:[],worklogs:[],links:['ticket:'+el.dataset.rel]};CTX['PAY-200'].tickets.push(k);toast(`Created <b>${k}</b> in PAY-200`,'moss');render()},
 'copy-digest':()=>toast('Digest copied as plain text'),
 'sync-now':()=>{toast(SOURCES[3].bad?'Synced Jira, Wiki, Git · TeamCity still 401':'Synced all four sources','moss')},
 'sync-one':(el)=>toast(el.dataset.id==='teamcity'&&SOURCES[3].bad?'TeamCity: 401 Unauthorized — re-enter the password below':`Synced ${el.dataset.id} just now`,'moss'),
 'renew-pat':()=>{SOURCES[0].renewed=true;SOURCES[1].auth='same PAT as Jira';SOURCES[0].auth='PAT — renewed today';SNOOZED=SNOOZED.filter(s=>s.id!==7);toast('New Jira PAT saved · reminder cleared','moss');render()},
 'wiz-open':()=>{S.wiz={step:0};render();setTimeout(()=>{const v=document.getElementById('view');v.scrollTop=v.scrollHeight},0)},
 'wiz-type':(el)=>{S.wiz.type=el.dataset.t;S.wiz.url=S.wiz.url||({Jenkins:'https://jenkins.tidewater.internal',GitHub:'https://github.com/tidewater'})[el.dataset.t]||'';render()},
 'wiz-next':()=>{const w=S.wiz;if(w.step===1){w.url=document.getElementById('wurl').value.trim();if(!w.url){toast('Enter the URL first','amber');return}}if(w.step===4){SOURCES.push({id:'new',type:w.type,name:w.url.replace(/^https?:\/\//,''),url:w.url,auth:'user + password',sync:'first sync queued',adapter:w.type.toLowerCase().replace(/\s+/g,'-')+' v1.0',caps:['search','write'],tab:'t-local',mod:w.type.slice(0,3).toUpperCase()})}w.step++;render()},
 'wiz-back':()=>{S.wiz.step--;render()},
 'wiz-test':()=>{S.wiz.test='busy';render();setTimeout(()=>{S.wiz.test='ok';render()},800)},
 'wiz-close':()=>{S.wiz=null;render()},
 'schedule':()=>{}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el){if(!e.target.closest('#pop'))closePop();return}
 const act=el.dataset.act;
 if(el.tagName==='A'&&act==='nav'){e.preventDefault()}
 if(el.tagName==='SELECT'||el.tagName==='INPUT'||el.tagName==='FORM'||el.tagName==='TEXTAREA'||act==='note-body'||act==='q'||act==='link-search'||act==='wl-check'||act==='adhoc-label')return;
 if(act==='note-edit'&&e.target.closest('a'))return;
 if(H[act]){e.preventDefault();try{H[act](el,e)}catch(err){logErr(err)}}
});
document.addEventListener('change',e=>{
 const el=e.target;const act=el.dataset.act;
 if(act==='status'){const t=T[el.dataset.key];t.status=el.value;t.updated='today '+hm(nowMin());toast(`${el.dataset.key} → <b>${el.value}</b> · Jira updated`,'moss');render()}
 if(act==='wl-check'){const out=[];document.querySelectorAll('[data-act="wl-check"]:checked').forEach(c=>out.push(c.dataset.frag));let s=out.join('');if(s.startsWith('; '))s=s.slice(2);if(s.startsWith(', '))s='Backoff jitter ('+s.slice(2);if(s.includes('(a41f2c')&&!s.includes(')'))s=s.replace('(a41f2c','(a41f2c)');document.getElementById('wl-comment').textContent=s?s+'.':''}
 if(act==='schedule')toast(`Sync schedule: ${el.value}`);
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.act==='q'){S.query=el.value;S.list=null;refreshSearch()}
 if(el.dataset.act==='link-search'){document.getElementById('linkres').innerHTML=linkResults(el.value)}
});
document.addEventListener('submit',e=>{
 const f=e.target;e.preventDefault();const act=f.dataset.act;
 if(act==='add-comment'){const text=f.text.value.trim();if(!text)return;const target=f.dataset.type==='ticket'?T[f.dataset.id]:f.dataset.type==='pr'?PR[f.dataset.id]:PG[f.dataset.id];target.comments.push({who:'mara',when:'today '+hm(nowMin()),text,fresh:true});toast(`Comment posted to ${f.dataset.type==='ticket'?'Jira':f.dataset.type==='pr'?'Gitea':'Confluence'}`,'moss');render()}
 if(act==='send-reply'){const it=INBOX.find(i=>i.id==f.dataset.id);const text=f.text.value.trim();if(!text)return;it.replying=false;it.state=`Replied at ${hm(nowMin())}: “${text}”`;if(it.id===2)PG.sepa.comments.push({who:'mara',when:'today '+hm(nowMin()),text});if(it.id===4)PR[142].comments.push({who:'mara',when:'today '+hm(nowMin()),text});toast('Reply posted','moss');render()}
 if(act==='nt-create'){S.newTicketN++;const k='PAY-'+(S.newTicketN+1);T[k]={key:k,summary:f.summary.value,type:f.type.value,status:'To Do',priority:f.prio.value,assignee:'mara',updated:'today '+hm(nowMin()),epic:'PAY-200',desc:esc(f.desc.value),estimate:'—',spent:'0h',comments:[],worklogs:[],links:[]};CTX['PAY-200'].tickets.push(k);closeOverlay();toast(`Created <b>${k}</b> ${esc(f.summary.value)} in PAY-200`,'moss');location.hash='#/ticket/'+k}
 if(act==='np-create'){const id='p'+Date.now();PG[id]={id,title:f.title.value,edited:'today '+hm(nowMin()),by:'mara',body:`<p>${esc(f.body.value)||'Draft.'}</p>`,comments:[],ticket:CTX[S.ctx].key||null};CTX[S.ctx].pages.push(id);closeOverlay();toast(`Created page <b>${esc(f.title.value)}</b> in ENG`,'moss');location.hash='#/page/'+id}
 if(act==='repass'){SOURCES[3].bad=false;SOURCES[3].sync='synced just now · 3 build configurations';const sent=S.pending;S.pending=0;Object.values(B).forEach(b=>{if(b.status==='queued'){b.status='running';b.detail='step 1/5 checkout';b.when='started '+hm(nowMin())}});toast(`TeamCity password updated · ${sent?sent+' queued write'+(sent===1?'':'s')+' sent · ':''}synced`,'moss');render()}
});
document.addEventListener('keydown',e=>{
 const mod=e.metaKey||e.ctrlKey;
 if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();if(S.ovKind==='search'){const q=document.getElementById('q');q.focus();q.select()}else openSearch();return}
 if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();if(S.timer.running)stopTimer();else startTimer(CTX[S.ctx]&&CTX[S.ctx].kind==='Ad-hoc'?S.ctx:(S.ctx==='PAY-200'?'PAY-231':S.ctx));return}
 if(e.key==='Escape'){if(document.getElementById('ov')){closeOverlay();return}if(document.getElementById('pop')||document.getElementById('prompt')){closePop();return}if(S.linkMode){S.linkMode=null;render();return}if(S.panel){location.hash='#/room/'+S.ctx}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="link"]')){e.preventDefault();e.target.click()}
});
/* drag-to-pin */
let dragNote=null;
document.addEventListener('dragstart',e=>{const n=e.target.closest('[data-note]');if(!n)return;dragNote=n.dataset.note;n.classList.add('drag');e.dataTransfer.effectAllowed='link';e.dataTransfer.setData('text/plain',dragNote)});
document.addEventListener('dragend',e=>{const n=e.target.closest&&e.target.closest('[data-note]');if(n)n.classList.remove('drag');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const t=e.target.closest('[data-drop]');if(t&&dragNote){e.preventDefault();e.dataTransfer.dropEffect='link';t.classList.add('over')}});
document.addEventListener('dragleave',e=>{const t=e.target.closest('[data-drop]');if(t)t.classList.remove('over')});
document.addEventListener('drop',e=>{const t=e.target.closest('[data-drop]');if(!t||!dragNote)return;e.preventDefault();const id=dragNote;dragNote=null;pinNote(id,t.dataset.drop)});
/* timer tick */
setInterval(()=>{const el=document.querySelector('.timerbtn .el');if(el&&S.timer.running)el.textContent=hm(timerElapsed())},1000);
function logErr(err){const l=document.getElementById('errlog');l.textContent+=(err&&err.stack||err)+'\n';console.error(err)}
window.addEventListener('hashchange',()=>{try{route()}catch(e){logErr(e)}});
window.addEventListener('error',e=>logErr(e.error||e.message));
try{if(!location.hash)history.replaceState(null,'','#/room/PAY-200');route();const shot=new URLSearchParams(location.search).get('shot');if(shot&&H[shot])setTimeout(()=>H[shot](document.querySelector('.timerbtn')),50);
}catch(e){logErr(e)}
</script>
</body>
