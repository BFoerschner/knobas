<!--
knobas mockup
paradigm: P5 Journal
design: D2 Ledger
thesis: Your day is one editable document — remote tickets, builds, PRs and pages sit as live blocks between your own notes, and time is the left margin.
thesis: The ledger renders that document as ruled paper: a red margin line, a time gutter, one line per fact, and a rubber stamp naming the source of every line.
thesis: The time gutter is a continuous attribution rail — hairline for passive, solid ink for the running timer, red hatch for unattributed minutes you still owe the ledger.
-->
<meta charset="utf-8">
<title>knobas — Friday 22 August 2026</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA; --panel:#F4F5F2; --rule:#D7DEE8; --margin:#E0857C;
  --ink:#1B2230; --muted:#5F6B7A; --faint:#9AA5B4;
  --blue:#1F3A8A; --red:#C8372D;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:70px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink);
  font:400 13px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;
  display:grid; grid-template-rows:46px 1fr 26px; height:100vh; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
::selection{background:#C9D4F0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ─── labels ─── */
.lbl{font:600 10px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.lbl-b{font:600 10px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

/* ─── top bar ─── */
.topbar{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--rule)}
.tb-brand{display:flex;align-items:center;gap:9px;padding:0 14px 0 16px;border-right:1px solid var(--rule);min-width:var(--gut)}
.tb-brand b{font:700 15px/1 var(--sans);letter-spacing:.02em}
.tb-mark{width:14px;height:14px;border:1.5px solid var(--red);position:relative}
.tb-mark::after{content:"";position:absolute;left:3px;top:-1px;bottom:-1px;width:1px;background:var(--red)}
.tb-crumb{display:flex;align-items:center;gap:8px;padding:0 14px;flex:1;min-width:0}
.tb-crumb .c-t{font:600 13px/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-crumb .c-s{color:var(--faint);font-size:11px;white-space:nowrap}
.tb-back{border:1px solid var(--rule);background:var(--paper);width:22px;height:22px;line-height:0;cursor:pointer;color:var(--muted);flex:none}
.tb-back:hover{border-color:var(--blue);color:var(--blue)}
.tb-slot{display:flex;align-items:center;gap:8px;padding:0 12px;border-left:1px solid var(--rule);cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;white-space:nowrap}
.tb-slot:hover{background:#EAEDE8}
.tb-k{font:500 11px/1 var(--mono);color:var(--faint);border:1px solid var(--rule);padding:2px 4px;background:var(--paper)}
.tb-search{color:var(--muted);font-size:12px}

/* sync pips */
.pips{display:flex;gap:3px;align-items:center}
.pip{width:7px;height:7px;border:1px solid var(--blue);background:var(--blue)}
.pip.bad{border-color:var(--red);background:var(--red)}
.sync-t{font:500 11px/1 var(--sans);color:var(--muted)}
.sync-t em{font-style:normal;color:var(--red);font-weight:600}

/* timer chip */
.timer{display:flex;align-items:center;gap:8px}
.tdot{width:13px;height:13px;border:1.5px dashed var(--blue);border-radius:50%;animation:spin 6s linear infinite;flex:none}
.tdot.stopped{border-style:solid;border-color:var(--faint);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.t-ctx{font:600 11px/1 var(--sans);letter-spacing:.02em}
.t-el{font:500 13px/1 var(--mono);color:var(--blue);font-variant-numeric:tabular-nums}
.t-el.off{color:var(--faint)}
.badge{min-width:17px;height:17px;padding:0 4px;background:var(--red);color:#fff;font:600 10px/17px var(--mono);text-align:center;display:inline-block}
.badge.zero{background:var(--faint)}

/* ─── shell ─── */
.shell{display:grid;grid-template-columns:236px 1fr 268px;overflow:hidden}
.side{background:var(--panel);border-right:1px solid var(--rule);overflow-y:auto;display:flex;flex-direction:column}
.main{overflow-y:auto;background:var(--paper);position:relative}
.aside{background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto}
@media (max-width:1240px){.shell{grid-template-columns:200px 1fr 236px}}

/* ─── sidebar ─── */
.s-sec{padding:12px 0 6px}
.s-h{display:flex;align-items:center;justify-content:space-between;padding:0 12px 7px}
.s-h .lbl{color:var(--faint)}
.s-add{background:none;border:0;cursor:pointer;color:var(--faint);font:600 14px/1 var(--sans)}
.s-add:hover{color:var(--blue)}
.cal{padding:0 10px}
.cal-m{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px}
.cal-m b{font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.cal-m span{font:400 10px/1 var(--mono);color:var(--faint)}
.cal-g{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.cal-d{background:var(--panel);border:0;cursor:pointer;padding:5px 0 6px;text-align:center;font-family:var(--mono)}
.cal-d .dw{display:block;font-size:9px;color:var(--faint);letter-spacing:.06em}
.cal-d .dn{display:block;font-size:14px;font-weight:500;line-height:1.2}
.cal-d .dh{display:block;font-size:9px;color:var(--muted)}
.cal-d:hover{background:#EAEDE8}
.cal-d.on{background:var(--ink);color:var(--paper)}
.cal-d.on .dw,.cal-d.on .dh{color:#AEB8C6}
.nav{list-style:none}
.nav li{display:block}
.navi{display:flex;width:100%;align-items:center;gap:8px;padding:6px 12px;background:none;border:0;border-left:2px solid transparent;cursor:pointer;text-align:left;font:400 12.5px/1.25 var(--sans);color:var(--ink)}
.navi:hover{background:#EAEDE8}
.navi.on{border-left-color:var(--red);background:#EAEDE8;font-weight:600}
.navi .n-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi .n-c{font:500 11px/1 var(--mono);color:var(--muted)}
.navi .n-c.hot{color:var(--red);font-weight:600}
.navi .n-d{font:400 10px/1 var(--mono);color:var(--faint)}
.navi svg{flex:none;color:var(--muted)}
.s-note{padding:4px 12px 10px;font:400 10.5px/1.4 var(--sans);color:var(--faint)}
.s-foot{margin-top:auto;border-top:1px solid var(--rule);padding:6px 0}

/* ─── sheet (the document) ─── */
.sheet{position:relative;padding:18px 26px 160px var(--gut);min-height:100%}
.sheet::before{content:"";position:absolute;left:calc(var(--gut) - 14px);top:0;bottom:0;width:1px;background:var(--margin)}
.doc-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1.5px solid var(--ink);margin-bottom:2px}
.doc-h h1{font:700 25px/1.1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.doc-h .sub{font:400 11.5px/1.5 var(--mono);color:var(--muted);padding-bottom:3px}
.doc-h .sub b{color:var(--ink);font-weight:600}

/* blocks */
.blk{border-bottom:1px solid var(--rule)}
.blk-h{display:flex;align-items:center;gap:9px;width:100%;padding:9px 0;background:none;border:0;cursor:pointer;text-align:left}
.blk-h:hover .blk-t{color:var(--blue)}
.blk-t{font:600 11px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase}
.blk-m{font:400 11px/1 var(--mono);color:var(--faint);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tri{width:9px;height:9px;flex:none;color:var(--muted);transition:transform .12s}
.blk-h[aria-expanded="true"] .tri{transform:rotate(90deg)}
.blk-b{padding:0 0 14px}
.blk-tools{display:flex;gap:6px;flex:none}

/* buttons */
.btn{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn[disabled]{opacity:.45;cursor:default}
.btn[disabled]:hover{border-color:var(--rule);color:var(--muted)}
.btn--p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn--p:hover{background:#16296A;border-color:#16296A;color:#fff}
.btn--b{color:var(--blue);border-color:var(--blue)}
.btn--d{color:var(--red);border-color:#E7C3BF}
.btn--d:hover{border-color:var(--red);color:var(--red)}
.btn--q{border-color:transparent;padding:5px 5px}
.btn--q:hover{border-color:var(--rule)}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--blue);font:inherit;text-align:left}
.lnk:hover{text-decoration:underline}

/* stamps — the signature */
.stamp{
  display:inline-block;font:600 8.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;
  padding:3px 6px 2px;border:1px solid currentColor;
  box-shadow:inset 0 0 0 1px var(--paper),inset 0 0 0 2px currentColor;
  opacity:.85;mix-blend-mode:multiply;flex:none;
  color:var(--blue);white-space:nowrap;
}
.stamp--red{color:var(--red)}
.stamp--big{font-size:11px;letter-spacing:.2em;padding:5px 9px 4px}
.stamp--in{animation:stampin .2s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{from{transform:scale(2.4) rotate(var(--rot,0deg));opacity:0}to{transform:scale(1) rotate(var(--rot,0deg));opacity:.85}}
.stamp--fail{color:var(--red);font-weight:700}

/* ledger entries */
.entry{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:7px 0 7px 0;border-bottom:1px solid var(--rule);min-height:34px}
.entry:hover{background:#F7F8FA}
.e-time{position:absolute;left:calc(-1 * var(--gut) + 8px);width:46px;text-align:right;font:400 11px/1.45 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.e-rail{position:absolute;left:-9px;top:0;bottom:0;width:3px}
.rail-p{background:var(--faint);width:1px;left:-8px}
.rail-m{background:var(--blue)}
.rail-u{background:repeating-linear-gradient(45deg,var(--red) 0 2px,transparent 2px 4px)}
.rail-g{background:repeating-linear-gradient(to bottom,var(--rule) 0 3px,transparent 3px 7px);width:1px;left:-8px}
.rail-e{background:var(--rule);width:1px;left:-8px}
.e-main{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.e-gl{flex:none;width:13px;text-align:center;color:var(--muted);font-size:11px;line-height:1.45}
.e-txt{min-width:0}
.e-ref{font:500 12px/1.45 var(--mono);letter-spacing:-.01em}
.e-desc{color:var(--ink)}
.e-sub{display:block;font:400 11.5px/1.5 var(--sans);color:var(--muted);padding-top:2px}
.e-right{display:flex;align-items:center;gap:8px;flex:none}
.e-dur{font:400 11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.e-acts{display:flex;gap:5px;opacity:0;transition:opacity .1s}
.entry:hover .e-acts,.entry:focus-within .e-acts{opacity:1}
.entry.is-open{background:#F7F8FA}
.entry.is-mine{border-bottom-color:#C3CEDC}

/* my own notes are visually primary */
.mine{font:400 14.5px/1.55 var(--serif);color:var(--ink);padding:1px 0 2px}
.mine .chip{vertical-align:baseline}

/* status pills */
.st{font:600 10px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:4px 6px 3px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;background:var(--paper)}
.st--prog{border-color:var(--blue);color:var(--blue)}
.st--rev{border-color:var(--blue);color:var(--blue);background:#EAEEF8}
.st--done{border-color:var(--rule);color:var(--faint);text-decoration:line-through}
.st--fail{border-color:var(--red);color:var(--red)}
.st--run{border-color:var(--blue);color:var(--blue)}
.st--todo{border-color:#C3CEDC}
.pri{font:500 10px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
.pri--hi{color:var(--red)}

/* chips (wiki links) */
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px/1 var(--mono);color:var(--blue);border-bottom:1px solid #B9C4E0;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;padding:1px 1px 1px}
.chip:hover{background:#EAEEF8;border-bottom-color:var(--blue)}
.chip::before{content:"[[";color:var(--faint);font-weight:400}
.chip::after{content:"]]";color:var(--faint);font-weight:400}
.chip--plain::before,.chip--plain::after{content:none}

/* expanded entity detail inside a block */
.det{border-left:2px solid var(--rule);margin:2px 0 12px;padding:10px 0 4px 14px}
.det h3{font:600 15px/1.3 var(--sans)}
.det .prose{font:400 14.5px/1.6 var(--serif);color:#2A3444;max-width:66ch;padding:8px 0}
.det .prose code{font:400 13px var(--mono);background:var(--panel);padding:1px 3px}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:8px 0}
.det-f{padding:7px 12px 7px 0}
.det-f .lbl{display:block;padding-bottom:4px}
.det-f .v{font:500 12.5px/1.2 var(--sans)}
.det-f .v.mono{font-family:var(--mono);font-weight:400}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.subh{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
.subh .lbl{color:var(--muted)}
.subh hr{flex:1;border:0;border-top:1px solid var(--rule)}

/* comments */
.cm{padding:8px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:26px 1fr;gap:9px}
.av{width:22px;height:22px;border:1px solid var(--ink);font:600 9px/20px var(--sans);text-align:center;letter-spacing:.04em;color:var(--ink);background:var(--paper)}
.av--me{background:var(--ink);color:var(--paper)}
.cm-who{font:600 12px/1.2 var(--sans)}
.cm-when{font:400 10.5px/1.2 var(--mono);color:var(--faint)}
.cm-tx{font:400 14px/1.55 var(--serif);padding-top:3px;color:#2A3444}
.ta{width:100%;border:1px solid var(--rule);background:var(--paper);padding:7px 9px;font:400 14px/1.5 var(--serif);resize:vertical;min-height:56px}
.ta:focus{border-color:var(--blue);outline:none;box-shadow:inset 0 0 0 1px var(--blue)}
.inp{border:1px solid var(--rule);background:var(--paper);padding:6px 8px;font:400 12.5px/1.2 var(--sans);width:100%}
.inp.mono{font-family:var(--mono);font-size:12px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:inset 0 0 0 1px var(--blue)}
.fld{padding:8px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.fld > .lbl{color:var(--muted)}
.hint{font:400 11px/1.4 var(--sans);color:var(--faint);padding-top:3px}
select.inp{cursor:pointer}

/* ghost / suggestion rows */
.ghost{border-bottom:1px dashed var(--rule);background:repeating-linear-gradient(-45deg,rgba(215,222,232,.22) 0 6px,transparent 6px 12px)}
.ghost .e-main{color:var(--muted)}
.ghost .why{font:400 11px/1.4 var(--sans);color:var(--faint);font-style:italic}

/* day strip */
.strip{display:flex;height:34px;border:1px solid var(--rule);margin:10px 0 4px;background:var(--panel)}
.seg{position:relative;border-right:1px solid var(--rule);cursor:pointer;background:none;padding:0;overflow:hidden;min-width:2px}
.seg:last-child{border-right:0}
.seg .sl{position:absolute;left:5px;top:5px;right:3px;text-align:left;font:600 9px/1.1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg .sd{position:absolute;left:5px;bottom:4px;font:400 9.5px/1 var(--mono);color:var(--faint)}
.seg--p{background:#E8ECF1}
.seg--m{background:var(--blue)}
.seg--m .sl{color:#fff}.seg--m .sd{color:#B9C4E0}
.seg--u{background:repeating-linear-gradient(45deg,rgba(200,55,45,.2) 0 4px,transparent 4px 8px);border-right-color:var(--red)}
.seg--u .sl{color:var(--red)}
.seg--g{background:var(--panel)}
.seg:hover{filter:brightness(.96)}
.seg:focus-visible{outline-offset:-2px}
.strip-ax{display:flex;justify-content:space-between;font:400 10px/1 var(--mono);color:var(--faint);padding-bottom:8px}

/* aside */
.a-sec{border-bottom:1px solid var(--rule);padding:11px 13px}
.a-h{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:7px}
.a-li{display:flex;align-items:center;gap:7px;width:100%;padding:4px 0;background:none;border:0;cursor:pointer;text-align:left;font:400 12px/1.3 var(--sans);color:var(--ink);border-bottom:1px solid transparent}
.a-li:hover{color:var(--blue)}
.a-li .k{font:500 11.5px/1.3 var(--mono);flex:none}
.a-li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.a-li .x{flex:none;font-size:11px;color:var(--red)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font:400 12px/1.3 var(--sans);border-bottom:1px solid var(--rule)}
.tot:last-of-type{border-bottom:0}
.tot span{color:var(--muted)}
.tot b{font:500 13px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.tot b.hot{color:var(--red)}
.tot b.blue{color:var(--blue)}
.bar{display:flex;height:6px;border:1px solid var(--rule);margin:7px 0 3px}
.bar i{display:block;background:var(--blue)}
.bar i.un{background:repeating-linear-gradient(45deg,var(--red) 0 2px,transparent 2px 4px)}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:600 9.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 10px 6px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top;font-size:12.5px}
.tbl tr:hover td{background:#F7F8FA}
.tbl td.mono{font-family:var(--mono);font-size:12px}
.tbl th.r,.tbl td.r{text-align:right;padding-right:0}

/* status bar */
.statusbar{display:flex;align-items:center;gap:0;background:var(--panel);border-top:1px solid var(--rule);font:400 11px/1 var(--sans);color:var(--muted)}
.sb{padding:0 12px;border-right:1px solid var(--rule);height:100%;display:flex;align-items:center;gap:6px}
.sb:last-child{border-right:0;margin-left:auto;border-left:1px solid var(--rule)}
.sb b{font-weight:600;color:var(--ink)}
.sb .mono{font-size:11px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(27,34,48,.28);display:flex;align-items:flex-start;justify-content:center;padding-top:88px;z-index:60}
.pal{width:min(760px,90vw);background:var(--paper);border:1px solid var(--ink);box-shadow:0 18px 44px rgba(27,34,48,.24);display:flex;flex-direction:column;max-height:74vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1.5px solid var(--ink)}
.pal-in input{flex:1;border:0;background:none;font:400 19px/1.2 var(--sans);outline:none}
.pal-in input::placeholder{color:var(--faint)}
.pal-f{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--rule);align-items:center}
.fchip{font:600 10px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);cursor:pointer}
.fchip.on{border-color:var(--blue);color:#fff;background:var(--blue)}
.fchip--x{border-style:dashed}
.fchip--x.on{background:var(--red);border-color:var(--red)}
.pal-b{overflow-y:auto;padding:0 0 8px}
.pal-g{padding:10px 14px 4px}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function seedRot(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;return ((Math.abs(h)%8)-4);}
function stamp(label,id,opt){
  opt=opt||{};
  const rot=seedRot(id||label);
  const red=opt.red||label==="CI"||label==="NOTE"||label==="FAILED";
  return `<span class="stamp${red?" stamp--red":""}${opt.big?" stamp--big":""}${opt.anim?" stamp--in":""}" style="--rot:${rot}deg;transform:rotate(${rot}deg)">${esc(label)}</span>`;
}
function stCls(s){
  return {"In Progress":"st--prog","In Review":"st--rev","Done":"st--done","To Do":"st--todo",
          "failed":"st--fail","running":"st--run","success":"st--done","open":"st--prog","merged":"st--rev"}[s]||"";
}
function pill(s){return `<span class="st ${stCls(s)}">${esc(s)}</span>`;}
function av(w){const p=PEOPLE[w];return `<span class="av${w==="mara"?" av--me":""}" title="${esc(p.n)}">${p.i}</span>`;}
function go(r){if(location.hash===r)render();else location.hash=r;}
function toast(msg,label,red){
  const el=document.createElement("div");
  el.className="toast"+(red?" toast--r":"");
  el.innerHTML=`<span class="lbl">${esc(label||"logged")}</span><span>${msg}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(()=>{el.remove();},4200);
}
function chips(text){
  return esc(text).replace(/\[\[([^\]]+)\]\]/g,(m,tok)=>{
    const r=TOKEN[tok];
    if(!r)return `<span class="chip">${esc(tok)}</span>`;
    return `<button class="chip" data-go="${r}">${esc(tok)}</button>`;
  }).replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>");
}
function bumpPending(n){S.pending+=n;$("#sb-pending").innerHTML=`Pending writes <b class="mono">${S.pending}</b>`+(S.pending?" · retrying when TeamCity is back":"");}
function fmtT(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h+":"+String(m).padStart(2,"0");}
function ticketRow(k){

function suggestRow(sg){
  if(sg.state==="dismissed")return "";
  if(sg.state==="confirmed"){
    return entry({id:sg.id,t:sg.at,rail:"e",
      main:`<span class="e-gl">↔</span><span class="e-txt"><span class="e-desc">Linked <b>${esc(sg.from)}</b> ↔ <b>${esc(sg.to)}</b></span><span class="e-sub">Confirmed by you · stored locally, both sides now show the link.</span></span>`,
      right:stamp("LINKED",sg.id,{anim:true})});
  }
  return entry({id:sg.id,t:sg.at,rail:"e",cls:"ghost",
    main:`<span class="e-gl">?</span><span class="e-txt"><span class="e-desc">${esc(sg.from)}${sg.fromTx?" "+esc(sg.fromTx):""} → <b>${esc(sg.to)}</b></span><span class="e-sub why">suggested link · ${esc(sg.why)}</span></span>`,
    right:`${btn("Confirm","sg-yes",{cls:"btn--b",data:'data-id="'+sg.id+'"'})}${btn("Dismiss","sg-no",{data:'data-id="'+sg.id+'"'})}`});
}

    ${inline?"":""}
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1;min-width:0">
        <h3>${esc(t.sum)}</h3>
        <div class="kbd-row" style="padding-top:4px"><span class="mono">${t.key}</span> · ${esc(t.type)} · updated ${esc(t.upd)}${t.assignedNote?" · "+esc(t.assignedNote):""}</div>
      </div>
      ${stamp("JIRA",t.key,{big:true})}
    </div>
    <div class="det-grid">
      <div class="det-f"><span class="lbl">Status</span>
        <span class="v"><button class="btn ${stCls(t.status)==="st--prog"?"btn--p":""}" data-act="status" data-id="${t.key}">${esc(t.status)} ▾</button></span></div>
      <div class="det-f"><span class="lbl">Priority</span><span class="v"><span class="pri${t.pri==="High"?" pri--hi":""}">${esc(t.pri)}</span></span></div>
      <div class="det-f"><span class="lbl">Assignee</span><span class="v">${esc(PEOPLE[t.who].n)}</span></div>
      <div class="det-f"><span class="lbl">Estimate</span><span class="v mono">${esc(t.est)}</span></div>
      <div class="det-f"><span class="lbl">Time spent</span><span class="v mono">${esc(t.spent)}</span></div>
      <div class="det-f"><span class="lbl">Epic</span><span class="v">${t.epic?`<button class="lnk mono" data-act="epic">${t.epic} Payout reliability</button>`:"—"}</span></div>
    </div>
    <div class="prose">${esc(t.desc)}</div>
    ${t.blockedBy?`<div class="warn-box">Blocked by <button class="lnk" data-go="#/ticket/${t.blockedBy}">${t.blockedBy} On-call runbook outdated</button> — staging verification needs the updated runbook. <b>Tomasz</b> has it, ETA Tuesday.</div>`:""}

    <div class="subh"><span class="lbl">Linked items</span><hr>${btn("Link to…","linkto",{data:'data-id="'+t.key+'"'})}</div>
    ${openLinks.length?openLinks.map(l=>linkRow(l)).join(""):`<div class="row"><span class="grow" style="color:var(--faint)">No links yet. Use <b>Link to…</b> or confirm a suggestion.</span></div>`}

    ${key==="PAY-231"?`<div class="subh"><span class="lbl">Suggested links</span><hr><span class="lbl">${S.suggestions.filter(s=>s.state==="open").length} open</span></div>
      ${S.suggestions.map(sg=>sg.state==="open"?`<div class="row"><span class="grow">${esc(sg.from)} → <b>${esc(sg.to)}</b><span class="e-sub why">${esc(sg.why)}</span></span>${btn("Confirm","sg-yes",{cls:"btn--b",data:'data-id="'+sg.id+'"'})}${btn("Dismiss","sg-no",{data:'data-id="'+sg.id+'"'})}</div>`:
        sg.state==="confirmed"?`<div class="row"><span class="grow" style="color:var(--muted)">${esc(sg.from)} → ${esc(sg.to)}</span>${stamp("LINKED",sg.id)}</div>`:"").join("")}`:""}

    <div class="subh"><span class="lbl">Comments</span><hr><span class="lbl">${t.comments.length}</span></div>
    ${t.comments.map(c=>`<div class="cm">${av(c.who)}<div><div style="display:flex;gap:8px;align-items:baseline"><span class="cm-who">${esc(PEOPLE[c.who].n)}</span><span class="cm-when">${esc(c.when)}</span></div><div class="cm-tx">${esc(c.tx)}</div></div></div>`).join("")}
    <div class="cm">${av("mara")}<div>
      <textarea class="ta" id="cm-${t.key}" placeholder="Add a comment — it is written straight to Jira."></textarea>
      <div style="display:flex;gap:6px;padding-top:6px"><button class="btn btn--p" data-act="comment" data-id="${t.key}">Comment on ${t.key}</button><span class="hint" style="padding:0">Posts to Tidewater Jira and appears in today's page.</span></div>
    </div></div>

    <div class="subh"><span class="lbl">Worklogs</span><hr><span class="lbl">${t.spent} total</span></div>
    ${(t.worklogs.length?t.worklogs:[]).map(w=>`<div class="row"><span class="mono" style="width:90px;color:var(--muted)">${esc(w.when)}</span><span class="mono" style="width:70px">${esc(w.dur)}</span><span class="grow">${esc(w.tx)}</span></div>`).join("")}
    ${t.worklogs.length?"":`<div class="row"><span class="grow" style="color:var(--faint)">Nothing logged yet.</span></div>`}
    ${key==="PAY-231"?`<div class="row"><span class="mono" style="width:90px;color:var(--red)">today</span><span class="grow">${S.loggedToday.length?"":"Nothing logged today — 2h 44m tracked is waiting in the draft."}</span>${S.loggedToday.length?"":btn("Open worklog draft","worklog-draft",{cls:"btn--p"})}</div>`:""}
  </div>`;
}
function linkRow(l){
  const [kind,id]=l.split(":");
  if(kind==="pr"){const p=PRS[id];return `<div class="row"><span class="mono" style="width:82px"><button class="lnk mono" data-go="#/pr/${id}">PR #${id}</button></span><span class="grow">${esc(p.title)}${p.checks.some(c=>c.s==="failed")?` <span style="color:var(--red);font:400 11px var(--mono)">· 1 check failed</span>`:""}</span>${pill(p.state)}${stamp("GIT","pr"+id)}</div>`;}
  if(kind==="build"){const b=BUILDS[id];return `<div class="row"><span class="mono" style="width:82px"><button class="lnk mono" data-go="#/build/${id}">#${id}</button></span><span class="grow">${esc(b.cfg)} · <span class="mono" style="color:var(--muted)">${esc(b.branch)}</span></span>${b.state==="failed"?stamp("FAILED","b"+id):pill(b.state)}${stamp("CI","b"+id)}</div>`;}
  if(kind==="page"){const p=PAGES[id];return `<div class="row"><span class="mono" style="width:82px;color:var(--faint)">page</span><span class="grow"><button class="lnk" data-go="#/page/${id}">${esc(p.t)}</button> <span class="mono" style="color:var(--faint);font-size:11px">edited ${esc(p.edited)}</span></span>${stamp("WIKI","pg"+id)}</div>`;}
  if(kind==="note"){const n=NOTES[id];return `<div class="row"><span class="mono" style="width:82px;color:var(--faint)">note</span><span class="grow"><button class="lnk" data-go="#/note/${id}">${esc(n.t)}</button> <span class="mono" style="color:var(--faint);font-size:11px">edited ${esc(n.edited)}</span></span>${stamp("NOTE","nt"+id)}</div>`;}
  if(kind==="branch"){return `<div class="row"><span class="mono" style="width:82px;color:var(--faint)">branch</span><span class="grow mono" style="font-size:12px">${esc(id)} <span style="color:var(--faint)">· payout-service · 3 commits ahead of main</span></span>${stamp("GIT","br")}</div>`;}
  return "";
}

/* ══════════════════════════════════════════════════════════════════
   5. TODAY'S DAY PAGE — the journal
   ══════════════════════════════════════════════════════════════════ */
function digestBody(){
  const grp=(name,arr)=>`<div class="subh" style="padding:9px 0 2px"><span class="lbl">${name}</span><hr></div>`+
    arr.map(l=>`<div class="row" style="padding:3px 0"><button class="lnk grow" data-act="trace" data-src="${esc(l.src)}" data-route="${l.route}" style="color:var(--ink)">${esc(l.tx)} <span style="color:var(--faint);font:400 11px/1.2 var(--mono)">· ${esc(l.src)}</span></button></div>`).join("");
  return `<div class="hint" style="padding-bottom:2px">Generated from today's ledger lines at 08:30. Click a line to open the commit, build, transition or worklog behind it.</div>
    ${grp("Yesterday",DIGEST.yesterday)}${grp("Today",DIGEST.today)}${grp("Blockers",DIGEST.blockers)}
    <div style="display:flex;gap:6px;padding-top:12px;flex-wrap:wrap;align-items:center">
      ${btn("Copy to protocol","proto-fill")}<span class="hint" style="padding:0">Adds your two lines under “Mara” in the protocol below.</span>
    </div>`;
}
function protoBody(){
  return `<div class="fld"><span class="lbl">Attendees</span><input class="inp" id="p-att" value="${esc(PROTO.attendees)}"></div>
  <div class="subh"><span class="lbl">Minutes</span><hr><span class="lbl">editable</span></div>
  <textarea class="ta" id="p-lines" style="min-height:104px">${esc(PROTO.lines)}</textarea>
  <div class="subh"><span class="lbl">Action items</span><hr><span class="lbl">${PROTO.actions.length}</span></div>
  ${PROTO.actions.map(a=>`<div class="row"><span class="mono" style="width:74px;color:var(--muted)">${esc(a.who)}</span><span class="grow">${esc(a.tx)}</span>${a.made?`<span class="mono" style="color:var(--blue)">${esc(a.made)}</span>${stamp("JIRA",a.made,{anim:true})}`:btn("Create ticket","act-ticket",{data:'data-id="'+a.id+'"'})}</div>`).join("")}
  <div style="display:flex;gap:6px;padding-top:12px;flex-wrap:wrap;align-items:center">
    ${btn(PROTO.saved?"Saved as note ✓":"Save as note","proto-save",{cls:PROTO.saved?"":""})}
    ${btn(PROTO.published?"Published ✓":"Publish to Confluence","proto-pub",{cls:PROTO.published?"":"btn--p"})}
    <span class="hint" style="padding:0">Target: ENG › Standup protocols › 2026-08-22</span>
  </div>
  ${PROTO.published?`<div class="note-box" style="margin-top:10px">Published as <button class="lnk" data-go="#/page/standup-protocols">ENG › Standup protocols › 2026-08-22</button> · version 1 · <span class="mono">14:32</span></div>`:""}`;
}
function inboxBody(compact){
  if(!S.inbox.length)return `<div class="empty">Inbox clear. Anything new from Jira, Confluence, Gitea or TeamCity lands here within five minutes.</div>`;
  return S.inbox.map(it=>entry({id:"in-"+it.id,t:it.when.replace("today ","").replace("yesterday ","yd "),rail:"e",
    main:`<span class="e-gl">${it.red?"⚠":"•"}</span><span class="e-txt"><span class="e-desc">${it.tx}</span></span>`,
    right:stamp(it.stamp,it.id),
    acts:it.acts.map(a=>btn(a[0],"ib-"+a[1],{data:`data-id="${it.id}"`,cls:a[1]==="done"?"":(a[1]==="rerun"?"btn--d":"")})).join("")
  })).join("")+
  `<div class="row" style="border-bottom:0;padding-top:9px"><span class="lbl">Snoozed</span><span class="grow" style="padding-left:10px">${S.snoozed.map(s=>`${esc(s.t)} <span class="mono" style="color:var(--faint)">· ${esc(s.when)}</span>`).join(" · ")}</span>${S.snoozed.length?btn("Unsnooze","unsnooze"):""}</div>`;
}
function stripBody(){
  const total=STRIP.reduce((a,s)=>a+s.m,0);
  return `<div class="strip">${STRIP.map(s=>`<button class="seg seg--${s.c}" style="flex:${s.m} 0 0" data-act="seg" data-id="${s.id}" title="${esc(s.d)} · ${s.m} min · ${esc(s.l||"no activity")}">
      ${s.l?`<span class="sl">${esc(s.l)}</span>`:""}<span class="sd">${s.m}m</span></button>`).join("")}</div>
    <div class="strip-ax"><span>08:30</span><span>10:00</span><span>11:30</span><span>13:00</span><span>14:32 now</span></div>
    <div class="kbd-row" style="padding-bottom:10px">Solid ink = you started the timer · pale = recorded from what was open · red hatch = unattributed · empty = no activity. Nothing here is derived from git branches.</div>`;
}

function pageDay(iso){
  if(iso!=="2026-08-22")return pastDay(iso);
  const open=id=>!!S.openBlocks[id];
  let body=`<div class="doc-h"><h1>Friday 22 August 2026</h1><span class="sub">Day page · <b>5h 28m</b> tracked · <b>0h 00m</b> logged · timer on <b>PAY-231</b></span></div>`;

  body+=block("standup","Standup digest",'generated 08:30 · yesterday, today, blockers',
    `${btn("Regenerate","regen")}${btn("Publish","proto-pub",{cls:"btn--p"})}`,digestBody());

  body+=block("proto","Standup protocol 2026-08-22",
    `5 attendees · 3 action items${PROTO.published?" · published":""}`,"",protoBody());

  body+=block("inbox","Inbox",`${S.inbox.length} unread · newest: ${S.inbox.length?S.inbox[0].when.replace("today ","")+" review request on PR #144":"nothing waiting"} · ${S.snoozed.length} snoozed`,nav("Open as page","#/inbox"),inboxBody());

  body+=block("strip","Day","08:30 → 14:32 · 362 min on the clock",
    `${btn("Assign 30 min","assign")}${nav("Timesheet","#/timesheet")}`,stripBody());

  /* ── the ledger stream ── */
  body+=`<div class="subh" style="padding-top:16px"><span class="lbl">Ledger · Friday 22 August</span><hr><span class="lbl">${S.stream.length + S.extra.length} lines</span></div>`;
  const all=S.stream.concat(S.extra).slice().sort((a,b)=>a.t.localeCompare(b.t));
  body+=all.map(streamLine).join("");

  /* ── composer ── */
  body+=`<div class="comp">
    <div class="comp-in">
      <span class="cnow mono">14:32</span>
      <input id="composer" placeholder="Write a note, [[ to link, / for a command" autocomplete="off">
      <button class="btn btn--p" data-act="comp-add">Add line</button>
    </div>
    <div class="comp-hint">Try <span class="mono">/start work PAY-240</span> · <span class="mono">/trigger build</span> · <span class="mono">/new ticket</span> · <span class="mono">/new page</span> · <span class="mono">/git push</span> · <span class="mono">/new repo</span></div>
  </div>`;
  return body;
}

function streamLine(b){
  switch(b.kind){
    case "suggest":{const sg=S.suggestions.find(s=>s.id===b.id);return sg?suggestRow(sg):"";}
    case "ticket":{
      const t=TICKETS[b.ref], did="det:"+b.ref, isOpen=!!S.openBlocks[did];
      return entry({id:b.id,t:b.t,rail:b.rail,dur:b.dur,cls:isOpen?"is-open":"",
        main:`<button class="btn btn--q" data-act="toggle" data-id="${did}" aria-expanded="${isOpen}" aria-label="Expand ${t.key}"><svg class="tri" viewBox="0 0 10 10" fill="currentColor" style="transform:rotate(${isOpen?90:0}deg)"><path d="M3 1.5 7 5 3 8.5Z"/></svg></button>
          <span class="e-txt"><span class="e-ref">${t.key}</span> <span class="e-desc">${esc(t.sum)}</span>${t.blockedBy?`<span class="e-sub">blocked by <button class="lnk" data-go="#/ticket/${t.blockedBy}">${t.blockedBy}</button> · ${esc(PEOPLE.tomasz.n)}</span>`:""}</span>`,
        right:`${pill(t.status)}${stamp("JIRA",t.key)}`,
        acts:`${nav("Open as page","#/ticket/"+t.key)}`})
        + (isOpen?`<div class="entry" style="border-bottom:1px solid var(--rule);display:block;padding:0"><span class="e-rail rail-${b.rail}"></span>${ticketDetail(b.ref,true)}</div>`:"");
    }
    case "commit":{
      const c=COMMITS[b.ref];
      return entry({id:b.id,t:b.t,rail:b.rail,
        main:`<span class="e-gl">⎇</span><span class="e-txt"><span class="e-ref">${c.h}</span> <span class="e-desc">${esc(c.msg)}</span><span class="e-sub">payout-service · feature/PAY-231-sepa-retry</span></span>`,
        right:stamp("GIT",c.h),acts:nav("Open PAY-231","#/ticket/PAY-231")});
    }
    case "build":{
      const bd=BUILDS[b.ref];
      const failed=bd.state==="failed";
      return entry({id:b.id,t:b.t,rail:b.rail,
        main:`<span class="e-gl">${failed?"⚠":"⚙"}</span><span class="e-txt"><span class="e-ref">#${bd.n}</span> <span class="e-desc">${esc(bd.cfg)}</span><span class="e-sub">${failed?"assertion failed: attempts == 5 (left: 6, right: 5) · 41 passed, 1 failed":esc(bd.step)} · <span class="mono">${esc(bd.branch)}</span></span></span>`,
        right:`${failed?stamp("FAILED","b"+bd.n):pill(bd.state)}${stamp("CI","b"+bd.n)}`,
        acts:`${nav("Open log","#/build/"+bd.n)}${failed?btn("Re-run","rerun",{cls:"btn--d",data:'data-id="'+bd.n+'"'}):""}`});
    }
    case "page":{
      const p=PAGES[b.ref];
      return entry({id:b.id,t:b.t,rail:b.rail,
        main:`<span class="e-gl">✎</span><span class="e-txt"><span class="e-desc">Edited <b>${esc(p.t)}</b>${b.sec?` › ${esc(b.sec)}`:""}</span><span class="e-sub">Confluence ENG · base 30 s, factor 2, max 5 attempts, jitter ±10 %</span></span>`,
        right:stamp("WIKI","pg"+p.id),acts:nav("Open page","#/page/"+p.id)});
    }
    case "mynote":{
      const n=NOTES[b.ref];
      return entry({id:b.id,t:b.t,rail:b.rail,cls:"is-mine",
        main:`<span class="e-gl" style="color:var(--red)">✎</span><span class="e-txt"><span class="mine">${chips(n.body.split("\n\n")[0])}</span><span class="e-sub">your note · <button class="lnk" data-go="#/note/${n.id}">${esc(n.t)}</button></span></span>`,
        right:stamp("NOTE","nt"+n.id),acts:nav("Open note","#/note/"+n.id)});
    }
    case "unattr":
      return entry({id:b.id,t:b.t,rail:"u",dur:b.dur,
        main:`<span class="e-gl" style="color:var(--red)">░</span><span class="e-txt"><span class="e-desc" style="color:var(--red)">Unattributed — the app was open, nothing was in focus</span><span class="e-sub">11:50–12:20 · these 30 minutes are not on any ticket.</span></span>`,
        right:stamp("UNFILED",b.id,{red:true}),
        acts:`${btn("Assign…","assign",{cls:"btn--p"})}${btn("Discard","discard-unattr")}`});
    case "gap":
      return entry({id:b.id,t:b.t,rail:"g",dur:b.dur,
        main:`<span class="e-gl">·</span><span class="e-txt"><span class="e-desc" style="color:var(--faint)">No activity · 12:20–13:10</span></span>`});
    case "adhoc":
      return entry({id:b.id,t:b.t,rail:"m",dur:b.dur,
        main:`<span class="e-gl">◔</span><span class="e-txt"><span class="e-desc">Staging DB configuration</span><span class="e-sub">manual label · no ticket behind it</span></span>`,
        right:stamp("LABEL",b.id),
        acts:`${btn("Log to a ticket…","adhoc-log",{cls:"btn--p"})}${btn("Keep local","adhoc-local")}`});
    case "running":{
      const t=S.timer;
      return entry({id:b.id,t:b.t,rail:"m",dur:t.on?fmtT(t.sec):"stopped",
        main:`<span class="e-gl" style="color:var(--blue)">◔</span><span class="e-txt"><span class="e-desc"><b>${esc(t.ctx)}</b> ${t.on?"— timer running since "+esc(t.since):"— timer stopped"}</span><span class="e-sub">started manually · ${t.on?"counts toward the worklog draft":"nothing is being tracked"}</span></span>`,
        right:t.on?stamp("RUNNING",b.id):stamp("STOPPED",b.id,{red:true}),
        acts:t.on?`${btn("Stop and log","timer-stop",{cls:"btn--p"})}${btn("Switch context…","timer-switch")}`:`${btn("Start timer","timer-start",{cls:"btn--p"})}${btn("Switch context…","timer-switch")}`});
    }
    case "worklog":return worklogBlock(b);
    case "stepper":return stepperBlock(b);
    case "form":return b.html;
    case "text":
      return entry({id:b.id,t:b.t,rail:"e",cls:"is-mine",
        main:`<span class="e-gl" style="color:var(--red)">✎</span><span class="e-txt"><span class="mine">${chips(b.ref)}</span><span class="e-sub">your note · added at ${b.t}</span></span>`,
        right:stamp("NOTE",b.id,{anim:true})});
    default:
      return entry({id:b.id,t:b.t,rail:b.rail,dur:b.dur,
        main:`<span class="e-gl">${b.gl||"•"}</span><span class="e-txt"><span class="e-desc">${esc(b.ref)}</span>${b.sub?`<span class="e-sub">${esc(b.sub)}</span>`:""}</span>`,
        right:b.stamp?stamp(b.stamp,b.id):"",
        acts:(b.act||[]).map(a=>nav(a[0],a[1])).join("")});
  }
}

/* ── worklog draft, inserted as a block in the stream ─────────── */
function worklogBlock(b){
  const w=WORKLOG;
  if(b.logged){
    return entry({id:b.id,t:b.t,rail:"m",dur:w.dur,
      main:`<span class="e-gl">▤</span><span class="e-txt"><span class="e-desc">Logged <b>${w.dur}</b> to <b>${esc(w.target)}</b></span><span class="e-sub">${esc(w.comment)}</span></span>`,
      right:stamp("JIRA",b.id,{anim:true}),acts:nav("Open "+w.target,"#/ticket/"+w.target)});
  }
  return `<div class="entry" style="display:block;padding:10px 0"><span class="e-time">${b.t}</span><span class="e-rail rail-m"></span>
    <div style="display:flex;align-items:center;gap:9px;padding-bottom:8px"><span class="blk-t">Worklog draft</span><span class="blk-m">from the timer you just stopped</span>${stamp("DRAFT",b.id)}</div>
    <div class="det-grid">
      <div class="det-f"><span class="lbl">Interval</span><span class="v mono">${esc(w.interval)}</span></div>
      <div class="det-f"><span class="lbl">Duration</span><span class="v mono">${esc(w.dur)}</span></div>
      <div class="det-f"><span class="lbl">Target</span><span class="v"><button class="btn" data-act="wl-target">${esc(w.target)} ▾</button></span></div>
      <div class="det-f"><span class="lbl">Date</span><span class="v mono">2026-08-22</span></div>
    </div>
    <div class="subh"><span class="lbl">Activity in this interval</span><hr><span class="lbl">${w.items.filter(i=>i.on).length} of ${w.items.length} in the comment</span></div>
    ${w.items.map(i=>`<label class="cbrow"><input type="checkbox" data-act="wl-item" data-id="${i.id}"${i.on?" checked":""}><span class="cbt">${i.tx}</span><span class="cbw">${i.w}</span></label>`).join("")}
    <div class="subh"><span class="lbl">Worklog comment</span><hr></div>
    <textarea class="ta" id="wl-comment" style="min-height:52px">${esc(w.comment)}</textarea>
    <div style="display:flex;gap:6px;padding-top:9px;flex-wrap:wrap">
      ${btn("Log "+w.dur+" to "+w.target,"wl-log",{cls:"btn--p"})}${btn("Edit interval","wl-edit")}${btn("Discard","wl-discard",{cls:"btn--d"})}
    </div></div>`;
}

/* ── stepper block (slash-command actions) ───────────────────── */
function stepperBlock(b){

function searchResults(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  return CORPUS.filter(c=>{
    if(S.filters.src.size&&!S.filters.src.has(c.src))return false;
    if(S.filters.failing&&!c.failing)return false;
    if(S.filters.who&&c.who!==S.filters.who)return false;
    if(S.filters.type&&c.type!==S.filters.type)return false;
    if(S.filters.day&&c.day!==S.filters.day)return false;
    if(!terms.length)return true;
    const hay=(c.ref+" "+c.t+" "+c.kw+" "+c.type).toLowerCase();
    return terms.every(t=>hay.indexOf(t)>-1);
  });
}

function render(){

  let body="",title="",sub="";

    switch(p[0]){
      case "day": body=pageDay(p[1]||"2026-08-22");

        sub="day page";break;
      case "ticket": body=pageTicket(p[1]);title=p[1];sub=(TICKETS[p[1]]||{}).sum||"ticket";break;
      case "pr": body=pagePR(p[1]);title="PR #"+p[1];sub=(PRS[p[1]]||{}).title||"pull request";break;
      case "build": body=pageBuild(p[1]);title="#"+p[1];sub=(BUILDS[p[1]]||{}).cfg||"build";break;
      case "page": body=pageWiki(p[1]);title=(PAGES[p[1]]||{}).t||"page";sub="Confluence ENG";break;
      case "note": body=pageNote(p[1]);title=(NOTES[p[1]]||{}).t||"note";sub="local note";break;
      case "list": body=pageList(p[1]);title=(S.smart.find(x=>x.id===p[1])||{}).t||"list";sub="smart list";break;
      case "inbox": body=pageInbox();title="Inbox";sub=S.inbox.length+" unread";break;
      case "sources": body=pageSources(p[1]);title=p[1]==="add"?"Add source":"Sources";sub=p[1]==="add"?"new adapter":"4 configured";break;
      case "timesheet": body=pageTimesheet();title="Week 34";sub="timesheet";break;
      default: body=pageDay("2026-08-22");title="Friday 22 August 2026";sub="day page";
    }
  }catch(err){
    body=`<div class="empty">Something in this view failed to render: ${esc(err.message)}</div>`;

  }
  $("#main").innerHTML=`<div class="sheet">${body}</div>`;

document.addEventListener("click",function(ev){
  const actEl=ev.target.closest("[data-act]");
  const goEl=ev.target.closest("[data-go]");
  if(!actEl&&goEl){ev.preventDefault();closeOverlay();go(goEl.getAttribute("data-go"));return;}
  if(!actEl){if(!ev.target.closest(".pop"))closePop();return;}
  const a=actEl.getAttribute("data-act"), id=actEl.getAttribute("data-id");
  try{ handle(a,id,actEl,ev); }
  catch(err){ $("#errlog").textContent+="action "+a+": "+err.message+"\n"; toast("That action failed: "+esc(err.message)+". Nothing was written.","error",true); }
});

    PAGES["sepa-design"].body[3]=["p",tx];
    PAGES["sepa-design"].edited="today 14:32";
    S.inbox=S.inbox.filter(x=>x.id!=="i2");
    S.stream.push({id:"wk"+Date.now(),t:"14:32",rail:"e",kind:"page",ref:"sepa-design",stamp:"WIKI",sec:"Manual review queue"});
    render(); toast("Saved to Confluence and Priya's mention is cleared.","confluence"); return;}
  case "wiki-note":{
    NOTES["sla"]={id:"sla",t:"Manual review queue SLA",edited:"today 14:32",body:"Draft: payouts in the manual review queue are cleared within one business day. Confirm with Priya, then paste into [[SEPA payout retry design]].\n\nRelates to [[PAY-231]]."};
    TOKEN["Manual review queue SLA"]="#/note/sla";
    go("#/note/sla"); toast("Kept as a local note instead. Nothing was published.","note"); return;}
  case "wiki-reply":{
    const ta=$("#wiki-reply");
    const tx=ta&&ta.value.trim()?ta.value.trim():"Adding it now — one business day, matching the finance escalation window.";
    PAGES["sepa-design"].comments.push({who:"mara",when:"today 14:32",tx:tx});
    S.inbox=S.inbox.filter(x=>x.id!=="i2");
    render(); toast("Replied to Priya on the page.","confluence"); return;}
  case "note-edit": S.noteEdit=id; render(); return;
  case "note-save":{
    const ta=$("#note-body"); if(ta)NOTES[id].body=ta.value;
    NOTES[id].edited="today 14:32"; S.noteEdit=null; render(); toast("Note saved locally.","note"); return;}
  case "newnote":{
    const nid="n"+Date.now();
    NOTES[nid]={id:nid,t:"Note 2026-08-22 14:32",edited:"today 14:32",
      body:"Started from "+(S.route.indexOf("ticket")>-1?"PAY-231":"Friday's day page")+".\n\nContext: [[PAY-231]] [[#1187]] [[SEPA payout retry design]]."};
    S.noteEdit=nid; go("#/note/"+nid); toast("New note created, pre-linked to what you were looking at.","note"); return;}

  /* ── sources ── */
  case "syncnow": S.sources.forEach(s=>{if(s.state!=="error")s.sync="synced just now";}); render();
    toast("Jira, Confluence and Gitea synced. TeamCity still returns 401.","sync",true); return;
  case "tc-reauth": S.addSrc.reauth=true; render(); setTimeout(()=>{const e=$("#tc-pw");if(e)e.focus();},20); return;
  case "tc-cancel": S.addSrc.reauth=false; render(); return;
  case "tc-test":{
    const s=S.sources.find(x=>x.id==="teamcity");
    s.state="ok"; s.sync="synced just now"; s.err=null; S.addSrc.reauth=false;
    const q=S.pending; S.pending=0; bumpPending(0);
    render(); toast(q?"TeamCity accepted the password. "+q+" queued write"+(q===1?"":"s")+" sent.":"TeamCity accepted the password. Builds are live again.","teamcity"); return;}
  case "as-type": S.addSrc.type=id; S.addSrc.step=Math.max(S.addSrc.step,1);
    S.addSrc.url=id==="TeamCity"?"https://ci.tidewater.internal":id==="Gitea"?"https://git.tidewater.internal":"";
    render(); return;
  case "as-url-next":{const u=$("#as-url"); S.addSrc.url=u?u.value:""; 
    if(!S.addSrc.url){toast("Enter the base URL of the server — knobas needs it before it can test anything.","missing url",true);return;}
    S.addSrc.step=Math.max(S.addSrc.step,2); render(); return;}
  case "as-auth": S.addSrc.auth=id; S.addSrc.tested=false; render(); return;
  case "as-test": S.addSrc.tested=true; S.addSrc.step=Math.max(S.addSrc.step,3); render();
    toast("Connection verified · adapter loaded · search and write available.","test connection"); return;
  case "as-save":{
    const a=S.addSrc;
    S.sources.push({id:"new"+S.sources.length,type:a.type,name:a.url.replace(/^https?:\/\//,""),url:a.url,auth:a.auth,authNote:"added today 14:32",
      state:"ok",sync:"first sync running",count:"indexing…",adapter:(SRC_TYPES.find(t=>t[0]===a.type)||[])[1]||"adapter v1.0",
      caps:(SRC_TYPES.find(t=>t[0]===a.type)||[])[2]||["search"],stamp:(a.type||"NEW").slice(0,4).toUpperCase()});
    S.addSrc={step:0,type:"",url:"",auth:"",sched:"5",tested:false};
    go("#/sources"); toast("Source saved. First sync is running.","sources"); return;}
  case "as-cancel": S.addSrc={step:0,type:"",url:"",auth:"",sched:"5",tested:false}; go("#/sources"); return;

  /* ── search ── */
  case "f-src": if(S.filters.src.has(id))S.filters.src.delete(id);else S.filters.src.add(id);
    document.querySelectorAll('[data-act="f-src"]').forEach(b=>b.classList.toggle("on",S.filters.src.has(b.getAttribute("data-id"))));
    drawResults(); return;
  case "f-fail": S.filters.failing=!S.filters.failing; el.classList.toggle("on",S.filters.failing); drawResults(); return;
  case "res":{
    const route=el.getAttribute("data-route");
    if(ev.shiftKey){const r=CORPUS.find(c=>c.route===route&&c.ref===el.getAttribute("data-ref"));
      if(r){insertSearchBlock(r);return;}
      if(route.indexOf("#/list/")===0){closeOverlay();handle("insert-list",route.split("/").pop());return;}}
    closeOverlay(); go(route); return;}

  /* ── forms ── */
  case "nt-create":{
    const sum=($("#nt-sum")||{}).value||"Document manual-review queue SLA";
    const proj=(($("#nt-proj")||{}).value||"PAY").split(" ")[0];
    const key=proj==="OPS"?"OPS-78":"PAY-241";
    TICKETS[key]={key:key,sum:sum,type:($("#nt-type")||{}).value||"Task",status:"To Do",pri:"Medium",who:"mara",upd:"today 14:32",epic:"PAY-200",
      desc:"Created from Friday's day page at 14:32.",est:"—",spent:"0m",comments:[],worklogs:[],links:[]};
    CORPUS.push({ref:key,t:sum,src:"JIRA",srcName:"Tidewater Jira",sync:"just now",route:"#/ticket/"+key,type:"ticket",kw:sum.toLowerCase()});
    TOKEN[key]="#/ticket/"+key;
    S.extra=S.extra.filter(x=>x.id!==id);
    S.extra.push({id:"x"+Date.now(),t:"14:32",rail:"e",kind:"ticket",ref:key,stamp:"JIRA"});
    render(); toast("Created <b>"+key+"</b> · "+esc(sum)+".","jira"); return;}
  case "np-create":{
    const t=($("#np-title")||{}).value||"Manual review queue SLA";
    const pid="p"+Date.now();
    PAGES[pid]={id:pid,t:t,space:"ENG",edited:"today 14:32",by:"mara",body:[["h","Draft"],["p","Created from Friday's day page. Fill this in and it syncs back to Confluence on the next write."]],comments:[]};
    TOKEN[t]="#/page/"+pid;
    S.extra=S.extra.filter(x=>x.id!==id);
    S.extra.push({id:"x"+Date.now(),t:"14:32",rail:"e",kind:"act",gl:"✎",ref:"Created page "+t,sub:"Confluence ENG · child of Standup protocols",stamp:"WIKI",act:[["Open page","#/page/"+pid]]});
    render(); toast("Created <b>"+esc(t)+"</b> in ENG.","confluence"); return;}
  case "nr-create":{
    const n=($("#nr-name")||{}).value||"payout-reports";
    S.extra=S.extra.filter(x=>x.id!==id);
    S.extra.push({id:"x"+Date.now(),t:"14:32",rail:"e",kind:"act",gl:"⎇",ref:"Created repository tidewater/"+n,sub:"Gitea · private · cloned to ~/code/"+n,stamp:"GIT"});
    render(); toast("Repository <b>tidewater/"+esc(n)+"</b> created and cloned.","gitea"); return;}
  case "x-block": S.extra=S.extra.filter(x=>x.id!==id); render(); return;

  /* ── composer ── */
  case "comp-add": runComposer(); return;
  case "pop":{const el2=ev.target.closest(".pop");const it=el2._items[+ev.target.closest("[data-n]").getAttribute("data-n")];closePop();if(it.run)it.run();return;}
  case "pick":{const el2=ev.target.closest(".pop");const it=el2._list[+ev.target.closest("[data-n]").getAttribute("data-n")];if(el2._pick)el2._pick(it);return;}
  default: return;
  }
}
function buildWlComment(){
  const on=WORKLOG.items.filter(i=>i.on);
  if(!on.length)return "";
  const parts=[];
  if(on.some(i=>i.id==="w1"||i.id==="w2"))parts.push("Backoff jitter ("+[on.find(i=>i.id==="w1")?"a41f2c":null,on.find(i=>i.id==="w2")?"c90d11":null].filter(Boolean).join(", ")+")");
  if(on.some(i=>i.id==="w3"))parts.push("replied to review on PR #142");
  if(on.some(i=>i.id==="w4"))parts.push("triggered build #1188");
  if(on.some(i=>i.id==="w5"))parts.push("updated Backoff policy in the design page");
  if(on.some(i=>i.id==="w6"))parts.push("updated the investigation note");
  return parts.join("; ")+".";
}
function assignUnattr(target,isLabel){
  const i=S.stream.findIndex(x=>x.id==="b13");
  S.stream[i]={id:"b13",t:"11:50",rail:isLabel?"m":"p",dur:"30 min",kind:"act",gl:"◔",
    ref:target+" · 11:50–12:20",sub:isLabel?"ad-hoc label · no ticket behind it":"assigned by you at 14:32 · ready to log",
    stamp:isLabel?"LABEL":"JIRA",act:isLabel?[]:[["Open "+target,"#/ticket/"+target]]};
  render(); toast("30 minutes assigned to <b>"+esc(target)+"</b>.","time");
}
function logAdhoc(key){
  const b=S.stream.find(x=>x.id==="b15");
  b.kind="act";b.gl="▤";b.ref="Staging DB configuration → "+key;b.sub="48 m logged as a Jira worklog · comment: Staging DB configuration";b.stamp="JIRA";b.act=[["Open "+key,"#/ticket/"+key]];
  S.loggedToday.push({target:key,dur:"48m",min:48,comment:"Staging DB configuration",at:"14:32"});
  if(TICKETS[key])TICKETS[key].worklogs.push({when:"today",dur:"48m",tx:"Staging DB configuration"});
  render(); toast("Logged <b>48m</b> to <b>"+key+"</b>.","saved to jira");
}
function switchTimer(ctx,isLabel){
  S.timer={on:true,ctx:ctx,kind:isLabel?"label":"ticket",since:"14:32",sec:0};
  const b=S.stream.find(x=>x.id==="b17"); if(b)b.t="14:32";
  render(); toast("Timer now on <b>"+esc(ctx)+"</b>"+(isLabel?" (ad-hoc label, no ticket)":"")+".","timer");
}

/* ══════════════════════════════════════════════════════════════════
   12. COMPOSER — plain notes, [[ links, / commands
   ══════════════════════════════════════════════════════════════════ */
const COMMANDS=[
  {c:"/start work PAY-240",d:"branch, push, PR, link, In Progress, timer",run:()=>startWork("PAY-240")},
  {c:"/trigger build",d:"TeamCity · branch, env, clean checkout",run:()=>pushForm("build")},
  {c:"/new ticket",d:"Jira · PAY or OPS",run:()=>pushForm("ticket")},
  {c:"/new page",d:"Confluence ENG",run:()=>pushForm("page")},
  {c:"/new repo",d:"Gitea org tidewater",run:()=>pushForm("repo")},
  {c:"/git pull",d:"payout-service",run:()=>gitOp("pull")},
  {c:"/git push",d:"payout-service · 3 commits",run:()=>gitOp("push")},
  {c:"/new branch",d:"payout-service",run:()=>gitOp("branch")},
  {c:"/log time",d:"open the worklog draft",run:()=>handle("worklog-draft")},
  {c:"/standup",d:"jump to today's digest",run:()=>{S.openBlocks.standup=true;go("#/day/2026-08-22");}}
];
function runComposer(){
  const inp=$("#composer");
  if(!inp)return;
  const v=inp.value.trim();
  if(!v){toast("Nothing to add. Type a note, or / for a command.","empty line",true);return;}
  if(v.charAt(0)==="/"){
    const cmd=COMMANDS.filter(c=>c.c.toLowerCase().indexOf(v.toLowerCase())===0||v.toLowerCase().indexOf(c.c.toLowerCase())===0)[0];
    inp.value="";
    if(cmd){cmd.run();return;}
    toast("No command called <span class='mono'>"+esc(v)+"</span>. Try /start work, /trigger build, /new ticket, /new page, /git push, /new repo.","unknown command",true);
    return;
  }
  S.extra.push({id:"t"+Date.now(),t:"14:32",kind:"text",ref:v});
  inp.value="";
  render();
  toast("Line added to Friday's page.","note");
}
document.addEventListener("keydown",function(e){
  const inComposer=e.target&&e.target.id==="composer";
  if(inComposer&&e.key==="Enter"){e.preventDefault();runComposer();return;}
  if(inComposer&&e.key==="Escape"){e.target.value="";closePop();return;}
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&(e.key==="k"||e.key==="K")){e.preventDefault();if($("#scrim"))closeOverlay();else openSearch();return;}
  if(mod&&(e.key==="t"||e.key==="T")){
    e.preventDefault();
    if(S.timer.on){handle("timer-stop");}else{handle("timer-start");}
    return;
  }
  if(e.key==="Escape"){
    if($("#popover").innerHTML){closePop();return;}
    if($("#scrim")){closeOverlay();return;}
  }
});
document.addEventListener("change",function(e){
  const m={"f-type":"type","f-who":"who","f-day":"day"}[e.target.id];
  if(!m)return;
  S.filters[m]=e.target.value; drawResults();
});
document.addEventListener("input",function(e){
  if(e.target.id!=="composer")return;
  const v=e.target.value;
  if(v.charAt(0)==="/"){
    const list=COMMANDS.filter(c=>c.c.toLowerCase().indexOf(v.toLowerCase())===0);
    if(list.length){popover(e.target,"Commands",list.map(c=>({k:c.c,t:"",d:c.d,run:()=>{e.target.value="";c.run();}})));}
    else closePop();
    return;
  }
  if(/\[\[([^\]]*)$/.test(v)){
    const frag=v.match(/\[\[([^\]]*)$/)[1];
    const items=Object.keys(TOKEN).filter(k=>k.toLowerCase().indexOf(frag.toLowerCase())>-1).slice(0,8)
      .map(k=>({k:k,t:"",d:TOKEN[k].split("/")[1],run:()=>{e.target.value=v.replace(/\[\[[^\]]*$/,"[["+k+"]] ");e.target.focus();}}));
    if(items.length)popover(e.target,"Link to",items);else closePop();
    return;
  }
  closePop();
});
document.addEventListener("click",function(e){
  if(e.target.closest("#btn-search")){if($("#scrim"))closeOverlay();else openSearch();}
  if(e.target.closest("#btn-inbox")){go("#/inbox");}
  if(e.target.closest("#btn-sync")){go("#/sources");}
  if(e.target.closest("#btn-back")){history.back();}
  if(e.target.closest("#btn-timer")&&!e.target.closest("[data-act]")){
    e.stopPropagation();
    popover($("#btn-timer"),S.timer.on?"Timer · "+S.timer.ctx+" since "+S.timer.since:"Timer stopped",
      (S.timer.on?[{k:"stop",t:"Stop and draft a worklog",run:()=>handle("timer-stop")}]:[{k:"start",t:"Start on "+S.timer.ctx,run:()=>handle("timer-start")}])
      .concat([
        {k:"PAY-231",t:"Retry failed SEPA payouts",run:()=>switchTimer("PAY-231")},
        {k:"PAY-240",t:"Payout dashboard latency",run:()=>switchTimer("PAY-240")},
        {k:"PAY-228",t:"Ledger drift on partial refunds",run:()=>switchTimer("PAY-228")},
        {k:"label",t:"Staging DB configuration",d:"ad-hoc",run:()=>switchTimer("Staging DB configuration",true)},
        {k:"day",t:"Open today's day review",run:()=>go("#/day/2026-08-22")}
      ]));
  }
},true);

/* ── the clock ───────────────────────────────────────────────── */
setInterval(function(){
  if(!S.timer.on)return;
  S.timer.sec++;
  const el=$("#t-el"); if(el)el.textContent=fmtT(S.timer.sec);
  const row=document.getElementById("e-b17");
  if(row){const d=row.querySelector(".e-dur");if(d)d.textContent=fmtT(S.timer.sec);}
},1000);

/* ── boot ────────────────────────────────────────────────────── */
window.addEventListener("hashchange",render);
try{
  if(!location.hash)location.hash="#/day/2026-08-22";
  render();
  bumpPending(0);
}catch(err){
  $("#errlog").textContent+="boot: "+err.message+"\n";
  document.getElementById("main").innerHTML='<div class="sheet"><div class="empty">knobas failed to start: '+esc(err.message)+'</div></div>';
}
})();
</script>
