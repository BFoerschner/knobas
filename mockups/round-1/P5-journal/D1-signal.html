<!--
knobas mockup
paradigm: P5 Journal
design: D1 Signal
thesis: Your day is one editable document — activity, notes, worklogs and the standup are blocks on the same page, and every remote object is live inside it.
thesis: A dark departure board: everything is a reading in mono, hairlines instead of boxes, and amber only where something is changing or wants you.
thesis: Split-flap status cells — timer minutes, ticket status, build state and the inbox count physically flip when they change.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Friday 22 August 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15171A; --panel:#1D2024; --raised:#24282D; --hair:#2E3339;
  --text:#E7E9EC; --muted:#8B929A; --faint:#5A6169;
  --amber:#FFB020; --fail:#FF6A5C; --ok:#7FD1A1; --link:#9CC3FF;
  --disp:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --spine:75px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--body);font-size:13px;line-height:1.45;
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}
::selection{background:rgba(156,195,255,.25)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2E3339;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- primitives ---------- */
.lbl{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.fnt{color:var(--faint)}
.amb{color:var(--amber)}
.red{color:var(--fail)}
.grn{color:var(--ok)}
.hr{height:1px;background:var(--hair)}
.key{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.01em;color:var(--text)}
.mg{display:inline-flex;align-items:center;justify-content:center;width:20px;height:14px;
  border:1px solid var(--hair);border-radius:2px;font-family:var(--mono);font-size:9px;font-weight:500;
  letter-spacing:.06em;color:var(--muted);background:var(--panel);flex:none}
.mg.on{color:var(--text);border-color:#3B4249}
.tny{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- split-flap ---------- */
.flap{position:relative;display:inline-flex;align-items:center;justify-content:center;
  height:20px;padding:0 7px;background:var(--raised);border:1px solid var(--hair);border-radius:2px;
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;vertical-align:middle}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0E1013;opacity:.55;z-index:4;pointer-events:none}
.flap .fv{display:block;line-height:18px}
.flap.f-run{color:var(--amber);border-color:#4A3A1A}
.flap.f-fail{color:var(--fail);border-color:#4A2A28}
.flap.f-ok{color:var(--ok);border-color:#26382E}
.flap.f-idle{color:var(--muted)}
.flap.f-lg{height:24px;font-size:12px;padding:0 9px}
.fl-top,.fl-bot{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--raised);z-index:3;backface-visibility:hidden}
.fl-top{top:0;transform-origin:bottom center;animation:flTop 170ms ease-in forwards}
.fl-bot{bottom:0;transform-origin:top center;transform:rotateX(90deg);animation:flBot 170ms ease-out 170ms forwards}
.fl-in{display:flex;align-items:center;justify-content:center;width:100%;height:var(--fh,20px);line-height:18px}
@keyframes flTop{to{transform:rotateX(-90deg)}}
@keyframes flBot{to{transform:rotateX(0)}}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:22px 44px minmax(0,1fr) 26px;height:100vh;min-width:1080px}

#ticker{display:flex;align-items:center;gap:0;background:#101215;border-bottom:1px solid var(--hair);overflow:hidden}
#ticker .tk-lbl{flex:none;padding:0 10px;height:100%;display:flex;align-items:center;gap:6px;
  font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--amber);
  border-right:1px solid var(--hair);background:#15171A}
#ticker .dot{width:5px;height:5px;background:var(--amber);border-radius:1px;animation:blink 2.4s steps(1) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
.tk-track{flex:1;overflow:hidden;min-width:0}
.tk-run{display:inline-flex;white-space:nowrap;animation:tkRun 52s linear infinite;will-change:transform}
#ticker:hover .tk-run{animation-play-state:paused}
@keyframes tkRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-i{display:inline-flex;align-items:center;gap:7px;padding:0 20px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums}
.tk-i b{color:var(--amber);font-weight:500}
.tk-i .sep{color:#3A4046}

#chrome{display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;background:var(--panel);border-bottom:1px solid var(--hair)}
.brand{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.16em;text-transform:lowercase;color:var(--text)}
.brand i{color:var(--amber);font-style:normal}
.navbtns{display:flex;gap:2px}
.nb{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;color:var(--faint)}
.nb:hover{color:var(--text);border-color:var(--hair)}
#crumbs{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
#crumbs .cb{color:var(--faint)}
#crumbs .cn{color:var(--text)}
.chrome-r{display:flex;align-items:center;gap:8px;flex:none}
.cbtn{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border:1px solid var(--hair);border-radius:2px;background:#191C20}
.cbtn:hover{border-color:#3B4249}
.cbtn .cl{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.1em;color:var(--faint)}
#timerBtn.run{border-color:#4A3A1A;background:#1E1B14}
#timerBtn .tctx{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:500}
#timerBtn.idle .tctx{color:var(--muted)}
#timerSec{font-family:var(--mono);font-size:10px;color:#8A6A22;font-variant-numeric:tabular-nums}

#panes{display:grid;grid-template-columns:210px minmax(0,1fr) 244px;min-height:0;background:var(--bg)}
#side{border-right:1px solid var(--hair);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#sideScroll{flex:1;overflow-y:auto;min-height:0}
#center{overflow-y:auto;min-height:0;position:relative}
#right{border-left:1px solid var(--hair);background:var(--panel);overflow-y:auto;min-height:0}

#status{display:flex;align-items:center;gap:0;background:#101215;border-top:1px solid var(--hair);padding:0 12px;
  font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.st{display:flex;align-items:center;gap:6px;padding:0 11px;height:100%;border-right:1px solid var(--hair)}
.st:first-child{padding-left:0}
.st.rt{margin-left:auto;border-right:none;border-left:1px solid var(--hair)}
.st b{font-weight:500;color:var(--muted)}
.st .sok{color:var(--ok)}
.st .sbad{color:var(--fail)}
kbd{font-family:var(--mono);font-size:9.5px;background:var(--raised);border:1px solid var(--hair);border-radius:2px;padding:1px 4px;color:var(--muted)}

/* ---------- sidebar ---------- */
.sgrp{padding:12px 0 4px}
.sgrp .lbl{padding:0 12px 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 10px 6px}
.cal .cd{position:relative;height:24px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid transparent;border-radius:2px}
.cal .cd.has{color:var(--muted);background:#1F2226}
.cal .cd.has:hover{border-color:#3B4249;color:var(--text)}
.cal .cd.sel{background:var(--raised);color:var(--text);border-color:#4A3A1A}
.cal .cd.sel::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:12px;height:2px;background:var(--amber)}
.cal .cdh{height:16px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:9px;letter-spacing:.06em;color:#3E444B;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;width:100%;text-align:left;border-left:2px solid transparent;color:var(--muted);font-size:12px}
.srow:hover{background:#22262B;color:var(--text)}
.srow.act{background:#22262B;color:var(--text);border-left-color:var(--amber)}
.srow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ct{font-family:var(--mono);font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.srow.act .ct{color:var(--muted)}
.srow .ct.hot{color:var(--amber)}
.srow svg{flex:none;opacity:.6}
.srow.act svg{opacity:1}
.sfoot{border-top:1px solid var(--hair);padding:4px 0 6px;flex:none;background:var(--panel)}
.newnote{display:flex;align-items:center;gap:7px;height:26px;padding:0 12px;width:100%;text-align:left;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--faint)}
.newnote:hover{color:var(--amber)}

/* ---------- page / document ---------- */
.pg{max-width:none;padding:0 0 120px}
.phead{padding:20px 26px 0;position:relative}
.ptitle{font-family:var(--disp);font-weight:600;font-size:29px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;color:var(--text)}
.ptitle .thin{color:var(--faint);font-weight:500}
.psub{display:flex;align-items:center;gap:14px;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.03em;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.psub .pill{display:inline-flex;align-items:center;gap:5px}
.pnav{position:absolute;top:22px;right:26px;display:flex;gap:4px}
.pnav .pb{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--hair);border-radius:2px;
  font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em}
.pnav .pb:hover{border-color:#3B4249;color:var(--text)}

/* day strip */
.dstrip{margin:16px 26px 0;border:1px solid var(--hair);border-radius:2px;background:#191C20}
.dstrip .dsh{display:flex;align-items:center;justify-content:space-between;padding:5px 9px 4px;border-bottom:1px solid var(--hair)}
.dsbars{display:flex;height:26px;padding:5px 8px;gap:2px}
.seg{position:relative;height:16px;border-radius:1px;border:1px solid transparent;min-width:3px}
.seg:hover{outline:1px solid #4A5158;outline-offset:1px}
.seg.pas{background:#282D33;border-color:#333A41}
.seg.man{background:#3C444C}
.seg.gap{background:repeating-linear-gradient(90deg,#1F2226 0 3px,transparent 3px 6px)}
.seg.una{background:repeating-linear-gradient(-45deg,rgba(255,176,32,.32) 0 4px,rgba(255,176,32,.08) 4px 8px);border-color:#5A4318}
.seg.now{background:var(--amber)}
.dsfoot{display:flex;gap:14px;padding:0 9px 6px;font-family:var(--mono);font-size:9.5px;color:#4E545B;letter-spacing:.04em}
.dsfoot span{display:inline-flex;align-items:center;gap:5px}
.dsk{width:10px;height:8px;border-radius:1px;display:inline-block}

/* stream */
.stream{position:relative;margin-top:8px;padding-top:8px}
.stream::before{content:"";position:absolute;left:var(--spine);top:0;bottom:0;width:1px;background:#333A41}
.blk{position:relative;display:grid;grid-template-columns:var(--spine) 1fr;align-items:start}
.blk>.tm{font-family:var(--mono);font-size:10.5px;color:#4E545B;text-align:right;padding:7px 12px 0 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.blk>.bd{padding:3px 26px 3px 0;min-width:0;position:relative}
.blk .glyph{position:absolute;left:-7px;top:9px;width:13px;height:13px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--faint);z-index:2}
.blk.hi>.bd{background:linear-gradient(90deg,rgba(255,176,32,.05),transparent 60%)}
.row{display:flex;align-items:center;gap:9px;min-height:28px;padding:2px 10px;border-radius:2px;margin-left:11px}
.row.klik{width:100%;text-align:left}
.row.klik:hover{background:#1F2327}
.row .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--muted)}
.row .ttl b{color:var(--text);font-weight:500}
.row .dur{font-family:var(--mono);font-size:10px;color:#4E545B;font-variant-numeric:tabular-nums;flex:none}
.row.act .ttl b{color:var(--text)}
.tw{display:inline-flex;align-items:center;gap:6px;flex:none}
.chev{width:12px;height:12px;color:#4E545B;flex:none;transition:transform 120ms}
.exp .chev{transform:rotate(90deg);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* my own writing — primary */
.mine{margin:6px 0 6px 11px;padding:8px 12px 9px;border-left:2px solid #3B4249;background:#191C20;border-radius:0 2px 2px 0}
.mine .mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mine .mt{font-size:14.5px;line-height:1.55;color:var(--text)}
.mine .mt em{font-style:normal;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 6px;border:1px solid var(--hair);border-radius:2px;
  background:var(--raised);font-family:var(--mono);font-size:10.5px;color:var(--link);vertical-align:baseline;white-space:nowrap}
.chip:hover{border-color:#3B5070;background:#232A33}
.chip .mg{width:17px;height:12px;font-size:8px}

/* expanded entity panel */
.epan{margin:2px 0 10px 11px;border:1px solid var(--hair);border-radius:2px;background:var(--panel)}
.epan .eh{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.epan .es{padding:11px 13px;border-bottom:1px solid var(--hair)}
.epan .es:last-child{border-bottom:none}
.esl{margin-bottom:7px}
.desc{font-size:13px;line-height:1.6;color:var(--muted);max-width:74ch}
.desc code{font-family:var(--mono);font-size:11.5px;background:var(--raised);padding:1px 4px;border-radius:2px;color:var(--text)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px 18px}
.kv .k{font-family:var(--disp);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#4E545B;display:block;margin-bottom:2px}
.kv .v{font-family:var(--mono);font-size:11.5px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}

.lrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;height:30px;padding:0 6px;border-radius:2px;border-bottom:1px solid #23272B}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#22262B}
.lrow .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.lrow .ln b{color:var(--text);font-weight:400}
.lrow .rel{font-family:var(--disp);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#4A5057;flex:none}

.cmt{padding:8px 0;border-bottom:1px solid #23272B}
.cmt:last-of-type{border-bottom:none}
.cmt .ch{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.cmt .cx{font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}
.av{width:18px;height:18px;border-radius:2px;background:var(--raised);border:1px solid var(--hair);display:inline-flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--muted);flex:none}
.who{font-size:12px;color:var(--text);font-weight:500}

/* buttons */
.b{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--hair);border-radius:2px;
  background:#1F2327;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.b:hover{border-color:#3B4249;color:var(--text);background:#242A2F}
.b.pri{border-color:#5A4318;color:var(--amber);background:#1F1B13}
.b.pri:hover{background:#2A2317;border-color:#7A5C22}
.b.dan{color:var(--fail);border-color:#3E2A28}
.b.sm{height:22px;padding:0 8px;font-size:10px}
.b[disabled]{opacity:.4;cursor:default}
.brow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gh{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px dashed #3A4148;border-radius:2px;
  font-family:var(--mono);font-size:10px;color:var(--faint)}
.gh:hover{color:var(--muted);border-color:#4A5158}

/* inputs */
.inp{height:28px;padding:0 9px;background:#131619;border:1px solid var(--hair);border-radius:2px;
  font-family:var(--mono);font-size:11.5px;color:var(--text);width:100%}
.inp:focus{border-color:#3B5070;outline:none;box-shadow:inset 0 0 0 1px rgba(156,195,255,.25)}
.inp::placeholder{color:#464C53}
select.inp{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%238B929A' stroke-width='1.2'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;padding-right:24px}
.fld{margin-bottom:10px}
.fld>.k{font-family:var(--disp);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#4E545B;display:block;margin-bottom:4px}
.ck{display:flex;align-items:flex-start;gap:8px;padding:4px 0;cursor:pointer;font-size:12.5px;color:var(--muted)}
.ck .box{width:14px;height:14px;border:1px solid #3B4249;border-radius:2px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;background:#131619}
.ck.on .box{border-color:#5A4318;background:#241E12}
.ck.on .box svg{display:block}
.ck .box svg{display:none;color:var(--amber)}
.ck:hover .box{border-color:#4A5158}
.ck.on{color:var(--text)}

/* dropdown */
.dd{position:absolute;z-index:60;min-width:190px;background:#1B1E22;border:1px solid #383F46;border-radius:2px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);padding:3px}
.dd .di{display:flex;align-items:center;gap:9px;width:100%;text-align:left;height:28px;padding:0 8px;border-radius:2px;
  font-size:12px;color:var(--muted)}
.dd .di:hover,.dd .di.sel{background:#262B31;color:var(--text)}
.dd .di .mono{font-size:11px}
.dd .dl{padding:6px 8px 4px}

/* editor line */
.edline{margin:4px 0 0 11px;padding:6px 10px;border-left:2px solid transparent}
.ed{min-height:22px;font-size:14.5px;line-height:1.55;color:var(--text);outline:none;caret-color:var(--amber);max-width:78ch}
.ed:empty::before{content:attr(data-ph);color:#454B52;pointer-events:none}
.ed:focus{border-color:transparent}
.edline:focus-within{border-left-color:var(--amber);background:#191C20}

/* suggestion ghost block */
.sug{margin:3px 0 3px 11px;padding:7px 11px;border:1px dashed #3A4148;border-radius:2px;background:rgba(255,176,32,.03);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sug .sx{flex:1;min-width:220px;font-size:12px;color:var(--muted)}
.sug .why{font-family:var(--mono);font-size:10px;color:#6C7278;letter-spacing:.02em}
.sug.gone{opacity:0;transition:opacity 120ms}

/* stepper */
.step{display:flex;align-items:center;gap:10px;height:30px;padding:0 4px;border-bottom:1px solid #23272B}
.step:last-child{border-bottom:none}
.step .sn{width:16px;height:16px;border:1px solid var(--hair);border-radius:2px;display:flex;align-items:center;justify-content:center;

.tb td.m{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.rrow:hover{background:#22262B;color:var(--text)}
.rrow .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeter{padding:4px 13px 2px}
.mtr{height:6px;background:#131619;border:1px solid var(--hair);border-radius:1px;display:flex;overflow:hidden}

.mtr .lg{background:#3C444C}
.mtr .ul{background:var(--amber);opacity:.75}
.rstat{display:flex;justify-content:space-between;padding:3px 13px;font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}

.omodal{width:min(760px,calc(100vw - 80px));background:#1B1E22;border:1px solid #383F46;border-radius:2px;box-shadow:0 24px 70px rgba(0,0,0,.7);

.obody{display:grid;grid-template-columns:172px 1fr;min-height:0;flex:1}

const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=m=>{const h=Math.floor(m/60),x=m%60;return h?(h+'h '+String(x).padStart(2,'0')+'m'):(x+'m');};

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function flapHTML(v,cls,w){return '<span class="flap '+(cls||'')+'"'+(w?' style="min-width:'+w+'px"':'')+'><span class="fv">'+v+'</span></span>';}
function mgHTML(m,on){return '<span class="mg'+(on?' on':'')+'">'+m+'</span>';}
function setFlapCls(node,cls){node.className='flap '+(cls||'');}
function flapSet(node,text,cls){
  if(!node)return;
  const cur=node.querySelector('.fv'); if(!cur)return;
  const old=cur.innerHTML;
  if(old===text){if(cls!==undefined)setFlapCls(node,cls);return;}
  const w=node.style.minWidth;
  if(RM.matches){cur.innerHTML=text;if(cls!==undefined)setFlapCls(node,cls);node.style.minWidth=w;return;}
  const h=node.offsetHeight||20;
  const top=document.createElement('span');top.className='fl-top';
  top.innerHTML='<span class="fl-in" style="--fh:'+h+'px">'+old+'</span>';
  const bot=document.createElement('span');bot.className='fl-bot';
  bot.innerHTML='<span class="fl-in" style="--fh:'+h+'px;margin-top:'+(-h/2)+'px">'+text+'</span>';
  node.appendChild(top);node.appendChild(bot);
  setTimeout(function(){cur.innerHTML=text;if(cls!==undefined){setFlapCls(node,cls);node.style.minWidth=w;}},170);
  setTimeout(function(){top.remove();bot.remove();},380);
}
function toast(msg,kind){
  const d=document.createElement('div');d.className='toast'+(kind?' '+kind:'');
  d.innerHTML=msg;TOASTS.appendChild(d);
  setTimeout(function(){d.style.transition='opacity 200ms';d.style.opacity='0';},2900);
  setTimeout(function(){d.remove();},3200);
}

/* closable overlay stack */
let DD=null;
function closeDD(){if(DD){DD.remove();DD=null;}}
function openDD(anchor,html,opts){
  closeDD();
  const d=document.createElement('div');d.className='dd';d.innerHTML=html;
  document.body.appendChild(d);
  const r=anchor.getBoundingClientRect();
  let top=r.bottom+4,left=(opts&&opts.right)?(r.right-d.offsetWidth):r.left;
  if(top+d.offsetHeight>window.innerHeight-30)top=Math.max(30,r.top-d.offsetHeight-4);
  if(left<6)left=6; if(left+d.offsetWidth>window.innerWidth-6)left=window.innerWidth-d.offsetWidth-6;
  d.style.top=top+'px';d.style.left=left+'px';DD=d;
  const fb=d.querySelector('input,button');if(fb)fb.focus();
  return d;
}
document.addEventListener('mousedown',function(e){
  if(DD && !DD.contains(e.target) && !e.target.closest('[data-act="timer-menu"]'))closeDD();
});

function serialize(node){
  let out='';
  Array.prototype.forEach.call(node.childNodes,function(c){
    if(c.nodeType===3)out+=c.textContent;
    else if(c.classList&&c.classList.contains('chip'))out+='[['+c.textContent.replace(/^(JI|CF|GT|TC|NT)/,'')+']]';
    else out+=(c.textContent||'');
  });
  return out.trim();
}

    '<button class="di" data-act="adhoc-pick" data-v="OPS-77">'+mgHTML('JI')+'<span class="mono">OPS-77</span><span class="tny amb">suggested</span></button>'+
    ['PAY-231','PAY-228','PAY-240'].map(k=>'<button class="di" data-act="adhoc-pick" data-v="'+k+'">'+mgHTML('JI')+'<span class="mono">'+k+'</span></button>').join(''));break;
  case 'adhoc-pick':S.adhoc.state=t.dataset.v;closeDD();toast('Logged 48m to <b>'+t.dataset.v+'</b>','ok');
    S.logged+=48;S.unlogged=Math.max(0,S.unlogged-48);render();break;
  case 'adhoc-keep':S.adhoc.state='local';toast('Kept local — nothing sent to Jira');render();break;
  case 'startwork':addApp('stepper',{stage:'form',i:0,timer:true});break;
  case 'new-note':newNote();break;
  case 'wl-check':{const w=appById(id);w.d.on[t.dataset.k]=!w.d.on[t.dataset.k];w.d.comment=genComment(w.d.on);render();break;}
  case 'wl-edit':{const w=appById(id);w.d.editing=!w.d.editing;render();break;}
  case 'wl-discard':{S.appended=S.appended.filter(x=>x.id!==id);toast('Draft discarded — the time stays tracked locally');render();break;}
  case 'wl-log':{const w=appById(id);const c=document.getElementById('wl-c-'+id);
    if(c)w.d.comment=c.textContent.trim();
    w.d.logged=true;
    if(w.d.target!=='__none'){
      S.worklogs[w.d.target]=S.worklogs[w.d.target]||[];
      S.worklogs[w.d.target].push({d:'today',dur:dur(w.d.mins),x:w.d.comment});
      S.logged+=w.d.mins;S.unlogged=Math.max(0,S.unlogged-w.d.mins);
      toast('Logged <b>'+dur(w.d.mins)+'</b> to '+w.d.target+' · Jira worklog created','ok');
      pushTick('<b>'+w.d.target+'</b> · worklog '+dur(w.d.mins));
    }else toast('Kept '+dur(w.d.mins)+' local — no ticket attached');
    render();break;}
  case 'sw-timer':{const w=appById(id);w.d.timer=!w.d.timer;render();break;}
  case 'sw-run':{const w=appById(id);w.d.stage='run';w.d.i=0;render();runStepper(w);break;}
  case 'drop':S.appended=S.appended.filter(x=>x.id!==id);render();break;
  case 'tb-clean':{const w=appById(id);w.d.clean=!w.d.clean;render();break;}
  case 'tb-go':{const w=appById(id);
    w.d.cfg=document.getElementById('tb-cfg').value;w.d.branch=document.getElementById('tb-branch').value;w.d.env=document.getElementById('tb-env').value;
    if(S.tcFixed){w.d.stage='run';w.d.no='#1189';toast('Triggered '+w.d.cfg+' <b>#1189</b>','ok');pushTick('<b>#1189</b> · queued · '+w.d.cfg);}
    else{w.d.stage='queued';S.pending=1;toast('Not sent — TeamCity returned <b>401</b>. Held in the write queue.','bad');}
    render();break;}
  case 'nt-go':{const w=appById(id);const s=document.getElementById('nt-sum').value.trim()||'Untitled ticket';
    const proj=document.getElementById('nt-proj').value.slice(0,3);const key=proj+'-'+(241+S.newEnts);
    w.d.done=true;w.d.key=key;w.d.summary=s;
    E[key]={k:'ticket',mg:'JI',t:s,h:'#/ticket/'+key,s:'To Do',src:'Tidewater Jira',sy:'just now',who:'mara'};
    S.status[key]='To Do';S.comments[key]=[];
    TICKETS[key]={type:document.getElementById('nt-type').value,pri:'Medium',assignee:'mara',epic:'',updated:'today 14:32',est:'—',spent:'0m',
      desc:document.getElementById('nt-desc').value||'Created from today\'s journal page.',links:[],rel:[]};
    toast('Created <b>'+key+'</b>','ok');render();break;}
  case 'np-go':{const w=appById(id);const ti=document.getElementById('np-title').value.trim()||'Untitled page';
    w.d.done=true;w.d.title=ti;const k='p'+(++S.newEnts);
    S.pages[k]={t:ti,space:'ENG',edited:'just now',by:'mara',sec:''};
    E[ti]={k:'page',mg:'CF',t:ti,h:'#/page/'+k,s:'',src:'Tidewater Wiki · ENG',sy:'just now',who:'mara'};
    toast('Created <b>ENG › '+ti+'</b>','ok');render();break;}
  case 'nr-go':{const w=appById(id);w.d.done=true;w.d.name=document.getElementById('nr-name').value.trim()||'new-repo';
    toast('Created <b>tidewater/'+w.d.name+'</b>','ok');render();break;}
  case 'git':runSlash(t.dataset.g);break;
  case 'slash-run':runSlash(t.dataset.cmd,t);break;
  case 'sync-now':toast('Syncing <b>'+id+'</b>…');setTimeout(function(){toast('<b>'+id+'</b> synced · index up to date','ok');},600);break;
  case 'sync-all':toast(S.tcFixed?'All four sources synced':'3 sources synced · TeamCity still returns 401',S.tcFixed?'ok':'bad');break;
  case 'renew':toast('Open Atlassian to mint a new token, then paste it here — the current one works until 2026-09-03');break;
  case 'snooze-pat':toast('Reminder set for 29 August','ok');break;
  case 'tc-reauth':S.reauth=true;render();setTimeout(function(){const p=document.getElementById('tc-pw');if(p){p.focus();p.select();}},60);break;
  case 'tc-test':S.reauthTested=true;render();toast('Connected to ci.tidewater.internal · adapter v0.9','ok');break;
  case 'tc-save':S.tcFixed=true;S.reauth=false;S.reauthTested=false;
    flapSet($('#syncOk'),'4 ok','f-ok');flapSet($('#syncBad'),'tc ok','f-ok');
    toast('TeamCity password saved · sync resumed','ok');pushTick('<b>TC</b> · authenticated · sync resumed');
    flushQueue();render();break;
  case 'tc-cancel':S.reauth=false;S.reauthTested=false;render();break;
  case 'add-src':S.add={type:'',url:'',auth:'',tested:false};render();break;
  case 'add-cancel':S.add=null;render();break;
  case 'add-type':S.add.type=t.dataset.t;render();break;
  case 'add-url':S.add.url=document.getElementById('as-url').value.trim();S.add.urlOk=!!S.add.url;
    if(!S.add.urlOk)toast('Enter the server URL, for example https://ci.example.com','bad');render();break;
  case 'add-auth':S.add.auth=t.dataset.m;render();break;
  case 'add-test':S.add.tested=true;toast('Connected · '+S.add.type+' adapter responded','ok');render();break;
  case 'add-save':{const s=S.add;
    S.sources.push({id:'new'+(++S.newEnts),mg:(STYPES.filter(x=>x[0]===s.type)[0]||['','NW'])[1],name:s.url.replace(/^https?:\/\//,''),
      type:s.type,url:s.url,auth:s.auth==='up'?'User + password':(s.auth==='pat'?'PAT':'API token'),authNote:'added today',
      state:'ok',sync:'never',count:'indexing…',adapter:(STYPES.filter(x=>x[0]===s.type)[0]||['','','v1.0'])[2],caps:'search'});
    S.add=null;toast('Source added · first sync started','ok');render();break;}
  case 'log-all':S.wkLogAll=true;S.unlogged=0;S.logged=S.tracked;toast('Logged 4h 45m across 2 days · 5 worklogs written to Jira','ok');render();break;
  case 'filter':{const k=t.dataset.k,v=t.dataset.v;
    if(k==='date')S.f.date=v;else if(k==='fb')S.f.fb=!S.f.fb;else{if(S.f[k][v])delete S.f[k][v];else S.f[k][v]=1;}
    S.sel=0;refreshSearch();break;}
  case 'res':{closeOverlay();go(E[id].h);break;}
  case 'res-insert':{ev.stopPropagation();closeOverlay();addApp('insert',{id:id});toast('<b>'+id+'</b> embedded in today\'s page','ok');break;}
  case 'preset':S.q='sepa retry';S.sel=0;refreshSearch();break;
  }
 }catch(e){boom(e);}
});
function runStepper(w){
  const gap=RM.matches?60:620;
  const next=function(){
    w.d.i++;
    if(w.d.i===5){S.status['PAY-240']='In Progress';}
    if(w.d.i===6){
      E['PR #145']={k:'pr',mg:'GT',t:'Payout dashboard latency',h:'#/pr/145',s:'open',src:'git.tidewater.internal',sy:'just now',who:'mara'};
      TICKETS['PAY-240'].links=['PR #145','Payments architecture overview'];TICKETS['PAY-240'].rel=['pull request','suggested page'];
      if(w.d.timer){S.timer.ctx='PAY-240';S.timer.start=Math.floor(S.clock/60);S.timer.run=true;}
      toast('PAY-240 is in progress · branch pushed, <b>PR #145</b> open','ok');
      pushTick('<b>PAY-240</b> · in progress · PR #145 open');
      render();return;
    }
    render();setTimeout(next,gap);
  };
  setTimeout(next,gap);
}
document.addEventListener('change',function(ev){
  const t=ev.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='wl-target'){const w=appById(t.dataset.id);w.d.target=t.value;render();}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='sq'){S.q=ev.target.value;S.sel=0;refreshSearch();return;}
  if(ev.target.id==='pk'){const q=ev.target.value.toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('#pklist .di'),function(b){b.style.display=b.textContent.toLowerCase().indexOf(q)>=0?'':'none';});}
});
document.addEventListener('focusout',function(ev){
  const t=ev.target;
  if(t&&t.dataset&&t.dataset.note&&S.notes[t.dataset.note]){
    S.notes[t.dataset.note].body=serialize(t);
    const sv=document.getElementById('sv-'+t.dataset.note)||document.getElementById('sv-inline');
    if(sv){sv.classList.add('on');setTimeout(function(){sv.classList.remove('on');},1600);}
  }
  if(t&&t.classList&&t.classList.contains('desc')&&t.isContentEditable){t.contentEditable='false';toast('Page saved to Confluence','ok');}
});
document.addEventListener('keydown',function(ev){
 try{
  const k=ev.key,meta=ev.metaKey||ev.ctrlKey;
  if(meta&&(k==='k'||k==='K')){ev.preventDefault();SCRIM.classList.contains('hide')?openSearch():closeOverlay();return;}
  if(meta&&(k==='t'||k==='T')){ev.preventDefault();S.timer.run?stopTimer():startTimer(S.timer.ctx||'PAY-231');return;}
  if(k==='Escape'){if(DD){closeDD();return;}if(!SCRIM.classList.contains('hide')){closeOverlay();CENTER.focus();}return;}
  if(!SCRIM.classList.contains('hide')){
    const rs=searchResults();
    if(k==='ArrowDown'){ev.preventDefault();S.sel=Math.min(rs.length-1,S.sel+1);refreshSearch();
      const n=document.querySelector('.ores.sel');if(n)n.scrollIntoView({block:'nearest'});return;}
    if(k==='ArrowUp'){ev.preventDefault();S.sel=Math.max(0,S.sel-1);refreshSearch();
      const n=document.querySelector('.ores.sel');if(n)n.scrollIntoView({block:'nearest'});return;}
    if(k==='Enter'&&rs.length){ev.preventDefault();const r=rs[S.sel];
      if(ev.shiftKey){closeOverlay();addApp('insert',{id:r.id});toast('<b>'+r.id+'</b> embedded in today\'s page','ok');}
      else{closeOverlay();go(E[r.id].h);}return;}
    return;
  }
  const t=ev.target;
  if(t&&t.dataset&&t.dataset.day){
    if(k==='/'&&!t.textContent.trim()){ev.preventDefault();slashDD(t);return;}
    if(k==='Enter'){ev.preventDefault();const v=t.textContent.trim();if(!v)return;
      t.textContent='';QUIET=true;addApp('text',{html:renderChips(esc(v))});QUIET=false;
      toast('Note added to today','ok');return;}
  }
  if(t&&t.dataset&&t.dataset.note&&k==='['&&t.textContent.slice(-1)==='['){S.pickTarget=t;setTimeout(function(){pickerDD(t,'link-confirm');},0);}
 }catch(e){boom(e);}
});

S.ticks=['<b>#1188</b> Payout_Build · step 3/5 · cargo test',
 '<b>#1187</b> Payout_IntegrationTests · FAILED · attempts == 5 (left: 6)',
 'TC · sync failed 38 min ago · <b>401 Unauthorized</b>',

 'PR #142 · 1 of 2 approvals · review requested from Jonas 09:05',
 'Jira PAT expires in <b>12 days</b>'];
renderTick();
if(!location.hash)location.hash='#/day/2026-08-22';

  S.clock++;

    flapSet($('#timerFlap'),el0(elapsed()),'f-run');$('#timerFlap').style.minWidth='44px';
    $('#timerSec').textContent=':'+String(S.clock%60).padStart(2,'0');
    const s2=document.querySelector('#streamTimer .flap');if(s2){flapSet(s2,el0(elapsed()),'f-run');s2.style.minWidth='52px';}

  const nc=document.getElementById('nowClock');if(nc)nc.textContent=hm(m);
},1000);
window.knobas=S;
