<!--
knobas mockup
paradigm: P5 Journal
design: D5 Index card
thesis: Your day is already written — activity, remote objects and your own notes land on one editable page, so logging time and writing standup is just reading back what happened.
thesis: A sage desk of printed source cards with your handwriting filed on top of them as yellow index cards, tabbed like a card drawer.
thesis: Notes pin onto entity cards — drag a note onto a card and the pin is the link.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Friday 22 August 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── tokens ───────────────────────────────────────────────────────── */
:root{
  --desk:#EEF2EC; --card:#FFFFFF; --edge:#D8E0D5; --sh:rgba(39,49,43,.10);
  --ink:#27312B; --muted:#6F7A72; --faint:#A3ACA6;
  --plum:#6B3F8A; --plum-soft:#F1EAF6; --plum-line:#DCCBE8;
  --moss:#4F7A3E; --moss-soft:#E7F0E3;
  --amber:#D9822B; --amber-soft:#FCEEDD;
  --red:#C4453A;  --red-soft:#FBE9E7;
  --note:#FFF6C2; --note-edge:#E4D68C; --note-rule:rgba(0,0,0,.06);
  --t-jira:#E4E9FF; --t-wiki:#EEE4FF; --t-git:#E1F2E4; --t-ci:#FFE9D6; --t-local:#FFF0B8;
  --rc:13px; --rk:8px;
  --fd:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --lift:0 1px 2px var(--sh), 0 6px 16px var(--sh);
  --lift-hi:0 2px 4px var(--sh), 0 12px 26px var(--sh);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:400 13.5px/1.5 var(--fb); color:var(--ink); background:var(--desk);
  background-image:radial-gradient(circle at 1px 1px, rgba(39,49,43,.05) 1px, transparent 0);
  background-size:6px 6px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--plum);text-decoration:none}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:4px}
::selection{background:var(--plum-soft)}
.mono{font-family:var(--fm)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ─── app frame ────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100%}
.titlebar{
  height:38px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(#F7FAF6,#EBF0E9);border-bottom:1px solid var(--edge);
  -webkit-user-select:none;user-select:none;
}
.lights{display:flex;gap:7px}
.lights i{width:11px;height:11px;border-radius:99px;display:block;border:1px solid rgba(0,0,0,.09)}
.lights i:nth-child(1){background:#EC6A5E}.lights i:nth-child(2){background:#F4BF4F}.lights i:nth-child(3){background:#61C554}
.wordmark{font:700 14px/1 var(--fd);letter-spacing:-.02em;margin-left:4px}
.wordmark span{color:var(--plum)}
.tb-spacer{flex:1}

/* search field in title bar */
.tb-search{
  display:flex;align-items:center;gap:8px;width:246px;height:26px;padding:0 9px;
  background:var(--card);border:1px solid var(--edge);border-radius:99px;color:var(--faint);
  transition:box-shadow .12s,border-color .12s;
}
.tb-search:hover{border-color:var(--plum-line);box-shadow:0 1px 2px var(--sh)}
.tb-search .lbl{flex:1;text-align:left;font-size:12.5px;color:var(--muted)}
kbd{
  font:500 10.5px/16px var(--fm);background:var(--desk);border:1px solid var(--edge);
  border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);display:inline-block;
}

/* persistent chips */
.chip-bar{display:flex;align-items:center;gap:8px}
.pchip{
  display:flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:99px;
  border:1px solid var(--edge);background:var(--card);font-size:12px;font-weight:500;
  box-shadow:0 1px 2px var(--sh);transition:transform .12s,box-shadow .12s;
}
.pchip:hover{transform:translateY(-1px);box-shadow:var(--lift)}
.pchip.timer{background:var(--moss-soft);border-color:#C6DCBB;color:#3C6130}
.pchip.timer.off{background:var(--card);border-color:var(--edge);color:var(--muted)}
.pchip.timer .el{font-family:var(--fm);font-weight:500;letter-spacing:-.02em}
.pchip.timer .ctx{font-family:var(--fm);font-size:11.5px;opacity:.85;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.inbox .n{
  min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--amber);color:#fff;
  font:600 11px/17px var(--fb);text-align:center;
}
.pchip.sync .dots{display:flex;gap:3px}
.pchip.sync .dots i{width:6px;height:6px;border-radius:99px;background:var(--moss);display:block}
.pchip.sync .dots i.bad{background:var(--red)}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ─── three panes ──────────────────────────────────────────────────── */
.body{flex:1;display:grid;grid-template-columns:236px minmax(0,1fr) 268px;min-height:0}
@media (max-width:1240px){.body{grid-template-columns:206px minmax(0,1fr) 238px}}

/* ─── sidebar ──────────────────────────────────────────────────────── */
.sb{
  border-right:1px solid var(--edge);background:rgba(255,255,255,.42);
  display:flex;flex-direction:column;min-height:0;
}
.sb-scroll{flex:1;overflow-y:auto;padding:14px 12px 8px}
.sb-h{
  font:600 10px/1 var(--fb);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  padding:0 4px;margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;
}
.sb-h:first-child{margin-top:0}
.sb-h button{color:var(--faint);font-size:11px}
.sb-h button:hover{color:var(--plum)}

/* month strip */
.cal{display:flex;gap:4px;padding:0 2px}
.cal button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;
  border-radius:9px;border:1px solid transparent;color:var(--muted);transition:background .12s,border-color .12s;
}
.cal button .d{font:500 9.5px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.cal button .n{font:600 14px/1 var(--fd)}
.cal button:hover{background:var(--card);border-color:var(--edge)}
.cal button[aria-current="true"]{background:var(--plum);border-color:var(--plum);color:#fff;box-shadow:var(--lift)}
.cal button[aria-current="true"] .d{color:rgba(255,255,255,.7)}
.cal button .dot{width:4px;height:4px;border-radius:99px;background:var(--plum-line);margin-top:1px}
.cal button[aria-current="true"] .dot{background:rgba(255,255,255,.6)}

/* sidebar note mini cards (draggable) */
.mininote{
  position:relative;display:block;width:100%;text-align:left;background:var(--note);
  border:1px solid var(--note-edge);border-radius:9px;padding:8px 10px 9px;margin-bottom:9px;
  box-shadow:0 1px 2px var(--sh);cursor:grab;
  background-image:repeating-linear-gradient(to bottom,transparent 0 17px,var(--note-rule) 17px 18px);
  transition:transform .14s,box-shadow .14s;
}
.mininote:hover{transform:translateY(-1px) rotate(var(--rot,0deg));box-shadow:var(--lift)}
.mininote{transform:rotate(var(--rot,0deg))}
.mininote .t{font:600 12.5px/1.3 var(--fb);display:block;margin-bottom:2px}
.mininote .m{font:400 10.5px/1.3 var(--fm);color:#8A7A3C}
.mininote.dragging{opacity:.5;cursor:grabbing}
.mininote .grip{position:absolute;top:6px;right:7px;color:#B9A758;font-size:10px;letter-spacing:1px}

/* sidebar rows */
.srow{
  display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px;border-radius:var(--rk);
  color:var(--ink);font-size:12.8px;text-align:left;transition:background .12s;
}
.srow:hover{background:var(--card);box-shadow:0 1px 2px var(--sh)}
.srow[aria-current="true"]{background:var(--plum-soft);color:var(--plum);font-weight:600}
.srow .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cnt{font:500 11px/1 var(--fm);color:var(--muted)}
.srow[aria-current="true"] .cnt{color:var(--plum)}
.srow .badge{
  font:600 9.5px/14px var(--fb);background:var(--moss-soft);color:var(--moss);
  border-radius:99px;padding:0 5px;height:14px;
}
.srow .badge.warn{background:var(--amber-soft);color:#A8611A}
.srow svg{flex:none;color:var(--faint)}
.srow[aria-current="true"] svg{color:var(--plum)}
.sb-foot{flex:none;border-top:1px solid var(--edge);padding:8px 12px 12px;background:rgba(255,255,255,.5)}

/* ─── centre / page ────────────────────────────────────────────────── */
.page{overflow-y:auto;min-height:0;padding:0 0 40px;scroll-behavior:smooth}
.page-in{max-width:790px;margin:0 auto;padding:22px 26px 0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:4px}
.eyebrow{font:500 10.5px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
h1.title{font:700 27px/1.15 var(--fd);letter-spacing:-.025em;margin:0}
h1.title .thin{font-weight:500;color:var(--muted)}
.sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.headacts{display:flex;gap:7px;flex:none;padding-bottom:3px}

/* generic controls */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;border-radius:var(--rk);
  border:1px solid var(--edge);background:var(--card);font-size:12.5px;font-weight:500;color:var(--ink);
  box-shadow:0 1px 1px var(--sh);transition:transform .12s,box-shadow .12s,background .12s,border-color .12s;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--lift);border-color:#C7D2C3}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.pri:hover{background:#7A4A9B}
.btn.moss{background:var(--moss);border-color:var(--moss);color:#fff}
.btn.moss:hover{background:#5C8C49}
.btn.sm{height:25px;padding:0 9px;font-size:11.8px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--card);border-color:var(--edge);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.danger{color:var(--red);border-color:#E9C9C5}
.inp{
  height:29px;padding:0 10px;border-radius:var(--rk);border:1px solid var(--edge);background:var(--card);
  font-size:12.8px;width:100%;
}
.inp:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
textarea.inp{height:auto;padding:8px 10px;line-height:1.5;resize:vertical}
select.inp{-webkit-appearance:none;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px;background-repeat:no-repeat}
label.fl{display:block;font:600 10.5px/1 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ─── the day spine + stream ───────────────────────────────────────── */
.stream{margin-top:20px}
.blk{display:grid;grid-template-columns:64px 22px minmax(0,1fr);align-items:stretch}
.blk .gut{padding-top:2px;text-align:right;padding-right:10px}
.blk .gut .t{font:500 12px/1.2 var(--fm);color:var(--ink);letter-spacing:-.02em}
.blk .gut .dur{font:400 10.5px/1.4 var(--fm);color:var(--faint);display:block;margin-top:2px}
.blk .gut .mode{font:500 9px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-top:5px}
.blk .spine{position:relative;display:flex;justify-content:center}
.blk .spine .rail{width:5px;border-radius:99px;margin:4px 0 0;flex:1;background:var(--plum-line);opacity:.55}
.blk.passive .spine .rail{background-image:repeating-linear-gradient(135deg,rgba(107,63,138,.30) 0 3px,rgba(107,63,138,.08) 3px 6px);background-color:transparent;opacity:1}
.blk.manual .spine .rail{background:var(--moss);opacity:.75}
.blk.unattr .spine .rail{background-image:repeating-linear-gradient(135deg,rgba(217,130,43,.55) 0 3px,rgba(217,130,43,.12) 3px 6px);background-color:transparent;opacity:1}
.blk .spine .knot{
  position:absolute;top:2px;width:11px;height:11px;border-radius:99px;background:var(--card);
  border:2px solid var(--plum-line);
}
.blk.manual .spine .knot{border-color:var(--moss)}
.blk.unattr .spine .knot{border-color:var(--amber)}
.blk.live .spine .knot{border-color:var(--moss);background:var(--moss);box-shadow:0 0 0 4px var(--moss-soft)}
.blk .content{padding:0 0 22px 14px;min-width:0}
.blk-label{font:600 12.5px/1 var(--fb);color:var(--muted);margin:1px 0 10px;display:flex;align-items:center;gap:8px}
.blk-label .tag{
  font:500 9.5px/15px var(--fb);letter-spacing:.08em;text-transform:uppercase;padding:0 6px;height:15px;
  border-radius:99px;background:var(--plum-soft);color:var(--plum);
}
.blk.manual .blk-label .tag{background:var(--moss-soft);color:var(--moss)}
.blk.unattr .blk-label .tag{background:var(--amber-soft);color:#A8611A}

/* gap rule */
.gap{display:grid;grid-template-columns:64px 22px minmax(0,1fr);margin-bottom:22px}
.gap .gut{text-align:right;padding-right:10px;font:400 11px/1 var(--fm);color:var(--faint);padding-top:1px}
.gap .line{grid-column:2/4;margin-left:8px;border-top:1px dashed #C6D0C3;position:relative}
.gap .line span{position:absolute;top:-8px;left:12px;background:var(--desk);padding:0 8px;font-size:11px;color:var(--faint)}

/* ─── cards ────────────────────────────────────────────────────────── */
.cw{position:relative;margin:0 0 12px}
.cw.pinned{padding-bottom:0}
.card{
  position:relative;background:var(--card);border:1px solid var(--edge);border-radius:var(--rc);
  box-shadow:var(--lift);margin-top:11px;transition:transform .12s,box-shadow .12s,border-color .12s;
}
.card.flat{box-shadow:0 1px 2px var(--sh)}
.card.hoverable:hover{transform:translateY(-1px);box-shadow:var(--lift-hi);border-color:#C7D2C3}
.card.sel{border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft),var(--lift)}
.srctab{
  position:absolute;top:-11px;left:15px;height:19px;padding:0 9px;border-radius:7px 7px 0 0;
  border:1px solid var(--edge);border-bottom:none;
  font:600 9.5px/18px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:#4A544D;
}
.srctab.jira{background:var(--t-jira);border-color:#CBD5F5}
.srctab.wiki{background:var(--t-wiki);border-color:#DAC9EC}
.srctab.git{background:var(--t-git);border-color:#C6E0CB}
.srctab.ci{background:var(--t-ci);border-color:#F2D5B7}
.srctab.local{background:var(--t-local);border-color:var(--note-edge)}
.card-b{padding:15px 17px 15px}
.card-b.tight{padding:12px 15px}
.card-hd{display:flex;align-items:flex-start;gap:11px}
.card-hd .grow{flex:1;min-width:0}
.ekey{font:500 12px/1 var(--fm);color:var(--plum);letter-spacing:-.02em}
.ekey.muted{color:var(--muted)}
.etitle{font:600 15px/1.32 var(--fd);letter-spacing:-.012em;margin:5px 0 0;display:block;text-align:left}
a.etitle:hover,button.etitle:hover{color:var(--plum)}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:11.8px;color:var(--muted)}
.meta .dotsep{color:var(--faint)}

/* chips */
.chip{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:99px;
  font:500 11.2px/1 var(--fb);background:var(--desk);color:var(--muted);border:1px solid transparent;white-space:nowrap;
}
.chip.plum{background:var(--plum-soft);color:var(--plum)}
.chip.moss{background:var(--moss-soft);color:var(--moss)}
.chip.amber{background:var(--amber-soft);color:#A8611A}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.out{background:var(--card);border-color:var(--edge);color:var(--muted)}
.chip .sq{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.75}
button.chip{transition:box-shadow .12s,transform .12s}
button.chip:hover{box-shadow:0 1px 3px var(--sh);transform:translateY(-1px)}
.chip.prio-high::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--red)}
.chip.prio-med::before{content:"";width:7px;height:2px;background:var(--amber)}
.chip.prio-low::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--faint)}

/* status select rendered as a chip */
.statuswrap{position:relative;flex:none}
.menu{
  position:absolute;z-index:60;top:calc(100% + 6px);right:0;min-width:184px;background:var(--card);
  border:1px solid var(--edge);border-radius:11px;box-shadow:var(--lift-hi);padding:5px;
}
.menu.left{right:auto;left:0}
.menu button{
  display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 9px;border-radius:7px;
  font-size:12.6px;text-align:left;color:var(--ink);
}
.menu button:hover{background:var(--plum-soft);color:var(--plum)}
.menu button .k{margin-left:auto;font:400 10.5px/1 var(--fm);color:var(--faint)}
.menu .mh{font:600 9.5px/1 var(--fb);letter-spacing:.11em;text-transform:uppercase;color:var(--faint);padding:8px 9px 6px}
.menu hr{border:none;border-top:1px solid var(--edge);margin:5px 4px}

/* saved-to-source confirmation */
.saved{
  display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--fb);color:var(--moss);
  animation:fadein .2s ease-out;
}
@keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

/* event lines (not cards) */
.evt{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:5px 8px 5px 6px;
  border-radius:7px;color:var(--ink);font-size:12.8px;transition:background .12s;
}
.evt:hover{background:rgba(255,255,255,.75)}
.evt .et{font:400 11px/1.5 var(--fm);color:var(--faint);flex:none;width:38px}
.evt .ei{flex:none;width:15px;display:flex;justify-content:center;color:var(--muted);align-self:center}
.evt .ex{flex:1;min-width:0}
.evt .ex b{font-weight:600}
.evt .ex .hash{font-family:var(--fm);font-size:11.6px;color:var(--plum)}
.evt.incoming{background:linear-gradient(90deg,rgba(252,238,221,.75),rgba(252,238,221,0) 78%);border-left:2px solid var(--amber);border-radius:0 7px 7px 0;padding-left:8px}
.evt .acts{display:flex;gap:5px;opacity:0;transition:opacity .12s;flex:none}
.evt:hover .acts,.evt:focus-within .acts{opacity:1}

/* suggested link ghost */
.ghost{
  display:flex;align-items:center;gap:10px;margin:2px 0 10px;padding:9px 12px;border-radius:11px;
  border:1px dashed var(--plum-line);background:rgba(241,234,246,.5);font-size:12.4px;color:var(--muted);
}
.ghost .gx{flex:1;min-width:0}
.ghost b{color:var(--ink);font-weight:600}
.ghost .why{font-style:italic;color:var(--plum);opacity:.9}
.ghost .acts{display:flex;gap:6px;flex:none}

/* ─── the note index card (signature) ──────────────────────────────── */
.note{
  position:relative;background:var(--note);border:1px solid var(--note-edge);border-radius:10px;
  padding:15px 16px 14px;box-shadow:0 1px 2px var(--sh),0 7px 18px var(--sh);
  transform:rotate(var(--rot,-1deg));transition:transform .14s,box-shadow .14s;
}
.note:hover{box-shadow:0 2px 5px var(--sh),0 14px 30px var(--sh)}
.note.drop{animation:pindrop .2s cubic-bezier(.2,1.4,.5,1)}
@keyframes pindrop{0%{transform:rotate(var(--rot,-1deg)) scale(1.12) translateY(-8px)}100%{transform:rotate(var(--rot,-1deg)) scale(1)}}
.note .pin{position:absolute;top:-9px;left:50%;margin-left:-9px}

/* ─── day strip ────────────────────────────────────────────────────── */
.daystrip{margin:18px 0 4px}

}

}

.rp-lnk .rs{font:400 10px/1 var(--fm);color:var(--faint);flex:none}

.tline{display:flex;justify-content:space-between;align-items:baseline;font-size:12.3px;padding:3px 0}

}

}

  border-radius:7px;padding:4px 10px;font:700 12px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;
  opacity:.9;animation:stampin .22s cubic-bezier(.2,1.5,.4,1);
}
@keyframes stampin{0%{transform:rotate(-9deg) scale(1.7);opacity:0}100%{transform:rotate(-9deg) scale(1);opacity:.9}}

.step{display:flex;gap:11px;padding:8px 0;align-items:flex-start}

  flex:none;width:19px;height:19px;border-radius:99px;border:2px solid var(--edge);background:var(--card);
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}

.step .sx{flex:1;min-width:0;font-size:12.9px}
.step .sx .sm{font-size:11.6px;color:var(--muted);margin-top:1px}

.composer{display:grid;grid-template-columns:64px 22px minmax(0,1fr);margin-top:2px}

}

.ov-hd{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 13px;border-bottom:1px solid var(--edge)}

    '<h4 style="font:600 10.5px/1 var(--fb);letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 4px">Activity in the interval</h4>'+

function renderItem(it){
  switch(it.k){
    case 'ent':
      var e=E[it.id];
      if(!e) return '';
      if(e.kind==='build') return buildCard(it.id);
      if(e.kind==='note') return '<div class="cw">'+noteCard(it.id,false)+'</div>';
      if(e.kind==='ticket') return ticketCard(it.id,it.pin);
      return genericCard(it.id);
    case 'evt': return evtLine(it);
    case 'sug': return suggestGhost(it.id);

function route(){
  var h=location.hash||'#/day/2026-08-22';
  var p=h.replace(/^#\//,'').split('/');
  if(p[0]==='day')     return {kind:'day',arg:p[1]||'2026-08-22'};
  if(p[0]==='entity')  return {kind:'entity',arg:p[1]};
  if(p[0]==='note')    return {kind:'note',arg:p[1]};
  if(p[0]==='list')    return {kind:'list',arg:p[1]};
  if(p[0]==='sources') return {kind:'sources'};
  if(p[0]==='inbox')   return {kind:'inbox'};
  if(p[0]==='timesheet')return{kind:'timesheet'};
  return {kind:'day',arg:'2026-08-22'};
}
function render(){
  var r=route(),html;
  try{
    if(r.kind==='day')      html=renderDay(r.arg);
    else if(r.kind==='entity') html=renderEntity(r.arg);
    else if(r.kind==='note')   html=renderNote(r.arg);
    else if(r.kind==='list')   html=renderList(r.arg);
    else if(r.kind==='sources')html=renderSources();
    else if(r.kind==='inbox')  html=renderInbox();
    else html=renderTimesheet();
  }catch(err){
    html='<div class="page-in"><h1 class="title">Something broke</h1><div class="emptyish" style="margin-top:14px">'+esc(err.message)+'</div></div>';
    $('#errsink').textContent='JS-ERROR: '+err.message+' | '+err.stack;
  }
  $('#page').innerHTML=html;
  renderSidebar(); renderRight(); renderChips();
  $$('.note[data-note]').forEach(function(n){n.draggable=true;});
  if(S.focusComposer){var c=$('#composer'); if(c){c.focus();c.setSelectionRange(c.value.length,c.value.length);}}
  if(S.scrollTo){var t=document.getElementById(S.scrollTo); if(t)t.scrollIntoView({block:'center'}); S.scrollTo=null;}
}

function toast(msg,kind,undo){

  t.className='toast'+(kind==='warn'?' warn':'');

  var rest=w.checks.filter(function(c){return c.on&&!c.commit;}).map(function(c){return c.short;});
  var parts=[];
  if(commits.length) parts.push('Backoff jitter ('+commits.join(', ')+')');
  parts=parts.concat(rest);
  w.comment=parts.length?parts.join('; ')+'.':'No activity selected for this interval.';

      sync:'first sync running',count:'indexing…',v:'adapter v1.2',caps:['search','write'],src:'git'});
    S.adding=false; render(); toast('<b>'+esc(name)+'</b> added · first sync running.');
  },

/* ══ 14. pin (drag or picker) ═════════════════════════════════════════ */
function pinNote(noteId,entityId){
  var n=E[noteId],e=E[entityId];
  if(!n||!e)return;
  if(n.links.indexOf(entityId)<0)n.links.push(entityId);
  if(n.wl.indexOf(e.key)<0)n.wl.push(e.key);
  if(e.links&&e.links.indexOf(noteId)<0)e.links.push(noteId);
  S.blocks.forEach(function(b){(b.items||[]).forEach(function(it){if(it.k==='ent'&&it.id===entityId)it.pin=noteId;});});
  S.justPinned=noteId; render();
  var el=document.querySelector('.note[data-note="'+noteId+'"]');
  if(el)el.classList.add('drop');
  flash(entityId,'linked');
  toast('<b>'+esc(n.title)+'</b> pinned on <b>'+esc(e.key)+'</b> — the pin is the link.');
}

/* ══ 15. events ═══════════════════════════════════════════════════════ */
document.addEventListener('click',function(ev){
  var a=ev.target.closest('[data-act]');
  if(a){
    var f=ACT[a.dataset.act];
    if(f){ if(a.dataset.act!=='closeov'||ev.target===a){ ev.preventDefault(); f(a); } return; }
  }
  var n=ev.target.closest('[data-nav]');
  if(n){ev.preventDefault();location.hash=n.dataset.nav;return;}
  if(!ev.target.closest('.menu'))closeMenu();
},false);
document.addEventListener('change',function(ev){
  var a=ev.target.closest('[data-act]');
  if(a&&(a.dataset.act==='wlcheck'||a.dataset.act==='wltarget')){ACT[a.dataset.act](a);}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){S.q=t.value;var f=$('.ov-main'),sel=t.selectionStart;openOv(searchOverlay());var q2=$('#q');if(q2){q2.focus();q2.setSelectionRange(sel,sel);}return;}
  if(t.id==='pq'){S.pq=t.value;var s2=t.selectionStart;openOv(pickerOverlay(t.closest('.ov').querySelector('[data-mode]')?
    t.closest('.ov').querySelector('[data-mode]').dataset.mode:'link',
    t.closest('.ov').querySelector('[data-src]')?t.closest('.ov').querySelector('[data-src]').dataset.src:'PAY-231'));
    var p2=$('#pq');if(p2){p2.focus();p2.setSelectionRange(s2,s2);}return;}
  if(t.id==='composer'){
    S.composer=t.value;
    $('#slashmenu').innerHTML=(t.value.charAt(0)==='/')?slashMenu(t.value):'';
  }
  var w=t.closest('[data-act="wlcomment"]');
  if(w)ACT.wlcomment(t);
});
document.addEventListener('keydown',function(ev){
  var mod=ev.metaKey||ev.ctrlKey;
  if(mod&&(ev.key==='k'||ev.key==='K')){ev.preventDefault();openSearch();return;}
  if(mod&&(ev.key==='t'||ev.key==='T')){ev.preventDefault();ACT.timertoggle();return;}
  if(ev.key==='Escape'){
    if($('#overlay').innerHTML){closeOv();return;}
    if($('#menu')){closeMenu();return;}
    var c=$('#composer'); if(c&&document.activeElement===c){c.value='';S.composer='';$('#slashmenu').innerHTML='';c.blur();}
    return;
  }
  if(ev.key==='Enter'){
    var t=ev.target;
    if(t.id==='q'){var first=$('.res'); if(first){ev.preventDefault(); if(ev.shiftKey)ACT.insertres(first);else ACT.openres(first);} return;}
    if(t.id==='pq'){var p=$('.ov-body .res'); if(p){ev.preventDefault();ACT.dopick(p);} return;}
    if(t.id==='composer'){
      ev.preventDefault();
      var v=t.value.trim(); if(!v)return;
      if(v.charAt(0)==='/'){
        var m=$('#slashmenu [data-first]')||$('#slashmenu button');
        t.value='';S.composer='';$('#slashmenu').innerHTML='';
        if(m)ACT[m.dataset.act](m);
        return;
      }
      S.extra.push({k:'text',t:'14:32',x:v,rot:(Math.random()*2.6-1.3).toFixed(1)+'deg'});
      t.value='';S.composer='';S.focusComposer=true;S.scrollTo='b6';render();S.focusComposer=false;
      toast('Filed on today’s page at 14:32.');
      return;
    }
    if(t.tagName==='INPUT'&&t.id&&t.id.indexOf('cmt-')===0){
      var btn=document.querySelector('[data-act="addcomment"][data-id="'+t.id.slice(4)+'"]');
      if(btn){ev.preventDefault();ACT.addcomment(btn);}
    }
    if(t.id==='tcpw'){ev.preventDefault();ACT.savepw();}
  }
});
/* drag a note onto a card to pin (= link) it */
document.addEventListener('dragstart',function(ev){
  var n=ev.target.closest('[data-note]');
  if(!n)return;
  S.dragNote=n.dataset.note;
  n.classList.add('dragging');
  try{ev.dataTransfer.setData('text/plain',n.dataset.note);ev.dataTransfer.effectAllowed='link';}catch(e){}
});
document.addEventListener('dragend',function(ev){
  $$('.dragging').forEach(function(e){e.classList.remove('dragging');});
  $$('.dropok').forEach(function(e){e.classList.remove('dropok');});
  S.dragNote=null;
});
document.addEventListener('dragover',function(ev){
  var d=ev.target.closest('[data-drop]');
  if(!d||!S.dragNote||d.dataset.drop==='note')return;
  ev.preventDefault();
  try{ev.dataTransfer.dropEffect='link';}catch(e){}
  var cw=d.closest('.cw'); if(cw&&!cw.classList.contains('dropok')){
    $$('.dropok').forEach(function(e){e.classList.remove('dropok');});
    cw.classList.add('dropok');
  }
});
document.addEventListener('drop',function(ev){
  var d=ev.target.closest('[data-drop]');
  if(!d||!S.dragNote||d.dataset.drop==='note')return;
  ev.preventDefault();
  var note=S.dragNote; S.dragNote=null;
  $$('.dropok').forEach(function(e){e.classList.remove('dropok');});
  pinNote(note,d.dataset.drop);
});
