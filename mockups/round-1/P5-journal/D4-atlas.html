<!DOCTYPE html>
<!--
knobas mockup
paradigm: P5 Journal
design: D4 Atlas
thesis: your day is one editable document — activity, notes and live remote blocks share a single time axis, and editing a block edits the remote object
thesis: a navigator's night atlas — indigo ground, contour hairlines, parchment type, gold for the running clock and teal for every confirmed route
thesis: the time gutter is a route line — typed waypoints down the day, and the same route drawn horizontally as an itinerary with legs in the header
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Friday 22 August 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A2C; --panel:#182238; --raised:#1F2B45; --hair:#27344F;
  --ink:#EAE4D3; --muted:#A5AEC2; --faint:#6C778F;
  --gold:#D4A857; --teal:#3FB8AF; --coral:#E2735B; --green:#8CC8A0;
  --r:3px;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 var(--sans); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* contour lines — a chart under glass */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.9;
  background:
    repeating-radial-gradient(circle at 14% 22%, transparent 0 26px, rgba(63,184,175,.055) 26px 27px, transparent 27px 53px),
    repeating-radial-gradient(circle at 82% 74%, transparent 0 33px, rgba(212,168,87,.05) 33px 34px, transparent 34px 67px),
    repeating-radial-gradient(circle at 55% 8%, transparent 0 44px, rgba(234,228,211,.028) 44px 45px, transparent 45px 89px);
}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--teal);text-decoration:none}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:2px}
::selection{background:rgba(212,168,87,.28)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#243252;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

.sc{font-family:var(--serif); font-variant-caps:small-caps; font-feature-settings:"smcp" 1,"c2sc" 0; letter-spacing:.055em}
.mono{font-family:var(--mono); font-variant-ligatures:none}
.eyebrow{font-family:var(--serif); font-variant-caps:small-caps; font-feature-settings:"smcp" 1; letter-spacing:.09em; font-size:13px; color:var(--faint); font-weight:500}

/* ── shell ─────────────────────────────────────────── */
#app{position:relative; z-index:1; height:100vh; width:100vw; overflow:hidden; display:grid; grid-template-rows:46px minmax(0,1fr) 25px; grid-template-columns:minmax(0,1fr)}
.strip{
  display:flex; align-items:center; gap:14px; padding:0 12px 0 14px;
  background:linear-gradient(180deg,#1a2540,#161f36); border-bottom:1px solid var(--hair);
}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.brand .name{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--ink)}
.compass{flex:0 0 auto}
.compass .needle{transform-origin:15px 15px; transition:transform .5s cubic-bezier(.2,.8,.2,1)}

/* itinerary — the signature, horizontally */
.itin{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:0; overflow:hidden}
.itin .leg{display:flex;align-items:center;gap:0;min-width:0}
.itin .stop{
  display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:var(--r);
  color:var(--muted); font-size:12.5px; white-space:nowrap; max-width:210px; overflow:hidden; text-overflow:ellipsis;
}
.itin .stop:hover{background:var(--raised);color:var(--ink)}
.itin .stop.here{color:var(--ink)}
.itin .stop.here .wp{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,87,.16)}
.itin .wp{width:7px;height:7px;border-radius:50%;border:1px solid var(--teal);background:var(--panel);flex:0 0 auto}
.itin .path{display:flex;align-items:center;gap:5px;padding:0 2px;color:var(--faint)}
.itin .path .dash{width:26px;height:1px;background:repeating-linear-gradient(90deg,var(--hair) 0 4px,transparent 4px 8px)}
.itin .path .legtime{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.strip .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
@media (max-width:1300px){#searchBtn span:not(.kbd){display:none} #syncLabel{display:none}}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--hair);border-radius:var(--r);padding:2px 5px;background:rgba(0,0,0,.18)}
.tbtn{display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--hair);border-radius:var(--r);color:var(--muted);font-size:12.5px;background:rgba(0,0,0,.14)}
.tbtn:hover{border-color:#33456b;color:var(--ink)}

/* timer */
#timerBtn{border-color:rgba(212,168,87,.42);background:rgba(212,168,87,.09);color:var(--ink)}
#timerBtn.idle{border-color:var(--hair);background:rgba(0,0,0,.14);color:var(--muted)}
#timerBtn .dial{flex:0 0 auto}
#timerBtn .el{font-family:var(--mono);font-size:12.5px;color:var(--gold);font-weight:500}
#timerBtn.idle .el{color:var(--faint)}
#timerBtn .ctx{font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.35}}
.running .pulse{animation:tick 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.running .pulse{animation:none}}

/* inbox + sync pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.count{font-family:var(--mono);font-size:11px;background:var(--gold);color:#16203a;border-radius:9px;padding:0 6px;font-weight:500;line-height:17px;min-width:19px;text-align:center}
.count.zero{background:var(--hair);color:var(--faint)}
.syncdots{display:flex;gap:3px;align-items:center}
.syncdots i{width:6px;height:6px;border-radius:50%;background:var(--green);display:block}
.syncdots i.bad{background:var(--coral)}

/* ── columns ───────────────────────────────────────── */
.cols{display:grid; grid-template-columns:236px minmax(0,1fr) 300px; min-height:0; min-width:0}
.pane{min-height:0; overflow-y:auto; overflow-x:hidden}
.left{background:var(--panel);border-right:1px solid var(--hair);padding:12px 0 26px}
.right{background:var(--panel);border-left:1px solid var(--hair);padding:14px 0 26px}
.doc{background:transparent;padding:0 0 60px}
@media (max-width:1240px){ .cols{grid-template-columns:206px minmax(0,1fr) 268px} }

/* left */
.sec{padding:0 12px; margin-bottom:20px}
.sec h3{margin:0 0 7px; font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px}
.cal .dow{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-align:center;padding-bottom:3px}
.cal button{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding:5px 0;border-radius:var(--r)}
.cal button:hover{background:var(--raised);color:var(--ink)}
.cal button.on{background:rgba(212,168,87,.16);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(212,168,87,.4)}
.cal button.mute{color:#4d5871}
.cal button.dot{position:relative}
.cal button.dot::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--teal)}
.navlist{display:flex;flex-direction:column;gap:1px}
.navrow{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 9px;border-radius:var(--r);color:var(--muted);font-size:13px;border-left:2px solid transparent;line-height:1.35}
.navrow:hover{background:var(--raised);color:var(--ink)}
.navrow.on{background:var(--raised);color:var(--ink);border-left-color:var(--gold)}
.navrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.navrow.on .n,.navrow:hover .n{color:var(--muted)}
.navrow .n.warn{color:var(--gold)}
.navrow .sub{font-family:var(--mono);font-size:10px;color:var(--faint);display:block}
.leftfoot{border-top:1px solid var(--hair);margin:0 0 0;padding:10px 12px 0}

/* document */
.docwrap{max-width:820px;margin:0 auto;padding:22px 30px 0}
.pagehead{border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:6px}
.pagehead h1{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.15;margin:2px 0 4px;letter-spacing:.005em}
.pagehead .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--faint);font-size:12.5px}
.srcmark{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px}
.srcmark .sc{font-size:12.5px;color:var(--muted)}

/* day stream — the vertical route */
.entry{display:grid;grid-template-columns:56px 18px minmax(0,1fr);align-items:stretch;position:relative}
.entry .t{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding:9px 8px 0 0;text-align:right;white-space:nowrap}
.entry .rail{position:relative}
.entry .rail::before{content:'';position:absolute;left:8px;top:0;bottom:0;border-left:1px dashed #35476a}
.entry:first-of-type .rail::before{top:12px}
.entry:last-of-type .rail::before{bottom:auto;height:14px}
.entry .wp{position:absolute;left:4px;top:13px;width:9px;height:9px;border-radius:50%;border:1px solid #8592ab;background:var(--bg);z-index:1}
.entry .body{padding:7px 0 9px 6px;min-width:0}
.entry.tk .rail::before{border-left:1px solid rgba(63,184,175,.34)}
.entry.tk .wp{border-color:rgba(63,184,175,.8)}
.entry.tracked .rail::before{border-left:1px solid rgba(212,168,87,.5)}
.entry.tracked .wp{border-color:var(--gold)}
.entry.note .wp{border-color:var(--gold);background:var(--gold);width:8px;height:8px;border-radius:1px;transform:rotate(45deg);left:4.5px}
.entry.fail .wp{border-color:var(--coral);background:var(--coral)}
.entry.gap .rail::before{border-left:1px dotted #3a4c70}
.entry.gap .wp{display:none}
.entry.unattr .wp{border-style:dashed;border-color:var(--muted);background:var(--panel)}
.entry.live .rail::before{border-left:1px solid var(--gold)}
.entry.live .wp{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px rgba(212,168,87,.15)}
.entry.sel .body{box-shadow:-3px 0 0 var(--gold)}
.entry:hover .t{color:var(--muted)}

.line{color:var(--muted);font-size:13.5px}
.line .who{color:var(--ink)}
.line b{font-weight:600;color:var(--ink)}
.dur{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--hair);border-radius:2px;padding:0 4px;margin-left:6px;white-space:nowrap}
.dur.manual{border-color:rgba(212,168,87,.4);color:var(--gold)}
.notetext{color:var(--ink);font-size:15px;line-height:1.65}
.notetext em{color:var(--muted)}

/* blocks */
.block{border:1px solid var(--hair);border-radius:var(--r);background:rgba(24,34,56,.66);margin:2px 0 4px}
.block.flat{background:transparent;border-color:transparent;margin:0}
.bhead{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer}
.bhead:hover{background:rgba(31,43,69,.5)}
.bhead .title{flex:1;min-width:0;font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbody{padding:2px 12px 12px;border-top:1px solid var(--hair)}
.tw{width:9px;flex:0 0 auto;color:var(--faint);font-size:9px;transition:transform .15s}
.open .tw{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.tw{transition:none}}
.ghost{border:1px dashed rgba(63,184,175,.45);background:rgba(63,184,175,.045)}
.hl{background:rgba(212,168,87,.07);border-color:rgba(212,168,87,.35)}
.fl{background:rgba(226,115,91,.06);border-color:rgba(226,115,91,.34)}

/* chips + buttons */
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);border-radius:var(--r);padding:1px 7px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.14);white-space:nowrap}
.chip:hover{border-color:rgba(63,184,175,.5);color:var(--ink)}
.chip .k{font-family:var(--mono);font-size:11.5px;color:var(--teal)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.st{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:1px 6px;border-radius:2px;border:1px solid var(--hair);color:var(--muted);white-space:nowrap}
.st.prog{color:var(--gold);border-color:rgba(212,168,87,.45)}
.st.rev{color:var(--teal);border-color:rgba(63,184,175,.45)}
.st.done{color:var(--green);border-color:rgba(140,200,160,.4)}
.st.todo{color:var(--muted)}
.st.failed{color:var(--coral);border-color:rgba(226,115,91,.5)}
.st.run{color:var(--gold);border-color:rgba(212,168,87,.45)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:var(--r);padding:4px 10px;font-size:12.5px;color:var(--muted);background:rgba(0,0,0,.16)}
.btn:hover{border-color:#3a4d75;color:var(--ink);background:var(--raised)}
.btn.gold{border-color:rgba(212,168,87,.55);color:var(--gold)}
.btn.gold:hover{background:rgba(212,168,87,.13);border-color:var(--gold)}
.btn.teal{border-color:rgba(63,184,175,.5);color:var(--teal)}
.btn.teal:hover{background:rgba(63,184,175,.12)}
.btn.danger:hover{border-color:var(--coral);color:var(--coral);background:rgba(226,115,91,.09)}
.btn[disabled]{opacity:.42;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:14px}
.hr{height:1px;background:var(--hair);margin:14px 0}
.dl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:5px 12px;font-size:13px}
.dl dt{color:var(--faint);font-family:var(--serif);font-variant-caps:small-caps;font-feature-settings:"smcp" 1;letter-spacing:.06em;font-size:14px}
.dl dd{margin:0;color:var(--ink)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.gold{color:var(--gold)}.teal{color:var(--teal)}.coral{color:var(--coral)}.green{color:var(--green)}

/* inputs */
input[type=text],input[type=password],input[type=time],select,textarea{
  background:rgba(0,0,0,.24);border:1px solid var(--hair);border-radius:var(--r);
  padding:6px 9px;color:var(--ink);width:100%;font-size:13px;
}
input:focus,select:focus,textarea:focus{border-color:rgba(212,168,87,.6);outline:none;box-shadow:0 0 0 2px rgba(212,168,87,.14)}
textarea{resize:vertical;line-height:1.6;font-family:var(--sans)}
label.fl2{display:block;margin-bottom:9px}
label.fl2 span{display:block;font-size:11.5px;color:var(--faint);margin-bottom:3px;font-family:var(--serif);font-variant-caps:small-caps;font-feature-settings:"smcp" 1;letter-spacing:.06em}
.cb{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13px;color:var(--muted);cursor:pointer}
.cb input{margin:4px 0 0;accent-color:var(--gold);width:auto}
.cb.on{color:var(--ink)}

/* editor line */
.editor{display:grid;grid-template-columns:56px 18px minmax(0,1fr);margin-top:2px}
.editor .rail{position:relative}
.editor .rail::before{content:'';position:absolute;left:8px;top:0;height:14px;border-left:1px dashed var(--hair)}
.editor .field{padding:7px 0 0 6px}
#composer{border-color:transparent;background:transparent;padding-left:0;font-size:15px;color:var(--ink)}
#composer::placeholder{color:var(--faint)}
#composer:focus{border-color:var(--hair);background:rgba(0,0,0,.2);padding-left:9px}

/* right pane */
.rsec{padding:0 14px 16px}
.rsec + .rsec{border-top:1px solid var(--hair);padding-top:14px}
.rsec h3{margin:0 0 9px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.rrail{position:relative;padding-left:18px}
.rrail::before{content:'';position:absolute;left:4px;top:8px;bottom:10px;border-left:1px dashed rgba(63,184,175,.5)}
.rrail.sugg::before{border-left-color:rgba(63,184,175,.3)}
.rstop{position:relative;display:block;width:100%;padding:4px 4px 4px 2px;border-radius:var(--r);color:var(--muted);font-size:12.5px;line-height:1.35}
.rstop:hover{background:var(--raised);color:var(--ink)}
.rstop::before{content:'';position:absolute;left:-18px;top:9px;width:9px;height:9px;border-radius:50%;border:1px solid var(--teal);background:var(--panel)}
.rstop.here::before{background:var(--gold);border-color:var(--gold)}
.rstop.bad::before{background:var(--coral);border-color:var(--coral)}
.rstop.sug::before{border-style:dashed;opacity:.6}
.rstop .k{font-family:var(--mono);font-size:11.5px;color:var(--teal);margin-right:5px}
.rstop.here .k{color:var(--gold)}
.rstop .d{display:block;color:var(--faint);font-size:11.5px}
.tot{display:flex;align-items:baseline;justify-content:space-between;padding:3px 0;font-size:12.5px;color:var(--muted)}
.tot b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:13px}
.bar{height:5px;background:var(--raised);border-radius:3px;overflow:hidden;margin:5px 0 2px;display:flex}
.bar i{display:block;height:100%}

/* route strip svg */
.routebox{border:1px solid var(--hair);border-radius:var(--r);background:rgba(0,0,0,.18);padding:6px 4px 2px;margin:4px 0 2px;overflow:hidden}
.routebox svg{display:block;width:100%;height:auto}
.rlabel{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.rlabel.cur{fill:var(--gold)}
.rsub{font-family:var(--sans);font-size:9.5px;fill:#6C778F}
.rpath{stroke:var(--teal);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.rpath.prop{opacity:.5}
.rpath.draw{stroke-dashoffset:60;animation:draw .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.rpath.draw{animation:none;stroke-dashoffset:0}}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(9,14,26,.68);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding-top:8vh}
.scrim[hidden]{display:none}
.sheet{width:min(760px,92vw);max-height:78vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 24px 70px rgba(0,0,0,.55)}
.sheet header{padding:11px 14px;border-bottom:1px solid var(--hair)}
.sheet .scroll{overflow-y:auto;padding:6px 0 10px}
#q{font-family:var(--mono);font-size:16px;border:0;background:transparent;padding:2px 0}
#q:focus{box-shadow:none}
.res{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;padding:8px 14px;align-items:baseline;border-left:2px solid transparent;width:100%}
.res:hover,.res.cur{background:var(--raised);border-left-color:var(--gold)}
.res .ttl{font-size:13.5px;color:var(--ink)}
.res .snip{font-size:12px;color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rt{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right;white-space:nowrap}
.pop{position:absolute;z-index:50;background:var(--raised);border:1px solid var(--hair);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.5);padding:6px;min-width:230px}
.pop[hidden]{display:none}
.pop button.item{display:flex;width:100%;gap:8px;align-items:center;padding:6px 8px;border-radius:2px;font-size:13px;color:var(--muted)}
.pop button.item:hover,.pop button.item.cur{background:rgba(212,168,87,.14);color:var(--ink)}
.pop .item .hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.pop h4{margin:4px 8px 5px;font-size:12.5px}

#toasts{position:fixed;right:16px;bottom:34px;z-index:60;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.toast{background:var(--raised);border:1px solid var(--hair);border-left:2px solid var(--teal);border-radius:var(--r);padding:8px 12px;font-size:12.5px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:340px;animation:rise .18s ease-out}
.toast.gold{border-left-color:var(--gold)}
.toast.bad{border-left-color:var(--coral)}
.toast .sub{color:var(--faint);font-size:11.5px;display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

.status{display:flex;align-items:center;gap:14px;padding:0 12px;background:#141d33;border-top:1px solid var(--hair);font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden}
.status span{flex:0 0 auto}
@media (max-width:1300px){.status .opt{display:none}}
.status .dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
.status .dot.bad{background:var(--coral)}
#errbox{display:none}
.stepper{list-style:none;margin:0;padding:0}
.stepper li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(39,52,79,.55);font-size:13px;color:var(--faint)}
.stepper li:last-child{border-bottom:0}
.stepper li.doing{color:var(--muted)}
.stepper li.done{color:var(--ink)}
.stepper .mk{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center}
.stepper li.done .mk{color:var(--green)}
.stepper li.doing .mk{color:var(--gold)}
.stepper .det{font-family:var(--mono);font-size:11px;color:var(--faint)}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:rgba(0,0,0,.3);border:1px solid var(--hair);border-radius:var(--r);padding:9px 11px;color:var(--muted);white-space:pre-wrap;overflow-x:auto}
.log .bad{color:var(--coral)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:1240px){.grid2{grid-template-columns:1fr}}
.cardrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.cardrow:last-child{border-bottom:0}
.tsbar{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.tsbar .day{font-family:var(--mono);color:var(--faint)}
.tsbar .fig{font-family:var(--mono);color:var(--muted);text-align:right}
.strap{display:flex;height:26px;border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:rgba(0,0,0,.22)}
.strap button{height:100%;border-right:1px solid rgba(18,26,44,.85);font-family:var(--mono);font-size:9.5px;color:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.strap button:last-child{border-right:0}
.strap button:hover{filter:brightness(1.14)}
.strap .passive{background:rgba(63,184,175,.3);color:#0b1422}
.strap .manual{background:rgba(212,168,87,.6);color:#20180a}
.strap .unattr{background:repeating-linear-gradient(45deg,rgba(165,174,194,.26) 0 5px,rgba(165,174,194,.08) 5px 10px);color:var(--ink)}
.strap .gapb{background:rgba(39,52,79,.42);color:var(--faint)}

/* horizontal SVG route strip — the signature, drawn between linked places */
function routeStrip(stops, drawLast){
  const W = 700, y = 26, padL = 40, padR = 40;
  const gap = (W - padL - padR) / Math.max(1, stops.length-1);
  let paths = "", dots = "", labels = "";
  stops.forEach((s,i)=>{
    const x = padL + gap*i;
    if(i>0){
      const x0 = padL+gap*(i-1);
      const isNew = drawLast && i===stops.length-1;
      paths += `<path class="rpath ${s.prop?"prop":""} ${isNew?"draw":""}" d="M${x0+9} ${y} L${x-9} ${y}"/>`;
    }
    const fill = s.here?"#D4A857" : s.bad?"#E2735B" : "#182238";
    const stroke = s.here?"#D4A857" : s.bad?"#E2735B" : s.prop?"rgba(63,184,175,.5)":"#3FB8AF";
    dots += `<circle cx="${x}" cy="${y}" r="5" fill="${fill}" stroke="${stroke}" stroke-width="1.3" ${s.prop?'stroke-dasharray="2 2"':""}/>`;
    if(s.here) dots += `<circle cx="${x}" cy="${y}" r="8.5" fill="none" stroke="#D4A857" stroke-opacity=".3"/>`;
    labels += `<text class="rlabel ${s.here?"cur":""}" x="${x}" y="${y-13}" text-anchor="middle">${esc(s.k)}</text>`;
    if(s.sub) labels += `<text class="rsub" x="${x}" y="${y+19}" text-anchor="middle">${esc(s.sub)}</text>`;
  });
  return `<div class="routebox"><svg viewBox="0 0 ${W} 52" role="img" aria-label="Route between linked items">${paths}${dots}${labels}</svg></div>`;
}

function renderEntity(key){
  const kind = kindOf(key);
  if(kind==="other" && !S.notes[key]){
    $("doc").innerHTML = `<div class="docwrap">${pagehead("Not found", key, "")}<p class="muted">Nothing in the local index matches that. Search with ⌘K or pick a place from the routes on the right.</p></div>`;
    return;

  let title = key, sub = "", meta = "";
  if(kind==="ticket"){ sub = TICKETS[key].sum; meta = `${mark("jira")} <span class="faint">Tidewater Jira · synced 4 min ago</span>`; }
  else if(kind==="pr"){ sub = PRS[key].ttl; meta = `${mark("git")} <span class="faint">${esc(PRS[key].repo)} · synced 2 min ago</span>`; }
  else if(kind==="build"){ sub = BUILDS[key].cfg; meta = `${mark("ci")} <span class="${S.teamcityFixed?"faint":"coral"}">${S.teamcityFixed?"synced just now":"sync failed 38 min ago · 401"}</span>`; }
  else if(kind==="page"){ meta = `${mark("wiki")} <span class="faint">space ${esc(PAGES[key].space)} · synced 4 min ago</span>`; }
  else if(kind==="commit"){ sub = COMMITS[key].msg; meta = `${mark("git")} <span class="faint">${esc(COMMITS[key].repo)} · synced 2 min ago</span>`; }
  else if(kind==="branch"){ meta = `${mark("git")} <span class="faint">payout-service · synced 2 min ago</span>`; }
  $("doc").innerHTML = `<div class="docwrap">
    ${pagehead(kind, title + (sub? " — "+sub : ""), meta)}
    ${entityBody(key)}
    <div class="hr"></div>
    <div class="acts"><button class="btn" data-act="insertblock" data-key="${esc(key)}">Insert as block into today</button>

  render();
}

/* ══ events ════════════════════════════════════════════════════════ */
function handle(a, ev){
  const d = a.dataset, act = d.act;
  switch(act){
    case "toggle": S.expanded[d.key] = !S.expanded[d.key]; render(); break;
    case "toggleblock":
      if(d.b==="inbox") S.inboxBlockOpen = !S.inboxBlockOpen;
      if(d.b==="digest") S.digestOpen = !S.digestOpen;
      if(d.b==="proto") S.protoOpen = !S.protoOpen;
      render(); break;
    case "comment": postComment(d.key); break;
    case "comment-from-build":
      S.pay231.comments.push({who:"Mara Lindqvist", when:"today 14:32", txt:"Build "+d.id+" fails on the attempt counter — off-by-one, the initial try counts as attempt 0. Fix in progress.", saved:true});
      addStream(`<div class="line"><span class="who">You</span> commented on ${link("PAY-231")} — “Build ${esc(d.id)} fails on the attempt counter — off-by-one…”</div>`);
      toast("Comment posted to Jira","PAY-231"); render(); break;
    case "confirm": {
      const s = S.suggestions.find(x=>x.id===d.id); if(!s) break;
      s.state = "confirmed";
      (LINKS[s.to] = LINKS[s.to]||[]).push([s.from, "linked "+s.why, srcOf(s.from)]);
      S.justConfirmed = true;
      toast("Route drawn: "+s.from+" → "+s.to, s.why);
      render(); break; }
    case "dismiss": {
      const s = S.suggestions.find(x=>x.id===d.id); if(s) s.state = "dismissed";
      toast("Suggestion dismissed","knobas will not propose it again"); render(); break; }
    case "status": break;
    case "starttimer": switchTimer(d.key); addStream(`<div class="line">${glyph("note",11)} timer switched to ${link(d.key)}</div>`); toast("Timer running on "+d.key,"manual"); render(); break;
    case "stoptimer": stopTimer(); break;
    case "switchctx":
      openPicker(a, "Switch the timer to…", k=>{ switchTimer(k); toast("Timer switched to "+k,"the previous interval stays on today's page"); render(); });
      break;
    case "assignopen": S.unattributed.state = "choosing"; render(); break;
    case "assign":
      if(d.key==="keep"){ S.unattributed.state="open"; toast("Left unattributed","it stays in the day review"); }
      else { S.unattributed.state="assigned"; S.unattributed.to=d.key; toast("30m assigned to "+d.key,"saved locally · not logged yet"); }
      render(); break;
    case "adhocopen": S.adhoc.state = "choosing"; render(); break;
    case "adhoc":
      if(d.key==="keep"){ S.adhoc.state="kept"; toast("Kept local","48m stays out of Jira"); }
      else { S.adhoc.state="logged"; S.loggedMin += 48; toast("Logged 48m to "+d.key,"“Staging DB configuration”"); }
      render(); break;
    case "draftitem": S.worklogDraft.items[+d.i].on = !S.worklogDraft.items[+d.i].on; render(); break;
    case "logwork": logWork(); break;
    case "draftedit": toast("Adjust the interval","edit from and to, then log again"); break;
    case "draftdiscard": S.worklogDraft = null; toast("Draft discarded","the tracked time stays on today's page"); render(); break;
    case "startwork": startWork(); break;
    case "triggerform": S.buildTrigger = {branch:"feature/PAY-231-sepa-retry", env:"staging", clean:false}; go("#/day/2026-08-22"); render(); break;
    case "canceltrigger": S.buildTrigger = null; render(); break;
    case "dotrigger": {
      const b = document.querySelector('[data-t="branch"]'), e = document.querySelector('[data-t="env"]'), c = document.querySelector('[data-t="clean"]');
      S.buildTrigger = {done:true, branch:b?b.value:"feature/PAY-231-sepa-retry", env:e?e.value:"staging", clean:c?c.checked:false};
      if(!S.teamcityFixed){ pending(1); toast("Trigger queued","TeamCity returned 401 — it runs once the password is fixed","bad"); }
      else toast("Payout_IntegrationTests #1189 queued", S.buildTrigger.branch);
      render(); break; }
    case "rerun": rerun(d.id); break;
    case "createticket": {
      const sum = (document.querySelector('[data-n="sum"]')||{}).value || "Document the manual-review queue SLA";
      TICKETS["PAY-241"] = {sum:sum, type:"Task", pri:"Medium", who:"Mara Lindqvist", upd:"today 14:32", est:"—", spent:"—", epic:"PAY-200", desc:(document.querySelector('[data-n="desc"]')||{}).value||""};
      ALL_KEYS.push("PAY-241");
      S.newTicket = {done:true, sum:sum};
      toast("Created PAY-241", "saved to Jira · Payments Platform"); render(); break; }
    case "createpage": {
      const t = (document.querySelector('[data-p="title"]')||{}).value || "Manual review queue SLA";
      PAGES[t] = {space:"ENG", edited:"today 14:32", by:"Mara Lindqvist", body:[["h","SLA"],["p","One business day. Owner: Payments on-call."]]};
      ALL_KEYS.push(t);
      S.newPage = {done:true, title:t};
      toast("Created page “"+t+"”", "ENG › Standup protocols"); render(); break; }
    case "cancelform": S.newTicket = null; S.newPage = null; render(); break;
    case "actionticket": S.actionTicket = +d.i; TICKETS["PAY-241"] = TICKETS["PAY-241"] || {sum:"Document the manual-review queue SLA", type:"Task", pri:"Medium", who:"Mara Lindqvist", upd:"today 14:32", est:"—", spent:"—", epic:"PAY-200", desc:"From the standup action items."};
      toast("Created PAY-241 from the action item","saved to Jira"); render(); break;
    case "publish": S.protocol.published = true; toast("Published to Confluence","ENG › Standup protocols › 2026-08-22"); render(); break;
    case "saveproto": case "savenote-digest": {
      const name = "Standup 2026-08-22";
      S.notes[name] = {edited:"today 14:32", links:["PAY-231","PAY-228","OPS-77","PAY-240"], body:"Yesterday: merged PR #139, PAY-228 → In Review, retry loop for PAY-231.\nToday: backoff + jitter (a41f2c, c90d11), fix #1187, reply to Priya about the SLA, review PR #144.\nBlockers: PAY-228 blocked by OPS-77."};
      if(ALL_KEYS.indexOf(name)<0) ALL_KEYS.push(name);
      S.protocol.saved = true; toast("Saved as note","Standup 2026-08-22"); render(); break; }
    case "editdigest": S.digestEdit = !S.digestEdit; render(); break;
    case "savedigest": S.digestEdit = false; toast("Digest updated","it stays on today's page"); render(); break;
    case "sla": S.slaAdded = true; toast("Added the manual-review SLA","saved to Confluence · Priya notified"); render(); break;
    case "reply-page": S.pageReply = true; toast("Replied to Priya","comment posted to Confluence"); render(); break;
    case "sync": toast(d.id==="teamcity" && !S.teamcityFixed ? "TeamCity still returns 401" : "Sync started", d.id==="teamcity" && !S.teamcityFixed ? "re-enter the password to fix it" : "next scheduled sync in 5 minutes", d.id==="teamcity" && !S.teamcityFixed ? "bad" : ""); break;
    case "testconn": toast(d.id==="teamcity" && !S.teamcityFixed ? "401 Unauthorized" : "Connection ok", d.id==="teamcity" && !S.teamcityFixed ? "the password may have expired" : "search and write available", d.id==="teamcity" && !S.teamcityFixed ? "bad" : ""); break;
    case "reauth": S.reauth = true; render(); break;
    case "cancelreauth": S.reauth = false; render(); break;
    case "savetc":
      S.teamcityFixed = true; S.reauth = false;
      if(S.pending){ toast("TeamCity connected",""+S.pending+" pending write sent"); S.pending = 0; $("pendingWrites").textContent = "pending writes 0"; }
      else toast("TeamCity connected","synced just now · 312 builds indexed");
      render(); break;
    case "addsource": S.addSource = {step:1, type:"", url:"https://", auth:"personal access token (PAT)", sched:"every 5 minutes"}; render(); break;
    case "astype": S.addSource.type = d.t; S.addSource.step = 2;
      S.addSource.url = d.t==="GitHub" ? "https://github.com" : d.t==="Jenkins" ? "https://ci.tidewater.internal" : "https://";
      render(); break;
    case "astest": {
      const u = $("asurl"), au = $("asauth");
      if(u) S.addSource.url = u.value; if(au) S.addSource.auth = au.value;
      S.addSource.tested = true; S.addSource.step = 3;
      toast("Connection ok","12 projects visible · search + write"); render(); break; }
    case "assched": S.addSource.sched = d.s; render(); break;
    case "assave": S.addSource.saved = true; toast("Source saved","first sync queued"); render(); break;
    case "ascancel": S.addSource = null; render(); break;
    case "linkto": openPicker(a, "Draw a route from "+d.key, k=>addRoute(d.key, k)); break;
    case "bracket": {
      const ta = Array.from(document.querySelectorAll("[data-note]")).find(x=>x.dataset.note===d.note);
      openPicker(a, "Insert a link", k=>{
        if(ta){ ta.value = ta.value + (ta.value.endsWith("\n")||!ta.value ? "" : " ") + "[["+k+"]]"; ta.focus(); }
        if(S.notes[d.note].links.indexOf(k)<0) S.notes[d.note].links.push(k);
        S.notes[d.note].body = ta ? ta.value : S.notes[d.note].body;
        toast("Linked "+k, "in "+d.note); render();
      });
      break; }
    case "savenote": {
      const ta = Array.from(document.querySelectorAll("[data-note]")).find(x=>x.dataset.note===d.note);
      if(ta) S.notes[d.note].body = ta.value;
      S.notes[d.note].edited = "today 14:32";
      toast("Note saved","local · indexed for search"); render(); break; }
    case "newnote": newNote(); break;
    case "insertblock": case "insertres": {
      addStream(`${entityBlock(d.key,{cls:""})}`);
      S.expanded[d.key] = true;
      closeOverlays();
      toast("Inserted into today", d.key+" is now a live block on the journal page");
      go("#/day/2026-08-22"); render(); break; }
    case "insertlist": {
      const l = SMART.find(x=>x.id===d.id);
      addStream(`<div class="line">${esc(l.lbl)} <span class="mono gold">${esc(l.n)}</span></div>` + (l.items.map(k=>entityBlock(k,{})).join("")||""));
      toast("Inserted into today", l.lbl);
      go("#/day/2026-08-22"); render(); break; }
    case "opensearch": openSearch(); break;
    case "filter":
      if(["failing","mine","today"].indexOf(d.f)>=0) S.filters[d.f] = !S.filters[d.f];
      else S.filters.src = d.f;
      renderSearch(); break;
    case "inbox": inboxAct(d.id, d.do); break;
    case "unsnooze": { S.snoozed.shift(); toast("Brought back","it is in the inbox again"); render(); break; }
    case "strap": {
      const b = BLOCKS[+d.i];
      go("#/day/2026-08-22");
      setTimeout(()=>{
        const el = $("e-"+b.from.replace(":","")) || $(b.kind==="unattr"?"unattr":"adhoc");
        if(el){ el.classList.add("sel"); el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); setTimeout(()=>el.classList.remove("sel"), 2200); }
      }, 40);
      break; }
    case "logone": S.loggedMin += (d.d==="2h 44m"?164:d.d==="48m"?48:d.d==="30m"?30:43); toast("Logged "+d.d+" to "+d.t,"saved to Jira"); render(); break;
    case "logall": S.loggedMin += 285; toast("Logged 4h 45m across 4 intervals","Jira worklogs created"); render(); break;
    case "approve": toast("Approved PR #144","Jonas notified"); addStream(`<div class="line">${glyph("git",11)} approved ${link("PR #144")}</div>`); render(); break;
    case "git": gitOp(d.op); break;
    default: break;
  }
}
document.addEventListener("click", ev=>{
  const pick = ev.target.closest("[data-pick]");
  if(pick){ const k = pick.dataset.pick; $("pop").hidden = true; const f = popPick; popPick = null; if(f) f(k); return; }
  const sl = ev.target.closest("[data-slash]");
  if(sl){ runSlash(sl.dataset.slash); return; }
  const g = ev.target.closest("[data-go]");
  if(g){ closeOverlays(); go(g.dataset.go); return; }
  const a = ev.target.closest("[data-act]");
  if(a){ handle(a, ev); return; }
  if(!ev.target.closest("#pop")) $("pop").hidden = true;
  if(ev.target.id==="searchScrim") closeOverlays();
});
document.addEventListener("keydown", ev=>{
  const el = ev.target.closest && ev.target.closest("[data-act]");
  if(el && (ev.key==="Enter"||ev.key===" ") && el.getAttribute("role")==="button"){ ev.preventDefault(); handle(el, ev); }
});
document.addEventListener("change", ev=>{
  const t = ev.target;
  if(t.matches("[data-act='status']")) setStatus(t.dataset.key, t.value);
  if(t.matches("[data-d='target']")){ S.worklogDraft.target = t.value; render(); }
  if(t.matches("[data-d='from']")) S.worklogDraft.from = t.value;
  if(t.matches("[data-d='to']")) S.worklogDraft.to = t.value;
});
$("searchBtn").addEventListener("click", openSearch);
$("inboxBtn").addEventListener("click", ()=>go("#/inbox"));
$("syncBtn").addEventListener("click", ()=>go("#/sources"));
$("timerBtn").addEventListener("click", e=>{
  openPop($("timerBtn"), `<h4 class="eyebrow">Timer</h4>
    <button class="item" data-act="stoptimer"><span>${S.timer.running?"Stop and log…":"Start on PAY-231"}</span><span class="hint">⌘T</span></button>
    <button class="item" data-act="switchctx"><span>Switch context…</span><span class="hint">entity or label</span></button>
    <button class="item" data-go="#/timesheet"><span>Open the timesheet</span><span class="hint">week 34</span></button>`);
});
$("q").addEventListener("input", renderSearch);
$("q").addEventListener("keydown", ev=>{
  const rows = Array.from(document.querySelectorAll("#results .res"));
  let i = rows.findIndex(r=>r.classList.contains("cur"));
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){
    ev.preventDefault();
    if(i>=0) rows[i].classList.remove("cur");
    i = ev.key==="ArrowDown" ? Math.min(rows.length-1, i+1) : Math.max(0, i-1);
    if(rows[i]) { rows[i].classList.add("cur"); rows[i].scrollIntoView({block:"nearest"}); }
  } else if(ev.key==="Enter"){
    ev.preventDefault();
    const row = rows[i>=0?i:0]; if(!row) return;
    if(ev.shiftKey){
      const ins = row.parentElement.querySelector("[data-act='insertres']");
      if(ins) handle(ins, ev);
    } else { closeOverlays(); go(row.dataset.go); }
  }
});
document.addEventListener("keydown", ev=>{
  const mod = ev.metaKey || ev.ctrlKey;
  if(mod && (ev.key==="k"||ev.key==="K")){ ev.preventDefault(); openSearch(); return; }
  if(mod && (ev.key==="t"||ev.key==="T")){ ev.preventDefault(); stopTimer(); return; }
  if(ev.key==="Escape"){ closeOverlays(); }
});
document.addEventListener("input", ev=>{
  if(ev.target.id!=="composer") return;
  const v = ev.target.value;
  if(v.startsWith("/")) slashMenu(ev.target);
  else if(v.endsWith("[[")) openPicker(ev.target, "Link a place", k=>{
    const c = $("composer"); c.value = c.value.slice(0,-2)+"[["+k+"]] "; c.focus();
  });
  else $("pop").hidden = true;
});
document.addEventListener("keydown", ev=>{
  if(ev.target.id!=="composer" || ev.key!=="Enter") return;
  const v = ev.target.value.trim(); if(!v) return;
  if(v.startsWith("/")){
    const first = document.querySelector("#pop [data-slash]");
    if(first){ ev.preventDefault(); runSlash(first.dataset.slash); }
    return;
  }
  ev.preventDefault();
  const chips = [];
  const body = v.replace(/\[\[([^\]]+)\]\]/g, (m,k)=>{ chips.push(k); return `<b>${esc(k)}</b>`; });
  addStream(`<div class="notetext">${body}</div>` + (chips.length? `<div class="row wrap" style="gap:6px;margin-top:6px">${chips.map(c=>link(c)).join(" ")}</div>`:""), "14:32");
  ev.target.value = "";
  toast("Note added to today", chips.length? "linked to "+chips.join(", ") : "local · indexed for search");
  render();
  setTimeout(()=>{ const c = $("composer"); if(c) c.focus(); }, 30);
});

/* ══ router ════════════════════════════════════════════════════════ */
function labelFor(route){
  if(route.startsWith("#/e/")) return decodeURIComponent(route.slice(4));
  if(route.startsWith("#/note/")) return decodeURIComponent(route.slice(7));
  if(route.startsWith("#/day/")){ const d = route.slice(6); return d==="2026-08-22" ? "22 August" : (DAYNAMES[d]||d).split(" ").slice(1,3).join(" "); }
  if(route.startsWith("#/list/")){ const l = SMART.find(x=>x.id===route.slice(7)); return l? l.lbl.split(" ").slice(0,3).join(" ") : "list"; }
  if(route==="#/sources") return "Sources";
  if(route==="#/timesheet") return "Week 34";
  if(route==="#/inbox") return "Inbox";
  return "knobas";
}
function render(){
  S.route = location.hash || "#/day/2026-08-22";
  const r = S.route;
  if(r.startsWith("#/day/")) renderDay(r.slice(6));
  else if(r.startsWith("#/e/")) renderEntity(decodeURIComponent(r.slice(4)));
  else if(r.startsWith("#/note/")) renderNote(decodeURIComponent(r.slice(7)));
  else if(r.startsWith("#/list/")) renderList(r.slice(7));
  else if(r==="#/sources") renderSources();
  else if(r==="#/timesheet") renderTimesheet();
  else if(r==="#/inbox") renderInbox();
  else renderDay("2026-08-22");
  renderLeft(); renderRight(); renderItin(); renderTimer(); renderCounts();
}
window.addEventListener("hashchange", ()=>{
  const r = location.hash || "#/day/2026-08-22";
  pushStop(labelFor(r), r);
  render();
  $("doc").scrollTop = 0;
});

/* ══ init ══════════════════════════════════════════════════════════ */
S.expanded["PAY-231"] = true;
if(!location.hash) location.hash = "#/day/2026-08-22";
render();
setInterval(()=>{ if(S.timer.running){ S.timer.mins++; renderTimer(); } }, 60000);
}catch(err){
  const box = document.getElementById("errbox");
  if(box){ box.style.display="block"; box.style.color="#E2735B"; box.style.padding="14px"; box.textContent = "init error: "+err.message+"\n"+err.stack; }
}
</script>
