<!--
knobas mockup
paradigm: P5 Journal
design: D3 Patchbay
thesis: Your day is one editable document — activity, notes, time, standup and remote entities are live blocks in a single stream.
thesis: The workspace is a studio patchbay — every source is a colored module, every link is a cable you can see and plug.
thesis: Patch cables — hover any jack in the day stream and it wires itself to every related block, dimming the rest.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — Friday 22 August 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================ TOKENS */
:root{
  --chassis:#E3E5E8; --panel:#F1F2F4; --paper:#F8F9FA; --edge:#C9CDD3;
  --ink:#1E2126; --muted:#6B727C; --dim:#98A0A9;
  --jira:#2563EB; --confluence:#7C3AED; --gitea:#2E9E5B; --teamcity:#F0742A; --local:#E0B100;
  --fail:#D62839;
  --rack:236px; --patchw:296px;
  --display:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --mono:'Space Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --plate:0 1px 0 rgba(255,255,255,.75);
  --screws:radial-gradient(circle at 6px 6px,#BFC4CB 0 1.6px,transparent 1.7px),
           radial-gradient(circle at calc(100% - 6px) 6px,#BFC4CB 0 1.6px,transparent 1.7px),
           radial-gradient(circle at 6px calc(100% - 6px),#BFC4CB 0 1.6px,transparent 1.7px),
           radial-gradient(circle at calc(100% - 6px) calc(100% - 6px),#BFC4CB 0 1.6px,transparent 1.7px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--chassis); color:var(--ink);
  font:400 13.5px/1.5 var(--body);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
::selection{background:#1E2126;color:#fff}

/* engraved plate label */
.lbl{
  font:400 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);text-shadow:var(--plate);
}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============================================================ SHELL */
#app{height:100%;display:flex;flex-direction:column;min-height:0}
#body{flex:1;display:grid;grid-template-columns:var(--rack) minmax(0,1fr) var(--patchw);min-height:0;gap:8px;padding:0 8px 0 8px}
@media (max-width:1240px){:root{--rack:208px;--patchw:264px}}
@media (max-width:1120px){:root{--rack:190px;--patchw:246px} body{font-size:13px}}

/* panel = a hardware module face */
.panel{
  background:var(--panel);border:1px solid var(--edge);border-radius:4px;
  background-image:var(--screws);background-repeat:no-repeat;
}
.panel-h{
  display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;
  border-bottom:1px solid var(--edge);
}
.panel-h .lbl{color:#fff;text-shadow:none;font-weight:700}
.panel-h.src-jira{background:var(--jira)} .panel-h.src-confluence{background:var(--confluence)}
.panel-h.src-gitea{background:var(--gitea)} .panel-h.src-teamcity{background:var(--teamcity)}
.panel-h.src-local{background:var(--local)} .panel-h.src-local .lbl{color:#2A2200}
.panel-h.neutral{background:#D7DADE} .panel-h.neutral .lbl{color:var(--ink);text-shadow:var(--plate)}

/* ============================================================ CHROME (master section) */
#chrome{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;
  padding:0 12px;background:linear-gradient(#EDEFF1,#E3E5E8);
  border-bottom:1px solid #B9BEC5;
}
.wordmark{
  display:flex;align-items:baseline;gap:7px;padding:5px 10px;border:1px solid var(--edge);
  border-radius:4px;background:#DCDFE3;background-image:var(--screws);background-repeat:no-repeat;
}
.wordmark b{font:700 15px/1 var(--display);letter-spacing:-.02em;text-shadow:var(--plate)}
.wordmark span{font:400 9px/1 var(--mono);letter-spacing:.14em;color:var(--muted)}

.searchbar{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;
  border:1px solid var(--edge);border-radius:4px;background:#FAFBFC;cursor:text;color:var(--muted);
}
.searchbar:hover{border-color:var(--dim)}
.searchbar kbd{margin-left:auto}
kbd{
  font:400 10px/1 var(--mono);border:1px solid var(--edge);border-bottom-width:2px;border-radius:3px;
  padding:3px 5px;background:#E9EBEE;color:var(--muted);
}

/* sync module: four jacks, one glance */
.syncmod{display:flex;align-items:center;gap:0;border:1px solid var(--edge);border-radius:4px;background:#DCDFE3;overflow:hidden}
.syncmod button{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;background:none;border:0;
  border-right:1px solid var(--edge);cursor:pointer;
}
.syncmod button:last-child{border-right:0}
.syncmod button:hover{background:#E9EBEE}
.led{width:9px;height:9px;border-radius:999px;background:var(--c,#999);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.led.off{background:#B7BCC3}
.led.err{background:var(--fail)}
.syncmod .t{font:400 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.syncmod button.bad .t{color:var(--fail);font-weight:700}

/* transport = timer */
.transport{
  margin-left:auto;display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;
  border:1px solid var(--edge);border-radius:4px;background:#DCDFE3;
  background-image:var(--screws);background-repeat:no-repeat;
}
.tbtn{
  position:relative;width:38px;height:38px;border-radius:999px;border:1px solid #A9AFB7;cursor:pointer;
  background:radial-gradient(circle at 50% 40%,#FDFDFE,#E6E8EB);display:grid;place-items:center;
}
.tbtn:hover{background:radial-gradient(circle at 50% 40%,#fff,#DEE1E5)}
.tbtn .glyph{width:11px;height:11px;background:var(--ink)}
.tbtn.run .glyph{border-radius:1px}
.tbtn:not(.run) .glyph{background:none;width:0;height:0;border-left:12px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.tbtn.run::after{
  content:"";position:absolute;inset:-5px;border-radius:999px;border:2px solid var(--c,var(--jira));
  animation:pulse 2s ease-out infinite;
}
@keyframes pulse{0%{opacity:.9;transform:scale(.94)}70%{opacity:0;transform:scale(1.16)}100%{opacity:0}}
.tmeta{display:flex;flex-direction:column;gap:2px;min-width:118px}
.tmeta .ctx{display:flex;align-items:center;gap:5px;font:600 12px/1 var(--display)}
.tmeta .el{font:700 15px/1 var(--mono);letter-spacing:.02em}
.tmeta.idle .el{color:var(--dim)}

.chip-count{
  display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;
  border-radius:999px;background:var(--ink);color:#fff;font:700 10px/1 var(--mono);
}
.chip-count.zero{background:#B7BCC3;color:#4A5059}

/* ============================================================ RACK (left) */
#rack{display:flex;flex-direction:column;gap:8px;min-height:0;padding:8px 0}
#rack .panel{display:flex;flex-direction:column;min-height:0}
.rack-scroll{overflow:auto;min-height:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px}
.cal .dow{font:400 9px/1 var(--mono);color:var(--dim);text-align:center;padding-bottom:2px}
.cal button{
  aspect-ratio:1;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;
  font:400 11px/1 var(--mono);color:var(--ink);display:grid;place-items:center;position:relative;
}
.cal button:hover{background:#E4E7EA}
.cal button.out{color:#BFC5CC}
.cal button.has::after{content:"";position:absolute;bottom:3px;width:3px;height:3px;border-radius:999px;background:var(--muted)}
.cal button[aria-current="date"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal button[aria-current="date"]::after{background:#fff}

.navlist{padding:5px 0}
.navlist .sec{padding:8px 10px 4px}
.navrow{
  width:100%;display:flex;align-items:center;gap:8px;padding:5px 10px;border:0;background:none;
  cursor:pointer;text-align:left;font-size:12.5px;color:var(--ink);border-left:2px solid transparent;
}
.navrow:hover{background:#E7EAED}
.navrow.on{background:#DDE0E4;border-left-color:var(--ink);font-weight:600}
.navrow .g{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow .n{font:400 10.5px/1 var(--mono);color:var(--muted)}
.navrow .n.hot{color:#fff;background:var(--ink);border-radius:999px;padding:3px 5px}
.navrow .n.warn{color:var(--fail);font-weight:700}
.rack-foot{border-top:1px solid var(--edge);padding:4px 0;background:#EAECEF}

/* ============================================================ JACKS + CABLES */
.jack{
  position:relative;flex:0 0 auto;width:14px;height:14px;border-radius:999px;
  background:#D3D7DC;border:1px solid #B4BAC1;display:grid;place-items:center;
}
.jack::after{content:"";width:6px;height:6px;border-radius:999px;background:var(--c,var(--muted))}
.jack.lg{width:20px;height:20px}
.jack.lg::after{width:9px;height:9px}
.jack.sug{border-style:dashed;border-color:var(--c,var(--muted));background:#EDEFF1}
.jack.sug::after{opacity:.45}
.jack.plugged{animation:plug 150ms ease-out}
@keyframes plug{0%{transform:scale(1)}45%{transform:scale(1.5)}100%{transform:scale(1)}}
.cable-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.cable{fill:none;stroke-width:3;stroke-linecap:round}
.cable.ghost{opacity:.4;stroke-dasharray:5 5}

/* ============================================================ DOCUMENT (center) */
#doc{
  min-height:0;overflow:auto;background:var(--paper);border:1px solid var(--edge);
  border-top:0;border-bottom:0;position:relative;
}
#docInner{max-width:none;padding:0 0 120px}
.doc-head{
  position:sticky;top:0;z-index:6;background:linear-gradient(var(--paper) 78%,rgba(248,249,250,0));
  padding:18px 26px 10px;display:flex;align-items:flex-end;gap:14px;
}
.doc-head h1{margin:0;font:700 25px/1.1 var(--display);letter-spacing:-.02em}
.doc-head .sub{margin:0 0 3px;display:flex;align-items:center;gap:8px}
.doc-head .spacer{flex:1}
.crumb{display:flex;align-items:center;gap:6px;font:400 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.crumb button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;font:inherit}
.crumb button:hover{color:var(--ink)}

/* the stream: a time rail with a jack per entry */
.stream{position:relative;padding:0 26px 0 26px}
.railline{position:absolute;left:calc(26px + 63px);top:0;bottom:0;width:1px;background:#B7BEC6;z-index:0}
.entry{
  position:relative;display:grid;grid-template-columns:40px 22px minmax(0,1fr);gap:0 12px;
  align-items:start;padding:7px 0;z-index:1;
}
.entry.dimmed{opacity:.28}
.entry .when{font:400 10.5px/18px var(--mono);color:var(--dim);text-align:right;padding-top:2px}
.entry .jackcell{display:flex;justify-content:center;padding-top:4px;position:relative;z-index:2}
.entry .jackcell .jack{cursor:crosshair;background:#EDEFF1}
.entry .jackcell .jack:hover{border-color:var(--ink)}
.entry .lineup{display:flex;align-items:center;gap:8px;min-height:22px;flex-wrap:wrap}
.entry .txt{font-size:13px}
.entry .txt b{font-weight:600}
.entry.patched .jackcell .jack{border-color:var(--ink);border-width:2px}
.entry .dur{font:400 10.5px/1 var(--mono);color:var(--muted);border:1px solid var(--edge);border-radius:999px;padding:3px 6px;background:#EEF0F2}
.entry.passive .dur{border-style:dashed}
.entry.manual .dur{background:#E2E5E9;border-color:var(--dim)}
.entry.unattr .dur{border-color:var(--ink);border-style:dashed;background:transparent}
.entry.gaprow{opacity:.62}
.entry.sugrow .txt{font-size:12px}

/* your own notes are visually primary */
.entry.mine .txt{font-size:14.5px;line-height:1.55}
.mynote{
  border-left:3px solid var(--local);background:#FCFAF0;border-radius:0 4px 4px 0;
  padding:9px 12px;margin:1px 0;
}
.mynote p{margin:0 0 6px}
.mynote p:last-child{margin:0}
.mynote .meta{display:flex;align-items:center;gap:8px;margin-top:7px}

/* entity block = a small module face */
.eblock{border:1px solid var(--edge);border-radius:4px;background:#fff;overflow:hidden;width:100%}
.eblock.selected{outline:2px solid var(--ink);outline-offset:0}
.ebar{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;background:#FBFBFC}
.ebar:hover{background:#F4F5F7}
.ebar .stripe{width:3px;align-self:stretch;background:var(--c);border-radius:2px;margin:-7px 2px -7px -6px}
.ebar .key{font:700 11.5px/1 var(--mono);letter-spacing:.03em}
.ebar .sum{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebar .caret{transition:transform .12s ease;color:var(--muted)}
.eblock.open .ebar .caret{transform:rotate(90deg)}
.ebody{border-top:1px solid var(--edge);padding:12px 12px 12px}
.eblock:not(.open) .ebody{display:none}

.badge{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--edge);border-radius:3px;
  padding:2px 6px;background:#EEF0F2;font:400 10px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
}
.badge.solid{background:var(--c);border-color:var(--c);color:#fff;text-shadow:none}
.badge.fail{background:var(--fail);border-color:var(--fail);color:#fff}
.badge.ok{background:#E8EDE9;border-color:#B9C7BE;color:#2A5B3E}
.badge.run{border-color:var(--teamcity);color:#8A3B06;background:#FCEEE3}
.badge.pri-High{color:#8A2A1E;border-color:#E0BDB7;background:#FBEDEA}
.badge.pri-Medium{color:#5A4A1E}
.badge.pri-Low{color:var(--muted)}

/* ============================================================ CONTROLS (chunky, flat) */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;cursor:pointer;
  border:1px solid var(--edge);border-bottom-width:2px;border-radius:4px;background:#E9EBEE;
  font:500 12px/1 var(--body);color:var(--ink);white-space:nowrap;
}
.btn:hover{background:#DEE1E5}
.btn:active{border-bottom-width:1px;margin-top:1px}
.btn.primary{background:var(--ink);border-color:#000;color:#fff}
.btn.primary:hover{background:#31363E}
.btn.sm{height:22px;padding:0 8px;font-size:11px}
.btn.danger{color:var(--fail);border-color:#DBB6B9}
.btn.ghost{background:transparent;border-color:transparent;border-bottom-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#E4E7EA;color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.seg{display:inline-flex;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:#E9EBEE}
.seg button{border:0;background:none;padding:0 10px;height:24px;cursor:pointer;font:500 11.5px/1 var(--body);color:var(--muted);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:#DCDFE3;color:var(--ink)}

.toggle{position:relative;width:44px;height:24px;border-radius:999px;border:1px solid var(--edge);background:#D7DADE;cursor:pointer;padding:0;flex:0 0 auto}
.toggle .thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:#FBFBFC;border:1px solid #AEB4BB;transition:transform .12s ease}
.toggle[aria-pressed="true"]{background:var(--ink);border-color:#000}
.toggle[aria-pressed="true"] .thumb{transform:translateX(20px)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{
  border:1px solid var(--edge);border-radius:4px;background:#FDFDFE;padding:6px 8px;font-size:13px;width:100%;
}
.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.select-status{
  border:1px solid var(--edge);border-radius:4px;background:#EEF0F2;padding:3px 6px;
  font:400 10.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.07em;cursor:pointer;
}

/* ============================================================ BLOCK SHELLS in the doc */
.block{margin:14px 26px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);background-image:var(--screws);background-repeat:no-repeat}
.block > .panel-h{border-radius:3px 3px 0 0}
.block .inner{padding:12px 14px}
.block.flat{background:#fff}
.blk-collapse .inner{display:block}
.blk-collapse.closed .inner{display:none}

.rowitem{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--edge)}
.rowitem:first-child{border-top:0}
.rowitem .grow{flex:1;min-width:0}
.rowitem.gone{display:none}
.rowitem .when{font:400 10px/1 var(--mono);color:var(--dim);white-space:nowrap;padding-top:4px}
.quote{border-left:2px solid var(--edge);padding-left:9px;color:#3B4149;font-size:12.5px;margin:4px 0 0}

.linkrow{display:flex;align-items:center;gap:9px;padding:7px 0;position:relative}
.linkrow .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.linkrow button.name{text-align:left;border:0;background:none;cursor:pointer;padding:0}
.linkrow button.name:hover{text-decoration:underline}
.linkrow .via{font:400 9.5px/1 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}

.patchfield{position:relative;padding:10px 12px 12px}
.patchfield .origin-row{display:flex;align-items:center;gap:9px;padding-bottom:8px}
.patchfield .rows{padding-left:64px}
.patchfield .rows .linkrow{padding:8px 0}

.log{
  font:400 11.5px/1.65 var(--mono);background:#1E2126;color:#DCE0E5;border-radius:4px;padding:10px 12px;
  overflow-x:auto;white-space:pre;margin:0;
}
.log .f{color:#FF8C82}
.log .p{color:#93D8A6}

.stepper{list-style:none;margin:0;padding:0}
.stepper li{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px dashed var(--edge)}
.stepper li:first-child{border-top:0}
.stepper .dot{flex:0 0 auto;width:16px;height:16px;border-radius:999px;border:1px solid var(--edge);background:#E9EBEE;display:grid;place-items:center;font:700 9px/1 var(--mono);color:var(--muted);margin-top:2px}
.stepper li.done .dot{background:var(--gitea);border-color:var(--gitea);color:#fff}
.stepper li.doing .dot{border-color:var(--teamcity);color:var(--teamcity);animation:pulse2 1s linear infinite}
@keyframes pulse2{50%{opacity:.35}}
.stepper li.wait{opacity:.5}
.stepper .st{flex:1;font-size:12.5px}
.stepper .sub{font:400 10.5px/1.5 var(--mono);color:var(--muted)}

.checkline{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:12.5px;cursor:pointer}
.checkline input{margin:3px 0 0;accent-color:#1E2126;width:15px;height:15px}

.timestrip{display:flex;gap:2px;height:44px;align-items:stretch;margin:4px 0 8px}
.timestrip .b{border-radius:3px;position:relative;cursor:pointer;border:1px solid var(--edge);min-width:6px;display:flex;align-items:flex-end;overflow:hidden}
.timestrip .b .bl{font:400 9px/1 var(--mono);color:var(--ink);padding:3px 4px;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.timestrip .b.passive{background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,#F6F7F8 1.5px 7px)}
.timestrip .b.manual{background:var(--c);opacity:.9}
.timestrip .b.manual .bl{color:#fff;text-shadow:none}
.timestrip .b.gap{background:#E4E7EA;border-style:dashed}
.timestrip .b.unattr{background:repeating-linear-gradient(135deg,#A9B0B9 0 1.5px,#F6F7F8 1.5px 7px);border-color:var(--ink);border-style:dashed}
.timestrip .b:hover{filter:brightness(1.06)}
.timestrip .b[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.axis{display:flex;justify-content:space-between;font:400 9.5px/1 var(--mono);color:var(--dim)}

.wk{display:grid;grid-template-columns:44px 1fr 78px 78px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--edge)}
.wk:first-of-type{border-top:0}
.bar{height:12px;border-radius:2px;background:#DDE0E4;position:relative;overflow:hidden}

.composer .cin:focus-visible{border-style:solid;border-color:var(--ink);outline:none}
.composer .hint{margin-top:6px;display:flex;gap:10px;align-items:center}
.slashmenu{

.slashmenu button:last-child{border-bottom:0}
.slashmenu button:hover,.slashmenu button.hl{background:#EEF0F2}
.slashmenu .cmd{font:700 11.5px/1 var(--mono)}
.slashmenu .d{font-size:11.5px;color:var(--muted)}

/* ============================================================ PATCH RAIL (right) */
#patch{display:flex;flex-direction:column;gap:8px;min-height:0;padding:8px 0;overflow:auto}
#patch .panel{flex:0 0 auto}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:12px}
.stat b{font:700 13px/1 var(--mono)}
.stat.warn b{color:var(--teamcity)}

/* ============================================================ STATUS BAR */
#status{
  height:26px;flex:0 0 26px;display:flex;align-items:center;gap:14px;padding:0 12px;
  background:#D9DCE0;border-top:1px solid #B9BEC5;
  font:400 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
#status .sep{width:1px;height:12px;background:var(--edge)}
#status .warn{color:var(--fail);font-weight:700}
#status .right{margin-left:auto;display:flex;gap:12px;align-items:center}
#status button{border:0;background:none;cursor:pointer;font:inherit;color:inherit;text-decoration:underline;letter-spacing:inherit;text-transform:inherit;padding:0}

.modal{

.res:hover,.res.hl{background:#EEF0F2}
.res .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.res .t .n{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t .m{font:400 9.5px/1.4 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.07em}

function cablePath(x1,y1,x2,y2,mode){
  const dx=x2-x1, dy=y2-y1;
  if(mode==='bow'){
    const b=Math.min(70,26+Math.abs(dy)*0.09);
    return 'M'+x1+','+y1+' C'+(x1-b)+','+(y1+dy*0.18)+' '+(x2-b)+','+(y2-dy*0.18)+' '+x2+','+y2;
  }
  if(Math.abs(dy)>Math.abs(dx)*1.1){
    const slack=Math.min(18,10+Math.abs(dy)*0.03);
    return 'M'+x1+','+y1+' C'+(x1-slack)+','+(y1+dy*0.45)+' '+(x2-Math.min(52,Math.abs(dx)+18))+','+(y2-dy*0.06)+' '+x2+','+y2;
  }
  const d=Math.hypot(dx,dy), sag=Math.min(56,Math.max(14,d*0.24));
  return 'M'+x1+','+y1+' C'+(x1+dx*0.34)+','+(y1+dy*0.08+sag)+' '+(x2-dx*0.34)+','+(y2-dy*0.08+sag)+' '+x2+','+y2;
}
function centerOf(el,hr){const r=el.getBoundingClientRect();return{x:r.left-hr.left+r.width/2,y:r.top-hr.top+r.height/2};}
function paintCables(){
  $$('[data-cables]').forEach(host=>{
    const svg=$('.cable-layer',host); if(!svg)return;
    const from=$('[data-cable-from]',host);
    if(!from){svg.innerHTML='';return;}
    const hr=host.getBoundingClientRect(), f=centerOf(from,hr);
    const col=from.getAttribute('data-cable-color')||'var(--muted)'; let out='';
    $$('[data-cable-to]',host).forEach(t=>{
      const c=centerOf(t,hr);
      out+='<path class="cable'+(t.hasAttribute('data-ghost')?' ghost':'')+'" stroke="'+col+'" d="'+cablePath(f.x,f.y,c.x,c.y)+'"/>';
    });
    svg.innerHTML=out;
  });
}
function paintPatch(){
  const host=$('.stream'), svg=$('#streamCables');
  $$('.entry').forEach(e=>{e.classList.remove('dimmed');e.classList.remove('patched');});
  if(!host||!svg)return; svg.innerHTML='';
  const id=state.patch; if(!id)return;
  const rel=new Set([id].concat(linksOf(id)));
  const hr=host.getBoundingClientRect();
  const jacks=[];
  $$('.entry',host).forEach(e=>{
    const eid=e.getAttribute('data-ent');
    if(eid&&rel.has(eid)){e.classList.add('patched');const j=$('.jackcell .jack',e);if(j)jacks.push({eid:eid,el:j,ghost:e.hasAttribute('data-ghost')});}
    else e.classList.add('dimmed');
  });
  if(jacks.length<2)return;
  const origin=jacks.find(j=>j.eid===id)||jacks[0], f=centerOf(origin.el,hr); let out='';
  jacks.forEach(j=>{
    if(j.el===origin.el)return;
    const c=centerOf(j.el,hr), col='var(--'+ent(id).src+')';
    out+='<path class="cable'+(j.ghost?' ghost':'')+'" stroke="'+col+'" d="'+cablePath(f.x,f.y,c.x,c.y,'bow')+'"/>';
  });
  svg.innerHTML=out;
}
const repaint=()=>requestAnimationFrame(()=>{paintCables();paintPatch();});

 pickQ(v){state.pickQ=v;const p=state.picker;if(!p)return;
   openOverlay(pickerOverlay(p.title,p.items,p.act),true);
   const i=$('#overlays input');if(i){i.value=v;i.focus();try{i.setSelectionRange(v.length,v.length);}catch(e){}}},

function reopenSearch(){
  const el=$('#q'),pos=el?el.selectionStart:0;
  openOverlay(searchOverlay());
  const n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}

/* ==================================================================== EVENTS */
document.addEventListener('click',e=>{
  const j=e.target.closest('.entry .jackcell .jack');
  if(j){const en=j.closest('.entry').getAttribute('data-ent');
    if(en){state.patchPinned=!(state.patchPinned&&state.patch===en);state.patch=state.patchPinned?en:null;paintPatch();}
    return;}
  const t=e.target.closest('[data-act]');
  if(!t){
    if(e.target.hasAttribute&&e.target.hasAttribute('data-scrim'))closeOverlay();
    else if(state.slashOpen&&!e.target.closest('.composer'))closeSlash();
    return;}
  const a=t.dataset.act;
  if(ACT[a]){e.preventDefault();ACT[a](t.dataset.arg||'',t,e);}
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  const f=CHG[t.dataset.chg];if(f)f(t.type==='checkbox'?t.checked:t.value,t);
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  const k=t.dataset.chg;
  if(k==='q'||k==='pickQ'||k==='draftComment'||k==='draftInterval'||k==='draftDur'||k==='trigBranch'){
    const f=CHG[k];if(f)f(t.value,t);}
});
document.addEventListener('mouseover',e=>{
  if(state.patchPinned)return;
  const j=e.target.closest('.entry .jackcell .jack');if(!j)return;
  const en=j.closest('.entry').getAttribute('data-ent');if(!en||state.patch===en)return;
  state.patch=en;paintPatch();
});
document.addEventListener('mouseout',e=>{
  if(state.patchPinned)return;
  const j=e.target.closest('.entry .jackcell .jack');if(!j)return;
  state.patch=null;paintPatch();
});
document.addEventListener('keydown',e=>{
  const meta=e.metaKey||e.ctrlKey, k=(e.key||'').toLowerCase();
  if(meta&&k==='k'){e.preventDefault();ACT.openSearch();return;}
  if(meta&&k==='t'){e.preventDefault();ACT.toggleTimer();return;}
  if(e.key==='Escape'){
    if($('#overlays').innerHTML){closeOverlay();e.preventDefault();}
    else if(state.slashOpen){closeSlash();e.preventDefault();}
    else if(state.patchPinned){state.patchPinned=false;state.patch=null;paintPatch();e.preventDefault();}
    return;}
  const scrim=$('#overlays [data-scrim]');
  if(scrim&&$('#q')){
    const n=$$('#overlays .res[data-act="openResult"]').length;
    if(e.key==='ArrowDown'){e.preventDefault();state.hl=Math.min(n-1,(state.hl||0)+1);reopenSearch();}
    else if(e.key==='ArrowUp'){e.preventDefault();state.hl=Math.max(0,(state.hl||0)-1);reopenSearch();}
    else if(e.key==='Enter'){const el=$$('#overlays .res[data-act="openResult"]')[state.hl||0];
      if(el){e.preventDefault();ACT.openResult(el.dataset.arg);}}
    return;}
  const c=e.target.closest&&e.target.closest('#composer');
  if(c){
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      const v=c.value.trim();
      if(!v){toast('Nothing to add — the note is empty.','err');return;}
      pushEntry('local','','<div class="mynote" style="width:100%"><p>'+renderMd(v)+'</p>'+
        '<div class="meta"><span class="lbl">note · today '+nowHM()+'</span></div></div>',{cls:'mine'});
      c.value='';closeSlash();toast('Note added to today’s page.');refresh();
    }else if(e.key==='/'&&c.value===''){state.slashOpen=true;setTimeout(renderSlash,0);}
    else if(e.key==='['&&c.value.slice(-1)==='['){
      setTimeout(()=>{state.pickQ='';state.linkFrom=null;
        openOverlay(pickerOverlay('Link an entity into the note',Object.keys(E).filter(k=>E[k].kind),'insertMark'),true);},0);
    }
  }
});
ACT.insertMark=function(a){
  const c=$('#composer');closeOverlay();
  if(c){const e=ent(a);const mark=e.kind==='Page'||e.kind==='Note'?e.title:e.key;
    c.value=c.value.replace(/\[\[$/,'')+'[['+mark+']] ';c.focus();}
};
window.addEventListener('hashchange',()=>{closeOverlay();closeSlash();state.patch=null;state.patchPinned=false;render(true);});
window.addEventListener('resize',repaint);
$('#doc').addEventListener('scroll',()=>{if(state.patch)paintPatch();});
$('#searchOpen').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ACT.openSearch();}});
$('#searchOpen').addEventListener('click',()=>ACT.openSearch());

/* ==================================================================== CLOCK */
setInterval(()=>{
  state.clock++;
  if(state.timer.running){
    const big=$('#elapsedBig'),inl=$('#elapsedInline');
    if(big)big.textContent=elFmt();
    if(inl)inl.textContent=elFmt();
    if(state.clock%60===0){state.tracked++;const tn=$('#trackedNum');if(tn)tn.textContent=dur(state.tracked);}
  }
},1000);

/* ==================================================================== BOOT */
state.openBlocks['PAY-231']=true;
if(!location.hash)location.hash='#/day/2026-08-22';
render(true);
bump(0);
}catch(err){
  const box=document.getElementById('errlog');
  if(box){box.hidden=false;box.id='errlog';box.textContent='init error: '+(err&&err.message)+' | '+(err&&err.stack||'');
    box.style.cssText='position:fixed;left:8px;bottom:34px;z-index:999;background:#D62839;color:#fff;padding:8px 12px;font:12px/1.4 monospace;max-width:70vw;border-radius:4px';}
}
