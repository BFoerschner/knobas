<title>Ticket-first prototype 5</title>
<!--
  knobas mockup: ticket-first workbench, prototype 5 (2026-10-14)
  Adds to prototype 4: Docs redesigned around full-text search over every page and comment, with a
  live preview of each hit, and a reader good enough that nobody needs to open Confluence. The page
  model is generic (spaces, a tree, pages made of blocks) so a Markdown-based wiki can replace Confluence.
  Adds to prototype 3: a reworked Builds view. Pipelines on the left, the selected pipeline's runs on the right,
  a run's steps, full log with search, tests and downloadable artifacts. Run with any branch and parameters.
  The view is written against a generic pipeline and run shape, so other CI systems can fill it.
  Adds to prototype 2: link sets (a named group of repos, build configurations, pages and monitors, applied to a
  ticket by hand, by its epic, by its parent ticket or by its project; computed at read time, never copied), and a
  full Code view (repository files, commits, branches, local changes, compare and create PR, PR review and merge,
  small file edits committed through Gitea). Requirements: requirements.md next to this file.
  Prototype 1 at real scale: 47 repos, 59 build configurations, ~170 tickets, ~90 wiki pages in 5 spaces,
  ~40 monitors, long comment threads (PAY-231 has 23 entries).
  Changes from prototype 1:
   - every full view (Tickets, Code, Builds, Docs, Estate, Inbox, Proposed links, Conversation) has its own filter bar;
     press / to focus it, Esc clears it. Scope: This job / Mine / All.
   - Docs is a full view of its own (spaces, page tree, results).
   - On the job, each section leads with a one-line rollup ("7 configurations: 1 failing, 1 running, 5 passing"),
     lists only what has something to say, and filters in place past 4 rows.
   - Ticket board: columns cap at 8 cards, Done collapses, swimlanes by epic or assignee; the views list is grouped and filterable.
   - Long threads: the job card shows a summary; the conversation is a tab of the job with filters.
  Real items come from mockups/shared/dataset.md + assets.md. The bulk (other repos, configs, pages, tickets, people
  outside Payments) is generated filler for scale.
-->

<style>
:root{
  --paper:#E4E8EC; --sheet:#F7F8F9; --sheet-2:#EEF1F4; --ink:#17212B; --ink-2:#4B5663; --rule:#CBD2D9; --rule-2:#DDE2E7;
  --card:#F2D157; --card-2:#E8C440; --card-ink:#2A230B; --card-ink-2:#5A4D1E;
  --focus:#2F55D4; --mark:#F6E08F;
  --ok:#1F7444; --warn:#8A5600; --err:#B0262A; --info:#2F55D4; --muted:#5F6975;
  --ok-bg:#DDEFE4; --warn-bg:#F6EBD3; --err-bg:#F7DEDD; --info-bg:#DFE6FA; --muted-bg:#E6E9EC;
  --shadow:0 1px 0 rgba(23,33,43,.06), 0 8px 24px -12px rgba(23,33,43,.25);
  --sans:"Archivo", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171C; --sheet:#1A2027; --sheet-2:#212932; --ink:#E4E9EE; --ink-2:#A0ABB7; --rule:#323C47; --rule-2:#28313A;
    --card:#D9B941; --card-2:#C9A930; --card-ink:#1D1806; --card-ink-2:#3F3511;
    --focus:#8AA6FF; --mark:#5C4E17;
    --ok:#6FCF97; --warn:#E5B04D; --err:#FF8A80; --info:#8AA6FF; --muted:#94A0AC;
    --ok-bg:#1B3427; --warn-bg:#3A2E14; --err-bg:#3F1F1F; --info-bg:#1F2A4A; --muted-bg:#262E37;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171C; --sheet:#1A2027; --sheet-2:#212932; --ink:#E4E9EE; --ink-2:#A0ABB7; --rule:#323C47; --rule-2:#28313A;
  --card:#D9B941; --card-2:#C9A930; --card-ink:#1D1806; --card-ink-2:#3F3511;
  --focus:#8AA6FF; --mark:#5C4E17;
  --ok:#6FCF97; --warn:#E5B04D; --err:#FF8A80; --info:#8AA6FF; --muted:#94A0AC;
  --ok-bg:#1B3427; --warn-bg:#3A2E14; --err-bg:#3F1F1F; --info-bg:#1F2A4A; --muted-bg:#262E37;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.mono{font-family:var(--mono);font-size:.9em}
.dim{color:var(--ink-2)}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh}

/* top bar */
.top{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--sheet);border-bottom:1px solid var(--rule);min-width:0}
.brand{font-weight:800;font-variation-settings:"wdth" 70;font-size:19px;margin-right:10px}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.nav a:hover{background:var(--sheet-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sheet-2);box-shadow:inset 0 -2px 0 var(--ink)}
.count{font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;background:var(--muted-bg);color:var(--ink-2)}
.count.err{background:var(--err-bg);color:var(--err)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 10px;color:var(--ink-2);cursor:pointer;min-width:170px}
.search kbd{margin-left:auto}
kbd{font:600 11px var(--mono);padding:1px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;background:var(--sheet);color:var(--ink-2)}
.timer{display:flex;align-items:center;gap:8px;border-radius:4px;padding:4px 4px 4px 10px;background:var(--card);color:var(--card-ink);font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.timer.off{background:var(--sheet-2);color:var(--ink-2)}
.timer .t{font-family:var(--mono);font-size:13px}
.timer .stop{display:grid;place-items:center;width:24px;height:24px;border-radius:3px;background:rgba(0,0,0,.12)}
.timer .stop i{width:9px;height:9px;background:currentColor;border-radius:1px}
.theme{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:4px}
.status{display:flex;gap:18px;align-items:center;padding:5px 14px;font-size:12px;color:var(--ink-2);background:var(--sheet);border-top:1px solid var(--rule);overflow-x:auto;white-space:nowrap}
.status .bad{color:var(--err);font-weight:600}
.status button{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:inherit}
main{overflow:auto;min-height:0;min-width:0}

/* atoms */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap;background:var(--muted-bg);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--err-bg);color:var(--err)} .chip.info{background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.info{background:var(--info)}
.dot.run{background:var(--info);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tag{font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;border:1px dashed var(--ink-2);color:var(--ink-2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);padding:5px 11px;border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sheet-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12.5px}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule);flex:none}
.av.me{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.empty{padding:22px;color:var(--ink-2);text-align:center}
.empty .btn{margin-top:8px}

/* ---------- filter bar (shared) ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 22px;background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.fsearch{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 8px;flex:1 1 220px;max-width:360px;color:var(--ink-2)}
.fsearch:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.fsearch input{border:0;background:none;outline:none;color:var(--ink);flex:1;min-width:0;padding:1px 0}
.fsearch .clear{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 2px;display:none}
.fsearch.has .clear{display:block}.fsearch.has kbd{display:none}
.fchips{display:inline-flex;gap:4px;flex-wrap:wrap}
.fchips button{border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:1px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.fchips button:hover{border-color:var(--ink-2)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.fsel{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2)}
.fsel select{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:2px 6px;color:var(--ink);max-width:180px}
.fsel select.set{border-color:var(--ink);font-weight:600}
.fcount{margin-left:auto;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--sheet);padding:3px 10px;cursor:pointer;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg .jobk{font-family:var(--mono);font-size:11.5px}

/* ---------- tickets ---------- */
.tickets{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;height:100%}
.views{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
.views .vfind{padding:12px 10px 6px}
.views .vfind input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 8px;color:var(--ink)}
.views .vlist{overflow:auto;padding:0 10px 14px;flex:1}
.views h2{font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 8px 4px}
.views a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;text-decoration:none;color:var(--ink)}
.views a:hover{background:var(--sheet-2)}
.views a[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.views a[aria-current="true"] .count{background:rgba(255,255,255,.18);color:inherit}
.views a .count{margin-left:auto}
.views .new{color:var(--ink-2);margin-top:10px}
.board-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.board-head{display:flex;align-items:baseline;gap:12px;padding:14px 22px 10px;flex-wrap:wrap}
.board-head h1{font-size:22px;font-weight:700;font-variation-settings:"wdth" 85;margin:0}
.board-head .q{font:12px var(--mono);color:var(--ink-2)}
.board-head .seg{margin-left:auto;align-self:center}
.lane{padding:4px 22px 14px}
.lane>h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 8px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;align-items:start}
.col h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 2px 8px;color:var(--ink-2)}
.col .stack{display:flex;flex-direction:column;gap:6px;min-height:44px;padding:6px;background:var(--sheet-2);border-radius:6px}
.col .more{border:1px dashed var(--rule);background:none;border-radius:4px;padding:5px;cursor:pointer;color:var(--ink-2);font-size:12.5px}
.col .more:hover{border-color:var(--ink-2);color:var(--ink)}
.tcard{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:5px;padding:8px 10px;cursor:pointer}
.tcard:hover{border-color:var(--ink-2)}
.tcard[aria-selected="true"]{background:var(--card);color:var(--card-ink);border-color:var(--card-2);box-shadow:var(--shadow)}
.tcard[aria-selected="true"] .dim{color:var(--card-ink-2)}
.tcard .k{font:600 12px var(--mono)}
.tcard .s{display:block;margin:2px 0 6px;font-weight:500;line-height:1.3}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.tcard .meta .av{margin-left:auto}
.signal{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.list{padding:0 22px 18px}
.tbl{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.tbl th{font-size:12px;font-weight:600;color:var(--ink-2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);background:var(--sheet-2);white-space:nowrap}
.tbl th button{border:0;background:none;padding:0;cursor:pointer;font-weight:600;color:inherit}
.tbl th button[aria-sort]::after{content:" ▾"}
.tbl th button[aria-sort="ascending"]::after{content:" ▴"}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--sheet-2)}
.tbl tr.row[aria-selected="true"] td{background:var(--card);color:var(--card-ink)}
.tbl tr.row[aria-selected="true"] .dim{color:var(--card-ink-2)}
.tbl .sub{display:block;font-size:12px;color:var(--ink-2)}
.preview{border-left:1px solid var(--rule);background:var(--sheet);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.preview .k{font:600 13px var(--mono);color:var(--ink-2)}
.preview h2{font-size:21px;line-height:1.2;margin:2px 0 0;font-variation-settings:"wdth" 90}
.preview p{margin:0;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin:0}
.facts dt{color:var(--ink-2)} .facts dd{margin:0}
.pane-h{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.rollup{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px}
.rollup div{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--rule-2);font-size:13px;align-items:baseline}
.rollup div:last-child{border-bottom:0}
.rollup b{font-weight:600;color:var(--ink-2);font-size:12px}
.go{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:8px}
.go .btn.primary{justify-content:center;padding:10px;font-size:15px;font-weight:600}
.go small{color:var(--ink-2);text-align:center}

/* ---------- job ---------- */
.ws{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%}
.job{background:var(--card);color:var(--card-ink);padding:26px 22px 18px;overflow:auto;position:relative;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--card-2)}
.job::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.job .back{align-self:flex-start;border:0;background:rgba(0,0,0,.08);padding:3px 9px;border-radius:3px;cursor:pointer;font-size:12.5px;color:var(--card-ink)}
.job .key{font-weight:800;font-variation-settings:"wdth" 62;font-size:64px;line-height:.9;margin:4px 0 0}
.job h1{font-size:20px;line-height:1.2;margin:0;font-weight:600}
.job .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job select{font-weight:600;padding:4px 8px;border-radius:4px;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.35);color:var(--card-ink)}
.job .dim,.job p{color:var(--card-ink-2)}
.job p{margin:0}
.job section{border-top:1px solid rgba(0,0,0,.14);padding-top:12px}
.job h2{font-size:12px;font-weight:600;color:var(--card-ink-2);margin:0 0 6px}
.job .clock{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.08);border-radius:5px;padding:10px 12px;flex-wrap:wrap}
.job .clock .t{font:600 22px var(--mono)}
.job .clock .btn{margin-left:auto;background:var(--card-ink);color:var(--card);border-color:var(--card-ink)}
.job .chip{background:rgba(0,0,0,.1);color:var(--card-ink)}
.job .chip.err{background:var(--err);color:#fff}
.job .last{font-size:13px;background:rgba(255,255,255,.28);border-radius:4px;padding:7px 9px;margin:6px 0 8px}
.job .last b{font-weight:600}
.job .cbtn{background:transparent;border-color:rgba(0,0,0,.3);color:var(--card-ink)}
.job .week{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:6px}
.job .week i{flex:1;background:rgba(0,0,0,.22);border-radius:2px 2px 0 0}
.job .week i.today{background:var(--card-ink)}
.work{overflow:auto;display:flex;flex-direction:column;min-width:0}
.work>*{flex:none}
.wtabs{display:flex;align-items:center;gap:2px;padding:10px 22px 0;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:6}
.wtabs a{padding:8px 12px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.wtabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.conn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);padding:4px 10px;border-radius:4px;cursor:pointer;color:var(--ink-2);font-size:13px;margin-bottom:6px}
.conn:hover{color:var(--ink);border-color:var(--ink-2)}
.conn b{color:var(--ink);font-weight:600}
.conn .p{color:var(--info);font-weight:600}
.wbody{padding:18px 22px 40px;display:flex;flex-direction:column;gap:18px}
.wbody>*{flex:none}
.next{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.next .item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--rule-2);align-items:start}
.next .item:last-child{border-bottom:0}
.next .n{font:700 13px var(--mono);color:var(--ink-2);padding-top:1px}
.next .what{font-weight:600}
.next .why{grid-column:2;color:var(--ink-2);font-size:13px}
.next .acts{display:flex;gap:6px;grid-row:1/span 2;grid-column:3;align-self:center}
.next .item.done{opacity:.55}.next .item.done .what{text-decoration:line-through}
pre.log{margin:6px 0 0;font:12px/1.5 var(--mono);background:var(--paper);border-radius:4px;padding:8px 10px;overflow:auto;color:var(--ink)}
pre.log .f{color:var(--err);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.panel>header{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.panel>header h3{font-size:15px;margin:0;font-weight:700;font-variation-settings:"wdth" 88}
.panel>header .open{margin-left:auto}
.panel .roll{padding:0 12px 9px;font-size:13px;color:var(--ink-2);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.panel .roll .signal{font-size:12.5px}
.open{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);text-decoration:none;padding:3px 7px;border-radius:3px;white-space:nowrap}
.open:hover{background:var(--sheet-2);color:var(--ink)}
.open svg{width:12px;height:12px}
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:9px;padding:7px 12px;border-top:1px solid var(--rule-2);text-decoration:none;min-width:0}
a.r:hover{background:var(--sheet-2)}
.r .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .rend{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.r .sub{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.r .repo{font:11.5px var(--mono);color:var(--ink-2)}
.secfoot{display:flex;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.minif{display:flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:2px 7px;flex:1;min-width:120px;max-width:220px;color:var(--ink-2)}
.minif input{border:0;background:none;outline:none;color:var(--ink);font-size:12.5px;width:100%}
.minif:focus-within{outline:2px solid var(--focus)}
.checkout{margin:0 12px 8px;padding:8px 10px;border-radius:5px;background:var(--sheet-2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px}
.checkout .acts{margin-left:auto;display:flex;gap:6px}
.stale{margin:0 12px 8px;padding:6px 10px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;display:flex;gap:8px;align-items:center}
.stale button{margin-left:auto;border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.bar{display:flex;gap:1px;height:12px;width:96px;flex:none}
.bar i{flex:1;background:var(--ok);border-radius:1px;opacity:.8}
.bar i.d{background:var(--err);opacity:1}.bar i.w{background:var(--warn);opacity:1}.bar i.p{background:var(--rule);opacity:1}
.progress{height:4px;background:var(--rule-2);border-radius:2px;overflow:hidden;width:70px}
.progress i{display:block;height:100%;background:var(--info);width:60%}
.blocked{background:var(--err-bg);color:var(--err);border-radius:6px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.blocked .btn{margin-left:auto}
.note-preview{padding:4px 12px 10px;font-size:13px;color:var(--ink-2)}

/* conversation */
.convo{display:flex;flex-direction:column;gap:10px;max-width:820px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.msg .body{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px 12px}
.msg .who{font-size:12.5px;color:var(--ink-2);margin-bottom:2px;display:flex;gap:8px;align-items:center}
.msg .who b{color:var(--ink);font-weight:600}
.msg.new .body{border-color:var(--info);box-shadow:inset 3px 0 0 var(--info)}
.msg.mention .body{box-shadow:inset 3px 0 0 var(--card-2)}
.msg.event{grid-template-columns:28px 1fr;font-size:12.5px;color:var(--ink-2);align-items:center}
.msg.event .ln{border-top:1px dashed var(--rule);position:relative;height:0;margin-top:2px}
.at{font-weight:600;color:var(--info)}
.fold{align-self:flex-start;margin-left:38px;border:1px dashed var(--rule);background:none;border-radius:4px;padding:5px 12px;cursor:pointer;color:var(--ink-2)}
.fold:hover{border-color:var(--ink-2);color:var(--ink)}
.newline{display:flex;align-items:center;gap:10px;color:var(--info);font-size:12px;font-weight:600;margin-left:38px}
.newline::after{content:"";flex:1;border-top:1px solid var(--info)}
.compose{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px;margin-left:38px}
.compose textarea{min-height:64px;border:1px solid var(--rule);border-radius:4px;padding:8px;background:var(--paper);color:var(--ink);resize:vertical}
.compose .acts{display:flex;gap:6px;justify-content:flex-end}

/* start work */
.steps{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--rule-2);align-items:center}
.step:first-of-type{border-top:0}
.step .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule);font:700 12px var(--mono);color:var(--ink-2)}
.step.done .num{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.step.queued .num{border-color:var(--warn);color:var(--warn)}
.step .field{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step input,.step select{font:13px var(--mono);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:4px 8px;border-radius:4px;width:100%;max-width:400px}
.step select{max-width:260px}
.step .state{grid-row:1/span 2;grid-column:3;font-size:12.5px}
.steps footer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--rule);background:var(--sheet-2);border-radius:0 0 6px 6px;align-items:center;flex-wrap:wrap}

/* full views */
.full{display:flex;flex-direction:column;min-height:100%}
.crumbs{display:flex;align-items:center;gap:8px;padding:9px 22px;background:var(--sheet);border-bottom:1px solid var(--rule-2);font-size:13px;flex-wrap:wrap}
.crumbs .jobchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--card-ink);padding:2px 8px;border-radius:3px;font-weight:600;text-decoration:none;font-family:var(--mono);font-size:12px}
.crumbs .sep{color:var(--ink-2)}
.crumbs .esc{margin-left:auto;color:var(--ink-2)}
.fhead{padding:16px 22px 12px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fhead h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;font-variation-settings:"wdth" 85}
.fhead .sub{color:var(--ink-2);margin-top:4px;font-size:13px}
.fhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs a,.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tabs [aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.fbody{padding:16px 22px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.fbody.one{grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:14px}
.grp{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;margin-bottom:12px;overflow:hidden}
.grp>summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;font-weight:600}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--ink-2);font-size:11px;width:10px}
.grp[open]>summary::before{content:"▾"}
.grp>summary .chips{display:flex;gap:6px;margin-left:auto;font-weight:400}
.grp .tbl{border:0;border-radius:0;border-top:1px solid var(--rule)}
.grp .tbl{table-layout:fixed}.grp .tbl td:nth-child(1){width:30%}.grp .tbl td:nth-child(2){width:20%}.grp .tbl td:nth-child(3){width:24%}.grp .tbl td:nth-child(4){width:18%}.grp .tbl td:nth-child(5){width:8%}
.group-h{font-size:13px;font-weight:600;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.group-h:first-child{margin-top:0}
.diff{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden;font:12.5px/1.6 var(--mono)}
.diff .fh{padding:8px 12px;background:var(--sheet-2);border-bottom:1px solid var(--rule);font-weight:600;display:flex;gap:10px}
.diff .ln{display:grid;grid-template-columns:44px 1fr;white-space:pre}
.diff .ln span:first-child{color:var(--ink-2);text-align:right;padding-right:10px}
.diff .add{background:var(--ok-bg)} .diff .del{background:var(--err-bg)}
.thread{margin:4px 12px 8px 56px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);font:13px/1.45 var(--sans);padding:8px 10px;white-space:normal}
.thread p{margin:2px 0 6px}

/* docs */
.docs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;min-height:0;flex:1}
.spaces{border-right:1px solid var(--rule);background:var(--sheet);padding:12px 10px;overflow:auto}
.spaces a.sp{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;text-decoration:none;cursor:pointer}
.spaces a.sp:hover{background:var(--sheet-2)}
.spaces a.sp[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.spaces a.sp[aria-current="true"] .count{background:rgba(255,255,255,.18);color:inherit}
.spaces a.sp .count{margin-left:auto}
.spaces .sk{font:600 11px var(--mono);color:var(--ink-2);width:36px}
.spaces a.sp[aria-current="true"] .sk{color:inherit}
.tree{list-style:none;margin:0;padding:0 0 0 12px;font-size:13px}
.tree.root{padding:0}
.tree li>a{display:block;padding:3px 8px;border-radius:3px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree li>a:hover{background:var(--sheet-2)}
.tree details>summary{cursor:pointer;padding:3px 8px;border-radius:3px;list-style:none;white-space:nowrap}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"▸ ";color:var(--ink-2)}
.tree details[open]>summary::before{content:"▾ "}
.tree details>summary:hover{background:var(--sheet-2)}
.docmain{padding:0 0 30px;min-width:0}
.path{display:block;font-size:12px;color:var(--ink-2)}

/* inbox */
.inbox{display:flex;flex-direction:column;gap:6px}
.ib{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:2px 14px;padding:10px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;align-items:center}
.ib time{font:12px var(--mono);color:var(--ink-2);grid-row:1/span 2}
.ib .what{font-weight:600}
.ib .ctx{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.ib .acts{grid-row:1/span 2;grid-column:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--sheet);border-left:1px solid var(--rule);z-index:21;transform:translateX(100%);transition:transform .18s ease-out;display:flex;flex-direction:column;box-shadow:var(--shadow);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.drawer header h2{margin:0;font-size:16px}
.drawer .dfilter{padding:0 16px 10px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.drawer .dfilter .fsearch{flex:none}
.drawer .body{overflow:auto;padding:4px 0 20px;flex:1}
.drawer h3{font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 16px 4px;display:flex;gap:6px}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:6px 16px;align-items:center}
.lk:hover{background:var(--sheet-2)}
.lk .how{font-size:12px;color:var(--ink-2)}
.lk .x{opacity:0;border:0;background:none;cursor:pointer;color:var(--ink-2);padding:2px 6px;border-radius:3px}
.lk:hover .x,.lk .x:focus-visible{opacity:1}
.lk .x:hover{background:var(--err-bg);color:var(--err)}
.proposed-box{margin:16px;padding:12px;border:1px dashed var(--info);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.proposed-box .btn{align-self:flex-start}

/* reviewer */
.rv{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100%}
.rvq{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
.rvq .fbar{position:static;border-bottom:1px solid var(--rule);padding:10px 12px}
.rvq .fsearch{max-width:none}
.rvq .ql{overflow:auto;flex:1}
.rvq a{display:grid;grid-template-columns:10px minmax(0,1fr);gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--rule-2);text-decoration:none;font-size:13px}
.rvq a:hover{background:var(--sheet-2)}
.rvq a[aria-current="true"]{background:var(--sheet-2);box-shadow:inset 3px 0 0 var(--ink)}
.rvq a .dot{margin-top:5px}
.rvq a .s{grid-column:2;font-size:12px;color:var(--ink-2)}
.rvq a.decided{opacity:.6}
.review{padding:22px;display:flex;flex-direction:column;gap:16px;max-width:980px}
.review-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.review-top h1{font-size:22px;margin:0;font-variation-settings:"wdth" 85}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);align-items:stretch}
.pend{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pend .kind{font-size:12px;color:var(--ink-2)}
.pend .name{font-size:17px;font-weight:600;line-height:1.25}
.pend .ctx{font-size:12.5px;color:var(--ink-2)}
.bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 10px;position:relative}
.bridge::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--rule)}
.bridge select{position:relative;font-weight:600;padding:5px 8px;border-radius:4px;border:1px solid var(--ink-2);background:var(--sheet);color:var(--ink)}
.strength{position:relative;background:var(--paper);padding:0 6px;font-size:12.5px;font-weight:600}
.strength.strong{color:var(--ok)} .strength.indirect{color:var(--info)} .strength.weak{color:var(--warn)}
.evidence{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.evidence h2{font-size:15px;margin:0}
.evidence .claim{font-size:15px}
.evidence blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--rule);background:var(--sheet-2);border-radius:0 4px 4px 0;font-size:13.5px}
.evidence .sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chain .node{border:1px solid var(--rule);border-radius:4px;padding:4px 9px;background:var(--sheet-2);font-size:13px}
.chain .node.known{border-color:var(--ok);background:var(--ok-bg)}
.chain .edge{font-size:12px;color:var(--ink-2)}
.against{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.against strong{color:var(--ink)}
.decide{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.decide .btn{padding:9px 16px;font-size:14.5px}
.decide .yes{background:var(--ok);border-color:var(--ok);color:var(--sheet);font-weight:600}
.decide .no{color:var(--err);border-color:var(--err)}
.decide .hint{margin-left:auto;font-size:12.5px;color:var(--ink-2)}

/* modal / launcher / toast */
.modal{position:fixed;inset:0;display:none;place-items:start center;padding-top:8vh;z-index:30;background:rgba(10,15,20,.4)}
.modal.on{display:grid}
.dialog{width:min(620px,calc(100vw - 32px));background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--rule);overflow:hidden;max-height:84vh;display:flex;flex-direction:column}
.dialog header{padding:14px 18px;border-bottom:1px solid var(--rule)}
.dialog header h2{margin:0;font-size:17px}
.dialog .body{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dialog footer{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;background:var(--sheet-2)}
.dialog label.ck{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.dialog textarea,.dialog input[type=text]{border:1px solid var(--rule);border-radius:4px;padding:8px;background:var(--paper);color:var(--ink);width:100%}
.launch input{width:100%;border:0;border-bottom:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:17px;padding:16px 18px;outline:none}
.launch .res{max-height:50vh;overflow:auto;padding:6px 0}
.launch .res a{display:flex;gap:10px;align-items:center;padding:7px 18px;text-decoration:none}
.launch .res a[aria-selected="true"]{background:var(--sheet-2);box-shadow:inset 3px 0 0 var(--ink)}
.launch .res .kind{width:62px;font-size:12px;color:var(--ink-2);flex:none}
.launch .res .src{margin-left:auto;font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.placeholder{max-width:620px;margin:60px auto;padding:0 22px}

/* ---------- prototype 3: link sets ---------- */
.via{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule);margin-right:4px}
.setsbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.setchip{display:inline-flex;gap:6px;align-items:baseline;padding:3px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);text-decoration:none}
.setchip:hover{border-color:var(--ink-2)}
.setchip b{font-weight:600}.setchip span{font-size:12px;color:var(--ink-2)}
.member{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--rule-2);font-size:13.5px}
.member .x{margin-left:auto}
.member.q{background:var(--sheet-2)}
.member details{flex:1;min-width:0}
.member details summary{cursor:pointer}
.member details ul{margin:6px 0 2px;padding-left:18px;color:var(--ink-2);font-size:12.5px;columns:2}
.rule{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--rule-2)}
.rule select{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:3px 6px;color:var(--ink);max-width:240px}
.preview-keys{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 12px}
.preview-keys a{font:600 11.5px var(--mono);padding:1px 6px;border-radius:3px;background:var(--sheet-2);text-decoration:none}
.preview-keys a.mine{background:var(--card);color:var(--card-ink)}
.toggle{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.hint-card{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px dashed var(--info);border-radius:6px;background:var(--info-bg);font-size:13.5px;flex-wrap:wrap}
.hint-card .acts{margin-left:auto;display:flex;gap:6px}
.picklist{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border:1px solid var(--rule);border-radius:4px}
.picklist label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.picklist label .dim{margin-left:auto;font-size:12px}
.picklist label.in{opacity:.55}
/* ---------- prototype 3: code ---------- */
.repo{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.ftree{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 0;font-size:13px;position:sticky;top:64px;max-height:calc(100vh - 220px);overflow:auto}
.ftree a{display:block;padding:3px 10px;text-decoration:none;font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftree a:hover{background:var(--sheet-2)}
.ftree a[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.ftree .dir{padding:3px 10px;color:var(--ink-2);font:600 12px var(--mono)}
.ftree .changed::after{content:" M";color:var(--warn);font-weight:700}
.fileview{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden;min-width:0}
.fileview>header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--sheet-2);flex-wrap:wrap}
.fileview>header .p{font:600 13px var(--mono)}
.fileview>header .acts{margin-left:auto;display:flex;gap:6px}
.code{font:12.5px/1.6 var(--mono);overflow:auto;margin:0}
.code .l{display:grid;grid-template-columns:48px 1fr;white-space:pre}
.code .l span:first-child{color:var(--ink-2);text-align:right;padding-right:12px;user-select:none}
.code .l:hover{background:var(--sheet-2)}
.editor{display:grid;grid-template-columns:48px 1fr;font:12.5px/1.6 var(--mono)}
.editor .nums{color:var(--ink-2);text-align:right;padding:8px 12px 8px 0;white-space:pre;user-select:none;background:var(--sheet-2)}
.editor textarea{border:0;outline:none;background:var(--paper);color:var(--ink);font:inherit;padding:8px 10px;resize:vertical;min-height:420px;white-space:pre;overflow:auto;tab-size:4}
.banner{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--rule)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner .acts{margin-left:auto;display:flex;gap:6px}
.diff .ln{grid-template-columns:44px 1fr auto;position:relative}
.diff .ln.hunk{background:var(--info-bg);color:var(--info)}
.diff .addc{opacity:0;border:0;background:var(--info);color:var(--sheet);border-radius:3px;width:18px;height:18px;line-height:16px;cursor:pointer;margin:1px 6px;font:700 13px var(--sans);padding:0}
.diff .ln:hover .addc,.diff .addc:focus-visible{opacity:1}
.diff .fh label{margin-left:auto;font-weight:400;display:flex;gap:5px;align-items:center;font-family:var(--sans);font-size:12.5px}
.diff.viewed .ln{display:none}
.diff+.diff{margin-top:12px}
.newc{margin:4px 12px 8px 56px;display:flex;flex-direction:column;gap:6px;font-family:var(--sans)}
.newc textarea{border:1px solid var(--rule);border-radius:4px;padding:6px 8px;background:var(--paper);color:var(--ink);min-height:54px}
.newc .acts{display:flex;gap:6px;justify-content:flex-end}
.pending{border-color:var(--warn)!important}
.flist{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;font-size:12.5px;position:sticky;top:64px}
.flist a{display:flex;gap:8px;padding:6px 10px;border-top:1px solid var(--rule-2);text-decoration:none;font-family:var(--mono);align-items:center}
.flist a:first-of-type{border-top:0}
.flist a:hover{background:var(--sheet-2)}
.flist .n{margin-left:auto;font-family:var(--sans)}
.flist .viewed{opacity:.5}
.add-n{color:var(--ok);font-weight:600}.del-n{color:var(--err);font-weight:600}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--ink);background:var(--sheet-2)}
.radio small{display:block;color:var(--ink-2)}
.checks{display:flex;flex-direction:column;gap:4px;font-size:13px}
.formgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.formgrid select,.formgrid input[type=text]{border:1px solid var(--rule);border-radius:4px;padding:5px 8px;background:var(--paper);color:var(--ink);width:100%}
.newtag{font-size:11px;font-weight:700;padding:0 5px;border-radius:3px;background:var(--card);color:var(--card-ink);white-space:nowrap}
.openin{display:inline-flex}
.openin .btn:first-child:not(:last-child){border-top-right-radius:0;border-bottom-right-radius:0}
.clonebox{display:flex;gap:8px;align-items:center;background:var(--sheet-2);border:1px solid var(--rule);border-radius:6px;padding:8px 8px 8px 12px}.clonebox code{flex:1;min-width:0;font:12.5px/1.5 var(--mono);overflow-x:auto;white-space:nowrap}
.clonealt{display:flex;gap:8px;flex-wrap:wrap}
.openin .caret{border-top-left-radius:0;border-bottom-left-radius:0;border-left-width:0;padding-left:6px;padding-right:6px}
.openin .btn.ghost.caret{border-left:1px solid var(--rule)}
.appmenu{position:fixed;z-index:45;width:300px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:4px 0}
.appmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:none;padding:6px 12px;text-align:left;cursor:pointer;font-size:13px;color:var(--ink)}
.appmenu button:hover,.appmenu button:focus-visible{background:var(--sheet-2);outline:none}
.appmenu .mono{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.appmenu hr{border:0;border-top:1px solid var(--rule-2);margin:4px 0}
.phs{display:flex;flex-wrap:wrap;gap:6px}
.phb{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.phb .mono{color:var(--ink);font-weight:600}
/* ---------- prototype 5: docs ---------- */
:root{--read:"Source Serif 4",Georgia,serif}
.dx-home{max-width:1180px;margin:0 auto;padding:30px 28px 48px}
.dx-home h1{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 10px}
.dx-q{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:11px 14px;box-shadow:var(--shadow)}
.dx-q svg{flex:none;color:var(--ink-2)}
.dx-q input{flex:1;min-width:0;border:0;background:none;outline:none;font:500 19px var(--sans);color:var(--ink)}
.dx-q:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.dx-hint{font-size:12.5px;color:var(--ink-2);margin:9px 2px 0;display:flex;gap:6px 16px;flex-wrap:wrap}
.dx-hint button{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.dx-hint code,.dx-hint button code{font:12px var(--mono);background:var(--sheet-2);padding:0 4px;border-radius:3px;color:var(--ink)}
.dx-cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;margin-top:30px}
.dx-sec{margin-bottom:28px}
.dx-sec h2{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.dx-li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 14px;padding:10px 0;border-top:1px solid var(--rule-2);text-decoration:none}
.dx-li:hover .t{text-decoration:underline;text-underline-offset:3px}
.dx-li .t{font-family:var(--read);font-size:17px;font-weight:600;line-height:1.3}
.dx-li .p{font-size:12px;color:var(--ink-2)}
.dx-li .m{font-size:12px;color:var(--ink-2);text-align:right;grid-row:1/span 2;grid-column:2;white-space:nowrap}
.dx-li .why{font-size:12.5px;color:var(--warn);font-weight:600}
.dx-spaces a{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--rule-2);text-decoration:none;align-items:baseline}
.dx-spaces a:hover b{text-decoration:underline}
.dx-spaces .k{font:600 12px var(--mono);color:var(--ink-2)}
.dx-spaces .n{font-size:12px;color:var(--ink-2)}
.dx-search{display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,45%);grid-template-rows:auto minmax(0,1fr);height:100%}
.dx-top{grid-column:1/-1;padding:10px 18px;border-bottom:1px solid var(--rule);background:var(--sheet);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dx-top .dx-q{flex:1 1 420px;box-shadow:none;padding:6px 12px}
.dx-top .dx-q input{font-size:16px}
.dx-facets{border-right:1px solid var(--rule);padding:6px 12px 20px;overflow:auto;background:var(--sheet);font-size:13px;min-height:0}
.dx-facets h3{font-size:12px;color:var(--ink-2);margin:14px 6px 4px;font-weight:600}
.dx-facets button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:none;padding:4px 6px;border-radius:3px;cursor:pointer;color:var(--ink);font-size:13px;text-align:left}
.dx-facets button:hover{background:var(--sheet-2)}
.dx-facets button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.dx-facets button .c{color:var(--ink-2);font-size:12px}
.dx-facets button[aria-pressed="true"] .c{color:inherit}
.dx-facets button[disabled]{opacity:.45;cursor:default}
.dx-results{overflow:auto;min-height:0}
.dx-meta{padding:9px 18px;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.dx-meta select{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:2px 6px;color:var(--ink)}
.dx-r{display:block;padding:12px 18px 13px;border-bottom:1px solid var(--rule-2);text-decoration:none;cursor:pointer}
.dx-r:hover{background:var(--sheet-2)}
.dx-r[aria-selected="true"]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--ink)}
.dx-r .pth{font-size:12px;color:var(--ink-2)}
.dx-r .t{font-family:var(--read);font-size:18px;font-weight:600;line-height:1.3;margin-top:1px}
.dx-r .snip{font-family:var(--read);font-size:15px;line-height:1.5;margin-top:4px}
.dx-r .snip .in{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--ink-2);margin-right:6px}
.dx-r .foot{font-size:12px;color:var(--ink-2);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dx-prev{border-left:1px solid var(--rule);overflow:auto;background:var(--sheet);min-height:0}
.dx-prevbar{position:sticky;top:0;background:var(--sheet);border-bottom:1px solid var(--rule);padding:8px 16px;display:flex;gap:8px;align-items:center;z-index:2;flex-wrap:wrap}
.dx-prevbar .nav2 button{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;cursor:pointer;width:26px;height:26px}
.dx-prev .doc{font-size:15.5px;padding:6px 22px 40px}
.dx-prev .doc h2{font-size:20px;margin-top:22px}
.dx-empty{padding:40px 24px;color:var(--ink-2);max-width:56ch}
.dx-empty h2{font-family:var(--read);color:var(--ink);font-size:22px;margin:0 0 8px}
.rd{display:grid;grid-template-columns:320px minmax(0,1fr) 250px;height:100%}
.rd-tree{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
.dl-head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
.dl-head .dl-scope{display:flex}.dl-head .dl-scope button{flex:1}
.jr-why{display:inline-block;font-size:11.5px;color:var(--card-ink-2);background:color-mix(in srgb,var(--card) 45%,transparent);border-radius:3px;padding:0 6px;margin-left:6px;white-space:nowrap}
.dl-head select{font:600 14px var(--sans);border:1px solid var(--rule);border-radius:5px;padding:6px 8px;background:var(--paper);color:var(--ink);width:100%}
.dl-head .fsearch{max-width:none;flex:none;padding:6px 9px}
.dl-hint{font-size:11.5px;color:var(--ink-2)}
.dl-hint code{font:11px var(--mono);background:var(--sheet-2);padding:0 3px;border-radius:2px;color:var(--ink)}
.dl-body{overflow:auto;flex:1;padding:6px 0 12px}
.dl-foot{padding:10px 12px;border-top:1px solid var(--rule-2)}
.dl-meta{padding:6px 14px 8px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--rule-2)}
.rd-tree a.dl-hit{display:flex;flex-direction:column;gap:2px;padding:9px 14px;white-space:normal;overflow:visible;border-bottom:1px solid var(--rule-2);text-decoration:none}
.dl-hit:hover{background:var(--sheet-2)}
.rd-tree a.dl-hit[aria-current="true"]{background:var(--paper);color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.rd-tree a.dl-hit[aria-current="true"] .pth,.rd-tree a.dl-hit[aria-current="true"] .n{color:var(--ink-2)}
.dl-hit .t{font-family:var(--read);font-size:15.5px;font-weight:600;line-height:1.3}
.dl-hit .pth,.dl-hit .n{font-size:11.5px;color:var(--ink-2)}
.dl-hit .sn{font-family:var(--read);font-size:13.5px;line-height:1.45}
.dl-hit .sn b{font-family:var(--sans);font-size:11.5px;color:var(--ink-2)}
.dl-for{padding:2px 0 8px;margin-bottom:6px;border-bottom:1px solid var(--rule-2)}
.dl-for h4{font-size:12px;font-weight:600;color:var(--ink-2);margin:6px 12px 2px}
.rd-tree .dl-for a{white-space:normal}
.dl-for .why{display:block;font-size:11.5px;color:var(--warn);font-weight:600}
.rd-tree a[aria-current="true"] .why{color:inherit}
.rd-tree summary.spc{font-weight:600;color:var(--ink-2);margin-top:4px}
.rd-tree .tf{padding:0 12px 8px}
.rd-tree .tf .fsearch{max-width:none}
.rd-tree a{display:block;padding:4px 12px;text-decoration:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-tree a:hover{background:var(--sheet-2)}
.rd-tree a[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.rd-tree .sp{font-size:12px;font-weight:600;color:var(--ink-2);padding:4px 12px 6px;display:flex;justify-content:space-between}
.rd-tree details>summary{list-style:none;cursor:pointer;padding:4px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-tree details>summary::-webkit-details-marker{display:none}
.rd-tree details>summary::before{content:"▸ ";color:var(--ink-2);font-size:10px}
.rd-tree details[open]>summary::before{content:"▾ "}
.rd-tree details>summary:hover{background:var(--sheet-2)}
.rd-tree details>summary.cur{background:var(--ink);color:var(--sheet)}
.rd-tree details a{padding-left:28px}
.rd-tree summary a.sl{display:inline;padding:0;color:inherit}
.rd-tree summary.cur a.sl{color:var(--sheet)}
.rd-main{overflow:auto;min-height:0}
.rd-page{max-width:74ch;margin:0 auto;padding:22px 32px 90px}
.rd-crumb{font-size:12.5px;color:var(--ink-2)}
.rd-crumb a{color:inherit}
.rd-title{font-family:var(--read);font-size:40px;line-height:1.1;font-weight:600;margin:8px 0 10px;letter-spacing:-.01em}
.rd-meta{font-size:13px;color:var(--ink-2);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.rd-acts{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.rd-rail{border-left:1px solid var(--rule);overflow:auto;padding:18px 16px;font-size:13px;display:flex;flex-direction:column;gap:22px;min-height:0}
.rd-rail h3{font-size:12px;color:var(--ink-2);margin:0 0 6px;font-weight:600}
.toc a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--rule);text-decoration:none;color:var(--ink-2);font-size:13px}
.toc a.on{border-left-color:var(--ink);color:var(--ink);font-weight:600}
.toc a .hits{font-size:11px;font-weight:700;color:var(--card-ink);background:var(--card);border-radius:8px;padding:0 5px;margin-left:4px}
.rail-list a,.rail-list div{display:block;padding:4px 0;text-decoration:none;line-height:1.35}
.rail-list .s{display:block;font-size:12px;color:var(--ink-2)}
.findbar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;background:var(--card);color:var(--card-ink);padding:6px 16px;font-size:13px}
.findbar input{border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.45);border-radius:4px;padding:3px 8px;color:var(--card-ink);min-width:200px}
.findbar button{border:1px solid rgba(0,0,0,.25);background:transparent;border-radius:3px;cursor:pointer;min-width:26px;height:26px;color:inherit}
.doc{font-family:var(--read);font-size:17.5px;line-height:1.65;color:var(--ink)}
.doc h2{font-family:var(--read);font-size:25px;line-height:1.25;margin:36px 0 10px;font-weight:600;scroll-margin-top:50px}
.doc h2 .tools{font-family:var(--sans);font-size:12px;font-weight:400;opacity:0;margin-left:10px;vertical-align:4px;display:inline-flex;gap:4px}
.doc h2:hover .tools,.doc h2 .tools:focus-within{opacity:1}
.doc h2 .tools a,.doc h2 .tools button{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:1px 7px;cursor:pointer;color:var(--ink-2);text-decoration:none;font:inherit}
.doc p{margin:0 0 15px}
.doc ul,.doc ol{margin:0 0 15px;padding-left:24px}
.doc li{margin:4px 0}
.doc code{font:.82em var(--mono);background:var(--sheet-2);padding:1px 5px;border-radius:3px}
.doc pre{font:13.5px/1.55 var(--mono);background:var(--sheet-2);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;overflow:auto;position:relative;margin:0 0 18px}
.doc pre .copy{position:absolute;top:6px;right:6px;font:12px var(--sans)}
.doc pre .lang{position:absolute;bottom:4px;right:10px;font:11px var(--sans);color:var(--ink-2)}
.doc table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14.5px;line-height:1.45;margin:0 0 18px}
.doc th,.doc td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--sheet-2);font-weight:600}
.callout{display:flex;gap:10px;border-radius:6px;padding:11px 14px;margin:0 0 18px;font-family:var(--sans);font-size:15px;line-height:1.5;border-left:4px solid}
.callout.info{background:var(--info-bg);border-color:var(--info)}
.callout.warn{background:var(--warn-bg);border-color:var(--warn)}
.callout.note{background:var(--sheet-2);border-color:var(--ink-2)}
.callout .lbl{font-weight:700;white-space:nowrap}
.macro{border:1px dashed var(--ink-2);border-radius:6px;padding:10px 14px;font-family:var(--sans);font-size:14px;color:var(--ink-2);margin:0 0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tchip{display:inline-flex;gap:5px;align-items:baseline;font-family:var(--sans);font-size:13.5px;padding:0 6px;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);text-decoration:none;white-space:nowrap;line-height:1.5}
.tchip .k{font:600 12px var(--mono)}
.tchip .chip{font-size:11px;padding:0 5px}
.ment{font-family:var(--sans);font-size:.85em;font-weight:600;color:var(--info);background:var(--info-bg);padding:0 4px;border-radius:3px}
.ment.me{background:var(--card);color:var(--card-ink)}
.doc a.pgl{color:var(--info);text-decoration:underline;text-underline-offset:2px}
.doc mark.cur,.dx-prev mark.cur{outline:2px solid var(--ink);outline-offset:1px}
.sec-edit{border:1.5px solid var(--ink);border-radius:6px;padding:10px;margin:0 0 18px;font-family:var(--sans);background:var(--sheet)}
.sec-edit textarea{width:100%;min-height:150px;font:16px/1.6 var(--read);border:1px solid var(--rule);border-radius:4px;padding:10px;background:var(--paper);color:var(--ink);resize:vertical}
.sec-edit .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;align-items:center}
.cmts{border-top:1px solid var(--rule);margin-top:44px;padding-top:18px;font-family:var(--sans)}
.cmts h2{font-size:16px;margin:0 0 12px}
@media (max-width:1240px){.dx-search{grid-template-columns:190px minmax(0,1fr)}.dx-prev{display:none}.rd{grid-template-columns:220px minmax(0,1fr)}.rd-rail{display:none}}
@media (max-width:900px){.dx-search,.rd,.dx-cols{grid-template-columns:minmax(0,1fr);height:auto}.dx-facets,.rd-tree{display:none}.rd-page{padding:18px 16px 60px}.rd-title{font-size:30px}}
/* ---------- assets ---------- */
.as{display:grid;grid-template-columns:360px minmax(0,1fr);height:100%}
.as-tree{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
.as-tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule-2)}
.as-tools .seg{align-self:flex-start}
.as-tools .fsearch{flex:none}
.as-list{overflow:auto;flex:1;padding:4px 0 12px}
.as-row{display:flex;gap:8px;align-items:baseline;padding:4px 12px;text-decoration:none;font-size:13px;flex-wrap:wrap}
.as-row:hover{background:var(--sheet-2)}
.as-row.cur{background:var(--ink);color:var(--sheet)}
.as-row.cur .ty,.as-row.cur .nomon{color:inherit;opacity:.8}
.as-row[data-dim]{opacity:.55}
.as-row .nm{font-family:var(--mono);font-size:12.5px}
.as-row .ty{font-size:11.5px;color:var(--ink-2)}
.as-row .chip{font-size:10.5px;padding:0 5px}
.as-row .nomon{font-size:11px;color:var(--ink-2);border:1px dashed var(--rule);border-radius:3px;padding:0 4px}
.as-foot{padding:10px 12px;border-top:1px solid var(--rule-2);display:flex;gap:6px}
.as-main{overflow:auto;min-width:0}
.as-health{margin:0 22px;padding:9px 14px;border-radius:6px;display:flex;gap:12px;align-items:baseline;font-weight:700;font-size:14px;background:var(--ok-bg);color:var(--ok)}

.ma-stn.start i{background:var(--card);border-color:var(--card-ink)}
.ma-stn.grp i{border-style:double;border-width:4px;border-color:var(--muted)}
.ma-stn.grp b{color:var(--ink-2)}
.ma-stn.end i{width:16px;height:16px;margin:-2px 0 3px}
.ma-stn.end.t-err i{background:var(--err);border-color:var(--err)}
.ma-stn.end.t-warn i{background:var(--warn);border-color:var(--warn)}
.ma-stn b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ma-stn small{font-size:11px;color:var(--muted)}
.ma-stn:hover b{text-decoration:underline}
.ma-stn.on b{color:var(--focus)}
.ma-stn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.ma-hop{flex:1 1 30px;min-width:64px;height:12px;position:relative;margin:0 6px}
.ma-hop::before{content:'';position:absolute;left:0;right:0;top:5px;border-top:2.5px solid var(--ink-2)}
.ma-hop.s-set::before{border-top-style:dotted}
.ma-hop.s-proposed::before{border-top:2.5px dashed var(--info)}
.ma-hop em{position:absolute;bottom:12px;left:-4px;right:-4px;text-align:center;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma-trail.t-err .ma-hop:last-of-type::before{border-top-color:var(--err)}
.ma-trail.t-warn .ma-hop:last-of-type::before{border-top-color:var(--warn)}
.ma-line.v{flex-direction:column;padding:4px 0 4px 2px;overflow:visible}
.ma-line.v .ma-stn{flex-direction:row;align-items:center;gap:8px;max-width:100%}
.ma-line.v .ma-stn i{margin:0;flex:none}
.ma-line.v .ma-stn.end i{margin:0 -2px}
.ma-line.v .ma-stn b{max-width:180px}
.ma-line.v .ma-hop{flex:none;height:auto;min-height:20px;margin:0 0 0 5px;padding:1px 0 1px 15px}
.ma-line.v .ma-hop::before{top:0;bottom:0;left:0;right:auto;border-top:0;border-left:2.5px solid var(--ink-2)}
.ma-line.v .ma-hop.s-set::before{border-left-style:dotted}
.ma-line.v .ma-hop.s-proposed::before{border-left:2.5px dashed var(--info)}
.ma-line.v .ma-hop em{position:static;text-align:left;display:block}

/* Map 2: trails */
.ma-hero h2{font-size:30px;font-stretch:78%;font-weight:700;letter-spacing:-.01em;margin:6px 0 4px;line-height:1.1}
.ma-hero p{margin:0 0 16px;color:var(--ink-2);font-size:14px;max-width:70ch}
.ma-trails{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:10px}
.ma-trail{background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--warn);border-radius:6px;padding:12px 16px 10px}
.ma-trail.t-err{border-left-color:var(--err)}
.ma-trail.on{box-shadow:0 0 0 2px var(--focus)}
.ma-thd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ma-sev{font-size:12px;font-weight:700;color:var(--warn)}
.ma-trail.t-err .ma-sev{color:var(--err)}
.ma-name{all:unset;cursor:pointer;font-size:16px;font-weight:600}
.ma-name:hover{text-decoration:underline}
.ma-why{color:var(--ink-2);font-size:13px}
.ma-tf{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--rule-2)}
.ma-tacts{margin-left:auto;display:flex;gap:6px}
.ma-h3{font-size:14px;margin:20px 0 8px}
.ma-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 24px}
.ma-li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule-2);font-size:13px;flex-wrap:wrap}
.ma-li>.btn{margin-left:auto}
.ma-fine{margin-top:20px;font-size:13px}
.ma-fine summary{cursor:pointer;color:var(--ink-2);padding:4px 0}
.ma-fine .ma-li b{width:110px;flex:none}
.ma-fine .ma-li span{flex:1;min-width:0}

/* Map 3: outline */
.ma-obar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ma-obar .fsearch{flex:0 1 260px}
.ma-oacts{margin-left:auto;display:flex;gap:4px}
.ma-ocount{font-size:12.5px;color:var(--muted)}
.ma-tree{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:6px 0;font-size:13px}
.ma-row{display:flex;align-items:center;gap:8px;padding:0 12px;height:30px;cursor:pointer;white-space:nowrap;min-width:0}
.ma-row:hover{background:var(--sheet-2)}
.ma-row:focus{outline:none;box-shadow:inset 3px 0 0 var(--focus);background:var(--sheet-2)}
.ma-row.on{background:var(--info-bg)}
.ma-row.root .ma-nm{background:var(--card);color:var(--card-ink);padding:0 6px;border-radius:3px;font-weight:600}
.ma-row.ctx{opacity:.55}
.ma-row.hit .ma-nm{font-weight:600}
.ma-ind{flex:none;align-self:stretch;background:repeating-linear-gradient(to right,transparent 0 6px,var(--rule) 6px 7px,transparent 7px 22px)}
.ma-tw{width:14px;flex:none;color:var(--ink-2);text-align:center}
.ma-rel{color:var(--muted);font-size:12px}
.ma-rel.s-set{font-style:italic}
.ma-rel.s-proposed{color:var(--info)}
.ma-k{color:var(--ink-2);font-size:12px}
.ma-nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ma-roll{font-size:11.5px;font-weight:600;color:var(--err);background:var(--err-bg);padding:0 8px;border-radius:9px}
.ma-roll.ok{color:var(--muted);background:var(--muted-bg);font-weight:400}
.ma-gap{flex:1}
.ma-env{font-size:11.5px;color:var(--muted)}
.ma-tsep{padding:12px 12px 4px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule-2);margin-top:6px}
.ma-keys{font-size:12px;margin:8px 0 0}

/* Map 4: layers */
.ma-health{display:flex;gap:3px;margin-bottom:6px;height:32px}
.ma-hseg{all:unset;cursor:pointer;flex-basis:auto!important;flex-shrink:0!important;display:flex;align-items:center;gap:5px;padding:0 10px;font-size:12px;white-space:nowrap;overflow:hidden;border-radius:4px;min-width:0}
.ma-hseg.t-err{background:var(--err);color:var(--sheet)}
.ma-hseg.t-warn{background:var(--warn-bg);color:var(--warn)}
.ma-hseg.t-info{background:var(--info-bg);color:var(--info)}
.ma-hseg.t-ok{background:var(--ok-bg);color:var(--ok)}
.ma-hseg.t-none{background:repeating-linear-gradient(135deg,var(--sheet) 0 6px,var(--sheet-2) 6px 12px);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.ma-hseg.t-plain{background:var(--muted-bg);color:var(--muted)}
.ma-hseg.on{outline:2px solid var(--ink);outline-offset:1px}
.ma-hseg:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.ma-layers{position:relative}
.ma-wires{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.ma-wires path{fill:none;stroke:var(--ink);stroke-width:1.6;opacity:.7}
.ma-wires path.s-set{stroke-dasharray:2 3}
.ma-wires path.s-proposed{stroke:var(--info);stroke-dasharray:6 4;opacity:1}
.ma-band{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.ma-band header h3{font-size:14px;margin:0 0 2px}
.ma-band header span,.ma-band header b{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.ma-band header b.t-err{color:var(--err);margin-top:4px}
.ma-band header .ok{color:var(--ok);margin-top:4px}
.ma-tiles{display:flex;flex-wrap:wrap;gap:8px 10px}
.ma-tile{all:unset;cursor:pointer;box-sizing:border-box;width:174px;padding:7px 10px 8px;border-radius:5px;background:var(--sheet);border:1px solid var(--rule);display:flex;flex-direction:column;gap:1px;position:relative;z-index:1;transition:opacity .12s}
.ma-tk{font-size:11px;color:var(--muted)}
.ma-tn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma-tw2{font-size:11.5px;color:var(--ink-2)}
.ma-tile.t-err{background:var(--err);border-color:var(--err);color:var(--sheet)}
.ma-tile.t-err .ma-tk,.ma-tile.t-err .ma-tw2{color:var(--sheet);opacity:.85}
.ma-tile.t-warn{background:var(--warn-bg);border-color:var(--warn)}
.ma-tile.t-warn .ma-tw2{color:var(--warn);font-weight:600}
.ma-tile.t-info{border-color:var(--info)}
.ma-tile.t-info .ma-tw2{color:var(--info)}
.ma-tile.t-ok .ma-tw2{color:var(--ok)}
.ma-tile.t-none{background:repeating-linear-gradient(135deg,var(--sheet) 0 6px,var(--sheet-2) 6px 12px);border-style:dashed;border-color:var(--muted)}
.ma-tile.root{background:var(--card);color:var(--card-ink);border-color:var(--card-2)}
.ma-tile.root .ma-tk{color:var(--card-ink-2)}
.ma-tile.loose{outline:1.5px dashed var(--muted);outline-offset:3px}
.ma-tile.on{box-shadow:0 0 0 2px var(--focus)}
.ma-tile.dim{opacity:.2}
.ma-tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Map 5: distance */
.ma-radar svg{display:block;margin:0 auto;font-family:var(--sans);height:auto}
.ma-ring{fill:none;stroke:var(--rule);stroke-dasharray:2 4}
.ma-ring.loose{stroke:var(--muted);stroke-dasharray:6 5}
.ma-rl{font-size:10px;fill:var(--muted)}
.ma-re{stroke:var(--rule);stroke-width:1.3;fill:none}
.ma-re.s-set{stroke-dasharray:2 3}
.ma-re.s-proposed{stroke:var(--info);stroke-dasharray:6 4}
.ma-re.lit{stroke:var(--ink);stroke-width:2.4}
.ma-rn{cursor:pointer}
.ma-rn circle{fill:var(--ink-2);stroke:var(--sheet);stroke-width:1.5}
.ma-rn.t-err circle{fill:var(--err)}.ma-rn.t-warn circle{fill:var(--warn)}.ma-rn.t-info circle{fill:var(--info)}.ma-rn.t-ok circle{fill:var(--ok)}
.ma-rn.t-none circle{fill:var(--sheet);stroke:var(--muted);stroke-dasharray:2 2}
.ma-rn circle.halo{fill:var(--err-bg);stroke:none}
.ma-rn.t-warn circle.halo{fill:var(--warn-bg)}
.ma-rn text{font-size:11px;fill:var(--ink-2);display:none}
.ma-rn.bad text,.ma-rn.lit text,.ma-rn.on text,.ma-rn:hover text,.ma-rn:focus-visible text,.ma-radar.names .ma-rn text{display:inline}
.ma-rn.lit text{fill:var(--ink);font-weight:600}
.ma-rbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-bottom:4px}
.ma-rn.bad text{fill:var(--ink);font-weight:700;font-size:12px}
.ma-rn.loose text{font-style:italic}
.ma-rn.dim{opacity:.22}
.ma-rn.on circle:not(.halo){stroke:var(--focus);stroke-width:3}
.ma-rn:focus{outline:none}.ma-rn:focus-visible circle:not(.halo){stroke:var(--focus);stroke-width:3}
.ma-rc{cursor:pointer}.ma-rc circle{fill:var(--card);stroke:var(--card-2);stroke-width:2}
.ma-rc text{font-weight:700;font-size:11.5px;fill:var(--card-ink);font-family:var(--mono)}
.ma-rleg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);justify-content:center;margin-top:8px}
.ma-rleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--ink-2)}
.ma-rleg i.t-err{background:var(--err)}.ma-rleg i.t-warn{background:var(--warn)}.ma-rleg i.t-info{background:var(--info)}.ma-rleg i.t-ok{background:var(--ok)}.ma-rleg i.t-none{background:none;border:1px dashed var(--muted)}
.ma-near{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-2);width:100%}
.ma-near:hover .mono{text-decoration:underline}
.ma-near:focus-visible{outline:2px solid var(--focus)}
.ma-dn{font-size:28px;font-stretch:75%;font-weight:700;width:30px;text-align:right;color:var(--err);flex:none}
.ma-near.t-warn .ma-dn{color:var(--warn)}
.ma-near small{display:block;color:var(--muted);font-size:12px}

/* Map 6: ask */
.ma-ask{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:1250px){.ma-ask{grid-template-columns:240px minmax(0,1fr)}.ma-ask .ma-side{grid-column:1/-1;position:static}}
@media (max-width:760px){.ma-ask{grid-template-columns:minmax(0,1fr)}}
.ma-qs{display:flex;flex-direction:column;gap:2px}
.ma-qs>button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;font-size:13.5px;color:var(--ink-2);line-height:1.35}
.ma-qs>button:hover{background:var(--sheet-2);color:var(--ink)}
.ma-qs>button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.ma-qs>button:focus-visible{outline:2px solid var(--focus)}
.ma-find{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.ma-find .fsearch{width:100%;box-sizing:border-box}
.ma-hit{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.ma-hit>span:last-child{display:flex;gap:4px;flex-wrap:wrap}
.ma-q{font-size:13px;color:var(--muted);margin:4px 0 8px}
.ma-say{font-size:23px;line-height:1.4;font-stretch:88%;font-weight:500;margin:0 0 18px;max-width:48ch}
.ma-say .linkish{font-size:inherit;color:inherit;font-weight:650;text-decoration-thickness:1px;text-underline-offset:4px}
.ma-proof .ma-line{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:22px 14px 10px;margin-bottom:8px}
.ma-arg{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:14px}
.ma-alist{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:2px 14px;margin-top:8px}
.ma-alist .ma-li:last-child{border-bottom:0}

/* Map 7: where it runs */
.ma-road{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 16px 14px;margin-bottom:18px}
.ma-road-h{display:flex;gap:10px;align-items:baseline;font-size:13px;margin-bottom:10px}
.ma-road ol{list-style:none;margin:0;padding:0;display:flex}
.ma-road li{flex:1;min-width:0;position:relative;padding-top:20px}
.ma-road li::before{content:'';position:absolute;top:5px;left:0;right:0;border-top:3px solid var(--rule)}
.ma-road li.mine::before{border-color:var(--card-2)}
.ma-road li::after{content:'';position:absolute;top:0;left:0;width:13px;height:13px;border-radius:50%;background:var(--sheet);border:3px solid var(--muted);box-sizing:border-box}
.ma-road li.mine::after{border-color:var(--card-ink);background:var(--card)}
.ma-road li.t-info::after{border-color:var(--info);background:var(--info-bg)}
.ma-road li.t-err::after{border-color:var(--err);background:var(--err)}
.ma-road li button,.ma-road li>span{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding-right:12px;max-width:100%}
.ma-road li button:focus-visible{outline:2px solid var(--focus)}
.ma-road li b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma-road li small{font-size:11.5px;color:var(--muted)}
.ma-road li.notmine small:last-child{color:var(--ink-2);font-weight:600}
.ma-road-say{margin:12px 0 0;font-size:14px}
.ma-envs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.ma-env-col h3{font-size:24px;font-stretch:75%;font-weight:700;margin:0 0 10px;padding-bottom:4px;border-bottom:3px solid var(--ink)}
.ma-env-col.shared h3{border-bottom-color:var(--rule);color:var(--ink-2)}
.ma-svc{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px;margin-bottom:12px}
.ma-wr{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding:6px 9px;border-radius:5px;border:1px solid var(--rule-2);background:var(--paper)}
.ma-wk{grid-column:1;font-size:11px;color:var(--muted)}
.ma-wn{grid-column:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma-wr .ma-state{grid-column:2;grid-row:1/3;align-self:center}
.ma-wr.main{border:1.5px solid var(--ink-2)}
.ma-wr.t-err{border-color:var(--err);background:var(--err-bg)}
.ma-wr.t-warn{border-color:var(--warn);background:var(--warn-bg)}
.ma-wr.on{box-shadow:0 0 0 2px var(--focus)}
.ma-wr:focus-visible{outline:2px solid var(--focus)}
.ma-down{font-size:11px;color:var(--muted);padding:3px 0 3px 12px;margin-left:12px;border-left:2px solid var(--rule)}
.ma-dep{font-size:12px;color:var(--ink-2);margin:6px 2px;line-height:1.45}
.ma-dep.prop{color:var(--info)}
.ma-none{font-size:12px;color:var(--muted);margin:0 0 6px}
.ma-stray{border:1.5px dashed var(--rule);border-radius:8px;padding:10px;font-size:12.5px;color:var(--ink-2)}
.ma-stray p{margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.ma-tile{transition:none}}
/* ---- Dependencies */
.dp-page .fhead .acts{display:flex;gap:6px}
.dp-page #dpx{padding:0 22px 40px}
.dp-bar{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.dp-scope{font-size:13px;color:var(--ink-2)}
.dp-viewbtn b{font-weight:600}
.dp-dirty{font-size:11px;color:var(--warn);background:var(--warn-bg);padding:0 6px;border-radius:8px;margin-left:4px}
.dp-q{flex:0 1 300px}
.dp-qn{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-right:4px}
.dp-n{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:var(--err);color:var(--sheet);font-size:11px;font-weight:700;text-align:center;margin-left:2px}
.dp-gap{flex:1}
.dp-big{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin:-2px 0 10px}
.dp-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:start}
.dp-grid.with-panel{grid-template-columns:190px minmax(0,1fr) 360px}
@media (max-width:1180px){.dp-grid.with-panel{grid-template-columns:minmax(0,1fr) 340px}.dp-grid.with-panel .dp-rail{display:none}}
@media (max-width:820px){.dp-grid,.dp-grid.with-panel{grid-template-columns:minmax(0,1fr)}.dp-rail{position:static!important}}
.dp-rail{position:sticky;top:8px;font-size:13px;display:flex;flex-direction:column;gap:1px}
.dp-rh{font-size:12px;color:var(--muted);margin:2px 0 4px}
.dp-rl{display:flex;align-items:center;gap:6px;padding:3px 0}
.dp-rl button{all:unset;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-rl button:hover{text-decoration:underline}
.dp-rl button:focus-visible{outline:2px solid var(--focus)}
.dp-rl.off button{color:var(--muted)}
.dp-rc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dp-rb{font-size:11px;color:var(--sheet);background:var(--err);border-radius:8px;padding:0 6px}
.dp-redit{margin-top:8px;align-self:flex-start}
.dp-bands{position:relative;min-width:0}
.dp-wires{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
.dp-wires path{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.6}
.dp-wires path.s-set{stroke-dasharray:2 3}
.dp-wires path.s-proposed{stroke:var(--info);stroke-dasharray:6 4;opacity:1}
.dp-band{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.dp-band:first-child{border-top:1px solid var(--rule)}
.dp-band header{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.dp-band header>div{flex:1;min-width:0}
.dp-band h3{font-size:14px;margin:1px 0 2px}
.dp-band header p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.dp-band header p b,.dp-band header p .ok{display:block;margin-top:2px}
.dp-band header p b.t-err{color:var(--err)}
.dp-band header p .ok{color:var(--ok)}
.dp-band header .dp-mini{margin-top:6px;width:100%;max-width:150px}
.dp-fold{all:unset;cursor:pointer;width:16px;color:var(--ink-2);text-align:center;padding-top:2px}

function renderConvo(k){
  const th=(threads[k]||[]).map((x,i)=>({i,who:x[0],t:x[1],txt:x[2],m:ago(x[1])})).sort((a,b)=>b.m-a.m);
