  const id='convo-'+k;
  $('#wbody').innerHTML=`<div style="margin:-18px -22px 0">${filterBar(id,{ph:'Filter comments',scopes:[],jobFirst:false,chips:[{key:'who',label:'People',opts:ppl.map(first)},{key:'only',label:'Show',opts:['Mentions me','New since 09:00','Include changes']}]})}</div><div class="convo" id="cres"></div>`;
  const f=S.f[id];if(!f.chips.only)f.chips.only=['Include changes'];$(`[data-fid="${id}"] [data-val="Include changes"]`).setAttribute('aria-pressed','true');
  refreshers[id]=()=>{
    const who=chipOn(f,'who'),only=chipOn(f,'only');
    let list=th.filter(x=>{if(x.who==='event')return only.includes('Include changes')&&!f.q&&!who.length&&!only.includes('Mentions me');
      if(f.q&&!matches(x.txt+' '+people[x.who],f.q))return false;if(who.length&&!who.includes(first(x.who)))return false;
      if(only.includes('Mentions me')&&!/@Mara/.test(x.txt))return false;if(only.includes('New since 09:00')&&!(x.m<LAST_VISIT&&x.who!==ME))return false;return true});
    const filtered=f.q||who.length||only.some(o=>o!=='Include changes');
    setCount(id,list.filter(x=>x.who!=='event').length,th.filter(x=>x.who!=='event').length,'comments');
    // unfiltered: fold the old part, keep the last 6 and everything new
    let folded=0;if(!filtered&&!S.convoAll){const keep=list.filter((x,i)=>i>=list.length-6||x.m<LAST_VISIT);folded=list.length-keep.length;list=keep}
    let html='';let newShown=false;
    if(folded)html+=`<button class="fold" onclick="S.convoAll=true;refresh('${id}')">Show ${folded} earlier entries, from 2026-08-12</button>`;
    list.forEach(x=>{
      if(!filtered&&!newShown&&x.m<LAST_VISIT&&x.who!==ME){html+=`<div class="newline">New since your last visit, 09:00</div>`;newShown=true}
      if(x.who==='event')html+=`<div class="msg event"><span></span><span>${esc(x.txt)}, ${x.t}</span></div>`;
      else{const mention=/@Mara/.test(x.txt);const txt=hl(x.txt,f.q).replace(/@Mara/g,'<span class="at">@Mara</span>');
        html+=`<div class="msg ${x.m<LAST_VISIT&&x.who!==ME?'new':''} ${mention?'mention':''}"><span class="av ${x.who===ME?'me':''}">${x.who}</span><div class="body"><div class="who"><b>${x.who===ME?'You':first(x.who)}</b>${x.t}${mention?'<span class="chip" style="background:var(--card);color:var(--card-ink)">mentions you</span>':''}</div>${txt}</div></div>`}});
    if(!list.length)html=`<div class="empty">No comments match.</div>`;
    html+=`<div class="compose"><textarea placeholder="Comment on ${k}"></textarea><div class="acts"><button class="btn primary" onclick="enqueue('comment on ${k}','jira')">Comment</button></div></div>`;
    $('#cres').innerHTML=html;
  };refresh(id);
}

function renderReview(sid){
  const id='review';
  $('#main').innerHTML=`<div class="rv"><aside class="rvq" aria-label="Proposals">${filterBar(id,{ph:'Filter proposals',scopes:[['job','This job'],['all','All']],chips:[{key:'st',label:'Strength',opts:['Strong','Indirect','Weak']},{key:'dec',label:'Show',opts:['Decided']}]})}<div class="ql" id="rql"></div></aside><section id="rmain"></section></div>`;
  refreshers[id]=()=>{const f=S.f[id];const st=chipOn(f,'st').map(s=>s.toLowerCase());const dec=chipOn(f,'dec').length;
    const list=suggestions.filter(s=>(f.scope!=='job'||s.job===S.job)&&(!st.length||st.includes(s.strength))&&(dec||!S.reviewed[s.id]||s.id===sid)&&(!f.q||matches(`${s.a.name} ${s.b.name} ${s.reason}`,f.q)));
    setCount(id,list.length,suggestions.length,'');
    const cur=list.find(s=>s.id===sid)||list.find(s=>!S.reviewed[s.id]);
    $('#rql').innerHTML=list.map(s=>`<a href="#/review/${s.id}" aria-current="${cur&&s.id===cur.id}" class="${S.reviewed[s.id]?'decided':''}"><span class="dot ${s.strength==='strong'?'ok':s.strength==='indirect'?'info':'warn'}"></span><span>${hl(s.a.name,f.q)}</span><span class="s">${S.reviewed[s.id]?{yes:'linked',no:'not related',skip:'later'}[S.reviewed[s.id]]+', ':''}${s.strength}, to ${esc(s.job||s.b.name)}</span></a>`).join('')||'<div class="empty">Nothing to judge here.</div>';
    renderProposal(cur,list);
  };refresh(id);
}
function renderProposal(s,list){
  if(!s){$('#rmain').innerHTML=`<div class="review"><h1 style="margin:0">Nothing left to judge${S.f.review.scope==='job'?` for ${S.job}`:''}</h1><p class="dim">New proposals appear after a sync finds a key, a shared commit or similar wording. Dismissed ones stay dismissed.</p>${S.f.review.scope==='job'?`<button class="btn" style="align-self:flex-start" onclick="S.f.review.scope='all';renderReview()">Show all proposals</button>`:''}</div>`;return}
  const i=list.indexOf(s);
  $('#rmain').innerHTML=`<div class="review"><div class="review-top"><h1>Is this a real connection?</h1><span class="dim">${i+1} of ${list.length}${s.job?`, about <a href="#/job/${s.job}" class="mono">${s.job}</a>`:''}</span></div>
    <div class="pair"><div class="pend"><span class="kind">${esc(s.a.kind)}</span><span class="name">${esc(s.a.name)}</span><span class="ctx">${esc(s.a.ctx)}</span></div>
      <div class="bridge"><span class="strength ${s.strength}">${s.strength[0].toUpperCase()+s.strength.slice(1)}</span><select id="rel" aria-label="Relation">${['implements','deploys','documents','mentions','related','blocks','depends on'].map(r=>`<option ${r===s.rel?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="pend"><span class="kind">${esc(s.b.kind)}</span><span class="name">${esc(s.b.name)}</span><span class="ctx">${esc(s.b.ctx)}</span></div></div>
    <div class="evidence"><h2>Why it was proposed</h2><div class="claim">${esc(s.reason)}</div>${s.evidence}<div class="against"><strong>Also found</strong>${s.support.map(x=>`<span>${x}</span>`).join('')}</div><div class="against"><strong>Speaks against it</strong>${s.against.map(x=>`<span>${x}</span>`).join('')}</div></div>
    <div class="decide"><button class="btn yes" onclick="decide('${s.id}','yes')">Link them <kbd style="background:transparent;color:inherit;border-color:currentColor">Y</kbd></button><button class="btn no" onclick="decide('${s.id}','no')">Not related <kbd>N</kbd></button><button class="btn ghost" onclick="decide('${s.id}','skip')">Decide later <kbd>S</kbd></button><span class="hint">Not related is remembered.</span></div></div>`;
  S.curProp=s.id;
}
function decide(id,v){const s=suggestions.find(x=>x.id===id);S.reviewed[id]=v;renderNav();
  const undo=['Undo',()=>{delete S.reviewed[id];location.hash='#/review/'+id;refresh('review')}];
  if(v==='yes')toast(`Linked: ${s.a.name.split(' ')[0]} ${($('#rel')||{}).value||s.rel} ${s.b.name.split(' ')[0]}`,undo);if(v==='no')toast('Dismissed. It will not be proposed again.',undo);
  const f=S.f.review;const next=suggestions.find(x=>!S.reviewed[x.id]&&(f.scope!=='job'||x.job===S.job));history.replaceState(null,'',next?'#/review/'+next.id:'#/review');renderReview(next&&next.id)}

function openLaunch(){
  const corpus=[...tickets.map(t=>['Ticket',`${t.key} ${t.sum}`,'#/job/'+t.key,'Jira']),...prs.slice(0,20).map(p=>['PR',`PR #${p.n} ${p.t}`,p.n===142||p.n===144?'#/pr/'+p.n:'#/code/prs','Gitea']),...repos.map(r=>['Repo',r.n,'#/code/repos','Gitea']),...builds.map(b=>['Build',`${b.cfg} #${b.no}`,b.href||'#/builds','TeamCity']),...pages.map(p=>['Page',p.title,'#/page/'+p.id,'Confluence']),...monitors.map(m=>['Monitor',m.n,'#/monitors','Uptime Kuma']),...assets.map(a=>['Asset',a.name+' '+a.type,'#/asset/'+a.id,'knobas'])];
  modal(`<div class="dialog launch"><input id="lq" placeholder="Search tickets, PRs, repos, builds, pages, monitors" aria-label="Search"><div class="res" id="lres"></div></div>`);

  draw();$('#lq').oninput=()=>{idx=0;draw()};

/* ============================================================ prototype 3: link sets
   A link set is a named group of repos, build configurations, pages and monitors.
   A rule applies it to tickets: by epic, by parent ticket, by project, or by hand.
   The job reads its own links plus the members of every set that applies, at read time.
   Nothing is copied onto the ticket and nothing is written to a source. */
const sets=[
 {id:'payout-stack',name:'Payout stack',desc:'What a change on the payout path touches: the repos, the Payouts builds, the PSP pages and the payout monitors.',
  members:[{kind:'code',ids:['payout-service','psp-client']},
   {kind:'builds',q:'Payout_* and PspClient_* under TeamCity project Payments',match:b=>b.path[0]==='Payments'&&/^(Payout_|PspClient_)/.test(b.cfg)},
   {kind:'docs',ids:['PSP error codes','Payout batch lifecycle','ADR-031 Retry policy for external calls']},
   {kind:'assets',ids:['c-payout-prod','c-worker-prod','vm-pay-01','r-payouts']},{kind:'monitors',ids:['payouts /health','payouts cert','payout-worker container']}],
  rules:[{type:'epic',val:'PAY-200'},{type:'epic',val:'PAY-300'}]},
 {id:'staging',name:'Payments staging',desc:'The stage stack the payout and ledger services run on.',
  members:[{kind:'assets',ids:['c-payout-stage','c-pg-stage','vm-pay-stage-01','r-payouts-stage','db-payments-stage']},{kind:'monitors',ids:['flows-stage','payouts-stage /health','pg-payments-stage','vm-pay-stage-01 ping']}],
  rules:[{type:'manual',val:'PAY-231'},{type:'manual',val:'PAY-240'}]},
 {id:'ledger',name:'Ledger stack',desc:'ledger-api and fx-rates, the Ledger builds, the reconciliation runbook.',
  members:[{kind:'code',ids:['ledger-api','fx-rates']},{kind:'builds',q:'Everything under TeamCity project Payments › Ledger',match:b=>b.path[1]==='Ledger'},
   {kind:'docs',ids:['Ledger reconciliation runbook','Ledger double-entry model']},{kind:'assets',ids:['c-ledger-prod','db-payments','vm-db-01']},{kind:'monitors',ids:['ledger /health','vm-db-01:5432']}],
  rules:[{type:'epic',val:'PAY-150'},{type:'manual',val:'PAY-228'}]},
 {id:'finance-docs',name:'Finance docs',desc:'Every page in the Finance space, and the finance requests.',
  members:[{kind:'docs',q:'All pages in space FIN, and pages under PAY › Finance requests',match:p=>p.space==='FIN'||p.path[0]==='Finance requests'}],
  rules:[{type:'epic',val:'PAY-150'}]},
 {id:'oncall',name:'On-call kit',desc:'The on-call handbook and every runbook.',
  members:[{kind:'docs',q:'Pages under OPS › Runbooks, and the On-call handbook',match:p=>p.space==='OPS'&&(p.path[0]==='Runbooks'||p.title==='On-call handbook')}],
  rules:[{type:'project',val:'OPS'}]},
];
S.subtasksInherit=true;S.hidden={};S.repoBranch={};S.edits={};S.pendingC={};S.viewed={};S.hintGone=false;
const SECL={code:'Code',builds:'Builds',docs:'Pages',monitors:'Monitors',assets:'Assets'};
const KIND_LABEL={code:'Repositories',builds:'Build configurations',docs:'Pages',monitors:'Monitors',assets:'Assets'};
const ruleMatches=(r,t)=>r.type==='epic'?t.epic===r.val:r.type==='project'?t.key.startsWith(r.val+'-'):r.type==='parent'?t.parent===r.val:t.key===r.val;
const ruleLabel=r=>r.type==='epic'?`Every ticket under epic ${r.val} ${EPICS[r.val]||''}`:r.type==='project'?`Every ticket in project ${r.val}`:r.type==='parent'?`Every sub-task of ${r.val}`:`${r.val}, applied by hand`;
const viaLabel=r=>r.type==='epic'?`via epic ${r.val}`:r.type==='project'?`via project ${r.val}`:r.type==='parent'?`via parent ${r.val}`:'applied by you';
const setsFor=k=>{const t=T(k);return t?sets.map(s=>({set:s,rule:s.rules.find(r=>ruleMatches(r,t))})).filter(x=>x.rule):[]};
const ticketsOf=s=>tickets.filter(t=>s.rules.some(r=>ruleMatches(r,t)));
const buildRow=b=>({id:b.cfg,t:`${b.cfg} #${b.no}`,sub:`${b.st==='running'?b.dur:b.why||b.st}, ${b.branch}, ${when(b.when)}`,tone:b.st==='failed'?'err':b.st==='running'?'run':'ok',chip:[chipOf(b.st),b.st],attn:b.st==='failed'?3:b.st==='running'?1:0,upd:b.when,href:b.href||'#/builds/'+b.cfg,extra:b.st==='running'?'<span class="progress"><i></i></span>':''});
const pageRow=p=>({id:p.id,t:p.title,sub:`${p.space}${p.path.length?' › '+p.path.join(' › '):''}, ${p.sub||`${first(p.by)}, ${when(p.upd)}`}`,tone:p.attn?'warn':'',attn:p.attn||0,upd:p.upd,href:'#/page/'+p.id});
const monRow=m=>({id:m.n,t:m.n,sub:`${m.type} monitor, ${m.label}`,tone:m.state==='err'?'err':m.state==='warn'?'warn':'ok',attn:m.state==='err'?3:m.state==='warn'?1:0,upd:0,href:'#/monitors',extra:bar(m.down||0,m.warn||0)});
const repoRow=r=>({id:'repo:'+r.n,t:r.n,mono:true,sub:`repository, ${r.lang}, ${r.checkout?'cloned here':'not cloned'}`,upd:r.push,href:'#/repo/'+r.n});
function memberEntities(m){
  if(m.kind==='code')return m.ids.map(n=>repos.find(r=>r.n===n)).filter(Boolean);
  if(m.kind==='builds')return m.match?builds.filter(m.match):m.ids.map(n=>builds.find(b=>b.cfg===n)).filter(Boolean);
  if(m.kind==='docs')return m.match?pages.filter(m.match):m.ids.map(n=>pages.find(p=>p.title===n)).filter(Boolean);
  if(m.kind==='assets')return m.ids.map(n=>assets.find(a=>a.id===n)).filter(Boolean);
  return m.ids.map(n=>monitors.find(x=>x.n===n)).filter(Boolean)}
const toRow={code:repoRow,builds:buildRow,docs:pageRow,monitors:monRow,assets:a=>assetRow(a)};
function setItems(s){const out={code:[],builds:[],docs:[],assets:[],monitors:[]};s.members.forEach(m=>memberEntities(m).forEach(e=>out[m.kind].push(toRow[m.kind](e))));return out}
function jobData(k){
  const own=ownData(k),t=T(k),origins=[];
  setsFor(k).forEach(x=>origins.push({key:'set:'+x.set.id,label:x.set.name,via:viaLabel(x.rule),items:setItems(x.set),setId:x.set.id}));
  if(t&&t.parent&&S.subtasksInherit)origins.push({key:'parent:'+t.parent,label:`Parent ${t.parent}`,via:'sub-tasks show their parent’s connections',items:ownData(t.parent),parent:t.parent});
  const res={origins};
  ['code','builds','docs','assets','monitors'].forEach(s=>{
    res[s]=own[s].filter(i=>!S.unlinked[k+i.id]).map(i=>({...i}));const seen=new Set(res[s].map(i=>i.id));
    origins.forEach(o=>(o.items[s]||[]).forEach(i=>{if(S.hidden[k+'|'+i.id])return;if(seen.has(i.id)){const e=res[s].find(x=>x.id===i.id);e.alsoIn=(e.alsoIn||[]).concat(o.label);return}seen.add(i.id);res[s].push({...i,from:o.label,fromKey:o.key})}));
  });return res}
function setsBar(k){const o=jobData(k).origins;
  return `<div class="setsbar"><span class="dim">Also on this job</span>${o.map(x=>`<a class="setchip" href="${x.setId?'#/sets/'+x.setId:'#/job/'+x.parent}"><b>${esc(x.label)}</b><span>${esc(x.via)}</span></a>`).join('')||'<span class="dim">no link sets yet</span>'}<button class="linkish" onclick="openApplySet('${k}')">Apply a link set…</button></div>`}

/* drawer: own links, then each link set it inherits, then what is hidden here */
function openDrawer(k){S.dk=k;S.dq='';
  $('#drawer').innerHTML=`<header><h2>Connections of <span class="mono">${k}</span></h2><span class="spacer"></span><button class="btn sm ghost" onclick="closeDrawer()">Esc</button></header>
   <div class="dfilter"><label class="fsearch" style="max-width:none">${ico.find}<input id="dq" placeholder="Filter connections" aria-label="Filter connections"></label>
   <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="openLinkTo('${k}')">Link to…</button><button class="btn sm" onclick="openApplySet('${k}')">Apply a link set…</button><button class="btn sm" onclick="openSaveSet('${k}')">Save as a link set…</button></div></div><div class="body" id="dbody"></div>`;
  renderDrawerBody();$('#drawer').classList.add('on');$('#scrim').classList.add('on');setTimeout(()=>$('#dq').focus(),60)}
function renderDrawerBody(){const k=S.dk,q=S.dq||'';const own=ownData(k),d=jobData(k);const prop=pendingSuggestions(k);
  const fq=x=>!q||matches(x.t+' '+x.sub,q);
  const ownRows=['code','builds','docs','assets','monitors'].flatMap(s=>own[s].filter(x=>!S.unlinked[k+x.id]&&fq(x)).map(x=>({...x,s})));

const RETRY_MAIN=`use std::time::Duration;

use crate::psp::errors::PspError;

pub const RETRY_DELAY: Duration = Duration::from_secs(60);

/// Sends the batch once more after a fixed delay.
pub async fn send_with_retry<F, Fut>(mut send: F) -> Result<(), PspError>
where
    F: FnMut() -> Fut,
    Fut: std::future::Future<Output = Result<(), PspError>>,
{
    match send().await {

const RETRY_A41=`use std::time::Duration;
use rand::Rng;

use crate::psp::errors::PspError;

pub const BASE: Duration = Duration::from_secs(30);
pub const FACTOR: u32 = 2;
pub const MAX_ATTEMPTS: u32 = 10;
pub const JITTER: f64 = 0.2;

/// Delay before the given attempt, with jitter.
pub fn next_delay(attempt: u32) -> Duration {
    let mut rng = rand::thread_rng();
    let jitter = rng.gen_range(-JITTER..JITTER);
    let base = BASE * FACTOR.pow(attempt);
    base.mul_f64(1.0 + jitter)
}

pub fn is_transient(err: &PspError) -> bool {
    matches!(err, PspError::Http(503) | PspError::Code(ref c) if c == "TEMP_UNAVAILABLE")
}

pub async fn send_with_retry<F, Fut>(mut send: F) -> Result<(), PspError>
where
    F: FnMut() -> Fut,
    Fut: std::future::Future<Output = Result<(), PspError>>,
{
    let mut attempt = 0;
    while attempt <= MAX_ATTEMPTS {
        match send().await {
            Ok(()) => return Ok(()),
            Err(e) if is_transient(&e) => {
                tokio::time::sleep(next_delay(attempt)).await;
                attempt += 1;
            }
            Err(e) => return Err(e),
        }
    }
    Err(PspError::GaveUp { attempts: attempt })
}`;

/* ============================================================ prototype 4: builds
   Written against a generic shape so another CI system can fill it:

function drawLog(r){const L=logOf(r);const steps=stepsOf(r);const q=S.logOpt.q;let n=0;
  const line=(l,i)=>{const hit=q&&matches(l.txt,q);const cls=(l.k||'')+(S.logOpt.errs&&!l.k?' hide':'')+(q&&!hit&&S.logOpt.errs?' hide':'');let txt=hl(l.txt,q);if(hit)n++;return `<div class="ll ${cls}" data-i="${i}"><span class="no">${i+1}</span><span class="ts">${l.ts}</span><span>${txt||' '}</span></div>`};
  const html=steps.map((s,si)=>{const ls=L.map((l,i)=>[l,i]).filter(([l])=>l.step===si);const has=ls.some(([l])=>l.k==='e'||(q&&matches(l.txt,q)));
    return `<details data-s="${si}" ${s.st!=='ok'||has||S.logOpt.errs?'open':''}><summary><span class="dot ${s.st==='err'?'err':s.st==='run'?'run':s.st==='wait'?'':'ok'}"></span>${esc(s.n)}<span class="d">${s.st==='wait'?'not started':s.st==='run'?'running':durS(s.d)}, ${ls.length} lines</span></summary>${ls.map(([l,i])=>line(l,i)).join('')}</details>`}).join('');
  $('#logv').innerHTML=html;$('#lqn').textContent=q?`${n} found`:'';S.logOpt.cur=Math.min(S.logOpt.cur,Math.max(0,n-1));
  const inp=$('#lq');inp.oninput=()=>{S.logOpt.q=inp.value;S.logOpt.cur=0;drawLog(r);markCur()};inp.onkeydown=e=>{if(e.key==='Enter'){logJump(e.shiftKey?-1:1);e.preventDefault()}};markCur(false)}
function markCur(scroll=true){const ms=[...document.querySelectorAll('#logv mark')];ms.forEach(m=>m.classList.remove('curm'));const m=ms[S.logOpt.cur];if(m){m.classList.add('curm');const d=m.closest('details');if(d)d.open=true;if(scroll)m.scrollIntoView({block:'center'});$('#lqn').textContent=`${S.logOpt.cur+1} of ${ms.length}`}}
function logJump(d){const ms=document.querySelectorAll('#logv mark');if(!ms.length)return;S.logOpt.cur=(S.logOpt.cur+d+ms.length)%ms.length;markCur()}
function logToFirstError(){const e=document.querySelector('#logv .ll.e');if(e){e.closest('details').open=true;e.scrollIntoView({block:'center'})}}
function previewArtifact(cfg,no,name){const r=runOf(cfg,no);const t=artifactText(r,name);$('#apv').innerHTML=`<div class="fileview"><header><span class="p">${esc(name)}</span><span class="acts"><button class="btn sm" onclick="downloadArtifact(runOf('${cfg}',${no}),'${name}')">Download</button><button class="btn sm ghost" onclick="$('#apv').innerHTML=''">Close</button></span></header><pre class="code">${t.split('\n').map((l,i)=>`<div class="l"><span>${i+1}</span><span>${esc(l)||' '}</span></div>`).join('')}</pre></div>`;$('#apv').scrollIntoView({block:'nearest'})}

/* ============================================================ prototype 4: Open in…
   Applications are command templates you add once (Settings › Checkouts). knobas fills the placeholders
   from this disk only: the checkout path it found or you set, a file inside it, a line. Nothing synced
   (branch names, titles, URLs) is ever passed to a program (ADR-0016). */
const HOME='/Users/mara';
S.apps=[{name:'VS Code',cmd:'code {path}',fileCmd:'code --goto {file}:{line}'},{name:'Terminal',cmd:'open -a Terminal {path}'},{name:'Fork',cmd:'open -a Fork {path}'},{name:'IntelliJ IDEA',cmd:'idea {path}',fileCmd:'idea --line {line} {file}'}];
S.appDefault=0;
const PH=[['{path}','the checkout folder','/Users/mara/code/payout-service'],['{file}','the file you have open, inside the checkout','/Users/mara/code/payout-service/src/sepa/retry.rs'],['{line}','the line you are on, or 1','1'],['{name}','the repository name','payout-service']];
const fill=(cmd,ctx)=>cmd.replace(/\{path\}/g,ctx.path).replace(/\{file\}/g,ctx.file||ctx.path).replace(/\{line\}/g,ctx.line||1).replace(/\{name\}/g,ctx.name);
const quoteIfSpace=s=>/\s/.test(s)?`'${s}'`:s;
function openCtx(repo,file){return {name:repo,path:`${HOME}/code/${repo}`,file:file?`${HOME}/code/${repo}/${file}`:null,line:file?1:null}}
function openIn(repo,file,cls='sm'){const r=repos.find(x=>x.n===repo);const a=S.apps[S.appDefault];
  if(r&&!r.checkout&&S.cloning[repo]!=null)return `<span class="openin"><button class="btn ${cls}" data-clone="${repo}" disabled aria-live="polite">Cloning… ${S.cloning[repo]} %</button><button class="btn ${cls} ghost" onclick="event.stopPropagation();cancelClone('${repo}')" aria-label="Stop cloning ${repo}">Stop</button></span>`;
  if(!r||!r.checkout)return `<span class="openin"><button class="btn ${cls}" onclick="event.stopPropagation();startClone('${repo}')" title="Clones into ${S.clonesRoot||'your clones root'}/${repo}">Clone</button></span>`;
  return `<span class="openin"><button class="btn ${cls}" aria-haspopup="menu" onclick="event.stopPropagation();openAppMenu(this,'${repo}','${file||''}')" title="Open ~/code/${esc(repo)} in an application">Open in… <span class="dim" aria-hidden="true">▾</span></button></span>`}
// Cloning: one click clones into the clones root (Settings › Checkouts). Ruled by Björn 2026-10-15, amending ADR-0016:
// git runs without a shell, the URL is built from the source's configured address, only https and ssh are allowed.
S.clonesRoot='~/code';S.cloning={};S.cloneTimers={};
function startClone(repo){if(!S.clonesRoot){openCloneRoot(repo);return}
  if(S.cloning[repo]!=null)return;S.cloning[repo]=0;renderRoute();
  const steps=[8,21,37,52,68,81,93,100];let i=0;
  S.cloneTimers[repo]=setInterval(()=>{S.cloning[repo]=steps[i++];document.querySelectorAll(`[data-clone="${repo}"]`).forEach(b=>b.textContent=`Cloning… ${S.cloning[repo]} %`);
    if(S.cloning[repo]>=100){clearInterval(S.cloneTimers[repo]);delete S.cloning[repo];cloneFound(repo)}},350)}
function cancelClone(repo){clearInterval(S.cloneTimers[repo]);delete S.cloning[repo];toast(`Stopped cloning ${repo}. Nothing was left in ${S.clonesRoot}.`);renderRoute()}
function openCloneRoot(repo){modal(`<div class="dialog"><header><h2>Where should clones go?</h2></header><div class="body"><div class="formgrid"><span>Clones root</span><input type="text" id="crt" value="~/code"></div>
   <p class="dim" style="margin:0;font-size:12.5px">knobas clones every repository into its own folder here, and looks here for clones you made yourself. You can change it in Settings › Checkouts.</p></div>
   <footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="S.clonesRoot=$('#crt').value.trim()||'~/code';closeModal();startClone('${repo}')">Set and clone</button></footer></div>`)}
function cloneFound(repo){const r=repos.find(x=>x.n===repo);r.checkout='main, clean';toast(`Cloned ${repo} into ${S.clonesRoot}/${repo}, on main`,[`Open in ${S.apps[S.appDefault].name}`,()=>runApp(S.appDefault,repo,'')]);renderRoute()}
function openSetPath(repo){modal(`<div class="dialog"><header><h2>Where is <span class="mono">${esc(repo)}</span> cloned?</h2></header><div class="body"><div class="formgrid"><span>Path</span><input type="text" id="spp" placeholder="/Users/mara/work/${esc(repo)}"></div>
   <p class="dim" style="margin:0;font-size:12.5px">A path you set wins over the clones-root scan. knobas checks that the folder's origin is this repository.</p></div>
   <footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="const p=$('#spp').value.trim();if(!p)return;closeModal();const r=repos.find(x=>x.n==='${repo}');r.checkout='main, clean';toast('Set the path for ${esc(repo)}');renderRoute()">Set path</button></footer></div>`)}
function runApp(i,repo,file,atRoot){const a=S.apps[Math.max(0,i)];const cmd=atRoot?a.cmd.replace('{path}',S.clonesRoot):fill(file&&a.fileCmd?a.fileCmd:a.cmd,openCtx(repo,file||null));toast(`Started ${a.name}: ${cmd}`)}
function openAppMenu(btn,repo,file){closeAppMenu();const r=btn.getBoundingClientRect();
  document.body.insertAdjacentHTML('beforeend',`<div class="appmenu" id="appmenu" role="menu" style="top:${r.bottom+4}px;left:${Math.max(8,Math.min(r.right-300,innerWidth-308))}px">
    ${S.apps.map((a,i)=>`<button role="menuitem" ${i===S.appDefault?'data-default':''} onclick="closeAppMenu();runApp(${i},'${repo}','${file}')"><b>${esc(a.name)}${i===S.appDefault?' <span class="dim" style="font-weight:400">(default)</span>':''}</b><span class="mono">${esc(fill(file&&a.fileCmd?a.fileCmd:a.cmd,openCtx(repo,file||null)))}</span></button>`).join('')}
    <hr><button role="menuitem" onclick="closeAppMenu();openAppDialog()">Add an application…</button><button role="menuitem" onclick="closeAppMenu();openAppsManage()">Manage applications…</button></div>`);
  setTimeout(()=>{const m=$('#appmenu');if(!m)return;const d=m.querySelector('[data-default]');(d||m.querySelector('button')).focus()},0)}
function closeAppMenu(){const m=$('#appmenu');m&&m.remove()}
document.addEventListener('click',e=>{if(!e.target.closest('#appmenu'))closeAppMenu()});
document.addEventListener('keydown',e=>{const m=$('#appmenu');if(!m)return;if(e.key==='Escape'){closeAppMenu();e.stopPropagation()}
  const bs=[...m.querySelectorAll('button')];const i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){bs[(i+1)%bs.length].focus();e.preventDefault()}if(e.key==='ArrowUp'){bs[(i-1+bs.length)%bs.length].focus();e.preventDefault()}},true);
function openAppDialog(idx){const a=idx!=null?S.apps[idx]:{name:'',cmd:'',fileCmd:''};
  modal(`<div class="dialog" style="width:min(640px,calc(100vw - 32px))"><header><h2>${idx!=null?'Edit':'Add'} an application</h2></header><div class="body">
   <div class="formgrid"><span>Name</span><input type="text" id="apn" value="${esc(a.name)}" placeholder="MyGitViewer">
    <span>Command</span><input type="text" id="apc" value="${esc(a.cmd)}" placeholder="MyGitViewer {path}" style="font-family:var(--mono)">
    <span>For a file</span><input type="text" id="apf" value="${esc(a.fileCmd||'')}" placeholder="optional, e.g. MyGitViewer --open {file}" style="font-family:var(--mono)"></div>
   <div class="pane-h" style="margin-top:4px">Placeholders knobas fills in</div>
   <div class="phs">${PH.map(([p,d])=>`<button type="button" class="phb" data-ph="${p}"><span class="mono">${p}</span> ${d}</button>`).join('')}</div>
   <div class="pane-h" style="margin-top:4px">It will run</div><pre class="log" id="apprev" style="margin:0"></pre>
   <div id="apwarn"></div>
   <p class="dim" style="font-size:12.5px;margin:0">The values come only from this disk: the checkout knobas found or the path you set. Branch names, titles and other synced values are never passed to a program. Paths with spaces are quoted for you. The command runs as you, with no shell, so pipes and <span class="mono">&amp;&amp;</span> don’t work; point it at a script instead.</p>
  </div><footer>${idx!=null?`<button class="btn ghost" style="margin-right:auto;color:var(--err)" onclick="S.apps.splice(${idx},1);S.appDefault=Math.min(S.appDefault,S.apps.length-1);closeModal();toast('Removed the application');renderRoute()">Remove</button>`:''}<button class="btn" id="aptest">Try it on payout-service</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="apsave">${idx!=null?'Save':'Add application'}</button></footer></div>`);
  let last=$('#apc');['#apc','#apf'].forEach(s=>$(s).onfocus=e=>last=e.target);
  const ctx=openCtx('payout-service','src/sepa/retry.rs');ctx.line=42;
  const prev=()=>{const c=$('#apc').value.trim(),f=$('#apf').value.trim();
    $('#apprev').textContent=(c?fill(c,{...ctx,file:null,line:null}).replace(ctx.path,quoteIfSpace(ctx.path)):'(type a command)')+(f?`\nfor a file: ${fill(f,ctx)}`:'');
    const w=[];if(c&&!/\{path\}|\{name\}/.test(c))w.push('The command has no {path}, so the program won’t know which repository to open.');if(/\{file\}|\{line\}/.test(c))w.push('{file} and {line} belong in “For a file”; outside a file they become the checkout path and 1.');if(/[|;&><`$]/.test(c))w.push('Shell characters like | ; &amp; &gt; are passed through as plain text. Use a script for anything shell-like.');
    $('#apwarn').innerHTML=w.map(x=>`<div class="banner warn" style="border:0;border-radius:4px;margin-top:4px">${x}</div>`).join('');$('#apsave').disabled=!c||!$('#apn').value.trim()};
  document.querySelectorAll('#modal [data-ph]').forEach(b=>b.onclick=()=>{const i=last;const s=i.selectionStart??i.value.length;i.value=i.value.slice(0,s)+(i.value&&!/\s$/.test(i.value.slice(0,s))?' ':'')+b.dataset.ph+i.value.slice(s);i.focus();prev()});
  ['#apn','#apc','#apf'].forEach(s=>$(s).oninput=prev);prev();
  $('#aptest').onclick=()=>toast(`Started ${$('#apn').value||'the application'}: ${fill($('#apc').value,{...ctx,file:null,line:null})}`);
  $('#apsave').onclick=()=>{const o={name:$('#apn').value.trim(),cmd:$('#apc').value.trim(),fileCmd:$('#apf').value.trim()||undefined};if(idx!=null)S.apps[idx]=o;else S.apps.push(o);closeModal();toast(`${idx!=null?'Saved':'Added'} ${o.name}. It is in every Open in… menu.`);renderRoute()}}
function openAppsManage(){modal(`<div class="dialog"><header><h2>Applications for Open in…</h2></header><div class="body"><p class="dim" style="margin:0;font-size:13px">The first button opens the default. The others are one click away under ▾. Saved in Settings › Checkouts.</p>
  <div class="picklist" style="max-height:none">${S.apps.map((a,i)=>`<label style="align-items:center"><input type="radio" name="apd" ${i===S.appDefault?'checked':''} onchange="S.appDefault=${i}" aria-label="Default"><span><b>${esc(a.name)}</b><span class="mono dim" style="display:block;font-size:12px">${esc(a.cmd)}${a.fileCmd?`<br>${esc(a.fileCmd)}`:''}</span></span><span style="margin-left:auto;display:flex;gap:4px"><button class="btn sm ghost" ${i===0?'disabled':''} onclick="const x=S.apps.splice(${i},1)[0];S.apps.splice(${i-1},0,x);if(S.appDefault===${i})S.appDefault=${i-1};else if(S.appDefault===${i-1})S.appDefault=${i};openAppsManage()" aria-label="Move up">↑</button><button class="btn sm" onclick="openAppDialog(${i})">Edit…</button></span></label>`).join('')}</div>
  <span class="dim" style="font-size:12.5px">Pick the default with the round button.</span></div><footer><button class="btn" onclick="openAppDialog()">Add an application…</button><button class="btn primary" onclick="closeModal();renderRoute()">Done</button></footer></div>`)}

/* the query: words, "phrases", -word, and filters space: by: updated: */
function parseDocQ(q){const o={need:[],not:[],f:{}};const re=/(-?)"([^"]+)"|(\S+)/g;let m;
  while((m=re.exec(q))){if(m[2]!=null){(m[1]?o.not:o.need).push(m[2].toLowerCase());continue}
    const w=m[3];const fm=w.match(/^(space|by|updated):(.+)$/i);if(fm){o.f[fm[1].toLowerCase()]=fm[2].toLowerCase();continue}
    if(w.length>1&&w[0]==='-'){o.not.push(w.slice(1).toLowerCase());continue}if(w==='OR')continue;o.need.push(w.toLowerCase())}return o}
const stem=w=>w.length>4?w.replace(/(ing|es|ed|s)$/,''):w;
const countIn=(text,n)=>{const t=text.toLowerCase(),s=stem(n);let c=0,i=0;while((i=t.indexOf(s,i))>=0){c++;i+=s.length}return c};
function markNeedles(html,need){need.filter(n=>n.length>1).forEach(n=>{const s=stem(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');html=html.replace(new RegExp('('+s+'\\w*)(?![^<]*>)','ig'),'<mark>$1</mark>')});return html}
const updOk=(p,u)=>!u||p.upd<=({'7d':7,'30d':30,'1y':365,today:1}[u]||9999)*1440+NOW;
function docSearch(q,fac){const o=parseDocQ(q);if(fac.space)o.f.space=fac.space.toLowerCase();if(fac.by)o.f.by=fac.by.toLowerCase();if(fac.upd)o.f.updated=fac.upd;
  const t0=performance.now();const out=[];
  DOCIX.forEach(d=>{const p=d.p;
    if(o.f.space&&p.space.toLowerCase()!==o.f.space)return;
    if(o.f.by&&!(p.by.toLowerCase()===o.f.by||first(p.by).toLowerCase()===o.f.by))return;
    if(o.f.updated&&!updOk(p,o.f.updated))return;
    const title=p.title,path=p.path.join(' ');let score=0;const hitsIn=new Set();
    const all=title+' '+path+' '+d.secs.map(s=>(s.h||'')+' '+s.text.join(' ')).join(' ')+' '+d.comments.map(c=>c.text).join(' ');
    if(o.not.some(n=>countIn(all,n)))return;
    for(const n of o.need){const ct=countIn(title,n),cp=countIn(path,n),cs=d.secs.reduce((a,s)=>a+countIn(s.h||'',n)*3+countIn(s.text.join(' '),n),0),cc=d.comments.reduce((a,c)=>a+countIn(c.text,n),0);
      if(!(ct+cp+cs+cc))return;score+=ct*8+cp*2+cs+cc;if(ct)hitsIn.add('Title');if(cs)hitsIn.add('Body');if(cc)hitsIn.add('Comments')}
    if(fac.in&&!hitsIn.has(fac.in))return;
    score+=Math.max(0,3-p.upd/20000);
    // the snippet: the sentence with the most needles, its section, or a comment
    let best=null;d.secs.forEach(s=>s.text.join(' ').split(/(?<=[.!?])\s+/).forEach(sen=>{const k=o.need.filter(n=>countIn(sen,n)).length;if(k&&(!best||k>best.k))best={k,sen,sec:s.h}}));
    d.comments.forEach(c=>{const k=o.need.filter(n=>countIn(c.text,n)).length;if(k&&(!best||k>best.k))best={k,sen:c.text,cmt:c}});
    if(!best)best={sen:(d.secs[0]&&d.secs[0].text[0])||'',sec:null};
    out.push({d,score,best,hitsIn:[...hitsIn],hits:o.need.reduce((a,n)=>a+countIn(all,n),0)})});
  out.sort((a,b)=>S.docSort==='new'?a.d.p.upd-b.d.p.upd:b.score-a.score);
  return {res:out,ms:Math.max(1,Math.round(performance.now()-t0)),o}}

function inl(s,need){const parts=s.split(/(\[\[[A-Z]+-\d+\]\]|\{\{page:[^}]+\}\}|@[A-Z][a-z]+|`[^`]+`|\*\*[^*]+\*\*)/);
  return parts.map(x=>{let m;
    if((m=x.match(/^\[\[([A-Z]+-\d+)\]\]$/))){const t=T(m[1]);return `<a class="tchip" href="#/job/${m[1]}" title="${t?esc(t.sum):''}"><span class="k">${m[1]}</span>${t?`${esc(t.sum)} <span class="chip ${S.statusOf[t.key]==='Done'?'ok':S.statusOf[t.key]==='To Do'?'':'info'}">${S.statusOf[t.key]}</span>`:''}</a>`}
    if((m=x.match(/^\{\{page:([^}]+)\}\}$/))){const p=pageByTitle(m[1]);return p?`<a class="pgl" href="#/page/${p.id}">${markNeedles(esc(m[1]),need)}</a>`:esc(m[1])}
    if((m=x.match(/^@([A-Z][a-z]+)$/)))return `<span class="ment ${m[1]==='Mara'?'me':''}">@${m[1]}</span>`;
    if((m=x.match(/^`([^`]+)`$/)))return `<code>${markNeedles(esc(m[1]),need)}</code>`;
    if((m=x.match(/^\*\*([^*]+)\*\*$/)))return `<b>${markNeedles(esc(m[1]),need)}</b>`;
    return markNeedles(esc(x),need)}).join('')}

/* ============================================================ the map
   One model for two maps: a job's map starts from its ticket, the global map starts from any asset,
   repository or pipeline. Edges are relations knobas already has. Every option is one step of one
   pipeline, so they all combine:
     build the graph, then focus, only problems, summary, hidden columns, groups, lanes. */
const MCOLS=['Ticket','Changes and pages','Repositories','Builds','Entry points','Runs as','Runs on','Hosts'];
const DEPLOYS={Payout_Deploy_Staging:['c-payout-stage'],Payout_Deploy_Prod:['c-payout-prod','c-worker-prod'],Ledger_Deploy_Staging:['c-ledger-stage'],Ledger_Deploy_Prod:['c-ledger-prod']};
const ROUTES_TO={'r-payouts':'c-payout-prod','r-payouts-stage':'c-payout-stage','r-ledger':'c-ledger-prod','r-dashboard':'svc-dashboard'};
const USES_DB={'c-payout-stage':'db-payments-stage','c-payout-prod':'db-payments','c-worker-prod':'db-payments','c-ledger-prod':'db-payments'};
const PLURAL={page:'pages',build:'builds',repo:'repositories',pr:'pull requests',ticket:'tickets',Container:'containers',Service:'services',Database:'databases',Route:'routes',VM:'VMs','Reverse proxy':'proxies',Host:'hosts'};
const SETKEYS=['order','hidden','lanes','detail','problemsOnly','pages','proposed'];
const MAP_DEFAULT={order:[0,1,2,3,4,5,6,7],hidden:{7:true},lanes:'none',detail:'full',problemsOnly:false,pages:true,proposed:true};
S.map={...JSON.parse(JSON.stringify(MAP_DEFAULT)),startWith:'all',sel:null,blast:null,also:{},zoom:null,q:'',open:{},focus:null,trail:[],nomon:false,root:null,view:'default',panel:null};
S.mapViews=[
  {id:'v-runtime',name:'Runtime, by environment',scope:{type:'all'},settings:{order:[0,3,4,5,6,7,1,2],hidden:{1:true,2:true,7:true},lanes:'env',detail:'full',problemsOnly:false,pages:false,proposed:true}},
  {id:'v-code',name:'Code and builds only',scope:{type:'all'},settings:{order:[0,1,2,3,4,5,6,7],hidden:{4:true,5:true,6:true,7:true},lanes:'repo',detail:'full',problemsOnly:false,pages:false,proposed:true}}];
const snapshot=()=>JSON.parse(JSON.stringify(Object.fromEntries(SETKEYS.map(k=>[k,S.map[k]]))));
const applySettings=st=>SETKEYS.forEach(k=>{if(st[k]!==undefined)S.map[k]=JSON.parse(JSON.stringify(st[k]))});
const scopeLabel=sc=>sc.type==='job'?`only ${sc.val}`:sc.type==='epic'?`every ticket under ${sc.val}`:sc.type==='set'?`every ticket with ${(sets.find(x=>x.id===sc.val)||{}).name||sc.val}`:sc.type==='entity'?`the map of ${sc.val.split(':')[1]}`:'every map';
function viewsFor(root){const t=T(root);return S.mapViews.filter(v=>{const sc=v.scope;if(sc.type==='all')return true;if(sc.type==='entity')return sc.val===root;if(!t)return false;
  return sc.type==='job'?sc.val===root:sc.type==='epic'?t.epic===sc.val:sc.type==='set'?setsFor(root).some(x=>x.set.id===sc.val):false})}
const viewRank=v=>({job:0,entity:0,epic:1,set:2,all:9})[v.scope.type];

/* ---- building the graph */
function mkGraph(){const N=new Map(),E=[];return {N,E,node:(id,o)=>{if(!N.has(id))N.set(id,{id,...o});return N.get(id)},edge:(a,b,rel,style='solid')=>{if(a!==b&&!E.some(e=>e.a===a&&e.b===b))E.push({a,b,rel,style})}}}
const colOfAsset=a=>a.type==='Route'?4:['Container','Service','Database'].includes(a.type)?5:a.type==='Host'?7:6;
const dbHost=a=>a&&a.type==='Container'&&kidsOf(a.id).some(x=>x.type==='Database');
function assetNode(G,a){const h=assetHealth(a);return G.node('asset:'+a.id,{kind:'asset',type:a.type,col:colOfAsset(a),label:a.name,sub:`${a.type}, ${a.env}`,tone:h.tone,href:'#/asset/'+a.id,mons:h.own,asset:a,env:a.env})}
function addAsset(G,a){if(!a)return;if(dbHost(a)){kidsOf(a.id).filter(x=>x.type==='Database').forEach(db=>addAsset(G,db));return}assetNode(G,a);pathOf(a).filter(x=>!dbHost(x)).forEach(x=>assetNode(G,x))}
function cfgNode(G,c){const b=cfgOf(c);if(!b)return null;return G.node('cfg:'+c,{kind:'build',col:3,label:c,sub:`#${b.no}, ${b.st==='success'?'passed':b.st}`,tone:b.st==='failed'?'err':b.st==='running'?'info':'',href:b.href||'#/builds/'+c})}
const repoNode=(G,r)=>G.node('repo:'+r,{kind:'repo',col:2,label:r,sub:'repository',href:'#/repo/'+r});
const chainedAfter=(G,c)=>CHAINS.some(ch=>ch.indexOf(c)>0&&G.N.has('cfg:'+ch[ch.indexOf(c)-1]));
function structuralEdges(G){
  G.N.forEach(n=>{if(n.kind!=='asset')return;const a=n.asset;const p0=a.parent&&assetOf(a.parent);
    if(a.type==='Database'&&dbHost(p0)){const vm=assetOf(p0.parent);if(vm&&G.N.has('asset:'+vm.id))G.edge(n.id,'asset:'+vm.id,'runs on, in container '+p0.name)}
    else if(p0&&G.N.has('asset:'+p0.id))G.edge(n.id,'asset:'+p0.id,p0.type==='Reverse proxy'?'served by':'runs on');
    if(ROUTES_TO[a.id]&&G.N.has('asset:'+ROUTES_TO[a.id]))G.edge(n.id,'asset:'+ROUTES_TO[a.id],'routes to');
    if(USES_DB[a.id]&&G.N.has('asset:'+USES_DB[a.id]))G.edge(n.id,'asset:'+USES_DB[a.id],'uses')});
  Object.entries(DEPLOYS).forEach(([c,ts])=>ts.forEach(x=>{if(G.N.has('cfg:'+c)&&G.N.has('asset:'+x))G.edge('cfg:'+c,'asset:'+x,'deploys')}));
  CHAINS.forEach(ch=>ch.forEach((c,j)=>{if(j&&G.N.has('cfg:'+c)&&G.N.has('cfg:'+ch[j-1]))G.edge('cfg:'+ch[j-1],'cfg:'+c,'then runs')}));
  G.N.forEach(n=>{if(n.kind!=='build')return;const r=repoOfCfg(n.label);if(r&&G.N.has('repo:'+r)&&!chainedAfter(G,n.label))G.edge('repo:'+r,n.id,'built by')})}
function addUsers(G,id,except){othersUsing(id,except).forEach(o=>{G.node(o,{kind:'ticket',col:0,label:o,sub:(T(o)||{}).sum||'',href:'#/job/'+o,other:true});G.edge(o,id,'also uses','also')})}
function ticketGraph(k){const G=mkGraph();const t=T(k),d=jobData(k);
  G.node(k,{kind:'ticket',col:0,label:k,sub:t.sum,href:'#/job/'+k,me:true});
  if(t.parent){G.node(t.parent,{kind:'ticket',col:0,label:t.parent,sub:(T(t.parent)||{}).sum||'',href:'#/job/'+t.parent});G.edge(t.parent,k,'parent of')}
  d.code.forEach(i=>{if(!i.id.startsWith('pr'))return;const n=+i.id.slice(2);const p=prs.find(x=>x.n===n)||{};
    G.node(i.id,{kind:'pr',col:1,label:`PR #${n}`,sub:p.t||'',tone:p.state==='open'?'info':'',href:[141,142,144].includes(n)?'#/pr/'+n:'#/code'});G.edge(k,i.id,'implements',i.from?'set':'solid');if(i.repo){repoNode(G,i.repo);G.edge(i.id,'repo:'+i.repo,'in')}});
  // not everything is a PR: a ticket can point at a repository, directly or through a link set
  d.code.forEach(i=>{if(!i.id.startsWith('repo:'))return;repoNode(G,i.t);if(!G.E.some(e=>e.b===i.id))G.edge(k,i.id,i.from?`from ${i.from}`:'works in',i.from?'set':'solid')});
  if(S.map.pages)d.docs.forEach(i=>{G.node('page:'+i.id,{kind:'page',col:1,label:i.t,sub:i.sub.split(',')[0],tone:i.tone,href:i.href,from:i.from});G.edge(k,'page:'+i.id,i.from?`from ${i.from}`:'documents',i.from?'set':'solid')});
  d.builds.forEach(i=>{const n=cfgNode(G,i.id);if(n&&!repoOfCfg(i.id))G.edge(k,n.id,i.from?`from ${i.from}`:'checks','set')});
  const want=new Set(d.assets.map(i=>i.id));d.monitors.forEach(i=>{const m=monitors.find(x=>x.n===i.id);if(m&&assetOf(m.asset))want.add(m.asset)});
  want.forEach(id=>addAsset(G,assetOf(id)));
  structuralEdges(G);
  G.N.forEach(n=>{if(n.kind==='repo'&&!G.E.some(e=>e.b===n.id))G.edge(k,n.id,'works in')});
  if(S.map.proposed&&k==='PAY-231'&&G.N.has('cfg:Payout_Build')&&G.N.has('asset:c-payout-stage')&&!S.reviewed.s2)G.edge('cfg:Payout_Build','asset:c-payout-stage','proposed: image tag 1.9.0-rc1 matches','proposed');
  Object.keys(S.map.also).forEach(id=>{if(G.N.has(id))addUsers(G,id,k)});
  return G}
function entityGraph(root){const G=mkGraph();const [kind,ref]=root.split(':');
  const deployChain=()=>{CHAINS.forEach(ch=>{const i=Math.max(...ch.map((c,j)=>G.N.has('cfg:'+c)?j:-1));if(i>0)ch.slice(0,i).forEach(c=>cfgNode(G,c))});G.N.forEach(n=>{if(n.kind==='build'){const r=repoOfCfg(n.label);if(r)repoNode(G,r)}})};
  if(kind==='asset'){const a=assetOf(ref);if(!a)return G;addAsset(G,a);descOf(a.id).forEach(x=>addAsset(G,x));
    Object.entries(ROUTES_TO).forEach(([r,to])=>{if(G.N.has('asset:'+to))addAsset(G,assetOf(r))});
    Object.entries(DEPLOYS).forEach(([c,ts])=>{if(ts.some(x=>G.N.has('asset:'+x)))cfgNode(G,c)});deployChain()}
  if(kind==='repo'){repoNode(G,ref);builds.filter(b=>repoOfCfg(b.cfg)===ref).forEach(b=>cfgNode(G,b.cfg));
    Object.entries(DEPLOYS).forEach(([c,ts])=>{if(G.N.has('cfg:'+c))ts.forEach(x=>addAsset(G,assetOf(x)))});
    Object.entries(ROUTES_TO).forEach(([r,to])=>{if(G.N.has('asset:'+to))addAsset(G,assetOf(r))});
    prs.filter(p=>p.repo===ref&&p.state==='open').forEach(p=>{G.node('pr'+p.n,{kind:'pr',col:1,label:`PR #${p.n}`,sub:p.t,tone:'info',href:[141,142,144].includes(p.n)?'#/pr/'+p.n:'#/code'});G.edge('pr'+p.n,root,'in');
      if(p.job&&T(p.job)){G.node(p.job,{kind:'ticket',col:0,label:p.job,sub:T(p.job).sum,href:'#/job/'+p.job});G.edge(p.job,'pr'+p.n,'implements')}})}
  if(kind==='cfg'){cfgNode(G,ref);const ch=chainOf(ref);if(ch)ch.forEach(c=>cfgNode(G,c));const r=repoOfCfg(ref);if(r)repoNode(G,r);
    Object.entries(DEPLOYS).forEach(([c,ts])=>{if(G.N.has('cfg:'+c))ts.forEach(x=>addAsset(G,assetOf(x)))})}
  structuralEdges(G);addUsers(G,root,null);return G}

function othersUsing(id,k){const [kind,ref]=id.split(':');const out=new Set();
  tickets.forEach(t=>{if(t.key===k||out.size>=12)return;
    if(kind==='asset'){if(assets.some(a=>(a.jobs||[]).includes(t.key)&&(a.id===ref||pathOf(a).some(x=>x.id===ref))))out.add(t.key);else if(setsFor(t.key).some(x=>x.set.members.some(m=>m.kind==='assets'&&m.ids.some(i=>i===ref||pathOf(assetOf(i)||{}).some(y=>y.id===ref)))))out.add(t.key)}
    else if(kind==='repo'){if(prs.some(p=>p.repo===ref&&p.job===t.key)||setsFor(t.key).some(x=>x.set.members.some(m=>m.kind==='code'&&m.ids.includes(ref))))out.add(t.key)}
    else if(kind==='cfg'){if(setsFor(t.key).some(x=>x.set.members.some(m=>m.kind==='builds'&&memberEntities(m).some(b=>b.cfg===ref))))out.add(t.key)}
    else if(kind==='page'){const p=pages.find(x=>x.id===ref);if(p&&(p.job===t.key||setsFor(t.key).some(x=>x.set.members.some(m=>m.kind==='docs'&&memberEntities(m).includes(p)))))out.add(t.key)}});
  return [...out].sort((a,b)=>(T(b).who===ME)-(T(a).who===ME))}
/* ---- the pipeline */
function reachIn(M,id,dir){const out=new Set([id]);let fr=[id];while(fr.length){const nx=[];fr.forEach(x=>M.E.forEach(e=>{const [f,to]=dir==='down'?[e.a,e.b]:[e.b,e.a];if(f===x&&!out.has(to)&&e.style!=='also'){out.add(to);nx.push(to)}}));fr=nx}return out}
const reach=reachIn;
function prune(M,keep){M.N.forEach((n,id)=>{if(!keep.has(id))M.N.delete(id)});for(let i=M.E.length-1;i>=0;i--)if(!M.N.has(M.E[i].a)||!M.N.has(M.E[i].b))M.E.splice(i,1)}
function markLoose(M){if(!T(M.root))return;const infra=n=>n&&n.kind==='asset'&&['VM','Reverse proxy','Host'].includes(n.type);const seen=new Set([M.root]);let fr=[M.root];

  if(mode==='env'){const f=n=>n.kind==='asset'?(['prod','stage','dev'].includes(n.env)?n.env:'shared'):n.kind==='build'?(/Prod/.test(n.label)?'prod':/Stag/.test(n.label)?'stage':'work'):n.kind==='group'&&n.memberNodes?f(n.memberNodes[0]):'work';return f}

    else if(n.kind==='repo')r=n.label;else if(n.kind==='build')r=repoOfCfg(n.label)||'other';

function mapLayout(M){const PITCH=212,W=176,NH=42,GAP=12,TOP=36;

/* ---- the shared model: the full graph, plus one walk from the ticket */
const INFRA=n=>n&&n.kind==='asset'&&['VM','Reverse proxy','Host'].includes(n.type);
const INV={'routes to':'reached at','served by':'serves','runs on':'runs','deploys':'deployed by','built by':'builds','in':'holds','implements':'implemented by','uses':'used by','then runs':'runs after','documents':'documented by','works in':'worked on by','parent of':'child of','checks':'checked by'};
function walkFrom(M,start,strict){const par=new Map([[start,null]]),dist=new Map([[start,0]]);let fr=[start];
  while(fr.length){const nx=[];fr.forEach(x=>{const nx0=M.N.get(x);M.E.forEach(e=>{let to=null,fwd=true;if(e.a===x)to=e.b;else if(e.b===x&&!(strict&&INFRA(nx0))){to=e.a;fwd=false}
    if(to&&!par.has(to)){par.set(to,{e,from:x,fwd});dist.set(to,dist.get(x)+1);nx.push(to)}})});fr=nx}return {par,dist}}
function altModel(k){const keep=[S.map.pages,S.map.proposed,S.map.also];S.map.pages=true;S.map.proposed=true;S.map.also={};const G=ticketGraph(k);[S.map.pages,S.map.proposed,S.map.also]=keep;
  const M={N:G.N,E:G.E.filter(e=>e.style!=='also'),root:k};markLoose(M);const w=walkFrom(M,k,true);M.par=w.par;M.dist=w.dist;
  M.N.forEach(n=>{if(n.kind==='pr'){const p=prs.find(x=>'pr'+x.n===n.id);n.state=p&&p.state}});return M}
const kindOf=n=>n.kind==='asset'?n.type:n.kind==='ticket'&&n.other?'Other ticket':KINDNAME[n.kind];
const monoName=n=>n.kind!=='page'&&n.kind!=='ticket'&&n.kind!=='pr';
function probOf(n){if(!n||n.kind==='page'||!(n.tone==='err'||n.tone==='warn'))return null;
  if(n.kind==='build'){const b=cfgOf(n.label)||{};return {sev:'err',word:'Failed',text:`#${b.no}${b.why?', '+b.why:''}, ${when(b.when)}`}}
  const bad=(n.mons||[]).filter(m=>m.state==='err'||m.state==='warn');
  return {sev:n.tone,word:n.tone==='err'?'Down':'Warning',text:bad.length?bad.map(m=>`${m.n}: ${m.label}`).join(', '):'something inside it has a problem'}}
function stateOf(n){const p=probOf(n);if(p)return [p.sev,p.word.toLowerCase()];
  if(n.kind==='build')return n.tone==='info'?['info','running']:['ok','passed'];
  if(n.kind==='asset')return n.mons.length?['ok',n.mons.length>1?`${n.mons.length} checks`:'1 check']:['none','no check'];
  if(n.kind==='pr')return n.state==='open'?['info','open']:['',n.state||''];
  if(n.kind==='page'&&n.tone==='warn')return ['warn','asks you'];
  return ['','']}
function trailTo(M,id){if(!M.par.has(id)){const w=walkFrom(M,M.root,false);return chainOf2(w.par,M.root,id)}return chainOf2(M.par,M.root,id)}
function chainOf2(par,root,id){const st=[];let c=id;while(par.get(c)){const p=par.get(c);st.unshift({id:c,rel:p.fwd?p.e.rel:(INV[p.e.rel]||p.e.rel),style:p.e.style});c=p.from}return [{id:root},...st]}
// a long trail folds every run of two or more stops of one kind into one stop ("4 builds")
function squeeze(M,steps){if(steps.length<=5)return steps;const out=[];let i=0;
  while(i<steps.length){const n=M.N.get(steps[i].id);let j=i;if(i>0)while(j+1<steps.length-1&&M.N.get(steps[j+1].id).kind===n.kind&&M.N.get(steps[j+1].id).type===n.type)j++;
    out.push(j>i?{...steps[i],id:steps[j].id,group:steps.slice(i,j+1).map(x=>x.id)}:steps[i]);i=j+1}return out}
function stations(M,steps,endTone,vertical){if(!vertical)steps=squeeze(M,steps);return `<div class="ma-line ${vertical?'v':''}">${steps.map((s,i)=>{const n=M.N.get(s.id);const last=i===steps.length-1;

  return `${i?`<span class="ma-hop s-${s.style}"><em title="${esc(s.rel)}">${esc(s.rel)}</em></span>`:''}<button class="ma-stn ${i===0&&s.id===M.root?'start':''} ${last&&endTone?'end t-'+endTone:''} ${S.alt.sel===s.id?'on':''}" data-act="sel" data-id="${esc(s.id)}"><i></i><b class="${monoName(n)?'mono':''}">${esc(n.label)}</b><small>${esc(kindOf(n))}</small></button>`}).join('')}</div>`}

function dependents(M,id){const n=M.N.get(id);if(!n)return [];if(n.kind==='asset')return [...reach(M,id,'up')].filter(x=>x!==id&&M.N.get(x)&&M.N.get(x).kind==='asset');

function altDetail(M,id){const n=M.N.get(id);if(!n)return '';const [tone,word]=stateOf(n);const p=probOf(n);const k=M.root;
  const others=['asset','repo','build'].includes(n.kind)?othersUsing(id,k):[];const deps=dependents(M,id);

/* ---- the graph: a ticket's job (as the map has it), or everything knobas knows */
function dpGlobal(){const G=mkGraph();
  assets.forEach(a=>assetNode(G,a));
  assets.forEach(a=>{const p=a.parent&&assetOf(a.parent);if(p)G.edge('asset:'+a.id,'asset:'+p.id,p.type==='Reverse proxy'?'served by':'runs on');
    if(ROUTES_TO[a.id]&&assetOf(ROUTES_TO[a.id]))G.edge('asset:'+a.id,'asset:'+ROUTES_TO[a.id],'routes to');if(USES_DB[a.id]&&assetOf(USES_DB[a.id]))G.edge('asset:'+a.id,'asset:'+USES_DB[a.id],'uses')});
  repos.forEach(r=>{const n=repoNode(G,r.n);n.owner=r.team});
  builds.forEach(b=>{const n=cfgNode(G,b.cfg);if(!n)return;n.owner=b.path[0];n.proj=b.proj;const r=repoOfCfg(b.cfg);if(r&&!CHAINS.some(ch=>ch.indexOf(b.cfg)>0))G.edge('repo:'+r,n.id,'built by')});
  CHAINS.forEach(ch=>ch.forEach((c,j)=>{if(j&&G.N.has('cfg:'+c)&&G.N.has('cfg:'+ch[j-1]))G.edge('cfg:'+ch[j-1],'cfg:'+c,'then runs')}));
  Object.entries(DEPLOYS).forEach(([c,ts])=>ts.forEach(x=>{if(G.N.has('cfg:'+c)&&G.N.has('asset:'+x))G.edge('cfg:'+c,'asset:'+x,'deploys')}));
  tickets.forEach(t=>G.node(t.key,{kind:'ticket',label:t.key,sub:t.sum,href:'#/job/'+t.key,owner:people[t.who]}));
  prs.filter(p=>p.state==='open').forEach(p=>{G.node('pr'+p.n,{kind:'pr',label:`PR #${p.n}`,sub:p.t,tone:'info',state:'open',href:[141,142,144].includes(p.n)?'#/pr/'+p.n:'#/code/prs',owner:p.repo});
    if(G.N.has('repo:'+p.repo))G.edge('pr'+p.n,'repo:'+p.repo,'in');if(p.job&&T(p.job))G.edge(p.job,'pr'+p.n,'implements')});
  assets.forEach(a=>(a.jobs||[]).forEach(j=>{if(T(j))G.edge(j,'asset:'+a.id,'uses')}));
  pages.filter(p=>p.job&&T(p.job)).forEach(p=>{G.node('page:'+p.id,{kind:'page',label:p.title,sub:p.space,tone:p.attn?'warn':'',href:'#/page/'+p.id,owner:p.space});G.edge(p.job,'page:'+p.id,'documents')});
  return G}
// "Try ten times as many": made-up items, so the folding can be judged at the size of a real estate
function dpBig(G){let seed=11;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;const pk=a=>a[Math.floor(r()*a.length)];
  const teams=['Booking','Tracking','Customs','Platform','Payments','Data','Warehouse','Billing'],envs=['prod','prod','stage','dev'];
  const health=()=>{const x=r();return x<.015?'err':x<.04?'warn':x<.85?'ok':''};
  const add=(id,type,name,env,owner,parent)=>{const h=health();const mons=h?[{n:name+' check',state:h,label:h==='err'?'down since 13:10':h==='warn'?'slow, 1 900 ms':'up'}]:[];
    G.node(id,{kind:'asset',type,label:name,sub:`${type}, ${env}`,tone:h==='ok'?'ok':h,mons,env,owner,href:'#',synthetic:true,parentName:parent?G.N.get(parent).label:null});if(parent)G.edge(id,parent,'runs on');return id};
  const vms=[];for(let i=0;i<140;i++){const t=pk(teams),env=pk(envs);vms.push(add('x:vm'+i,'VM',`vm-${t.toLowerCase()}-${env}-${String(i).padStart(3,'0')}`,env,t,'asset:pve-0'+(1+i%3)))}
  const cts=[];for(let i=0;i<420;i++){const vm=pk(vms),v=G.N.get(vm);cts.push(add('x:ct'+i,'Container',`${v.owner.toLowerCase()}-${pk(['api','worker','web','cron','sync','gateway'])}-${i}`,v.env,v.owner,vm))}
  for(let i=0;i<380;i++){const vm=pk(vms),v=G.N.get(vm);add('x:sv'+i,'Service',`${v.owner.toLowerCase()}-${pk(['svc','daemon','agent','exporter'])}-${i}`,v.env,v.owner,vm)}
  for(let i=0;i<60;i++){const vm=pk(vms),v=G.N.get(vm);const id=add('x:db'+i,'Database',`${v.owner.toLowerCase()}_${pk(['main','events','audit','cache'])}_${i}`,v.env,v.owner,vm);G.edge(pk(cts),id,'uses')}
  for(let i=0;i<260;i++){const c=pk(cts),v=G.N.get(c);const id=add('x:rt'+i,'Route',`${v.label}.${v.env==='prod'?'':v.env+'.'}tidewater.internal`,v.env,v.owner,'asset:rp-edge');G.edge(id,c,'routes to')}
  for(let i=0;i<160;i++){const t=pk(teams);const rid='x:repo'+i;G.node(rid,{kind:'repo',label:`${t.toLowerCase()}-${pk(['core','api','ui','jobs','lib','infra'])}-${i}`,owner:t,href:'#',synthetic:true});
    for(let j=0;j<2;j++){const x=r();const bid='x:b'+i+'-'+j;G.node(bid,{kind:'build',label:`${t}_${pk(['Build','Test','Lint','Deploy'])}_${i}${j}`,owner:t,proj:t,tone:x<.04?'err':x<.08?'info':'',href:'#',synthetic:true});G.edge(rid,bid,'built by');if(r()<.4)G.edge(bid,pk(cts),'deploys')}}}

function dpModel(){const sc=S.deps.scope;let G;if(sc){const keep=[S.map.pages,S.map.also,S.map.proposed];S.map.pages=true;S.map.also={};S.map.proposed=true;G=ticketGraph(sc);[S.map.pages,S.map.also,S.map.proposed]=keep}else G=dpGlobal();if(!sc&&S.deps.big)dpBig(G);
  Object.entries(S.dependsOn).forEach(([a,l])=>l.forEach(b=>{if(G.N.has('asset:'+a)&&G.N.has('asset:'+b))G.edge('asset:'+a,'asset:'+b,'depends on')}));
  const M={N:G.N,E:G.E.filter(e=>e.style!=='also'&&G.N.has(e.a)&&G.N.has(e.b)),root:sc};
  M.N.forEach(n=>{n.kid=kindIdOf(n);if(n.kind==='asset'&&n.asset){n.owner=n.asset.owner;n.parentName=n.asset.parent?(assetOf(n.asset.parent)||{}).name:null}
    if(n.kind==='pr'&&!n.state){const p=prs.find(x=>'pr'+x.n===n.id);n.state=p&&p.state}
    if(n.kind==='build'&&!n.proj){const b=cfgOf(n.label);if(b){n.proj=b.proj;n.owner=b.path[0]}}
    if(n.kind==='repo'&&!n.owner){const r=repos.find(x=>x.n===n.label);n.owner=r&&r.team}
    if(n.kind==='ticket'&&!n.owner)n.owner=people[(T(n.id)||{}).who]});
  M.out=new Map();M.inn=new Map();M.E.forEach(e=>{if(!M.out.has(e.a))M.out.set(e.a,[]);M.out.get(e.a).push(e);if(!M.inn.has(e.b))M.inn.set(e.b,[]);M.inn.get(e.b).push(e)});return M}
function dpReach(M,id,dir){const seen=new Set([id]);let fr=[id];while(fr.length){const nx=[];fr.forEach(x=>((dir==='down'?M.out:M.inn).get(x)||[]).forEach(e=>{const to=dir==='down'?e.b:e.a;if(!seen.has(to)){seen.add(to);nx.push(to)}}));fr=nx}return seen}
const dpTouch=(M,id)=>new Set([...dpReach(M,id,'up'),...dpReach(M,id,'down')]);
function dpState(n){if(n.kind==='ticket'){return ['',S.statusOf[n.id]||(T(n.id)||{}).status||'']}return stateOf(n)}
const dpBad=n=>n.tone==='err'||n.tone==='warn'?(n.kind==='page'?0:1):0;
function dpGroupKey(n,mode){
  if(mode==='env')return n.env||(n.kind==='asset'?'no environment':'');
  if(mode==='owner')return n.owner||'no owner';
  if(mode==='parent')return n.parentName?'on '+n.parentName:'top of the estate';
  if(mode==='project')return n.proj||n.owner||'no project';
  if(mode==='status')return n.kind==='ticket'?(S.statusOf[n.id]||(T(n.id)||{}).status):n.kind==='pr'?'Open pull requests':n.kind==='page'?'Pages':'';
  return ''}

function dpWire(id){const D=S.deps,M=window.dpM;id=id||D.hover;const box=$('#dpb');if(!box)return;const svg=$('#dpw');const B=box.getBoundingClientRect();svg.setAttribute('width',B.width);svg.setAttribute('height',box.scrollHeight);
  const tiles=box.querySelectorAll('.dp-t,.dp-chip,.dp-more,.dp-band.folded');
  if(!id||!M.N.has(id)){svg.innerHTML='';tiles.forEach(t=>t.classList.remove('dim','lit'));return}
  const on=dpTouch(M,id);const els=new Set([...on].map(x=>D.where.get(x)).filter(Boolean));
  tiles.forEach(t=>{const lit=els.has(t.id);t.classList.toggle('dim',!lit);t.classList.toggle('lit',lit&&t.dataset.id!==id)});
  const pos=el=>{const e=document.getElementById(el);if(!e)return null;const r=e.getBoundingClientRect();return {x:r.left-B.left+r.width/2,t:r.top-B.top,b:r.bottom-B.top,l:r.left-B.left,r:r.right-B.left,cy:r.top-B.top+r.height/2}};
  const seen=new Set();let out='';let n=0;
  for(const e of M.E){if(n>500)break;if(!on.has(e.a)||!on.has(e.b))continue;const ea=D.where.get(e.a),eb=D.where.get(e.b);if(!ea||!eb||ea===eb)continue;const key=ea+'>'+eb;if(seen.has(key))continue;seen.add(key);const a=pos(ea),b=pos(eb);if(!a||!b)continue;n++;let d;
    if(Math.abs(a.cy-b.cy)<6){const fw=a.x<b.x;d=`M${fw?a.r:a.l} ${a.cy} L${fw?b.l:b.r} ${b.cy}`}else{const dn=a.cy<b.cy;const y1=dn?a.b:a.t,y2=dn?b.t:b.b;const m=(y1+y2)/2;d=`M${a.x} ${y1} C${a.x} ${m},${b.x} ${m},${b.x} ${y2}`}
    out+=`<path class="s-${e.style}" d="${d}"><title>${esc(M.N.get(e.a).label)} ${esc(e.rel)} ${esc(M.N.get(e.b).label)}</title></path>`}
  svg.innerHTML=out}

function jobReach(k){if(!k||!T(k))return {has:()=>false,why:()=>''};const keep=[S.map.pages,S.map.also,S.map.proposed];S.map.pages=true;S.map.also={};S.map.proposed=false;const G=ticketGraph(k);[S.map.pages,S.map.also,S.map.proposed]=keep;
  const M={N:G.N,E:G.E.filter(e=>e.style!=='also'),root:k};const w=walkFrom(M,k,true),w2=walkFrom(M,k,false);
  const why=id=>{const par=w.par.has(id)?w.par:w2.par;if(!par.has(id)||id===k)return '';const st=chainOf2(par,k,id);if(st.length===2){const r=st[1].rel;return /^from /.test(r)?`from the link set ${r.slice(5)}`:`linked to ${k}`}return `via ${G.N.get(st[st.length-2].id).label}`};
  return {has:id=>G.N.has(id)&&id!==k,why}}

  ${loose.length?`<p class="vw-warn">${loose.join(', ')} ${loose.length>1?'are':'is'} on no column, so those tickets do not show on the board.${lock?' Jira hides them the same way.':''}</p>`:''}
  ${lock?'':`<div class="vw-btns"><button class="btn sm" onclick="VW.d.cols.push({name:'New column',st:[],max:0});vwForm();vwPrev()">+ Add a column</button><button class="btn sm ghost" onclick="VW.d.cols=vwCols();vwForm();vwPrev()">One column per status</button></div>`}</div>
  <div class="vw-sub"><label class="vw-inline"><span>Lanes</span><select onchange="VW.d.lanes=this.value;vwPrev()">${LANES.map(([k,l])=>`<option value="${k}" ${d.lanes===k?'selected':''}>${l}</option>`).join('')}</select></label>${lock?'<small class="dim">Jira does not tell other apps how a board\'s swimlanes are set up, so they are set here.</small>':''}</div>
  <div class="vw-sub"><h4>Cards show</h4><div class="vw-checks">${CARDF.map(([k,l])=>`<label><input type="checkbox" ${d.card[k]?'checked':''} onchange="VW.d.card.${k}=this.checked?1:0;vwPrev()"> ${l}</label>`).join('')}</div></div>`}
function vwListHtml(d){return `<div class="vw-sub"><h4>Columns</h4><div class="vw-checks">${LCOLS.map(([k,l])=>`<label><input type="checkbox" ${d.lcols.includes(k)?'checked':''} ${k==='key'?'disabled':''} onchange="VW.d.lcols=this.checked?LCOLS.map(x=>x[0]).filter(x=>x===('${k}')||VW.d.lcols.includes(x)):VW.d.lcols.filter(x=>x!=='${k}');vwPrev()"> ${l}</label>`).join('')}</div></div>`}
function vwPrev(){const d=VW.d;const v=mkView(vwClone(d));const list=tickets.filter(v.f);const el=$('#vwp');if(!el)return;
  const q=$('#vwq');if(q)q.innerHTML=vwQHtml(d);
  const sv=$('#vwsave');if(sv)sv.disabled=!d.src&&!(d.name||'').trim();
  let body='';
  if(!list.length)body=`<p class="vw-empty">No synced ticket matches. Remove a condition or a value to see more.</p>`;
  else if(d.layout==='columns'){const cols=d.cols.length?d.cols:vwCols();
    body=`<div class="vw-mini" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map(c=>{const cs=list.filter(t=>c.st.includes(S.statusOf[t.key]));const over=c.max&&cs.length>c.max;
      return `<div class="vw-mcol ${over?'over':''}"><div class="vw-mh"><span>${esc(c.name||'Unnamed')}</span><b>${cs.length}${c.max?` of ${c.max}`:''}</b></div>${cs.slice(0,4).map(t=>`<div class="vw-stub"><span class="mono">${t.key}</span>${esc(t.sum)}</div>`).join('')}${cs.length>4?`<div class="vw-stub more">${cs.length-4} more</div>`:''}</div>`}).join('')}</div>`;
    const hid=list.filter(t=>!cols.some(c=>c.st.includes(S.statusOf[t.key]))).length;if(hid)body+=`<p class="vw-warn">${hid} of them sit in a status on no column.</p>`;
    if(d.lanes!=='none'){const n=new Set(list.map(t=>laneKey(t,d.lanes))).size;body+=`<p class="dim vw-pnote">In ${n} lanes by ${LANES.find(x=>x[0]===d.lanes)[1].toLowerCase()}.</p>`}}
  else{const lc=LCOLS.filter(([k])=>d.lcols.includes(k));body=`<table class="vw-mlist"><thead><tr>${lc.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${list.slice(0,9).map(t=>`<tr>${lc.map(([k])=>`<td>${k==='key'?`<span class="mono">${t.key}</span>`:k==='sum'?esc(t.sum):k==='status'?S.statusOf[t.key]:k==='prio'?t.prio:k==='who'?esc(t.who):k==='upd'?when(t.upd):k==='epic'?(t.epic||''):k==='labels'?(t.labels||[]).join(', '):sigOf(t).length}</td>`).join('')}</tr>`).join('')}</tbody></table>${list.length>9?`<p class="dim vw-pnote">and ${list.length-9} more</p>`:''}`}
  el.innerHTML=`<div class="vw-n"><b>${list.length}</b><span>${list.length===1?'ticket':'tickets'} now${d.src?', as Jira returned them at the last sync':''}</span></div>${body}`}
function vwSave(){const d=VW.d;if(!d.src&&!(d.name||'').trim())return;delete d.from;const nv=mkView({...d,id:VW.id||('v'+Date.now())});
  const i=views.findIndex(v=>v.id===VW.id);if(i>=0)views[i]=nv;else views.push(nv);closeModal();toast(VW.id?`Saved ${nv.name}`:`Created ${nv.name}`);
  S.view=nv.id;delete S.layout[nv.id];delete S.group[nv.id];if(location.hash!=='#/tickets/'+nv.id)location.hash='#/tickets/'+nv.id;else renderTickets()}
function vwSourceSettings(){const all=48;
  modal(`<div class="dialog"><header><h2>Jira boards and filters</h2></header><div class="body">
   <p class="dim" style="margin:0;font-size:13px">Sources › Jira. The source reads these at every sync and keeps a view for each one. Jira decides which tickets each view holds.</p>
   <div class="radio"><label><input type="radio" name="jbs" checked> <span>Boards on the projects this source syncs <small>${JB.length} boards: PAY, OPS, CUS, TRK, and boards that also reach other projects</small></span></label>
    <label><input type="radio" name="jbs"> <span>Only boards I marked as favourites in Jira <small>2 boards</small></span></label>
    <label><input type="radio" name="jbs"> <span>Every board I can see <small>${all} boards. Most of them reach projects this source does not sync.</small></span></label>
    <label><input type="radio" name="jbs"> <span>No boards</span></label></div>
   <label class="ji-check"><input type="checkbox" checked> My favourite filters <small class="dim">(${JF.length})</small></label>
   <p class="dim" style="margin:0;font-size:12.5px">A board or filter deleted in Jira disappears here at the next sync. A new one turns up marked <span class="vw-new">new</span>.</p></div>
   <footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toast('Saved. The next Jira sync reads the boards again.')">Save</button></footer></div>`)}
function renderAll(){renderRoute();renderTimer();renderStatus()}
window.addEventListener('hashchange',()=>{renderRoute();$('#main').scrollTop=0});
document.addEventListener('keydown',e=>{
  const el=document.activeElement;const typing=/INPUT|TEXTAREA|SELECT/.test(el.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openLaunch();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='t'){e.preventDefault();$('#timer').click();return}
  if(e.key==='Escape'){
    if($('#modal').classList.contains('on')){closeModal();return}
    if($('#drawer').classList.contains('on')){closeDrawer();return}
    if(typing&&el.value&&el.matches('[data-fq],[data-secq],#vfind,#dq,#lq,#asq,#pq,#dff,#plq,#dxq,#tq,#fq,#dq2,#maq,#maf')){el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));return}   // first Esc clears the filter
    if(typing){el.blur();return}
    const r=location.hash;if(r.startsWith('#/job/')&&r.split('/').length>3)location.hash='#/job/'+S.job;else if(r.startsWith('#/job'))location.hash='#/tickets';else if(S.job&&!r.startsWith('#/tickets'))location.hash='#/job/'+S.job;return}
  if(typing)return;
  if(e.key==='/'){const f=document.querySelector('#maq')||document.querySelector('#maf')||document.querySelector('#dq2')||document.querySelector('#dxq')||document.querySelector('#fq')||document.querySelector('[data-fq]')||document.querySelector('[data-secq]');if(f){e.preventDefault();f.focus();f.select()}return}
  const r=location.hash||'#/tickets';
  if(r.startsWith('#/job')&&e.key.toLowerCase()==='l'){openDrawer(S.job);return}
  if(r.startsWith('#/review')&&S.curProp){if(e.key==='y')decide(S.curProp,'yes');if(e.key==='n')decide(S.curProp,'no');if(e.key==='s')decide(S.curProp,'skip');return}
  if(r.startsWith('#/tickets')){const cards=[...document.querySelectorAll('#tres [data-sel]')];const i=cards.findIndex(c=>c.dataset.sel===S.sel);
    if(e.key==='j'||e.key==='ArrowDown'){const n=cards[Math.min(i+1,cards.length-1)];n&&n.click();focusSel();e.preventDefault()}
    if(e.key==='k'||e.key==='ArrowUp'){const n=cards[Math.max(i-1,0)];n&&n.click();focusSel();e.preventDefault()}
    if(e.key==='Enter'){location.hash='#/job/'+S.sel}}
});
if(location.search.includes('light'))document.documentElement.dataset.theme='light';
renderAll();
</script>
</body>
