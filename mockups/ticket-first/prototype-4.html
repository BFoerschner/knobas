<title>Ticket-first prototype 4</title>
<!--
  knobas mockup: ticket-first workbench, prototype 4 (2026-10-14)
  Adds to prototype 3: a reworked Builds view. Pipelines on the left, the selected pipeline's runs on the right,
  a run's steps, full log with search, tests and downloadable artifacts. Run with any branch and parameters.
  The view is written against a generic pipeline and run shape, so other CI systems can fill it.
  Adds to prototype 2: link sets (a named group of repos, build configurations, pages and monitors, applied to a
  ticket by hand, by its epic, by its parent ticket or by its project; computed at read time, never copied), and a
  full Code view (repository files, commits, branches, local changes, compare and create PR, PR review and merge,
  small file edits committed through Gitea). Requirements: requirements.md next to this file.
  Prototype 1 at real scale: 47 repos, 59 build configurations, ~170 tickets, ~90 wiki pages in 5 spaces,
  ~40 monitors, long comment threads (PAY-231 has 23 entries).
  Changes from prototype 1:
   - every full view (Tickets, Code, Builds, Docs, Estate, Inbox, Proposed links, Conversation) has its own filter bar;
     press / to focus it, Esc clears it. Scope: This job / Mine / All.
   - Docs is a full view of its own (spaces, page tree, results).
   - On the job, each section leads with a one-line rollup ("7 configurations: 1 failing, 1 running, 5 passing"),
     lists only what has something to say, and filters in place past 4 rows.
   - Ticket board: columns cap at 8 cards, Done collapses, swimlanes by epic or assignee; the views list is grouped and filterable.
   - Long threads: the job card shows a summary; the conversation is a tab of the job with filters.
  Real items come from mockups/shared/dataset.md + assets.md. The bulk (other repos, configs, pages, tickets, people
  outside Payments) is generated filler for scale.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E8EC; --sheet:#F7F8F9; --sheet-2:#EEF1F4; --ink:#17212B; --ink-2:#4B5663; --rule:#CBD2D9; --rule-2:#DDE2E7;
  --card:#F2D157; --card-2:#E8C440; --card-ink:#2A230B; --card-ink-2:#5A4D1E;
  --focus:#2F55D4; --mark:#F6E08F;
  --ok:#1F7444; --warn:#8A5600; --err:#B0262A; --info:#2F55D4; --muted:#5F6975;
  --ok-bg:#DDEFE4; --warn-bg:#F6EBD3; --err-bg:#F7DEDD; --info-bg:#DFE6FA; --muted-bg:#E6E9EC;
  --shadow:0 1px 0 rgba(23,33,43,.06), 0 8px 24px -12px rgba(23,33,43,.25);
  --sans:"Archivo", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171C; --sheet:#1A2027; --sheet-2:#212932; --ink:#E4E9EE; --ink-2:#A0ABB7; --rule:#323C47; --rule-2:#28313A;
    --card:#D9B941; --card-2:#C9A930; --card-ink:#1D1806; --card-ink-2:#3F3511;
    --focus:#8AA6FF; --mark:#5C4E17;
    --ok:#6FCF97; --warn:#E5B04D; --err:#FF8A80; --info:#8AA6FF; --muted:#94A0AC;
    --ok-bg:#1B3427; --warn-bg:#3A2E14; --err-bg:#3F1F1F; --info-bg:#1F2A4A; --muted-bg:#262E37;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171C; --sheet:#1A2027; --sheet-2:#212932; --ink:#E4E9EE; --ink-2:#A0ABB7; --rule:#323C47; --rule-2:#28313A;
  --card:#D9B941; --card-2:#C9A930; --card-ink:#1D1806; --card-ink-2:#3F3511;
  --focus:#8AA6FF; --mark:#5C4E17;
  --ok:#6FCF97; --warn:#E5B04D; --err:#FF8A80; --info:#8AA6FF; --muted:#94A0AC;
  --ok-bg:#1B3427; --warn-bg:#3A2E14; --err-bg:#3F1F1F; --info-bg:#1F2A4A; --muted-bg:#262E37;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.mono{font-family:var(--mono);font-size:.9em}
.dim{color:var(--ink-2)}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh}

/* top bar */
.top{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--sheet);border-bottom:1px solid var(--rule);min-width:0}
.brand{font-weight:800;font-variation-settings:"wdth" 70;font-size:19px;margin-right:10px}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.nav a:hover{background:var(--sheet-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sheet-2);box-shadow:inset 0 -2px 0 var(--ink)}
.count{font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;background:var(--muted-bg);color:var(--ink-2)}
.count.err{background:var(--err-bg);color:var(--err)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 10px;color:var(--ink-2);cursor:pointer;min-width:170px}
.search kbd{margin-left:auto}
kbd{font:600 11px var(--mono);padding:1px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;background:var(--sheet);color:var(--ink-2)}
.timer{display:flex;align-items:center;gap:8px;border-radius:4px;padding:4px 4px 4px 10px;background:var(--card);color:var(--card-ink);font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.timer.off{background:var(--sheet-2);color:var(--ink-2)}
.timer .t{font-family:var(--mono);font-size:13px}
.timer .stop{display:grid;place-items:center;width:24px;height:24px;border-radius:3px;background:rgba(0,0,0,.12)}
.timer .stop i{width:9px;height:9px;background:currentColor;border-radius:1px}
.theme{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:4px}
.status{display:flex;gap:18px;align-items:center;padding:5px 14px;font-size:12px;color:var(--ink-2);background:var(--sheet);border-top:1px solid var(--rule);overflow-x:auto;white-space:nowrap}
.status .bad{color:var(--err);font-weight:600}
.status button{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:inherit}
main{overflow:auto;min-height:0;min-width:0}

/* atoms */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap;background:var(--muted-bg);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--err-bg);color:var(--err)} .chip.info{background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.info{background:var(--info)}
.dot.run{background:var(--info);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tag{font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;border:1px dashed var(--ink-2);color:var(--ink-2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);padding:5px 11px;border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sheet-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12.5px}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule);flex:none}
.av.me{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.empty{padding:22px;color:var(--ink-2);text-align:center}
.empty .btn{margin-top:8px}

/* ---------- filter bar (shared) ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 22px;background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.fsearch{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 8px;flex:1 1 220px;max-width:360px;color:var(--ink-2)}
.fsearch:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.fsearch input{border:0;background:none;outline:none;color:var(--ink);flex:1;min-width:0;padding:1px 0}
.fsearch .clear{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 2px;display:none}
.fsearch.has .clear{display:block}.fsearch.has kbd{display:none}
.fchips{display:inline-flex;gap:4px;flex-wrap:wrap}
.fchips button{border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:1px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.fchips button:hover{border-color:var(--ink-2)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.fsel{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2)}
.fsel select{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:2px 6px;color:var(--ink);max-width:180px}
.fsel select.set{border-color:var(--ink);font-weight:600}
.fcount{margin-left:auto;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--sheet);padding:3px 10px;cursor:pointer;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg .jobk{font-family:var(--mono);font-size:11.5px}

/* ---------- tickets ---------- */
.tickets{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;height:100%}
.views{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
.views .vfind{padding:12px 10px 6px}
.views .vfind input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 8px;color:var(--ink)}
.views .vlist{overflow:auto;padding:0 10px 14px;flex:1}
.views h2{font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 8px 4px}
.views a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;text-decoration:none;color:var(--ink)}
.views a:hover{background:var(--sheet-2)}
.views a[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.views a[aria-current="true"] .count{background:rgba(255,255,255,.18);color:inherit}
.views a .count{margin-left:auto}
.views .new{color:var(--ink-2);margin-top:10px}
.board-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.board-head{display:flex;align-items:baseline;gap:12px;padding:14px 22px 10px;flex-wrap:wrap}
.board-head h1{font-size:22px;font-weight:700;font-variation-settings:"wdth" 85;margin:0}
.board-head .q{font:12px var(--mono);color:var(--ink-2)}
.board-head .seg{margin-left:auto;align-self:center}
.lane{padding:4px 22px 14px}
.lane>h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 8px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;align-items:start}
.col h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 2px 8px;color:var(--ink-2)}
.col .stack{display:flex;flex-direction:column;gap:6px;min-height:44px;padding:6px;background:var(--sheet-2);border-radius:6px}
.col .more{border:1px dashed var(--rule);background:none;border-radius:4px;padding:5px;cursor:pointer;color:var(--ink-2);font-size:12.5px}
.col .more:hover{border-color:var(--ink-2);color:var(--ink)}
.tcard{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:5px;padding:8px 10px;cursor:pointer}
.tcard:hover{border-color:var(--ink-2)}
.tcard[aria-selected="true"]{background:var(--card);color:var(--card-ink);border-color:var(--card-2);box-shadow:var(--shadow)}
.tcard[aria-selected="true"] .dim{color:var(--card-ink-2)}
.tcard .k{font:600 12px var(--mono)}
.tcard .s{display:block;margin:2px 0 6px;font-weight:500;line-height:1.3}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.tcard .meta .av{margin-left:auto}
.signal{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.list{padding:0 22px 18px}
.tbl{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.tbl th{font-size:12px;font-weight:600;color:var(--ink-2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);background:var(--sheet-2);white-space:nowrap}
.tbl th button{border:0;background:none;padding:0;cursor:pointer;font-weight:600;color:inherit}
.tbl th button[aria-sort]::after{content:" ▾"}
.tbl th button[aria-sort="ascending"]::after{content:" ▴"}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--sheet-2)}
.tbl tr.row[aria-selected="true"] td{background:var(--card);color:var(--card-ink)}
.tbl tr.row[aria-selected="true"] .dim{color:var(--card-ink-2)}
.tbl .sub{display:block;font-size:12px;color:var(--ink-2)}
.preview{border-left:1px solid var(--rule);background:var(--sheet);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.preview .k{font:600 13px var(--mono);color:var(--ink-2)}
.preview h2{font-size:21px;line-height:1.2;margin:2px 0 0;font-variation-settings:"wdth" 90}
.preview p{margin:0;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin:0}
.facts dt{color:var(--ink-2)} .facts dd{margin:0}
.pane-h{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.rollup{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px}
.rollup div{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--rule-2);font-size:13px;align-items:baseline}
.rollup div:last-child{border-bottom:0}
.rollup b{font-weight:600;color:var(--ink-2);font-size:12px}
.go{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:8px}
.go .btn.primary{justify-content:center;padding:10px;font-size:15px;font-weight:600}
.go small{color:var(--ink-2);text-align:center}

/* ---------- job ---------- */
.ws{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%}
.job{background:var(--card);color:var(--card-ink);padding:26px 22px 18px;overflow:auto;position:relative;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--card-2)}
.job::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.job .back{align-self:flex-start;border:0;background:rgba(0,0,0,.08);padding:3px 9px;border-radius:3px;cursor:pointer;font-size:12.5px;color:var(--card-ink)}
.job .key{font-weight:800;font-variation-settings:"wdth" 62;font-size:64px;line-height:.9;margin:4px 0 0}
.job h1{font-size:20px;line-height:1.2;margin:0;font-weight:600}
.job .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job select{font-weight:600;padding:4px 8px;border-radius:4px;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.35);color:var(--card-ink)}
.job .dim,.job p{color:var(--card-ink-2)}
.job p{margin:0}
.job section{border-top:1px solid rgba(0,0,0,.14);padding-top:12px}
.job h2{font-size:12px;font-weight:600;color:var(--card-ink-2);margin:0 0 6px}
.job .clock{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.08);border-radius:5px;padding:10px 12px;flex-wrap:wrap}
.job .clock .t{font:600 22px var(--mono)}
.job .clock .btn{margin-left:auto;background:var(--card-ink);color:var(--card);border-color:var(--card-ink)}
.job .chip{background:rgba(0,0,0,.1);color:var(--card-ink)}
.job .chip.err{background:var(--err);color:#fff}
.job .last{font-size:13px;background:rgba(255,255,255,.28);border-radius:4px;padding:7px 9px;margin:6px 0 8px}
.job .last b{font-weight:600}
.job .cbtn{background:transparent;border-color:rgba(0,0,0,.3);color:var(--card-ink)}
.job .week{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:6px}
.job .week i{flex:1;background:rgba(0,0,0,.22);border-radius:2px 2px 0 0}
.job .week i.today{background:var(--card-ink)}
.work{overflow:auto;display:flex;flex-direction:column;min-width:0}
.work>*{flex:none}
.wtabs{display:flex;align-items:center;gap:2px;padding:10px 22px 0;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:6}
.wtabs a{padding:8px 12px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.wtabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.conn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);padding:4px 10px;border-radius:4px;cursor:pointer;color:var(--ink-2);font-size:13px;margin-bottom:6px}
.conn:hover{color:var(--ink);border-color:var(--ink-2)}
.conn b{color:var(--ink);font-weight:600}
.conn .p{color:var(--info);font-weight:600}
.wbody{padding:18px 22px 40px;display:flex;flex-direction:column;gap:18px}
.wbody>*{flex:none}
.next{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.next .item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--rule-2);align-items:start}
.next .item:last-child{border-bottom:0}
.next .n{font:700 13px var(--mono);color:var(--ink-2);padding-top:1px}
.next .what{font-weight:600}
.next .why{grid-column:2;color:var(--ink-2);font-size:13px}
.next .acts{display:flex;gap:6px;grid-row:1/span 2;grid-column:3;align-self:center}
.next .item.done{opacity:.55}.next .item.done .what{text-decoration:line-through}
pre.log{margin:6px 0 0;font:12px/1.5 var(--mono);background:var(--paper);border-radius:4px;padding:8px 10px;overflow:auto;color:var(--ink)}
pre.log .f{color:var(--err);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.panel>header{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.panel>header h3{font-size:15px;margin:0;font-weight:700;font-variation-settings:"wdth" 88}
.panel>header .open{margin-left:auto}
.panel .roll{padding:0 12px 9px;font-size:13px;color:var(--ink-2);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.panel .roll .signal{font-size:12.5px}
.open{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);text-decoration:none;padding:3px 7px;border-radius:3px;white-space:nowrap}
.open:hover{background:var(--sheet-2);color:var(--ink)}
.open svg{width:12px;height:12px}
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:9px;padding:7px 12px;border-top:1px solid var(--rule-2);text-decoration:none;min-width:0}
a.r:hover{background:var(--sheet-2)}
.r .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .rend{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.r .sub{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.r .repo{font:11.5px var(--mono);color:var(--ink-2)}
.secfoot{display:flex;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.minif{display:flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:2px 7px;flex:1;min-width:120px;max-width:220px;color:var(--ink-2)}
.minif input{border:0;background:none;outline:none;color:var(--ink);font-size:12.5px;width:100%}
.minif:focus-within{outline:2px solid var(--focus)}
.checkout{margin:0 12px 8px;padding:8px 10px;border-radius:5px;background:var(--sheet-2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px}
.checkout .acts{margin-left:auto;display:flex;gap:6px}
.stale{margin:0 12px 8px;padding:6px 10px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;display:flex;gap:8px;align-items:center}
.stale button{margin-left:auto;border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.bar{display:flex;gap:1px;height:12px;width:96px;flex:none}
.bar i{flex:1;background:var(--ok);border-radius:1px;opacity:.8}
.bar i.d{background:var(--err);opacity:1}.bar i.w{background:var(--warn);opacity:1}.bar i.p{background:var(--rule);opacity:1}
.progress{height:4px;background:var(--rule-2);border-radius:2px;overflow:hidden;width:70px}
.progress i{display:block;height:100%;background:var(--info);width:60%}
.blocked{background:var(--err-bg);color:var(--err);border-radius:6px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.blocked .btn{margin-left:auto}
.note-preview{padding:4px 12px 10px;font-size:13px;color:var(--ink-2)}

/* conversation */
.convo{display:flex;flex-direction:column;gap:10px;max-width:820px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.msg .body{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px 12px}
.msg .who{font-size:12.5px;color:var(--ink-2);margin-bottom:2px;display:flex;gap:8px;align-items:center}
.msg .who b{color:var(--ink);font-weight:600}
.msg.new .body{border-color:var(--info);box-shadow:inset 3px 0 0 var(--info)}
.msg.mention .body{box-shadow:inset 3px 0 0 var(--card-2)}
.msg.event{grid-template-columns:28px 1fr;font-size:12.5px;color:var(--ink-2);align-items:center}
.msg.event .ln{border-top:1px dashed var(--rule);position:relative;height:0;margin-top:2px}
.at{font-weight:600;color:var(--info)}
.fold{align-self:flex-start;margin-left:38px;border:1px dashed var(--rule);background:none;border-radius:4px;padding:5px 12px;cursor:pointer;color:var(--ink-2)}
.fold:hover{border-color:var(--ink-2);color:var(--ink)}
.newline{display:flex;align-items:center;gap:10px;color:var(--info);font-size:12px;font-weight:600;margin-left:38px}
.newline::after{content:"";flex:1;border-top:1px solid var(--info)}
.compose{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px;margin-left:38px}
.compose textarea{min-height:64px;border:1px solid var(--rule);border-radius:4px;padding:8px;background:var(--paper);color:var(--ink);resize:vertical}
.compose .acts{display:flex;gap:6px;justify-content:flex-end}

/* start work */
.steps{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--rule-2);align-items:center}
.step:first-of-type{border-top:0}
.step .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule);font:700 12px var(--mono);color:var(--ink-2)}
.step.done .num{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.step.queued .num{border-color:var(--warn);color:var(--warn)}
.step .field{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step input,.step select{font:13px var(--mono);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:4px 8px;border-radius:4px;width:100%;max-width:400px}
.step select{max-width:260px}
.step .state{grid-row:1/span 2;grid-column:3;font-size:12.5px}
.steps footer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--rule);background:var(--sheet-2);border-radius:0 0 6px 6px;align-items:center;flex-wrap:wrap}

/* full views */
.full{display:flex;flex-direction:column;min-height:100%}
.crumbs{display:flex;align-items:center;gap:8px;padding:9px 22px;background:var(--sheet);border-bottom:1px solid var(--rule-2);font-size:13px;flex-wrap:wrap}
.crumbs .jobchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--card-ink);padding:2px 8px;border-radius:3px;font-weight:600;text-decoration:none;font-family:var(--mono);font-size:12px}
.crumbs .sep{color:var(--ink-2)}
.crumbs .esc{margin-left:auto;color:var(--ink-2)}
.fhead{padding:16px 22px 12px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fhead h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;font-variation-settings:"wdth" 85}
.fhead .sub{color:var(--ink-2);margin-top:4px;font-size:13px}
.fhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs a,.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tabs [aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.fbody{padding:16px 22px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.fbody.one{grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:14px}
.grp{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;margin-bottom:12px;overflow:hidden}
.grp>summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;font-weight:600}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--ink-2);font-size:11px;width:10px}
.grp[open]>summary::before{content:"▾"}
.grp>summary .chips{display:flex;gap:6px;margin-left:auto;font-weight:400}
.grp .tbl{border:0;border-radius:0;border-top:1px solid var(--rule)}
.grp .tbl{table-layout:fixed}.grp .tbl td:nth-child(1){width:30%}.grp .tbl td:nth-child(2){width:20%}.grp .tbl td:nth-child(3){width:24%}.grp .tbl td:nth-child(4){width:18%}.grp .tbl td:nth-child(5){width:8%}
.group-h{font-size:13px;font-weight:600;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.group-h:first-child{margin-top:0}
.diff{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden;font:12.5px/1.6 var(--mono)}
.diff .fh{padding:8px 12px;background:var(--sheet-2);border-bottom:1px solid var(--rule);font-weight:600;display:flex;gap:10px}
.diff .ln{display:grid;grid-template-columns:44px 1fr;white-space:pre}
.diff .ln span:first-child{color:var(--ink-2);text-align:right;padding-right:10px}
.diff .add{background:var(--ok-bg)} .diff .del{background:var(--err-bg)}
.thread{margin:4px 12px 8px 56px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);font:13px/1.45 var(--sans);padding:8px 10px;white-space:normal}
.thread p{margin:2px 0 6px}

/* docs */
.docs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;min-height:0;flex:1}
.spaces{border-right:1px solid var(--rule);background:var(--sheet);padding:12px 10px;overflow:auto}
.spaces a.sp{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;text-decoration:none;cursor:pointer}
.spaces a.sp:hover{background:var(--sheet-2)}
.spaces a.sp[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.spaces a.sp[aria-current="true"] .count{background:rgba(255,255,255,.18);color:inherit}
.spaces a.sp .count{margin-left:auto}
.spaces .sk{font:600 11px var(--mono);color:var(--ink-2);width:36px}
.spaces a.sp[aria-current="true"] .sk{color:inherit}
.tree{list-style:none;margin:0;padding:0 0 0 12px;font-size:13px}
.tree.root{padding:0}
.tree li>a{display:block;padding:3px 8px;border-radius:3px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree li>a:hover{background:var(--sheet-2)}
.tree details>summary{cursor:pointer;padding:3px 8px;border-radius:3px;list-style:none;white-space:nowrap}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"▸ ";color:var(--ink-2)}
.tree details[open]>summary::before{content:"▾ "}
.tree details>summary:hover{background:var(--sheet-2)}
.docmain{padding:0 0 30px;min-width:0}
.path{display:block;font-size:12px;color:var(--ink-2)}

/* inbox */
.inbox{display:flex;flex-direction:column;gap:6px}
.ib{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:2px 14px;padding:10px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;align-items:center}
.ib time{font:12px var(--mono);color:var(--ink-2);grid-row:1/span 2}
.ib .what{font-weight:600}
.ib .ctx{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.ib .acts{grid-row:1/span 2;grid-column:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--sheet);border-left:1px solid var(--rule);z-index:21;transform:translateX(100%);transition:transform .18s ease-out;display:flex;flex-direction:column;box-shadow:var(--shadow);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.drawer header h2{margin:0;font-size:16px}
.drawer .dfilter{padding:0 16px 10px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.drawer .dfilter .fsearch{flex:none}
.drawer .body{overflow:auto;padding:4px 0 20px;flex:1}
.drawer h3{font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 16px 4px;display:flex;gap:6px}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:6px 16px;align-items:center}
.lk:hover{background:var(--sheet-2)}
.lk .how{font-size:12px;color:var(--ink-2)}
.lk .x{opacity:0;border:0;background:none;cursor:pointer;color:var(--ink-2);padding:2px 6px;border-radius:3px}
.lk:hover .x,.lk .x:focus-visible{opacity:1}
.lk .x:hover{background:var(--err-bg);color:var(--err)}
.proposed-box{margin:16px;padding:12px;border:1px dashed var(--info);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.proposed-box .btn{align-self:flex-start}

/* reviewer */
.rv{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100%}
.rvq{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
.rvq .fbar{position:static;border-bottom:1px solid var(--rule);padding:10px 12px}
.rvq .fsearch{max-width:none}
.rvq .ql{overflow:auto;flex:1}
.rvq a{display:grid;grid-template-columns:10px minmax(0,1fr);gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--rule-2);text-decoration:none;font-size:13px}
.rvq a:hover{background:var(--sheet-2)}
.rvq a[aria-current="true"]{background:var(--sheet-2);box-shadow:inset 3px 0 0 var(--ink)}
.rvq a .dot{margin-top:5px}
.rvq a .s{grid-column:2;font-size:12px;color:var(--ink-2)}
.rvq a.decided{opacity:.6}
.review{padding:22px;display:flex;flex-direction:column;gap:16px;max-width:980px}
.review-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.review-top h1{font-size:22px;margin:0;font-variation-settings:"wdth" 85}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);align-items:stretch}
.pend{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pend .kind{font-size:12px;color:var(--ink-2)}
.pend .name{font-size:17px;font-weight:600;line-height:1.25}
.pend .ctx{font-size:12.5px;color:var(--ink-2)}
.bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 10px;position:relative}
.bridge::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--rule)}
.bridge select{position:relative;font-weight:600;padding:5px 8px;border-radius:4px;border:1px solid var(--ink-2);background:var(--sheet);color:var(--ink)}
.strength{position:relative;background:var(--paper);padding:0 6px;font-size:12.5px;font-weight:600}
.strength.strong{color:var(--ok)} .strength.indirect{color:var(--info)} .strength.weak{color:var(--warn)}
.evidence{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.evidence h2{font-size:15px;margin:0}
.evidence .claim{font-size:15px}
.evidence blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--rule);background:var(--sheet-2);border-radius:0 4px 4px 0;font-size:13.5px}
.evidence .sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chain .node{border:1px solid var(--rule);border-radius:4px;padding:4px 9px;background:var(--sheet-2);font-size:13px}
.chain .node.known{border-color:var(--ok);background:var(--ok-bg)}
.chain .edge{font-size:12px;color:var(--ink-2)}
.against{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.against strong{color:var(--ink)}
.decide{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.decide .btn{padding:9px 16px;font-size:14.5px}
.decide .yes{background:var(--ok);border-color:var(--ok);color:var(--sheet);font-weight:600}
.decide .no{color:var(--err);border-color:var(--err)}
.decide .hint{margin-left:auto;font-size:12.5px;color:var(--ink-2)}

/* modal / launcher / toast */
.modal{position:fixed;inset:0;display:none;place-items:start center;padding-top:8vh;z-index:30;background:rgba(10,15,20,.4)}
.modal.on{display:grid}
.dialog{width:min(620px,calc(100vw - 32px));background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--rule);overflow:hidden;max-height:84vh;display:flex;flex-direction:column}
.dialog header{padding:14px 18px;border-bottom:1px solid var(--rule)}
.dialog header h2{margin:0;font-size:17px}
.dialog .body{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dialog footer{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;background:var(--sheet-2)}
.dialog label.ck{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.dialog textarea,.dialog input[type=text]{border:1px solid var(--rule);border-radius:4px;padding:8px;background:var(--paper);color:var(--ink);width:100%}
.launch input{width:100%;border:0;border-bottom:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:17px;padding:16px 18px;outline:none}
.launch .res{max-height:50vh;overflow:auto;padding:6px 0}
.launch .res a{display:flex;gap:10px;align-items:center;padding:7px 18px;text-decoration:none}
.launch .res a[aria-selected="true"]{background:var(--sheet-2);box-shadow:inset 3px 0 0 var(--ink)}
.launch .res .kind{width:62px;font-size:12px;color:var(--ink-2);flex:none}
.launch .res .src{margin-left:auto;font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.placeholder{max-width:620px;margin:60px auto;padding:0 22px}

/* ---------- prototype 3: link sets ---------- */
.via{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule);margin-right:4px}
.setsbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.setchip{display:inline-flex;gap:6px;align-items:baseline;padding:3px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);text-decoration:none}
.setchip:hover{border-color:var(--ink-2)}
.setchip b{font-weight:600}.setchip span{font-size:12px;color:var(--ink-2)}
.member{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--rule-2);font-size:13.5px}
.member .x{margin-left:auto}
.member.q{background:var(--sheet-2)}
.member details{flex:1;min-width:0}
.member details summary{cursor:pointer}
.member details ul{margin:6px 0 2px;padding-left:18px;color:var(--ink-2);font-size:12.5px;columns:2}
.rule{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--rule-2)}
.rule select{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:3px 6px;color:var(--ink);max-width:240px}
.preview-keys{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 12px}
.preview-keys a{font:600 11.5px var(--mono);padding:1px 6px;border-radius:3px;background:var(--sheet-2);text-decoration:none}
.preview-keys a.mine{background:var(--card);color:var(--card-ink)}
.toggle{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.hint-card{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px dashed var(--info);border-radius:6px;background:var(--info-bg);font-size:13.5px;flex-wrap:wrap}
.hint-card .acts{margin-left:auto;display:flex;gap:6px}
.picklist{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border:1px solid var(--rule);border-radius:4px}
.picklist label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.picklist label .dim{margin-left:auto;font-size:12px}
.picklist label.in{opacity:.55}
/* ---------- prototype 3: code ---------- */
.repo{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.ftree{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 0;font-size:13px;position:sticky;top:64px;max-height:calc(100vh - 220px);overflow:auto}
.ftree a{display:block;padding:3px 10px;text-decoration:none;font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftree a:hover{background:var(--sheet-2)}
.ftree a[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.ftree .dir{padding:3px 10px;color:var(--ink-2);font:600 12px var(--mono)}
.ftree .changed::after{content:" M";color:var(--warn);font-weight:700}
.fileview{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden;min-width:0}
.fileview>header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--sheet-2);flex-wrap:wrap}
.fileview>header .p{font:600 13px var(--mono)}
.fileview>header .acts{margin-left:auto;display:flex;gap:6px}
.code{font:12.5px/1.6 var(--mono);overflow:auto;margin:0}
.code .l{display:grid;grid-template-columns:48px 1fr;white-space:pre}
.code .l span:first-child{color:var(--ink-2);text-align:right;padding-right:12px;user-select:none}
.code .l:hover{background:var(--sheet-2)}
.editor{display:grid;grid-template-columns:48px 1fr;font:12.5px/1.6 var(--mono)}
.editor .nums{color:var(--ink-2);text-align:right;padding:8px 12px 8px 0;white-space:pre;user-select:none;background:var(--sheet-2)}
.editor textarea{border:0;outline:none;background:var(--paper);color:var(--ink);font:inherit;padding:8px 10px;resize:vertical;min-height:420px;white-space:pre;overflow:auto;tab-size:4}

function renderConvo(k){

  const f=S.f[id];if(!f.chips.only)f.chips.only=['Include changes'];$(`[data-fid="${id}"] [data-val="Include changes"]`).setAttribute('aria-pressed','true');
  refreshers[id]=()=>{
    const who=chipOn(f,'who'),only=chipOn(f,'only');

      if(f.q&&!matches(x.txt+' '+people[x.who],f.q))return false;if(who.length&&!who.includes(first(x.who)))return false;
      if(only.includes('Mentions me')&&!/@Mara/.test(x.txt))return false;if(only.includes('New since 09:00')&&!(x.m<LAST_VISIT&&x.who!==ME))return false;return true});
    const filtered=f.q||who.length||only.some(o=>o!=='Include changes');
    setCount(id,list.filter(x=>x.who!=='event').length,th.filter(x=>x.who!=='event').length,'comments');
    // unfiltered: fold the old part, keep the last 6 and everything new
    let folded=0;if(!filtered&&!S.convoAll){const keep=list.filter((x,i)=>i>=list.length-6||x.m<LAST_VISIT);folded=list.length-keep.length;list=keep}
    let html='';let newShown=false;
    if(folded)html+=`<button class="fold" onclick="S.convoAll=true;refresh('${id}')">Show ${folded} earlier entries, from 2026-08-12</button>`;

        html+=`<div class="msg ${x.m<LAST_VISIT&&x.who!==ME?'new':''} ${mention?'mention':''}"><span class="av ${x.who===ME?'me':''}">${x.who}</span><div class="body"><div class="who"><b>${x.who===ME?'You':first(x.who)}</b>${x.t}${mention?'<span class="chip" style="background:var(--card);color:var(--card-ink)">mentions you</span>':''}</div>${txt}</div></div>`}});

}

function jobData(k){

function saveSet(k){const t=T(k);const name=$('#ssn').value.trim()||'New link set';const by={code:[],builds:[],docs:[],runs:[]};

const RETRY_MAIN=`use std::time::Duration;

use crate::psp::errors::PspError;

pub const RETRY_DELAY: Duration = Duration::from_secs(60);

/// Sends the batch once more after a fixed delay.
pub async fn send_with_retry<F, Fut>(mut send: F) -> Result<(), PspError>
where
    F: FnMut() -> Fut,
    Fut: std::future::Future<Output = Result<(), PspError>>,
{
    match send().await {
        Ok(()) => Ok(()),
        Err(_) => {
            tokio::time::sleep(RETRY_DELAY).await;
            send().await
        }
    }
}`;
const RETRY_A41=`use std::time::Duration;
use rand::Rng;

use crate::psp::errors::PspError;

pub const BASE: Duration = Duration::from_secs(30);
pub const FACTOR: u32 = 2;
pub const MAX_ATTEMPTS: u32 = 10;
pub const JITTER: f64 = 0.2;

/// Delay before the given attempt, with jitter.
pub fn next_delay(attempt: u32) -> Duration {
    let mut rng = rand::thread_rng();
    let jitter = rng.gen_range(-JITTER..JITTER);
    let base = BASE * FACTOR.pow(attempt);
    base.mul_f64(1.0 + jitter)
}

pub fn is_transient(err: &PspError) -> bool {
    matches!(err, PspError::Http(503) | PspError::Code(ref c) if c == "TEMP_UNAVAILABLE")
}

pub async fn send_with_retry<F, Fut>(mut send: F) -> Result<(), PspError>
where
    F: FnMut() -> Fut,
    Fut: std::future::Future<Output = Result<(), PspError>>,
{
    let mut attempt = 0;
    while attempt <= MAX_ATTEMPTS {
        match send().await {
            Ok(()) => return Ok(()),
            Err(e) if is_transient(&e) => {
                tokio::time::sleep(next_delay(attempt)).await;
                attempt += 1;
            }
            Err(e) => return Err(e),
        }
    }
    Err(PspError::GaveUp { attempts: attempt })
}`;

use payout_service::psp::errors::PspError;
use std::sync::atomic::{AtomicU32, Ordering};

#[tokio::test(start_paused = true)]
async fn gives_up_after_max_attempts() {
    let attempts = AtomicU32::new(0);
    let result = send_with_retry(|| async {
        attempts.fetch_add(1, Ordering::SeqCst);
        Err(PspError::Http(503))
    })
    .await;

    assert_eq!(attempts.load(Ordering::SeqCst), MAX_ATTEMPTS);
}

  // build the tree, then fold single-child chains into one row ("Payments › Payouts")
  const root={kids:{},cfgs:[]};builds.filter(ok).forEach(b=>{let n=root;b.path.forEach(p=>{n=n.kids[p]=n.kids[p]||{name:p,kids:{},cfgs:[]}});n.cfgs.push(b)});

  const hasSel=n=>n.cfgs.some(b=>b.cfg===sel)||Object.values(n.kids).some(hasSel);
  const node=(n,depth,key)=>{let name=n.name,m=n;while(!m.cfgs.length&&Object.keys(m.kids).length===1){m=Object.values(m.kids)[0];name+=' › '+m.name}
    const k=key+'/'+name;const open=S.plOpen[k]??(q||f.length||rel||bad(m)||hasSel(m));
    return `<details ${open?'open':''} ontoggle="S.plOpen['${esc(k)}']=this.open"><summary style="padding-left:${14+depth*14}px">${esc(name)} <span class="count">${count(m)}</span>${bad(m)?`<span class="chip err" style="font-size:11px">${bad(m)} failing</span>`:''}</summary>
      ${m.cfgs.map(b=>item(b,depth+1)).join('')}${Object.values(m.kids).map(c=>node(c,depth+1,k)).join('')}</details>`};
  let h='';
  if(rel){const n=builds.filter(ok).length;h+=`<p class="scope-note">${n} of ${builds.length} pipelines are relevant to <span class="mono">${S.job}</span>. <button class="linkish" onclick="S.plScope='all';$('#pll').innerHTML=pipelineList('${sel}');syncScope()">Show all</button></p>`}

  const tops=Object.values(root.kids);
  if(tops.length)h+=`<h3>${rel?'By project':'TeamCity'}</h3>`+tops.map(c=>node(c,0,'')).join('');
  return h||`<p class="dim" style="padding:12px 14px;font-size:13px">No pipeline matches.${rel?` <button class="linkish" onclick="S.plScope='all';$('#pll').innerHTML=pipelineList('${sel}');syncScope()">Search all pipelines</button>`:''}</p>`}

/* one run: header, steps, then Overview / Log / Tests / Artifacts / Changes / Parameters */
const testNames=['backs_off_exponentially','jitter_within_bounds','stops_on_permanent_error','moves_to_manual_review','gives_up_after_max_attempts','retries_on_503','retries_on_temp_unavailable','does_not_retry_rate_limited','delay_caps_at_max','batch_splits_by_currency','batch_skips_zero_amounts','batch_marks_sent','client_sets_idempotency_key','client_times_out_after_60s','client_parses_error_codes','errors_display_code','ledger_books_payout','ledger_books_fee_once','ledger_reverses_failed','ledger_rounds_half_even','csv_header','csv_escapes_commas','schedule_runs_at_13','schedule_skips_holidays','sandbox_health','sandbox_resets','iban_validates_checksum','iban_rejects_short','amount_parses_cents','amount_rejects_negative','currency_eur_only','queue_orders_by_age','queue_dedupes','metrics_counts_attempts','metrics_counts_giveups','config_reads_env','config_defaults','config_rejects_unknown','auth_signs_requests','auth_rotates_key','webhook_verifies','webhook_ignores_replay'];
const testsOf=r=>testNames.map((t,i)=>({mod:i<9?'sepa::retry':i<12?'sepa::batch':i<16?'psp::client':i<20?'ledger::booking':'misc',n:t,st:r.tests&&r.tests.fail&&t==='gives_up_after_max_attempts'?'failed':'passed',ms:40+((i*37)%900)}));
function stepsOf(r){if(r.cfg==='Payout_IntegrationTests')return [['Checkout',12],['Start PSP sandbox stub',20],['cargo build --tests',130],['cargo test --test sepa_retry',82],['Publish test report',8]].map(([n,d],i)=>({n,d,st:r.st==='failed'&&i===3?'err':'ok'}));
  if(r.cfg==='Payout_Build'&&r.st==='running')return [['Checkout',14],['cargo build --release',98],['cargo test',null],['Build image',null],['Publish artifacts',null]].map(([n,d],i)=>({n,d:d||60,st:i<2?'ok':i===2?'run':'wait'}));
  const tot=r.dur||180;return [['Checkout',.06],['Build',.55],['Test',.3],['Publish',.09]].map(([n,p])=>({n,d:Math.round(tot*p),st:r.st==='failed'&&n==='Test'?'err':'ok'}))}
function logOf(r){const L=[];let t=10*3600+5*60+58;const ts=()=>{const s=t;return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};

function drawLog(r){const L=logOf(r);const steps=stepsOf(r);const q=S.logOpt.q;let n=0;

document.addEventListener('click',e=>{if(!e.target.closest('#appmenu'))closeAppMenu()});
document.addEventListener('keydown',e=>{const m=$('#appmenu');if(!m)return;if(e.key==='Escape'){closeAppMenu();e.stopPropagation()}
  const bs=[...m.querySelectorAll('button')];const i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){bs[(i+1)%bs.length].focus();e.preventDefault()}if(e.key==='ArrowUp'){bs[(i-1+bs.length)%bs.length].focus();e.preventDefault()}},true);
function openAppDialog(idx){const a=idx!=null?S.apps[idx]:{name:'',cmd:'',fileCmd:''};
  modal(`<div class="dialog" style="width:min(640px,calc(100vw - 32px))"><header><h2>${idx!=null?'Edit':'Add'} an application</h2></header><div class="body">
   <div class="formgrid"><span>Name</span><input type="text" id="apn" value="${esc(a.name)}" placeholder="MyGitViewer">
    <span>Command</span><input type="text" id="apc" value="${esc(a.cmd)}" placeholder="MyGitViewer {path}" style="font-family:var(--mono)">
    <span>For a file</span><input type="text" id="apf" value="${esc(a.fileCmd||'')}" placeholder="optional, e.g. MyGitViewer --open {file}" style="font-family:var(--mono)"></div>
   <div class="pane-h" style="margin-top:4px">Placeholders knobas fills in</div>
   <div class="phs">${PH.map(([p,d])=>`<button type="button" class="phb" data-ph="${p}"><span class="mono">${p}</span> ${d}</button>`).join('')}</div>
   <div class="pane-h" style="margin-top:4px">It will run</div><pre class="log" id="apprev" style="margin:0"></pre>
   <div id="apwarn"></div>
   <p class="dim" style="font-size:12.5px;margin:0">The values come only from this disk: the checkout knobas found or the path you set. Branch names, titles and other synced values are never passed to a program. Paths with spaces are quoted for you. The command runs as you, with no shell, so pipes and <span class="mono">&amp;&amp;</span> don’t work; point it at a script instead.</p>
  </div><footer>${idx!=null?`<button class="btn ghost" style="margin-right:auto;color:var(--err)" onclick="S.apps.splice(${idx},1);S.appDefault=Math.min(S.appDefault,S.apps.length-1);closeModal();toast('Removed the application');renderRoute()">Remove</button>`:''}<button class="btn" id="aptest">Try it on payout-service</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="apsave">${idx!=null?'Save':'Add application'}</button></footer></div>`);
  let last=$('#apc');['#apc','#apf'].forEach(s=>$(s).onfocus=e=>last=e.target);
  const ctx=openCtx('payout-service','src/sepa/retry.rs');ctx.line=42;
  const prev=()=>{const c=$('#apc').value.trim(),f=$('#apf').value.trim();
    $('#apprev').textContent=(c?fill(c,{...ctx,file:null,line:null}).replace(ctx.path,quoteIfSpace(ctx.path)):'(type a command)')+(f?`\nfor a file: ${fill(f,ctx)}`:'');
    const w=[];if(c&&!/\{path\}|\{name\}/.test(c))w.push('The command has no {path}, so the program won’t know which repository to open.');if(/\{file\}|\{line\}/.test(c))w.push('{file} and {line} belong in “For a file”; outside a file they become the checkout path and 1.');if(/[|;&><`$]/.test(c))w.push('Shell characters like | ; &amp; &gt; are passed through as plain text. Use a script for anything shell-like.');
    $('#apwarn').innerHTML=w.map(x=>`<div class="banner warn" style="border:0;border-radius:4px;margin-top:4px">${x}</div>`).join('');$('#apsave').disabled=!c||!$('#apn').value.trim()};
  document.querySelectorAll('#modal [data-ph]').forEach(b=>b.onclick=()=>{const i=last;const s=i.selectionStart??i.value.length;i.value=i.value.slice(0,s)+(i.value&&!/\s$/.test(i.value.slice(0,s))?' ':'')+b.dataset.ph+i.value.slice(s);i.focus();prev()});
  ['#apn','#apc','#apf'].forEach(s=>$(s).oninput=prev);prev();
  $('#aptest').onclick=()=>toast(`Started ${$('#apn').value||'the application'}: ${fill($('#apc').value,{...ctx,file:null,line:null})}`);
  $('#apsave').onclick=()=>{const o={name:$('#apn').value.trim(),cmd:$('#apc').value.trim(),fileCmd:$('#apf').value.trim()||undefined};if(idx!=null)S.apps[idx]=o;else S.apps.push(o);closeModal();toast(`${idx!=null?'Saved':'Added'} ${o.name}. It is in every Open in… menu.`);renderRoute()}}
function openAppsManage(){modal(`<div class="dialog"><header><h2>Applications for Open in…</h2></header><div class="body"><p class="dim" style="margin:0;font-size:13px">The first button opens the default. The others are one click away under ▾. Saved in Settings › Checkouts.</p>
  <div class="picklist" style="max-height:none">${S.apps.map((a,i)=>`<label style="align-items:center"><input type="radio" name="apd" ${i===S.appDefault?'checked':''} onchange="S.appDefault=${i}" aria-label="Default"><span><b>${esc(a.name)}</b><span class="mono dim" style="display:block;font-size:12px">${esc(a.cmd)}${a.fileCmd?`<br>${esc(a.fileCmd)}`:''}</span></span><span style="margin-left:auto;display:flex;gap:4px"><button class="btn sm ghost" ${i===0?'disabled':''} onclick="const x=S.apps.splice(${i},1)[0];S.apps.splice(${i-1},0,x);if(S.appDefault===${i})S.appDefault=${i-1};else if(S.appDefault===${i-1})S.appDefault=${i};openAppsManage()" aria-label="Move up">↑</button><button class="btn sm" onclick="openAppDialog(${i})">Edit…</button></span></label>`).join('')}</div>
  <span class="dim" style="font-size:12.5px">Pick the default with the round button.</span></div><footer><button class="btn" onclick="openAppDialog()">Add an application…</button><button class="btn primary" onclick="closeModal();renderRoute()">Done</button></footer></div>`)}

/* ============================================================ routing & keys */
function renderRoute(){
  const h=(location.hash||'#/tickets').slice(2).split('/');closeDrawer();
  ({tickets:()=>{if(h[1])S.view=h[1];renderTickets()},job:()=>renderJob(h[1],h[2]),pr:()=>renderPR(h[1],h[2]),code:()=>renderCode(h[1]),builds:()=>renderBuilds(h[1],h[2]),build:()=>renderRunRoute(h.slice(1)),
    repo:()=>renderRepo(h[1],h[2],h.slice(3)),sets:()=>renderSets(h[1]),docs:renderDocs,page:()=>renderPage(h[1]),assets:renderMonitors,inbox:renderInbox,review:()=>renderReview(h[1]),time:()=>renderPlaceholder('Time')}[h[0]]||renderTickets)();
  renderNav();
}
function renderAll(){renderRoute();renderTimer();renderStatus()}
window.addEventListener('hashchange',()=>{renderRoute();$('#main').scrollTop=0});
document.addEventListener('keydown',e=>{
  const el=document.activeElement;const typing=/INPUT|TEXTAREA|SELECT/.test(el.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openLaunch();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='t'){e.preventDefault();$('#timer').click();return}
  if(e.key==='Escape'){
    if($('#modal').classList.contains('on')){closeModal();return}
    if($('#drawer').classList.contains('on')){closeDrawer();return}
    if(typing&&el.value&&el.matches('[data-fq],[data-secq],#vfind,#dq,#lq,#asq,#pq,#dff,#plq')){el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));return}   // first Esc clears the filter
    if(typing){el.blur();return}
    const r=location.hash;if(r.startsWith('#/job/')&&r.split('/').length>3)location.hash='#/job/'+S.job;else if(r.startsWith('#/job'))location.hash='#/tickets';else if(S.job&&!r.startsWith('#/tickets'))location.hash='#/job/'+S.job;return}
  if(typing)return;
  if(e.key==='/'){const f=document.querySelector('[data-fq]')||document.querySelector('[data-secq]');if(f){e.preventDefault();f.focus();f.select()}return}
  const r=location.hash||'#/tickets';
  if(r.startsWith('#/job')&&e.key.toLowerCase()==='l'){openDrawer(S.job);return}
  if(r.startsWith('#/review')&&S.curProp){if(e.key==='y')decide(S.curProp,'yes');if(e.key==='n')decide(S.curProp,'no');if(e.key==='s')decide(S.curProp,'skip');return}
  if(r.startsWith('#/tickets')){const cards=[...document.querySelectorAll('#tres [data-sel]')];const i=cards.findIndex(c=>c.dataset.sel===S.sel);
    if(e.key==='j'||e.key==='ArrowDown'){const n=cards[Math.min(i+1,cards.length-1)];n&&n.click();focusSel();e.preventDefault()}
    if(e.key==='k'||e.key==='ArrowUp'){const n=cards[Math.max(i-1,0)];n&&n.click();focusSel();e.preventDefault()}
    if(e.key==='Enter'){location.hash='#/job/'+S.sel}}
});
if(location.search.includes('light'))document.documentElement.dataset.theme='light';
renderAll();
</script>
</body>
</html>
