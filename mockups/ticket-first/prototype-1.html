<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket-first prototype 1</title>
<!--
  knobas mockup: ticket-first workbench, prototype 1 (2026-10-14)
  Flow: pick a ticket on a board or list -> open its job -> everything for that job
  (code, builds, where it runs, docs, notes, time) sits around the job card.
  Code / Builds / Estate / Inbox are full views of their own, scoped to the job when you came from one.
  Connections live in a drawer (L). Proposed links are judged one at a time with their evidence (#/review).
  Data: mockups/shared/dataset.md + assets.md (Tidewater, Fri 2026-08-22 14:32).
  Capability tags from mockups/shared/capabilities.md: items marked LOW / LATER are labelled in the UI.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E8EC; --sheet:#F7F8F9; --sheet-2:#EEF1F4; --ink:#17212B; --ink-2:#4B5663; --rule:#CBD2D9; --rule-2:#DDE2E7;
  --card:#F2D157; --card-2:#E8C440; --card-ink:#2A230B; --card-ink-2:#5A4D1E;
  --focus:#2F55D4;
  --ok:#1F7444; --warn:#8A5600; --err:#B0262A; --info:#2F55D4; --muted:#5F6975;
  --ok-bg:#DDEFE4; --warn-bg:#F6EBD3; --err-bg:#F7DEDD; --info-bg:#DFE6FA; --muted-bg:#E6E9EC;
  --shadow:0 1px 0 rgba(23,33,43,.06), 0 8px 24px -12px rgba(23,33,43,.25);
  --sans:"Archivo", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171C; --sheet:#1A2027; --sheet-2:#212932; --ink:#E4E9EE; --ink-2:#A0ABB7; --rule:#323C47; --rule-2:#28313A;
    --card:#D9B941; --card-2:#C9A930; --card-ink:#1D1806; --card-ink-2:#3F3511;
    --focus:#8AA6FF;
    --ok:#6FCF97; --warn:#E5B04D; --err:#FF8A80; --info:#8AA6FF; --muted:#94A0AC;
    --ok-bg:#1B3427; --warn-bg:#3A2E14; --err-bg:#3F1F1F; --info-bg:#1F2A4A; --muted-bg:#262E37;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171C; --sheet:#1A2027; --sheet-2:#212932; --ink:#E4E9EE; --ink-2:#A0ABB7; --rule:#323C47; --rule-2:#28313A;
  --card:#D9B941; --card-2:#C9A930; --card-ink:#1D1806; --card-ink-2:#3F3511;
  --focus:#8AA6FF;
  --ok:#6FCF97; --warn:#E5B04D; --err:#FF8A80; --info:#8AA6FF; --muted:#94A0AC;
  --ok-bg:#1B3427; --warn-bg:#3A2E14; --err-bg:#3F1F1F; --info-bg:#1F2A4A; --muted-bg:#262E37;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--sans);font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-size:.9em}
.dim{color:var(--ink-2)}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;min-width:0}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--sheet);border-bottom:1px solid var(--rule);min-width:0}
.brand{font-weight:800;font-variation-settings:"wdth" 70;font-size:19px;letter-spacing:.01em;margin-right:10px}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.nav a:hover{background:var(--sheet-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sheet-2);box-shadow:inset 0 -2px 0 var(--ink)}
.count{font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;background:var(--muted-bg);color:var(--ink-2)}
.count.err{background:var(--err-bg);color:var(--err)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 10px;color:var(--ink-2);cursor:pointer;min-width:180px}
.search kbd{margin-left:auto}
kbd{font:600 11px var(--mono);padding:1px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;background:var(--sheet);color:var(--ink-2)}
.timer{display:flex;align-items:center;gap:8px;border-radius:4px;padding:4px 4px 4px 10px;background:var(--card);color:var(--card-ink);font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.timer.off{background:var(--sheet-2);color:var(--ink-2)}
.timer .t{font-family:var(--mono);font-size:13px}
.timer .stop{display:grid;place-items:center;width:24px;height:24px;border-radius:3px;background:rgba(0,0,0,.12)}
.timer .stop i{width:9px;height:9px;background:currentColor;border-radius:1px}
.theme{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:4px}
.theme:hover{background:var(--sheet-2)}

/* ---------- status bar ---------- */
.status{display:flex;gap:18px;align-items:center;padding:5px 14px;font-size:12px;color:var(--ink-2);background:var(--sheet);border-top:1px solid var(--rule);overflow-x:auto;white-space:nowrap}
.status .bad{color:var(--err);font-weight:600}
.status button{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:var(--ink-2)}
.status .queue{margin-left:auto;font-weight:600;color:var(--warn)}

main{overflow:auto;min-height:0;min-width:0}

/* ---------- chips & tone ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap;background:var(--muted-bg);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--err-bg);color:var(--err)} .chip.info{background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.info{background:var(--info)}
.dot.run{background:var(--info);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tag{font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;border:1px dashed var(--ink-2);color:var(--ink-2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);padding:5px 11px;border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sheet-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12.5px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule);flex:none}
.av.me{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- tickets view ---------- */
.tickets{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;height:100%}
.views{border-right:1px solid var(--rule);padding:14px 10px;overflow:auto;background:var(--sheet)}
.views h2,.pane-h{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 6px 6px}
.views a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;text-decoration:none;color:var(--ink)}
.views a:hover{background:var(--sheet-2)}
.views a[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.views a[aria-current="true"] .count{background:rgba(255,255,255,.18);color:inherit}
.views a .count{margin-left:auto}
.views hr{border:0;border-top:1px solid var(--rule-2);margin:12px 4px}
.views .new{color:var(--ink-2)}
.board-wrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.board-head{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;flex-wrap:wrap}
.board-head h1{font-size:22px;font-weight:700;font-variation-settings:"wdth" 85;margin:0}
.board-head .q{font:12px var(--mono);color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--sheet);padding:4px 10px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);gap:12px;padding:4px 18px 18px;overflow:auto;flex:1;align-items:start}
.col h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 2px 8px;color:var(--ink-2)}
.col .stack{display:flex;flex-direction:column;gap:8px;min-height:60px;padding:6px;background:var(--sheet-2);border-radius:6px}
.tcard{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:5px;padding:9px 10px;cursor:pointer}
.tcard:hover{border-color:var(--ink-2)}
.tcard[aria-selected="true"]{background:var(--card);color:var(--card-ink);border-color:var(--card-2);box-shadow:var(--shadow)}
.tcard[aria-selected="true"] .dim{color:var(--card-ink-2)}
.tcard .k{font:600 12px var(--mono)}
.tcard .s{display:block;margin:3px 0 8px;font-weight:500}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.tcard .meta .av{margin-left:auto}
.tcard.done{opacity:.7}
.signal{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.list{padding:0 18px 18px;overflow:auto}
.list table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.list th{font-size:12px;font-weight:600;color:var(--ink-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--sheet-2)}
.list td{padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.list tr.row{cursor:pointer}
.list tr.row:hover td{background:var(--sheet-2)}
.list tr.row[aria-selected="true"] td{background:var(--card);color:var(--card-ink)}
.list tr.row[aria-selected="true"] .dim{color:var(--card-ink-2)}
.list tr:last-child td{border-bottom:0}
.preview{border-left:1px solid var(--rule);background:var(--sheet);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.preview .k{font:600 13px var(--mono);color:var(--ink-2)}
.preview h2{font-size:21px;line-height:1.2;margin:2px 0 0;font-variation-settings:"wdth" 90}
.preview p{margin:0;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.facts dt{color:var(--ink-2)} .facts dd{margin:0}
.attached{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px}
.attached div{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--rule-2);font-size:13px}
.attached div:last-child{border-bottom:0}
.go{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:8px}
.go .btn.primary{justify-content:center;padding:10px;font-size:15px;font-weight:600}
.go small{color:var(--ink-2);text-align:center}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%}
.job{background:var(--card);color:var(--card-ink);padding:26px 22px 18px;overflow:auto;position:relative;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--card-2)}
.job::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.job .back{align-self:flex-start;border:0;background:rgba(0,0,0,.08);padding:3px 9px;border-radius:3px;cursor:pointer;font-size:12.5px;color:var(--card-ink)}
.job .key{font-weight:800;font-variation-settings:"wdth" 62;font-size:64px;line-height:.9;letter-spacing:-.01em;margin:4px 0 0}
.job h1{font-size:20px;line-height:1.2;margin:0;font-weight:600}
.job .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job select{font:inherit;font-weight:600;padding:4px 8px;border-radius:4px;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.35);color:var(--card-ink)}
.job .dim, .job p{color:var(--card-ink-2)}
.job p{margin:0}
.job .facts dt{color:var(--card-ink-2)}
.job section{border-top:1px solid rgba(0,0,0,.14);padding-top:12px}
.job h2{font-size:12px;font-weight:600;color:var(--card-ink-2);margin:0 0 6px}
.job .clock{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.08);border-radius:5px;padding:10px 12px}
.job .clock .t{font:600 22px var(--mono)}
.job .clock .btn{margin-left:auto;background:var(--card-ink);color:var(--card);border-color:var(--card-ink)}
.job .comment{font-size:13px;margin:0 0 8px}
.job .comment b{font-weight:600}
.job details summary{cursor:pointer;font-size:13px;font-weight:600}
.job .week{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:6px}
.job .week i{flex:1;background:rgba(0,0,0,.22);border-radius:2px 2px 0 0}
.job .week i.today{background:var(--card-ink)}
.job .chip{background:rgba(0,0,0,.1);color:var(--card-ink)}
.job .chip.err{background:var(--err);color:#fff}

.work{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.work>*{flex:none}
.work-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.work-head h2{font-size:15px;margin:0;font-weight:600}
.conn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);padding:4px 10px;border-radius:4px;cursor:pointer;color:var(--ink-2);font-size:13px}
.conn:hover{color:var(--ink);border-color:var(--ink-2)}
.conn b{color:var(--ink);font-weight:600}
.conn .p{color:var(--info);font-weight:600}
.next{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.next .item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--rule-2);align-items:start}
.next .item:last-child{border-bottom:0}
.next .n{font:700 13px var(--mono);color:var(--ink-2);padding-top:1px}
.next .what{font-weight:600}
.next .why{grid-column:2;color:var(--ink-2);font-size:13px}
.next .acts{display:flex;gap:6px;grid-row:1/span 2;grid-column:3;align-self:center}
.next .item.done{opacity:.55}
.next .item.done .what{text-decoration:line-through}
pre.log{margin:6px 0 0;font:12px/1.5 var(--mono);background:var(--paper);border-radius:4px;padding:8px 10px;overflow:auto;color:var(--ink)}
pre.log .f{color:var(--err);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.panel>header{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.panel>header h3{font-size:15px;margin:0;font-weight:700;font-variation-settings:"wdth" 88}
.panel>header .open{margin-left:auto}
.open{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);text-decoration:none;padding:3px 7px;border-radius:3px}
.open:hover{background:var(--sheet-2);color:var(--ink)}
.open svg{width:12px;height:12px}
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:9px;padding:8px 12px;border-top:1px solid var(--rule-2);text-decoration:none;min-width:0}
a.r:hover{background:var(--sheet-2)}
.r .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .end{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.r .sub{display:block;font-size:12px;color:var(--ink-2)}
.checkout{margin:0 12px 10px;padding:10px 12px;border-radius:5px;background:var(--sheet-2);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.checkout .acts{margin-left:auto;display:flex;gap:6px}
.stale{margin:0 12px 10px;padding:7px 10px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;display:flex;gap:8px;align-items:center}
.stale button{margin-left:auto;border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.bar{display:flex;gap:1px;height:12px;width:96px;flex:none}
.bar i{flex:1;background:var(--ok);border-radius:1px;opacity:.8}
.bar i.d{background:var(--err);opacity:1}.bar i.w{background:var(--warn);opacity:1}
.progress{height:4px;background:var(--rule-2);border-radius:2px;overflow:hidden;width:70px}
.progress i{display:block;height:100%;background:var(--info);width:60%}
.blocked{background:var(--err-bg);color:var(--err);border-radius:6px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.blocked .btn{margin-left:auto}
.note-preview{padding:4px 12px 10px;font-size:13px;color:var(--ink-2)}
.ref{font:600 12px var(--mono);background:var(--info-bg);color:var(--info);padding:0 4px;border-radius:3px}

/* start work stepper */
.steps{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--rule-2);align-items:center}
.step:first-of-type{border-top:0}
.step .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule);font:700 12px var(--mono);color:var(--ink-2)}
.step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.queued .num{border-color:var(--warn);color:var(--warn)}
.step .field{grid-column:2;display:flex;gap:6px;align-items:center}
.step input{font:13px var(--mono);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:4px 8px;border-radius:4px;width:100%;max-width:420px}
.step .state{grid-row:1/span 2;grid-column:3;font-size:12.5px}
.steps footer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--rule);background:var(--sheet-2);border-radius:0 0 6px 6px;align-items:center}

/* ---------- full views ---------- */
.full{display:flex;flex-direction:column;min-height:100%}
.crumbs{display:flex;align-items:center;gap:8px;padding:10px 22px;background:var(--sheet);border-bottom:1px solid var(--rule);font-size:13px;flex-wrap:wrap}
.crumbs .jobchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--card-ink);padding:2px 8px;border-radius:3px;font-weight:600;text-decoration:none}
.crumbs .sep{color:var(--ink-2)}
.crumbs .esc{margin-left:auto;color:var(--ink-2)}
.fhead{padding:18px 22px 0;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fhead h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;font-variation-settings:"wdth" 85}
.fhead .sub{color:var(--ink-2);margin-top:4px;font-size:13px}
.fhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:14px 22px 0;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.fbody{padding:18px 22px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.fbody.one{grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:14px}
.side .panel{padding-bottom:4px}
.diff{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden;font:12.5px/1.6 var(--mono)}
.diff .fh{padding:8px 12px;background:var(--sheet-2);border-bottom:1px solid var(--rule);font-weight:600;display:flex;gap:10px}
.diff .ln{display:grid;grid-template-columns:44px 1fr;white-space:pre}
.diff .ln span:first-child{color:var(--ink-2);text-align:right;padding-right:10px;user-select:none}
.diff .add{background:var(--ok-bg)} .diff .del{background:var(--err-bg)}
.thread{margin:4px 12px 8px 56px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);font:13px/1.45 var(--sans);padding:8px 10px;white-space:normal}
.thread p{margin:2px 0 6px}
.convo{display:flex;flex-direction:column;gap:12px}
.msg{display:grid;grid-template-columns:28px 1fr;gap:10px}

.compose .acts{display:flex;gap:6px;justify-content:flex-end}
.table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.table th{font-size:12px;font-weight:600;color:var(--ink-2);text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--sheet-2)}

.table tr.click:hover td{background:var(--sheet-2)}
.table tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--card-2)}
.group-h{font-size:13px;font-weight:600;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.group-h:first-child{margin-top:0}
.scope{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);padding:12px 22px 0;flex-wrap:wrap}
.scope .seg{margin-left:0}

.inbox{display:flex;flex-direction:column;gap:8px}

.ib .what{font-weight:600}
.ib .ctx{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.ib .acts{grid-row:1/span 2;grid-column:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--sheet);border-left:1px solid var(--rule);z-index:21;transform:translateX(100%);transition:transform .18s ease-out;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.drawer header h2{margin:0;font-size:16px}
.drawer .body{overflow:auto;padding:6px 0 20px;flex:1}
.drawer h3{font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 16px 4px}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:7px 16px;align-items:center}

.proposed-box{margin:16px;padding:12px;border:1px dashed var(--info);border-radius:6px;display:flex;flex-direction:column;gap:8px}

.pend{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pend .kind{font-size:12px;color:var(--ink-2)}
.pend .name{font-size:17px;font-weight:600;line-height:1.25}
.pend .ctx{font-size:12.5px;color:var(--ink-2)}
.bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 10px;position:relative}
.bridge::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--rule)}
.bridge select{position:relative;font:inherit;font-weight:600;padding:5px 8px;border-radius:4px;border:1px solid var(--ink-2);background:var(--sheet);color:var(--ink)}

.evidence{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.evidence .claim{font-size:15px}

.evidence blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--rule);background:var(--sheet-2);border-radius:0 4px 4px 0;font-size:13.5px}
.evidence .side-by-side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chain .node{border:1px solid var(--rule);border-radius:4px;padding:4px 9px;background:var(--sheet-2);font-size:13px}
.chain .node.known{border-color:var(--ok);background:var(--ok-bg)}
.chain .edge{font-size:12px;color:var(--ink-2)}
.against{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.decide{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.decide .btn{padding:9px 16px;font-size:14.5px}

.decided{display:flex;flex-direction:column;gap:6px}
.decided .row{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 10px;background:var(--sheet);border-radius:4px}
.decided .row button{margin-left:auto}

/* ---------- modal, launcher, toast ---------- */
.modal{position:fixed;inset:0;display:none;place-items:start center;padding-top:8vh;z-index:30;background:rgba(10,15,20,.4)}
.modal.on{display:grid}
.dialog{width:min(620px,calc(100vw - 32px));background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--rule);overflow:hidden;max-height:84vh;display:flex;flex-direction:column}
.dialog header{padding:14px 18px;border-bottom:1px solid var(--rule)}

.dialog textarea, .dialog input[type=text]{font:inherit;border:1px solid var(--rule);border-radius:4px;padding:8px;background:var(--paper);color:var(--ink);width:100%}
.launch input{width:100%;border:0;border-bottom:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:17px var(--sans);padding:16px 18px;outline:none}

.launch .res .kind{width:62px;font-size:12px;color:var(--ink-2)}
.launch .res .src{margin-left:auto;font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.placeholder{max-width:620px;margin:60px auto;padding:0 22px}
.placeholder h1{font-variation-settings:"wdth" 85}

@media (max-width:1180px){

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  $('#main').innerHTML=`<div class="review">

    <div class="pair">

      <div class="pend"><span class="kind">${esc(s.b.kind)}</span><span class="name">${esc(s.b.name)}</span><span class="ctx">${esc(s.b.ctx)}</span></div>

    </div>

  $('#main').innerHTML=`<div class="full">${crumbs([['Estate','#/assets/tree'],['Monitors','']])}
   <div class="fhead"><div><h1>Monitors</h1><div class="sub">From Uptime Kuma, synced 1 min ago. Bars cover the last 24 hours in half-hours.</div></div><div class="acts"><button class="btn" onclick="toast('The tree of VMs, containers, services and routes opens here (unchanged)')">Tree</button></div></div>
   <div class="scope">${k?`<div class="seg" role="group"><button aria-pressed="${!!scoped}" onclick="S.monScope='job';renderMonitors()">For ${k}</button><button aria-pressed="${!scoped}" onclick="S.monScope='all';renderMonitors()">Everything</button></div>`:''}<span class="chip err">${list.filter(m=>m.state==='err').length} down</span><span class="chip warn">${list.filter(m=>m.state==='warn').length} warning</span><span class="chip ok">${list.filter(m=>m.state==='ok').length} up</span></div>
   <div class="fbody one"><table class="table"><thead><tr><th>Monitor</th><th>State</th><th>Last 24 h</th><th>Response</th><th>30 days</th><th>Asset</th><th></th></tr></thead>
   ${list.map(m=>`<tr><td><span class="dot ${m.state}"></span> ${esc(m.n)} <span class="dim" style="font-size:12px">${m.type}</span></td><td><span class="chip ${m.state}">${m.label}</span></td><td>${bar(m.down||0,m.warn||0)}</td><td class="mono">${m.resp}</td><td class="mono">${m.up}</td><td class="mono dim">${m.asset}</td><td>${m.state==='err'?`<button class="btn sm" onclick="this.textContent='Acked';this.disabled=true;toast('Acked in knobas. The alert stays open until the monitor recovers.')">Ack</button>`:''}</td></tr>`).join('')}
   </table>${list.length===0?'<p class="dim">No monitors are connected to this job.</p>':''}</div></div>`;
}
function renderInbox(){
  $('#main').innerHTML=`<div class="full">${crumbs([['Inbox','']])}<div class="fhead"><div><h1>Inbox</h1><div class="sub">What asks for you, newest first. Each row says which job it belongs to.</div></div></div>
   <div class="fbody one"><div class="inbox">${inbox.map(i=>`<div class="ib ${S.inboxGone[i.id]?'gone':''}"><time>${i.t}</time><div class="what">${i.tone?`<span class="dot ${i.tone}"></span> `:''}${esc(i.what)}</div><div class="acts">${i.acts.map(([l,h])=>h?`<a class="btn sm" href="${h}">${l}</a>`:`<button class="btn sm ${l==='Done'?'ghost':''}" onclick="inboxAct('${i.id}','${l}')">${l}</button>`).join('')}</div><div class="ctx">Job: <a href="#/job/${i.ctx.split(',')[0]}" class="mono">${i.ctx}</a></div></div>`).join('')}</div>
   <p class="dim" style="font-size:13px">Snoozed: Jira PAT expires in 12 days (back 2026-08-29), payouts certificate expires in 9 days (back 2026-08-29).</p></div></div>`;
}
function inboxAct(id,l){if(l==='Re-run')enqueue('re-run #1187','teamcity');if(l==='Snooze')toast('Snoozed until Monday 09:00');if(l==='Ack')toast('Acked. The alert stays open until the monitor recovers.');if(l!=='Re-run'){S.inboxGone[id]=1;renderInbox();renderNav()}}
function renderPage(){
  $('#main').innerHTML=`<div class="full">${crumbs([['Docs',''],['SEPA payout retry design','']])}<div class="fhead"><div><h1>SEPA payout retry design</h1><div class="sub">ENG, you edited Backoff policy today 10:40</div></div><div class="acts"><button class="btn" onclick="toast('Opens in the browser')">Open in browser</button></div></div>
   <div class="fbody"><div style="max-width:68ch;display:flex;flex-direction:column;gap:12px"><div class="panel" style="padding:14px 16px"><h3 style="margin:0 0 6px">Backoff policy</h3><p style="margin:0">Base 30 s, factor 2, max 5 attempts, jitter ±10 %. Transient codes: HTTP 503, TEMP_UNAVAILABLE. After the final attempt the payout is moved to the manual review queue (see PAY-231).</p><button class="btn sm" style="margin-top:10px" onclick="toast('Edit this section; text only')">Edit section</button></div>
   <div class="panel" style="padding:14px 16px;border-color:var(--warn)"><h3 style="margin:0 0 6px">Manual review queue</h3><p style="margin:0" class="dim">SLA: to be defined.</p><div class="msg" style="margin-top:10px"><span class="av">PN</span><div class="body"><div class="who">Priya, today 12:05</div>@Mara can you add the manual-review queue SLA here?</div></div><button class="btn sm primary" style="margin-top:10px" onclick="enqueue('edit section Manual review queue','confluence')">Edit section</button></div></div><aside class="side"></aside></div></div>`;
}
function renderPlaceholder(name){
  $('#main').innerHTML=`<div class="placeholder"><h1>${name}</h1><p class="dim">Not redesigned in this mockup. The day review, week timesheet and Log all work as they do now. In this design they are reached from the timer and from the job card’s week strip.</p><a class="btn" href="#/job/${S.job||'PAY-231'}">Back to the job</a></div>`;
}

/* ======================= dialogs ======================= */
function modal(html){$('#modal').innerHTML=html;$('#modal').classList.add('on');setTimeout(()=>{const f=$('#modal input,#modal textarea,#modal button');f&&f.focus()},30)}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function openWorklog(after){
  const k=S.timer.target;
  modal(`<div class="dialog"><header><h2>Log time to <span class="mono">${k}</span></h2></header><div class="body">
    <div style="display:flex;gap:10px;align-items:center"><input type="text" value="2h 44m" style="width:110px;font:600 16px var(--mono)" aria-label="Duration"><span class="dim">09:40–11:50 and 13:58–now, you can edit it</span></div>
    <div class="pane-h" style="margin:4px 0 0">What you did in that time</div>
    ${[['commit a41f2c “PAY-231 backoff jitter”, 10:02',1],['commit c90d11 “jitter in backoff, cap at 5 attempts”, 11:42',1],['replied to Jonas on PR #142, 10:20',1],['triggered build #1188, 11:45',0],['edited SEPA payout retry design › Backoff policy, 10:40',1],['edited note SEPA retry investigation, 11:20',0]].map(([l,c])=>`<label class="ck"><input type="checkbox" ${c?'checked':''}> ${esc(l)}</label>`).join('')}
    <textarea rows="3" aria-label="Worklog comment">Backoff jitter (a41f2c, c90d11); replied to review on PR #142; updated Backoff policy in the design page.</textarea>
  </div><footer><button class="btn ghost" onclick="closeModal();S.timer.on=false;renderAll();toast('Timer stopped. Nothing logged.');${after?'logAfter()':''}">Discard</button><button class="btn primary" onclick="closeModal();S.timer.on=false;enqueue('log 2h 44m to ${k}','jira');renderAll();${after?'logAfter()':''}">Log 2h 44m to ${k}</button></footer></div>`);
  window.logAfter=after||null;
}
function stopTimer(){openWorklog()}
function startTimer(k){if(S.timer.on&&S.timer.target!==k){openWorklog(()=>{S.timer={on:true,target:k,start:Date.now()};renderAll()});return}S.timer={on:true,target:k,start:Date.now()};renderAll();toast(`Timer started on ${k}`)}
function openComment(k){modal(`<div class="dialog"><header><h2>Comment on <span class="mono">${k}</span></h2></header><div class="body"><textarea rows="4" placeholder="Write a comment"></textarea></div><footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();enqueue('comment on ${k}','jira')">Comment</button></footer></div>`)}
function openRun(){modal(`<div class="dialog"><header><h2>Run Payout_IntegrationTests</h2></header><div class="body"><label>Branch <input type="text" value="feature/PAY-231-sepa-retry"></label><label>env <select><option>staging</option><option>prod-dryrun</option></select></label><label class="ck"><input type="checkbox"> Clean checkout</label></div><footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();enqueue('run Payout_IntegrationTests','teamcity')">Run</button></footer></div>`)}
function openLinkTo(k){modal(`<div class="dialog"><header><h2>Link <span class="mono">${k}</span> to…</h2></header><div class="body"><input type="text" placeholder="Search for a ticket, PR, build, page, asset"><label>Relation <select><option>related</option><option>implements</option><option>documents</option><option>deploys</option><option>runs on</option><option>blocks</option><option>depends on</option></select></label><input type="text" placeholder="Note (optional)"></div><footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toast('Linked in knobas')">Link</button></footer></div>`)}
function showQueue(){modal(`<div class="dialog"><header><h2>Queued writes</h2></header><div class="body">${S.queue.length?S.queue.map(q=>`<div style="display:flex;gap:10px;align-items:center"><span class="dot warn"></span>${esc(q.what)}<span class="dim" style="margin-left:auto;font-size:12.5px">${q.src==='teamcity'?'waits for TeamCity sign-in':'next sync'}</span></div>`).join(''):'<p class="dim">Nothing queued.</p>'}</div><footer><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();S.queue=S.queue.filter(q=>q.src==='teamcity');renderStatus();toast('Sent. TeamCity writes keep waiting for sign-in.')">Send now</button></footer></div>`)}
const corpus=[['Ticket','PAY-231 Retry failed SEPA payouts','#/job/PAY-231','Jira'],['Ticket','PAY-240 Payout dashboard latency','#/job/PAY-240','Jira'],['Ticket','PAY-228 Ledger drift on partial refunds','#/job/PAY-228','Jira'],['PR','PR #142 SEPA retry with exponential backoff','#/pr/142','Gitea'],['PR','PR #144 Add payout CSV export','#/pr/144','Gitea'],['Build','Payout_IntegrationTests #1187','#/build/1187','TeamCity'],['Page','SEPA payout retry design','#/page/sepa','Confluence'],['Monitor','flows-stage','#/assets/monitors','Uptime Kuma'],['View','Inbox','#/inbox','knobas'],['View','Proposed links','#/review','knobas']];
function openLaunch(){
  modal(`<div class="dialog launch"><input id="lq" placeholder="Search tickets, PRs, builds, pages, assets" aria-label="Search"><div class="res" id="lres"></div></div>`);
  let idx=0;const draw=()=>{const q=$('#lq').value.toLowerCase();const r=corpus.filter(c=>c[1].toLowerCase().includes(q)||c[0].toLowerCase().includes(q));idx=Math.min(idx,r.length-1);$('#lres').innerHTML=r.map((c,i)=>`<a href="${c[2]}" aria-selected="${i===idx}" onclick="closeModal()"><span class="kind">${c[0]}</span>${esc(c[1])}<span class="src">${c[3]}</span></a>`).join('')||'<p class="dim" style="padding:8px 18px">Nothing found.</p>';return r};
  draw();$('#lq').oninput=()=>{idx=0;draw()};
  $('#lq').onkeydown=e=>{const r=draw();if(e.key==='ArrowDown'){idx=Math.min(idx+1,r.length-1);draw();e.preventDefault()}if(e.key==='ArrowUp'){idx=Math.max(idx-1,0);draw();e.preventDefault()}if(e.key==='Enter'&&r[idx]){location.hash=r[idx][2];closeModal()}};
}
$('#openLaunch').onclick=openLaunch;
$('#timer').onclick=()=>{S.timer.on?stopTimer():startTimer(S.job||S.sel)};
$('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};

/* ======================= routing & keys ======================= */
function renderRoute(){
  const h=(location.hash||'#/tickets').slice(2).split('/');
  closeDrawer();
  if(h[0]==='tickets'){if(h[1])S.view=h[1];renderTickets()}
  else if(h[0]==='job')renderJob(h[1]);
  else if(h[0]==='pr')renderPR(h[1],h[2]);
  else if(h[0]==='code'||h[0]==='repo')renderCode();
  else if(h[0]==='builds')renderBuilds();
  else if(h[0]==='build')renderBuild(h[1],h[2]);
  else if(h[0]==='assets')renderMonitors();
  else if(h[0]==='inbox')renderInbox();
  else if(h[0]==='review')renderReview(h[1]);
  else if(h[0]==='page')renderPage();
  else if(h[0]==='time')renderPlaceholder('Time');
  else renderTickets();
  renderNav();
}
function renderAll(){renderRoute();renderTimer();renderStatus()}
window.addEventListener('hashchange',()=>{renderRoute();$('#main').scrollTop=0});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openLaunch();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='t'){e.preventDefault();$('#timer').click();return}
  if(e.key==='Escape'){
    if($('#modal').classList.contains('on')){closeModal();return}
    if($('#drawer').classList.contains('on')){closeDrawer();return}
    const r=location.hash;
    if(r.startsWith('#/job'))location.hash='#/tickets';
    else if(S.job&&!r.startsWith('#/tickets'))location.hash='#/job/'+S.job;
    return}
  if(typing)return;
  const r=location.hash||'#/tickets';
  if(r.startsWith('#/job')&&e.key.toLowerCase()==='l'){openDrawer(S.job);return}
  if(r.startsWith('#/review')){const cur=suggestions.find(s=>!S.reviewed[s.id]&&(r.split('/')[2]?s.id===r.split('/')[2]:true))||suggestions.find(s=>!S.reviewed[s.id]);if(!cur)return;
    if(e.key==='y')decide(cur.id,'yes');if(e.key==='n')decide(cur.id,'no');if(e.key==='s')decide(cur.id,'skip');return}
  if(r.startsWith('#/tickets')){
    const v=views.find(x=>x.id===S.view);const list=tickets.filter(v.f);const layout=S.layout[v.id]||v.layout;
    const ordered=layout==='columns'?STATUSES.flatMap(s=>list.filter(t=>S.statusOf[t.key]===s)):list;
    const i=ordered.findIndex(t=>t.key===S.sel);
    if(e.key==='j'||e.key==='ArrowDown'){S.sel=(ordered[i+1]||ordered[i]).key;renderTickets();focusSel();e.preventDefault()}
    if(e.key==='k'||e.key==='ArrowUp'){S.sel=(ordered[i-1]||ordered[i]).key;renderTickets();focusSel();e.preventDefault()}
    if(e.key==='Enter'){location.hash='#/job/'+S.sel}
  }
});
if(location.search.includes("light"))document.documentElement.dataset.theme="light";
renderAll();
</script>
