<!doctype html>
<!--
  The ticket page, redrawn (#/ticket/<entity id>, spec #2227), and the merged page where the
  same card is the job once pinned.

  Drawn on the app's own stylesheets: every <link> below is a file under
  app/src/lib/tf/css/, in tf.css's order, and every class in the page exists
  there, except the few in the "Proposed additions" style block, which is the
  whole CSS change. The markup is the DOM the Svelte component would produce,
  so porting it is a component change and one block of tickets.css.

  Open from the repository root (a static server or the file itself). The
  yellow bar at the bottom left switches ticket, state and theme; it is not
  part of the app. ?state=<name> and ?theme=light|dark do the same from the
  address; &bar=0 hides the bar.
-->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket page mockup</title>
<!-- The vendored fonts, as the app bundles them (family "Archivo Variable"); Google Fonts behind them for a server rooted at mockups/. -->
<link rel="stylesheet" href="../../app/node_modules/@fontsource-variable/archivo/wdth.css">
<link rel="stylesheet" href="../../app/node_modules/@fontsource/jetbrains-mono/latin-400.css">
<link rel="stylesheet" href="../../app/node_modules/@fontsource/jetbrains-mono/latin-600.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- The app's stylesheets, in tf.css's import order. -->
<link rel="stylesheet" href="../../app/src/lib/tf/css/tokens.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/chrome.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/job.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/settings.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/dialogs.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/time.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/toasts.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/filter.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/tickets.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/narrow.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/connections.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/views.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/builds.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/docs.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/deps.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/view-editor.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/inbox.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/code.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/markdown.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/monitors.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/branches.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/pr.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/sets.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/chains.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/also-on-this-job.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/first-run.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/write-queue.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/note.css">
<link rel="stylesheet" href="../../app/src/lib/tf/css/launcher.css">
<style>
  /* Google Fonts' family name behind the vendored one, for a server that cannot reach node_modules. */
  :root { --sans: "Archivo Variable", "Archivo", system-ui, sans-serif; }

  /* ================================================================================
     Proposed additions to tickets.css. These replace the two `.tf-ticketpage` /
     `.tf-ticketcard` rules there today.
     ================================================================================ */

  /* The page is the job's two columns (`.tf-ws`, job.css): the ticket's card on the left, the reading on the
     right, under its own breadcrumb. The page fills the main area, so each column scrolls on its own and the
     card's foot is always in reach; below 900px the columns stack and the page scrolls as one (narrow.css). */
  .tf-ticketpage { height: 100%; }
  .tf-ticketpage .tf-ws { flex: 1; min-height: 0; height: auto; grid-template-columns: var(--tk-side, 320px) minmax(0, 1fr); }
  /* The card's width is yours: a 6px handle on its right edge drags it (240px to 720px, kept in browser storage,
     `knobas.ticket.side`), and a double click on the handle fits it so nothing on the card wraps. The handle shows
     as the card's edge darkening under the pointer. Below 900px the columns stack and the handle is gone. */
  .tf-tkhandle { position: absolute; top: 0; bottom: 0; right: 0; width: 6px; cursor: col-resize; z-index: 2; }
  .tf-tkhandle:hover, .tf-tkhandle.tf-tkdragging { background: rgba(0,0,0,.14); }
  .tf-sheetcard .tf-tkhandle:hover, .tf-sheetcard .tf-tkhandle.tf-tkdragging { background: var(--rule); }
  .tf-ws.tf-tkdragging, .tf-ws.tf-tkdragging * { cursor: col-resize !important; user-select: none; }
  @media (max-width: 900px) { .tf-ticketpage .tf-ws { grid-template-columns: minmax(0, 1fr); } .tf-tkhandle { display: none; } }
  /* The title is at most two lines, cut with an ellipsis; a cut title shows itself whole in a small sheet that
     floats over the card while the pointer rests on it (the menu's own surface, `.tf-menu`'s shadow and radius).
     Beside the key, a copy button: one press puts the key and the title on the clipboard, for a commit, a branch
     or a chat. */
  .tf-tkhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tf-ticketcard .tf-tkcopy { color: var(--card-ink-2); }
  .tf-ticketcard .tf-tkcopy:hover { background: rgba(0,0,0,.08); color: var(--card-ink); }
  .tf-sheetcard .tf-tkcopy { color: var(--ink-2); }
  .tf-sheetcard .tf-tkcopy:hover { background: var(--sheet-2); color: var(--ink); }
  .tf-ticketcard .tf-tkcopy.tf-tkcopied { color: var(--ok); }
  .tf-ticketcard .tf-jobrow { margin-top: -6px; }
  @media (max-width: 900px) { .tf-ticketpage { height: auto; } }

  /* The card is the job card (`.tf-jobcard`, job.css): same column, padding, sections and chips.
     (Mockup only: tickets.css still carries the old 640px card; the port deletes those two rules instead.) */
  .tf-ticketpage .tf-ticketcard { width: auto; margin: 0; padding: 24px 22px 20px; gap: 16px; border: 0; border-right: 1px solid var(--card-2); border-radius: 0; overflow: auto; align-self: stretch; }
  .tf-ticketcard .tf-jobtitle { margin-top: 6px; }
  .tf-ticketcard .tf-jobrow b { font-weight: 600; }
  /* Who, the epic, the labels, the source: one short line each, the card's secondary ink. */
  .tf-tkwho { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); }
  .tf-tkwho .tf-av, .tf-ticketcard .tf-facts .tf-av { background: rgba(0,0,0,.08); border-color: rgba(0,0,0,.2); color: var(--card-ink); }
  .tf-tkwho .tf-av.tf-me, .tf-ticketcard .tf-facts .tf-av.tf-me { background: var(--card-ink); border-color: var(--card-ink); color: var(--card); }
  .tf-tkline { font-size: var(--t-sm); color: var(--card-ink-2); }
  .tf-tkline a { color: var(--card-ink); text-decoration: underline; text-underline-offset: 2px; }
  .tf-tklabels { display: flex; flex-wrap: wrap; gap: 4px; }
  .tf-ticketcard .tf-lab { border-color: rgba(0,0,0,.25); color: var(--card-ink); }
  /* Reported and logged as the preview's facts list (`dl.tf-facts`, tickets.css), so the labels line up; under the
     logged line a meter in the week chart's language: what is logged, yours in full ink, the rest of the estimate. */
  .tf-ticketcard .tf-facts { grid-template-columns: 68px minmax(0, 1fr); gap: 8px 10px; align-items: center; }
  .tf-ticketcard .tf-facts dt, .tf-ticketcard .tf-facts dd { line-height: 20px; min-height: 20px; }
  .tf-ticketcard .tf-facts dt { color: var(--card-ink-2); }
  .tf-sheetcard .tf-facts dt { color: var(--ink-2); }
  .tf-tkmeter { display: flex; height: 6px; margin-top: 5px; border-radius: 3px; overflow: hidden; background: rgba(0,0,0,.12); }
  .tf-tkmeter i { display: block; height: 100%; }
  .tf-tkmeter .tf-tkme { background: var(--card-ink); }
  .tf-tkmeter .tf-tkothers { background: rgba(0,0,0,.3); }
  .tf-sheetcard .tf-tkmeter { background: var(--rule-2); }
  .tf-sheetcard .tf-tkmeter .tf-tkme { background: var(--ink); }
  .tf-sheetcard .tf-tkmeter .tf-tkothers { background: var(--ink-2); }
  .tf-tkmeter.tf-tkover { background: var(--err-bg); }
  /* The title block: the epic as the board card's own epic line (`.tf-cep`, tickets.css), above the key or under the
     title, and under it the dates line; both in the card's secondary ink. */
  .tf-ticketcard .tf-tkepic { display: block; font-size: var(--t-xs); color: var(--card-ink-2); text-decoration: none; }
  .tf-ticketcard .tf-tkepic:hover { text-decoration: underline; text-underline-offset: 2px; }
  .tf-ticketcard .tf-tkepic.tf-tkabove { margin-bottom: 6px; }
  .tf-ticketcard .tf-tkepic.tf-tkbelow { margin-top: 6px; }
  .tf-sheetcard .tf-tkepic { color: var(--ink-2); }
  /* The epic as a chip that links: the status chip's shape, underlined on hover so it reads as a place to go. */
  .tf-ticketcard .tf-facts a.tf-tkepicchip { display: inline-block; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; line-height: 18px; text-decoration: none; }
  .tf-ticketcard .tf-facts a.tf-tkepicchip:hover { text-decoration: underline; text-underline-offset: 2px; }
  /* The status as the card's chip (job.css tints `.tf-jobcard .tf-chip`), the one fact that is a state. */
  .tf-ticketcard .tf-facts .tf-chip { font-size: var(--t-xs); }
  .tf-sheetcard .tf-chip { background: var(--muted-bg); color: var(--ink); }
  .tf-ticketcard .tf-facts a { color: var(--card-ink); text-decoration: underline; text-underline-offset: 2px; }
  .tf-sheetcard .tf-facts a { color: var(--ink); }
  .tf-ticketcard .tf-facts dd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .tf-ticketcard .tf-facts dd .tf-tkmeter { flex: 1 0 100%; margin: -2px 0 4px; }
  .tf-ticketcard .tf-facts dd .tf-av { width: 20px; height: 20px; font-size: 9px; line-height: 1; }
  .tf-ticketcard .tf-facts dd .tf-chip { line-height: 18px; padding: 0 7px; }
  .tf-ticketcard .tf-facts dd .tf-lab { line-height: 16px; }
  .tf-ticketcard .tf-jobrow .tf-chip { font-size: var(--t-xs); line-height: 18px; padding: 0 7px; }
  .tf-ticketcard .tf-jobrow { margin-top: -4px; }
  /* The card's two actions under the sections, in the sections' own shape: a second bordered list of rows that open
     something, *Open in <source>* and *Link something to it* (the drawer). Refresh is the keybind's and has no row. */
  .tf-tktable.tf-tkacts a { grid-template-columns: minmax(0, 1fr) 8px; }
  /* The one decision: the preview's `.tf-go`, pinned to the card's foot, the card's own ink-on-yellow button. */
  .tf-ticketcard .tf-go { margin-top: auto; padding-top: 6px; }
  .tf-ticketcard .tf-go .tf-btn { background: var(--card-ink); color: var(--card); border-color: var(--card-ink); }

  /* Two moods of one card, the same card. A ticket you are reading sits on a sheet; the yellow is for the one
     ticket you are on, as the design system's first rule says, and the yellow is the only difference. */
  .tf-ticketcard.tf-sheetcard { background: var(--sheet); color: var(--ink); border-right-color: var(--rule); }
  .tf-ticketcard.tf-sheetcard::before { content: none; }
  .tf-sheetcard .tf-jobdim, .tf-sheetcard p, .tf-sheetcard h2, .tf-sheetcard .tf-tkline, .tf-sheetcard .tf-go small { color: var(--ink-2); }
  .tf-sheetcard section { border-top-color: var(--rule-2); }
  .tf-sheetcard .tf-tkwho .tf-av, .tf-sheetcard .tf-facts .tf-av { background: var(--sheet-2); border-color: var(--rule); color: var(--ink-2); }
  .tf-sheetcard .tf-tkwho .tf-av.tf-me, .tf-sheetcard .tf-facts .tf-av.tf-me { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
  .tf-sheetcard .tf-lab { border-color: var(--rule); color: var(--ink-2); }
  .tf-sheetcard .tf-tkline a { color: var(--ink); }
  .tf-sheetcard .tf-go .tf-btn { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
  .tf-ticketcard .tf-jobkey { font-size: var(--t-d2); }
  /* The card has no hole: the punched job card is the one thing the page does not keep. */
  .tf-ticketcard::before { content: none; }

  /* The sections on the card: one line each, three columns that align down the list. The name, the count in
     tabular figures, and at most one state with its dot, the worst one, only where something asks for you.
     The rollup's full words are the row's title. The row opens the section's view with *This job* set. */
  .tf-tksec { display: flex; flex-direction: column; margin: 0 -8px; }
  .tf-tksec a {
    display: grid; grid-template-columns: 66px 2.2ch minmax(0, 1fr); gap: 10px; align-items: center;
    padding: 5px 8px; border-radius: 4px; text-decoration: none; color: inherit; font-size: var(--t-sm); white-space: nowrap;
  }
  .tf-tksec a:hover { background: rgba(0,0,0,.07); }
  .tf-sheetcard .tf-tksec a:hover { background: var(--sheet-2); }
  .tf-tksec .tf-n { font-variant-numeric: tabular-nums; text-align: right; color: var(--card-ink-2); }
  .tf-tksec .tf-st { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--card-ink-2); }
  .tf-sheetcard .tf-tksec .tf-n, .tf-sheetcard .tf-tksec .tf-st { color: var(--ink-2); }
  .tf-tksec .tf-st.tf-asks { color: var(--card-ink); }
  .tf-sheetcard .tf-tksec .tf-st.tf-asks { color: var(--ink); }
  .tf-tksec .tf-dot { width: 7px; height: 7px; }
  /* The yellow card is a light surface in both themes, so its dots take the light tones: dark's --warn is the
     card's own yellow and its --err is pink on it. */
  .tf-card .tf-tksec .tf-dot.tf-warn { background: #8A5600; }
  .tf-card .tf-tksec .tf-dot.tf-err { background: #B0262A; }
  .tf-card .tf-tksec .tf-dot.tf-info, .tf-card .tf-tksec .tf-dot.tf-run { background: #2F55D4; }
  .tf-card .tf-tksec .tf-dot.tf-ok { background: #1F7444; }

  /* ---- The sections as a table: the preview's bordered list (`.tf-rollup`'s shape), one row a link, a chevron at
     its end as the breadcrumb writes it. The box says "a list of places", the chevron says "opens". ---- */
  .tf-tktable { display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,.2); border-radius: 6px; background: rgba(255,255,255,.26); overflow: hidden; }
  .tf-sheetcard .tf-tktable { border-color: var(--rule); background: var(--paper); }
  .tf-tktable a {
    display: grid; grid-template-columns: 62px 2.2ch minmax(0, 1fr) 8px; gap: 10px; align-items: center;
    padding: 7px 10px; border-top: 1px solid rgba(0,0,0,.12); text-decoration: none; color: inherit; font-size: var(--t-sm); white-space: nowrap;
  }
  .tf-sheetcard .tf-tktable a { border-top-color: var(--rule-2); }
  .tf-tktable a:first-child { border-top: 0; }
  .tf-tktable a:hover { background: rgba(0,0,0,.07); }
  .tf-sheetcard .tf-tktable a:hover { background: var(--sheet-2); }
  .tf-tktable .tf-n { font-variant-numeric: tabular-nums; text-align: right; color: var(--card-ink-2); }
  .tf-tktable .tf-st { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--card-ink-2); }
  .tf-tktable .tf-st.tf-asks { color: var(--card-ink); }
  .tf-sheetcard .tf-tktable .tf-n, .tf-sheetcard .tf-tktable .tf-st { color: var(--ink-2); }
  .tf-sheetcard .tf-tktable .tf-st.tf-asks { color: var(--ink); }
  .tf-tktable .tf-chev { color: var(--card-ink-2); font-size: var(--t-lg); line-height: 1; text-align: right; }
  .tf-sheetcard .tf-tktable .tf-chev { color: var(--ink-2); }
  .tf-tktable .tf-dot { width: 7px; height: 7px; }
  .tf-card .tf-tktable .tf-dot.tf-warn, .tf-card .tf-tktiles .tf-dot.tf-warn { background: #8A5600; }
  .tf-card .tf-tktable .tf-dot.tf-err, .tf-card .tf-tktiles .tf-dot.tf-err { background: #B0262A; }
  .tf-card .tf-tktable .tf-dot.tf-info, .tf-card .tf-tktiles .tf-dot.tf-info { background: #2F55D4; }

  /* ---- The sections as tiles: two a row, each a small bordered card with the name, the count as a display
     figure and the state. The fifth spans the row. A border and a hover border are the tile's "press me". ---- */
  .tf-tktiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .tf-tktiles a {
    display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 8px 10px 7px; border: 1px solid rgba(0,0,0,.2); border-radius: 6px;
    background: rgba(255,255,255,.26); text-decoration: none; color: inherit;
  }
  .tf-tktiles a:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tf-tktiles a:hover { border-color: var(--card-ink); }
  .tf-sheetcard .tf-tktiles a { border-color: var(--rule); background: var(--paper); }
  .tf-sheetcard .tf-tktiles a:hover { border-color: var(--ink-2); }
  .tf-tktiles .tf-tkname { font-size: var(--t-xs); color: var(--card-ink-2); }
  .tf-tktiles .tf-tkn { font-size: var(--t-2xl); font-weight: 800; font-variation-settings: "wdth" 62; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .tf-tktiles .tf-st { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-xs); color: var(--card-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; }
  .tf-tktiles .tf-st.tf-asks { color: var(--card-ink); }
  .tf-sheetcard .tf-tktiles .tf-tkname, .tf-sheetcard .tf-tktiles .tf-st { color: var(--ink-2); }
  .tf-sheetcard .tf-tktiles .tf-st.tf-asks { color: var(--ink); }
  .tf-tktiles .tf-dot { width: 6px; height: 6px; }

  /* The page's head in the reading column: the title at the page-title step (`.tf-fhead`'s type, chrome.css), whole,
     and under it the page's actions as a header's buttons, default size (Controls), the ghost ones last. */
  .tf-tkpagehead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: -8px; }
  .tf-tkpagehead h1 { flex: 1; min-width: 0; }
  .tf-tkpagehead .tf-acts { flex: none; margin-top: -2px; }
  .tf-tkpagehead h1 { font-size: var(--t-3xl); line-height: 1.15; font-weight: 700; font-variation-settings: "wdth" 85; overflow-wrap: anywhere; }
  .tf-tkpagehead .tf-acts { display: flex; gap: var(--control-gap); flex-wrap: wrap; }
  /* The reading column: the description and the thread, at a reading width. */
  /* The reading column sits centred in the space beside the card (Björn's call; the design system's left
     alignment stays everywhere else). */
  .tf-ticketpage .tf-wbody { padding: 24px 22px 48px; }
  .tf-tkread { max-width: 880px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .tf-tkread > section > header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-height: var(--control-h-sm); }
  .tf-tkread > section > header h2 { font-size: var(--t-lg); font-weight: 700; font-variation-settings: "wdth" 88; }
  .tf-tkread > section > header .tf-dim { font-size: var(--t-sm); }
  /* The description is the ticket's Markdown in a resting panel, at body size, wrapped at a reading measure. */
  .tf-tkdesc { padding: 14px 16px; }
  .tf-tkdesc .tf-md { padding: 0; font-size: var(--t-md); }
  .tf-tkdesc p.tf-dim { font-size: var(--t-sm); }
  /* The thread is the job's (`.tf-convo`, connections.css); the compose box is one line until it is used. */
  .tf-tkread .tf-convo { max-width: none; }
  .tf-tkread .tf-compose textarea { min-height: 36px; }
  .tf-tkread .tf-compose:focus-within textarea { min-height: 80px; }
  /* Attachments (the mirror holds the list, `fields.attachment`; the bytes come live through the source's credential):
     a panel of rows, the job's `.tf-r`, each with a preview or the file's kind, the name, who and when and how big,
     and *Open* and *Download*. A preview that cannot be fetched is a dashed placeholder, as `.tf-md-noimg` draws one. */
  .tf-tkatt .tf-r { grid-template-columns: 56px minmax(0, 1fr) auto; display: grid; align-items: center; gap: 12px; padding: 8px 12px; }
  .tf-tkatt .tf-r .tf-rend { margin-left: 0; }
  .tf-tkthumb { width: 56px; height: 40px; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet-2); object-fit: cover; display: block; }
  .tf-tkkind, .tf-tkthumb.tf-tknone {
    width: 56px; height: 40px; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet-2);
    display: grid; place-items: center; font: 600 var(--t-2xs) var(--mono); font-variant-ligatures: none; color: var(--ink-2);
  }
  .tf-tkthumb.tf-tknone { border-style: dashed; background: none; }
  .tf-tkatt .tf-rsub { white-space: normal; }
  .tf-tkatt .tf-rend .tf-btn { color: var(--ink-2); }
  /* The panel folds: a <details> whose summary is the section heading, closed by default, with the names it holds
     after the count so nobody opens it to learn what is there. The marker is the table's own sort glyph. */
  .tf-tkread details.tf-tkfold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: var(--control-h-sm); margin-bottom: 10px; border-radius: 4px; }
  .tf-tkread details.tf-tkfold > summary::-webkit-details-marker { display: none; }
  .tf-tkread details.tf-tkfold > summary h2 { font-size: var(--t-lg); font-weight: 700; font-variation-settings: "wdth" 88; }
  .tf-tkread details.tf-tkfold > summary .tf-dim { font-size: var(--t-sm); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tf-tkread details.tf-tkfold > summary .tf-tkmark { width: 14px; height: 14px; color: var(--ink-2); transition: transform 120ms ease-out; }
  .tf-tkread details.tf-tkfold[open] > summary .tf-tkmark { transform: rotate(90deg); }
  .tf-tkread details.tf-tkfold > summary:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
  /* The warn strip the job uses for stale data (`.tf-stale`, job.css), here for a source that cannot be reached. */

/* The logged meter: yours, others', the rest of the estimate; over the estimate the track turns err. */
function meter(l) {
  const total = Math.max(l.estimate, l.spent);

  const mine = byMe ? l.mine : 0, others = l.spent - mine;
  return `<span class="tf-tkmeter${l.spent > l.estimate ? " tf-tkover" : ""}" role="img" aria-label="${esc(l.text)} logged${byMe ? `, ${esc(l.mineText)}` : ""}">${

  return `<figure class="tf-tkfig"><img src="${SHOT(640, 240, att.seed)}" alt="${esc(name)}"></figure>`;

  const names = list.length <= 2 ? list.map((a) => a.name).join(", ") : `${list.slice(0, 2).map((a) => a.name).join(", ")} and ${list.length - 2} more`;
  return `<section aria-labelledby="tk-att"><details class="tf-tkfold"${attOpen ? " open" : ""}>
    <summary><h2 id="tk-att">Attachments</h2><span class="tf-count">${list.length}</span><svg class="tf-tkmark" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg></summary>
    <div class="tf-panel tf-tkatt">${notice}<div class="tf-rows">${rows}</div></div></details></section>`;
}

/* The reading column: the description (TfMarkdown) and the thread (entityThread) with its compose box. */
function reading(t) {
  const text = t.description === null ? null : t.description.replace(/@@INLINE:([^@]+)@@/g, (_, name) => inlineFigure(t, name));
  const desc = text !== null
    ? `<div class="tf-panel tf-tkdesc"><div class="tf-md">${text}</div></div>`
    : `<div class="tf-panel tf-tkdesc"><p class="tf-dim">The ticket has no description.</p></div>`;
  const trail = `<span class="tf-trail">
      <button type="button" class="tf-btn tf-sm tf-ghost">Link…</button>
      <a class="tf-btn tf-sm tf-ghost" href="${esc(t.webUrl)}" target="_blank" rel="noreferrer">Open in ${esc(t.source)}</a>
      <button type="button" class="tf-btn tf-sm tf-ghost">Refresh</button>
    </span>`;
  const n = t.thread.total, shown = t.thread.shown;
  const firstNew = shown.findIndex(([, , at]) => at.startsWith("today"));
  const thread = n === 0 ? `<p class="tf-dim">No comments yet.</p>` : `
      ${shown.map(([ini, name, at, mine, mention, body], i) => `${i === firstNew ? `<div class="tf-newline" id="tk-new">New since your last visit, 09:00</div>` : ""}<article class="tf-msg${mention ? " tf-mention" : ""}${i >= firstNew && firstNew >= 0 && !mine ? " tf-new" : ""}">
        <span class="tf-av${mine ? " tf-me" : ""}" aria-hidden="true">${esc(ini)}</span>
        <div class="tf-msg-body"><div class="tf-who"><b>${esc(name)}</b><span>${esc(at)}</span>${mention ? `<span class="tf-chip tf-chip-mention">mentions you</span>` : ""}</div><p>${body}</p></div>
      </article>`).join("")}`;
  const compose = `<div class="tf-compose"><textarea aria-label="Comment" placeholder="Write a comment" rows="1"></textarea><div class="tf-acts"><button type="button" class="tf-btn tf-primary" disabled>Comment</button></div></div>`;
  const fresh = firstNew >= 0 ? shown.slice(firstNew).filter(([, , , mine]) => !mine).length : 0;
  const summary = n === 0 ? "" : `<span class="tf-dim">${n === 1 ? "1 comment" : `${n} comments`}${fresh ? `, <a href="#tk-new">${fresh} new</a>` : ""}${t.thread.mentions ? `, ${t.thread.mentions === 1 ? "1 mentions you" : `${t.thread.mentions} mention you`}` : ""}</span>`;
  return `<section class="tf-work"><div class="tf-wbody"><div class="tf-tkread">
    <header class="tf-tkpagehead">
      <h1>${esc(t.title)}</h1>
    </header>
    <section aria-label="Description">${desc}</section>
    ${attachments(t)}
    <section aria-labelledby="tk-talk"><header><h2 id="tk-talk">Conversation</h2></header><div class="tf-convo">${thread}${compose}</div></section>
  </div></div></section>`;
}

function page(t, chosen) {
  setNav(t, chosen);
  return `<div class="tf-full tf-ticketpage">${crumbs(t.key, !chosen)}<div class="tf-ws">${card(t, chosen)}${reading(t)}</div></div>`;
}

function loading() {
  setNav(TICKETS.pay231, false);
  const bars = (n) => `<div class="tf-skel tf-skel-lines" aria-hidden="true">${"<span class=\"tf-skel-bar\"></span>".repeat(n)}</div>`;
  return `<div class="tf-full tf-ticketpage">${crumbs("PAY-231")}<div class="tf-ws">
    <article class="tf-jobcard tf-ticketcard tf-sheetcard" aria-label="Ticket" aria-busy="true"><div class="tf-jobkey">PAY-231</div>${bars(6)}</article>
    <section class="tf-work"><div class="tf-wbody"><div class="tf-tkread"><div class="tf-panel">${bars(5)}</div></div></div></section>
  </div></div>`;
}

function missing() {
  setNav(TICKETS.pay231, false);
  return `<div class="tf-full tf-ticketpage">${crumbs("PAY-999")}
    <div class="tf-empty"><p>No ticket PAY-999 in the mirror. It may not have synced yet.</p><a class="tf-btn" href="#/tickets">All tickets</a></div></div>`;
}

/* ------------------------------------------------------------------ the card's width */
const SIDE_MIN = 240, SIDE_MAX = 720, SIDE_KEY = "knobas.ticket.side";
function setSide(px) {
  const ws = document.querySelector(".tf-ws");
  if (!ws) return;
  const side = Math.round(Math.min(SIDE_MAX, Math.max(SIDE_MIN, px)));
  ws.style.setProperty("--tk-side", `${side}px`);
  try { localStorage.setItem(SIDE_KEY, String(side)); } catch {}
}
/* The width at which nothing on the card wraps: the card laid out at its content's width, every line kept whole. */
function fitSide() {
  const card = document.querySelector(".tf-ticketcard");
  if (!card) return;
  const clone = card.cloneNode(true);
  clone.style.cssText = "position:absolute;left:-99999px;top:0;width:max-content;max-width:none;overflow:visible;visibility:hidden";
  clone.querySelectorAll("*").forEach((el) => { el.style.whiteSpace = "nowrap"; });
  clone.querySelectorAll(".tf-facts dd").forEach((el) => { el.style.flexWrap = "nowrap"; });
  document.querySelector(".tf-ws").append(clone);
  const width = clone.getBoundingClientRect().width;
  clone.remove();
  setSide(Math.ceil(width) + 1);
}
/* A cut title shows itself whole on hover; the copy button copies and says so for a moment. */
function wireTitle() {
  document.querySelectorAll(".tf-tkcopy").forEach((b) => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); } catch {}
    b.classList.add("tf-tkcopied"); b.title = "Copied";
    setTimeout(() => { b.classList.remove("tf-tkcopied"); b.title = "Copy the key and the title"; }, 1500);
  }));
}
function wireHandle() {
  const handle = document.querySelector(".tf-tkhandle");
  const ws = document.querySelector(".tf-ws");
  if (!handle || !ws) return;
  handle.addEventListener("pointerdown", (down) => {
    if (down.button !== 0) return;
    down.preventDefault();
    handle.setPointerCapture(down.pointerId);
    handle.classList.add("tf-tkdragging"); ws.classList.add("tf-tkdragging");
    const left = ws.getBoundingClientRect().left;
    const move = (e) => setSide(e.clientX - left);
    const up = () => {
      handle.classList.remove("tf-tkdragging"); ws.classList.remove("tf-tkdragging");
      handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  });
  handle.addEventListener("dblclick", fitSide);
}

/* ------------------------------------------------------------------ the switches */
const params = new URLSearchParams(location.search);
let state = params.get("state") || "read";
let theme = params.get("theme") || "";
let shape = params.get("sec") || "table";
let byMe = params.get("mine") !== "0";
let attState = params.get("att") || "ok";
let attOpen = params.get("attopen") === "1";
if (params.get("bar") === "0") document.body.classList.add("mk-hide");

function draw() {
  const main = document.getElementById("main");
  main.innerHTML =
    state === "loading" ? loading()
    : state === "missing" ? missing()
    : state === "job" ? page(TICKETS.pay231, true)
    : state === "ops77" ? page(TICKETS.ops77, false)
    : state === "done" ? page(TICKETS.done, false)
    : state === "long" ? page({ ...TICKETS.pay231, title: "Retry failed SEPA payouts for the two banks whose PSP answers 409 on the second attempt inside the same batch window", epic: { id: "mock:PAY-200", line: "PAY-200 Payout reliability and reconciliation across all PSP integrations" } }, true)
    : page(TICKETS.pay231, false);
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  const side = params.get("side");
  if (side === "fit") fitSide();
  else if (side) setSide(Number(side));
  else { const kept = (() => { try { return localStorage.getItem(SIDE_KEY); } catch { return null; } })(); if (kept) setSide(Number(kept)); }
  wireHandle();
  wireTitle();
  document.querySelectorAll(".mk [data-state]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.state === state)));
  document.querySelectorAll(".mk [data-theme]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
  document.querySelectorAll(".mk [data-sec]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sec === shape)));
  document.querySelectorAll(".mk [data-mine]").forEach((b) => b.setAttribute("aria-pressed", String(byMe)));
  document.querySelectorAll(".mk [data-att]").forEach((b) => b.setAttribute("aria-pressed", String(attState === "down")));
}
document.querySelectorAll(".mk [data-sec]").forEach((b) => (b.onclick = () => { shape = b.dataset.sec; draw(); }));
document.querySelectorAll(".mk [data-mine]").forEach((b) => (b.onclick = () => { byMe = !byMe; draw(); }));
document.querySelectorAll(".mk [data-att]").forEach((b) => (b.onclick = () => { attState = attState === "down" ? "ok" : "down"; draw(); }));
document.querySelectorAll(".mk [data-state]").forEach((b) => (b.onclick = () => { state = b.dataset.state; draw(); }));
document.querySelectorAll(".mk [data-theme]").forEach((b) => (b.onclick = () => { theme = theme === b.dataset.theme ? "" : b.dataset.theme; draw(); }));
document.getElementById("themebtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; draw(); };
draw();
</script>
</body>
