function startTimer(id,label){
  if(S.timer.running) stopTimer(true);
  const c=CTX[id];
  S.timer={running:true,ent:id,label:label||(c?(c.kind==='adhoc'?c.title:c.label):id),startMs:now().getTime()};
  FL.timer='—:——';
  tick(`Timer started on <b>${esc(S.timer.label)}</b>`);
  toast(`Timer running on <b>${esc(S.timer.label)}</b>.`);
}
function stopTimer(silent){
  if(!S.timer.running) return null;
  const st=new Date(S.timer.startMs), s=pad(st.getHours())+':'+pad(st.getMinutes());
  const blk={s,e:nowStr(),ent:S.timer.ent,label:S.timer.label,how:'manual'};
  if(tmin(blk.e)>tmin(blk.s)) D.blocks.push(blk);
  S.timer.running=false;
  tick(`Timer stopped on <b>${esc(S.timer.label)}</b>`);
  if(!silent) toast(`Timer stopped. ${hm(tmin(blk.e)-tmin(blk.s))} on ${esc(S.timer.label)} is tracked but not logged.`);
  return blk;
}
function rerunBuild(id){
  const b=D.builds[id];
  const n=String(S.nextBuild++);
  D.builds[n]={num:+n,cfg:b.cfg,status:'queued',branch:b.branch,when:'today '+nowStr(),ticket:b.ticket,params:Object.assign({},b.params)};
  if(!ROOM[S.ctx].builds.includes(n)) ROOM[S.ctx].builds.unshift(n);
  if(!ROOM['PAY-200'].builds.includes(n)) ROOM['PAY-200'].builds.unshift(n);
  S.pending++; CORPUS=buildCorpus();
  tick(`#${n} ${b.cfg} queued locally`);
  toast(`Queued <b>#${n} ${esc(b.cfg)}</b> on ${esc(b.branch)}. TeamCity is 401 — it goes out when the password is fixed.`,{action:{act:'nav',label:'Fix now',attrs:'data-hash="#/sources"'}});
}
function finishStartWork(){
  const sw=S.startWork, k=sw.key, t=D.tickets[k], n=String(S.nextPr++);
  D.branches.push({name:'feature/PAY-240-payout-dashboard-latency',repo:'payout-service',ahead:0,local:true,ticket:k});
  D.prs[n]={num:+n,title:t.summary,repo:'payout-service',from:'feature/PAY-240-payout-dashboard-latency',to:'main',state:'open',by:'mara',
    opened:'today '+nowStr(),approvals:'0/2',reviewReq:'Jonas · today '+nowStr(),checks:[],ticket:k,comments:[],files:[]};
  t.links.push(['branch','feature/PAY-240-payout-dashboard-latency'],['pr',n]);
  t.status='In Progress'; t.updated='today '+nowStr();
  ROOM['PAY-200'].code.push(['branch','feature/PAY-240-payout-dashboard-latency'],['pr',n]);
  sw.running=false; sw.done=true; CORPUS=buildCorpus();
  if(sw.timer) startTimer(k,k);
  tick(`<b>PAY-240</b> → In Progress · PR #${n} opened`);
  toast(`Started work on PAY-240. PR #${n} is open and linked.`,{action:{act:'open',label:'Open PR #'+n,attrs:`data-hash="#/pr/${n}"`}});
  render();
}
function runStartWork(){
  const sw=S.startWork; if(sw.running||sw.done) return;
  sw.running=true; sw.steps=[]; render();
  const n=sw.timer?6:5, gap=REDUCED?40:400;
  const step=i=>{
    if(i>=n){ finishStartWork(); return; }
    sw.steps[i]='running'; render();
    setTimeout(()=>{ sw.steps[i]='done'; render(); step(i+1); },gap);
  };
  setTimeout(()=>step(0),gap/2);
}
function inboxAct(id,a){
  const i=D.inbox.findIndex(x=>x.id===id); if(i<0) return; const it=D.inbox[i];
  const drop=()=>D.inbox.splice(i,1);
  switch(a){
    case 'Review': go('#/pr/144'); return;
    case 'Open page': go('#/page/sepa'); return;
    case 'Open log': go('#/build/1187'); return;
    case 'Open PR': go('#/pr/142'); return;
    case 'Open': go('#/ticket/PAY-240'); return;
    case 'Open OPS-77': go('#/ticket/OPS-77'); return;
    case 'Start work': go('#/start-work/PAY-240'); return;
    case 'Comment on PAY-231': S.focusComment=true; go('#/ticket/PAY-231'); return;
    case 'Reply': S.replyOpen=id; render(); setTimeout(()=>{const r=$('#reply-in'); if(r) r.focus();},0); return;
    case 'Open asset': openAsset(it.asset); return;
    case 'Ack': ackAlert(it.alert); break;
    case 'Restart container': restartContainer(it.asset); CORPUS=buildCorpus(); break;
    case 'Re-run': rerunBuild('1187'); drop(); break;
    case 'Snooze': if(it.alert){const al=ALERTS.find(x=>x.id===it.alert); if(al) al.snoozed=true;}
      D.snoozed.push({id:it.id,mg:it.mg,text:it.text.replace(/<[^>]+>/g,''),returns:'Monday 2026-08-24',asset:it.asset,alert:it.alert}); drop(); toast('Snoozed until Monday 2026-08-24.'); break;
    case 'Done': drop(); toast('Marked done.'); break;
    case 'Ping Tomasz': toast('Pinged <b>Tomasz Wójcik</b> about OPS-77.'); break;
  }
  render();
}

function logMinutes(target,ctxKey,mins,text){
  if(target&&D.tickets[target]) D.tickets[target].worklogs.push({when:'today '+nowStr(),dur:hm(mins),text:text||'Tracked in knobas'});
  Object.keys(CTX).forEach(cid=>{ if(inCtx(target||ctxKey,cid)) S.logged[cid]=(S.logged[cid]||0)+mins; });
  if(!inCtx(target||ctxKey,ctxKey)) S.logged[ctxKey]=(S.logged[ctxKey]||0)+mins;
  S.unloggedWeek=Math.max(0,S.unloggedWeek-mins);
  const wk=D.week.find(w=>w.ent===(target||ctxKey)); if(wk) wk.unlogged=Math.max(0,wk.unlogged-mins);
  if(!target) (S.loggedRows=S.loggedRows||[]).push(['local',{when:'today '+nowStr(),dur:hm(mins),text:text||'Tracked in knobas'}]);
}

      D.snoozed=D.snoozed.filter(x=>x.id!==+d.id); toast('Back in the inbox.'); render(); } break;

    /* sources */
    case 'sync-all': D.sources.forEach(s=>{ if(s.state==='ok') s.syncedAt=now().getTime(); });
      tick('Sync finished · 3 sources'); toast('Synced Jira, Confluence and Gitea. TeamCity still returns 401.',{err:true}); render(); break;
    case 'sync-one': { const s=D.sources.find(x=>x.id===d.id); s.syncedAt=now().getTime(); toast(`Synced ${esc(s.name)}.`); render(); } break;
    case 'fix-pw': S.fixPw=true; render(); setTimeout(()=>{const p=$('#pw-in'); if(p) p.focus();},0); break;
    case 'fix-pw-cancel': S.fixPw=false; render(); break;
    case 'fix-pw-save': { const p=sel('pw-in'); if(!p||!p.value){toast('Enter the new TeamCity password.',{err:true});break;}
      const s=D.sources.find(x=>x.id==='teamcity'); s.state='ok'; s.syncedAt=now().getTime(); delete s.error;
      S.fixPw=false; const flushed=S.pending; S.pending=0;
      Object.values(D.builds).forEach(b=>{ if(b.status==='queued'){ b.status='running'; b.step='step 1/5 · checkout'; } });
      tick('TeamCity reconnected · sync ok');
      toast(`TeamCity reconnected.${flushed?' '+flushed+' queued write'+(flushed===1?'':'s')+' sent.':''}`); render(); } break;
    case 'snooze-pat': toast('Reminder set for 2026-08-29.'); break;
    case 'add-source': S.as={step:0,type:null,url:'',auth:null,tested:false}; openAddSource(); break;
    case 'as-type': S.as.type=d.t; S.as.url=({Jira:'https://tidewater.atlassian.net',Confluence:'https://tidewater.atlassian.net/wiki',Gitea:'https://git.tidewater.internal',TeamCity:'https://ci.tidewater.internal'})[d.t]||''; openAddSource(); break;
    case 'as-next': if(S.as.step===1){S.as.name=val('as-name');S.as.url=val('as-url')||S.as.url;}
      if(S.as.step===2){const r=$('#layer input[name=auth]:checked'); S.as.auth=r?r.value:'personal access token (PAT)';}
      S.as.step++; openAddSource(); break;
    case 'as-back': S.as.step--; openAddSource(); break;
    case 'as-test': S.as.tested=true; openAddSource(); break;
    case 'as-save': { const a=S.as;
      D.sources.push({id:slug(a.type),mg:(a.type||'XX').slice(0,2).toUpperCase(),type:a.type,name:a.name||a.type,url:a.url,auth:a.auth||'PAT',authNote:'',
        state:'ok',syncedAt:now().getTime(),count:'first sync running',adapter:slug(a.type)+' · adapter v1.2',caps:['search','write','webhooks']});
      closeLayer(); tick(`Source <b>${esc(a.type)}</b> added`); toast(`Added <b>${esc(a.name||a.type)}</b>. First sync started.`); render(); } break;

    /* time */
    case 'timer-menu': timerMenu(el); break;
    case 'timer-start': closeLayer(); startTimer(d.ent); S.switchPrompt=null; render(); break;
    case 'timer-stop': { closeLayer(); const wasEnt=S.timer.ent, b=stopTimer(true); render();
      if(wasEnt==='staging-db'||!D.tickets[wasEnt]&&!CTX[wasEnt]) openLogTo(liveBlocks().length-1);
      else openWorklog(wasEnt); } break;
    case 'switch-timer-yes': startTimer(d.ctx); S.switchPrompt=null; render(); break;
    case 'switch-timer-no': S.switchPrompt=null; toast(`Timer stays on ${esc(S.timer.label)}.`); render(); break;
    case 'worklog-open': openWorklog(d.ctx); break;
    case 'wl-discard': closeLayer(); toast('Draft discarded. The time stays tracked locally.'); render(); break;
    case 'wl-edit': toast('Interval and comment are editable in this dialog.'); break;
    case 'wl-log': { const t=$('#wl-target').value, c=S.wl.ctx, mins=S.wl.min, cm=$('#wl-comment').value.trim();
      logMinutes(t,c,mins,cm); closeLayer(); CORPUS=buildCorpus();
      tick(t?`Logged <b>${hm(mins)}</b> to ${t}`:`Kept ${hm(mins)} local`);
      toast(t?`Logged <b>${hm(mins)}</b> to ${t}. It goes to Jira on the next sync.`:`Kept ${hm(mins)} local — no ticket.`); render(); } break;
    case 'block-sel': S.selBlock=S.selBlock===+d.i?null:+d.i; if(S.view!=='time'){go('#/time');} else render(); break;
    case 'assign-menu': assignMenu(el,+d.i); break;
    case 'assign-to': { const b=D.blocks[+d.i]; b.ent=d.ctx; b.label=ctxTitle(d.ctx)+' (assigned)'; closeLayer();
      tick(`11:50–12:20 assigned to <b>${esc(ctxTitle(d.ctx))}</b>`); toast(`30 m assigned to ${esc(ctxTitle(d.ctx))}.`); render(); } break;
    case 'block-log': closeLayer(); openLogTo(d.i===undefined?5:+d.i); break;
    case 'block-keep': closeLayer(); toast('Kept local. It counts as tracked time, nothing is sent to Jira.'); render(); break;
    case 'lt-save': { const t=$('#lt-target').value, cm=$('#lt-comment').value.trim(), b=liveBlocks()[+d.i]||D.blocks[5];
      const mins=tmin(b.e)-tmin(b.s); logMinutes(t,'staging-db',mins,cm); closeLayer(); CORPUS=buildCorpus();
      tick(`Logged <b>${hm(mins)}</b> to ${t}`); toast(`Logged <b>${hm(mins)}</b> to ${t}.`); render(); } break;
    case 'log-all': { const mins=S.unloggedWeek;
      D.week.forEach(w=>{ if(w.unlogged&&D.tickets[w.ent]) D.tickets[w.ent].worklogs.push({when:'this week',dur:hm(w.unlogged),text:'Tracked in knobas'}); w.unlogged=0; });
      Object.keys(CTX).forEach(cid=>S.logged[cid]=(S.logged[cid]||0)+ctxToday(cid));
      S.unloggedWeek=0; closeLayer(); tick(`Logged <b>${hm(mins)}</b> across 4 tickets`);
      toast(`Logged <b>${hm(mins)}</b> across PAY-231, PAY-228 and the ad-hoc block.`); render(); } break;

    /* ---- assets ---- */
    case 'noop': break;
    case 'a-open': closeLayer(); openAsset(d.id); break;
    case 'a-close': S.assets.sel=null; S.assets.blast=null; go('#/assets'); break;
    case 'a-center': centerOn(d.id); break;
    case 'a-ctx-map': S.assets.ctx=d.ctx; S.assets.sel=ctxAssets(d.ctx)[0]||null; S.assets.fitted=false; go('#/assets'); break;
    case 'a-layer': S.assets.layers[d.k]=!S.assets.layers[d.k];
      toast(`Layer <b>${esc(d.k)}</b> ${S.assets.layers[d.k]?'shown':'hidden'}.`,{ms:1800}); render(); break;
    case 'a-filter': { const k=d.k, v=d.v; S.assets[k]=S.assets[k]===v?null:v;
      if(S.view!=='assets'){ go('#/assets'); } else render(); } break;
    case 'a-clear': Object.assign(S.assets,{type:null,health:null,owner:null,q:'',ctx:null}); render(); break;
    case 'a-clear-q': S.assets.q=''; render(); break;
    case 'a-zoom': if(d.v==='fit') fitMap(); else zoomBy(d.v==='in'?1.2:1/1.2);
      { const l=$('#zoomlbl'); if(l) l.textContent=Math.round(S.assets.zoom*100)+'%'; } break;
    case 'a-panel': S.assets.panel=d.p||null; render(); break;
    case 'a-blast': S.assets.blast=d.id; S.assets.sel=d.id;
      tick(`Blast radius · <b>${esc(AS[d.id].name)}</b> · ${blastOf(d.id).length} assets`); render(); break;
    case 'a-blast-off': S.assets.blast=null; render(); break;
    case 'a-smart': S.search.chain=[]; openSearch(); setQuery('list:'+d.id); break;
    case 'a-status': toast('Opened the <b>Payments</b> status page — payouts, ledger, dashboard, flows.'); break;
    case 'a-url': e.preventDefault(); toast(`Opened <b>${esc(d.v)}</b> in your browser.`); break;
    case 'a-ssh': { const ip=AS[d.id].props.IP, cmd='ssh '+P.mara.u.split('.')[0]+'@'+ip;
      try{ navigator.clipboard&&navigator.clipboard.writeText(cmd); }catch(x){}
      toast(`Copied <span class="mono">${esc(cmd)}</span> to the clipboard.`); } break;
    case 'a-copy': try{ navigator.clipboard&&navigator.clipboard.writeText('••••'); }catch(x){}
      toast('Copied the secret. It never leaves the OS keychain in plain text.'); break;
    case 'a-deep': toast(`Opened <b>${esc(AS[d.id].name)}</b> in ${esc(d.v)}.`); break;
    case 'a-restart': closeLayer(); restartContainer(d.id); CORPUS=buildCorpus(); render(); break;
    case 'a-ack': ackAlert(d.id); render(); break;
    case 'a-run': closeLayer(); runScenario(d.id); render(); break;
    case 'a-log': closeLayer(); openRunLog(d.id); break;
    case 'a-promote': closeLayer(); openPromote(d.id); break;
    case 'pr-go': closeLayer(); promoteScenario(d.id); CORPUS=buildCorpus(); render(); break;
    case 'a-sug-ok': confirmSug(d.id); CORPUS=buildCorpus(); render(); break;
    case 'a-sug-no': S.assets.dismissed.add(d.id); toast('Proposal dismissed. knobas will not suggest it again.'); render(); break;
    case 'a-link': openLinkAsset(d.id); break;
    case 'la-save': { const r=$('#la-rel').value, to=$('#la-to').value;
      if(addRelation(d.id,r,to)){ EXTRA=EXTRA.slice(); S.assets.sel=d.id; }
      closeLayer(); CORPUS=buildCorpus(); if(S.view!=='assets') go('#/asset/'+d.id); else render(); } break;
    case 'rel-pick': closeLayer(); if(addRelation(d.f,d.r,d.t)){ S.assets.sel=d.f; } CORPUS=buildCorpus(); render(); break;
    case 'a-addctx': popover(el,`<div class="lab">Add <b class="mono">${esc(AS[d.id].name)}</b> to</div>
      ${Object.values(CTX).map(c=>`<button class="it" data-act="a-addctx-to" data-id="${d.id}" data-ctx="${c.id}">
        <span>${esc(ctxTitle(c.id))}<small>${ctxAssets(c.id).length} assets · ${c.kind}</small></span>
        <span class="k">${ctxAssets(c.id).includes(d.id)?'● in':'add'}</span></button>`).join('')}
      <div class="hr"></div><button class="it" data-act="new-ctx"><span>New context…</span><span class="k">+</span></button>`); break;
    case 'a-addctx-to': closeLayer();
      if(addToCtx(d.ctx,'asset',d.id)){ ahist(d.id,`added to the <b>${esc(ctxTitle(d.ctx))}</b> context`); CORPUS=buildCorpus(); }
      else toast('Already in that context.');
      render(); break;
    case 'a-prop-add': openAddProp(d.id); break;
    case 'ap-save': { const k=val('ap-k'), t=$('#ap-t').value, v=val('ap-v');
      if(!k){toast('Give the property a key.',{err:true});break;}
      AS[d.id].custom.push({k,ty:t,v:v||'—'}); ahist(d.id,`added custom property <b>${esc(k)}</b> (${esc(t)})`);
      closeLayer(); CORPUS=buildCorpus(); toast(`Added <b>${esc(k)}</b> to ${esc(AS[d.id].name)}.`); render(); } break;
    case 'a-prop-del': { const c=AS[d.id].custom.splice(+d.i,1)[0];
      ahist(d.id,`removed custom property <b>${esc(c.k)}</b>`); CORPUS=buildCorpus();
      toast(`Removed <b>${esc(c.k)}</b>.`); render(); } break;
    case 'a-mon-new': openCreateMonitor(d.id||''); break;
    case 'cm-save': { const t=$('#cm-type').value, tg=val('cm-target'), iv=$('#cm-int').value, as=$('#cm-asset').value;
      if(!tg){toast('Enter a target to check.',{err:true});break;}
      createMonitor(t,tg,iv,as); closeLayer(); S.assets.sel=as; render(); } break;
    case 'a-mon-pause': pauseMonitor(d.id); render(); break;
    case 'a-mon-filter': S.assets.monFilter=d.v; render(); break;
    case 'a-new': S.na={step:0,type:null,props:{},custom:[],env:'prod',owner:'Payments'}; openNewAsset(); break;
    case 'na-type': S.na.type=d.t; S.na.name=''; S.na.props={}; openNewAsset(); break;
    case 'na-next': {
      if(S.na.step===1){ S.na.name=val('na-name')||SCHEMA[S.na.type][0][1]; S.na.env=$('#na-env').value; S.na.owner=$('#na-owner').value;
        S.na.props={}; SCHEMA[S.na.type].forEach(([k],i)=>{const f=$('#na-p'+i); if(f) S.na.props[k]=f.value.trim();}); }
      S.na.step++; openNewAsset(); } break;
    case 'na-back': S.na.step--; openNewAsset(); break;
    case 'na-prop-add': { const k=val('na-ck'), t=$('#na-ct').value, v=val('na-cv');
      if(!k){toast('Give the property a key.',{err:true});break;}
      S.na.custom.push({k,ty:t,v:v||'—'}); openNewAsset(); } break;
    case 'na-prop-del': S.na.custom.splice(+d.i,1); openNewAsset(); break;
    case 'na-save': { S.na.rel=$('#na-rel').value; S.na.to=$('#na-to').value||null;
      const id=createAsset(); closeLayer(); S.assets.fitted=false; go('#/asset/'+id); } break;
    case 'a-import': S.imp=S.imp||'Proxmox VE'; openImport(); break;
    case 'imp-pick': S.imp=d.v; openImport(); break;
    case 'imp-config': closeLayer(); S.as={step:0,type:d.v,url:'',auth:null,tested:false}; openAddSource(); break;
    case 'imp-run': { closeLayer();
      if(d.v==='Flowrun'){ const s=D.sources.find(x=>x.id==='flowrun'); s.syncedAt=now().getTime(); toast('Synced <b>Flowrun</b> — 3 instances, 4 scenarios, nothing changed.'); }
      else { tick(`Re-imported from <b>${esc(d.v)}</b>`);
        toast(`Re-imported from <b>${esc(d.v)}</b>. Everything matched an existing asset — nothing new, properties refreshed.`); }
      render(); } break;

    /* standup */
    case 'proto-save': { S.savedNote=true;
      D.notes['standup-22']={title:'Standup 2026-08-22',edited:'today '+nowStr(),
        body:'Attendees: '+STANDUP.attendees+'\n\n'+STANDUP.people.map(p=>p[0]+': '+p[1]).join('\n')+'\n\nActions: '+STANDUP.actions.map(x=>x.who+' → '+x.text).join(' · ')+'\n\n[[PAY-231]] [[PAY-240]] [[OPS-77]]'};
      if(!ROOM['PAY-200'].notes.includes('standup-22')) ROOM['PAY-200'].notes.push('standup-22');
      CORPUS=buildCorpus(); toast('Saved as note <b>Standup 2026-08-22</b>.'); render(); } break;
    case 'proto-publish': { S.published=true; S.pending++;
      D.pages['standup-22']={title:'Standup protocol 2026-08-22',edited:'today '+nowStr(),by:'mara',
        body:[['Attendees',STANDUP.attendees],['Notes',STANDUP.people.map(p=>p[0]+': '+p[1]).join(' ')],['Action items',STANDUP.actions.map(x=>x.who+' → '+x.text).join(' · ')]],comments:[]};
      CORPUS=buildCorpus(); tick('Published <b>Standup protocol 2026-08-22</b>');
      toast('Published to ENG › Standup protocols › 2026-08-22.'); render(); } break;
    case 'open-published': go('#/page/standup-22'); break;
    case 'ai-ticket': { const it=STANDUP.actions[+d.i], key='PAY-'+(S.nextKey++);
      D.tickets[key]={key,epic:'PAY-200',summary:it.text,type:'Task',status:'To Do',priority:'Medium',assignee:it.who.toLowerCase()==='mara'?'mara':it.who.toLowerCase()==='tomasz'?'tomasz':'lena',
        updated:'today '+nowStr(),desc:'From the standup protocol 2026-08-22 — owner '+it.who+'.',comments:[],estimate:'—',spentWeek:'0m',worklogs:[],links:[]};
      it.key=key; addToCtx('PAY-200','ticket',key,true); CORPUS=buildCorpus();
      tick(`<b>${key}</b> created from an action item`); toast(`Created <b>${key}</b> from the action item.`); render(); } break;
    case 'copy-digest': try{ navigator.clipboard&&navigator.clipboard.writeText('knobas digest 2026-08-22'); }catch(x){}
      toast('Digest copied — 11 lines, grouped by context.'); break;
  }
});
function ensureCtx(k){
  if(CTX[k]) return k;
  const t=D.tickets[k]; if(!t) return null;
  CTX[k]={id:k,kind:'ticket',label:k,title:t.summary,members:[k],color:'var(--c-ticket)'};
  ROOM[k]={tickets:[k],code:[],builds:[],pages:[],notes:[],assets:[]};
  (t.links||[]).forEach(([lt,lid])=>{ const b=BUCKET[lt]; if(!b) return; if(b==='code') ROOM[k].code.push([lt,lid]); else ROOM[k][b].push(lid); });
  toast(`<b>${k}</b> is now a context of its own.`);
  return k;
}
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const d=el.dataset;
  if(d.act==='status-set'){ setStatus(d.key,el.value); render(); }
  if(d.act==='wl-toggle'){ const a=D.activity.find(x=>x.id===d.id); a.on=el.checked;
    const ta=$('#wl-comment'); if(ta) ta.value=draftComment(); }
  if(d.act==='wl-target'){ const t=$('#wl-tk'); if(t) t.textContent=el.value||'nothing'; S.wl.target=el.value; }
  if(d.act==='sw-timer'){ S.startWork.timer=el.checked; render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ S.search.q=e.target.value; S.search.sel=0; refreshSearch(); focusQ(); }
  if(e.target.id==='link-q'){ const m=e.target.dataset.mode; S.linkQ=e.target.value;
    const p=$('.pop'); if(p){ p.innerHTML=linkPickerHtml(m); const i=$('#link-q',p); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} } }
});
/* traceable digest lines */
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]'); if(!t) return;
  const old=$('.tip'); if(old) old.remove();
  const el=document.createElement('div'); el.className='tip'; el.textContent=t.dataset.tip; document.body.append(el);
  const r=t.getBoundingClientRect(); el.style.left=Math.max(8,Math.min(r.left,innerWidth-el.offsetWidth-10))+'px';
  el.style.top=(r.top-el.offsetHeight-6<8?r.bottom+6:r.top-el.offsetHeight-6)+'px';
  t.addEventListener('mouseleave',()=>el.remove(),{once:true});
});
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  /* rows that are divs with role=button still answer to ↵ */
  if(e.key==='Enter'&&!mod&&e.target instanceof HTMLElement&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){
    e.preventDefault(); e.target.click(); return; }
  if(mod&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(mod&&e.key.toLowerCase()==='t'){ e.preventDefault();
    if(S.timer.running){ const w=S.timer.ent, b=stopTimer(true); render(); if(D.tickets[w]) openWorklog(w); else openLogTo(liveBlocks().length-1); }
    else { startTimer(S.ctx); render(); } return; }
  const box=$('.dlg.search');
  if(e.key==='Escape'){
    /* Esc unwinds one step at a time: chain step → query → box → detail → room */
    if(box){
      if(S.search.chain.length){ S.search.chain.pop(); setQuery(''); return; }
      if(S.search.q){ setQuery(''); return; }
      closeLayer(); return;
    }
    if($('#layer').innerHTML.trim()){ closeLayer(); return; }
    if(S.view==='assets'){
      if(S.assets.panel){ S.assets.panel=null; render(); return; }
      if(S.assets.blast){ S.assets.blast=null; render(); return; }
      if(S.assets.sel){ S.assets.sel=null; go('#/assets'); return; }
    }
    if(S.detail){ go('#/ctx/'+S.ctx); return; }
    if(S.view!=='room'){ go('#/ctx/'+S.ctx); return; }
    return;
  }
  if(box){
    const rows=S.search.rows||[];
    if(e.key==='ArrowDown'){ e.preventDefault(); S.search.sel=Math.min(rows.length-1,S.search.sel+1); refreshSearch(); focusQ(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); S.search.sel=Math.max(0,S.search.sel-1); refreshSearch(); focusQ(); return; }
    if(e.key==='Enter'){ e.preventDefault(); openRow(S.search.sel); return; }
    if(e.key==='Tab'&&!e.shiftKey){
      const r=rows[S.search.sel];
      if(r&&r.kind==='ent'&&!S.search.chain.length&&ACTS[r.t]){ e.preventDefault(); openChain(r.t,r.id); }
      return;
    }
  }
});

/* ======================================================================
   CLOCK
   ====================================================================== */
setInterval(()=>{
  if(S.timer.running){
    const ms=elapsedMs(), s=$('#tsec');
    if(s) s.textContent=':'+pad(Math.floor(ms/1000)%60);
    const v=mstr(Math.floor(ms/60000)), el=$('[data-flap="timer"]');
    if(el&&FL.timer!==v){ flipEl(el,v); FL.timer=v; }
  }
  const c=$('#clock'); if(c) c.textContent='Fri 2026-08-22 '+nowStr();
},1000);

/* ======================================================================
   BOOT
   ====================================================================== */
renderTicker();
if(!location.hash) { try{ history.replaceState(null,'','#/ctx/PAY-200'); }catch(x){ location.hash='#/ctx/PAY-200'; } }
route();
window.addEventListener('hashchange',route);
} catch(err){
  const e=document.getElementById('errlog');
  if(e){ e.hidden=false; e.textContent='JS error: '+(err&&err.message?err.message:err); }
  if(window.console) console.error(err);
}
window.addEventListener('error',ev=>{
  const e=document.getElementById('errlog');
  if(e){ e.hidden=false; e.textContent='JS error: '+ev.message; }
});
</script>
