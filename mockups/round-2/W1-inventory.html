<!--
knobas mockup
round: 2
way: W1 Inventory
design: D1 Signal
thesis: Every machine, container, route, scenario and monitor is a row on one typed board — pick a type in the rail and it gets its own columns, group by host and it becomes a tree, so 32 assets read as fast as 300 would.
thesis: The board is the room's missing tile: the same graphite rows, the same mono readings and the same amber the context hub already uses, and the launcher box reaches it with asset:, /assets and type/env/health chips.
thesis: The WIRED column — a chain of two-letter monograms per row (VM CT SV RT DB MO FR SC) that says what a thing is wired to before you open it, and highlights the other end when you touch it.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knobas — PAY-200 Payout reliability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15171A;--panel:#1D2024;--raised:#24282D;--hair:#2E3339;--hair2:#3A4047;
  --text:#E7E9EC;--muted:#8B929A;--faint:#5A6169;
  --amber:#FFB020;--fail:#FF6A5C;--ok:#7FD1A1;--link:#9CC3FF;
  --c-epic:#2C3D55;--c-ticket:#365179;--c-adhoc:#3A5248;--c-none:#2A2E33;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --row:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:1px solid var(--link);outline-offset:1px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--hair2);border-radius:2px}
.mono,.k{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font:600 11px/1 var(--disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.amber{color:var(--amber)}.fail{color:var(--fail)}.ok{color:var(--ok)}.link{color:var(--link)}
.hidden{display:none!important}

/* ---- app frame ---- */
.app{display:grid;grid-template-rows:20px 44px 1fr 24px;height:100vh;min-width:1100px;overflow:hidden}
.app>*{min-width:0}
.ticker{background:var(--bg);border-bottom:1px solid var(--hair);overflow:hidden;white-space:nowrap;font:500 11px/19px var(--mono);color:var(--amber);position:relative}
.ticker::before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:var(--amber);opacity:.6}
.ticker-track{display:inline-block;padding-left:100%;animation:tick 70s linear infinite;will-change:transform}
.ticker-track i{font-style:normal;color:var(--faint);margin:0 14px}
.ticker-track b{font-weight:500;color:var(--muted)}
@keyframes tick{to{transform:translateX(-100%)}}

.topbar{display:flex;align-items:center;gap:9px;padding:0 12px 0 14px;border-bottom:1px solid var(--hair);background:var(--panel);overflow:hidden}
.ctx-switch{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 0;border-right:1px solid var(--hair);margin-right:2px;flex:none}
.ctx-switch .lab{display:none}
.ctx-switch .lab{color:var(--faint)}
.ctx-name{display:flex;align-items:baseline;gap:8px;font:600 20px/1.2 var(--disp);letter-spacing:.01em;padding:2px 6px;border-radius:2px;white-space:nowrap;max-width:184px;overflow:hidden;text-overflow:ellipsis}
.ctx-name:hover{background:var(--raised)}
.ctx-name .k{font:500 13px var(--mono);color:var(--muted);flex:none}
.ctx-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ctx-name svg{width:12px;height:12px;stroke:var(--muted);align-self:center}
.tabs{display:flex;gap:2px;min-width:0;overflow:hidden}
.tab{height:28px;padding:0 10px;border-radius:2px;font:500 12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;flex:none}
.tab:hover{color:var(--text);background:var(--raised)}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.tab.new{color:var(--faint);font-family:var(--sans)}
.spacer{flex:1}
.tb-btn{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border-radius:2px;color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.tb-btn:hover{background:var(--raised);color:var(--text)}
.tb-btn.on{color:var(--text);background:var(--raised)}
.tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tb-btn .k{font-size:12px}
.timer{border:1px solid var(--hair);gap:6px;padding:0 8px 0 6px}
.timer.run{border-color:var(--hair2)}
.timer .ss{font:400 11px var(--mono);color:var(--faint);width:3ch;flex:none}
.timer .ctx{font:500 12px var(--mono);color:var(--text)}
.timer .pulse{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.timer.off .pulse{background:var(--faint)}
.sync{display:flex;gap:3px;align-items:center;padding:0 4px;height:30px;border-radius:2px;flex:none}
.sync:hover{background:var(--raised)}
.sync .mg{position:relative}
.sync .mg::after{content:"";position:absolute;right:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.sync .mg.err{color:var(--fail);border-color:var(--fail)}
.sync .mg.err::after{background:var(--fail)}
.sync .err-txt{font:500 11px var(--mono);color:var(--fail);margin-left:4px}

.mg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:16px;border:1px solid var(--hair2);border-radius:2px;font:500 10px/1 var(--mono);color:var(--muted);letter-spacing:.04em;flex:none}

/* ---- flap cells ---- */
.flap{position:relative;display:inline-block;flex:none;height:20px;min-width:72px;padding:0 6px;border-radius:2px;background:var(--raised);font:500 12px/20px var(--mono);text-align:center;vertical-align:middle;white-space:nowrap;perspective:240px;overflow:hidden;color:var(--text)}
.flap>span{position:absolute;inset:0;padding:0 6px;background:var(--raised);backface-visibility:hidden;white-space:nowrap}
.flap .ft{clip-path:inset(0 0 50% 0)}
.flap .fb{clip-path:inset(50% 0 0 0)}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--bg);z-index:3}
.flap .leaf{z-index:2;transform-origin:50% 50%}
.flap .leaf.top{clip-path:inset(0 0 50% 0);animation:flapTop .175s ease-in forwards}
.flap .leaf.bot{clip-path:inset(50% 0 0 0);animation:flapBot .175s .175s ease-out both}
@keyframes flapTop{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes flapBot{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.flap.amber{color:var(--amber)}.flap.fail{color:var(--fail)}.flap.ok{color:var(--ok)}.flap.dim{color:var(--muted)}
.flap.big{height:26px;line-height:26px;font-size:15px;min-width:84px}
.flap.w-s{min-width:46px}.flap.w-t{min-width:58px}.flap.w-m{min-width:118px}.flap.w-b{min-width:80px}.flap.w-r{min-width:104px}

/* ---- main / room ---- */
.main{position:relative;overflow:hidden;background:var(--bg);min-width:0}
.room{display:flex;flex-direction:column;height:100%;min-width:0}
.room>*{min-width:0;flex:none}
.room-bar{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-bottom:1px solid var(--hair);overflow:hidden}
.room-bar h1{font:600 22px/1.2 var(--disp);display:flex;align-items:baseline;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.room-bar h1 .k{font:500 14px var(--mono);color:var(--muted)}
.kind{font:600 10px/1 var(--disp);text-transform:uppercase;letter-spacing:.1em;color:var(--faint);border:1px solid var(--hair);padding:4px 5px 3px;border-radius:2px}
.room-bar .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.prompt{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--hair);background:var(--panel);font-size:12px}
.prompt .pulse{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr 172px;gap:1px;background:var(--hair);min-height:0;flex:1 1 auto}
.tile{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0}
.tile-h{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-bottom:1px solid var(--hair);flex:none}
.tile-h .cnt{font:500 11px var(--mono);color:var(--faint)}
.tile-h .acts{margin-left:auto;display:flex;gap:2px}
.tile-b{overflow:auto;flex:1;min-height:0}
.empty{padding:14px 12px;color:var(--muted);font-size:12px;line-height:1.5}
.empty .btn{margin-top:8px}

.row{width:100%;text-align:left;font-family:var(--sans);display:grid;grid-template-columns:34px 92px 1fr 100px 80px;align-items:center;height:var(--row);padding:0 12px 0 8px;border-bottom:1px solid var(--hair);font-size:12px;cursor:pointer;column-gap:8px;color:var(--text)}
.row:hover{background:var(--panel)}
.row.sel{background:var(--raised)}
.row>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .k{font-size:12px}
.row .t{color:var(--text)}
.row .r{text-align:right;color:var(--muted);font-family:var(--mono);font-size:11px}
.row .sub{color:var(--muted)}
.row.g4{grid-template-columns:34px 1fr 100px 80px}
.row.g3{grid-template-columns:34px 1fr 80px}
.row.g5w{grid-template-columns:34px 130px 1fr 100px 120px}
.row.hd{height:22px;cursor:default;color:var(--faint);font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--bg)}
.row.hd:hover{background:var(--bg)}
.row svg,.card svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);height:100%}
.col{background:var(--bg);min-width:0;display:flex;flex-direction:column}
.col-h{display:flex;justify-content:space-between;align-items:center;height:22px;padding:0 8px;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);border-bottom:1px solid var(--hair)}
.card{display:block;width:100%;text-align:left;padding:6px 8px;border-bottom:1px solid var(--hair);cursor:pointer;font-size:12px}
.card:hover{background:var(--panel)}
.card.sel{background:var(--raised)}
.card .k{display:flex;justify-content:space-between;color:var(--text);font-size:12px}
.card .k .pr{color:var(--faint);font-size:10px}
.card .s{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.card .bl{display:block;color:var(--fail);font:400 11px var(--mono);margin-top:3px}
.card .bl:hover{text-decoration:underline}

/* ticket focus (single-ticket context) */
.focus{padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.focus h2{font:500 15px/1.3 var(--sans)}
.focus .meta{display:flex;gap:14px;margin-top:8px;font:400 11px var(--mono);color:var(--muted)}
.focus p{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}

/* time tile */
.tstat{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 12px 6px;gap:8px}
.tstat .v{font:500 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.tstat .l{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-top:4px}
.tline{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--muted)}
.tline .pulse{width:7px;height:7px;border-radius:50%;background:var(--amber)}

/* tray */
.tray{border-top:1px solid var(--hair);background:var(--panel)}
.tray .tile-h{border-bottom:0}
.tray .row{grid-template-columns:34px 1fr 1fr 170px}
.row.sug{grid-template-columns:34px 1fr 1.05fr 172px}
.row.sug .acts{display:flex;gap:4px;justify-content:flex-end}
.row.sug .why{color:var(--muted);font-size:11px}
.tray .row:last-child{border-bottom:0}
.tray .why{color:var(--muted);font-size:11px}
.tray .why .k{font-size:11px}
.tray .acts{display:flex;gap:4px;justify-content:flex-end}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--hair2);border-radius:2px;font:500 12px var(--sans);color:var(--text);white-space:nowrap;background:transparent}
.btn:hover{background:var(--raised)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.pri:hover{background:#fff}
.btn.sm{height:20px;padding:0 6px;font-size:11px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn.danger{color:var(--fail);border-color:var(--fail)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn .k{font-size:11px}
.sel-inline{height:22px;padding:0 4px;border:1px solid var(--hair2);border-radius:2px;background:var(--panel);font:500 12px var(--mono);color:var(--text)}
.sel-inline option{background:var(--panel)}
.inp{height:26px;padding:0 8px;border:1px solid var(--hair2);border-radius:2px;background:var(--bg);color:var(--text);width:100%}
.inp:focus{border-color:var(--link);outline:0}
.inp.k{font-family:var(--mono);font-size:12px}
textarea.inp{height:auto;min-height:64px;padding:6px 8px;resize:vertical;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px 0 3px;border:1px solid var(--hair2);border-radius:2px;font:500 11px var(--mono);color:var(--link);vertical-align:middle;cursor:pointer;white-space:nowrap;background:var(--panel)}
.chip:hover{border-color:var(--link)}
.chip .mg{width:18px;height:13px;font-size:9px}
.chip.lbl{color:var(--text);font-family:var(--sans);cursor:default}
.chip.lbl:hover{border-color:var(--hair2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid var(--hair2);border-radius:2px;font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.pill.on{color:var(--text);border-color:var(--text)}
.pill:hover{background:var(--raised)}
.pill.cross{border-style:dashed}

/* ---- detail panel ---- */
.detail{position:absolute;top:0;right:0;bottom:0;width:50%;min-width:540px;background:var(--panel);border-left:1px solid var(--hair);display:flex;flex-direction:column;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.d-h{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 14px;border-bottom:1px solid var(--hair);flex:none}
.d-h .crumb{font:400 11px var(--mono);color:var(--faint)}
.d-h .crumb b{font-weight:500;color:var(--muted)}
.d-h .x{margin-left:auto}
.d-b{overflow:auto;flex:1;padding:0 0 24px}
.d-title{padding:14px 14px 8px;display:flex;gap:12px;align-items:flex-start}
.d-title h2{font:500 17px/1.3 var(--sans);flex:1}
.d-title .k{font:500 14px var(--mono);color:var(--muted);display:block;margin-bottom:3px}
.d-meta{display:grid;grid-template-columns:repeat(4,auto);gap:6px 18px;padding:6px 14px 10px;border-bottom:1px solid var(--hair)}
.d-meta .l{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.d-meta .v{font-size:12px;margin-top:2px;display:flex;align-items:center;gap:6px}
.d-meta .v.k{font-size:12px}
.sec{padding:10px 14px;border-bottom:1px solid var(--hair)}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec-h .acts{margin-left:auto;display:flex;gap:4px}
.sec p{font-size:12.5px;line-height:1.55;color:var(--text)}
.sec p .k{font-size:11.5px;color:var(--link)}
.sec .row{margin:0 -14px;padding-left:10px;padding-right:14px}
.sec .row:last-of-type{border-bottom:0}
.cmt{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--hair)}
.cmt:first-of-type{border-top:0}
.av{width:24px;height:24px;border-radius:2px;background:var(--raised);font:500 10px/24px var(--mono);text-align:center;color:var(--muted)}
.cmt .who{font-size:12px;display:flex;gap:8px;align-items:baseline}
.cmt .who .k{font-size:11px;color:var(--faint)}
.cmt .txt{font-size:12.5px;line-height:1.5;color:var(--text);margin-top:1px}
.cmt-new{display:grid;grid-template-columns:28px 1fr;gap:8px;padding-top:8px}
.cmt-new .acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.log{background:var(--bg);border:1px solid var(--hair);border-radius:2px;padding:8px 10px;font:400 11.5px/1.5 var(--mono);white-space:pre-wrap;color:var(--muted);overflow:auto}
.log .fail{color:var(--fail)}
.log .ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:150px 1fr;row-gap:4px;font-size:12px}
.kv .l{color:var(--faint);font:400 11px var(--mono)}
.kv .v{font-family:var(--mono);font-size:12px}
.note-ed{min-height:160px;padding:10px 12px;border:1px solid var(--hair);border-radius:2px;background:var(--bg);font:13px/1.6 var(--sans);white-space:pre-wrap;outline:0}
.note-ed:focus{border-color:var(--hair2)}
.note-ed .chip{user-select:none}
.note-title{font:500 17px var(--sans);width:100%;padding:2px 0;border-bottom:1px solid transparent}
.note-title:focus{border-bottom-color:var(--hair2);outline:0}
.stepper .row{grid-template-columns:26px 1fr 110px 60px;cursor:default}
.stepper .row:hover{background:transparent}
.stepper .n{font:500 11px var(--mono);color:var(--faint)}
.plan{background:var(--bg);border:1px solid var(--hair);border-radius:2px;padding:8px 10px;font:400 12px/1.6 var(--mono);color:var(--muted);white-space:pre-wrap}
.plan b{color:var(--text);font-weight:500}
.checks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---- global views ---- */
.view{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.view>*{min-width:0}
.view-b{overflow:auto;min-height:0}
.view .room-bar h1{font-size:22px}
.filters{display:flex;gap:4px;align-items:center;margin-left:14px}
.inbox-item{display:grid;grid-template-columns:34px 76px 1fr auto;gap:10px;align-items:start;padding:8px 14px 8px 10px;border-bottom:1px solid var(--hair);font-size:12.5px}
.inbox-item:hover{background:var(--panel)}
.inbox-item.dim{opacity:.55}
.inbox-item .when{font:400 11px/20px var(--mono);color:var(--muted)}
.inbox-item .txt{line-height:20px}
.inbox-item .txt i{font-style:normal;color:var(--muted)}
.inbox-item .txt b{font-weight:500;color:var(--fail)}
.inbox-item .ctxk{font:400 10px var(--mono);color:var(--faint);margin-top:2px}
.inbox-item .acts{display:flex;gap:4px}
.inbox-item .reply{grid-column:3/5;display:flex;gap:6px;margin-top:6px}
.inbox-item .reply .inp{flex:1}

.src{display:grid;grid-template-columns:34px 186px 1fr 200px 224px 152px;gap:12px;align-items:start;padding:10px 14px 10px 10px;min-height:46px;border-bottom:1px solid var(--hair);font-size:12px}
.src .nm{font-weight:500;display:block}
.src .st{display:block}
.src>span{min-width:0}
.src .sub{display:block;font:400 10.5px var(--mono);color:var(--faint)}
.src .url{font:400 11px var(--mono);color:var(--muted)}
.src .caps{display:flex;gap:3px;margin-top:2px}
.src .caps span{font:400 9.5px var(--mono);color:var(--faint);border:1px solid var(--hair);padding:0 4px;border-radius:2px;text-transform:uppercase;letter-spacing:.05em}
.src .st{font:400 11.5px var(--mono)}
.src.err{background:rgba(255,106,92,.04)}
.src-fix{display:flex;gap:6px;align-items:center;padding:6px 14px 10px 54px;border-bottom:1px solid var(--hair);background:rgba(255,106,92,.04)}
.src-fix .inp{width:220px}
.dbbar{display:flex;gap:22px;padding:10px 14px;font:400 11.5px var(--mono);color:var(--muted);border-bottom:1px solid var(--hair)}
.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mod{text-align:left;padding:8px 10px;border:1px solid var(--hair2);border-radius:2px;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center}
.mod:hover{background:var(--raised)}
.mod.on{border-color:var(--text)}
.mod .nm{font-weight:500;font-size:12px;display:block}
.mod .sub{font:400 10px var(--mono);color:var(--faint);display:block}
.steps{display:flex;gap:14px;margin-bottom:12px}
.steps span{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.steps span.on{color:var(--text)}
.steps span.done{color:var(--muted)}
.radios{display:grid;gap:4px}
.radios label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--hair);border-radius:2px;cursor:pointer;font-size:12px}
.radios label.off{opacity:.45;cursor:default}
.radios input{accent-color:var(--text)}
.test-res{font:400 12px var(--mono);padding:8px 10px;background:var(--bg);border:1px solid var(--hair);border-radius:2px;margin-top:8px}

/* time view */
.strip{position:relative;height:64px;margin:14px 14px 4px;border:1px solid var(--hair);border-radius:2px;background:var(--bg)}
.blk{position:absolute;top:8px;bottom:8px;border-radius:2px;padding:4px 6px;font:400 11px/1.3 var(--mono);overflow:hidden;cursor:pointer;border:1px solid transparent;color:var(--text)}
.blk:hover{filter:brightness(1.15)}
.blk .l{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.passive{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.06) 4px 5px)}
.blk.manual{border-left:3px solid var(--text)}
.blk.unat{background:transparent;border:1px dashed var(--amber);color:var(--amber)}
.blk.unat .l{color:var(--amber)}
.blk.gap{background:transparent;border:0;cursor:default;color:var(--faint)}
.blk.gap:hover{filter:none}
.blk.sel{outline:1px solid var(--link)}
.axis{position:relative;height:16px;margin:0 14px 10px;font:400 10px var(--mono);color:var(--faint)}
.axis span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:16px;padding:0 14px 8px;font:400 11px var(--mono);color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.blkdet{margin:0 14px 14px;border:1px solid var(--hair);border-radius:2px;background:var(--panel);padding:10px 12px;display:flex;gap:14px;align-items:center;font-size:12px}
.blkdet .acts{margin-left:auto;display:flex;gap:4px}
.sheet{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 14px}
.sheet th{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:right;padding:6px 14px;border-bottom:1px solid var(--hair)}
.sheet th:first-child,.sheet td:first-child{text-align:left}
.sheet td{padding:0 14px;height:30px;border-bottom:1px solid var(--hair);text-align:right;font-family:var(--mono)}
.sheet tr.tot td{font-weight:500;border-top:1px solid var(--hair2)}
.sheet td .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:0}

/* standup */
.su{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);height:100%;min-height:0}
.su>div{background:var(--bg);overflow:auto;min-height:0}
.dg-ctx{padding:8px 14px 4px;border-bottom:1px solid var(--hair)}
.dg-ctx .lab{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.dg-line{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:start;padding:4px 0;font-size:12.5px}
.dg-line .w{font:500 10px/18px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.dg-line .w.b{color:var(--fail)}
.dg-line .trace{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.proto{padding:12px 14px}
.proto h3{font:600 16px var(--disp);margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.proto h3 .k{font:400 11px var(--mono);color:var(--faint)}
.proto .ed{outline:0;border:1px solid transparent;border-radius:2px;padding:4px 6px;margin:0 -6px;font-size:12.5px;line-height:1.55}
.proto .ed:focus{border-color:var(--hair2);background:var(--panel)}
.proto .ai{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px}
.proto .ai .ed{flex:1}
.pub{display:flex;gap:8px;align-items:center;padding:10px 0 0;font-size:12px;flex-wrap:wrap}
.pub .k{color:var(--muted);font-size:11px}
.tip{position:fixed;z-index:60;background:var(--raised);border:1px solid var(--hair2);border-radius:2px;padding:6px 8px;font:400 11px/1.4 var(--mono);color:var(--muted);max-width:320px;pointer-events:none}

/* ---- overlays ---- */
#layer:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(21,23,26,.72);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding-top:80px}
.scrim.center{align-items:center;padding-top:0}
.dlg{background:var(--panel);border:1px solid var(--hair2);border-radius:2px;width:560px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;animation:fade .12s}
.dlg.wide{width:820px}
.dlg-h{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 14px;border-bottom:1px solid var(--hair);flex:none}
.dlg-h h2{font:600 16px var(--disp);letter-spacing:.01em}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:14px;overflow:auto}
.dlg-f{display:flex;gap:6px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--hair);flex:none;align-items:center}
.dlg-f .l{margin-right:auto;font:400 11px var(--mono);color:var(--faint);white-space:nowrap}
.form{display:grid;grid-template-columns:140px 1fr;gap:10px 12px;align-items:center}
.form .l{font:400 11px var(--mono);color:var(--muted)}
.form .chk{display:flex;gap:8px;align-items:center;font-size:12px}
.form .chk input{accent-color:var(--text)}
.x{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:2px;color:var(--muted)}
.x:hover{background:var(--raised);color:var(--text)}
.x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}

/* search — the launcher box (P1) living in the ⌘K overlay */
.search{width:960px;max-width:94vw;height:588px;max-height:84vh}
.search .q{display:flex;align-items:center;gap:9px;height:48px;padding:0 12px 0 0;border-bottom:1px solid var(--hair)}
.search .q .caret{width:3px;height:26px;background:var(--amber);flex:none}
.search .q .chain{display:flex;gap:4px;align-items:center;flex:none;max-width:46%;overflow:hidden}
.crumb-chip{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 7px;border:1px solid var(--hair2);border-radius:2px;background:var(--raised);font:500 12px var(--mono);color:var(--text);white-space:nowrap}
.crumb-chip::after{content:"›";color:var(--faint);font-family:var(--sans)}
.search .q input{flex:1;min-width:120px;height:100%;font:400 15px var(--sans);color:var(--text);background:transparent}
.search .q input::placeholder{color:var(--faint)}
.search .q .k{white-space:nowrap}
kbd{font:400 10px var(--mono);color:var(--faint);border:1px solid var(--hair);border-radius:2px;padding:1px 4px;white-space:nowrap}
.search-b{display:grid;grid-template-columns:236px 1fr;flex:1;min-height:0}
.search-b>*{min-width:0}
.search-f{display:flex;align-items:center;gap:14px;height:26px;padding:0 12px;border-top:1px solid var(--hair);background:var(--panel);font:400 11px var(--mono);color:var(--faint);flex:none;overflow:hidden;white-space:nowrap}
.search-f .sp{flex:1}
.search-f b{color:var(--muted);font-weight:500}
.smart{border-right:1px solid var(--hair);overflow:auto;padding:8px 0}
.smart .lab{padding:6px 12px}
.sl{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start;width:100%;text-align:left;padding:7px 12px;min-height:30px;font-size:12px;cursor:pointer}
.sl:hover{background:var(--raised)}
.sl.on{background:var(--raised)}
.sl .c{font:500 11px var(--mono);color:var(--muted)}
.sl .c.chg{color:var(--amber)}
.sl small{display:block;font:400 10px/1.35 var(--mono);color:var(--faint);margin-top:2px}
.prefixes{display:grid;gap:1px;padding:0 8px}
.pfx{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;width:100%;text-align:left;padding:4px;border-radius:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
.pfx:hover{background:var(--raised);color:var(--text)}
.pfx .k{font:500 11px var(--mono);color:var(--link);text-align:center;border:1px solid var(--hair);border-radius:2px;padding:1px 0}
.chain-card{margin:0 12px;padding:9px 10px;border:1px solid var(--hair);border-radius:2px;background:var(--bg)}
.chain-card .ct{display:flex;gap:7px;align-items:center;margin-bottom:4px}
.chain-card .ct .k{font:500 13px var(--mono)}
.chain-card .nm{font-size:12.5px;line-height:1.4;margin-bottom:8px}
.chain-card .kv{grid-template-columns:74px 1fr;row-gap:3px;font-size:11.5px}
.chain-steps{padding:0 12px;display:grid;gap:2px}
.chain-steps .step{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center;font:500 12px var(--mono);height:24px}
.chain-steps .step .n{font:400 10px var(--mono);color:var(--faint);text-align:center;border:1px solid var(--hair);border-radius:2px;line-height:14px}
.chain-steps .step.faint{color:var(--faint);font-weight:400}
.pfx-note{padding:12px;font-size:11.5px;line-height:1.5;color:var(--faint)}
.pfx-note b{color:var(--muted)}
.results{display:flex;flex-direction:column;min-height:0}
.fbar{display:flex;gap:2px;row-gap:5px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.fbar .sep{flex:none;width:1px;height:14px;background:var(--hair2);margin:0 3px}
.fchip{flex:none;white-space:nowrap;font:400 11px var(--mono);color:var(--muted);border:1px solid var(--hair);border-radius:2px;padding:2px 5px;background:transparent;cursor:pointer}
.fchip:hover{color:var(--text);border-color:var(--hair2)}
.fchip.on{color:var(--text);border-color:var(--muted);background:var(--raised)}
.fchip.cross{border-style:dashed}
.fchip.cross.on{color:var(--amber);border-color:var(--amber)}
.fchip.clr{color:var(--faint);border-color:transparent}
.rlist{overflow:auto;flex:1}
.secl{display:flex;align-items:center;gap:8px;height:24px;padding:0 12px 0 8px;border-bottom:1px solid var(--hair);background:var(--panel);position:sticky;top:0;z-index:1}
.secl .n{margin-left:auto;font:400 11px var(--mono);color:var(--faint)}
.res{display:grid;grid-template-columns:28px 50px minmax(0,1fr) 108px 134px 98px;gap:8px;align-items:center;height:32px;padding:0 12px 0 8px;border-bottom:1px solid var(--hair);font-size:12px;cursor:pointer}
.res:hover,.res.on{background:var(--raised)}
.res.on{box-shadow:inset 2px 0 0 var(--amber)}
.res>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .mg.none{border-color:transparent}
.res .ty{font:400 10px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.res .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t .k{color:var(--muted);margin-right:6px;font-family:var(--mono);font-size:11.5px}
.res .stt{text-align:right;display:flex;justify-content:flex-end;overflow:hidden}
.res .st{font:400 11px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.res .sy{font:400 10px var(--mono);color:var(--faint);text-align:right}
.res .acts{display:flex;gap:3px;justify-content:flex-end;visibility:hidden}
.res:hover .acts,.res.on .acts{visibility:visible}
.res.wide{grid-template-columns:28px 50px minmax(0,1fr) 98px}
.res .rsub{margin-left:14px}
.res .rsub .st{color:var(--faint)}
.res.info{grid-template-columns:minmax(0,1fr);cursor:default;color:var(--muted);height:auto;min-height:32px;padding:8px 14px;white-space:normal;line-height:1.5}
.res.info:hover{background:transparent}
.res.info .t{white-space:normal;line-height:1.45}
.res .join{font:400 10.5px var(--mono);color:var(--amber)}
.res.info .k{font-family:var(--mono);color:var(--muted)}
/* top-strip launcher field — same box, opened with ⌘K */
.searchfield{display:flex;align-items:center;gap:8px;height:28px;padding:0 5px 0 8px;border:1px solid var(--hair2);border-radius:2px;background:var(--bg);color:var(--faint);flex:1 1 90px;min-width:86px;max-width:320px;overflow:hidden;margin:0 2px}
.searchfield:hover{border-color:var(--muted);color:var(--muted)}
.searchfield svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;flex:none}
.searchfield .ph{flex:1;text-align:left;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* popover */
.pop{position:fixed;z-index:45;background:var(--panel);border:1px solid var(--hair2);border-radius:2px;min-width:260px;padding:6px;animation:fade .12s}
.pop .it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:0 8px;height:30px;font-size:12px;border-radius:2px;cursor:pointer}
.pop .it:hover{background:var(--raised)}
.pop .it.on{background:var(--raised)}
.pop .it .k{color:var(--muted);font-size:11px}
.pop .it small{display:block;font:400 10.5px var(--mono);color:var(--faint)}
.pop .hr{height:1px;background:var(--hair);margin:6px 0}
.pop .lab{padding:6px 8px 4px}
.pop .head{padding:6px 8px 8px;font-size:12px;display:flex;gap:10px;align-items:center}
.pop .acts{display:flex;gap:4px;padding:4px 6px 2px;flex-wrap:wrap}
.pop .inrow{display:flex;gap:4px;padding:4px 6px}

/* toasts */
#toasts{position:fixed;right:14px;bottom:34px;z-index:70;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--raised);border:1px solid var(--hair2);border-radius:2px;padding:8px 10px;font-size:12px;display:flex;gap:10px;align-items:center;max-width:520px;animation:fade .12s}
.toast .k{font-size:11px;color:var(--muted)}
.toast.err{border-color:var(--fail)}

.statusbar{display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--hair);background:var(--panel);font:400 11px var(--mono);color:var(--faint);overflow:hidden;white-space:nowrap}
.statusbar .spacer{flex:1}
.statusbar .pend.on{color:var(--amber)}
#errlog{position:fixed;left:8px;bottom:30px;z-index:99;background:var(--fail);color:#000;padding:4px 8px;font:11px var(--mono)}

.card .s{display:block}
.focus .side{display:grid;gap:6px;justify-items:end}
.wl{display:grid;gap:5px}
.wl label{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:start;padding:5px 8px;border:1px solid var(--hair);border-radius:2px;cursor:pointer;font-size:12px;line-height:1.4}
.wl input{accent-color:var(--amber);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bl-list{display:grid;gap:2px}

/* ======================================================================
   ASSETS — W1 Inventory: rail + typed board + slide-over
   ====================================================================== */
.ainv{display:grid;grid-template-columns:184px 1fr;height:100%;min-height:0}
.ainv>*{min-width:0}
.arail{border-right:1px solid var(--hair);background:var(--panel);overflow:auto;padding:6px 0 20px}
.arail .lab{display:block;padding:8px 10px 4px}
.arail-i{display:grid;grid-template-columns:14px 1fr auto;gap:7px;align-items:center;width:100%;text-align:left;height:26px;padding:0 10px;font-size:12px;color:var(--muted);cursor:pointer;border-left:2px solid transparent}
.arail-i:hover{background:var(--raised);color:var(--text)}
.arail-i.on{color:var(--text);background:var(--raised);border-left-color:var(--text)}
.arail-i .mg{width:20px;height:14px;font-size:9px}
.arail-i .n{font:500 11px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.arail-i.on .n{color:var(--text)}
.arail-i .warn{color:var(--amber)}
.arail-i .bad{color:var(--fail)}
.arail-i.sm{grid-template-columns:1fr auto;height:24px;font-size:11.5px}
.arail-i.sm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arail hr{border:0;border-top:1px solid var(--hair);margin:8px 0}
.arail .note{padding:2px 10px 6px;font:400 10.5px/1.45 var(--mono);color:var(--faint)}

.apane{display:flex;flex-direction:column;min-height:0;min-width:0}
.atool{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-bottom:1px solid var(--hair);flex:none;overflow:hidden}
.atool .grp{display:flex;gap:0;border:1px solid var(--hair2);border-radius:2px;overflow:hidden;flex:none}
.atool .grp button{height:22px;padding:0 9px;font:500 11px var(--mono);color:var(--muted)}
.atool .grp button.on{background:var(--raised);color:var(--text)}
.atool .grp button:hover{color:var(--text)}
.atool .sel-inline{height:22px;max-width:132px}
.atool .cnt{font:400 11px var(--mono);color:var(--faint);white-space:nowrap}
.atool .acts{margin-left:auto;display:flex;gap:5px;flex:none}
.alist{overflow:auto;flex:1;min-height:0}
.asec{--tpl:34px 1fr 100px 80px}
.asec-h{display:flex;align-items:center;gap:8px;height:24px;padding:0 12px 0 10px;background:var(--panel);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:3}
.asec-h .n{font:500 11px var(--mono);color:var(--faint)}
.asec-h .rd{margin-left:auto;font:400 11px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asec-h .rd b{font-weight:500;color:var(--text)}
.arow{display:grid;grid-template-columns:var(--tpl);align-items:center;column-gap:8px;width:100%;text-align:left;height:30px;padding:0 12px 0 10px;border-bottom:1px solid var(--hair);font-size:12px;color:var(--text);cursor:pointer;border-left:2px solid transparent}
.arow>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow:hover{background:var(--panel)}
.arow.sel{background:var(--raised);border-left-color:var(--text)}
.arow.hl{background:var(--raised);border-left-color:var(--amber)}
.arow.drop{border-left-color:var(--amber);background:var(--raised);box-shadow:inset 0 -1px 0 var(--amber)}
.arow.dragging{opacity:.45}
.arow .k,.arow .d{font-family:var(--mono);font-size:11.5px}
.arow .d{color:var(--muted)}
.arow .nm{font-size:12px;display:flex;align-items:center;gap:6px}
.arow .nm .tree{color:var(--faint);font-family:var(--mono);flex:none}
.arow .nm .mg{flex:none}
.arow .nm b{font-weight:500;flex:0 0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.arow .nm .sub{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.arow .sub{color:var(--faint);font-family:var(--mono);font-size:10.5px}
.arow .env{font:400 11px var(--mono);color:var(--muted)}
.arow.hd{height:22px;cursor:default;position:sticky;top:24px;z-index:2;background:var(--bg);border-bottom:1px solid var(--hair)}
.arow.hd:hover{background:var(--bg)}
.arow.hd>span{font:500 10px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.arow.hd button{font:500 10px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow.hd button:hover{color:var(--text)}
.arow.hd button.srt{color:var(--text)}
.acb{width:13px;height:13px;border:1px solid var(--hair2);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:var(--bg);flex:none}
.acb.on{background:var(--text);border-color:var(--text)}
.acb svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.2;fill:none}
.hdot{font-size:10px;line-height:1;flex:none}
.hcell{display:flex;align-items:center;gap:5px;overflow:visible}
.mgc{display:flex;gap:3px;align-items:center;overflow:hidden}
.mgc .mg{cursor:pointer}
.mgc .mg:hover{border-color:var(--amber);color:var(--amber)}
.mgc .sp{width:1px;height:11px;background:var(--hair2);flex:none;margin:0 1px}

function ent(t,id){
  switch(t){
    case 'ticket':{const k=D.tickets[id];return k?{t,id,mg:'JI',label:id,title:k.summary,hash:'#/ticket/'+id,type:k.type.toLowerCase()}:null}
    case 'pr':{const p=D.prs[id];return p?{t,id,mg:'GT',label:'PR #'+id,title:p.title,hash:'#/pr/'+id,type:'pr'}:null}
    case 'build':{const b=D.builds[id];return b?{t,id,mg:'TC',label:'#'+id,title:b.cfg,hash:'#/build/'+id,type:'build'}:null}
    case 'page':{const p=D.pages[id];return p?{t,id,mg:'CF',label:p.title,title:'',hash:'#/page/'+id,type:'page'}:null}
    case 'note':{const n=D.notes[id];return n?{t,id,mg:'NT',label:n.title,title:'',hash:'#/note/'+id,type:'note'}:null}
    case 'commit':{const c=D.commits.find(c=>c.sha===id);return c?{t,id,mg:'GT',label:id,title:c.msg,hash:'#/commit/'+id,type:'commit'}:null}
    case 'branch':return {t,id,mg:'GT',label:id,title:'',hash:null,type:'branch'};
    case 'repo':return {t,id,mg:'GT',label:'repo '+id,title:'',hash:null,type:'repo'};
    case 'ctx':return {t,id,mg:'NT',label:ctxTitle(id),title:'',hash:'#/ctx/'+id,type:'context'};
    case 'asset':{const a=A[id];return a?{t,id,mg:AT[a.type].mg,label:a.name,title:AT[a.type].l+' · '+a.env,hash:'#/asset/'+id,type:AT[a.type].l.toLowerCase()}:null}
  }
  return null;
}
function resolveRef(r){
  if(/^(PAY|OPS)-\d+$/.test(r)) return ent('ticket',r);
  if(/^PR #\d+$/.test(r)) return ent('pr',r.slice(4));
  if(/^#\d+$/.test(r)) return ent('build',r.slice(1));
  for(const [id,p] of Object.entries(D.pages)) if(p.title===r) return ent('page',id);
  for(const [id,n] of Object.entries(D.notes)) if(n.title===r) return ent('note',id);
  return {t:'label',id:r,mg:'NT',label:r,hash:null};
}

/* ---- flap registry: cells render the previous value, then flip to the new one ---- */
const FL={};
function flap(id,val,cls='',extra=''){
  const shown=(id in FL)?FL[id]:val; if(!(id in FL)) FL[id]=val;
  return `<span class="flap ${cls}" data-flap="${esc(id)}" data-val="${esc(val)}" ${extra}><span class="ft">${esc(shown)}</span><span class="fb">${esc(shown)}</span></span>`;
}
function flipEl(el,val){
  const ft=$('.ft',el), fb=$('.fb',el); const old=ft.textContent; if(old===val) return;
  if(REDUCED){ft.textContent=fb.textContent=val;return}
  $$('.leaf',el).forEach(l=>l.remove());
  const lt=document.createElement('span');lt.className='leaf top';lt.textContent=old;
  const lb=document.createElement('span');lb.className='leaf bot';lb.textContent=val;
  ft.textContent=val; el.append(lt,lb);
  setTimeout(()=>{fb.textContent=val;lt.remove();lb.remove()},360);
}
function settleFlaps(){
  const todo=[]; $$('[data-flap]').forEach(el=>{const id=el.dataset.flap,val=el.dataset.val; if(FL[id]!==val) todo.push([el,id,val]);});
  todo.forEach(([el,,val])=>flipEl(el,val)); todo.forEach(([,id,val])=>FL[id]=val);
}

function go(h){ if(location.hash===h) route(); else location.hash=h; }
function route(){
  const h=(location.hash||'#/ctx/PAY-200').slice(2), p=h.split('/');

    case 'ctx': if(CTX[p[1]]) S.ctx=p[1]; S.view='room'; S.detail=null; break;
    case 'inbox': case 'sources': case 'time': case 'standup': S.view=p[0]; S.detail=null; break;
    case 'assets': S.view='assets'; S.detail=null; break;
    /* an asset opens as a slide-over — over the board if you came from it, over the room otherwise */
    case 'asset': if(S.view!=='assets'&&S.view!=='room') S.view='assets'; S.detail={t:'asset',id:decodeURIComponent(p[1])}; break;
    case 'ticket': case 'pr': case 'build': case 'page': case 'note': case 'commit': S.view='room'; S.detail={t:p[0],id:decodeURIComponent(p[1])}; break;

function backlinks(t,id){
  const out=[];
  for(const k in D.tickets) if((D.tickets[k].links||[]).some(l=>l[0]===t&&String(l[1])===String(id))) out.push(ent('ticket',k));
  for(const nid in D.notes){
    if(t==='note'&&nid===id) continue;
    const refs=(D.notes[nid].body.match(/\[\[([^\]]+)\]\]/g)||[]).map(s=>s.slice(2,-2));
    if(refs.some(r=>{const e=resolveRef(r);return e&&e.t===t&&String(e.id)===String(id)})) out.push(ent('note',nid));
  }
  for(const c in CTX) if(ROOM[c]&&(ROOM[c][BUCKET[t]]||[]).some(x=>Array.isArray(x)?String(x[1])===String(id):String(x)===String(id))) out.push(ent('ctx',c));
  return out;
}

function monBlock(id){

  }
  const worst=ms.slice().sort((x,y)=>({down:0,warn:1,paused:2,up:3})[ahealth(x)]-({down:0,warn:1,paused:2,up:3})[ahealth(y)])[0];
  const m=A[worst], checks=checksOf(worst);

          ${propRow('response',`<span class="${mm.state==='warn'?'amber':''}">${esc(mm.resp)}</span>${mm.threshold?`<span class="faint">threshold ${esc(mm.threshold)}</span>`:''}`)}
          ${propRow('uptime 30 d',esc(mm.p.uptime30)+' · check every '+esc(mm.p.interval))}
        </div>
        <div class="seg" aria-label="Last 24 hours in 48 segments">${[...s].map(c=>`<i class="${c==='u'?'':c}"></i>`).join('')}</div>
        <div class="segax"><span>24 h ago</span><span>1 440 checks · 48 segments</span><span>now 14:32</span></div>
        <div class="checks" style="margin-top:8px">
          <button class="btn sm ghost" data-act="mon-pause" data-id="${mid}">${S.paused.has(mid)?'Resume monitor':'Pause monitor'}</button>
          <button class="btn sm ghost" data-act="status-page">Status page</button></div>
      </div>`;}).join('')}
    <div class="lab" style="margin:12px 0 4px">Last 5 checks · ${esc(m.name)}</div>
    ${checks.map(c=>`<div class="chk5"><span>${esc(c[0])}</span><span class="${c[1]==='down'?'fail':c[1]==='warn'?'amber':''}">${esc(c[2])}</span><span class="faint">${esc(c[1])}</span></div>`).join('')}
    ${hostedBlock}
    ${al.length?`<div class="lab" style="margin:12px 0 6px">Alerts · ${al.filter(x=>!x.acked&&!x.snoozed).length} open</div>${al.map(x=>alertCard(x)).join('')}`:''}
  </div>`;

function checksOf(id){
  const m=A[id]; if(m.checks) return m.checks;
  const n=nowMin(), num=parseFloat(String(m.resp).replace(/[^\d.]/g,'')), unit=String(m.resp).replace(/[\d.,\s]/g,'');
  if(!num) return [[nowStr(),'up',m.resp]];
  return [0,1,2,3,4].map(i=>{ const t=n-i, v=num+((i%3)-1)*(num>10?3:0.1);
    return [pad(Math.floor(t/60))+':'+pad(t%60),'up',(num>10?Math.round(v):v.toFixed(1))+' '+unit]; });
}

function restartContainer(id){
  const a=A[id]; if(!a||a.type!=='container') return;
  const was=a.p.state;

  render();
  tick(`<b>${esc(a.name)}</b> restarting on ${esc(A[hostOf(id)]?A[hostOf(id)].name:'its host')}`);
  setTimeout(()=>{
    a.p.state='running · up 0 m';
    if(m){ A[m].state='up'; A[m].resp='—'; delete A[m].downSince; delete A[m].dur; A[m].checks=null; }
    Object.values(AL).forEach(x=>{ if(x.asset===id){ x.acked=true; x.text=x.text+' — recovered'; } });
    D.inbox=D.inbox.filter(x=>x.asset!==id);
    ahist(id,'mara',`restarted the container — <b>${esc(was)}</b> → running`);
    toast(`Restarted <b>${esc(a.name)}</b> on ${esc(A[hostOf(id)].name)}. The monitor is up again.`);
    render();
  },REDUCED?60:900);
}

  p.style.left=Math.max(8,Math.min(r.left,innerWidth-pr.width-10))+'px';

  for(const id in D.builds){const b=D.builds[id];push({e:ent('build',id),txt:`#${id} ${b.cfg} ${b.branch} ${b.status}`,who:b.ticket&&D.tickets[b.ticket]?D.tickets[b.ticket].assignee:null,when:b.when,src:'teamcity',sy:sy('teamcity')});}
  for(const id in D.pages){const p=D.pages[id];push({e:ent('page',id),txt:`${p.title} ${p.body.map(s=>s[0]+' '+s[1]).join(' ')}`,who:p.by,when:p.edited,src:'confluence',sy:sy('confluence')});}
  for(const id in D.notes){const n=D.notes[id];push({e:ent('note',id),txt:`${n.title} ${n.body}`,who:'mara',when:n.edited,src:'note',sy:'local · always current'});}
  /* assets: the typed properties, the custom ones and the health are all searchable */
  for(const id in A){const a=A[id];

/* the cross-source join: a failed build pulls in its ticket and its PR */
function failingSet(){
  const s=new Set();
  for(const bid in D.builds){
    const b=D.builds[bid]; if(b.status!=='failed') continue;
    s.add('build:'+bid);
    if(b.ticket) s.add('ticket:'+b.ticket);
    for(const pid in D.prs) if((D.prs[pid].checks||[]).includes(bid)) s.add('pr:'+pid);
  }
  return s;
}

/* ---------- prefix syntax ---------- */
function parseQuery(q){
  const o={src:null,type:null,person:null,words:[],mode:null,rest:'',atype:null,env:null,health:null};
  let t=(q||'').trim();
  if(!t) return o;
  if(t[0]==='>'){o.mode='actions';o.rest=t.slice(1).trim();return o;}
  if(t[0]==='?'){o.mode='help';return o;}
  if(/^t(\s|$)/i.test(t)){o.mode='time';o.rest=t.slice(1).trim();return o;}
  if(/^note:/i.test(t)){o.mode='notes';o.rest=t.slice(5).trim();return o;}
  if(/^list:/i.test(t)){o.mode='list';o.rest=t.slice(5).trim();return o;}
  /* asset: is a prefix like note: — it pins the search to the inventory */
  if(/^assets?:/i.test(t)){ o.type='asset'; t=t.replace(/^assets?:/i,'').trim(); if(!t) return o; }
  t.split(/\s+/).forEach(w=>{
    if(!w) return;
    const kv=w.match(/^(type|env|health|owner):(.*)$/i);
    if(kv){
      const k=kv[1].toLowerCase(), v=kv[2].toLowerCase();
      if(!v) return;
      o.type='asset';
      if(k==='type'){ o.atype=Object.keys(AT).find(x=>x===v||AT[x].l.toLowerCase().startsWith(v))||v; }
      else if(k==='env') o.env=v;
      else if(k==='health') o.health=v==='warning'?'warn':v;
      else o.person=v.replace('@','');
      return;
    }
    if(w[0]==='/'){ if(w.length>1) o.src=srcKey(w.slice(1).toLowerCase()); return; }
    if(w[0]==='@'){ if(w.length>1) o.person=w.slice(1).toLowerCase(); return; }
    if(w[0]==='#'){ o.type='ticket'; if(w.length>1) o.words.push(w.slice(1).toLowerCase()); return; }
    o.words.push(w.toLowerCase());
  });
  return o;
}

function corpusRows(p){
  const f=S.search, src=p.src||f.src, type=p.type||f.type, fail=failingSet();
  const atype=p.atype||f.atype, env=p.env||f.env, health=p.health||f.health;
  return CORPUS.filter(c=>{
    const txt=c.txt.toLowerCase();
    if(!p.words.every(w=>txt.includes(w))) return false;
    if(src&&c.src!==src) return false;
    if(type&&c.e.t!==type) return false;
    if(atype&&c.atype!==atype) return false;
    if(env&&c.env!==env) return false;
    if(health&&c.health!==health) return false;
    if(p.person){
      const w=(c.who||'').toLowerCase(), nm=(P[c.who]?P[c.who].n:'').toLowerCase();
      if(!(w.startsWith(p.person)||nm.split(' ').some(x=>x.toLowerCase().startsWith(p.person)))) return false;

    if(f.date==='today'&&c.day!=='today') return false;

function linkPair(a,b){

function startTimer(id,label){
  if(S.timer.running) stopTimer(true);
  const c=CTX[id];
  S.timer={running:true,ent:id,label:label||(c?(c.kind==='adhoc'?c.title:c.label):id),startMs:now().getTime()};
  FL.timer='—:——';
  tick(`Timer started on <b>${esc(S.timer.label)}</b>`);
  toast(`Timer running on <b>${esc(S.timer.label)}</b>.`);
}
function stopTimer(silent){
  if(!S.timer.running) return null;
  const st=new Date(S.timer.startMs), s=pad(st.getHours())+':'+pad(st.getMinutes());
  const blk={s,e:nowStr(),ent:S.timer.ent,label:S.timer.label,how:'manual'};
  if(tmin(blk.e)>tmin(blk.s)) D.blocks.push(blk);
  S.timer.running=false;
  tick(`Timer stopped on <b>${esc(S.timer.label)}</b>`);
  if(!silent) toast(`Timer stopped. ${hm(tmin(blk.e)-tmin(blk.s))} on ${esc(S.timer.label)} is tracked but not logged.`);
  return blk;
}
function rerunBuild(id){
  const b=D.builds[id];
  const n=String(S.nextBuild++);
  D.builds[n]={num:+n,cfg:b.cfg,status:'queued',branch:b.branch,when:'today '+nowStr(),ticket:b.ticket,params:Object.assign({},b.params)};
  if(!ROOM[S.ctx].builds.includes(n)) ROOM[S.ctx].builds.unshift(n);
  if(!ROOM['PAY-200'].builds.includes(n)) ROOM['PAY-200'].builds.unshift(n);
  S.pending++; CORPUS=buildCorpus();
  tick(`#${n} ${b.cfg} queued locally`);
  toast(`Queued <b>#${n} ${esc(b.cfg)}</b> on ${esc(b.branch)}. TeamCity is 401 — it goes out when the password is fixed.`,{action:{act:'nav',label:'Fix now',attrs:'data-hash="#/sources"'}});
}
function finishStartWork(){
  const sw=S.startWork, k=sw.key, t=D.tickets[k], n=String(S.nextPr++);
  D.branches.push({name:'feature/PAY-240-payout-dashboard-latency',repo:'payout-service',ahead:0,local:true,ticket:k});
  D.prs[n]={num:+n,title:t.summary,repo:'payout-service',from:'feature/PAY-240-payout-dashboard-latency',to:'main',state:'open',by:'mara',
    opened:'today '+nowStr(),approvals:'0/2',reviewReq:'Jonas · today '+nowStr(),checks:[],ticket:k,comments:[],files:[]};
  t.links.push(['branch','feature/PAY-240-payout-dashboard-latency'],['pr',n]);
  t.status='In Progress'; t.updated='today '+nowStr();
  ROOM['PAY-200'].code.push(['branch','feature/PAY-240-payout-dashboard-latency'],['pr',n]);
  sw.running=false; sw.done=true; CORPUS=buildCorpus();
  if(sw.timer) startTimer(k,k);
  tick(`<b>PAY-240</b> → In Progress · PR #${n} opened`);
  toast(`Started work on PAY-240. PR #${n} is open and linked.`,{action:{act:'open',label:'Open PR #'+n,attrs:`data-hash="#/pr/${n}"`}});
  render();
}
function runStartWork(){
  const sw=S.startWork; if(sw.running||sw.done) return;
  sw.running=true; sw.steps=[]; render();
  const n=sw.timer?6:5, gap=REDUCED?40:400;
  const step=i=>{
    if(i>=n){ finishStartWork(); return; }
    sw.steps[i]='running'; render();
    setTimeout(()=>{ sw.steps[i]='done'; render(); step(i+1); },gap);
  };
  setTimeout(()=>step(0),gap/2);
}
function inboxAct(id,a){
  const i=D.inbox.findIndex(x=>x.id===id); if(i<0) return; const it=D.inbox[i];
  const drop=()=>D.inbox.splice(i,1);
  switch(a){
    case 'Review': go('#/pr/144'); return;
    case 'Open page': go('#/page/sepa'); return;
    case 'Open log': go('#/build/1187'); return;
    case 'Open PR': go('#/pr/142'); return;

    case 'Reply': S.replyOpen=id; render(); setTimeout(()=>{const r=$('#reply-in'); if(r) r.focus();},0); return;
    case 'Open asset': go('#/asset/'+it.asset); return;
    case 'Ack': ackAlert(it.alert); return;

function logMinutes(target,ctxKey,mins,text){
  if(target&&D.tickets[target]) D.tickets[target].worklogs.push({when:'today '+nowStr(),dur:hm(mins),text:text||'Tracked in knobas'});
  Object.keys(CTX).forEach(cid=>{ if(inCtx(target||ctxKey,cid)) S.logged[cid]=(S.logged[cid]||0)+mins; });
  if(!inCtx(target||ctxKey,ctxKey)) S.logged[ctxKey]=(S.logged[ctxKey]||0)+mins;
  S.unloggedWeek=Math.max(0,S.unloggedWeek-mins);
  const wk=D.week.find(w=>w.ent===(target||ctxKey)); if(wk) wk.unlogged=Math.max(0,wk.unlogged-mins);
  if(!target) (S.loggedRows=S.loggedRows||[]).push(['local',{when:'today '+nowStr(),dur:hm(mins),text:text||'Tracked in knobas'}]);
}

function ensureCtx(k){
  if(CTX[k]) return k;
  const t=D.tickets[k]; if(!t) return null;
  CTX[k]={id:k,kind:'ticket',label:k,title:t.summary,members:[k],color:'var(--c-ticket)'};
  ROOM[k]={tickets:[k],code:[],builds:[],pages:[],notes:[],assets:[]};
  (t.links||[]).forEach(([lt,lid])=>{ const b=BUCKET[lt]; if(!b) return; if(b==='code') ROOM[k].code.push([lt,lid]); else ROOM[k][b].push(lid); });
  toast(`<b>${k}</b> is now a context of its own.`);
  return k;
}

  const el=document.createElement('div'); el.className='tip'; el.textContent=t.dataset.tip; document.body.append(el);
  const r=t.getBoundingClientRect(); el.style.left=Math.max(8,Math.min(r.left,innerWidth-el.offsetWidth-10))+'px';
  el.style.top=(r.top-el.offsetHeight-6<8?r.bottom+6:r.top-el.offsetHeight-6)+'px';
  t.addEventListener('mouseleave',()=>el.remove(),{once:true});
});
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(mod&&e.key.toLowerCase()==='t'){ e.preventDefault();
    if(S.timer.running){ const w=S.timer.ent, b=stopTimer(true); render(); if(D.tickets[w]) openWorklog(w); else openLogTo(liveBlocks().length-1); }
    else { startTimer(S.ctx); render(); } return; }
  const box=$('.dlg.search');
  if(e.key==='Escape'){
    /* Esc unwinds one step at a time: chain step → query → box → detail → room */
    if(box){
      if(S.search.chain.length){ S.search.chain.pop(); setQuery(''); return; }
      if(S.search.q){ setQuery(''); return; }
      closeLayer(); return;
    }
    if($('#layer').innerHTML.trim()){ closeLayer(); return; }
    if(S.detail){ go(S.view==='assets'?'#/assets':'#/ctx/'+S.ctx); return; }
    if(S.view!=='room'){ go('#/ctx/'+S.ctx); return; }
    return;
  }
  if(box){
    const rows=S.search.rows||[];
    if(e.key==='ArrowDown'){ e.preventDefault(); S.search.sel=Math.min(rows.length-1,S.search.sel+1); refreshSearch(); focusQ(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); S.search.sel=Math.max(0,S.search.sel-1); refreshSearch(); focusQ(); return; }
    if(e.key==='Enter'){ e.preventDefault(); openRow(S.search.sel); return; }
    if(e.key==='Tab'&&!e.shiftKey){
      const r=rows[S.search.sel];
      if(r&&r.kind==='ent'&&!S.search.chain.length&&ACTS[r.t]){ e.preventDefault(); openChain(r.t,r.id); }
      return;
    }
  }
  /* the board: ↑↓ walks the rows, ↵ opens the one under the cursor */
  if(S.view==='assets'&&!$('#layer').innerHTML.trim()){
    const ae=document.activeElement, typing=ae&&(/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)||ae.isContentEditable);
    if(typing) return;
    const rows=S.assets.rows||[];
    if(e.key==='ArrowDown'){ e.preventDefault(); assetSel(S.assets.sel+1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); assetSel(S.assets.sel-1); return; }
    if(e.key==='Enter'&&rows[S.assets.sel]){ e.preventDefault(); go('#/asset/'+rows[S.assets.sel]); return; }
  }
});

/* ======================================================================
   CLOCK
   ====================================================================== */
setInterval(()=>{
  if(S.timer.running){
    const ms=elapsedMs(), s=$('#tsec');
    if(s) s.textContent=':'+pad(Math.floor(ms/1000)%60);
    const v=mstr(Math.floor(ms/60000)), el=$('[data-flap="timer"]');
    if(el&&FL.timer!==v){ flipEl(el,v); FL.timer=v; }
  }
  const c=$('#clock'); if(c) c.textContent='Fri 2026-08-22 '+nowStr();
},1000);

/* ======================================================================
   BOOT
   ====================================================================== */
renderTicker();
if(!location.hash) { try{ history.replaceState(null,'','#/ctx/PAY-200'); }catch(x){ location.hash='#/ctx/PAY-200'; } }
route();
window.addEventListener('hashchange',route);
} catch(err){
  const e=document.getElementById('errlog');
  if(e){ e.hidden=false; e.textContent='JS error: '+(err&&err.message?err.message:err); }
  if(window.console) console.error(err);
}
window.addEventListener('error',ev=>{
  const e=document.getElementById('errlog');
  if(e){ e.hidden=false; e.textContent='JS error: '+ev.message; }
});
</script>
